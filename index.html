function diagnostico() {
  var criticas = ['contract', 'importer', 'etd', 'eta'];
  var h = '';

  (S.avisos || []).forEach(function (a) {
    h += '<div class="aviso">' + esc(a) + '</div>';
  });

  S.fuentes.forEach(function (src) {
    var faltan = criticas.filter(function (c) { return src.mapa[c] === undefined; });
    if (faltan.length) {
      h += '<div class="aviso">En <b>' + esc(src.tab) + '</b> no encontré: <b>' +
        faltan.map(function (c) { return CAMPOS[c].label; }).join(', ') +
        '</b>. Las alertas que dependen de esas columnas quedan apagadas.</div>';
    }
  });

  // Sin columna de país en la base no hay banderas. Se avisa una vez, con la
  // instrucción concreta, en vez de dejar el dato en silencio.
  if (!S.cfg.paisSheetId) {
    h += '<div class="aviso">Para ver las banderas, cargá en <b>Pestañas</b> la URL de ' +
      'la planilla comercial, donde están las hojas de base de datos con la columna ' +
      '<b>Country</b>.</div>';
  } else if (S.diagPaises && S.diagPaises.error) {
    h += '<div class="aviso">No se pudo leer la planilla de países: ' +
      esc(S.diagPaises.error) + '</div>';
  } else if (S.paises && S.paises.size === 0) {
    h += '<div class="aviso">Se abrió la planilla de países pero no se encontró ninguna ' +
      'empresa con país.' +
      (S.diagPaises && S.diagPaises.hojas.length
        ? ' Hojas leídas: ' + esc(S.diagPaises.hojas.join(' · ')) + '.'
        : '') +
      ' Si las hojas se llaman distinto, se pueden fijar a mano en Pestañas.</div>';
  } else if (S.sinPais && (S.sinPais.clientes.length || S.sinPais.proveedores.length)) {
    var faltanP = [];
    if (S.sinPais.proveedores.length) faltanP.push(S.sinPais.proveedores.length + ' proveedores');
    if (S.sinPais.clientes.length) faltanP.push(S.sinPais.clientes.length + ' clientes');
    h += '<details class="diag" style="margin:14px 0 0;padding-top:0;border:none">' +
      '<summary>' + faltanP.join(' y ') + ' sin país en la base' +
      ' · ' + (S.paises ? S.paises.size : 0) + ' con país' +
      '</summary><p style="margin:8px 0 0">' +
      (S.diagPaises ? esc(S.diagPaises.hojas.join(' · ')) + '. ' : '') +
      esc(S.sinPais.proveedores.slice(0, 12).concat(S.sinPais.clientes.slice(0, 12)).join(', ')) +
      (S.sinPais.clientes.length + S.sinPais.proveedores.length > 24 ? '…' : '') +
      '</p></details>';
  }

  // Si se agregaron las columnas de firma pero la app no las ve, conviene
  // decirlo: suelen estar en la pestaña editable, no en la de lectura.
  if ((S.cfg.tabsCtrEdit || []).length && !hayColumnasFirma()) {
    h += '<div class="aviso">No encontré columnas de firma. Si las agregaste, tienen ' +
      'que estar en alguna de las pestañas <b>editables</b> (' +
      esc((S.cfg.tabsCtrEdit || []).join(', ')) + ') y llamarse <b>Firmado Exportador</b> ' +
      'y <b>Firmado Importador</b>. Si la pestaña de lectura es un IMPORTRANGE, ahí no ' +
      'aparecen y está bien.</div>';
  } else if ((S.cfg.tabsCtr || []).length && !(S.cfg.tabsCtrEdit || []).length) {
    h += '<div class="aviso">Para ver y marcar las firmas hay que elegir en ' +
      '<b>Configuración</b> las pestañas de contratos <b>editables</b> ' +
      '(por ejemplo «Contratos Abiertos»).</div>';
  }

  if (S.advicesViejos) {
    h += '<div class="aviso">Hay ' + S.advicesViejos + ' registro' +
      (S.advicesViejos > 1 ? 's' : '') + ' en <b>Advices enviados</b> del formato ' +
      'anterior, que solo guardaba el número de fila. Como las filas se reordenan ' +
      'por ETA, esos números ya no identifican al embarque y no se pueden marcar. ' +
      'Para recuperarlos, completá la columna <b>BLs</b> de esas filas con el BL ' +
      'del embarque y apretá Actualizar.</div>';
  }

  if ((S.cfg.tabsCtr || []).length && S.contratos.size === 0) {
    h += '<div class="aviso">No se cargó ningún contrato, así que no hay condiciones de pago ' +
      'y las alertas de cobro están apagadas.</div>';
  }

  h += '<details class="diag"><summary>' + S.datos.filas.length + ' embarques de ' +
    S.fuentes.length + (S.fuentes.length === 1 ? ' pestaña' : ' pestañas') +
    ' · ' + S.contratos.size + ' contratos</summary>';

  S.fuentes.forEach(function (src) {
    var na = Object.keys(src.noAplica);
    h += '<p style="margin:8px 0 0"><b>' + esc(src.tab) + '</b> · ' +
      src.filas.length + ' filas · ' + Object.keys(src.mapa).length + ' columnas reconocidas' +
      (na.length ? '<br>Vacías en toda la pestaña, no se exigen: ' +
        na.map(function (c) { return esc(CAMPOS[c].label); }).join(', ') : '') +
      (src.extras.length ? '<br>Ignora: ' +
        src.extras.map(function (e) { return esc(e.h); }).join(', ') : '') + '</p>';
  });

  return h + '</details>';
}

// Un estado nunca se comunica solo con color: siempre color + palabra.
function pill(campo, estado) {
  var cls = { ok:'ok', pendiente:'pend', atencion:'sol', vacio:'hueco' }[estado || 'vacio'];
  return '<span class="pill ' + cls + '"><span class="pt"></span>' +
    CAMPOS[campo].label + ': ' + etiqueta(campo, estado) + '</span>';
}

function pasosEtapa(idEtapa) {
  var i = ETAPAS.map(function (e) { return e.id; }).indexOf(idEtapa);
  var et = ETAPAS[i];
  return '<span class="etapa"><span class="pasos">' +
    ETAPAS.map(function (_, j) { return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('') +
    '</span>' + (et ? et.label : '') + '</span>';
}

// Línea de tiempo: salida a la izquierda, llegada a la derecha, y el punto
// donde estaría hoy. Las fechas van rotuladas y separadas de la línea, que es
// lo que antes se veía amontonado.
function barraRuta(emb) {
  var hoy = new Date();
  var pct = null;
  if (esFecha(emb.etd) && esFecha(emb.eta) && emb.eta > emb.etd) {
    pct = Math.max(0, Math.min(1, (hoy - emb.etd) / (emb.eta - emb.etd)));
  }
  var llego = pct !== null && pct >= 1;

  return '<div class="linea-t">' +
    '<div class="lt-via">' +
      '<span class="lt-punto ini"></span>' +
      '<span class="lt-riel">' +
        (pct !== null
          ? '<i style="width:' + Math.round(pct * 100) + '%"></i>' +
            (llego ? '' : '<b style="left:' + Math.round(pct * 100) + '%"></b>')
          : '') +
      '</span>' +
      '<span class="lt-punto fin' + (llego ? ' on' : '') + '"></span>' +
    '</div>' +
    '<div class="lt-datos">' +
      '<div class="lt-lado">' +
        '<span class="lt-rot">Salida</span>' +
        '<span class="lt-fecha' + (emb.etd && emb.etd.anioAsumido ? ' asumida' : '') + '">' +
          (esFecha(emb.etd) ? fmtFecha(emb.etd) : '—') + '</span>' +
      '</div>' +
      '<div class="lt-lado der">' +
        '<span class="lt-rot">' + esc(emb.port || 'Llegada') + '</span>' +
        '<span class="lt-fecha' + (emb.eta && emb.eta.anioAsumido ? ' asumida' : '') + '"' +
          (emb.eta && emb.eta.anioAsumido
            ? ' title="Sin año en la planilla, se asume ' + emb.eta.getUTCFullYear() + '"' : '') +
          '>' + (esFecha(emb.eta) ? fmtFecha(emb.eta) : '—') + '</span>' +
      '</div>' +
    '</div></div>';
}

function vistaControl(evs, cuenta) {
  var orden = { critico: 3, alto: 2, medio: 1 };
  var con = evs.filter(function (x) { return x.ev.alertas.length; })
    .sort(function (a, b) { return (orden[b.ev.nivelMax] || 0) - (orden[a.ev.nivelMax] || 0); });

  function boton(nivel, n, label, cls) {
    return '<button class="' + cls + '" data-act="fnivel" data-n="' + nivel + '" ' +
      'aria-pressed="' + (S.filtroNivel === nivel) + '">' +
      '<span class="n">' + n + '</span><span class="l">' + label + '</span></button>';
  }

  var h = '<div class="tira">' +
    boton('critico', cuenta.critico, 'Acción ahora', 'crit') +
    boton('alto', cuenta.alto, 'Esta semana', 'alt') +
    boton('medio', cuenta.medio, 'Datos incompletos', '') +
    boton('ok', cuenta.ok, 'Al día', 'bien') +
    '</div>';

  if (!evs.length) return h + '<p class="centro">No hay filas con datos en las pestañas elegidas.</p>';

  if (S.filtroNivel === 'ok') {
    var alDia = evs.filter(function (x) { return !x.ev.nivelMax; });
    return h + '<h2 class="gt">Al día · ' + alDia.length + '</h2>' +
      '<div class="lista">' + alDia.map(function (x) { return filaEmbarque(x); }).join('') + '</div>';
  }

  if (!con.length) return h + '<p class="centro">No hay nada pendiente. Todo al día.</p>';

  [['critico', 'Requieren acción ahora'], ['alto', 'Para esta semana'], ['medio', 'Datos incompletos']]
    .forEach(function (g) {
      if (S.filtroNivel && S.filtroNivel !== g[0]) return;
      var items = con.filter(function (x) { return x.ev.nivelMax === g[0]; });
      if (!items.length) return;
      h += '<h2 class="gt">' + g[1] + ' <span>' + items.length + '</span></h2>' +
        '<div class="lista">' +
        items.map(function (x) { return filaEmbarque(x, { alerta: true }); }).join('') +
        '</div>';
    });
  return h;
}

// Una sola tarjeta para las dos vistas. En Control se le antepone la alerta,
// pero los datos del embarque son siempre los mismos: si podés trackearlo en
// una vista, podés trackearlo en la otra.
function filaEmbarque(x, opts) {
  opts = opts || {};
  var emb = x.emb, src = x.src, ev = x.ev;
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });

  // Exportador y comprador, cada uno con su bandera debajo. Se apilan, que es
  // lo que permite que la bandera quede pegada a quien corresponde y no se
  // pierda en una sola línea larga.
  var fExp = bandera(paisDeEmpresa(emb.exporter));
  var fImp = bandera(paisDeEmpresa(emb.importer));
  var partes = (emb.exporter && emb.importer)
    ? '<div class="via-partes">' +
        '<div class="parte"><span class="exp">' + esc(emb.exporter) + '</span>' +
          (fExp ? '<span class="rot-pais">' + fExp + '</span>' : '') + '</div>' +
        '<span class="fl">→</span>' +
        '<div class="parte"><span class="imp">' + esc(emb.importer) + '</span>' +
          (fImp ? '<span class="rot-pais">' + fImp + '</span>' : '') + '</div>' +
      '</div>'
    : '<div class="via-partes"><div class="parte"><span class="imp">' +
        esc(emb.importer || emb.exporter || 'Sin cargar') + '</span>' +
        (fImp || fExp ? '<span class="rot-pais">' + (fImp || fExp) + '</span>' : '') +
      '</div></div>';

  var tns = (emb.tns !== null && emb.tns !== undefined && emb.tns !== '')
    ? Number(emb.tns).toLocaleString('es-AR') + ' tn' : '';
  var sub = [emb.product, emb.tipo, tns].filter(Boolean).join(' · ');

  var refs = [['contract', 'Contrato'], ['invoice', 'Factura'], ['bl', 'BL'],
              ['booking', 'Booking'], ['containers', 'Contenedores']]
    .filter(function (r) { return src.mapa[r[0]] !== undefined && !src.noAplica[r[0]]; })
    .map(function (r) {
      var v = emb[r[0]];
      return '<span class="ref"><em>' + r[1] + '</em>' +
        (v ? '<b>' + esc(v) + '</b>' : '<u>falta</u>') + '</span>';
    }).join('');

  var notas = sems.filter(function (c) { return emb._notas && emb._notas[c]; })
    .map(function (c) {
      var cls = { ok:'ok', pendiente:'pend', atencion:'sol' }[emb[c]] || 'gris';
      return '<p class="nota ' + cls + '"><em>' + CAMPOS[c].label + '</em>' +
        esc(emb._notas[c]) + '</p>';
    }).join('');

  var alerta = '';
  if (opts.alerta && ev.alertas.length) {
    var a = ev.alertas[0], resto = ev.alertas.length - 1;
    alerta = '<div class="aviso-fila ' + a.nivel + '">' +
      '<p class="tit">' + esc(a.titulo) + '</p>' +
      '<p class="det">' + esc(a.detalle) + '</p>' +
      (resto > 0 ? '<p class="mas">+' + resto + (resto > 1 ? ' pendientes más' : ' pendiente más') + '</p>' : '') +
      '</div>';
  }

  // El selector vive en su propia columna, discreto, como en cualquier lista
  // que se puede seleccionar. No compite con los datos.
  var seleccionable = true;
  var marcado = !!(S.marcados && S.marcados[emb._id]);

  return '<article class="emb' + (emb._id === S.sel ? ' sel' : '') +
    (marcado ? ' marcado' : '') +
    (opts.alerta && ev.nivelMax ? ' n-' + ev.nivelMax : '') +
    '" data-act="abrir" data-f="' + esc(emb._id) + '" tabindex="0">' +

    (seleccionable
      ? '<label class="col-check" title="Elegir para el shipment advice">' +
        '<input type="checkbox" data-marcar="' + esc(emb._id) + '"' +
        (marcado ? ' checked' : '') + '>' +
        '<span class="cbx">' + ico('check') + '</span></label>'
      : '') +

    '<div class="emb-cuerpo">' +
    '<div class="fila-top">' +
      '<div class="ident">' +

        '<div class="partes">' + partes + '</div>' +
        (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        (S.fuentes.length > 1 ? '<div class="orig">' + esc(emb._tab) + '</div>' : '') +
      '</div>' +
      '<div class="medio">' + barraRuta(emb) +
        '<div class="et-wrap">' + pasosEtapa(ev.etapa) + '</div></div>' +
      '<div class="estados">' +
        sems.map(function (c) { return pill(c, emb[c]); }).join('') +
        (emb._faltaComprobante
          ? '<span class="pill nar"><span class="pt"></span>Falta comprobante</span>' : '') +
        (emb._aFacturar
          ? '<span class="pill ok"><span class="pt"></span>Cliente pagó</span>' : '') +
        (function () {
          var sg = sugerenciaAdvice(emb, ev);
          if (!sg || sg.nivel === 'falta') return '';
          return '<span class="pill sug" title="' + esc(sg.texto) + '">' +
            ico('mail') + 'Conviene el advice</span>';
        })() +
        ((S.fuentesFact || []).length && !emb._aFacturar && opts.acciones !== false
          ? '<button class="ir-fact" data-act="abrirpasar" data-f="' + esc(emb._id) + '" ' +
            'title="Pasar a ' + esc(S.fuentesFact[0].tab) + '">' + ico('mover') +
            'A facturar</button>'
          : '') +
        (function () {
          var a = adviceDe(emb);
          if (!a) return '';
          var f = fechaAdvice(a);
          return '<span class="pill adv" title="' +
            esc('Generado por ' + (a.quien || 'alguien') + (f ? ' el ' + f : '')) + '">' +
            ico('mail') + 'Advice enviado' + (f ? ' · ' + f : '') + '</span>';
        })() +
        (function () {
          var n = comentariosDe(emb).length;
          return n ? '<span class="pill coment"><span class="pt"></span>' + n +
            (n === 1 ? ' comentario' : ' comentarios') + '</span>' : '';
        })() +
      '</div>' +
    '</div>' +

    alerta +
    (refs ? '<div class="refs">' + refs + '</div>' : '') +
    (notas ? '<div class="notas">' + notas + '</div>' : '') +
    (function () {
      var cs = comentariosDe(emb);
      if (!cs.length) return '';
      var u = cs[cs.length - 1];
      return '<div class="ultimo-com">' +
        '<span class="autor">' + esc(nombreCortoAutor(u.autor)) + '</span>' +
        '<span class="txt">' + esc(u.texto) + '</span>' +
        (cs.length > 1 ? '<span class="mas">+' + (cs.length - 1) + '</span>' : '') +
        '</div>';
    })() +
    '</article>';
}

// juan.perez@empresa.com -> juan.perez
function nombreCortoAutor(a) {
  var t = String(a || '');
  return t.indexOf('@') > 0 ? t.slice(0, t.indexOf('@')) : t;
}


var ORDENES = {
  eta_asc:  { label: 'ETA más próxima',      campo: 'eta', dir: 1 },
  eta_desc: { label: 'ETA más lejana',       campo: 'eta', dir: -1 },
  etd_desc: { label: 'ETD más reciente',     campo: 'etd', dir: -1 },
  etd_asc:  { label: 'ETD más antiguo',      campo: 'etd', dir: 1 },
  urgencia: { label: 'Urgencia',             campo: null },
  cliente:  { label: 'Cliente (A-Z)',        campo: null }
};

function ordenar(filas, clave) {
  // Si se clickeó un encabezado de la planilla, ese orden manda.
  if (S.ordenCol) {
    var campo = S.ordenCol.campo, dir = S.ordenCol.dir;
    return filas.slice().sort(function (a, b) {
      var va = valorOrden(a.emb, campo), vb = valorOrden(b.emb, campo);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'es', { numeric: true }) * dir;
    });
  }

  var o = ORDENES[clave] || ORDENES.eta_asc;
  var copia = filas.slice();

  if (clave === 'urgencia') {
    var pr = { critico: 3, alto: 2, medio: 1 };
    return copia.sort(function (a, b) {
      var d = (pr[b.ev.nivelMax] || 0) - (pr[a.ev.nivelMax] || 0);
      if (d) return d;
      return b.ev.alertas.length - a.ev.alertas.length;
    });
  }
  if (clave === 'cliente') {
    return copia.sort(function (a, b) {
      return String(a.emb.importer || '').localeCompare(String(b.emb.importer || ''), 'es');
    });
  }
  // Las filas sin fecha van siempre al final, ordene como ordene.
  return copia.sort(function (a, b) {
    var fa = a.emb[o.campo], fb = b.emb[o.campo];
    var va = esFecha(fa) ? fa.getTime() : null;
    var vb = esFecha(fb) ? fb.getTime() : null;
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    return (va - vb) * o.dir;
  });
}

function valorOrden(emb, campo) {
  var v = emb[campo];
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v.getTime();
  if (typeof v === 'object' && v.invalida) return null;
  if (SEMAFOROS.indexOf(campo) >= 0) {
    return ['vacio', 'pendiente', 'atencion', 'ok'].indexOf(v);
  }
  return v;
}

// Texto que se ve en una celda, que es contra lo que filtra el usuario.
function textoCelda(emb, campo) {
  if (SEMAFOROS.indexOf(campo) >= 0) {
    var n = (emb._notas && emb._notas[campo]) || '';
    return etiqueta(campo, emb[campo]) + ' ' + n;
  }
  var v = emb[campo];
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return fmtFecha(v);
  if (typeof v === 'object' && v.invalida) return String(v.crudo);
  return String(v);
}

function aplicarFiltros(evs) {
  var q = S.busca.trim().toLowerCase();
  return evs.filter(function (x) {
    var emb = x.emb, src = x.src;

    if (q) {
      var campos = [emb.contract, emb.importer, emb.exporter, emb.bl, emb.booking,
                    emb.invoice, emb.vessel, emb.port, emb.product, emb._tab];
      if (emb._notas) SEMAFOROS.forEach(function (c) { campos.push(emb._notas[c]); });
      if (!campos.some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return false;
    }
    if (S.filtroTab && emb._tab !== S.filtroTab) return false;
    if (S.filtroEtapa && x.ev.etapa !== S.filtroEtapa) return false;

    // Estado de cada semáforo. "na" = la pestaña no lo usa.
    for (var i = 0; i < SEMAFOROS.length; i++) {
      var c = SEMAFOROS[i], want = S.f[c];
      if (!want) continue;
      if (src.mapa[c] === undefined || src.noAplica[c]) return false;
      if ((emb[c] || 'vacio') !== want) return false;
    }
    if (S.f.fact === 'si' && !emb._aFacturar) return false;
    if (S.f.fact === 'no' && emb._aFacturar) return false;
    if (S.f.cbte === 'si' && !emb._faltaComprobante) return false;
    if (S.f.cbte === 'no' && emb._faltaComprobante) return false;

    // Filtros escritos en el encabezado de la vista planilla.
    var claves = Object.keys(S.fCol);
    for (var j = 0; j < claves.length; j++) {
      var cc = claves[j], q2 = String(S.fCol[cc] || '').trim().toLowerCase();
      if (!q2) continue;
      if (src.mapa[cc] === undefined) return false;
      if (textoCelda(emb, cc).toLowerCase().indexOf(q2) < 0) return false;
    }

    // Falta un dato concreto.
    if (S.f.falta) {
      var k = S.f.falta;
      if (src.mapa[k] === undefined || src.noAplica[k]) return false;
      var v = emb[k];
      if (v !== null && v !== undefined && v !== '') return false;
    }
    return true;
  });
}

function filtrosActivos() {
  var n = 0;
  SEMAFOROS.forEach(function (c) { if (S.f[c]) n++; });
  if (S.f.cbte) n++;
  if (S.f.fact) n++;
  if (S.f.falta) n++;
  if (S.filtroTab) n++;
  if (S.filtroEtapa) n++;
  Object.keys(S.fCol).forEach(function (k) { if (S.fCol[k]) n++; });
  return n;
}

function vistaGrilla(evs) {
  var filas = ordenar(aplicarFiltros(evs), S.orden);
  if (S.soloSug) {
    var ids = {};
    sugeridos(evs).forEach(function (x) { ids[x.emb._id] = 1; });
    filas = filas.filter(function (x) { return ids[x.emb._id]; });
  }

  // Con el formulario abierto, dibujar 70 tarjetas detrás hace lento cada
  // tecleo. Se muestran unas pocas.
  var tope = S.altaEmb ? 6 : (S.topeCargas || 0);
  var cortadas = 0;
  if (tope && filas.length > tope) { cortadas = filas.length - tope; filas = filas.slice(0, tope); }
  var nf = filtrosActivos();

  var h = '';
  if (!S.altaEmb) {
    h += '<div class="barra-alta">' +
      '<div class="accion-bloque">' +
        '<button class="primario grande" data-act="altaemb">' +
          ico('plus') + 'Cargar embarque nuevo</button>' +
        '<p class="ayuda-accion">Se inserta arriba de la fila TOTAL de la pestaña que elijas</p>' +
      '</div></div>';
  } else {
    h += formAltaEmb();
  }

  h += '<div class="filtros">' +
    '<input id="busca-cargas" placeholder="Buscar cliente, contrato, BL, factura, anotaciones" value="' +
      esc(S.busca) + '" aria-label="Buscar">' +
    '<select id="orden" aria-label="Ordenar por">' +
      Object.keys(ORDENES).map(function (k) {
        return '<option value="' + k + '"' + (S.orden === k ? ' selected' : '') + '>' +
          ORDENES[k].label + '</option>';
      }).join('') + '</select>' +
    '<button data-act="pfiltros" aria-pressed="' + S.panelFiltros + '">Filtros' +
      (nf ? ' · ' + nf : '') + '</button>' +
    '<span class="modos" style="margin-left:auto">' +
      [['tarjetas', 'Tarjetas'], ['tabla', 'Tabla'], ['planilla', 'Planilla'],
       ['exportadores', 'Por exportador']]
        .map(function (m) {
          return '<button data-act="modo" data-m="' + m[0] + '" aria-pressed="' +
            (S.modo === m[0]) + '">' + m[1] + '</button>';
        }).join('') +
    '</span>' +
    (S.modo === 'exportadores' ? ''
      : '<button data-act="csv">' + ico('down') + 'Exportar CSV</button>') +
    '</div>';

  if (S.panelFiltros) h += panelFiltros(evs);

  // "Por exportador" agrupa las mismas cargas, así que respeta el buscador y
  // los filtros, pero no tiene sentido ordenarlas ni contarlas una por una.
  if (S.modo === 'exportadores') return h + vistaExportadores(aplicarFiltros(evs));

  // Etapas: siempre visibles, es el filtro que más se usa.
  var cuentaEtapa = {};
  evs.forEach(function (x) { cuentaEtapa[x.ev.etapa] = (cuentaEtapa[x.ev.etapa] || 0) + 1; });
  h += '<div class="chips">' +
    '<button data-act="fetapa" data-e="" aria-pressed="' + (!S.filtroEtapa) + '">Todas · ' + evs.length + '</button>' +
    ETAPAS.filter(function (e) { return cuentaEtapa[e.id]; }).map(function (e) {
      return '<button data-act="fetapa" data-e="' + e.id + '" aria-pressed="' +
        (S.filtroEtapa === e.id) + '">' + e.label + ' · ' + cuentaEtapa[e.id] + '</button>';
    }).join('') + '</div>';

  // Atajo: los que conviene avisar hoy.
  var sug = sugeridos(evs);
  if (sug.length) {
    h += '<div class="aviso-sug">' + ico('mail') +
      '<span><b>' + sug.length + (sug.length === 1
        ? ' embarque listo para el shipment advice</b>'
        : ' embarques listos para el shipment advice</b>') +
      ' — zarparon, tienen BL y todavía no se avisó.</span>' +
      '<button data-act="fsug" aria-pressed="' + (S.soloSug === true) + '">' +
        (S.soloSug ? 'Ver todos' : 'Ver cuáles') + '</button>' +
      (S.soloSug ? '<button data-act="marcarsug">Elegirlos todos</button>' : '') +
      '</div>';
  }

  h += '<p class="conteo">' + filas.length +
    (filas.length === 1 ? ' embarque' : ' embarques') +
    (filas.length !== evs.length ? ' de ' + evs.length : '') +
    ' · ordenado por ' + ORDENES[S.orden].label.toLowerCase() + '</p>';

  if (!filas.length) {
    return h + '<p class="centro">Nada coincide con el filtro.' +
      (nf ? ' <button data-act="limpiar">Limpiar filtros</button>' : '') + '</p>';
  }

  var masAbajo = cortadas
    ? '<div class="ver-mas"><span class="ayuda">' + cortadas +
      ' embarques más, ocultos mientras cargás</span></div>' : '';

  if (S.modo === 'planilla') return h + vistaPlanilla(filas) + masAbajo;
  if (S.modo === 'tabla') return h + tablaCompacta(filas) + masAbajo;
  return h + '<div class="lista">' + filas.map(function (x) { return filaEmbarque(x); }).join('') +
    '</div>' + masAbajo;
}

function panelFiltros(evs) {
  var hay = function (c) {
    return S.fuentes.some(function (f) { return f.mapa[c] !== undefined && !f.noAplica[c]; });
  };

  function selEstado(campo) {
    if (!hay(campo)) return '';
    var ops = ['', 'ok', 'pendiente', 'atencion', 'vacio'];
    return '<div class="fcampo"><label for="fs-' + campo + '">' + CAMPOS[campo].label + '</label>' +
      '<select id="fs-' + campo + '" data-festado="' + campo + '">' +
      ops.map(function (o) {
        return '<option value="' + o + '"' + (S.f[campo] === o ? ' selected' : '') + '>' +
          (o === '' ? 'Cualquiera' : etiqueta(campo, o)) + '</option>';
      }).join('') + '</select></div>';
  }

  var faltables = [['invoice', 'Factura'], ['bl', 'BL'], ['booking', 'Booking'],
                   ['containers', 'Contenedores'], ['vessel', 'Buque'], ['tracking', 'Tracking']]
    .filter(function (r) { return hay(r[0]); });

  return '<div class="caja-filtros">' +
    '<div class="fgrid">' +
      SEMAFOROS.map(selEstado).join('') +

      '<div class="fcampo"><label for="ffact">Cobro del cliente</label><select id="ffact">' +
        '<option value="">Cualquiera</option>' +
        '<option value="si"' + (S.f.fact === 'si' ? ' selected' : '') + '>Ya pagó (a facturar)</option>' +
        '<option value="no"' + (S.f.fact === 'no' ? ' selected' : '') + '>Todavía no</option>' +
        '</select></div>' +
      '<div class="fcampo"><label for="fcbte">Comprobante</label><select id="fcbte">' +
        '<option value="">Cualquiera</option>' +
        '<option value="si"' + (S.f.cbte === 'si' ? ' selected' : '') + '>Falta</option>' +
        '<option value="no"' + (S.f.cbte === 'no' ? ' selected' : '') + '>No falta</option>' +
        '</select></div>' +
      (faltables.length
        ? '<div class="fcampo"><label for="ffalta">Le falta cargar</label><select id="ffalta">' +
          '<option value="">Nada en particular</option>' +
          faltables.map(function (r) {
            return '<option value="' + r[0] + '"' + (S.f.falta === r[0] ? ' selected' : '') +
              '>' + r[1] + '</option>';
          }).join('') + '</select></div>'
        : '') +
    '</div>' +
    (filtrosActivos() ? '<button data-act="limpiar" class="limpiar">Limpiar filtros</button>' : '') +
    '</div>';
}

// Vista densa, para comparar muchas filas de un saque.
function tablaCompacta(filas) {
  var hay = function (c) { return S.fuentes.some(function (f) { return f.mapa[c] !== undefined; }); };

  // [campo, ancho, clase, orden asociado]
  var cols = [
    ['exporter', 'Exportador', '', null],
    ['importer', 'Importador', '', null],
    ['contract', 'Contrato', 'cod', null],
    ['product', 'Producto', '', null],
    ['tns', 'Tns', 'num', null],
    ['etd', 'ETD', '', 'etd'],
    ['eta', 'ETA', '', 'eta'],
    ['port', 'Destino', '', null],
    ['invoice', 'Factura', 'cod', null],
    ['bl', 'BL', 'cod', null],
    ['booking', 'Booking', 'cod', null]
  ].filter(function (c) { return hay(c[0]); });

  var sems = SEMAFOROS.filter(hay);

  function th(c) {
    if (!c[3]) return '<th>' + c[1] + '</th>';
    // Clic en ETD o ETA alterna ascendente / descendente.
    var asc = c[3] + '_asc', desc = c[3] + '_desc';
    var actual = S.orden === asc ? '↑' : S.orden === desc ? '↓' : '';
    var prox = S.orden === desc ? asc : desc;
    return '<th class="ord" data-act="orden" data-o="' + prox + '" title="Ordenar por ' + c[1] + '">' +
      c[1] + (actual ? ' <span class="fl-ord">' + actual + '</span>' : '') + '</th>';
  }

  return '<div class="marco"><table><thead><tr>' +
    cols.map(th).join('') +
    '<th>Etapa</th>' +
    sems.map(function (c) { return '<th>' + CAMPOS[c].label + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    filas.map(function (x) {
      var src = x.src, emb = x.emb;
      return '<tr' + (emb._id === S.sel ? ' class="sel"' : '') +
        ' data-act="abrir" data-f="' + esc(emb._id) + '">' +
        cols.map(function (c) {
          var cls = c[2] ? ' class="' + c[2] + '"' : '';
          if (src.mapa[c[0]] === undefined) return '<td' + cls + '><span class="vacia">·</span></td>';
          return '<td' + cls + '>' + pintarCelda(emb[c[0]]) + '</td>';
        }).join('') +
        '<td class="nw">' + ((ETAPAS.filter(function (e) { return e.id === x.ev.etapa; })[0] || {}).label || '') + '</td>' +
        sems.map(function (c) {
          if (src.mapa[c] === undefined || src.noAplica[c]) return '<td><span class="vacia">·</span></td>';
          var cl = { ok:'ok', pendiente:'pend', atencion:'sol', vacio:'hueco' }[emb[c] || 'vacio'];
          return '<td><span class="pill ' + cl + '"><span class="pt"></span>' +
            etiqueta(c, emb[c]) + '</span></td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

// ===========================================================================
// Contratos: cuánto se contrató, cuánto se entregó y cuánto falta.
// Lo entregado sale de sumar los embarques de TODAS las pestañas (marítimas,
// terrestres y las que ya pasaron a facturar), atados por el código de contrato.
// ===========================================================================

function calcularContratos() {
  var mapa = new Map();

  S.contratos.forEach(function (c, k) {
    mapa.set(k, {
      contrato: k, origen: c.origen, cond: c.cond,
      contratado: c.tns, importador: c.importador, exportador: c.exportador,
      producto: c.producto, periodo: c.periodo, comision: c.comision,
      entregadoHoja: c.entregadoHoja, saldoHoja: c.saldoHoja,
      fecha: c.fecha, via: c.via || '', viaDeducida: false,
      entregado: 0, embarques: [], aFacturar: 0
    });
  });

  // Embarques activos (respetando el filtro marítimo/terrestre).
  S.datos.filas.filter(function (e) {
    if (S.filtroTab && e._tab !== S.filtroTab) return false;
    if (S.filtroTipo && clave(e.tipo) !== S.filtroTipo) return false;
    return true;
  }).forEach(function (emb) {
    var k = String(emb.contract || '').trim();
    if (!k) return;
    var reg = mapa.get(k);
    if (!reg) {
      reg = { contrato: k, huerfano: true, contratado: null,
              entregado: 0, embarques: [], aFacturar: 0 };
      mapa.set(k, reg);
    }
    reg.entregado += (emb.tns || 0);
    reg.embarques.push(emb);
    if (emb._aFacturar) reg.aFacturar++;
    if (!reg.importador) reg.importador = emb.importer;
    if (!reg.exportador) reg.exportador = emb.exporter;
  });

  // Embarques del contrato que ya pasaron a facturar y salieron de las
  // pestañas activas. Solo para informar, no se suman: la planilla ya los
  // tiene contados en su propia columna de entregado.
  S.facturar.forEach(function (f, k) {
    var reg = mapa.get(k);
    if (!reg) return;
    var activosFacturados = reg.embarques.filter(function (e) { return e._aFacturar; }).length;
    reg.historicos = Math.max(0, f.filas - activosFacturados);
    reg.tnsFacturadas = f.tns;
  });

  var lista = [];
  mapa.forEach(function (r) {
    // La planilla ya calcula entregado y saldo sobre TODO el histórico. Eso es
    // más completo que sumar solo las pestañas activas, así que manda.
    // Lo calculado por la app queda como contraste.
    r.entregadoActivo = r.entregado;
    var hojaSirve = (r.entregadoHoja !== null && r.entregadoHoja !== undefined);

    if (hojaSirve) {
      r.entregado = r.entregadoHoja;
      r.saldo = (r.saldoHoja !== null && r.saldoHoja !== undefined)
        ? r.saldoHoja
        : (r.contratado != null ? r.contratado - r.entregado : null);
      r.fuenteSaldo = 'planilla';
    } else {
      r.saldo = (r.contratado !== null && r.contratado !== undefined)
        ? r.contratado - r.entregado : null;
      r.fuenteSaldo = 'app';
    }

    r.pct = (r.contratado > 0) ? Math.min(1, r.entregado / r.contratado) : null;

    // Contratos viejos sin la columna completa: se deduce de sus embarques.
    // Se marca como deducido para no presentarlo como un dato cargado.
    if (!r.via && r.embarques.length) {
      var m = r.embarques.some(function (e) { return clave(e._tab).indexOf('mariti') >= 0; });
      var t = r.embarques.some(function (e) { return clave(e._tab).indexOf('terrestre') >= 0; });
      if (m !== t) { r.via = m ? 'maritimo' : 'terrestre'; r.viaDeducida = true; }
    }
    lista.push(r);
  });
  return lista;
}

/* Quién está embarcando y para quién.
   "Activa" es toda carga que todavía no llegó a "A facturar": ahí el cliente ya
   le pagó al exportador y el embarque dejó de requerir seguimiento. */
function esActiva(ev) { return ev.etapa !== 'cobrado'; }

function vistaExportadores(evs) {
  var soloActivas = S.expSoloActivas !== false;
  var usados = evs.filter(function (x) { return soloActivas ? esActiva(x.ev) : true; });

  // exportador -> importador -> cargas
  var grupos = new Map();
  usados.forEach(function (x) {
    var e = String(x.emb.exporter || '').trim() || 'Sin exportador';
    var i = String(x.emb.importer || '').trim() || 'Sin cliente';
    if (!grupos.has(e)) grupos.set(e, { nombre: e, tn: 0, n: 0, alertas: 0, clientes: new Map() });
    var g = grupos.get(e);
    var tn = normNum(x.emb.tns) || 0;
    g.tn += tn; g.n++;
    if (x.ev.nivelMax === 'critico' || x.ev.nivelMax === 'alto') g.alertas++;
    if (!g.clientes.has(i)) {
      g.clientes.set(i, { nombre: i, tn: 0, n: 0, alertas: 0, etapas: {}, cargas: [] });
    }
    var c = g.clientes.get(i);
    c.tn += tn; c.n++;
    if (x.ev.nivelMax === 'critico' || x.ev.nivelMax === 'alto') c.alertas++;
    c.etapas[x.ev.etapa] = (c.etapas[x.ev.etapa] || 0) + 1;
    c.cargas.push(x);
  });

  var lista = [];
  grupos.forEach(function (g) { lista.push(g); });
  lista.sort(function (a, b) { return b.tn - a.tn || b.n - a.n; });

  var totalTn = lista.reduce(function (a, g) { return a + g.tn; }, 0);

  var h = '<div class="segmento sub">' +
    '<button data-act="expact" data-v="1" aria-pressed="' + soloActivas + '">' +
      'En curso<span class="cnt">' + usados.length + '</span></button>' +
    '<button data-act="expact" data-v="0" aria-pressed="' + (!soloActivas) + '">' +
      'Todas<span class="cnt">' + evs.length + '</span></button>' +
    '</div>';

  if (!lista.length) {
    return h + '<p class="centro">No hay cargas ' +
      (soloActivas ? 'en curso' : '') + ' con este filtro.</p>';
  }

  h += '<p class="conteo">' + lista.length +
    (lista.length === 1 ? ' exportador' : ' exportadores') + ' · ' +
    fmtNum(totalTn) + ' tn en ' + usados.length +
    (usados.length === 1 ? ' carga' : ' cargas') + '</p>';

  h += '<div class="lista">' + lista.map(function (g) {
    var cls = [];
    g.clientes.forEach(function (c) { cls.push(c); });
    cls.sort(function (a, b) { return b.tn - a.tn; });

    return '<article class="emb exp-card">' +
      '<div class="emb-cuerpo">' +
        '<div class="exp-cab">' +
          '<div class="exp-ident">' +
            '<h3>' + esc(g.nombre) + '</h3>' +
            (function () { var f = bandera(paisDeEmpresa(g.nombre));
              return f ? '<span class="rot-pais">' + f + '</span>' : ''; })() +
          '</div>' +
          '<div class="exp-tot">' +
            '<span class="n">' + fmtNum(g.tn) + ' tn</span>' +
            '<span class="l">' + g.n + (g.n === 1 ? ' carga' : ' cargas') +
              ' · ' + cls.length + (cls.length === 1 ? ' cliente' : ' clientes') + '</span>' +
          '</div>' +
          (g.alertas ? '<span class="pill pend"><span class="pt"></span>' + g.alertas +
            (g.alertas === 1 ? ' con alerta' : ' con alertas') + '</span>' : '') +
        '</div>' +

        '<div class="exp-clientes">' + cls.map(function (c) {
          var barra = ETAPAS.map(function (et) {
            var n = c.etapas[et.id] || 0;
            return n ? '<i class="e-' + et.id + '" style="flex:' + n + '" title="' +
              esc(n + ' en ' + et.label) + '"></i>' : '';
          }).join('');
          var llave = g.nombre + '||' + c.nombre;
          var abierto = S.expAbierto === llave;

          return '<div class="cli-bloque' + (abierto ? ' on' : '') + '">' +
            '<button class="exp-cli" data-act="expcli" data-k="' + esc(llave) + '" ' +
              'aria-expanded="' + abierto + '">' +
              '<span class="cli-fl">' + ico('flecha') + '</span>' +
              '<span class="cli-nom">' + esc(c.nombre) +
                (function () { var f = bandera(paisDeEmpresa(c.nombre));
                  return f ? ' ' + f : ''; })() + '</span>' +
              '<span class="cli-barra">' + barra + '</span>' +
              '<span class="cli-tn">' + fmtNum(c.tn) + ' tn</span>' +
              '<span class="cli-n">' + c.n + '</span>' +
              (c.alertas ? '<span class="cli-al" title="' + c.alertas + ' con alerta">' +
                c.alertas + '</span>' : '<span class="cli-al vacio"></span>') +
            '</button>' +
            (abierto ? detalleCargas(c.cargas) : '') +
          '</div>';
        }).join('') + '</div>' +
      '</div></article>';
  }).join('') + '</div>';

  return h;
}

// El detalle de cada carga: lo que uno mira cuando abre un cliente. Las
// referencias operativas (booking, contenedores, BL, factura) van a la vista,
// no escondidas en el panel.
function detalleCargas(cargas) {
  var orden = cargas.slice().sort(function (a, b) {
    var fa = esFecha(a.emb.eta) ? a.emb.eta.getTime() : Infinity;
    var fb = esFecha(b.emb.eta) ? b.emb.eta.getTime() : Infinity;
    return fa - fb;
  });

  return '<div class="cargas-det">' + orden.map(function (x) {
    var e = x.emb, ev = x.ev;
    var src = fuenteDe(e);
    var ref = function (etq, campo, valor) {
      if (src.mapa[campo] === undefined || src.noAplica[campo]) return '';
      var v = valor !== undefined ? valor : e[campo];
      return '<span class="cd-ref"><em>' + etq + '</em>' +
        (v ? '<b>' + esc(v) + '</b>' : '<u>falta</u>') + '</span>';
    };

    return '<div class="cd-fila' + (ev.nivelMax ? ' n-' + ev.nivelMax : '') + '" ' +
      'data-act="abrir" data-f="' + esc(e._id) + '" tabindex="0">' +

      '<div class="cd-cab">' +
        '<span class="cd-ctr">' + esc(e.contract || 'sin contrato') + '</span>' +
        '<span class="cd-prod">' + esc(e.product || '') +
          (e.tns ? ' · ' + fmtNum(normNum(e.tns)) + ' tn' : '') + '</span>' +
        '<span class="cd-etapa">' + esc(etiquetaEtapa(ev.etapa)) + '</span>' +
        (ev.nivelMax
          ? '<span class="pill ' + (ev.nivelMax === 'critico' ? 'pend' : 'nar') +
            '"><span class="pt"></span>' + ev.alertas.length +
            (ev.alertas.length === 1 ? ' alerta' : ' alertas') + '</span>'
          : '') +
      '</div>' +

      '<div class="cd-refs">' +
        ref('Booking', 'booking') +
        ref('Contenedores', 'containers') +
        ref('BL', 'bl') +
        ref('Factura', 'invoice') +
        ref('Buque', 'vessel') +
        '<span class="cd-ref"><em>ETD → ETA</em><b>' +
          (esFecha(e.etd) ? fmtFecha(e.etd) : '··') + ' → ' +
          (esFecha(e.eta) ? fmtFecha(e.eta) : '··') + '</b></span>' +
        (e.port ? '<span class="cd-ref"><em>Destino</em><b>' + esc(e.port) + '</b></span>' : '') +
      '</div>' +

      '<div class="cd-sem">' + semaforosChicos(e, src) + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

function etiquetaEtapa(id) {
  var e = ETAPAS.filter(function (x) { return x.id === id; })[0];
  return e ? e.label : id;
}

// Los tres semáforos, con la misma función que usa el resto de la app: color
// y palabra, nunca color solo.
function semaforosChicos(emb, src) {
  return ['docs', 'pics', 'tr'].filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  }).map(function (c) {
    return pill(c, emb[c] && emb[c].estado ? emb[c].estado : 'vacio');
  }).join('');
}

/* Contratos sin firmar. Se mira solo entre los que están abiertos: un contrato
   viejo y cumplido sin la casilla marcada ya no es un pendiente.
   Si la planilla no tiene esas columnas, no se muestra nada. */
// ¿Alguna pestaña editable tiene las columnas de firma? Si ninguna las tiene,
// no se muestra ni el filtro ni el aviso: no hay nada que informar.
function hayColumnasFirma() {
  var hay = false;
  S.contratos.forEach(function (c) { if (c.tieneFirmas) hay = true; });
  return hay;
}

function firmasPendientes() {
  var out = [];
  S.contratos.forEach(function (c, nombre) {
    if (!c.tieneFirmas) return;
    if (c.firmaExp && c.firmaImp) return;
    // Solo los que siguen en juego: con saldo o sin entregar todo.
    var saldo = normNum(c.saldo);
    var ent = normNum(c.entregado);
    var tns = normNum(c.tns);
    var abierto = (saldo === null || saldo === undefined)
      ? true
      : saldo > 0.5;
    if (!abierto && ent && tns && ent >= tns) return;
    out.push({
      nombre: nombre, c: c,
      falta: (!c.firmaExp && !c.firmaImp) ? 'ambas'
           : (!c.firmaExp ? 'exportador' : 'importador')
    });
  });
  return out.sort(function (a, b) {
    var p = { ambas: 0, exportador: 1, importador: 2 };
    return p[a.falta] - p[b.falta] || a.nombre.localeCompare(b.nombre, 'es');
  });
}

function panelFirmas() {
  var lista = firmasPendientes();
  if (!lista.length) return '';

  var ambas = lista.filter(function (x) { return x.falta === 'ambas'; }).length;

  return '<div class="firmas">' +
    '<div class="fi-cab">' + ico('lapiz') +
      '<span><b>' + lista.length +
        (lista.length === 1 ? ' contrato sin firmar' : ' contratos sin firmar') + '</b>' +
        (ambas ? ' — ' + ambas + (ambas === 1 ? ' sin ninguna de las dos firmas'
                                              : ' sin ninguna de las dos firmas') : '') +
      '</span>' +
      '<button data-act="verfirmas" aria-pressed="' + (!!S.verFirmas) + '">' +
        (S.verFirmas ? 'Ocultar' : 'Ver cuáles') + '</button>' +
    '</div>' +
    (S.verFirmas
      ? '<div class="fi-lista">' + lista.slice(0, 40).map(function (x) {
          var falta = x.falta === 'ambas'
            ? 'Faltan las dos firmas'
            : 'Falta la firma del ' + x.falta;
          return '<button class="fi-item" data-act="ctrabrir" data-k="' + esc(x.nombre) + '">' +
            '<span class="fi-num">' + esc(x.nombre) + '</span>' +
            '<span class="fi-quien">' +
              esc([x.c.exportador, x.c.importador].filter(Boolean).join(' → ')) + '</span>' +
            '<span class="fi-falta ' + x.falta + '">' + esc(falta) + '</span>' +
            '</button>';
        }).join('') +
        (lista.length > 40
          ? '<p class="ayuda" style="padding:8px 12px">y ' + (lista.length - 40) + ' más</p>'
          : '') +
      '</div>'
      : '') +
    '</div>';
}

var ORDENES_CTR = [
  ['recientes', 'Más recientes primero'],
  ['antiguos', 'Más antiguos primero'],
  ['numero', 'Número de contrato'],
  ['cliente', 'Cliente (A → Z)'],
  ['exportador', 'Exportador (A → Z)'],
  ['saldo', 'Mayor saldo pendiente'],
  ['avance', 'Menos avanzados']
];

function ordenarContratos(lista, orden) {
  var t = function (r) { return esFecha(r.fecha) ? r.fecha.getTime() : null; };
  var txt = function (v) { return String(v || '').toLowerCase(); };
  var f = {
    // Los que no tienen fecha van al final, en los dos sentidos.
    recientes: function (a, b) {
      var x = t(a), y = t(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1; if (y === null) return -1;
      return y - x;
    },
    antiguos: function (a, b) {
      var x = t(a), y = t(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1; if (y === null) return -1;
      return x - y;
    },
    numero: function (a, b) {
      return String(a.contrato).localeCompare(String(b.contrato), 'es', { numeric: true });
    },
    cliente: function (a, b) { return txt(a.importador).localeCompare(txt(b.importador), 'es'); },
    exportador: function (a, b) { return txt(a.exportador).localeCompare(txt(b.exportador), 'es'); },
    saldo: function (a, b) { return (b.saldo || 0) - (a.saldo || 0); },
    avance: function (a, b) {
      var x = a.pct === null ? 2 : a.pct, y = b.pct === null ? 2 : b.pct;
      return x - y;
    }
  }[orden];
  return f ? lista.slice().sort(f) : lista;
}

function vistaContratos() {
  var lista = calcularContratos();
  var q = S.busca.trim().toLowerCase();

  if (q) lista = lista.filter(function (r) {
    return [r.contrato, r.importador, r.exportador]
      .some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; });
  });

  if (S.fContrato === 'abiertos') lista = lista.filter(function (r) { return r.saldo > 0.5; });
  if (S.fContrato === 'completos') lista = lista.filter(function (r) { return r.saldo !== null && r.saldo <= 0.5; });
  if (S.fContrato === 'excedidos') lista = lista.filter(function (r) { return r.saldo !== null && r.saldo < -0.5; });
  if (S.fContrato === 'sin_contrato') lista = lista.filter(function (r) { return r.huerfano; });
  // Vía: marítimo, terrestre o sin definir.
  if (S.fVia === 'maritimo' || S.fVia === 'terrestre') {
    lista = lista.filter(function (r) { return r.via === S.fVia; });
  } else if (S.fVia === 'sin') {
    lista = lista.filter(function (r) { return !r.via; });
  }

  if (S.fContrato === 'sin_firma') {
    var pend = {};
    firmasPendientes().forEach(function (x) { pend[clave(x.nombre)] = 1; });
    lista = lista.filter(function (r) { return pend[clave(r.contrato)]; });
  }
  if (S.fContrato === 'con_embarques') lista = lista.filter(function (r) { return r.embarques.length; });

  // Solo tienen sentido los contratos con movimiento o con saldo pendiente.
  if (!S.fContrato) lista = lista.filter(function (r) { return r.embarques.length || r.saldo > 0.5; });

  var conEmb = lista.filter(function (r) { return r.embarques.length; }).length;

  var h = panelFirmas();

  if (!S.alta) {
    h += '<div class="barra-alta">' +
      (S.cfg.tabAlta
        ? '<div class="accion-bloque">' +
            '<button class="primario grande" data-act="altaabrir">' +
              ico('plus') + 'Cargar contrato nuevo</button>' +
            '<p class="ayuda-accion">Se agrega en «' + esc(S.cfg.tabAlta) +
              '», arriba de la fila TOTAL</p>' +
          '</div>'
        : '<div class="accion-bloque">' +
            '<button data-act="pestanas">' + ico('tabs') + 'Configurar pestañas</button>' +
            '<p class="ayuda-accion">Elegí en qué pestaña insertar los contratos nuevos</p>' +
          '</div>') +
      '</div>';
  }

  // Cuántos hay de cada vía, sobre lo que ya está filtrado por el resto.
  var todosCtr = calcularContratos();
  var nVia = { maritimo: 0, terrestre: 0, sin: 0 };
  todosCtr.forEach(function (r) { nVia[r.via || 'sin']++; });

  h += (S.alta ? formAlta() : '') +
    '<div class="segmento sub" style="margin-top:0">' +
      [['', 'Todos', todosCtr.length], ['maritimo', '🚢 Marítimos', nVia.maritimo],
       ['terrestre', '🚚 Terrestres', nVia.terrestre], ['sin', 'Sin definir', nVia.sin]]
        .map(function (o) {
          return '<button data-act="fvia" data-v="' + o[0] + '" aria-pressed="' +
            ((S.fVia || '') === o[0]) + '">' + o[1] + '<span class="cnt">' + o[2] + '</span></button>';
        }).join('') +
    '</div>' +
    '<div class="filtros">' +
    '<input id="busca-ctr" placeholder="Buscar contrato, cliente" value="' + esc(S.busca) + '" aria-label="Buscar">' +
    '<label class="sr-solo" for="orden-ctr">Ordenar</label>' +
    '<select id="orden-ctr" data-ordenctr="1">' + ORDENES_CTR.map(function (o) {
      return '<option value="' + o[0] + '"' + ((S.ordenCtr || 'recientes') === o[0] ? ' selected' : '') +
        '>' + o[1] + '</option>';
    }).join('') + '</select>' +
    '<button data-act="csv" style="margin-left:auto">' + ico('down') + 'Exportar CSV</button></div>' +
    '<div class="chips">' +
    [['', 'Con movimiento'], ['abiertos', 'Con saldo'], ['completos', 'Completos'],
     ['excedidos', 'Excedidos'], ['sin_contrato', 'Sin contrato']]
      .concat(hayColumnasFirma() ? [['sin_firma', 'Sin firmar']] : [])
      .map(function (o) {
        return '<button data-act="fcontrato" data-c="' + o[0] + '" aria-pressed="' +
          (S.fContrato === o[0]) + '">' + o[1] + '</button>';
      }).join('') + '</div>' +
    '<p class="conteo">' + lista.length + ' contratos · ' + conEmb + ' con embarques activos</p>';

  lista = ordenarContratos(lista, S.ordenCtr || 'recientes');

  if (!lista.length) return h + '<p class="centro">Nada coincide.</p>';

  // Con cientos de contratos, dibujarlos todos hace lento cada tecleo del
  // formulario. Se muestran de a tandas.
  var tope = S.topeContratos || 40;
  var visibles = lista.slice(0, tope);
  var resto = lista.length - visibles.length;

  return h + '<div class="lista">' + visibles.map(filaContrato).join('') + '</div>' +
    (resto > 0
      ? '<div class="ver-mas"><button data-act="masctr">Ver ' +
        Math.min(resto, 40) + ' más</button>' +
        '<span class="ayuda">' + resto + ' contratos sin mostrar</span></div>'
      : '');
}

// Combo reutilizable: el alta de contratos y la edición usan el mismo.
//
// El desplegable vive en su propio contenedor con id fijo. Al tipear se
// regenera SOLO esa lista en vez de redibujar la pantalla entera: con 500
// importadores y cientos de contratos de fondo, el redibujado completo por
// cada tecla hacía que se trabara.
// Guardar cambios de un contrato. Se escribe celda por celda solo lo que
// cambió, y nunca sobre las columnas con fórmula (Total, Comisión, ENT, Saldo).
var CAMPOS_EDIT_CTR = [
  ['via', 'Marítimo o terrestre', 'via'],
  ['fecha', 'Fecha', 'date'],
  ['contrato', 'Número de contrato', 'text'],
  ['exportador', 'Exportador', 'combo'],
  ['importador', 'Importador', 'combo'],
  ['producto', 'Producto', 'combo'],
  ['tipo', 'Tipo', 'combo'],
  ['tns', 'Toneladas', 'number'],
  ['precio', 'Precio USD/tn', 'number'],
  ['packaging', 'Packaging', 'text'],
  ['incoterm', 'Incoterm', 'text'],
  ['formaPago', 'Forma de pago', 'pago'],
  ['periodo', 'Período de embarque', 'text'],
  ['pagosUsa', 'Pagos USA', 'text'],
  ['firmaExp', 'Firmado por el exportador', 'check'],
  ['firmaImp', 'Firmado por el importador', 'check']
];

// Al editar un contrato de varias filas: lo que es del CONTRATO se escribe en
// todas; lo que es de cada PRODUCTO, solo en la suya.
var CAMPOS_COMUNES = ['via', 'fecha', 'contrato', 'exportador', 'importador', 'incoterm',
                      'formaPago', 'periodo', 'pagosUsa', 'firmaExp', 'firmaImp'];
var CAMPOS_PRODUCTO = ['producto', 'tipo', 'tns', 'precio', 'packaging'];

function filasDelContrato(ref) {
  if (!ref) return [];
  return [ref].concat(ref.otras || []);
}

// Actualiza el "N cambios sin guardar" y el botón Guardar sin redibujar el
// panel: así escribir o tildar no mueve nada en pantalla.
function refrescarBarraCtr() {
  if (!S.editCtr || typeof document === 'undefined' || !document.querySelector) return;
  var n = Object.keys(S.editCtr.cambios).length;
  var lbl = document.querySelector('.ctr-cambios');
  if (lbl) lbl.textContent = n ? n + (n === 1 ? ' cambio sin guardar' : ' cambios sin guardar')
                                : 'Sin cambios';
  var btn = document.querySelector('.btn-guardar-ctr');
  if (btn) btn.disabled = !n || !!S.guardandoCtr;
}

async function guardarContrato() {
  var e = S.editCtr;
  if (!e) return;
  var ref = S.ctrEditables.get(e.contrato);
  if (!ref) { S.editCtrError = 'No encontré la fila de este contrato.'; return pintar(); }

  var reqs = [];
  var filas = filasDelContrato(ref);
  var tipoDe = {};
  CAMPOS_EDIT_CTR.forEach(function (c) { tipoDe[c[0]] = c[2]; });

  var convertir = function (campo, val) {
    var t = tipoDe[campo];
    if (t === 'check') return val === true;
    if (t === 'number' || campo === 'tns' || campo === 'precio') {
      return val === '' ? '' : parseFloat(val);
    }
    if (t === 'date' && val !== '') {
      var dc = normFecha(val);
      if (!esFecha(dc)) throw new Error('La fecha "' + val + '" no se entiende. Usá DD/MM/AAAA.');
      return dc;
    }
    return val;
  };

  var escribir = function (fr, campo, val) {
    var idx = fr.mapa[campo];
    if (idx === undefined) return;
    reqs.push({
      updateCells: {
        range: { sheetId: fr.sheetId, startRowIndex: fr.fila - 1, endRowIndex: fr.fila,
                 startColumnIndex: idx, endColumnIndex: idx + 1 },
        rows: [{ values: [{ userEnteredValue: aValorSheets(val) }] }],
        fields: 'userEnteredValue'
      }
    });
  };

  // 1. Lo del contrato va a TODAS sus filas.
  Object.keys(e.cambios).forEach(function (campo) {
    if (campo.indexOf('prod_') === 0) return;
    if (CAMPOS_PRODUCTO.indexOf(campo) >= 0 && filas.length > 1) return;
    var val = convertir(campo, e.cambios[campo]);
    (CAMPOS_COMUNES.indexOf(campo) >= 0 ? filas : [ref]).forEach(function (fr) {
      escribir(fr, campo, val);
    });
  });

  // 2. Lo de cada producto, a su fila: los cambios llegan como prod_<i>_<campo>.
  Object.keys(e.cambios).forEach(function (k) {
    var m = k.match(/^prod_(\d+)_(\w+)$/);
    if (!m) return;
    var fr = filas[+m[1]];
    if (!fr) return;
    escribir(fr, m[2], convertir(m[2], e.cambios[k]));
  });

  if (!reqs.length) { S.editCtr = null; return pintar(); }

  S.guardandoCtr = true; S.editCtrError = null; pintar();
  try {
    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: reqs })
    });
    S.editCtr = null;
    S.avisoOk = 'Contrato ' + e.contrato + ' actualizado en "' + ref.tab + '".';
    await cargarTodo();
  } catch (err) {
    S.editCtrError = 'No se pudo guardar: ' + err.message;
  } finally {
    S.guardandoCtr = false; pintar();
  }
}

function panelContrato() {
  var e = S.editCtr;
  var ref = S.ctrEditables.get(e.contrato);
  var L = S.listas || { exportadores: [], importadores: [], productos: [], tipos: [] };

  var v = function (campo) {
    if (campo in e.cambios) return e.cambios[campo];
    return e.orig[campo] == null ? '' : String(e.orig[campo]);
  };

  var listaDe = {
    exportador: L.exportadores, importador: L.importadores,
    producto: L.productos, tipo: L.tipos
  };

  var fuera = [];
  var filasCtr = filasDelContrato(ref);
  var multi = filasCtr.length > 1;

  var campos = CAMPOS_EDIT_CTR.filter(function (c) {
    if (c[2] === 'check') return false;          // las firmas van arriba
    // Con varios productos, lo de cada producto va en su propio bloque.
    if (multi && CAMPOS_PRODUCTO.indexOf(c[0]) >= 0) return false;
    return ref && ref.mapa[c[0]] !== undefined;
  }).map(function (c) {
    var campo = c[0], label = c[1], tipo = c[2], val = v(campo);

    if (tipo === 'combo') {
      var ops = listaDe[campo] || [];
      var ok = ops.some(function (o) { return clave(o) === clave(val); });
      // Solo frena si se TOCÓ ese campo. Muchos contratos viejos tienen nombres
      // que no están en la base, y eso no puede impedir corregir el packaging.
      if (val && !ok && (campo in e.cambios)) fuera.push(label);
      return comboGen('c-' + campo, campo, label, ops, val, ok, 'ctr');
    }
    if (tipo === 'pago') {
      var ops2 = S.formasPago.map(function (f) { return f.texto; });
      return comboGen('c-' + campo, campo, label, ops2, val, true, 'ctr', true);
    }
    if (tipo === 'via') {
      var actualV = normVia(val);
      return '<div class="campo"><label>' + label + '</label><div class="chips" style="margin:0">' +
        [['maritimo', '🚢 Marítimo'], ['terrestre', '🚚 Terrestre']].map(function (o) {
          return '<button data-act="ctrvia" data-v="' + o[0] + '" aria-pressed="' +
            (actualV === o[0]) + '">' + o[1] + '</button>';
        }).join('') + '</div></div>';
    }
    if (tipo === 'check') {
      var marcado = (campo in e.cambios) ? e.cambios[campo] === true
                                         : esVerdadero(e.orig[campo]);
      return '<div class="campo"><button class="sw-firma' + (marcado ? ' on' : '') + '" ' +
        'data-act="firma" data-c="' + campo + '" aria-pressed="' + marcado + '">' +
        '<span class="riel"><span class="bolita"></span></span>' +
        '<span class="et">' + label + '</span>' +
        (marcado ? '<span class="tick">' + ico('check') + '</span>' : '') +
        '</button></div>';
    }
    if (tipo === 'date') return campoFecha('c-' + campo, 'data-ectr', campo, label, val);
    return '<div class="campo"><label for="c-' + campo + '">' + label + '</label>' +
      '<input id="c-' + campo + '" data-ectr="' + campo + '" type="' +
      (tipo === 'number' ? 'number' : 'text') + '" value="' + esc(val) + '"></div>';
  }).join('');

  // Las firmas van primero: es lo que más se toca y no tiene sentido buscarlo
  // abajo de once campos.
  var bloqueFirmas = '';
  var refF = S.ctrEditables.get(e.contrato);
  if (refF && (refF.mapa.firmaExp !== undefined || refF.mapa.firmaImp !== undefined)) {
    var swF = function (campo, label) {
      if (refF.mapa[campo] === undefined) return '';
      var on = (campo in e.cambios) ? e.cambios[campo] === true : esVerdadero(e.orig[campo]);
      return '<button class="sw-firma' + (on ? ' on' : '') + '" data-act="firma" ' +
        'data-c="' + campo + '" aria-pressed="' + on + '">' +
        '<span class="riel"><span class="bolita"></span></span>' +
        '<span class="et">' + label + '</span>' +
        (on ? '<span class="tick">' + ico('check') + '</span>' : '') + '</button>';
    };
    bloqueFirmas = '<div class="bloque-firmas">' +
      '<h3 class="gt">Firmas</h3>' +
      swF('firmaExp', 'Firmado por el exportador') +
      swF('firmaImp', 'Firmado por el importador') +
      '</div>';
  }

  // Un bloque por producto, cada uno con su fila.
  var bloqueProductos = '';
  if (multi) {
    var Lp = S.listas || {};
    bloqueProductos = '<div class="bloque"><h3 class="gt">Productos · ' + filasCtr.length +
      ' filas</h3><p class="ayuda" style="margin:-6px 0 12px">Lo de arriba se guarda en ' +
      'todas las filas. Lo de cada producto, solo en la suya.</p>' +
      filasCtr.map(function (fr, i) {
        var g = function (campo) {
          var k = 'prod_' + i + '_' + campo;
          if (k in e.cambios) return e.cambios[k];
          var idx = fr.mapa[campo];
          var v = idx === undefined ? '' : fr.celdas[idx];
          return v === null || v === undefined ? '' : String(v);
        };
        var inp = function (campo, label, tipo) {
          if (fr.mapa[campo] === undefined) return '';
          return '<div class="campo"><label for="pp-' + i + '-' + campo + '">' + label + '</label>' +
            '<input id="pp-' + i + '-' + campo + '" data-prodctr="' + i + '_' + campo + '" ' +
            'type="' + (tipo || 'text') + '" value="' + esc(g(campo)) + '"></div>';
        };
        return '<div class="ap-fila">' +
          '<span class="ap-num">' + (i + 1) + '</span>' +
          '<div class="ap-campos">' +
            inp('producto', 'Producto') + inp('tipo', 'Tipo') +
            inp('tns', 'Toneladas', 'number') + inp('precio', 'Precio USD/tn', 'number') +
            inp('packaging', 'Packaging') +
          '</div>' +
          '<span class="ap-fila-n">fila ' + fr.fila + '</span>' +
        '</div>';
      }).join('') + '</div>';
  }

  var hayCambios = Object.keys(e.cambios).length > 0;
  var nuevoNum = ('contrato' in e.cambios) ? e.cambios.contrato : e.contrato;
  var repeEd = contratoRepetido(nuevoNum, e.contrato);

  var nCambios = Object.keys(e.cambios).length;
  var bloqueado = !hayCambios || fuera.length || S.guardandoCtr;
  var an = S.animarPanel ? ' anim' : '';

  // Cabecera fija con guardar y cancelar: siempre a mano, sin bajar hasta el
  // final del formulario.
  return '<div class="velo' + an + '" data-act="ctrcerrar"></div>' +
    '<aside class="panel panel-edit' + an + '" role="dialog" aria-label="Editar contrato">' +
    '<header class="pe-top">' +
      '<div class="pe-tit">' +
        '<span class="pe-chip">' + ico('lapiz') + 'Editando</span>' +
        '<span class="pe-donde ctr-cambios">' +
          (hayCambios ? nCambios + (nCambios === 1 ? ' cambio sin guardar' : ' cambios sin guardar')
                      : 'Sin cambios') + '</span>' +
      '</div>' +
      '<div class="pe-acc">' +
        '<button class="btn-doc" data-act="genabrir" data-k="' + esc(e.contrato) + '" ' +
          'title="Generar el documento del contrato">' + ico('doc') + 'Documento</button>' +

          (bloqueado ? ' disabled' : '') + '>' +

      '</div>' +
    '</header>' +

    (S.confirmCerrar
      ? '<div class="confirmar-cierre">' +
          '<p class="cc-tit">Tenés ' + nCambios +
            (nCambios === 1 ? ' cambio sin guardar' : ' cambios sin guardar') + '</p>' +
          '<p class="cc-sub">Si cerrás ahora se pierden.</p>' +
          '<div class="cc-acc">' +
            '<button class="primario" data-act="ctrguardarcerrar"' +
              (fuera.length ? ' disabled' : '') + '>' + ico('check') + 'Guardar y cerrar</button>' +
            '<button class="descartar" data-act="ctrdescartar">Descartar cambios</button>' +
            '<button data-act="ctrseguir">Seguir editando</button>' +
