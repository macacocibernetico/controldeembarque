// Vista densa, para comparar muchas filas de un saque.
// ===========================================================================
// Contratos: cuánto se contrató, cuánto se entregó y cuánto falta.
// Lo entregado sale de sumar los embarques de TODAS las pestañas (marítimas,
// terrestres y las que ya pasaron a facturar), atados por el código de contrato.
// ===========================================================================

function calcularContratos() {
  var mapa = new Map();

  S.contratos.forEach(function (c, k) {
    mapa.set(k, {
      contrato: k, origen: c.origen, cond: c.cond,
      tipo: c.tipo, tipos: (c.tipos || [tipoCtr(c.tipo)]).slice(),
      contratado: c.tns, importador: c.importador, exportador: c.exportador,
      producto: c.producto, periodo: c.periodo, per: periodoDeContrato(c), comision: c.comision,
      entregadoHoja: c.entregadoHoja, saldoHoja: c.saldoHoja,
      fecha: c.fecha, via: c.via || '', viaDeducida: false,
      entregado: 0, embarques: [], aFacturar: 0
    });
  });

  // Embarques activos (respetando el filtro marítimo/terrestre).
  S.datos.filas.filter(function (e) {
    if (S.filtroTab && e._tab !== S.filtroTab) return false;
    if (S.filtroTipo && clave(e.tipo) !== S.filtroTipo) return false;
    return true;
  }).forEach(function (emb) {
    var k = String(emb.contract || '').trim();
    if (!k) return;
    var reg = mapa.get(k);
    if (!reg) {
      reg = { contrato: k, huerfano: true, contratado: null,
              tipo: emb.tipo, tipos: [tipoCtr(emb.tipo)],
              entregado: 0, embarques: [], aFacturar: 0 };
      mapa.set(k, reg);
    }
    reg.entregado += (emb.tns || 0);
    reg.embarques.push(emb);
    if (emb._aFacturar) reg.aFacturar++;
    if (!reg.importador) reg.importador = emb.importer;
    if (!reg.exportador) reg.exportador = emb.exporter;
  });

  // Embarques del contrato que ya pasaron a facturar y salieron de las
  // pestañas activas. Solo para informar, no se suman: la planilla ya los
  // tiene contados en su propia columna de entregado.
  S.facturar.forEach(function (f, k) {
    var reg = mapa.get(k);
    if (!reg) return;
    var activosFacturados = reg.embarques.filter(function (e) { return e._aFacturar; }).length;
    reg.historicos = Math.max(0, f.filas - activosFacturados);
    reg.tnsFacturadas = f.tns;
  });

  var lista = [];
  mapa.forEach(function (r) {
    // La planilla ya calcula entregado y saldo sobre TODO el histórico. Eso es
    // más completo que sumar solo las pestañas activas, así que manda.
    // Lo calculado por la app queda como contraste.
    r.entregadoActivo = r.entregado;
    var hojaSirve = (r.entregadoHoja !== null && r.entregadoHoja !== undefined);

    if (hojaSirve) {
      r.entregado = r.entregadoHoja;
      r.saldo = (r.saldoHoja !== null && r.saldoHoja !== undefined)
        ? r.saldoHoja
        : (r.contratado != null ? r.contratado - r.entregado : null);
      r.fuenteSaldo = 'planilla';
    } else {
      r.saldo = (r.contratado !== null && r.contratado !== undefined)
        ? r.contratado - r.entregado : null;
      r.fuenteSaldo = 'app';
    }

    r.pct = (r.contratado > 0) ? Math.min(1, r.entregado / r.contratado) : null;

    // Contratos viejos sin la columna completa: se deduce de sus embarques.
    // Se marca como deducido para no presentarlo como un dato cargado.
    if (!r.via && r.embarques.length) {
      var m = r.embarques.some(function (e) { return clave(e._tab).indexOf('mariti') >= 0; });
      var t = r.embarques.some(function (e) { return clave(e._tab).indexOf('terrestre') >= 0; });
      if (m !== t) { r.via = m ? 'maritimo' : 'terrestre'; r.viaDeducida = true; }
    }
    lista.push(r);
  });
  return lista;
}

/* Quién está embarcando y para quién.
   "Activa" es toda carga que todavía no llegó a "A facturar": ahí el cliente ya
   le pagó al exportador y el embarque dejó de requerir seguimiento. */
function esActiva(ev) { return ev.etapa !== 'cobrado'; }

/* Qué significa cada color en «Por exportador». Todo sale de las mismas tablas y clases
   que dibujan la vista (etapas, etiquetas de los semáforos, estilos de la barra y de las
   alertas): si algo cambia allá, la leyenda cambia con ello y no puede contradecirse. */
function leyendaExportadores() {
  var etapas = ETAPAS.map(function (et) {
    return '<li><span class="cli-barra ley-sw"><i class="e-' + et.id + '"></i></span>' + esc(et.label) + '</li>';
  }).join('');
  var punto = function (cls, texto) {
    return '<li><span class="pill ' + cls + '"><span class="pt"></span></span>' + texto + '</li>';
  };
  var e = ETIQUETAS;
  return '<section class="leyenda-exp' + (S.expLeyenda ? ' abierta' : '') + '" aria-label="Qué significa cada color">' +
    '<button class="ley-cab" data-act="expleyenda" aria-expanded="' + !!S.expLeyenda + '">' +
      ico('info') + '<span class="ley-t">Qué significa cada color</span><span class="ley-fl">▾</span></button>' +
    (S.expLeyenda
      ? '<div class="ley-cuerpo">' +
          '<div class="ley-grupo ley-grupo-barra"><h4>Barra de cada cliente</h4>' +
            '<p class="ley-sub">Cargas del cliente, por etapa</p><ul>' + etapas + '</ul>' +
            '<p class="ley-nota">Cada tramo es proporcional a la cantidad de cargas en esa etapa. ' +
              'Pasá el mouse por la barra para ver el número.</p></div>' +
          '<div class="ley-grupo"><h4>Alertas</h4>' +
            '<p class="ley-sub">Lo que hay que mirar primero</p><ul>' +
              '<li><span class="cli-al ley-num">2</span>Círculo rojo: cargas del cliente con una alerta crítica o de esta semana. ' +
                'Arriba, junto al exportador, «N con alertas» es la suma de todos sus clientes.</li>' +
              '<li><span class="ley-gris">3</span>Número gris: cantidad de cargas del cliente.</li>' +
              punto('pend', 'En cada carga, rojo: requiere acción ahora. La carga lleva además un borde rojo fino.') +
              punto('nar', 'En cada carga, naranja: es para esta semana, o faltan datos.') +
            '</ul></div>' +
          '<div class="ley-grupo"><h4>Docs · Fotos · T.R.</h4>' +
            '<p class="ley-sub">Cada documento de la carga</p><ul>' +
              punto('ok', esc(e.docs.ok + ' · ' + e.pics.ok + ' · ' + e.tr.ok)) +
              punto('pend', esc(e.docs.pendiente + ' · ' + e.tr.pendiente)) +
              punto('sol', esc(e.docs.atencion + ' (Docs y Fotos) · ' + e.tr.atencion + ' (T.R.)')) +
              punto('hueco', esc(e.docs.vacio) + ': todavía no se cargó nada') +
            '</ul></div>' +
        '</div>'
      : '') +
    '</section>';
}

/* Cada vez que algo se abre o se cierra la pantalla se redibuja, y el botón que tenía el foco
   se reemplaza por otro igual: sin esto, con el teclado el siguiente Enter o espacio no
   hacía nada porque el foco se perdía. Se lo vuelve a poner en el mismo botón. */
function volverAEnfocar(act, k) {
  var bs = document.querySelectorAll('[data-act="' + act + '"]');
  for (var i = 0; i < bs.length; i++) {
    if (k === undefined || bs[i].getAttribute('data-k') === k) { bs[i].focus(); return; }
  }
}

// Exportadores y clientes se ordenan igual: por toneladas (lo de siempre), por alertas
// (lo que hay que mirar primero) o por nombre.
function ordenarExp(arr) {
  var o = S.expOrden || 'tn';
  return arr.sort(function (a, b) {
    if (o === 'nombre') return a.nombre.localeCompare(b.nombre, 'es');
    if (o === 'alertas') return (b.alertas - a.alertas) || (b.tn - a.tn) || a.nombre.localeCompare(b.nombre, 'es');
    return (b.tn - a.tn) || (b.n - a.n) || a.nombre.localeCompare(b.nombre, 'es');
  });
}

function vistaExportadores(evs) {
  var soloActivas = S.expSoloActivas !== false;
  var usados = evs.filter(function (x) { return soloActivas ? esActiva(x.ev) : true; });

  // exportador -> importador -> cargas
  var grupos = new Map();
  usados.forEach(function (x) {
    var e = String(x.emb.exporter || '').trim() || 'Sin exportador';
    var i = String(x.emb.importer || '').trim() || 'Sin cliente';
    if (!grupos.has(e)) grupos.set(e, { nombre: e, tn: 0, n: 0, alertas: 0, clientes: new Map() });
    var g = grupos.get(e);
    var tn = normNum(x.emb.tns) || 0;
    g.tn += tn; g.n++;
    if (x.ev.nivelMax === 'critico' || x.ev.nivelMax === 'alto') g.alertas++;
    if (!g.clientes.has(i)) {
      g.clientes.set(i, { nombre: i, tn: 0, n: 0, alertas: 0, etapas: {}, cargas: [] });
    }
    var c = g.clientes.get(i);
    c.tn += tn; c.n++;
    if (x.ev.nivelMax === 'critico' || x.ev.nivelMax === 'alto') c.alertas++;
    c.etapas[x.ev.etapa] = (c.etapas[x.ev.etapa] || 0) + 1;
    c.cargas.push(x);
  });

  var lista = [];
  grupos.forEach(function (g) { lista.push(g); });
  ordenarExp(lista);

  var totalTn = lista.reduce(function (a, g) { return a + g.tn; }, 0);
  S.expLlaves = [];

  var nAbiertos = Object.keys(S.expAbiertos).length;
  var h = '<div class="exp-barra">' +
    '<div class="segmento sub">' +
      '<button data-act="expact" data-v="1" aria-pressed="' + soloActivas + '">' +
        'En curso<span class="cnt">' + usados.length + '</span></button>' +
      '<button data-act="expact" data-v="0" aria-pressed="' + (!soloActivas) + '">' +
        'Todas<span class="cnt">' + evs.length + '</span></button>' +
    '</div>' +
    '<div class="exp-acc">' +
      '<label class="sr-solo" for="orden-exp">Ordenar</label>' +
      '<select id="orden-exp" data-ordenexp="1">' + [['tn', 'Más toneladas primero'], ['alertas', 'Con más alertas primero'],
        ['nombre', 'Por nombre (A–Z)']].map(function (o) {
          return '<option value="' + o[0] + '"' + ((S.expOrden || 'tn') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select>' +
      '<button data-act="expall">Desplegar todo</button>' +
      '<button data-act="expnada"' + (nAbiertos ? '' : ' disabled') + '>Plegar todo' + (nAbiertos ? ' (' + nAbiertos + ')' : '') + '</button>' +
    '</div></div>';

  if (!lista.length) {
    return h + '<p class="centro">No hay cargas ' +
      (soloActivas ? 'en curso' : '') + ' con este filtro.</p>';
  }

  h += '<p class="conteo">' + lista.length +
    (lista.length === 1 ? ' exportador' : ' exportadores') + ' · ' +
    fmtNum(totalTn) + ' tn en ' + usados.length +
    (usados.length === 1 ? ' carga' : ' cargas') + '</p>' +
    leyendaExportadores();

  h += '<div class="lista">' + lista.map(function (g) {
    var cls = [];
    g.clientes.forEach(function (c) { cls.push(c); });
    ordenarExp(cls);
    var plegado = !!S.expPlegados[g.nombre];
    cls.forEach(function (c) { S.expLlaves.push(g.nombre + '||' + c.nombre); });

    return '<article class="emb exp-card">' +
      '<div class="emb-cuerpo">' +
        '<div class="exp-cab">' +
          '<div class="exp-ident">' +
            // El nombre es el botón que pliega y despliega a sus clientes.
            '<h3 class="exp-h3"><button class="exp-tog" data-act="expplegar" data-k="' + esc(g.nombre) + '" ' +
              'aria-expanded="' + !plegado + '" title="' + (plegado ? 'Mostrar' : 'Ocultar') + ' los clientes de ' + esc(g.nombre) + '">' +
              '<span class="exp-fl' + (plegado ? '' : ' on') + '" aria-hidden="true">' + ico('flecha') + '</span>' +
              '<span class="exp-nom">' + esc(g.nombre) + '</span>' +
              (function () { var f = bandera(paisDeEmpresa(g.nombre));
                return f ? '<span class="rot-pais">' + f + '</span>' : ''; })() +
            '</button></h3>' +
          '</div>' +
          '<div class="exp-tot">' +
            '<span class="n">' + fmtNum(g.tn) + ' tn</span>' +
            '<span class="l">' + g.n + (g.n === 1 ? ' carga' : ' cargas') +
              ' · ' + cls.length + (cls.length === 1 ? ' cliente' : ' clientes') + '</span>' +
          '</div>' +
          (g.alertas ? '<span class="pill pend"><span class="pt"></span>' + g.alertas +
            (g.alertas === 1 ? ' con alerta' : ' con alertas') + '</span>' : '') +
        '</div>' +

        (plegado ? '' : '<div class="exp-clientes">' +
          // Qué es cada columna, a la vista (antes sólo se entendía con la leyenda).
          '<div class="cli-cab" aria-hidden="true"><span></span><span>Cliente</span>' +
            '<span class="cc-barra">Cargas por etapa</span><span class="cc-tn">Toneladas</span>' +
            '<span class="cc-n">Cargas</span><span class="cc-al">Alertas</span></div>' +
          cls.map(function (c) {
          var barra = ETAPAS.map(function (et) {
            var n = c.etapas[et.id] || 0;
            return n ? '<i class="e-' + et.id + '" style="flex:' + n + '" title="' +
              esc(n + ' en ' + et.label) + '"></i>' : '';
          }).join('');
          var llave = g.nombre + '||' + c.nombre;
          var abierto = !!S.expAbiertos[llave];

          return '<div class="cli-bloque' + (abierto ? ' on' : '') + '">' +
            '<button class="exp-cli" data-act="expcli" data-k="' + esc(llave) + '" ' +
              'aria-expanded="' + abierto + '" title="' + (abierto ? 'Ocultar' : 'Mostrar') + ' las cargas de ' + esc(c.nombre) + '">' +
              '<span class="cli-fl">' + ico('flecha') + '</span>' +
              '<span class="cli-nom">' + esc(c.nombre) +
                (function () { var f = bandera(paisDeEmpresa(c.nombre));
                  return f ? ' ' + f : ''; })() + '</span>' +
              '<span class="cli-barra">' + barra + '</span>' +
              '<span class="cli-tn">' + fmtNum(c.tn) + ' tn</span>' +
              '<span class="cli-n">' + c.n + '<span class="l"> ' + (c.n === 1 ? 'carga' : 'cargas') + '</span></span>' +
              (c.alertas ? '<span class="cli-al" title="' + c.alertas + ' con alerta">' + c.alertas +
                '<span class="l"> ' + (c.alertas === 1 ? 'alerta' : 'alertas') + '</span></span>'
                : '<span class="cli-al vacio"></span>') +
            '</button>' +
            (abierto ? detalleCargas(c.cargas) : '') +
          '</div>';
        }).join('') + '</div>') +
      '</div></article>';
  }).join('') + '</div>';

  return h;
}

// El detalle de cada carga: lo que uno mira cuando abre un cliente. Las
// referencias operativas (booking, contenedores, BL, factura) van a la vista,
// no escondidas en el panel.
function detalleCargas(cargas) {
  var orden = cargas.slice().sort(function (a, b) {
    var fa = esFecha(a.emb.eta) ? a.emb.eta.getTime() : Infinity;
    var fb = esFecha(b.emb.eta) ? b.emb.eta.getTime() : Infinity;
    return fa - fb;
  });

  return '<div class="cargas-det">' + orden.map(function (x) {
    var e = x.emb, ev = x.ev;
    var src = fuenteDe(e);
    var ref = function (etq, campo, valor) {
      if (src.mapa[campo] === undefined || src.noAplica[campo]) return '';
      var v = valor !== undefined ? valor : e[campo];
      return '<span class="cd-ref"><em>' + etq + '</em>' +
        (v ? '<b>' + esc(v) + '</b>' : '<u>falta</u>') + '</span>';
    };
    // Contenedores: una carga puede traer diez y estiraba la tarjeta. Se ven los tres primeros
    // y el resto está a un toque, sin perder ninguno.
    var refCont = function () {
      if (src.mapa.containers === undefined || src.noAplica.containers) return '';
      var items = String(e.containers || '').split(/\s*[,;\n]+\s*/).filter(Boolean);
      if (items.length <= 3) return ref('Contenedores', 'containers');
      return '<span class="cd-ref"><em>Contenedores · ' + items.length + '</em><b>' + esc(items.slice(0, 3).join(', ')) + '</b>' +
        '<details class="cd-mas"><summary>+ ' + (items.length - 3) + ' más</summary><b>' + esc(items.slice(3).join(', ')) + '</b></details></span>';
    };

    return '<div class="cd-fila' + (ev.nivelMax ? ' n-' + ev.nivelMax : '') + '" ' +
      'data-act="abrir" data-f="' + esc(e._id) + '" tabindex="0">' +

      '<div class="cd-cab">' +
        '<span class="cd-ctr">' + esc(e.contract || 'sin contrato') + '</span>' +
        '<span class="cd-prod">' + esc(e.product || '') +
          (e.tns ? ' · ' + fmtNum(normNum(e.tns)) + ' tn' : '') + '</span>' +
        '<span class="cd-estado"><span class="cd-etapa">' + esc(etiquetaEtapa(ev.etapa)) + '</span>' +
        (function () {
          var nc = nComentariosAbiertos(e);
          return nc ? '<span class="pill coment" title="Comentarios sin resolver"><span class="pt"></span>' + nc +
            (nc === 1 ? ' comentario' : ' comentarios') + '</span>' : '';
        })() +
        (ev.nivelMax
          ? '<span class="pill ' + (ev.nivelMax === 'critico' ? 'pend' : 'nar') +
            '"><span class="pt"></span>' + ev.alertas.length +
            (ev.alertas.length === 1 ? ' alerta' : ' alertas') + '</span>'
          : '') +
        ((S.fuentesFact || []).length && !e._aFacturar
          ? '<button class="btn-elim chico" data-act="elimabrir" data-f="' + esc(e._id) + '" title="Eliminar esta carga de la planilla" aria-label="Eliminar esta carga">' + ico('papelera') + '</button>' +
            '<button class="ir-fact" data-f="' + esc(e._id) + '" title="Pasar a ' + esc(S.fuentesFact[0].tab) + '">' +
            ico('mover') + 'A facturar</button>'
          : '') + '</span>' +
      '</div>' +

      '<div class="cd-refs">' +
        ref('Booking', 'booking') +
        refCont() +
        ref('BL', 'bl') +
        ref('Factura', 'invoice') +
        ref('Buque', 'vessel') +
        '<span class="cd-ref cd-fechas"><em>ETD → ETA</em><b>' +
          // Cada fecha va entera; si no entran juntas, la segunda baja después de la flecha.
          '<span class="cd-f">' + (esFecha(e.etd) ? fmtFecha(e.etd) : '··') + '</span> → ' +
          '<span class="cd-f">' + (esFecha(e.eta) ? fmtFecha(e.eta) : '··') + '</span></b></span>' +
        (e.port ? '<span class="cd-ref"><em>Destino</em><b>' + esc(e.port) + '</b></span>' : '') +
      '</div>' +

      '<div class="cd-sem">' + semaforosChicos(e, src) + '</div>' +
      '</div>';
  }).join('') + '</div>';
}

function etiquetaEtapa(id) {
  var e = ETAPAS.filter(function (x) { return x.id === id; })[0];
  return e ? e.label : id;
}

// Los tres semáforos, con la misma función que usa el resto de la app: color
// y palabra, nunca color solo.
function semaforosChicos(emb, src) {
  return ['docs', 'pics', 'tr'].filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  }).map(function (c) {
    // El semáforo es un texto ('ok', 'pendiente'…), no un objeto: leerle «.estado» daba
    // siempre vacío y la vista previa mostraba todo como «Sin marcar».
    return pill(c, emb[c] || 'vacio');
  }).join('');
}

/* Contratos sin firmar. Se mira solo entre los que están abiertos: un contrato
   viejo y cumplido sin la casilla marcada ya no es un pendiente.
   Si la planilla no tiene esas columnas, no se muestra nada. */
// ¿Alguna pestaña editable tiene las columnas de firma? Si ninguna las tiene,
// no se muestra ni el filtro ni el aviso: no hay nada que informar.
function hayColumnasFirma() {
  var hay = false;
  S.contratos.forEach(function (c) { if (c.tieneFirmas) hay = true; });
  return hay;
}

function firmasPendientes() {
  var out = [];
  S.contratos.forEach(function (c, nombre) {
    if (!c.tieneFirmas) return;
    if (c.firmaExp && c.firmaImp) return;
    // Solo los que siguen en juego: con saldo o sin entregar todo.
    var saldo = normNum(c.saldo);
    var ent = normNum(c.entregado);
    var tns = normNum(c.tns);
    var abierto = (saldo === null || saldo === undefined)
      ? true
      : saldo > 0.5;
    if (!abierto && ent && tns && ent >= tns) return;
    out.push({
      nombre: nombre, c: c,
      falta: (!c.firmaExp && !c.firmaImp) ? 'ambas'
           : (!c.firmaExp ? 'exportador' : 'importador')
    });
  });
  return out.sort(function (a, b) {
    var p = { ambas: 0, exportador: 1, importador: 2 };
    return p[a.falta] - p[b.falta] || a.nombre.localeCompare(b.nombre, 'es');
  });
}

function panelFirmas() {
  var lista = firmasPendientes();
  if (!lista.length) return '';

  var ambas = lista.filter(function (x) { return x.falta === 'ambas'; }).length;

  return '<div class="firmas">' +
    '<div class="fi-cab">' + ico('lapiz') +
      '<span><b>' + lista.length +
        (lista.length === 1 ? ' contrato sin firmar' : ' contratos sin firmar') + '</b>' +
        (ambas ? ' — ' + ambas + (ambas === 1 ? ' sin ninguna de las dos firmas'
                                              : ' sin ninguna de las dos firmas') : '') +
      '</span>' +
      '<button data-act="verfirmas" aria-pressed="' + (!!S.verFirmas) + '">' +
        (S.verFirmas ? 'Ocultar' : 'Ver cuáles') + '</button>' +
    '</div>' +
    (S.verFirmas
      ? '<div class="fi-lista">' + lista.slice(0, 40).map(function (x) {
          var falta = x.falta === 'ambas'
            ? 'Faltan las dos firmas'
            : 'Falta la firma del ' + x.falta;
          return '<button class="fi-item" data-act="ctrabrir" data-k="' + esc(x.nombre) + '">' +
            '<span class="fi-num">' + esc(x.nombre) + '</span>' +
            '<span class="fi-quien">' +
              esc([x.c.exportador, x.c.importador].filter(Boolean).join(' → ')) + '</span>' +
            '<span class="fi-falta ' + x.falta + '">' + esc(falta) + '</span>' +
            '</button>';
        }).join('') +
        (lista.length > 40
          ? '<p class="ayuda" style="padding:8px 12px">y ' + (lista.length - 40) + ' más</p>'
          : '') +
      '</div>'
      : '') +
    '</div>';
}

/* Los contratos se numeran LT<número>-<año>: LT099-2026. Se separa en partes
   para mostrarlo en el título con el prefijo y el año destacados. Los que no
   siguen el formato (P00951.000, 700/21...) se muestran tal cual. */
function partirNumero(txt) {
  var t = String(txt || '').trim();
  // Número corto (hasta 4 cifras) y año de 4 cifras razonable: si no, un
  // código como "CK13042021-38" se leería como el contrato 13042021 de 2038.
  var m = t.match(/^([A-Za-z]{1,4})\s*(\d{1,4})\s*([-\/])\s*(\d{4})\b(.*)$/);
  if (!m) return null;
  var anio = +m[4];
  if (anio < 2000 || anio > new Date().getFullYear() + 2) return null;
  return {
    prefijo: m[1].toUpperCase(),
    cuerpo: m[2],   // con los ceros, como está escrito
    numero: +m[2], sep: m[3], anio: anio,
    resto: m[5] || ''
  };
}

var ORDENES_CTR = [
  ['recientes', 'Más recientes primero'],
  ['antiguos', 'Más antiguos primero'],
  ['cliente', 'Cliente (A → Z)'],
  ['exportador', 'Exportador (A → Z)'],
  ['saldo', 'Mayor saldo pendiente'],
  ['avance', 'Menos avanzados']
];

function ordenarContratos(lista, orden) {
  var t = function (r) { return esFecha(r.fecha) ? r.fecha.getTime() : null; };
  var txt = function (v) { return String(v || '').toLowerCase(); };
  var f = {
    // Los que no tienen fecha van al final, en los dos sentidos.
    recientes: function (a, b) {
      var x = t(a), y = t(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1; if (y === null) return -1;
      return y - x;
    },
    antiguos: function (a, b) {
      var x = t(a), y = t(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1; if (y === null) return -1;
      return x - y;
    },
    cliente: function (a, b) { return txt(a.importador).localeCompare(txt(b.importador), 'es'); },
    exportador: function (a, b) { return txt(a.exportador).localeCompare(txt(b.exportador), 'es'); },
    saldo: function (a, b) { return (b.saldo || 0) - (a.saldo || 0); },
    avance: function (a, b) {
      var x = a.pct === null ? 2 : a.pct, y = b.pct === null ? 2 : b.pct;
      return x - y;
    }
  }[orden];
  return f ? lista.slice().sort(f) : lista;
}

/* --- Filtros de contratos ---------------------------------------------------
   Cada grupo (búsqueda, estado, vía, tipo, exportador, importador) se aplica
   sobre todos los demás. Pidiendo «todo menos este grupo» cada selector puede
   decir cuántos contratos quedarían con cada opción. */
// Todo lo que se puede buscar de un contrato, sin tildes ni mayúsculas.
function textoBuscableContrato(r) {
  var partes = [r.contrato, r.importador, r.exportador, r.producto, r.tipo, r.periodo, r.via ? VIA_TXT[r.via] : '',
    r.cond && r.cond.texto, r.fecha instanceof Date ? fmtFecha(r.fecha) : ''];
  (r.embarques || []).forEach(function (e) { partes.push(e.bl, e.booking, e.invoice, e.vessel); });
  var hay = clave(partes.filter(Boolean).join(' '));
  return { hay: hay, compacto: hay.replace(/[^a-z0-9]/g, '') };
}

// «lt 033», «LT033», «maní newsan», «qdtx2021223»: cada palabra tiene que aparecer, en cualquier orden,
// con o sin guiones y espacios de por medio.
function coincideBusqueda(txt, palabras) {
  return palabras.every(function (p) {
    var c = p.replace(/[^a-z0-9]/g, '');
    return txt.hay.indexOf(p) >= 0 || (c && txt.compacto.indexOf(c) >= 0);
  });
}

function contratosFiltrados(omitir) {
  var lista = calcularContratos();
  var q = clave(S.busca);
  var palabras = q ? q.split(' ').filter(Boolean) : [];

  if (omitir !== 'q' && palabras.length) lista = lista.filter(function (r) {
    return coincideBusqueda(textoBuscableContrato(r), palabras);
  });

  if (omitir !== 'estado') {
    if (S.fContrato === 'abiertos') lista = lista.filter(function (r) { return r.saldo > 0.5; });
    if (S.fContrato === 'completos') lista = lista.filter(function (r) { return r.saldo !== null && r.saldo <= 0.5; });
    if (S.fContrato === 'excedidos') lista = lista.filter(function (r) { return r.saldo !== null && r.saldo < -0.5; });
    if (S.fContrato === 'sin_contrato') lista = lista.filter(function (r) { return r.huerfano; });
    if (S.fContrato === 'sin_firma') {
      var pend = {};
      firmasPendientes().forEach(function (x) { pend[clave(x.nombre)] = 1; });
      lista = lista.filter(function (r) { return pend[clave(r.contrato)]; });
    }
    if (S.fContrato === 'con_embarques') lista = lista.filter(function (r) { return r.embarques.length; });
    // Sin elegir nada, solo tienen sentido los contratos con movimiento o con saldo pendiente.
    // «Todos» los muestra todos, también los viejos ya completos.
    // Pero si estás BUSCANDO, se busca en todos: un contrato completo y viejo existe aunque no tenga movimiento.
    if (!S.fContrato && !palabras.length) lista = lista.filter(function (r) { return r.embarques.length || r.saldo > 0.5; });
  }

  if (omitir !== 'via') {
    if (S.fVia === 'maritimo' || S.fVia === 'terrestre') {
      lista = lista.filter(function (r) { return r.via === S.fVia; });
    } else if (S.fVia === 'sin') {
      lista = lista.filter(function (r) { return !r.via; });
    }
  }
  if (omitir !== 'tipo' && S.fTipoCtr) {
    lista = lista.filter(function (r) { return r.tipos.indexOf(S.fTipoCtr) >= 0; });
  }
  if (omitir !== 'exp' && S.fExpCtr) {
    lista = lista.filter(function (r) { return clave(r.exportador) === clave(S.fExpCtr); });
  }
  if (omitir !== 'imp' && S.fImpCtr) {
    lista = lista.filter(function (r) { return clave(r.importador) === clave(S.fImpCtr); });
  }
  if (omitir !== 'mes' && S.fMesCtr) {
    lista = lista.filter(function (r) {
      return r.per && (S.fMesCtr === 'prompt' ? r.per.modo === 'prompt' : r.per.meses.indexOf(Number(S.fMesCtr)) >= 0);
    });
  }
  return lista;
}

// Los nombres distintos de un campo, con cuántos contratos tiene cada uno. «ADECOAGRO
// SA» y «Adecoagro SA» son la misma empresa: se juntan y se muestra la forma más usada.
function opcionesNombres(lista, campo, elegido) {
  var por = {};
  lista.forEach(function (r) {
    var n = String(r[campo] || '').trim();
    if (!n) return;
    var k = clave(n);
    por[k] = por[k] || { n: 0, vars: {} };
    por[k].n++; por[k].vars[n] = (por[k].vars[n] || 0) + 1;
  });
  var out = Object.keys(por).map(function (k) {
    var v = por[k].vars;
    var nombre = Object.keys(v).sort(function (a, b) { return v[b] - v[a] || a.localeCompare(b, 'es'); })[0];
    return { nombre: nombre, n: por[k].n, k: k };
  });
  // Lo elegido siempre tiene que poder verse, aunque los otros filtros lo dejen en 0.
  if (elegido && !por[clave(elegido)]) out.push({ nombre: elegido, n: 0, k: clave(elegido) });
  return out.sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); });
}

function selectorNombres(id, tipo, rotulo, todos, opciones, elegido) {
  var e = clave(elegido);
  return '<select id="' + id + '" class="cf-sel cf-plegable' + (elegido ? ' activo' : '') + '" data-ctrfiltro="' + tipo + '" ' +
    'aria-label="Filtrar por ' + rotulo + '">' +
    '<option value="">' + todos + '</option>' +
    opciones.map(function (o) {
      return '<option value="' + esc(o.nombre) + '"' + (o.k === e ? ' selected' : '') + '>' +
        esc(o.nombre) + ' (' + o.n + ')</option>';
    }).join('') + '</select>';
}

/* ===========================================================================
   Período de embarque: el control del formulario (alta de contrato y editor), el filtro «Embarca en»,

var COLS_PERIODO = [['perModo', 'Modo embarque'], ['perDesde', 'Embarque desde'], ['perHasta', 'Embarque hasta'], ['perPartidas', 'Partidas embarque']];

// Lo que se está editando: se arma de lo que ya dice el contrato (o vacío, en el alta).
function perDesdeInterpretado(p) {

    partidas: (p.partidas || []).map(function (x) { return { m: x.m, y: x.y, tn: x.tn ? String(x.tn).replace('.', ',') : '' }; }),
    texto: p.modo === 'texto' || (!p.modo && p.texto) ? (p.texto || '') : '', aviso: '' };
  if (!p.modo && p.texto) st.modo = 'texto';
  if (st.partidas.length < 2) while (st.partidas.length < 2) st.partidas.push({ m: 0, y: 0, tn: '' });
  if (p.revisar) st.aviso = p.modo === 'partidas'
    ? 'Dice contenedores, no toneladas: completá las toneladas de cada mes.'

}
function perEstado(ctx) {

      var o = dueno.orig || {};

// Lo que impide guardar (vacío si está bien).
function perError(st, textoOrig) {

    if (d !== h || ((st.d.m || st.d.y || st.h.m || st.h.y) && !(d && h))) return 'Elegí el mes de inicio y el de fin (mes y año).';
    if (d && mesKey(st.d) > mesKey(st.h)) return 'El mes final es anterior al inicial.';
  } else if (st.modo === 'partidas') {
    var vistos = {}, i;
    for (i = 0; i < st.partidas.length; i++) {

      if (!x.m || !x.y) return 'En la partida ' + (i + 1) + ' falta el mes o el año.';
      if (vistos[mesKey(x)]) return mesTxt(x) + ' está repetido: juntá las toneladas en una sola partida.';
      vistos[mesKey(x)] = 1;
    }
  }
  // Borrar el período de un contrato que lo tenía tiene que ser a propósito («Otro» y vacío), no por dejar algo a medias.
  if (textoOrig && st.modo !== 'texto' && !periodoATexto(perAProps(st))) return 'Falta completar el período (o elegí «Otro» y dejalo vacío para borrarlo).';

}
function perAnioSugerido(m) {
  var a = ahoraComoUTC(), y = a.getUTCFullYear();
  return m < a.getUTCMonth() + 1 - 6 ? y + 1 : y;
}
// path: 'd.m' | 'd.y' | 'h.m' | 'h.y' | 'p.<i>.m' | 'p.<i>.y' | 'p.<i>.tn' | 'texto'
function perPoner(st, path, v) {
  var q = path.split('.'), n = parseInt(v, 10) || 0, o;
  if (path === 'texto') { st.texto = v; return; }
  if (q[0] === 'p') o = st.partidas[+q[1]]; else o = st[q[0]];
  if (!o) return;

  if (k === 'tn') o.tn = v; else o[k] = n;
  if (k === 'm' && n && !o.y) o.y = perAnioSugerido(n);          // al elegir el mes se propone el año
  if (q[0] === 'd' && st.d.m && st.d.y) {                        // el fin acompaña al inicio para que no quede un rango roto
    if (!(st.h.m && st.h.y) || mesKey(st.h) < mesKey(st.d)) st.h = { m: st.d.m, y: st.d.y };

}
function perTnTotal(ctx) {
  var tot = 0, hay = false, add = function (v) { var n = normNum(v); if (n) { tot += n; hay = true; } };
  if (ctx === 'alta') productosAlta(S.alta || {}).forEach(function (p) { add(p.toneladas); });
  else if (S.editCtr) {
    var e = S.editCtr, ref = S.ctrEditables.get(e.contrato), filas = filasDelContrato(ref);
    if (filas.length > 1) {
      filas.forEach(function (fr, i) {
        var k = 'prod_' + i + '_tns';
        add(k in e.cambios ? e.cambios[k] : (fr.mapa.tns === undefined ? null : fr.celdas[fr.mapa.tns]));
      });
    } else add('tns' in e.cambios ? e.cambios.tns : e.orig.tns);

// Los mensajes de abajo del control (se refrescan al teclear sin redibujar todo).
function perMensajesHtml(ctx) {
  var st = perEstado(ctx);
  if (!st) return '';
  var textoOrig = ctx === 'ctr' && S.editCtr ? String(S.editCtr.orig.periodo || '').trim() : '';
  var err = perError(st, textoOrig), p = perAProps(st), h = '';
  if (st.aviso) h += '<p class="per-aviso">' + esc(st.aviso) + '</p>';

    var total = perTnTotal(ctx);
    if (algunaTn) {
      var difiere = total !== null && Math.abs(suma - total) > 0.5;
      h += '<p class="per-total' + (difiere ? ' difiere' : '') + '">Suman <b>' + fmtTnPer(suma) + ' tn</b>' +

function perSelMes(ctx, path, val, etiqueta) {

function perSelAnio(ctx, path, val, etiqueta) {

    '<option value="0">Año</option>' + ys.map(function (a) {

}
function periodoCtlHtml(ctx) {

/* --- Filtro «Embarca en: [mes]» --------------------------------------------- */

/* --- Columnas nuevas en la planilla ------------------------------------------ */

async function crearColumnasPeriodo() {
  S.perCols = { paso: 'haciendo' }; pintar();
  var hechas = [];
  try {
    var falta = columnasPeriodoFaltan();
    for (var i = 0; i < falta.length; i++) {
      var tab = falta[i].tab;
      var h = await leerHoja(S.cfg.sheetId, tab);
      var mapa = detectar(h.encabezados, CAMPOS_CTR).mapa;
      var nuevos = COLS_PERIODO.filter(function (c) { return mapa[c[0]] === undefined; });
      if (!nuevos.length) continue;
      var meta = await api(BASE + S.cfg.sheetId + '?fields=' + encodeURIComponent('sheets(properties(sheetId,title,gridProperties))'));
      var hoja = (meta.sheets || []).filter(function (x) { return x.properties.title === tab; })[0];
      if (!hoja) throw new Error('No encuentro la pestaña «' + tab + '».');
      var ult = -1;
      h.encabezados.forEach(function (x, j) { if (x !== null && x !== undefined && String(x).trim() !== '') ult = j; });
      var pos = ult + 1, fe = h.filaEncabezado, sid = hoja.properties.sheetId, reqs = [];
      var ancho = hoja.properties.gridProperties ? hoja.properties.gridProperties.columnCount : null;
      if (ancho !== null && pos + nuevos.length > ancho) {
        reqs.push({ appendDimension: { sheetId: sid, dimension: 'COLUMNS', length: pos + nuevos.length - ancho } });
      }
      nuevos.forEach(function (c, j) {
        reqs.push({ updateCells: { range: { sheetId: sid, startRowIndex: fe - 1, endRowIndex: fe, startColumnIndex: pos + j, endColumnIndex: pos + j + 1 },
          rows: [{ values: [{ userEnteredValue: { stringValue: c[1] } }] }], fields: 'userEnteredValue' } });
      });
      if (ult >= 0) {                                  // mismo formato que el último encabezado
        reqs.push({ copyPaste: { source: { sheetId: sid, startRowIndex: fe - 1, endRowIndex: fe, startColumnIndex: ult, endColumnIndex: ult + 1 },
          destination: { sheetId: sid, startRowIndex: fe - 1, endRowIndex: fe, startColumnIndex: pos, endColumnIndex: pos + nuevos.length },
          pasteType: 'PASTE_FORMAT', pasteOrientation: 'NORMAL' } });
      }
      await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requests: reqs }) });
      hechas.push(tab);
    }
    S.perCols = null;
    S.avisoOk = hechas.length ? 'Listo: agregué las columnas del período en ' + hechas.map(function (x) { return '«' + x + '»'; }).join(' y ') + '.' : null;
    await cargarTodo();
  } catch (e) {
    S.perCols = { paso: 'confirmar', error: 'No se pudieron crear las columnas: ' + e.message + (hechas.length ? ' (ya se crearon en ' + hechas.join(', ') + ')' : '') };
    pintar();
  }
}

// Combo reutilizable: el alta de contratos y la edición usan el mismo.
//
// El desplegable vive en su propio contenedor con id fijo. Al tipear se
// regenera SOLO esa lista en vez de redibujar la pantalla entera: con 500
// importadores y cientos de contratos de fondo, el redibujado completo por
// cada tecla hacía que se trabara.
// Guardar cambios de un contrato. Se escribe celda por celda solo lo que
// cambió, y nunca sobre las columnas con fórmula (Total, Comisión, ENT, Saldo).
var CAMPOS_EDIT_CTR = [
  ['via', 'Marítimo o terrestre', 'via'],
  ['fecha', 'Fecha', 'date'],
  ['contrato', 'Número de contrato', 'text'],
  ['exportador', 'Exportador', 'combo'],
  ['importador', 'Importador', 'combo'],
  ['producto', 'Producto', 'combo'],
  ['tipo', 'Tipo', 'combo'],
  ['tns', 'Toneladas', 'number'],
  ['precio', 'Precio USD/tn', 'number'],
  ['packaging', 'Packaging', 'text'],
  ['incoterm', 'Incoterm', 'text'],
  ['formaPago', 'Forma de pago', 'pago'],
  ['periodo', 'Período de embarque', 'periodo'],
  ['pagosUsa', 'Pagos USA', 'text'],
  ['firmaExp', 'Firmado por el exportador', 'check'],
  ['firmaImp', 'Firmado por el importador', 'check']
];

// Al editar un contrato de varias filas: lo que es del CONTRATO se escribe en
// todas; lo que es de cada PRODUCTO, solo en la suya.
var CAMPOS_COMUNES = ['via', 'fecha', 'contrato', 'exportador', 'importador', 'incoterm',
                      'formaPago', 'periodo', 'perModo', 'perDesde', 'perHasta', 'perPartidas', 'pagosUsa', 'firmaExp', 'firmaImp'];
var CAMPOS_PRODUCTO = ['producto', 'tipo', 'tns', 'precio', 'packaging'];

function filasDelContrato(ref) {
  if (!ref) return [];
  return [ref].concat(ref.otras || []);
}

// Actualiza el "N cambios sin guardar" y el botón Guardar sin redibujar el
// panel: así escribir o tildar no mueve nada en pantalla.
function refrescarBarraCtr() {
  if (!S.editCtr || typeof document === 'undefined' || !document.querySelector) return;
  var n = Object.keys(S.editCtr.cambios).length;
  var lbl = document.querySelector('.ctr-cambios');
  if (lbl) lbl.textContent = n ? n + (n === 1 ? ' cambio sin guardar' : ' cambios sin guardar')
                                : 'Sin cambios';
  var btn = document.querySelector('.btn-guardar-ctr');
  if (btn) btn.disabled = !n || !!S.guardandoCtr || !!(S.editCtr.per && perError(S.editCtr.per, String(S.editCtr.orig.periodo || '').trim()));
}

async function guardarContrato() {
  var e = S.editCtr;
  if (!e) return;
  var ref = S.ctrEditables.get(e.contrato);
  if (!ref) { S.editCtrError = 'No encontré la fila de este contrato.'; return pintar(); }

  var reqs = [];
  var filas = filasDelContrato(ref);
  var tipoDe = {};
  CAMPOS_EDIT_CTR.forEach(function (c) { tipoDe[c[0]] = c[2]; });

  var convertir = function (campo, val) {
    var t = tipoDe[campo];
    if (t === 'check') return val === true;
    if (t === 'number' || campo === 'tns' || campo === 'precio') {
      return val === '' ? '' : parseFloat(val);
    }
    if (t === 'date' && val !== '') {
      var dc = normFecha(val);
      if (!esFecha(dc)) throw new Error('La fecha "' + val + '" no se entiende. Usá DD/MM/AAAA.');
      return dc;
    }
    return val;
  };

  var escribir = function (fr, campo, val) {
    var idx = fr.mapa[campo];
    if (idx === undefined) return;
    reqs.push({
      updateCells: {
        range: { sheetId: fr.sheetId, startRowIndex: fr.fila - 1, endRowIndex: fr.fila,
                 startColumnIndex: idx, endColumnIndex: idx + 1 },
        rows: [{ values: [{ userEnteredValue: aValorSheets(val) }] }],
        fields: 'userEnteredValue'
      }
    });
  };

  // 1. Lo del contrato va a TODAS sus filas.
  Object.keys(e.cambios).forEach(function (campo) {
    if (campo.indexOf('prod_') === 0) return;
    if (CAMPOS_PRODUCTO.indexOf(campo) >= 0 && filas.length > 1) return;
    var val = convertir(campo, e.cambios[campo]);
    (CAMPOS_COMUNES.indexOf(campo) >= 0 ? filas : [ref]).forEach(function (fr) {
      escribir(fr, campo, val);
    });
  });

  // 2. Lo de cada producto, a su fila: los cambios llegan como prod_<i>_<campo>.
  Object.keys(e.cambios).forEach(function (k) {
    var m = k.match(/^prod_(\d+)_(\w+)$/);
    if (!m) return;
    var fr = filas[+m[1]];
    if (!fr) return;
    escribir(fr, m[2], convertir(m[2], e.cambios[k]));
  });

  if (!reqs.length) { S.editCtr = null; return pintar(); }

  S.guardandoCtr = true; S.editCtrError = null; pintar();
  try {
    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: reqs })
    });
    S.editCtr = null;
    S.avisoOk = 'Contrato ' + e.contrato + ' actualizado en "' + ref.tab + '".';
    await cargarTodo();
  } catch (err) {
    S.editCtrError = 'No se pudo guardar: ' + err.message;
  } finally {
    S.guardandoCtr = false; pintar();
  }
}

function panelContrato() {
  var e = S.editCtr;
  var ref = S.ctrEditables.get(e.contrato);
  var L = S.listas || { exportadores: [], importadores: [], productos: [], tipos: [] };

  var v = function (campo) {
    if (campo in e.cambios) return e.cambios[campo];
    return e.orig[campo] == null ? '' : String(e.orig[campo]);
  };

  var listaDe = {
    exportador: L.exportadores, importador: L.importadores,
    producto: L.productos, tipo: L.tipos
  };

  var fuera = [];
  var filasCtr = filasDelContrato(ref);
  var multi = filasCtr.length > 1;

  var campos = CAMPOS_EDIT_CTR.filter(function (c) {
    if (c[2] === 'check') return false;          // las firmas van arriba
    // Con varios productos, lo de cada producto va en su propio bloque.
    if (multi && CAMPOS_PRODUCTO.indexOf(c[0]) >= 0) return false;
    return ref && ref.mapa[c[0]] !== undefined;
  }).map(function (c) {
    var campo = c[0], label = c[1], tipo = c[2], val = v(campo);

    if (tipo === 'combo') {
      var ops = listaDe[campo] || [];
      var ok = ops.some(function (o) { return clave(o) === clave(val); });
      // Solo frena si se TOCÓ ese campo. Muchos contratos viejos tienen nombres
      // que no están en la base, y eso no puede impedir corregir el packaging.
      if (val && !ok && (campo in e.cambios)) fuera.push(label);
      return comboGen('c-' + campo, campo, label, ops, val, ok, 'ctr');
    }
    if (tipo === 'pago') {
      var ops2 = S.formasPago.map(function (f) { return f.texto; });
      return comboGen('c-' + campo, campo, label, ops2, val, true, 'ctr', true);
    }
    if (tipo === 'via') {
      var actualV = normVia(val);
      return '<div class="campo"><label>' + label + '</label><div class="chips" style="margin:0">' +
        [['maritimo', '🚢 Marítimo'], ['terrestre', '🚚 Terrestre']].map(function (o) {
          return '<button data-act="ctrvia" data-v="' + o[0] + '" aria-pressed="' +
            (actualV === o[0]) + '">' + o[1] + '</button>';
        }).join('') + '</div></div>';
    }
    if (tipo === 'check') {
      var marcado = (campo in e.cambios) ? e.cambios[campo] === true
                                         : esVerdadero(e.orig[campo]);
      return '<div class="campo"><button class="sw-firma' + (marcado ? ' on' : '') + '" ' +
        'data-act="firma" data-c="' + campo + '" aria-pressed="' + marcado + '">' +
        '<span class="riel"><span class="bolita"></span></span>' +
        '<span class="et">' + label + '</span>' +
        (marcado ? '<span class="tick">' + ico('check') + '</span>' : '') +
        '</button></div>';
    }
    if (tipo === 'periodo') return periodoCtlHtml('ctr');
    if (tipo === 'date') return campoFecha('c-' + campo, 'data-ectr', campo, label, val);
    return '<div class="campo"><label for="c-' + campo + '">' + label + '</label>' +
      '<input id="c-' + campo + '" data-ectr="' + campo + '" type="' +
      (tipo === 'number' ? 'number' : 'text') + '" value="' + esc(val) + '"></div>';
  }).join('');

  // Las firmas van primero: es lo que más se toca y no tiene sentido buscarlo
  // abajo de once campos.
  var bloqueFirmas = '';
  var refF = S.ctrEditables.get(e.contrato);
  if (refF && (refF.mapa.firmaExp !== undefined || refF.mapa.firmaImp !== undefined)) {
    var swF = function (campo, label) {
      if (refF.mapa[campo] === undefined) return '';
      var on = (campo in e.cambios) ? e.cambios[campo] === true : esVerdadero(e.orig[campo]);
      return '<button class="sw-firma' + (on ? ' on' : '') + '" data-act="firma" ' +
        'data-c="' + campo + '" aria-pressed="' + on + '">' +
        '<span class="riel"><span class="bolita"></span></span>' +
        '<span class="et">' + label + '</span>' +

// Marca en negrita la parte del texto que coincide con lo tipeado.
function resaltar(texto, q) {
  if (!q) return esc(texto);
  var i = clave(texto).indexOf(q);
  if (i < 0) return esc(texto);
  return esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + q.length)) + '</b>' +
         esc(texto.slice(i + q.length));
}

function opcionesCombo(opciones, val) {
  var q = clave(val);
  if (!q) return (opciones || []).slice(0, 9);

  var empiezan = [], contienen = [];
  for (var i = 0; i < opciones.length; i++) {
    var pos = clave(opciones[i]).indexOf(q);
    if (pos === 0) { if (empiezan.length < 9) empiezan.push(opciones[i]); }
    else if (pos > 0) { if (contienen.length < 9) contienen.push(opciones[i]); }
    // Corta apenas junta suficientes: no hace falta recorrer los 500.
    if (empiezan.length >= 9) break;
  }
  return empiezan.concat(contienen).slice(0, 9);
}

// Contratos: los abiertos primero y los cerrados después, aunque se esté
// escribiendo (si no, al buscar se mezclarían).
function opcionesContrato(opciones, val) {
  var q = clave(val), rango = { A: 0, C: 1, '': 2 };
  return (opciones || []).map(function (o, i) {
    var pos = q ? clave(o).indexOf(q) : 0;
    return { o: o, i: i, pos: pos };
  }).filter(function (x) { return x.pos >= 0; }).sort(function (a, b) {
    return (rango[estadoContrato(a.o)] - rango[estadoContrato(b.o)]) ||
           ((a.pos === 0 ? 0 : 1) - (b.pos === 0 ? 0 : 1)) || (a.i - b.i);
  }).slice(0, 12).map(function (x) { return x.o; });
}

function htmlListaCombo(id, campo, opciones, val, ctx, libre) {
  var q = clave(val);
  var esCtr = campo === 'contract';
  var sug = esCtr ? opcionesContrato(opciones, val) : opcionesCombo(opciones, val);

  if (sug.length) {
    return '<div class="combo-lista">' + sug.map(function (o) {
      var est = esCtr ? estadoContrato(o) : '';
      return '<button' + (esCtr ? ' class="co-op"' : '') + ' data-act="combosel2" data-c="' + ctx + ':' + campo + '" ' +
        'data-v="' + esc(o) + '"><span class="co-txt">' + resaltar(o, q) + '</span>' +
        (est ? '<span class="co-est ' + est.toLowerCase() + '" title="' +
          (est === 'A' ? 'Abierto' : 'Cerrado') + '">' + est + '</span>' : '') + '</button>';
    }).join('') +
    (esCtr ? '<p class="co-leyenda"><b class="a">A</b> abierto · <b class="c">C</b> cerrado</p>' : '') +
    '</div>';
  }
  if (q) {
    return '<div class="combo-lista"><p class="sin-match">' +
      (libre
        ? 'No coincide con ninguna condición ya usada. Se puede guardar igual, pero ' +
          'las alertas de cobro no van a funcionar hasta mapearla.'
        : 'Ninguno coincide. Si es nuevo, cargalo en la <b>base de datos</b>.') +
      '</p></div>';
  }
  return '';
}

function comboGen(id, campo, label, opciones, val, ok, ctx, libre) {
  var clave2 = ctx + ':' + campo;
  var abierto = S.combo === clave2;

  return '<div class="campo combo-wrap' + (val && !ok && !libre ? ' malo' : '') + '">' +
    '<label for="' + id + '">' + label +

// Regenera solo el desplegable, sin tocar el resto de la pantalla.
function refrescarCombo(id, campo, opciones, val, ctx, libre) {
  var slot = document.getElementById('cl-' + id);
  if (!slot) return pintar();   // si no está, algo cambió: redibujo completo
  slot.innerHTML = htmlListaCombo(id, campo, opciones, val, ctx, libre);

  // El marco rojo de "no está en la base" se actualiza sin redibujar.
  var wrap = slot.parentNode;
  if (wrap && !libre) {
    var existe = (opciones || []).some(function (o) { return clave(o) === clave(val); });
    wrap.classList[(val && !existe) ? 'add' : 'remove']('malo');
  }
}

// Qué lista corresponde a cada campo, para poder refrescar sin rearmar todo.
function listaDeCampo(campo) {
  var L = S.listas || {};
  if (S.gen) {
    if (/\.nombre$/.test(campo)) {
      var ns = [], vs = {};
      S.empresas.forEach(function (e) { vs[clave(e.nombre)] = 1; ns.push(e.nombre); });
      S.fichasDB.forEach(function (e, k) { if (!vs[k]) { vs[k] = 1; ns.push(e.nombre); } });
      (L.importadores || []).concat(L.exportadores || []).forEach(function (n) {
        if (!vs[clave(n)]) { vs[clave(n)] = 1; ns.push(n); }
      });
      return ns;
    }
    if (campo === 'pago') return (S.formasPago || []).map(function (f) { return f.texto; });
  }
  campo = String(campo).replace(/_\d+$/, '');   // producto_1 -> producto
  if (S.altaEmb) {
    var a = S.altaEmb;
    if (campo === 'exporter') return L.exportadores || [];
    if (campo === 'importer') return L.importadores || [];
    if (campo === 'tipo') return L.tipos || [];
    if (campo === 'product') return productosDe(a.contract) || L.productos || [];
    if (campo === 'contract') return contratosDe(a.exporter, a.importer);
  }
  if (campo === 'exportador') return L.exportadores || [];
  if (campo === 'importador') return L.importadores || [];
  if (campo === 'producto') return L.productos || [];
  if (campo === 'tipo') return L.tipos || [];
  if (campo === 'formaPago') return (S.formasPago || []).map(function (f) { return f.texto; });
  return [];
}

// Escribir para ir acotando, en vez de buscar en una lista de 500. Si lo que
// se escribe no está en la base, no se inventa: hay que darlo de alta ahí
// primero, porque si no el nombre no cruza con nada.
/* Un número de contrato repetido rompe todo lo que cruza por contrato: el
   saldo, los embarques asociados, el advice. Se avisa antes de guardar, no
   después. */
function contratoRepetido(num, exceptoEste) {
  var k = clave(num);
  if (!k) return null;
  var encontrado = null;
  S.contratos.forEach(function (c, nombre) {
    if (encontrado) return;
    if (clave(nombre) !== k) return;
    if (exceptoEste && clave(exceptoEste) === k) return;   // es el mismo que se edita
    encontrado = c;
  });
  return encontrado;
}

function comboAlta(campo, label, opciones, a) {
  var ops = opciones || [];
  var val = a[campo] || '';
  var ok = ops.some(function (o) { return clave(o) === clave(val); });
  return comboGen('a-' + campo, campo, label, ops, val, ok, 'alta');
}

// Los productos del alta. El primero usa los nombres de siempre (producto,
// tipo...), los siguientes llevan sufijo: producto_1, tipo_1...
function productosAlta(a) {
  var n = a.nProd || 1, out = [];
  for (var i = 0; i < n; i++) {
    var k = function (c) { return i === 0 ? c : c + '_' + i; };
    out.push({
      producto: a[k('producto')] || '', tipo: a[k('tipo')] || '',
      toneladas: a[k('toneladas')] || '', precio: a[k('precio')] || '',
      packaging: a[k('packaging')] || ''
    });
  }
  return out;
}

// Producto y calibre de un contrato, tal como están en la planilla. Si el contrato tiene varias filas (varios productos), una por cada una.
function partirProducto(txt) {
  var t = String(txt || '').replace(/\s+/g, ' ').trim();
  var m = t.match(/\b(\d{2,3}\s*\/\s*\d{2,3})\b/);
  if (!m) return { calibre: '', resto: t };
  var resto = (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).replace(/\s+/g, ' ').replace(/^[\s\-–,]+|[\s\-–,]+$/g, '').trim();
  return { calibre: m[1].replace(/\s+/g, ''), resto: resto };
}
function productosDeContrato(r) {
  var ref = S.ctrEditables.get(r.contrato), out = [];
  filasDelContrato(ref).forEach(function (fr) {
    var i = fr.mapa.producto, j = fr.mapa.tns, k = fr.mapa.tipo;
    var prod = i === undefined || fr.celdas[i] == null ? '' : String(fr.celdas[i]).trim();
    var tns = j === undefined ? null : normNum(fr.celdas[j]);
    var tipo = k === undefined || fr.celdas[k] == null ? '' : tipoCtr(fr.celdas[k]);
    if (prod) out.push({ prod: prod, tns: tns, tipo: tipo && tipo !== 'otro' ? tipo : (r.tipos && r.tipos.length === 1 && r.tipos[0] !== 'otro' ? r.tipos[0] : '') });
  });
  if (!out.length && r.producto) {
    String(r.producto).split(' + ').forEach(function (x) {
      if (String(x).trim()) out.push({ prod: String(x).trim(), tns: null, tipo: r.tipos && r.tipos.length === 1 && r.tipos[0] !== 'otro' ? r.tipos[0] : '' });
    });
  }
  return out;
}

function filaContrato(r) {
  var pctTxt = r.pct !== null ? Math.round(r.pct * 100) + '%' : '';
  var estado, cls;
  if (r.contratado === null || r.contratado === undefined) {
    estado = 'sin toneladas en el contrato'; cls = 'hueco';
  } else if (r.saldo > 0.5) {
    estado = 'faltan ' + r.saldo.toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn';
    cls = 'sol';
  } else if (r.saldo < -0.5) {
    estado = 'excedido en ' + (-r.saldo).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn';
    cls = 'nar';
  } else {
    estado = 'completo'; cls = 'ok';
  }

  var barra = r.pct !== null
    ? '<div class="barra"><i style="width:' + Math.round(r.pct * 100) + '%" class="' +
      (r.saldo < -0.5 ? 'exc' : r.saldo <= 0.5 ? 'full' : '') + '"></i></div>' : '';

  var editable = S.ctrEditables.has(r.contrato);
  var ctr = S.contratos.get(r.contrato);
  var viaPill = r.via
    ? '<span class="pill via-' + r.via + '"' +
      (r.viaDeducida ? ' title="No está cargado en la planilla: se deduce de sus embarques"' : '') +
      '>' + (r.via === 'maritimo' ? '🚢' : '🚚') + ' ' + VIA_TXT[r.via] +
      (r.viaDeducida ? '<span class="deduc">?</span>' : '') + '</span>'
    : '<span class="pill hueco" title="Falta cargar si es marítimo o terrestre">' +
      '<span class="pt"></span>Vía sin definir</span>';
  var partes = (ctr && ctr.partes > 1)
    ? '<span class="pill gris" title="El mismo número en ' + ctr.partes +
      ' filas, con productos distintos"><span class="pt"></span>' + ctr.partes +
      ' filas</span>'
    : '';
  var firmas = (ctr && ctr.tieneFirmas)
    ? (function () {
        if (ctr.firmaExp && ctr.firmaImp) {
          return '<span class="pill ok"><span class="pt"></span>Firmado por los dos</span>';
        }
        if (!ctr.firmaExp && !ctr.firmaImp) {
          return '<span class="pill pend"><span class="pt"></span>Sin firmar</span>';
        }
        return '<span class="pill nar"><span class="pt"></span>Falta ' +
          (ctr.firmaExp ? 'el importador' : 'el exportador') + '</span>';
      })()
    : '';
  var tipoPills = r.tipos.map(function (t) {
    var txt = t === 'mani' ? 'Maní' : t === 'aceite' ? 'Aceite' : t === 'expeller' ? 'Expeller'
      : (String(r.tipo || '').trim() || 'Sin tipo');
    return '<span class="pill tipo-' + t + '"><span class="pt"></span>' + esc(txt) + '</span>';
  }).join('');
  var est = estadoContrato(r.contrato);
  var estPill = est
    ? '<span class="pill est-' + est.toLowerCase() + '" title="' + (est === 'A'
        ? 'Contrato abierto (está en «Contratos Abiertos»)' : 'Contrato cerrado (está en «Contratos Cerrados»)') + '">' +
      '<span class="letra">' + est + '</span>' + (est === 'A' ? 'Abierto' : 'Cerrado') + '</span>'
    : '';
  var num = partirNumero(r.contrato);
  var numHtml = num
    ? '<span class="ct-pre">' + esc(num.prefijo) + '</span>' + esc(num.cuerpo) +
      '<span class="ct-anio">' + esc(num.sep + num.anio) + '</span>' +
      (num.resto ? '<span class="ct-resto">' + esc(num.resto) + '</span>' : '')
    : esc(r.contrato);
  var tn = function (n) { return (n || 0).toLocaleString('es-AR', { maximumFractionDigits: 1 }); };

  // Quién le vende a quién, con el rol escrito: sin flechas que adivinar.
  var parte = function (rol, nombre, vacio) {
    return '<div class="ctr-parte"><span class="ctr-rol">' + rol + '</span>' +
      '<span class="ctr-quien"><span class="ctr-nom' + (nombre ? '' : ' vacio') + '" title="' + esc(nombre || '') + '">' +
      esc(nombre || vacio) + '</span>' + (nombre ? bandera(paisDeEmpresa(nombre)) : '') + '</span></div>';
  };

  var datos = [];
  if (r.periodo && !(r.per && r.per.modo && r.per.modo !== 'texto' && !r.per.revisar)) datos.push(['Período de embarque', String(r.periodo), '']);
  if (r.cond && !r.cond.desconocida) datos.push(['Condición de pago', r.cond.texto, '']);
  // Si la planilla trae su propio saldo y no coincide con el calculado,
  // conviene verlo: alguno de los dos está mirando algo que el otro no.
  if (r.fuenteSaldo === 'planilla' && r.entregadoActivo > (r.entregado || 0) + 0.5) {
    datos.push(['Atención', 'las pestañas activas suman ' + tn(r.entregadoActivo) +
      ' tn, más de lo que dice la columna de entregado', ' aviso']);
  }

  var prods = productosDeContrato(r);
  var ref = S.ctrEditables.get(r.contrato);
  var origen = ref ? esc(ref.tab) + ' · fila ' + ref.fila
    : (r.origen ? esc(r.origen) + ' · solo lectura' : '');

  return '<article class="ctr-fila ctr-card ctr-' + cls + (editable ? ' editable' : '') + '" data-tipos="' + esc(r.tipos.join(' ')) + '"' +
    (editable ? ' data-act="ctrabrir" data-k="' + esc(r.contrato) + '" tabindex="0"' : '') + '>' +

    // Arriba: qué contrato es y en qué situación está, de un vistazo.
    '<header class="ctr-cab">' +
      '<div class="ctr-id"><h3 class="ctr-num" title="' + esc(r.contrato) + '">' + numHtml + '</h3>' +
        (esFecha(r.fecha) ? '<span class="ct-fecha">' + fmtFecha(r.fecha) + '</span>' : '') + '</div>' +
      '<div class="ctr-chips">' + estPill + (prods.length ? '' : tipoPills) + viaPill + partes + firmas + '</div>' +
    '</header>' +

    (prods.length
      ? '<div class="ctr-prods" aria-label="Producto y calibre">' + prods.map(function (x) {
          var pp = partirProducto(x.prod);
          var nombre = pp.resto || (pp.calibre ? '' : x.prod);
          var tTxt = x.tipo === 'mani' ? 'Maní' : x.tipo === 'aceite' ? 'Aceite' : x.tipo === 'expeller' ? 'Expeller' : '';
          // El tipo no se repite si el producto ya lo dice (Expeller / Expeller).
          if (tTxt && clave(nombre) === clave(tTxt)) tTxt = '';
          return '<div class="ctr-ficha" title="' + esc(x.prod) + '">' +
            (pp.calibre ? '<div class="ctr-fcal"><small>CALIBRE</small><strong>' + esc(pp.calibre) + '</strong></div>' : '') +
            '<div class="ctr-ftxt"><div class="ctr-fnom">' + esc(nombre || x.prod) + '</div>' +
              ((tTxt || x.tns) ? '<div class="ctr-fsub">' +
                (tTxt ? '<span class="ctr-ftipo"><i class="tp-' + x.tipo + '"></i>' + tTxt + '</span>' : '') +
                (x.tns ? '<span>' + tn(x.tns) + ' tn</span>' : '') + '</div>' : '') +
            '</div></div>';
        }).join('') + '</div>'
      : '') +

    perFichaHtml(r) +
    '<div class="ctr-cuerpo' + (datos.length ? '' : ' sin-datos') + '">' +
      '<section class="ctr-zona ctr-partes" aria-label="Partes">' +
        parte('Exportador', r.exportador, 'Sin exportador') +
        parte('Importador', r.importador, 'Sin cliente') +
      '</section>' +

      '<section class="ctr-zona ctr-avance" aria-label="Avance">' +
        '<div class="ctr-rotulo">Entregado</div>' +
        '<div class="ctr-tns"><b>' + tn(r.entregado) + '</b>' +
          '<span class="de">' + (r.contratado ? ' de ' + tn(r.contratado) + ' tn' : ' tn') + '</span></div>' +
        (r.pct !== null ? '<div class="ctr-prog">' + barra + '<span class="ctr-pct">' + pctTxt + '</span></div>' : '') +
        '<div class="ctr-estado">' +
          '<span class="pill ' + cls + '"><span class="pt"></span>' + estado + '</span>' +
          (r.embarques.length
            ? '<span class="pill gris"><span class="pt"></span>' + r.embarques.length +
              (r.embarques.length === 1 ? ' embarque activo' : ' embarques activos') + '</span>' : '') +
          (r.aFacturar
            ? '<span class="pill ok"><span class="pt"></span>' + r.aFacturar + ' a facturar</span>' : '') +
        '</div>' +
      '</section>' +

      (datos.length
        ? '<section class="ctr-zona ctr-datos" aria-label="Detalles">' + datos.map(function (d) {
            return '<div class="ctr-dato' + d[2] + '"><em>' + esc(d[0]) + '</em><b>' + esc(d[1]) + '</b></div>';
          }).join('') + '</section>' : '') +
    '</div>' +

    // Abajo, en voz baja: de dónde sale y si se puede tocar.
    '<footer class="ctr-pie">' +
      '<span class="orig">' + origen + '</span>' +
      (r.huerfano ? '<span class="pill nar"><span class="pt"></span>No figura en las pestañas de contratos</span>' : '') +
      (ref ? '<span class="ed">Editar ›</span>' : '') +
    '</footer>' +
    '</article>';
}

// Vista planilla: para quien está acostumbrado a mirar el Sheets y quiere
// encontrar lo mismo donde lo espera. Ancho completo, grilla, números de fila
// reales, colores de siempre, y filtro y orden en cada columna.

var COLS_PLANILLA = ['exporter', 'importer', 'contract', 'product', 'tipo', 'price', 'tns',
  'total', 'etd', 'eta', 'port', 'vessel', 'shippingLine', 'lots', 'containers',
  'bl', 'booking', 'invoice', 'docs', 'pics', 'tr', 'tracking', 'pagoEstimado',
  'commission', 'guia', 'incoterm', 'status'];

function poolColumnas(modo) {
  var base = COLS_PLANILLA.filter(function (c) {
    return fuentesVista().some(function (f) { return f.mapa[c] !== undefined; });
  });
  // La etapa no es una columna de la planilla: se calcula. Sólo la Tabla la ofrece.
  if (modo === 'tabla' || modo === 'planilla') { var k = base.indexOf('docs'); base.splice(k < 0 ? base.length : k, 0, '_etapa'); }
  return base;
}
function columnasDisponibles() { return poolColumnas(S.modo); }
function etqCol(c) { return c === '_etapa' ? 'Etapa' : (defCampo(c) ? defCampo(c).label : c); }

// Cuántas columnas se inmovilizan de verdad (nunca más de las que se ven).
var encabezadoPlanilla = null;
var congActual = 0;   // cuántas columnas inmovilizadas tiene la tabla que se está armando
function congEfectiva(cols) { return Math.min(S.planCong | 0, cols.length); }

/* Ancho de cada columna, como en Sheets: se arrastra el borde del encabezado.
   Lo que no se tocó usa un ancho razonable para lo que lleva; lo que sí, se
   recuerda en este navegador. */
var ANCHO_DEF = {
  exporter: 190, importer: 200, contract: 170, product: 200, tipo: 90, price: 90, tns: 90,
  total: 110, etd: 100, eta: 100, port: 150, vessel: 160, shippingLine: 150, lots: 90,
  containers: 150, bl: 150, booking: 140, invoice: 130, docs: 130, pics: 130, tr: 130,
  tracking: 160, pagoEstimado: 130, commission: 100, guia: 120, incoterm: 100, status: 130, _etapa: 130
};
var ANCHO_MIN = 48, ANCHO_MAX = 900, ANCHO_NRO_BASE = 84, ANCHO_SEL = 34;
function anchoNro() { return S.verFact ? 104 : ANCHO_NRO_BASE; }
function anchoDeCol(c) {
  if (S.anchos[c]) return S.anchos[c];
  // Lo que necesita el nombre (con el embudo y la ×) y, si no, el ancho pensado para el contenido.
  // 67 px de márgenes y botones del encabezado (embudo y ×), 8 por letra, y el ícono
  // de «viene del contrato» o de candado en las columnas que lo llevan.
  var conIcono = CAMPOS_DEL_CONTRATO.indexOf(c) >= 0 || c === 'total';
  var porNombre = Math.ceil(67 + 20 + etqCol(c).length * 8 + (conIcono ? 20 : 0));
  return Math.max(ANCHO_DEF[c] || 140, porNombre);
}

function htmlTablaPlanilla(filas, cols, enc, cuerpo) {
  var tot = anchoNro() + ANCHO_SEL;
  var grupo = '<colgroup><col style="width:' + anchoNro() + 'px"><col style="width:' + ANCHO_SEL + 'px">' +
    cols.map(function (c) {
      var w = anchoDeCol(c); tot += w;
      return '<col data-c="' + c + '" style="width:' + w + 'px">';
    }).join('') + '</colgroup>';
  return '<table class="tbl-hoja fijo' + (congEfectiva(cols) ? ' cong' : '') + '" style="width:' + tot + 'px">' +
    grupo + '<thead>' +
    (enc || encabezadoPlanilla(cols)) + '</thead><tbody>' +
    (cuerpo !== undefined ? cuerpo : filasHtmlPlanilla(filas, cols)) + '</tbody></table>';
}

// Botón «Pintar» y su paleta: pinta el fondo de la celda marcada.
function paletaHtml() {
  var hay = !!(S.celdaAct && filaPorId(S.celdaAct.id));
  var abierto = !!S.menuPintar && hay;
  var actual = hay ? bgDe(filaPorId(S.celdaAct.id), S.celdaAct.c) : null;
  return '<span class="pal-wrap"><button class="btn-pintar" data-act="pintarmenu" aria-haspopup="true" aria-expanded="' + abierto + '" ' +
    'title="Pintar el fondo de la celda marcada, como en Sheets"' + (hay ? '' : ' disabled') + '>' + ico('balde') + 'Pintar</button>' +
    (abierto
      ? '<div class="pal-pop" role="menu" aria-label="Color de fondo">' +
          '<p class="pal-tit">Fondo de la celda</p><div class="pal-grid">' +
          PALETA_BG.map(function (o) {
            var on = claveColor(actual) === claveColor(o[2]);
            return '<button class="pal-sw' + (o[2] ? '' : ' sin') + (on ? ' on' : '') + '" role="menuitemradio" aria-checked="' + on + '" ' +
              'data-act="pintar" data-k="' + o[0] + '" title="' + esc(o[1]) + '" aria-label="' + esc(o[1]) + '"' +
              (o[2] ? ' style="background:' + cssColor(o[2]) + '"' : '') + '>' +
              (o[2] ? '' : '<span aria-hidden="true">⌀</span>') + '</button>';
          }).join('') + '</div>' +
          '<p class="pal-ayuda">Se guarda solo y se pinta también en Sheets.</p></div>'
      : '') + '</span>';
}

function vistaPlanilla(filas) {
  asegurarVistaGrid();
  var todas = columnasDisponibles();
  var cols = todas.filter(function (c) { return !S.colsOcultas[c]; });

  var barra = '<div class="hoja-barra">' +
    '<button class="btn-full" data-act="planfull" aria-pressed="' + !!S.planillaFull + '" ' +
      'title="' + (S.planillaFull ? 'Salir (Esc)' : 'Ver la planilla en pantalla completa') + '">' +
      ico(S.planillaFull ? 'achicar' : 'agrandar') +
      (S.planillaFull ? 'Salir de pantalla completa' : 'Pantalla completa') + '</button>' +
    (Object.keys(S.fCol).some(function (k) { return filtroColActivo(S.fCol[k]); }) || S.ordenCol
      ? '<button data-act="limpiarcol">Quitar filtros de columna</button>' : '') +
    '<button class="btn-com" data-act="comcelda" title="Comentar la celda marcada (Ctrl+Alt+M). También con clic derecho sobre la celda."' +
      ((S.celdaAct && filaPorId(S.celdaAct.id)) ? '' : ' disabled') + '>' + ico('chat') + 'Comentar</button>' +
    paletaHtml() +
    '<span class="sel-info-w">' + selInfoHtml() + '</span>' +
    '<span class="ayuda" style="margin-left:auto">' + filas.length + ' filas</span>' +
    barraPendHtml() +
    menuConfigHtml(true) +
    '</div>';

  function encabezado(c, i) {
    return encabezadoBase(c, i).replace(/<\/th>$/, '<span class="th-resize" data-resize="' + c +
      '" title="Arrastrá para cambiar el ancho · Doble clic: volver al ancho original"></span></th>');
  }

  function encabezadoBase(c, i) {
    if (c === '_etapa') {
      var fijaE = i < congActual;
      return '<th' + (fijaE ? ' class="col-fija" data-fz="' + i + '"' : '') + '><div class="th-in">' +
        '<span class="th-lbl" title="Se calcula sola, según los datos que tiene la carga">Etapa</span>' +
        '<button class="th-x" data-act="ocultar" data-c="_etapa" title="Ocultar columna">×</button></div></th>';
    }
    var act = S.ordenCol && S.ordenCol.campo === c;
    var flecha = act ? (S.ordenCol.dir === 1 ? ' ↑' : ' ↓') : '';
    var filtrada = filtroColActivo(S.fCol[c]);
    var abierta = S.menuCol && S.menuCol.c === c;
    var bloqueada = c === 'total';
    var delCtr = CAMPOS_DEL_CONTRATO.indexOf(c) >= 0;
    var fija = i < congActual;
    var clsTh = [filtrada ? 'th-filtrada' : '', fija ? 'col-fija' : '',
                 bloqueada ? 'th-bloq' : ''].filter(Boolean).join(' ');
    return '<th' + (clsTh ? ' class="' + clsTh + '"' : '') + (fija ? ' data-fz="' + i + '"' : '') +
      '><div class="th-in">' +
      '<button class="th-ord" data-act="ordcol" data-c="' + c + '" title="' +
        (bloqueada ? 'Se calcula solo: precio × toneladas'
          : delCtr ? 'Viene del contrato: cambiarlo acá pide confirmación' : 'Ordenar') + '">' +
        (bloqueada ? '<span class="th-candado">' + ico('candado') + '</span>'
          : delCtr ? '<span class="th-candado">' + ico('enlace') + '</span>' : '') +
        CAMPOS[c].label + flecha + '</button>' +
      // El embudo abre el menú de filtro, como en Sheets.
      '<button class="th-filtro' + (filtrada ? ' on' : '') + (abierta ? ' abierta' : '') + '" ' +
        'data-act="menucol" data-c="' + c + '" ' +
        'title="' + (filtrada ? 'Filtro activo' : 'Filtrar y ordenar') + '" ' +
        'aria-label="Filtrar ' + esc(CAMPOS[c].label) + '">' + ico('embudo') + '</button>' +
      '<button class="th-x" data-act="ocultar" data-c="' + c + '" title="Ocultar columna">×</button>' +
      '</div></th>';
  }

  encabezadoPlanilla = function (colsX) {
    congActual = congEfectiva(colsX);
    return '<tr><th class="nrofila">#</th>' +
      '<th class="sel-col" title="Elegir para el shipment advice">' + ico('mail') + '</th>' +
      colsX.map(encabezado).join('') + '</tr>';
  };
  congActual = congEfectiva(cols);
  var enc = '<tr><th class="nrofila">#</th>' +
              '<th class="sel-col" title="Elegir para el shipment advice">' + ico('mail') + '</th>' +
              cols.map(encabezado).join('') + '</tr>';

  var cuerpo = filasHtmlPlanilla(filas, cols);

  return '<div class="full' + (S.planillaFull ? ' pantalla-completa' : '') + '">' + barra +
    '<div class="hoja">' + htmlTablaPlanilla(filas, cols, enc, cuerpo) + '</div>' +
    '<details class="ayuda-hoja"><summary>Cómo se usa esta tabla</summary><ul>' +
      '<li><b>Marcar filas:</b> clic en el número de la izquierda (Ctrl suma, Mayús marca un tramo, Esc quita). Con filas marcadas aparece «Pasar a A facturar».</li>' +
      '<li><b>Editar:</b> doble clic en una celda (en Docs, Fotos y T.R. también sirve un segundo clic). Enter acepta y Esc cancela. El cambio se guarda solo en un instante (queda en naranja hasta que Google lo confirma).</li>' +
      '<li><b>Pintar:</b> marcá una celda y usá «Pintar». Los colores son los mismos de la planilla.</li>' +
      '<li><b>Columnas:</b> clic en el nombre ordena, el embudo filtra y la × la oculta. Arrastrá el borde para cambiar el ancho; inmovilizar se hace desde Configuración.</li>' +
      '<li>Las columnas con enlace vienen del contrato: se pueden cambiar, pero la revisión avisa si no coinciden. La casilla de al lado elige filas para el shipment advice.</li>' +
    '</ul></details>' +
    '</div>';
}

// Solo las filas del cuerpo de la tabla. Separado para poder redibujar nada más
// esto cuando se tipea en un filtro de columna, sin tocar el resto.
/* El menú de filtro de una columna. Va con posición fija, fuera de la tabla,
   para que el scroll horizontal de la planilla no lo corte. Se edita sobre
   un borrador: recién al tocar Aceptar se aplica, como en Sheets. */
/* El menú se abre debajo del encabezado; si no entra, arriba; y si tampoco, se
   achica la lista. Lo que no puede pasar es que «Aceptar» quede fuera de la
   pantalla (pasaba cuando la tabla estaba más abajo en la página). */
function acomodarMenuCol() {
  var m = document.querySelector && document.querySelector('.menu-col');
  if (!m || !S.menuCol) return;
  var alto = window.innerHeight, h = m.offsetHeight, margen = 8;
  var abajo = S.menuCol.y, arriba = S.menuCol.yArriba;
  if (abajo + h <= alto - margen) return;
  if (arriba && arriba - h >= margen) { m.style.top = (arriba - h) + 'px'; return; }
  var lista = m.querySelector('.mc-lista');
  var espacio = alto - 2 * margen;
  if (lista && h > espacio) lista.style.maxHeight = Math.max(90, lista.offsetHeight - (h - espacio)) + 'px';
  m.style.top = Math.max(margen, alto - m.offsetHeight - margen) + 'px';
}

function menuColumna() {
  var M = S.menuCol;
  if (!M) return '';
  var c = M.c, B = M.borrador;
  var valores = valoresColumna(c);
  var sem = SEMAFOROS.indexOf(c) >= 0;
  var todos = !B.vals;
  var marcado = function (v) { return todos || !!B.vals[v]; };
  var nMarc = todos ? valores.length : valores.filter(function (x) { return B.vals[x.v]; }).length;
  var colorSem = function (v) {
    if (!sem) return '';
    var est = ['ok', 'pendiente', 'atencion', 'vacio'].filter(function (e) {
      return etiqueta(c, e) === v;
    })[0] || 'vacio';
    return '<span class="punto p-' + est + '"></span>';
  };
  var ancho = 290;
