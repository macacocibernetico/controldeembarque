/* Contratos: tarjeta ------------------------------------------------------------
   Tres niveles: qué contrato es y cómo está (arriba), el detalle en tres zonas
   (partes, avance, datos) y de dónde sale (abajo, en voz baja). */
.ctr-card{background:var(--sup);border-radius:var(--r);box-shadow:var(--s1);padding:20px 26px 12px;
  display:block;transition:box-shadow .2s var(--ease)}
.ctr-card.editable{cursor:pointer}
.ctr-card.editable:hover{box-shadow:var(--s2)}
.ctr-card:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

.ctr-cab{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--linea2)}
.ctr-id{display:flex;align-items:baseline;gap:12px;min-width:0;flex:0 1 auto}
.ctr-num{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--tinta);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctr-num .ct-pre{margin-right:1px}
.ctr-num .ct-resto{font-size:14px;margin-left:6px}
.ctr-card .ct-fecha{font-size:13px;color:var(--tinta4)}
.ctr-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;min-width:0}

/* Las etiquetas: todas con la misma forma; el color es lo que informa. */
.ctr-card .pill{padding:3px 11px 3px 9px;border-radius:980px;background:var(--sup2);font-size:12.5px;
  font-weight:500;line-height:1.45;color:var(--tinta2)}
.ctr-card .pill.ok{background:#e6f4ea;color:#137333}
.ctr-card .pill.pend{background:#fce8e6;color:#b3261e}
.ctr-card .pill.sol{background:#e3f2f7;color:#0c6a80}
.ctr-card .pill.nar{background:#fef3e2;color:#9a5b00}
.ctr-card .pill.gris{background:var(--sup2);color:var(--tinta2)}
.ctr-card .pill.hueco{background:none;box-shadow:inset 0 0 0 1px var(--linea3);color:var(--tinta3)}
.ctr-card .pill.tipo-mani{background:#fdf1d6;color:#8a4b08}
.ctr-card .pill.tipo-aceite{background:#eef5d2;color:#44610d}
.ctr-card .pill.tipo-expeller{background:#f1e6da;color:#5b3a1f}
.ctr-card .pill.tipo-otro{background:var(--sup2);color:var(--tinta3)}
.ctr-card .pill.est-a{background:#e6f4ea;color:#137333;font-weight:600}
.ctr-card .pill.est-c{background:#fce8e6;color:#b3261e;font-weight:600}
.ctr-card .pill .letra{width:16px;height:16px;margin:0 6px 0 -3px;font-size:10px}
.ctr-card .pill.est-a .letra{background:#137333;color:#fff}
.ctr-card .pill.est-c .letra{background:#b3261e;color:#fff}
.ctr-card .pill.via-maritimo,.ctr-card .pill.via-terrestre{background:var(--sup2);color:var(--tinta2)}

.ctr-card{container-type:inline-size;container-name:ctrcard}
/* Base: una sola columna. Cada zona se separa de la anterior con una línea. */
.ctr-cuerpo{display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-items:start}
.ctr-zona{min-width:0}
.ctr-cuerpo > .ctr-zona + .ctr-zona{border-top:1px solid var(--linea2);margin-top:14px;padding-top:14px}
/* Con lugar suficiente: dos zonas, y los datos en una fila abajo. */
@container ctrcard (min-width: 620px){
  .ctr-cuerpo{grid-template-columns:minmax(230px,1.15fr) minmax(190px,1fr);gap:0 28px}
  .ctr-cuerpo.sin-datos{grid-template-columns:minmax(230px,1.15fr) minmax(190px,1fr)}
  .ctr-cuerpo > .ctr-zona.ctr-avance{border-top:0;margin-top:0;padding-top:0;border-left:1px solid var(--linea2);padding-left:28px}
  .ctr-cuerpo > .ctr-zona.ctr-datos{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;gap:12px 44px}
}
/* Con mucho lugar: tres zonas lado a lado. */
@container ctrcard (min-width: 940px){
  .ctr-cuerpo:not(.sin-datos){grid-template-columns:minmax(230px,1.3fr) minmax(190px,1fr) minmax(190px,1fr);gap:0 32px}
  .ctr-cuerpo:not(.sin-datos) > .ctr-zona.ctr-datos{grid-column:auto;flex-direction:column;gap:14px;margin-top:0;padding-top:0;
    border-top:0;border-left:1px solid var(--linea2);padding-left:32px}
  .ctr-cuerpo > .ctr-zona.ctr-avance{padding-left:32px}
}
/* Con poco lugar: el rol va arriba del nombre, y los nombres respiran. */
@container ctrcard (max-width: 520px){
  .ctr-parte{grid-template-columns:1fr;gap:2px}
  .ctr-num{font-size:20px}
  .ctr-chips{justify-content:flex-start;width:100%}
}

.ctr-partes{display:flex;flex-direction:column;gap:12px}
.ctr-parte{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:baseline;gap:10px}
.ctr-rol{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta4)}
.ctr-quien{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;min-width:0}
/* Un nombre largo baja de línea entre palabras (nunca letra por letra) y, si es
   larguísimo, se corta a las 3 líneas; el nombre completo está en el tooltip. */
.ctr-nom{font-size:15px;font-weight:600;line-height:1.3;color:var(--tinta);overflow-wrap:break-word;word-break:normal;
  hyphens:manual;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.ctr-nom.vacio{font-weight:400;font-style:italic;color:var(--tinta4)}

.ctr-rotulo{font-size:11.5px;font-weight:500;color:var(--tinta4);margin-bottom:2px}
.ctr-tns{font-size:14px;color:var(--tinta3);font-variant-numeric:tabular-nums;line-height:1.2}
.ctr-tns b{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--tinta)}
.ctr-prog{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.ctr-prog .barra{flex:1;height:8px;margin:0}
.ctr-prog .barra i{opacity:1}
.ctr-pct{font-size:12.5px;font-weight:600;color:var(--tinta3);min-width:34px;text-align:right;
  font-variant-numeric:tabular-nums}
.ctr-estado{display:flex;flex-wrap:wrap;gap:6px}

.ctr-datos{display:flex;flex-direction:column;gap:14px}
.ctr-dato{display:flex;flex-direction:column;gap:3px;min-width:0}
.ctr-dato em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--tinta4)}
.ctr-dato b{font-size:14.5px;font-weight:500;color:var(--tinta);line-height:1.35;overflow-wrap:anywhere}
.ctr-dato.aviso b{color:#9a5b00}

.ctr-pie{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:10px;
  border-top:1px solid var(--linea2);font-size:12px;color:var(--tinta4);min-height:28px}
.ctr-pie .orig{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctr-pie .pill{font-size:11.5px;padding:1px 9px 1px 8px}
.ctr-pie .ed{opacity:.8;color:var(--acento);font-weight:600;white-space:nowrap}
.ctr-card.editable:hover .ctr-pie .ed{opacity:1}

/* Código de país: una chapita igual en todos los sistemas */
.cod2{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--tinta3);background:var(--sup3);
  padding:1px 6px;border-radius:5px;line-height:1.5}

/* Celular: los botones de la barra de arriba no parten su texto. */
@media(max-width:900px){
  .filtros button{white-space:nowrap;flex:0 0 auto}
  .filtros select{padding-right:34px}
  .ctr-card{padding:16px 16px 10px}
}

/* Estado de la sesión de Google */
.lat-sesion{display:flex;align-items:center;gap:8px}
.lat-punto{width:8px;height:8px;border-radius:50%;background:var(--tinta4);flex:none}
.lat-punto.ok{background:#1e8e3e}
.lat-sesion.mala{color:#b3261e;font-weight:600}
.lat-sesion.mala .lat-punto{background:#d93025}
.nav-acc[data-act="reconectar"]{color:#b3261e;font-weight:600}
.aviso-sesion{display:flex;align-items:center;gap:14px;margin:0 0 16px;padding:14px 18px;border-radius:14px;
  background:#fef3e2;box-shadow:inset 0 0 0 1px rgba(217,119,6,.35);color:#6b3f00}
.aviso-sesion p{margin:0;flex:1;font-size:14.5px;line-height:1.45;font-weight:500}
.aviso-sesion .as-ico{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#d93025;
  color:#fff;align-items:center;justify-content:center;flex:none}
.aviso-sesion .as-ico .ico{width:12px;height:12px;stroke-width:3}
.aviso-sesion button{flex:none;min-height:38px}
.tm-sesion{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;font-size:12.5px;
  font-weight:600;color:#b3261e;background:#fce8e6;border-color:transparent}
.tm-sesion .lat-punto{background:#d93025}
@media(max-width:900px){
  .aviso-sesion{flex-wrap:wrap;padding:12px 14px}
  .aviso-sesion p{flex:1 1 calc(100% - 40px)}
  .aviso-sesion button{width:100%}
}

/* Tabla / Planilla: grilla de ancho fijo, como una hoja de cálculo */
.tbl-hoja.fijo{table-layout:fixed}
.tbl-hoja.fijo td,.tbl-hoja.fijo th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:none}
.tbl-hoja.fijo th{overflow:visible}
.tbl-hoja.fijo .th-in{overflow:hidden;min-width:0}
.tbl-hoja.fijo .th-ord{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;flex:0 1 auto}
.tbl-hoja.fijo .th-lbl{overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--tinta)}
.tbl-hoja.fijo .col-fija{max-width:none}
.th-resize{position:absolute;top:0;right:-4px;bottom:0;width:9px;cursor:col-resize;z-index:6;touch-action:none}
.th-resize::after{content:'';position:absolute;left:3px;top:18%;bottom:18%;width:3px;border-radius:2px;background:transparent}
.tbl-hoja th:hover .th-resize::after,.th-resize:hover::after{background:#1a73e8}
body.redimensionando,body.redimensionando *{cursor:col-resize !important;-webkit-user-select:none;user-select:none}
@media(hover:none){.th-resize{width:16px;right:-8px}.th-resize::after{background:#c3c8d0}}

/* Número de fila + botón para abrir el detalle (el clic en la celda ya no lo abre) */
.tbl-hoja .nrofila{position:relative;text-align:right;padding-right:10px}
.tbl-hoja .nrofila .nro{display:inline-block}
.fila-abrir{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;min-height:0;
  padding:0;border:0;border-radius:6px;background:transparent;color:var(--tinta3);opacity:0;
  display:inline-flex;align-items:center;justify-content:center}
.fila-abrir .ico{width:13px;height:13px}
.tbl-hoja tbody tr:hover .fila-abrir,.fila-abrir:focus-visible{opacity:1}
/* «Pasar a A facturar» en cada fila de la Tabla/Planilla: a la derecha del número, como el de abrir pero del otro lado. */
.tbl-hoja .nrofila{min-width:84px;padding-left:30px;padding-right:30px}
.fila-fact{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:24px;height:24px;min-height:0;padding:0;
  display:inline-flex;align-items:center;justify-content:center;opacity:0;border-radius:6px}
.fila-fact .ico{width:14px;height:14px}
.tbl-hoja tbody tr:hover .fila-fact,.fila-fact:focus-visible{opacity:1}
@media(hover:none){.fila-fact{opacity:.85}}
.fila-abrir:hover{background:var(--sup3);color:var(--tinta)}
@media(hover:none){.fila-abrir{opacity:.85}}

/* Celda marcada con un clic */
.tbl-hoja td.cel-act{outline:2px solid #1a73e8;outline-offset:-2px}

/* Cambios sin guardar */
.tbl-hoja td.pend-cel{box-shadow:inset 0 0 0 2px #f5a524}
.tbl-hoja td.pend-cel:not(.col-fija){position:relative}
.tbl-hoja td.pend-cel:not([class*="cel-"]){background:#fff8e6 !important}
.hoja-barra{position:sticky;top:0;z-index:35;background:var(--papel);padding:8px 0;margin-bottom:8px;
  flex-wrap:wrap;align-items:center}
.pend-barra{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:12px;
  background:#fff4d6;box-shadow:inset 0 0 0 1px rgba(217,119,6,.45);color:#6b3f00;flex-wrap:wrap}
.pend-barra b{font-size:13.5px}
.pb-sub{font-size:12.5px;color:#9a5b00}
.pb-punto{width:9px;height:9px;border-radius:50%;background:#f59e0b;flex:none;display:inline-block;margin-right:2px}
.pend-barra button{min-height:34px;font-size:13px}
.ver-nueva{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;
  max-width:calc(100% - 32px);padding:8px 8px 8px 18px;border-radius:980px;background:#1d1d1f;color:#fff;font-weight:600;font-size:14px;
  box-shadow:0 8px 28px rgba(0,0,0,.3)}
.ver-nueva button{min-height:36px;border:0;border-radius:980px;font:inherit;cursor:pointer}
.ver-nueva .vn-ok{padding:0 16px;background:#fff;color:#1d1d1f}
.ver-nueva .vn-x{width:36px;background:transparent;color:#d2d2d7;font-size:20px;line-height:1}
.ver-nueva span{white-space:nowrap}
@media(max-width:900px){.ver-nueva{bottom:84px}}   /* en el celular, arriba de la barra de pestañas */
.pend-flota.con-panel{right:calc(min(520px,100%) + 18px)}   /* con el panel de detalle abierto, a su izquierda: no tapa «Cerrar» */
.pend-flota{position:fixed;top:14px;right:22px;z-index:70;display:inline-flex;align-items:center;gap:8px;
  min-height:38px;padding:0 16px;border-radius:980px;background:#fff4d6;color:#6b3f00;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.18),inset 0 0 0 1px rgba(217,119,6,.5)}

/* Revisión en dos pasos */
.modal-rev{width:min(640px,100%)}
.rev-lista{max-height:min(46vh,420px);overflow:auto;margin:14px -6px 0;padding:0 6px;display:flex;flex-direction:column;gap:12px}
.rev-fila{background:var(--sup2);border-radius:12px;padding:12px 14px}
.rev-fila header{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.rev-fila header b{font-size:14.5px}
.rev-fila header span{font-size:12px;color:var(--tinta3)}
.rev-fila ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rev-cambio{display:grid;grid-template-columns:96px minmax(0,1fr) auto minmax(0,1fr) auto;align-items:baseline;gap:8px;font-size:13.5px}
.rc-campo{font-size:12px;font-weight:600;color:var(--tinta3)}
.rc-antes{color:var(--tinta3);text-decoration:line-through;text-decoration-color:rgba(107,114,128,.5);overflow-wrap:anywhere}
.rc-flecha{color:var(--tinta4)}
.rc-desp{font-weight:600;color:var(--tinta);overflow-wrap:anywhere}
.rc-quitar{min-height:22px;width:22px;padding:0;border-radius:6px;background:none;border:0;color:var(--tinta3);font-size:16px}
.rc-quitar:hover{background:var(--sup3);color:var(--tinta)}
.rc-aviso{grid-column:2 / -1;display:flex;gap:6px;align-items:flex-start;font-size:12px;color:#9a5b00;line-height:1.35}
.rc-aviso .ico{width:13px;height:13px;margin-top:1px;flex:none}
.rev-total{margin:8px 0 0;font-size:13px;color:var(--tinta2)}
.rev-resumen{margin:14px 0 0;padding:12px 16px 12px 30px;background:var(--sup2);border-radius:12px;font-size:13.5px;line-height:1.6}
@media(max-width:900px){
  .rev-cambio{grid-template-columns:1fr auto 1fr auto}
  .rc-campo{grid-column:1 / -1}
  .rc-aviso{grid-column:1 / -1}
  .pend-barra{width:100%}
  .pend-flota,.pend-flota.con-panel{top:58px;right:12px}
}

/* Barra de filtros de Contratos */
.ctr-filtros{background:var(--sup);border-radius:var(--r);box-shadow:var(--s1);padding:14px 16px;margin:0 0 14px;
  display:flex;flex-direction:column;gap:12px}
.cf-fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cf-fila > input{flex:2 1 240px;min-width:190px;max-width:none}
.cf-sel{flex:1.6 1 210px;min-width:190px;max-width:330px;text-overflow:ellipsis}
.cf-sel.activo{border-color:var(--acento);background-color:var(--acentobg);color:var(--acento);font-weight:600}
.cf-orden{flex:0 1 215px;min-width:170px;max-width:240px}
.cf-csv{margin-left:auto;white-space:nowrap}
.cf-grupos{gap:10px 28px}
.cf-grupo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.cf-rot{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta4);min-width:48px;flex:none}
.cf-grupo .chips{margin:0}
.cf-grupo .segmento{margin:0}
.cf-activos{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid var(--linea2)}
.cf-chip{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:2px 3px 2px 11px;border-radius:980px;
  background:var(--acentobg);color:var(--acento);font-size:12.5px;font-weight:600}
.cf-chip .cf-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.cf-chip button{min-height:22px;width:22px;padding:0;border-radius:50%;border:0;background:none;color:inherit;font-size:16px;line-height:1}
.cf-chip button:hover{background:rgba(0,0,0,.08)}
.cf-limpiar{min-height:26px;padding:0 10px;font-size:12.5px;background:none;border:0;color:var(--tinta3);text-decoration:underline}
.lat-version{margin:6px 0 0;font-size:11px;color:var(--tinta4)}
.cf-toggle{display:none}
@media(max-width:900px){
  .ctr-filtros{padding:12px}
  /* Cerrados: sólo el buscador y el botón «Filtros». Los filtros activos se ven igual abajo. */
  .cf-toggle{display:inline-flex;align-items:center;gap:7px;flex:none;min-height:44px;font-weight:600}
  .cf-toggle .cf-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;
    border-radius:980px;background:var(--acento);color:#fff;font-size:11.5px}
  .cf-toggle .cf-flecha{font-size:11px;transition:transform .15s}
  .ctr-filtros.abierto .cf-toggle .cf-flecha{transform:rotate(180deg)}
  .ctr-filtros:not(.abierto) .cf-plegable{display:none}
  .cf-fila > input{flex:1 1 0;min-width:0;max-width:none}
  .cf-sel{flex:1 1 100%;max-width:none}
  .cf-orden{flex:1 1 0;min-width:0}
  .cf-csv{margin-left:0;flex:none}
  .cf-grupo{width:100%}
  .cf-grupo .segmento,.cf-grupo .chips{max-width:100%;overflow-x:auto}
  .cf-chip .cf-txt{max-width:200px}
}

/* «Por exportador»: leyenda de colores */
.leyenda-exp{background:var(--sup);border-radius:14px;box-shadow:0 0 0 1px var(--linea2);margin:0 0 18px;overflow:hidden}
.ley-cab{width:100%;display:flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;background:none;border:0;
  border-radius:0;font-size:14px;font-weight:600;color:var(--tinta);text-align:left}
.ley-cab .ico{width:16px;height:16px;color:var(--tinta3);flex:none}
.ley-cab .ley-t{flex:1}
.ley-fl{color:var(--tinta4);transition:transform .18s var(--ease)}
.leyenda-exp:not(.abierta) .ley-fl{transform:rotate(-90deg)}
.ley-cuerpo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--linea2)}
.ley-grupo{padding:14px 18px 16px}
.ley-grupo + .ley-grupo{border-left:1px solid var(--linea2)}
.ley-grupo h4{margin:0;font-size:13.5px;font-weight:700}
.ley-sub{margin:2px 0 10px;font-size:12px;color:var(--tinta3)}
.ley-grupo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ley-grupo li{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.4;color:var(--tinta2)}
.ley-grupo li > :first-child{flex:none;margin-top:2px;width:26px;display:inline-flex;justify-content:center}
.ley-grupo-barra li > :first-child{width:30px}
.ley-sw{display:inline-flex;height:8px;margin-top:6px !important}
.ley-sw i{flex:1;height:8px}
.ley-grupo .pill{padding:0;font-size:13px}
.ley-grupo .pill .pt{width:10px;height:10px}
.ley-num{min-width:22px;padding:2px 0;line-height:1.3}
.ley-gris{min-width:22px;text-align:center;font-size:12.5px;color:var(--tinta4);margin-top:0 !important}
.ley-nota{margin:10px 0 0;font-size:12px;color:var(--tinta3);line-height:1.4}
@media(max-width:900px){
  .ley-cuerpo{grid-template-columns:1fr}
  .ley-grupo + .ley-grupo{border-left:0;border-top:1px solid var(--linea2)}
  /* En el celular la barra de cada cliente no se muestra, así que tampoco se explica. */
  .ley-grupo-barra{display:none}
}

/* ===== «Por exportador»: revisión de diseño ===================================== */
/* Controles de arriba: ordenar, desplegar todo, plegar todo */
.exp-barra{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:-10px 0 22px}
.exp-barra .segmento.sub{margin:0}
.exp-acc{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.exp-acc select{width:auto;min-height:38px;font-size:13.5px;padding-right:34px}
.exp-acc button{min-height:38px;font-size:13.5px;padding:0 15px;white-space:nowrap}
.exp-acc button[disabled]{opacity:.45;cursor:default}

/* Encabezado del exportador: el nombre es el botón que pliega a sus clientes */
.exp-cab{align-items:center}
.exp-h3{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:700}
.exp-tog{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:44px;margin-left:-6px;padding:0 10px 0 6px;
  background:none;border:0;border-radius:12px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.exp-tog:hover{background:var(--sup2)}
.exp-tog .exp-nom{overflow-wrap:break-word;min-width:0}
.exp-tog .rot-pais{flex:none;margin:0}
.exp-fl,.cli-fl{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  flex:none;color:var(--tinta3);transition:transform .18s var(--ease),background .15s}
.exp-fl .ico,.cli-fl .ico{width:14px;height:14px;stroke-width:2.2}
.exp-fl.on{transform:rotate(90deg);color:var(--acento)}
.exp-tog:hover .exp-fl{background:var(--sup3)}
.exp-cli:hover .cli-fl{background:var(--sup3)}
.cli-bloque.on .cli-fl{background:var(--acentobg)}

/* Columnas de los clientes: rotuladas y alineadas con su encabezado */
.exp-cli,.cli-cab{display:grid;align-items:center;column-gap:12px;
  grid-template-columns:36px minmax(0,1.6fr) minmax(70px,1fr) 92px 56px 56px}
.exp-cli{min-height:48px}
.cli-cab{padding:0 10px;margin:4px 0 2px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta4)}
.cli-cab .cc-tn{text-align:right}
.cli-cab .cc-n,.cli-cab .cc-al{text-align:center}
.exp-cli .cli-tn{min-width:0}
.exp-cli .cli-n{min-width:0;text-align:center}
.exp-cli .cli-al{justify-self:center}

/* Detalle de cada carga */
.cd-fila{container-type:inline-size;container-name:cdfila}
.cd-estado{display:inline-flex;align-items:center;gap:8px;flex:none}
.cd-mas{margin-top:2px}
.cd-mas summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--acento);list-style:none;padding:3px 0;width:max-content}
.cd-mas summary::-webkit-details-marker{display:none}
.cd-mas summary:hover{text-decoration:underline}
.cd-mas[open] summary{color:var(--tinta3)}
.cd-mas b{display:block;margin-top:3px}
/* Con poco lugar: contrato, producto y estado cada uno en su línea (el producto se partía palabra por palabra) */
@container cdfila (max-width: 560px){
  .cd-cab{gap:4px 10px}
  .cd-ctr{flex:1 1 100%;overflow-wrap:anywhere}
  .cd-prod{flex:1 1 100%}
  .cd-estado{flex:1 1 100%;margin-top:2px;flex-wrap:wrap}
}

/* Celular */
@media(max-width:900px){
  /* El nombre del exportador tiene su línea; el total y las alertas, la de abajo (antes se chocaban) */
  .exp-ident{flex:1 1 100%}
  .exp-tot{text-align:left;flex:1}
  .exp-cli,.cli-cab{grid-template-columns:36px minmax(0,1fr) 78px 44px 44px;column-gap:8px}
  .cli-cab .cc-barra{display:none}
  .cli-cab{padding:0 6px}
  .exp-acc{margin-left:0;width:100%}
  .exp-acc select{flex:1 1 100%}
  .exp-acc button{flex:1 1 0}
}

.cd-f{white-space:nowrap}
.cli-n .l,.cli-al .l{display:none}
@media(max-width:900px){
  /* Cada cliente en dos líneas: el nombre entero arriba y, abajo, las cifras con su palabra. */
  .cli-cab{display:none}
  .exp-cli{grid-template-columns:36px minmax(0,1fr) 78px 92px;grid-template-areas:"fl nom nom nom" ". tn n al";
    row-gap:3px;column-gap:10px;padding:9px 6px;min-height:60px;align-items:center}
  .exp-cli .cli-fl{grid-area:fl;grid-row:1 / span 2;align-self:start;margin-top:2px}
  .exp-cli .cli-nom{grid-area:nom;white-space:normal;overflow:visible;flex-wrap:wrap;line-height:1.3}
  .exp-cli .cli-tn{grid-area:tn;text-align:left;font-size:13px;color:var(--tinta2)}
  .exp-cli .cli-n{grid-area:n;text-align:left;font-size:13px;color:var(--tinta3)}
  .exp-cli .cli-n .l,.exp-cli .cli-al .l{display:inline}
  .exp-cli .cli-al{grid-area:al;justify-self:start;padding:2px 10px}
  .exp-cli .cli-al.vacio{display:none}
}

/* ===== Comentarios por celda ===================================================== */
/* La marca de Sheets: triangulito amarillo arriba a la derecha. Gris si ya está todo resuelto. */
.tbl-hoja td.tiene-com:not(.col-fija){position:relative}
.tbl-hoja td.tiene-com::after{content:'';position:absolute;top:0;right:0;border:6px solid transparent;
  border-top-color:#f9ab00;border-right-color:#f9ab00;pointer-events:none}
.tbl-hoja td.tiene-com.com-resueltos::after{border-top-color:#c3c8cf;border-right-color:#c3c8cf}
.tbl-hoja td.nrofila.tiene-com{cursor:pointer}
.btn-com{display:inline-flex;align-items:center;gap:7px}
.btn-com .ico{width:15px;height:15px}
.btn-com[disabled]{opacity:.5}

/* La ventanita pegada a la celda */
.com-pop{position:fixed;z-index:84;width:344px;max-width:calc(100vw - 20px);max-height:min(560px,calc(100vh - 20px));
  display:flex;flex-direction:column;background:var(--sup);border-radius:16px;
  box-shadow:0 0 0 1px var(--linea2),0 18px 50px rgba(15,23,42,.22),0 3px 10px rgba(15,23,42,.1);overflow:hidden}
.com-top{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--linea2);flex:none}
.com-campo{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#8a5a00;background:#fff3d1;
  padding:3px 9px;border-radius:980px}
.com-linea{flex:1;min-width:0;font-size:12.5px;color:var(--tinta3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.com-x{flex:none;width:30px;height:30px;min-height:0;padding:0;border:0;background:none;font-size:20px;line-height:1;color:var(--tinta3);border-radius:50%}
.com-x:hover{background:var(--sup3)}
.com-cuerpo{overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px}

.com-hilo{display:flex;flex-direction:column;gap:10px;padding:10px 0 4px;border-bottom:1px solid var(--linea2)}
.com-hilo:last-child{border-bottom:0}
.com-hilo.resuelto{opacity:.75}
.com-c{display:flex;gap:10px;align-items:flex-start}
.com-av{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center}
.com-cu{flex:1;min-width:0}
.com-meta{display:flex;align-items:baseline;gap:8px;position:relative}
.com-autor{font-size:13.5px;color:var(--tinta)}
.com-t{font-size:12px;color:var(--tinta4);white-space:nowrap}
.com-hilo .com-txt{margin:2px 0 0;font-size:14px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.com-mas-wrap{margin-left:auto;position:relative}
.com-mas{width:26px;height:26px;min-height:0;padding:0;border:0;background:none;border-radius:50%;font-size:17px;line-height:1;color:var(--tinta3)}
.com-mas:hover{background:var(--sup3)}
.com-menu{position:absolute;right:0;top:28px;z-index:3;min-width:150px;background:var(--sup);border-radius:10px;padding:4px;
  box-shadow:0 0 0 1px var(--linea2),0 8px 24px rgba(15,23,42,.18);display:flex;flex-direction:column}
.com-menu button{min-height:34px;text-align:left;border:0;background:none;border-radius:7px;padding:0 10px;font-size:13.5px}
.com-menu button:hover{background:var(--sup2)}
.com-menu .peligro{color:var(--pend)}

.com-ta{width:100%;resize:vertical;min-height:38px;font:inherit;font-size:14px;line-height:1.4;padding:8px 10px;
  border:1px solid var(--linea3);border-radius:10px;background:var(--sup);color:var(--tinta)}
.com-ta:focus{outline:2px solid var(--acento);outline-offset:-1px;border-color:transparent}
.com-resp,.com-nuevoc{display:flex;flex-direction:column;gap:8px}
.com-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:0}
.com-acc .peq,.com-res .peq{min-height:32px;padding:0 13px;font-size:13px}
.com-quien2{margin-left:auto;font-size:12px;color:var(--tinta4)}
.com-res{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px;color:var(--ok);padding-bottom:4px}
.com-nuevo{align-self:flex-start;min-height:34px;padding:0 13px;font-size:13px;border-radius:980px}
.com-resueltos{margin-top:4px}
.com-resueltos summary{cursor:pointer;font-size:13px;color:var(--tinta3);padding:6px 0}

/* Menú de clic derecho */
.com-ctx{position:fixed;z-index:85;min-width:210px;background:var(--sup);border-radius:12px;padding:5px;
  box-shadow:0 0 0 1px var(--linea2),0 12px 36px rgba(15,23,42,.22);display:flex;flex-direction:column}
.com-ctx button{display:flex;align-items:center;gap:9px;min-height:36px;text-align:left;border:0;background:none;
  border-radius:8px;padding:0 11px;font-size:14px}
.com-ctx button:hover{background:var(--sup2)}
.com-ctx .ico{width:15px;height:15px;color:var(--tinta3)}
.com-ctx .atajo{margin-left:auto;font-size:11.5px;color:var(--tinta4)}

/* En el panel de detalle */
.bloque .com-hilo{background:var(--sup2);border-radius:var(--r2);padding:12px 14px;border-bottom:0}
.bloque .com-hilo .com-campo{align-self:flex-start}
.com-sobre-l{font-size:12px;font-weight:600;color:var(--tinta3)}
.com-campo-sel{min-height:38px;font-size:14px}

/* Pestaña «A facturar» */
.ff-com{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;font-size:13px}
.ff-com .ico{width:15px;height:15px}
.ff-com.con{color:#8a5a00;background:#fff3d1;border-color:transparent}

/* Celular: la ventanita sube desde abajo, como una hoja */
@media(max-width:900px){
  .com-pop{left:0 !important;right:0;top:auto !important;bottom:0;width:100%;max-width:none;max-height:78vh;
    border-radius:20px 20px 0 0;padding-bottom:var(--safe);z-index:90}
  .com-ta{font-size:16px}
  .com-ctx{min-width:220px}
}

/* ===== Contratos: búsqueda y tarjetas más prolijas (14/10/2026) ===== */
.ctr-filtros{padding:18px 20px;gap:14px;border-radius:14px}
.cf-fila{gap:10px 12px}
.cf-busca{position:relative;flex:3 1 340px;min-width:200px;display:flex;align-items:center}
.cf-busca input{width:100%;height:46px;padding:0 42px 0 42px;border-radius:12px;border:1px solid var(--linea3);
  background:var(--papel);font-size:15px;transition:border-color .15s,box-shadow .15s,background .15s}
.cf-busca input:focus{background:var(--sup);border-color:var(--acento);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
.cf-lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;color:var(--tinta3);pointer-events:none}
.cf-lupa .ico{width:17px;height:17px;stroke-width:2}
.cf-borrar{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;min-height:0;padding:0;
  display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--sup3);color:var(--tinta2)}
.cf-borrar:hover{background:var(--linea3)}
.cf-borrar .ico{width:12px;height:12px;stroke-width:2.4}
.cf-sel,.cf-orden{height:46px;border-radius:12px}
.cf-rot{min-width:62px}
.conteo{margin:2px 2px 16px;font-size:13.5px}
.conteo b{color:var(--tinta);font-weight:700}
.cf-nota{color:var(--tinta3)}
.ctr-vacio{background:var(--sup);border-radius:14px;box-shadow:var(--s1);padding:34px 20px}
.ctr-vacio p{margin:0 0 8px}
.ctr-vacio .primario{margin-top:10px}

.ctr-card{position:relative;border-radius:14px;padding:22px 28px 14px;border-left:5px solid var(--linea3);
  transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.ctr-card.editable:hover{box-shadow:var(--s2);transform:translateY(-1px)}
.ctr-card.ctr-ok{border-left-color:#16a34a}
.ctr-card.ctr-sol{border-left-color:var(--violeta)}
.ctr-card.ctr-nar{border-left-color:#d97706}
.ctr-card.ctr-hueco{border-left-color:var(--linea3)}
.ctr-num .ct-pre{color:inherit}
.ctr-num{font-size:23px}
.ctr-card .ct-fecha{color:var(--tinta3);font-size:13px;background:var(--sup2);padding:2px 9px;border-radius:980px}
.ctr-card .ctr-cab{border-bottom-color:var(--linea)}
.ctr-card .ctr-nom{font-weight:600}
.ctr-card .barra{height:8px;margin-bottom:12px}
.ctr-card .barra i{opacity:1;background:var(--violeta)}
.ctr-card .barra i.full{background:#16a34a}
.ctr-card .barra i.exc{background:#d97706}
.ctr-card .ctr-pie{border-top-color:var(--linea)}
@media(max-width:600px){
  .ctr-filtros{padding:14px}
  .ctr-card{padding:16px 16px 10px;border-left-width:4px}
  .ctr-num{font-size:20px}
}

/* ===== Pintar el fondo de las celdas ===== */
.pal-wrap{position:relative;display:inline-block}
.btn-pintar{gap:6px}
.btn-pintar .ico{width:14px;height:14px}
.pal-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:60;background:var(--sup);border-radius:12px;padding:12px 14px;
  box-shadow:var(--s3);min-width:208px}
.pal-tit{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta3)}
.pal-grid{display:grid;grid-template-columns:repeat(3,44px);gap:8px}
.pal-sw{width:44px;height:36px;min-height:36px;padding:0;border-radius:8px;border:1px solid rgba(17,24,39,.18);
  display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--tinta3);background:#fff;cursor:pointer}

.saltar{position:fixed;left:12px;top:-60px;z-index:200;background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;

.ayuda-hoja{margin-top:10px;font-size:13px;color:var(--tinta3)}

function clave(s) {
  return String(s == null ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
}

// Exacto primero, para que "etd" no se robe "etd final". Después, parcial.
function detectar(encabezados, catalogo) {
  var mapa = {}, usados = {};
  Object.keys(catalogo).forEach(function (campo) {
    for (var i = 0; i < encabezados.length; i++) {
      if (usados[i]) continue;
      if (catalogo[campo].alias.indexOf(clave(encabezados[i])) >= 0) {
        mapa[campo] = i; usados[i] = 1; return;
      }
    }
  });
  Object.keys(catalogo).forEach(function (campo) {
    if (mapa[campo] !== undefined) return;
    for (var i = 0; i < encabezados.length; i++) {
      if (usados[i]) continue;
      var k = clave(encabezados[i]);
      if (!k) continue;
      var hit = catalogo[campo].alias.some(function (a) { return k === a || k.indexOf(a + ' ') === 0; });
      if (hit) { mapa[campo] = i; usados[i] = 1; return; }
    }
  });
  var extras = [];
  encabezados.forEach(function (h, i) { if (h && !usados[i]) extras.push({ h: h, i: i }); });
  return { mapa: mapa, extras: extras };
}

function letraCol(i) {
  var s = ''; i += 1;
  while (i > 0) { s = String.fromCharCode(65 + (i - 1) % 26) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

function extraerId(entrada) {
  var s = String(entrada || '').trim();
  var m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
  return null;
}

function colorASem(bg) {

/* --- Normalización: la hoja sigue abierta, va a entrar de todo ------------- */

var EPOCH = Date.UTC(1899, 11, 30);

function normFecha(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number') {
    if (v < 25569 || v > 80000) return { invalida: true, crudo: v };
    return new Date(EPOCH + v * 86400000);
  }
  var s = String(v).trim(); if (!s) return null;
  if (/^\d{5}(\.\d+)?$/.test(s)) return normFecha(Number(s));
  var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    var d = +m[1], mes = +m[2], a = +m[3]; if (a < 100) a += 2000;
    var f = new Date(Date.UTC(a, mes - 1, d));
    // Date desborda en silencio: 31/31 da otro mes y 31/02 se vuelve marzo.
    // Si los números no vuelven iguales, la fecha no existe.
    if (isNaN(f) || f.getUTCDate() !== d || f.getUTCMonth() !== mes - 1 ||
        f.getUTCFullYear() !== a) {
      return { invalida: true, crudo: s };
    }
    return f;
  }
  // "28/09" sin año. Es un dato incompleto, no una fecha imposible: se asume el
  // año en curso y después se ajusta contra el ETD si hiciera falta.
  var m2 = s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
  if (m2) {
    var d2 = +m2[1], mes2 = +m2[2];
    if (d2 >= 1 && d2 <= 31 && mes2 >= 1 && mes2 <= 12) {
      var f3 = new Date(Date.UTC(new Date().getFullYear(), mes2 - 1, d2));   // el año de quien mira, no el de Londres
      if (!isNaN(f3)) { f3.anioAsumido = true; f3.crudo = s; return f3; }
    }
    return { invalida: true, crudo: s };
  }

  // «2026-10-12»: JavaScript lo toma como UTC, que es lo que hace falta.
  var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ].*)?$/);
  if (iso) {
    var fi = new Date(Date.UTC(+iso[1], +iso[2] - 1, +iso[3]));
    return (isNaN(fi) || fi.getUTCMonth() !== +iso[2] - 1) ? { invalida: true, crudo: s } : fi;
  }
  // Cualquier otro formato («12 Oct 2026»): lo entiende como fecha local, así que se
  // toma el día de calendario que dice y se lleva a medianoche UTC.
  var f2 = new Date(s);
  return isNaN(f2) ? { invalida: true, crudo: s }
    : new Date(Date.UTC(f2.getFullYear(), f2.getMonth(), f2.getDate()));
}
function esFecha(f) { return f instanceof Date && !isNaN(f); }

function normNum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  var s = String(v).replace(/[^\d,.\-]/g, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (s.indexOf(',') >= 0) s = s.replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// "Comisión Cobrada" / "comisión cobrada" / "Comisión cobrada" -> un valor.
function estadoComision(v) {
  var k = clave(v);
  if (!k) return 'sin_facturar';
  if (k.indexOf('cobrad') >= 0) return 'cobrada';
  if (k.indexOf('facturad') >= 0 || k.indexOf('enviad') >= 0) return 'facturada';
  return 'otro';
}

/* Números escritos a la argentina: el punto separa miles y la coma, decimales.
   "1.295" es mil doscientos noventa y cinco, no uno coma dos; "25,5" es 25.5.
   Si viene con punto decimal y sin coma ("25.5"), también se entiende. */
function numAR(v) {
  if (typeof v === 'number') return v;
  var t = String(v == null ? '' : v).trim().replace(/\s|US\$|USD|\$/gi, '');
  if (!t) return null;
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  var n = Number(t);
  return isFinite(n) ? n : null;
}

function convertir(v, tipo) {
  if (tipo === 'fecha') {
    // El input type=date devuelve yyyy-mm-dd; sin la Z lo toma como local y
    // puede correrse un día según el huso.
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
      var d = new Date(v + 'T00:00:00Z');
      return isNaN(d) ? null : d;
    }
    return normFecha(v);
  }
  if (tipo === 'numero') return normNum(v);
  return v == null ? '' : String(v).trim();
}

function interpretarPago(texto) {
  var s = String(texto || '').trim();
  if (!s) return { desconocida: true, texto: s };
  for (var i = 0; i < MAPEO_PAGO.length; i++) {
    if (MAPEO_PAGO[i].p.test(s)) {
      var r = MAPEO_PAGO[i];
      return { momento:r.momento, disp:r.disp, dias:r.dias, lib:r.lib, medio:r.medio,
               split:r.split, revisar:r.revisar, texto:s };
    }
  }
  return { desconocida: true, texto: s, revisar: true };
}

// null cuando el disparador no es estimable: mejor "esperando despacho" que
// inventar una fecha.
function fechaCobro(cond, emb) {
  if (!cond || cond.desconocida) return null;
  var d = DISPARADORES[cond.disp];
  if (!d || !d.estimable) return null;
  var base = cond.disp === 'eta' ? emb.eta : emb.etd;
  if (!esFecha(base)) return null;
  var f = new Date(base.getTime());
  f.setUTCDate(f.getUTCDate() + (cond.dias || 0));
  return f;
}

var DIA = 86400000;
function dias(a, b) { return Math.round((a - b) / DIA); }

/* «Ahora» para comparar con las fechas de la planilla. Como esas fechas son medianoches
   UTC, «ahora» tiene que ser la hora de reloj de quien mira, puesta en UTC: así una
   carga llega cuando empieza SU día de llegada en tu huso, no unas horas antes ni
   después (con el instante real, en Argentina «llegaba» a las 21:00 del día anterior). */
function ahoraComoUTC() {
  var n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours(), n.getMinutes(), n.getSeconds()));
}

function lleno(emb, c) {
  var v = emb[c];
  if (v === null || v === undefined || v === '') return false;
  if (typeof v === 'object' && v.invalida) return false;
  if (SEMAFOROS.indexOf(c) >= 0) return v !== 'vacio';
  return true;
}

function etapaDe(emb, hoy) {
  if (emb._aFacturar) return 'cobrado';
  if (estadoComision(emb.invCommission) === 'cobrada') return 'cobrado';
  if (esFecha(emb.eta) && emb.eta < hoy) return 'arribado';
  if (lleno(emb, 'bl')) return (esFecha(emb.eta) && emb.eta > hoy) ? 'en_transito' : 'embarcado';
  if (esFecha(emb.etd) && emb.etd < hoy) return 'embarcado';
  return (esFecha(emb.etd) && dias(emb.etd, hoy) <= 21) ? 'pre_embarque' : 'creado';
}

function faltantes(emb, hoy, mapa, noAplica) {
  var hasta = ETAPAS.map(function (e) { return e.id; }).indexOf(etapaDe(emb, hoy));
  var out = [];
  ETAPAS.slice(0, hasta + 1).forEach(function (et) {
    et.req.forEach(function (c) {
      // No se exige lo que no existe en la pestaña, ni lo que está vacío en
      // todas sus filas (en camión no hay BL ni contenedores).
      if (mapa[c] === undefined) return;
      if (noAplica && noAplica[c]) return;
      if (!lleno(emb, c)) out.push(c);
    });
  });
  return out;
}

var NIVEL = { critico: 3, alto: 2, medio: 1 };

var REGLAS = [
  // La cara: mercadería liberada sin cobrar cuando la condición exige cobrar
  // antes. No es un dato viejo, es plata en la calle.
  function (e, c) {
    if (e.tr !== 'ok' || c.noAplica.tr) return null;
    // Si ya pasó a "A facturar", el cliente pagó: no hay nada que reclamar.
    if (e._aFacturar) return null;
    var pol = LIBERACION[c.cond && c.cond.lib];
    if (!pol || pol.antes) return null;
    if (estadoComision(e.invCommission) === 'cobrada') return null;
    var atraso = c.cobro && c.cobro < c.hoy ? dias(c.hoy, c.cobro) : null;
    return { id:'liberado_sin_cobrar', nivel:'critico', titulo:'Liberado sin registro de cobro',
      detalle: atraso
        ? 'T.R. liberado con condición "' + c.cond.texto + '". Vencía hace ' + atraso + ' días y no hay cobro cargado.'
        : 'T.R. liberado con condición "' + c.cond.texto + '", que se cobra antes de liberar. No hay cobro cargado.',
      accion:'Registrar cobro' };
  },

  // Fechas imposibles: hoy nadie las ve.
  function (e, c) {
    var malas = [], lim = c.hoy.getUTCFullYear() + 1;

    else if (esFecha(e.eta) && !e.eta.anioAsumido && e.eta.getUTCFullYear() > lim) malas.push('ETA');
    if (e.etd && e.etd.invalida) malas.push('ETD');
    else if (esFecha(e.etd) && !e.etd.anioAsumido && e.etd.getUTCFullYear() > lim) malas.push('ETD');
    if (esFecha(e.etd) && esFecha(e.eta) && e.eta < e.etd &&
        !e.eta.anioAsumido && !e.etd.anioAsumido) malas.push('ETA anterior al ETD');

  },

  function (e, c) {

    if (esFecha(e.etd) && e.etd.anioAsumido) sinAnio.push('ETD');
    if (esFecha(e.eta) && e.eta.anioAsumido) sinAnio.push('ETA');

  function (e, c) {

      detalle:'Sin BL no se puede avanzar con documentos ni liberación.', accion:'Cargar BL' };
  },

  function (e, c) {
    if (!esFecha(e.etd) || e.etd < c.hoy) return null;
    var d = dias(e.etd, c.hoy); if (d > 14) return null;
    var falta = ['booking', 'containers'].filter(function (k) {
      return c.mapa[k] !== undefined && !c.noAplica[k] && !lleno(e, k);
    });
    if (!falta.length) return null;
    return { id:'embarca_sin_booking', nivel: d <= 5 ? 'alto' : 'medio',
      titulo:'Embarca en ' + d + ' días',
      detalle:'Sin ' + falta.map(function (f) { return CAMPOS[f].label.toLowerCase(); }).join(' ni ') + '.',
      accion:'Completar' };
  },

  function (e, c) {
    if (!c.cobro || c.cobro >= c.hoy) return null;
    if (e._aFacturar) return null;
    if (estadoComision(e.invCommission) === 'cobrada') return null;
    var d = dias(c.hoy, c.cobro); if (d < 3) return null;
    return { id:'cobro_vencido', nivel: d > 30 ? 'critico' : 'alto',
      titulo:'Cobro vencido hace ' + d + ' días',

  // Trámite de terceros: no hay fecha estimable, pero sí se nota si pasó mucho.
  function (e, c) {

  },

  function (e, c) {
    if (!esFecha(e.etdFinal) || !esFecha(e.etdMaximo)) return null;
    if (e.etdFinal <= e.etdMaximo || lleno(e, 'reclamo')) return null;
    return { id:'roleo', nivel:'alto',
      titulo:'Roleo de ' + dias(e.etdFinal, e.etdMaximo) + ' días sobre el máximo',
      detalle:'El ETD final supera el máximo del contrato y no hay reclamo cargado.',
      accion:'Iniciar reclamo' };
  },

  function (e, c) {
    if (c.mapa.invoice === undefined || c.noAplica.invoice) return null;
    if (!esFecha(e.eta) || e.eta >= c.hoy || lleno(e, 'invoice')) return null;
    var d = dias(c.hoy, e.eta); if (d < 7) return null;
    return { id:'arribo_sin_factura', nivel:'alto',
      titulo:'Llegó hace ' + d + ' días sin factura cargada',
      detalle:'No se puede seguir la cobranza sin la factura.', accion:'Cargar factura' };
  },

  // T.R. solicitado y todavía sin recibir. Lo que importa no es hace cuánto
  // embarcó sino cuánto falta para que llegue: el telex tiene que estar antes.
  function (e, c) {
    if (e.tr !== 'atencion' || c.noAplica.tr) return null;
    if (!esFecha(e.eta)) return null;

    var d = dias(e.eta, c.hoy);

    if (d > 0) {
      det = 'Pedido y todavía no llegó. Faltan ' + d + ' días para la ETA (' +
            fmtFecha(e.eta) + ').';

    } else if (d === 0) {
      det = 'Pedido y todavía no llegó. El buque llega hoy.';
      nivel = 'critico';
    } else {
      det = 'Pedido y todavía no llegó. El buque llegó hace ' + (-d) + ' días.';
      nivel = 'critico';

  // comisión al exportador. Es plata nuestra sin emitir.
  function (e, c) {

    if (c.mapa.invCommission === undefined || c.noAplica.invCommission) {
      // La columna no se usa: igual avisamos, pero sin insistir.

        titulo:'Pasó a facturar, comisión sin emitir',
        detalle:'El cliente ya pagó al exportador' +

      detalle:'El cliente ya pagó al exportador y no hay factura de comisión cargada' +
        (e.commission ? '. Son US$ ' + Number(e.commission).toLocaleString('es-AR') : '') + '.',

function evaluar(emb, contrato, hoy, mapa, noAplica) {
  var cond = contrato ? contrato.cond : null;
  var ctx = { hoy: hoy, cond: cond, mapa: mapa, noAplica: noAplica || {}, cobro: fechaCobro(cond, emb) };
  var alertas = [];
  REGLAS.forEach(function (r) {
    try { var a = r(emb, ctx); if (a) alertas.push(a); } catch (err) {}
  });
  var falta = faltantes(emb, hoy, mapa, noAplica);
  if (falta.length) {
    alertas.push({ id:'checklist', nivel: falta.length > 4 ? 'alto' : 'medio',
      titulo: falta.length + (falta.length > 1 ? ' campos sin cargar' : ' campo sin cargar'),
      detalle: falta.map(function (f) { return CAMPOS[f].label; }).join(', '),
      accion:'Completar', campos: falta });
  }
  alertas.sort(function (a, b) { return NIVEL[b.nivel] - NIVEL[a.nivel]; });
  return { etapa: etapaDe(emb, hoy), cobro: ctx.cobro, alertas: alertas,

}

/* ===========================================================================
   Google OAuth + API de Sheets, directo desde el navegador.
   =========================================================================== */

var tokenClient = null;

/* El token de Google dura una hora. Hay tres piezas que lo mantienen vivo sin
   que la persona tenga que hacer nada (ni recargar):
   1. un solo callback del cliente de token, que sabe distinguir una renovación
      silenciosa de un login normal;
   2. renovarToken(), que pide uno nuevo sin molestar;
   3. un fetch envuelto (más abajo) que renueva solo cuando hace falta.
   Si Google exige un clic y no se puede renovar, se avisa (sesionVencida). */
var _renovando = null;   // renovación en curso: { promesa, resolver, timer }
var _loginCb = null;     // qué hacer cuando llega un token del login normal
var _loginErr = null;    // y cuando el login normal falla (popup bloqueado o cerrado)
var MSG_SESION = 'Se venció la sesión de Google. Tocá Conectar con Google para seguir (no hace falta recargar).';

function errorSesion() {
  var e = new Error(MSG_SESION);
  e.sesion = true;
  return e;
}

// Guarda el token y cuándo vence, con 2 minutos de margen para no usarlo justo
// cuando se cae.
function guardarToken(resp) {
  S.token = resp.access_token;
  S.tokenExp = Date.now() + ((resp.expires_in || 3600) - 120) * 1000;
  S.sesionCaida = false;
}

// El único callback del cliente de token. Si hay una renovación en curso, el
// token es de ella: se guarda y se sale, sin pasar por el login normal (que
// recargaría datos y pisaría el estado, y acá es la misma persona).
function _alRecibirToken(resp) {
  if (_renovando) {
    if (resp && resp.access_token && !resp.error) {
      guardarToken(resp);
      _renovando.resolver(true);
    } else {
      _renovando.resolver(false);
    }
    return;
  }
  if (_loginCb) _loginCb(resp);
}

// Popup bloqueado o cerrado. Antes quedaba atado a la primera llamada; ahora
// responde a la que esté en curso.
function _alFallarToken(err) {
  if (_renovando) return _renovando.resolver(false);
  if (_loginErr) _loginErr(err);
}

// El cliente de token se arma una sola vez (y de nuevo si cambia el Client ID).
// Lo usan el login y la renovación, así que ninguna depende de que la otra haya
// pasado antes.
function asegurarCliente() {
  if (tokenClient) return tokenClient;
  if (!window.google || !google.accounts || !google.accounts.oauth2 || !S.cfg || !S.cfg.clientId) return null;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: S.cfg.clientId,
    scope: SCOPE,
    callback: _alRecibirToken,
    // Sin esto, un popup bloqueado o cerrado deja la promesa colgada
    // para siempre y la app se queda "pensando" sin decir nada.
    error_callback: _alFallarToken
  });
  return tokenClient;
}

function pedirToken(interactivo) {
  return new Promise(function (resolve, reject) {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      return reject(new Error('No cargó la librería de Google. Revisá la conexión y recargá.'));
    }

    // Si había una renovación silenciosa esperando, este login pasa por delante.
    if (_renovando) _renovando.resolver(false);

    var listo = false;
    function fallar(msg) { if (!listo) { listo = true; reject(new Error(msg)); } }

    try { asegurarCliente(); }
    catch (e) { return fallar('El Client ID no es válido: ' + e.message); }

    _loginErr = function (err) {
      var t = err && err.type;
      if (t === 'popup_failed_to_open') {
        return fallar('El navegador bloqueó la ventana de Google. Permití las ventanas emergentes para este sitio y probá de nuevo.');
      }
      if (t === 'popup_closed') {
        return fallar('Cerraste la ventana de Google antes de terminar.');
      }
      fallar('No se pudo abrir el login de Google' + (t ? ' (' + t + ')' : '') + '.');
    };

    _loginCb = function (resp) {
      if (listo) return;
      // Quien ya había entrado antes tiene un permiso viejo sin Gmail. Si falta,
      // se vuelve a pedir mostrando el consentimiento, una sola vez.
      try {
        if (!interactivo && resp.access_token && google.accounts.oauth2.hasGrantedAllScopes &&
            !google.accounts.oauth2.hasGrantedAllScopes(resp, GMAIL_SCOPE)) {
          listo = true;
          return pedirToken(true).then(resolve, reject);
        }

        return fallar(resp.error === 'access_denied'

      guardarToken(resp);

    // en vez de quedarnos tildados.
    setTimeout(function () {

             location.origin + ' no está autorizado en el Client ID.');

    try {
      tokenClient.requestAccessToken({ prompt: interactivo ? 'consent' : '' });
    } catch (e) {
      fallar('No se pudo abrir el login: ' + e.message);

/* Pide un token nuevo en silencio. Devuelve una promesa de true/false: nunca
   rechaza. Si ya hay una renovación en curso, devuelve esa misma (varias
   llamadas que fallan a la vez no abren varias ventanas). Si Google necesita un
   clic —popup bloqueado o cerrado— o no contesta en 20 segundos, es false. */
function renovarToken() {
  if (_renovando) return _renovando.promesa;
  try { if (!asegurarCliente()) return Promise.resolve(false); }   // sin la librería de Google o sin Client ID: no hay cómo
  catch (e) { return Promise.resolve(false); }
  var r = {};
  r.promesa = new Promise(function (resolve) {
    r.resolver = function (ok) {
      if (_renovando !== r) return;                  // ya estaba resuelta
      clearTimeout(r.timer);
      _renovando = null;
      resolve(!!ok);
    };
  });
  _renovando = r;
  r.timer = setTimeout(function () { r.resolver(false); }, 20000);
  try {
    tokenClient.requestAccessToken({ prompt: '' });
  } catch (e) {
    r.resolver(false);
  }
  return r.promesa;
}

function cancelarRenovacion() { if (_renovando) _renovando.resolver(false); }

/* No hay forma de renovar sin un clic: se corta la sesión a la vista. El token
   se borra y la pantalla pasa a «Sin autenticar» con un botón para reconectar.
   Nunca queda diciendo «Conectado» con un token muerto. */
function sesionVencida() {
  if (S.sesionCaida) return;
  S.token = null; S.tokenExp = 0; S.sesionCaida = true; S.reconectando = false;
  toast(MSG_SESION, 'error', 10000);
  pintar();
}

// Se llama desde el botón «Conectar con Google»: el popup sale de ese clic.
function reconectar() {
  if (S.reconectando) return;
  S.reconectando = true; pintar();
  pedirToken(false).then(function () {
    S.reconectando = false; S.sesionCaida = false;
    pintar();
    toast('Sesión de Google reconectada', 'ok');
    return identificar().then(function () { pintar(); });
  }).catch(function (e) {
    S.reconectando = false; pintar();
    toast(e.message, 'error');
  });
}

/* --- Un solo punto para todas las llamadas a Google -----------------------
   En vez de tocar cada fetch de la app, se envuelve el fetch del navegador.
   Sólo interviene en llamadas a googleapis.com que llevan «Authorization:
   Bearer …»; todo lo demás pasa tal cual. Antes de llamar, si el token venció
   por reloj, lo renueva; siempre manda el token actual (la llamada pudo

// Los headers pueden venir como objeto, como Headers o como lista de pares.
function _headersPlanos(h) {
  var out = {};
  if (!h) return out;
  if (Array.isArray(h)) h.forEach(function (par) { out[par[0]] = par[1]; });
  else if (typeof h.forEach === 'function') h.forEach(function (v, k) { out[k] = v; });
  else Object.keys(h).forEach(function (k) { out[k] = h[k]; });

function _tieneBearer(o) {

  });

}

function _conToken(o, token) {
  var h = _headersPlanos(o.headers);
  Object.keys(h).forEach(function (k) { if (k.toLowerCase() === 'authorization') delete h[k]; });

globalThis.fetch = async function (input, opciones) {

  }

/* Traduce los errores de Google a algo que se entienda. Nunca se vuelca el
   JSON crudo de la API: eso mostraba "líneas de código" en pantalla. */
function apiDeUrl(url) {
  var u = String(url);
  if (u.indexOf('gmail.googleapis.com') >= 0) return { nombre: 'Gmail API', servicio: 'gmail.googleapis.com' };
  if (u.indexOf('googleapis.com/upload/drive') >= 0 || u.indexOf('googleapis.com/drive') >= 0) {
    return { nombre: 'Google Drive API', servicio: 'drive.googleapis.com' };

    // cuenta ni de permisos. Se dice cuál es y se da el enlace directo.
    var link = (crudo.match(/https:\/\/console\.(?:developers|cloud)\.google\.com\/[^\s"']+/) || [])[0] ||
      'https://console.cloud.google.com/apis/library/' + api.servicio;
    e = new Error('Falta habilitar la ' + api.nombre + ' en tu proyecto de Google Cloud. ' +
      'No es un problema de permisos de tu cuenta. Habilitala, esperá un minuto y probá de nuevo.');
    e.habilitar = { api: api.nombre, url: link };

    e = new Error(api.servicio === 'sheets.googleapis.com'
      ? 'No existe una planilla con ese id, o tu cuenta no tiene acceso.'
      : 'Google no encontró lo que se pidió (' + api.nombre + ').');
  } else if (status === 429) {
    e = new Error('Google está limitando los pedidos. Esperá unos segundos y probá de nuevo.');
  } else if (status >= 500) {
    e = new Error('Google tuvo un problema momentáneo (' + status + '). Probá de nuevo en un rato.');
  } else {
    e = new Error('Google rechazó el pedido: ' + (m.slice(0, 240) || 'error ' + status));
  }

async function api(url, opciones) {
  var token = await conToken();
  var o = opciones || {};
  o.headers = Object.assign({ Authorization: 'Bearer ' + token }, o.headers || {});
  // Renovar el token y reintentar un 401 lo hace el fetch envuelto (arriba): acá
  // sólo hay que distinguir «se cayó la sesión» de «se cayó la conexión».
  var r;
