/* --- Deshacer / Rehacer (Ctrl+Z / Ctrl+Y) --------------------------------------------
   Cubre: cambios de celdas (cada tanda guardada es un paso), eliminar cargas y pasar a facturar. Se guarda
   en memoria de esta pestaña (al recargar la página empieza de cero). Cada paso se vuelve a verificar contra
   la planilla: si la carga ya no está donde estaba, no toca nada y lo explica. */
function histRegistrar(e) {
  S.hist.push(e);
  if (S.hist.length > 40) S.hist.shift();
  S.rehacer = [];
}
function histDesc(e) {
  if (e.tipo === 'celdas') {
    var filasU = {}; e.items.forEach(function (it) { filasU[JSON.stringify(it.identAntes)] = 1; });
    var nf = Object.keys(filasU).length;
    return 'cambio' + (e.items.length === 1 ? '' : 's') + ' en ' + (e.items.length === 1 ? etqCol(e.items[0].campo).toLowerCase() : nf + (nf === 1 ? ' fila' : ' filas'));
  }
  if (e.tipo === 'contrato') return 'eliminar el contrato ' + e.nombre;
  if (e.tipo === 'eliminar') return 'eliminar ' + (e.filas.length === 1 ? e.filas[0].quien : e.filas.length + ' cargas');
  if (e.tipo === 'facturar' && e.inverso) return 'devolver ' + (e.items.length === 1 ? e.items[0].quien : e.items.length + ' cargas') + ' a su pestaña';
  if (e.tipo === 'facturar') return 'pasar a ' + e.hacia + (e.items.length === 1 ? ' ' + e.items[0].quien : ' (' + e.items.length + ' cargas)');
  return 'acción';
}
function cargaPorIdent(tab, id) {
  var c = todasFilas().filter(function (e) {
    return e._tab === tab && clave(e.contract) === clave(id.contract) && clave(e.bl) === clave(id.bl) &&
      clave(e.importer) === clave(id.importer) && Math.abs((normNum(e.tns) || 0) - (normNum(id.tns) || 0)) < 0.0001;
  });
  return c.length === 1 ? c[0] : null;
}

// Copia exacta de una fila (valores tal como se escribieron —con fórmulas— y formato).
async function filaCruda(sheetId, tab, fila) {
  var rango = "'" + tab.replace(/'/g, "''") + "'!A" + fila + ':' + letraCol(MAX_COLS - 1) + fila;
  var campos = 'sheets(data(rowData(values(userEnteredValue,userEnteredFormat))))';
  var d = await api(BASE + S.cfg.sheetId + '?includeGridData=true&ranges=' + encodeURIComponent(rango) + '&fields=' + encodeURIComponent(campos));
  var rd = d.sheets && d.sheets[0] && d.sheets[0].data && d.sheets[0].data[0] && d.sheets[0].data[0].rowData;
  var vals = (rd && rd[0] && rd[0].values) || [];
  if (!vals.length) throw new Error('Google no devolvió el contenido de la fila.');
  return vals;
}
/* Al borrar la primera o la última fila de datos, el rango de las fórmulas de la fila TOTAL se achica; al volver a insertarla,
   Sheets no lo vuelve a agrandar. Por eso, antes de borrar se guarda cómo estaba la fila TOTAL y, al deshacer, se le devuelven sus fórmulas
   (solo si la hoja quedó con las filas en el mismo lugar). */
async function capturarTotal(tab, sheetId) {
  try {
    var f = await filaTotalDe(tab);
    if (!f) return null;
    return { tab: tab, sheetId: sheetId, fila: f, valores: await filaCruda(sheetId, tab, f) };
  } catch (e) { return null; }
}
async function restaurarTotales(totales) {
  var avisos = [];
  var tabs = Object.keys(totales || {});
  for (var i = 0; i < tabs.length; i++) {
    var t = totales[tabs[i]];
    if (!t) continue;
    var f = await filaTotalDe(t.tab);
    if (f !== t.fila) { avisos.push(t.tab); continue; }
    var reqs = [];
    t.valores.forEach(function (cel, k) {
      var uv = cel && cel.userEnteredValue;
      if (uv && uv.formulaValue) reqs.push({ updateCells: { range: { sheetId: t.sheetId, startRowIndex: f - 1, endRowIndex: f, startColumnIndex: k, endColumnIndex: k + 1 },
        rows: [{ values: [{ userEnteredValue: uv }] }], fields: 'userEnteredValue' } });
    });
    if (reqs.length) await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requests: reqs }) });
  }
  return avisos;
}
async function reinsertarFila(f) {
  var reqs = [{ insertDimension: { range: { sheetId: f.sheetId, dimension: 'ROWS', startIndex: f.indice, endIndex: f.indice + 1 }, inheritFromBefore: false } }];
  if (f.valores && f.valores.length) {
    reqs.push({ updateCells: { range: { sheetId: f.sheetId, startRowIndex: f.indice, endRowIndex: f.indice + 1, startColumnIndex: 0, endColumnIndex: f.valores.length },
      rows: [{ values: f.valores }], fields: 'userEnteredValue,userEnteredFormat' } });
  }
  await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requests: reqs }) });
  // Se vuelve a leer: la carga tiene que estar ahí.
  var h = await leerHoja(S.cfg.sheetId, f.tab), mp = detectar(h.encabezados, CAMPOS).mapa;
  ubicarFila(h, mp, f.ident, f.indice + 1);
}
async function borrarPorIdent(f) {
  var h = await leerHoja(S.cfg.sheetId, f.tab), mp = detectar(h.encabezados, CAMPOS).mapa;
  var fila = ubicarFila(h, mp, f.ident, f.indice + 1);
  await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: h.sheetId, dimension: 'ROWS', startIndex: fila.fila - 1, endIndex: fila.fila } } }] }) });
  f.indice = fila.fila - 1;
}
async function moverPorIdent(desdeTab, haciaTab, ident) {
  var h = await leerHoja(S.cfg.sheetId, desdeTab), mp = detectar(h.encabezados, CAMPOS).mapa;
  var f = ubicarFila(h, mp, ident, undefined);
  await moverFila({ tab: desdeTab, sheetId: h.sheetId, mapa: mp, fila: f.fila, celdas: f.celdas, colores: f.colores }, haciaTab);
}

async function aplicarHist(e, atras) {
  if (e.tipo === 'celdas') {
    var creados = 0;
    e.items.forEach(function (it) {
      var emb = cargaPorIdent(it.tab, atras ? it.identDespues : it.identAntes);
      if (!emb) throw new Error('no encuentro la carga (¿alguien la cambió o la movió?). No toqué nada.');
    });
    e.items.forEach(function (it) {
      var emb = cargaPorIdent(it.tab, atras ? it.identDespues : it.identAntes);
      if (encolarNuevo(emb._id, it.campo, atras ? it.antes : it.nuevo, { deHist: true })) creados++;
    });
    if (!creados) return;
    var ok = await asegurarGuardado();
    if (!ok) {
      Object.keys(S.pend).forEach(function (k) { if (S.pend[k].deHist) delete S.pend[k]; });
      S.revision = null; pintar();
      throw new Error('Google no aceptó el cambio. No toqué nada.');
    }
    return;
  }
  if (e.tipo === 'contrato') {
    if (atras) {
      for (var ic = e.filas.length - 1; ic >= 0; ic--) await reinsertarFilaCtr(e.filas[ic], e.nombre);
      var sinTotalC = await restaurarTotales(e.totales);
      if (sinTotalC.length) toast('Revisá la fila TOTAL de «' + sinTotalC.join('», «') + '»: la hoja cambió y no pude devolverle sus fórmulas.', 'error', 9000);
    } else {
      var frescas = await filasFrescasDeContrato(e.nombre);
      if (!frescas.length) throw new Error('el contrato ya no está en la planilla.');
      await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: frescas.map(function (f) {
          return { deleteDimension: { range: { sheetId: f.sheetId, dimension: 'ROWS', startIndex: f.fila - 1, endIndex: f.fila } } };
        }) }) });
      e.filas = frescas.map(function (f, k) { return { tab: f.tab, sheetId: f.sheetId, indice: f.fila - 1, valores: (e.filas[k] || e.filas[0]).valores }; });
    }
    await cargarTodo();
    return;
  }
  if (e.tipo === 'eliminar') {
    if (atras) {
      for (var i = e.filas.length - 1; i >= 0; i--) await reinsertarFila(e.filas[i]);
      var sinTotal = await restaurarTotales(e.totales);
      if (sinTotal.length) toast('Revisá la fila TOTAL de «' + sinTotal.join('», «') + '»: la hoja cambió y no pude devolverle sus fórmulas.', 'error', 9000);
    } else {
      for (var j = 0; j < e.filas.length; j++) await borrarPorIdent(e.filas[j]);
    }
    await cargarTodo(true);
    return;
  }
  if (e.tipo === 'facturar') {
    var fact = (S.fuentesFact || [])[0];
    if (!fact) throw new Error('no hay pestaña de A facturar.');
    var lista = atras ? e.items.slice().reverse() : e.items;
    var haciaFactAhora = e.inverso ? atras : !atras;
    for (var q = 0; q < lista.length; q++) {
      if (haciaFactAhora) await moverPorIdent(lista[q].tab, e.hacia, lista[q].ident);
      else await moverPorIdent(e.hacia, lista[q].tab, lista[q].ident);
    }
    await cargarTodo(true);
    return;
  }
}

async function histAplicar(atras) {
  if (S.histOcupado) return;
  if (nPend() || (S.revision && S.revision.guardando)) {          // lo recién editado se guarda primero, así queda en el historial
    S.histOcupado = true;
    try { var okG = await asegurarGuardado(); } finally { S.histOcupado = false; }
    if (!okG) { toast('Hay un cambio que no se pudo guardar: resolvelo antes de deshacer', 'error'); return; }
  }
  var pila = atras ? S.hist : S.rehacer;
  if (!pila.length) { toast(atras ? 'No hay nada para deshacer' : 'No hay nada para rehacer', 'ok', 1800); return; }
  var e = pila.pop();
  S.histOcupado = true; pintar();
  try {
    await aplicarHist(e, atras);
    (atras ? S.rehacer : S.hist).push(e);
    toast((atras ? 'Deshecho: ' : 'Rehecho: ') + histDesc(e), 'ok', 5000,
      null);
  } catch (err) {
    pila.push(e);
    toast('No se pudo ' + (atras ? 'deshacer' : 'rehacer') + ': ' + err.message, 'error', 9000);
    try { await cargarTodo(true); } catch (e2) { /* el aviso ya está */ }
  } finally {
    S.histOcupado = false; pintar();
  }
}
function deshacer() { return histAplicar(true); }
function rehacerHist() { return histAplicar(false); }

function botonesHistHtml() {
  var u = S.hist[S.hist.length - 1], rr = S.rehacer[S.rehacer.length - 1], oc = S.histOcupado;

    '<button data-act="deshacer" aria-label="Deshacer"' + (u && !oc ? '' : ' disabled') + ' title="' + (u ? 'Deshacer: ' + esc(histDesc(u)) + ' (Ctrl+Z)' : 'Nada para deshacer (Ctrl+Z)') + '">' + ico('volver') + '</button>' +
    '<button data-act="rehacer" aria-label="Rehacer"' + (rr && !oc ? '' : ' disabled') + ' title="' + (rr ? 'Rehacer: ' + esc(histDesc(rr)) + ' (Ctrl+Y)' : 'Nada para rehacer (Ctrl+Y)') + '">' + ico('rehacer') + '</button></span>';
}
document.addEventListener('keydown', function (ev) {
  if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
  var k = String(ev.key).toLowerCase();
  if (k !== 'z' && k !== 'y') return;
  var t = ev.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;    // escribiendo: el deshacer del texto es el del navegador
  if (S.editCel || S.elim || S.loteFact || S.moverCtr || S.pantalla !== 'app') return;
  ev.preventDefault();
  if (k === 'y' || ev.shiftKey) rehacerHist(); else deshacer();
});

/* --- Eliminar un contrato (borra su fila —o sus filas, una por producto— de la planilla) --- */
async function filasFrescasDeContrato(nombre) {
  var ref = S.ctrEditables.get(nombre), tabs = {}, out = [];
  filasDelContrato(ref).forEach(function (f) { tabs[f.tab] = 1; });
  var nombres = Object.keys(tabs);
  for (var i = 0; i < nombres.length; i++) {
    var h = await leerHoja(S.cfg.sheetId, nombres[i]);
    var m = detectar(h.encabezados, CAMPOS_CTR).mapa;
    if (m.contrato === undefined) continue;
    h.filas.forEach(function (f) {
      if (clave(f.celdas[m.contrato]) === clave(nombre)) out.push({ tab: nombres[i], sheetId: h.sheetId, fila: f.fila });
    });
  }
  out.sort(function (a, b) { return a.tab === b.tab ? b.fila - a.fila : (a.tab < b.tab ? -1 : 1); });   // de la última a la primera
  return out;
}
function modalElimCtr() {

  if (!E) return '';

  var enCurso = embs.filter(function (x) { return !x._aFacturar && !x._esFact; }).length, aFact = embs.length - enCurso;
  var prods = filas.map(function (fr) {

  }).join('');
  var cab = '<h3 id="ec-t">' + (E.paso === 2 ? 'Última confirmación' : '¿Eliminar el contrato ' + esc(E.nombre) + '?') + '</h3>';

  if (E.paso !== 2) {
    cuerpo = '<p class="mcm-donde">' + esc([ctr.exportador, ctr.importador].filter(Boolean).join(' → ') || 'Sin partes') + '</p>' +

      ((enCurso || aFact)
        ? '<div class="mcm-aviso"><span class="mcm-ico">' + ico('enlace') + '</span><div><p><b>Ojo: este contrato tiene ' +
          (enCurso ? enCurso + (enCurso === 1 ? ' embarque en curso' : ' embarques en curso') : '') + (enCurso && aFact ? ' y ' : '') +
          (aFact ? aFact + ' ya en «A facturar»' : '') + '.</b></p><p class="mcm-sub">Eliminar el contrato no borra esos embarques, pero van a quedar sin contrato.</p></div></div>'
        : '');
  } else {
    cuerpo = '<p>Vas a borrar <b>' + esc(E.nombre) + '</b> (' + filas.length + (filas.length === 1 ? ' fila' : ' filas') + ') de la planilla compartida: lo ve todo el equipo.</p>' +
      '<p class="ayuda">Se puede deshacer con Ctrl+Z mientras no recargues la página; después solo desde el Historial de versiones de Sheets.</p>';
  }
  return '<div class="modal-velo" data-act="ctrelimno"></div>' +

      (E.error ? '<div class="error" role="alert" style="margin-top:12px">' + esc(E.error) + '</div>' : '') +
      '<div class="mcm-acc">' +
        (E.paso === 2 ? '<button data-act="ctrelimvolver"' + (E.moviendo ? ' disabled' : '') + '>Volver</button>'
                      : '<button data-act="ctrelimno">Cancelar</button>') +
        (E.paso === 2
          ? '<button class="primario peligro" data-act="ctrelimok"' + (E.moviendo ? ' disabled' : '') + '>' + (E.moviendo ? 'Eliminando…' : ico('papelera') + 'Sí, eliminar el contrato') + '</button>'
          : '<button class="primario peligro" data-act="ctrelimsig">Continuar</button>') +

async function eliminarContrato() {
  var E = S.elimCtr;
  if (!E || E.moviendo) return;
  E.moviendo = true; E.error = null; pintar();
  try {
    var filas = await filasFrescasDeContrato(E.nombre);
    if (!filas.length) throw new Error('No encontré ese contrato en la planilla (¿alguien lo borró o lo cambió?). No toqué nada.');
    var copias = [], totales = {};
    for (var it = 0; it < filas.length; it++) { if (!(filas[it].tab in totales)) totales[filas[it].tab] = await capturarTotal(filas[it].tab, filas[it].sheetId); }
    for (var i = 0; i < filas.length; i++) {          // copia exacta de cada fila, para poder deshacer; sin copia no se borra
      var v;
      try { v = await filaCruda(filas[i].sheetId, filas[i].tab, filas[i].fila); }
      catch (e0) { throw new Error('No pude guardar una copia de la fila para poder deshacer, así que no borré nada. ' + e0.message); }
      copias.push({ tab: filas[i].tab, sheetId: filas[i].sheetId, indice: filas[i].fila - 1, valores: v });
    }
    await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: filas.map(function (f) {
        return { deleteDimension: { range: { sheetId: f.sheetId, dimension: 'ROWS', startIndex: f.fila - 1, endIndex: f.fila } } };
      }) }) });
    histRegistrar({ tipo: 'contrato', nombre: E.nombre, filas: copias, totales: totales });
    S.elimCtr = null; S.editCtr = null; S.confirmCerrar = false;
    await cargarTodo();
    toast('Contrato ' + E.nombre + ' eliminado de la planilla', 'ok', 8000, { texto: 'Deshacer', fn: function () { deshacer(); } });
  } catch (e) {
    E.moviendo = false; E.error = e.message;
  } finally {
    pintar();
  }
}
async function reinsertarFilaCtr(f, nombre) {
  var reqs = [{ insertDimension: { range: { sheetId: f.sheetId, dimension: 'ROWS', startIndex: f.indice, endIndex: f.indice + 1 }, inheritFromBefore: false } }];
  if (f.valores && f.valores.length) {
    reqs.push({ updateCells: { range: { sheetId: f.sheetId, startRowIndex: f.indice, endRowIndex: f.indice + 1, startColumnIndex: 0, endColumnIndex: f.valores.length },
      rows: [{ values: f.valores }], fields: 'userEnteredValue,userEnteredFormat' } });
  }
  await api(BASE + S.cfg.sheetId + ':batchUpdate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requests: reqs }) });
  var h = await leerHoja(S.cfg.sheetId, f.tab), m = detectar(h.encabezados, CAMPOS_CTR).mapa;
  if (!h.filas.some(function (x) { return x.fila === f.indice + 1 && clave(x.celdas[m.contrato]) === clave(nombre); })) {
    throw new Error('La fila se reinsertó pero no pude comprobar que quedó bien: revisá «' + f.tab + '».');
  }
}

// Cada fila se vuelve a ubicar en la hoja JUSTO antes de borrarla (por contrato, BL, cliente y toneladas, no por número).
async function eliminarCargas() {
  var E = S.elim;
  if (!E || E.moviendo) return;
  var embs = porFilaDesc(E.ids.map(filaPorId).filter(Boolean));
  var conPend = embs.filter(function (e) { return pendDeFila(e._id); });
  if (conPend.length) {
    E.moviendo = true; pintar();
    var okE = await asegurarGuardado();
    E.moviendo = false;
    if (!okE || embs.some(function (e) { return pendDeFila(e._id); })) {
      E.error = 'No se pudieron guardar los cambios pendientes de ' + (conPend.length === 1 ? 'esa carga' : 'esas cargas') + ', así que no borré nada. Probá de nuevo.';
      return pintar();
    }
  }
  E.moviendo = true; E.hechas = 0; E.error = null; pintar();
  var hechas = [], borradas = [], totales = {};
  try {
    for (var i = 0; i < embs.length; i++) {
      var emb = embs[i];
      var h, fresca;
      if (await ubicarFilaRapido(emb._tab, fuenteDe(emb).mapa, emb, emb._fila)) { h = { sheetId: emb._sheetId }; fresca = { fila: emb._fila }; }
      else {
        h = await leerHoja(S.cfg.sheetId, emb._tab);
        var mp = detectar(h.encabezados, CAMPOS).mapa;
        fresca = ubicarFila(h, mp, emb, emb._fila);
      }
      if (!(emb._tab in totales)) totales[emb._tab] = await capturarTotal(emb._tab, h.sheetId);
      // Copia exacta de la fila (valores, fórmulas y formato) para poder deshacer. Sin copia no se borra.
      var copia;
      try { copia = await filaCruda(h.sheetId, emb._tab, fresca.fila); }
      catch (e0) { throw new Error('No pude guardar una copia de la fila para poder deshacer, así que no la borré. ' + e0.message); }
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: h.sheetId, dimension: 'ROWS',
          startIndex: fresca.fila - 1, endIndex: fresca.fila } } }] })
      });
      borradas.push({ tab: emb._tab, sheetId: h.sheetId, indice: fresca.fila - 1, valores: copia, ident: identidadDe(emb), quien: resumenMudanza(emb).quien });
      hechas.push(emb._id); E.hechas = hechas.length; pintar();
    }
    histRegistrar({ tipo: 'eliminar', filas: borradas, totales: totales });
    S.avisoOk = hechas.length === 1 ? 'Carga eliminada de la planilla.' : hechas.length + ' cargas eliminadas de la planilla.';
    S.elim = null;
    hechas.forEach(function (id) { delete S.filasSel[id]; });
    if (S.sel && hechas.indexOf(S.sel) >= 0) { S.sel = null; S.pasar = null; }
    await cargarTodo(true);
    toast(S.avisoOk, 'ok', 8000, { texto: 'Deshacer', fn: function () { deshacer(); } });
  } catch (e) {
    E.moviendo = false;
    if (borradas.length) histRegistrar({ tipo: 'eliminar', filas: borradas, totales: totales });
    E.error = (hechas.length ? 'Se eliminaron ' + hechas.length + ' de ' + embs.length + '; se frenó en la siguiente: ' : 'No se eliminó nada: ') + e.message;
    hechas.forEach(function (id) { delete S.filasSel[id]; });
    E.ids = E.ids.filter(function (id) { return hechas.indexOf(id) < 0; });
    try { await cargarTodo(true); } catch (e3) { /* se ve el error de arriba */ }
  } finally {
    pintar();
  }
}

function limpiarSelFilas() { S.filasSel = {}; S.filasSelAncla = null; S.soloSel = false; refrescarSelFilas(); refrescarPlanilla(); }
document.addEventListener('keydown', function (ev) {
  var td = ev.target && ev.target.classList && ev.target.classList.contains('nrofila') ? ev.target : null;
  if (!td || (ev.key !== ' ' && ev.key !== 'Enter') || S.editCel) return;
  ev.preventDefault();
  clicNumeroFila(ev, td.closest('tr'));
});
function clicNumeroFila(ev, tr) {
  var id = tr.getAttribute('data-f');
  S.copiarFilas = true;
  if (ev.shiftKey && S.filasSelAncla) {
    var trs = Array.prototype.slice.call(document.querySelectorAll('.tbl-hoja tbody tr[data-f]'));
    var ids = trs.map(function (t) { return t.getAttribute('data-f'); });
    var a = ids.indexOf(S.filasSelAncla), b = ids.indexOf(id);
    if (a >= 0 && b >= 0) {
      if (!(ev.ctrlKey || ev.metaKey)) S.filasSel = {};
      for (var i = Math.min(a, b); i <= Math.max(a, b); i++) S.filasSel[ids[i]] = true;
      try { window.getSelection().removeAllRanges(); } catch (e) {}
      return refrescarSelFilas();
    }
  }
  if (ev.ctrlKey || ev.metaKey) { if (S.filasSel[id]) delete S.filasSel[id]; else S.filasSel[id] = true; }
  else if (S.filasSel[id] && nSelFilas() === 1) delete S.filasSel[id];
  else { S.filasSel = {}; S.filasSel[id] = true; }
  S.filasSelAncla = id;
  refrescarSelFilas();
}

// Al tipear en un filtro de columna: se cambian las filas y el conteo, nada

function refrescarPlanilla() {
  var tb = document.querySelector && document.querySelector('.tbl-hoja tbody');
  if (!tb) return pintar();

  tb.innerHTML = filasHtmlPlanilla(filas, cols);
  var cnt = document.querySelector('.hoja-barra .ayuda');
  if (cnt) cnt.textContent = filas.length + ' filas';
  medirFijas();
  aplicarCeldaActiva();
}

// Cambió qué columnas se ven o cuántas se inmovilizan: se rehace la tabla y

/* Las columnas inmovilizadas tienen que saber cuánto ocupa lo que tienen a la
   izquierda para quedarse pegadas a eso: se mide en pantalla, porque el ancho
   depende del contenido. */
function medirFijas() {
  if (typeof document === 'undefined' || !document.querySelector) return;
  var tb = document.querySelector('.tbl-hoja.cong');
  if (!tb) return;
  var nr = tb.querySelector('thead th.nrofila'), sc = tb.querySelector('thead th.sel-col');
  var left = nr ? nr.offsetWidth : 41;
  if (sc) {
    Array.prototype.forEach.call(tb.querySelectorAll('.sel-col'), function (c) { c.style.left = left + 'px'; });
    left += sc.offsetWidth;
  }
  var i = 0, th;
  while ((th = tb.querySelector('thead th[data-fz="' + i + '"]'))) {
    var celdas = tb.querySelectorAll('[data-fz="' + i + '"]');
    for (var k = 0; k < celdas.length; k++) celdas[k].style.left = left + 'px';
    left += th.offsetWidth; i++;
  }
}

/* --- Menú «Configuración» -----------------------------------------------------
   Vive en la esquina de arriba a la derecha. En la planilla junta lo que antes
   estaba suelto: qué columnas se ven (con el estado bien claro), cuántas se
   inmovilizan (ninguna por defecto) y exportar a CSV. */
/* En escritorio el menú se abre debajo del botón; si no entra, va arriba, y si
   tampoco, se achica y scrollea. En el celular es una hoja fija (ver estilos). */
function acomodarMenuCfg() {
  var m = document.querySelector && document.querySelector('.menu-cfg');
  if (!m || window.innerWidth <= 900) return;
  var btn = m.parentNode.querySelector('.btn-cfg');
  if (!btn) return;
  var r = btn.getBoundingClientRect(), alto = window.innerHeight;
  var debajo = alto - r.bottom - 20, arriba = r.top - 20;
  m.style.maxHeight = ''; m.style.top = ''; m.style.bottom = '';
  var h = m.scrollHeight;
  if (h <= debajo) return;
  if (h <= arriba) { m.style.top = 'auto'; m.style.bottom = 'calc(100% + 8px)'; return; }
  if (debajo >= arriba) { m.style.maxHeight = Math.max(220, debajo) + 'px'; return; }
  m.style.top = 'auto'; m.style.bottom = 'calc(100% + 8px)'; m.style.maxHeight = Math.max(220, arriba) + 'px';
}

/* --- Cambios acumulados -----------------------------------------------------
   Editar en la tabla NO escribe en Google: el cambio queda marcado (celda con
   borde naranja) y se guarda todo junto, con una confirmación en dos pasos, desde
   la barra de arriba a la derecha. Así se puede corregir una fila entera, o
   varias, y recién después decidir. */
function clavePend(id, c) { return id + '\u0001' + c; }
function pendDe(id, c) { return S.pend[clavePend(id, c)] || null; }
function pendLista() { return Object.keys(S.pend).map(function (k) { return S.pend[k]; }); }
function nPend() { return Object.keys(S.pend).length; }
function pendDeFila(id) { return pendLista().some(function (p) { return p.id === id; }); }
function pendFilas() { var f = {}; pendLista().forEach(function (p) { f[p.id] = 1; }); return Object.keys(f); }

// Lo que hay que mostrar en una celda: lo pendiente si lo hay; el total se
// recalcula en pantalla apenas cambia la cantidad o el precio.
function valorVista(emb, c) {
  if (String(c).indexOf('bg:') === 0) return bgDe(emb, c.slice(3));
  var p = pendDe(emb._id, c);
  if (p) return p.nuevo;
  if (c === 'total' && (pendDe(emb._id, 'tns') || pendDe(emb._id, 'price'))) {
    var a = normNum(valorVista(emb, 'tns')), b = normNum(valorVista(emb, 'price'));
    if (a !== null && b !== null) return Math.round(a * b * 100) / 100;
  }
  return emb[c];
}

function mismoValor(tipo, antes, nuevo) {
  if (tipo === 'color') return claveColor(antes) === claveColor(nuevo);
  if (tipo === 'fecha') return txtV(antes) === txtV(nuevo);
  if (tipo === 'numero') return normNum(antes) === normNum(nuevo);
  if (tipo === 'semaforo') return (antes || 'vacio') === (nuevo || 'vacio');
  return String(antes == null ? '' : antes).trim() === String(nuevo == null ? '' : nuevo).trim();
}

// Cómo reconocer la fila en la planilla aunque se hayan corrido las filas.
function identidadDe(emb) {
  return { contract: emb.contract, bl: emb.bl, importer: emb.importer, tns: emb.tns };
}

// Devuelve true si cambió algo (y por lo tanto se redibujó).
function encolarCambio(id, c, crudo) {
  var emb = filaPorId(id), def = defCampo(c);
  if (!emb || !def || motivoNoEditable(emb, c)) return false;
  var nuevo = def.tipo === 'color' ? crudo
    : def.tipo === 'semaforo' ? crudo
    : def.tipo === 'numero' ? numAR(crudo)
    : def.tipo === 'fecha' ? convertir(crudo, 'fecha')
    : String(crudo == null ? '' : crudo).trim();
  return encolarNuevo(id, c, nuevo, null);
}

// Encola un valor YA convertido. `opts.deHist`: lo origina un deshacer/rehacer (no se anota de nuevo en el historial).
function encolarNuevo(id, c, nuevo, opts) {
  var emb = filaPorId(id), def = defCampo(c);
  if (!emb || !def || motivoNoEditable(emb, c)) return false;
  var esBg = String(c).indexOf('bg:') === 0;
  var guardado = esBg ? bgGuardado(emb, c.slice(3)) : emb[c];
  var k = clavePend(id, c), previo = S.pend[k];
  var igualAlGuardado = mismoValor(def.tipo, guardado, nuevo);
  if (igualAlGuardado && !previo) return false;                          // no hubo cambio
  if (previo && mismoValor(def.tipo, previo.nuevo, nuevo)) return false;  // ya estaba así
  if (igualAlGuardado) delete S.pend[k];                                  // volvió a lo que había
  else {
    S.pend[k] = { id: id, campo: c, tipo: def.tipo, antes: guardado, nuevo: nuevo,
                  tab: emb._tab, fila: emb._fila, deHist: !!(opts && opts.deHist),
                  ident: previo ? previo.ident : identidadDe(emb) };
  }
  S.pendNada = false;
  if (!nPend()) S.revision = null;
  pintar();
  if (nPend()) programarGuardado();
  return true;
}

/* Los cambios se guardan solos: se espera un instante por si siguen más (así van todos en un solo pedido a Google)
   y se avisa con un cartelito. Si Google falla, los cambios quedan marcados y la barra ofrece «Reintentar». */
function programarGuardado() {
  clearTimeout(S.tAuto);
  if (!S.autoMs) return;
  S.tAuto = setTimeout(function () { guardarYa(); }, S.autoMs);
}
function guardarYa() {
  clearTimeout(S.tAuto);
  if (!nPend()) return Promise.resolve(true);
  if (S.revision && S.revision.guardando) { S.guardarOtraVez = true; return Promise.resolve(false); }
  S.revision = { guardando: false, error: null };
  return guardarPendientes();
}
// Para acciones que no pueden seguir con cambios a medio guardar (pasar a facturar, eliminar): espera a que se guarden.
async function asegurarGuardado() {
  var tope = Date.now() + 20000;
  while (Date.now() < tope) {
    if (S.revision && S.revision.guardando) { await new Promise(function (ok) { setTimeout(ok, 80); }); continue; }
    if (!nPend()) return true;
    await guardarYa();
    if (S.revision && S.revision.error) return false;
  }
  return !nPend();
}

// Tras recargar la planilla las filas pueden haberse corrido: cada cambio
// pendiente se vuelve a atar a SU fila (por contrato, BL, cliente y toneladas).
function reanclarPendientes() {
  var viejas = pendLista();
  if (!viejas.length) return;
  var nuevas = {}, perdidas = 0;
  viejas.forEach(function (p) {
    var coincide = function (e) {
      return e._tab === p.tab && clave(e.contract) === clave(p.ident.contract) &&
        clave(e.bl) === clave(p.ident.bl) && clave(e.importer) === clave(p.ident.importer) &&
        Math.abs((normNum(e.tns) || 0) - (normNum(p.ident.tns) || 0)) < 0.0001;
    };
    var emb = filaPorId(p.id);
    if (!(emb && coincide(emb))) {
      var c = todasFilas().filter(coincide);
      emb = c.length === 1 ? c[0] : null;
    }
    if (!emb) { perdidas++; return; }
    p.id = emb._id; p.fila = emb._fila; p.antes = String(p.campo).indexOf('bg:') === 0 ? bgGuardado(emb, p.campo.slice(3)) : emb[p.campo];
    if (!mismoValor(p.tipo, p.antes, p.nuevo)) nuevas[clavePend(p.id, p.campo)] = p;   // si ya quedó igual, no hay nada que guardar
  });
  S.pend = nuevas;
  if (perdidas) {
    toast(perdidas + (perdidas === 1 ? ' cambio sin guardar se descartó' : ' cambios sin guardar se descartaron') +
      ' porque la fila ya no está donde estaba.', 'error', 9000);
  }
  if (!nPend()) S.revision = null;
}

// Lo que dice el contrato sobre un dato que sale de él (para avisar en la revisión).
function avisoContratoPend(p, emb) {
  if (CAMPOS_DEL_CONTRATO.indexOf(p.campo) < 0) return '';
  if (p.campo === 'contract') {
    return 'Cambia a qué contrato pertenece la carga: el entregado y el saldo de los dos contratos se recalculan.';
  }
  var dc = valorDelContrato(emb, p.campo), etq = etqCol(p.campo).toLowerCase();
  if (!dc.hay) return 'No encontré el contrato «' + emb.contract + '» para comparar.';
  if (!dc.texto) return 'En el contrato no figura ' + etq + '.';
  if (igualAlContrato(p.campo, p.nuevo, dc.valor)) return '';
  return 'En el contrato ' + etq + ' dice «' + dc.texto + '».';
}

function txtPend(p, v) {
  if (p.tipo === 'color') return nombreColor(v);
  return p.tipo === 'semaforo' ? etiqueta(p.campo, v || 'vacio') : txtV(v);
}
// Para la lista de la confirmación: los colores van con su muestra.
function htmlPend(p, v) {
  if (p.tipo === 'color') {
    return '<span class="muestra-bg" style="background:' + (esBlanco(v) ? '#fff' : cssColor(v)) + '"></span>' + esc(nombreColor(v));
  }
  return esc(txtPend(p, v));
}

// Barra de la tabla: solo avisa mientras se guarda, o si Google falló (con «Reintentar»).
function barraPendHtml() {
  var n = nPend();
  if (!n) return '';
  var R = S.revision;
  if (R && R.error) {
    return '<div class="pend-barra error" role="alert"><span class="pb-punto"></span><b>No se pudo guardar</b>' +
      '<span class="pb-sub">' + esc(String(R.error).split('\n')[0]) + ' Tus ' + n + (n === 1 ? ' cambio sigue' : ' cambios siguen') + ' acá.</span>' +
      '<button data-act="pendnada">' + (S.pendNada ? '¿Descartar todo?' : 'Descartar') + '</button>' +
      '<button class="primario" data-act="pendguardar">Reintentar</button></div>';
  }
  return '<div class="pend-barra" role="status"><span class="pb-punto"></span><b>Guardando ' + n + (n === 1 ? ' cambio' : ' cambios') + '…</b>' +
    (R && R.guardando ? '' : '<button data-act="pendnada" title="Descartar lo que acabás de cambiar, antes de que se guarde">' + (S.pendNada ? '¿Descartar todo?' : 'Descartar') + '</button>') + '</div>';
}

// Fuera de la tabla solo aparece si hubo un error: reintentar con un toque.
function pendFlotaHtml() {
  if (!nPend() || !(S.revision && S.revision.error)) return '';
  if (S.vista === 'carga' && (S.modo === 'planilla' || S.modo === 'tabla') && !S.sel) return '';
  return '<button class="pend-flota' + (S.sel ? ' con-panel' : '') + '" data-act="pendguardar"><span class="pb-punto"></span>No se guardó · Reintentar</button>';
}

/* Escribe TODO en un solo pedido a Google: o se guarda todo o no se guarda nada.
   Antes de escribir se vuelve a leer la planilla y cada fila se busca por lo que
   es (contrato, BL, cliente, toneladas), no por el número que tenía: si alguien
   agregó o borró filas mientras se editaba, no se toca la fila equivocada. */
// ¿Otra persona cambió esta celda en la planilla desde que la app la leyó? Se compara lo que hay AHORA con lo que la app
// creía que había: si es distinto (y tampoco dice ya lo que se iba a escribir), NO se pisa.
function choqueDe(p, mp, fila) {
  if (p.tipo === 'color' || p.tipo === 'semaforo' || !fila) return null;
  var idx = mp[baseSem(p.campo)];
  if (idx === undefined) return null;
  var hoy = convertir(fila[idx] == null ? null : fila[idx], p.tipo);
  if (mismoValor(p.tipo, p.antes, hoy)) return null;       // nadie la tocó
  if (mismoValor(p.tipo, p.nuevo, hoy)) return null;       // ya dice lo que se iba a escribir
  // Una ETA sin año se completa sola con el año siguiente: mismo día y mes es la misma fecha.
  if (p.tipo === 'fecha' && esFecha(p.antes) && esFecha(hoy) && p.antes.anioAsumido && hoy.anioAsumido &&
      p.antes.getUTCMonth() === hoy.getUTCMonth() && p.antes.getUTCDate() === hoy.getUTCDate()) return null;
  return { p: p, hoy: hoy };
}
function avisarChoques(ch) {
  var partes = ch.slice(0, 3).map(function (c) {
    return etqCol(c.p.campo) + ' de ' + c.donde + ': ahora dice «' + (c.txt || 'vacío') + '» (vos querías «' + (txtPend(c.p, c.p.nuevo) || 'vacío') + '»)';
  });
  toast('No pisé ' + (ch.length === 1 ? 'un dato' : ch.length + ' datos') + ' porque otra persona lo cambió antes · ' + partes.join(' · ') +
    (ch.length > 3 ? ' · y ' + (ch.length - 3) + ' más' : '') + '. Ya ves lo que quedó; si preferís el tuyo, volvé a escribirlo.', 'error', 16000);
}
async function guardarPendientes() {
  var R = S.revision;
  if (!R || R.guardando || !nPend()) return;
  R.guardando = true; R.error = null; S.guardando++; pintar();
  try {
    var lista = pendLista(), porFila = {}, porTab = {};
    var noCoinciden = lista.filter(function (p) { var e0 = filaPorId(p.id); return e0 && avisoContratoPend(p, e0); }).length;
    lista.forEach(function (p) { (porFila[p.id] = porFila[p.id] || []).push(p); });
    Object.keys(porFila).forEach(function (id) {
      var emb = filaPorId(id);
      if (!emb) throw new Error('Una de las filas ya no está en pantalla. Actualizá y volvé a hacer ese cambio.');
      (porTab[emb._tab] = porTab[emb._tab] || []).push(id);
    });

    var reqs = [], ubicadas = {}, tabs = Object.keys(porTab), salidas = {}, choques = [];
    for (var t = 0; t < tabs.length; t++) {
      var idsT = porTab[tabs[t]], e0 = filaPorId(idsT[0]), nomT = tabs[t];
      var oks = await Promise.all(idsT.map(function (i2) {
        var e2 = filaPorId(i2);
        salidas[i2] = {};
        return ubicarFilaRapido(nomT, fuenteDe(e2).mapa, porFila[i2][0].ident, e2._fila, salidas[i2]);
      }));
      var rapidoT = oks.every(Boolean);
      var h = rapidoT ? { sheetId: e0._sheetId } : await leerHoja(S.cfg.sheetId, tabs[t]);
      var mp = rapidoT ? fuenteDe(e0).mapa : detectar(h.encabezados, CAMPOS).mapa;
      for (var q = 0; q < porTab[tabs[t]].length; q++) {
        var id = porTab[tabs[t]][q], emb = filaPorId(id), cambios = porFila[id];
        var fresca = rapidoT ? { fila: emb._fila } : ubicarFila(h, mp, cambios[0].ident, emb._fila);
        // Lo que otra persona cambió mientras tanto no se pisa: esa celda se saltea y se avisa.
        var filaHoy = rapidoT ? salidas[id].row : fresca.celdas, buenos = [];
        cambios.forEach(function (pc) {
          var ch = choqueDe(pc, mp, filaHoy);
          if (ch) { ch.donde = String(emb.contract || emb.importer || 'la fila ' + fresca.fila).trim(); ch.txt = txtPend(pc, ch.hoy); choques.push(ch); }
          else buenos.push(pc);
        });
        cambios = buenos;
        if (!cambios.length) continue;
        var valores = {}, colores = {}, tocaTotal = false;
        cambios.forEach(function (p) {
          var esBgP = p.tipo === 'color';
          var idx = mp[esBgP ? p.campo.slice(3) : baseSem(p.campo)];
          if (idx === undefined) throw new Error('La columna «' + etqCol(p.campo) + '» ya no existe en «' + tabs[t] + '».');
          if (p.tipo === 'color') colores[idx] = esBlanco(p.nuevo) ? 'vacio' : { red: p.nuevo.red || 0, green: p.nuevo.green || 0, blue: p.nuevo.blue || 0 };
          else if (p.tipo === 'semaforo') colores[idx] = p.nuevo || 'vacio';
          else valores[idx] = (p.nuevo === null || p.nuevo === undefined) ? '' : p.nuevo;
          if (p.campo === 'tns' || p.campo === 'price') tocaTotal = true;
        });
        // Cambió la cantidad o el precio: el total se escribe como fórmula.
        if (tocaTotal && mp.total !== undefined && mp.tns !== undefined && mp.price !== undefined) {
          valores[mp.total] = '=' + letraCol(mp.price) + fresca.fila + '*' + letraCol(mp.tns) + fresca.fila;
        }
        reqs = reqs.concat(pedidosDeCeldas(h.sheetId, fresca.fila, valores, colores));
        ubicadas[id] = fresca.fila;
      }
    }
    if (!reqs.length && !choques.length) throw new Error('No hay nada para escribir.');
    var choquesP = choques.map(function (c) { return c.p; });
    lista = lista.filter(function (pl) { return choquesP.indexOf(pl) < 0; });
    if (reqs.length) await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: reqs })
    });

    // Recién ahora es verdad: se reflejan en pantalla y se limpia lo pendiente.
    var corridas = false, filasN = Object.keys(porFila).length;
    lista.forEach(function (p) {
      var e = filaPorId(p.id);
      if (!e) return;
      if (p.tipo === 'color') {                       // fondo pintado: se refleja en lo que la app sabe de la fila
        var ib = fuenteDe(e).mapa[p.campo.slice(3)];
        if (ib !== undefined) { e._bg = (e._bg || []).slice(); e._bg[ib] = esBlanco(p.nuevo) ? { red: 1, green: 1, blue: 1 } : p.nuevo; }
        return;
      }
      e[p.campo] = p.nuevo; e._sucio = true;
      if (baseSem(p.campo) !== p.campo) {            // texto de Docs/Fotos/T.R.
        e._notas = e._notas || {}; e._notas[baseSem(p.campo)] = p.nuevo;
        if (baseSem(p.campo) === 'tr') e.trModo = modoTr(p.nuevo);
      }
      if (p.campo === 'tns' || p.campo === 'price') {
        var pr = normNum(e.price), tn = normNum(e.tns);
        e.total = (pr !== null && tn !== null) ? Math.round(pr * tn * 100) / 100 : e.total;
      }
      if (ubicadas[p.id] !== e._fila) corridas = true;
    });
    var n = lista.length;
    var itemsHist = lista.filter(function (p) { return !p.deHist; }).map(function (p) {
      var e1 = filaPorId(p.id);
      return { tab: p.tab, campo: p.campo, tipo: p.tipo, antes: p.antes, nuevo: p.nuevo, identAntes: p.ident, identDespues: e1 ? identidadDe(e1) : p.ident };
    });
    if (itemsHist.length) histRegistrar({ tipo: 'celdas', items: itemsHist });
    // Se sacan solo los que se guardaron: lo que se tocó mientras tanto sigue pendiente.
    lista.forEach(function (p) {
      var k = clavePend(p.id, p.campo), cur = S.pend[k];
      if (cur === p) delete S.pend[k];
      else if (cur) { cur.antes = p.nuevo; if (mismoValor(cur.tipo, cur.antes, cur.nuevo)) delete S.pend[k]; }
    });
    choquesP.forEach(function (pc) { var kc = clavePend(pc.id, pc.campo); if (S.pend[kc] === pc) delete S.pend[kc]; });
    S.revision = null; S.pendNada = false;
    if (n) toast((n === 1 ? 'Cambio guardado' : n + ' cambios guardados') +
      (noCoinciden ? ' · ' + (noCoinciden === 1 ? '1 no coincide' : noCoinciden + ' no coinciden') + ' con el contrato' : ''), 'ok', noCoinciden ? 6500 : 4500,
      itemsHist.length ? { texto: 'Deshacer', fn: function () { deshacer(); } } : null);
    if (corridas || choques.length) await cargarTodo(true);     // con choques, trae lo que dejó la otra persona
    if (choques.length) avisarChoques(choques);
  } catch (e) {
    R.guardando = false;
    R.error = e.message + (e.sesion ? '' : '\nNo se guardó nada: tus cambios siguen acá.');
    toast('No se pudieron guardar los cambios', 'error');
  } finally {
    S.guardando--; pintar();
    if (S.guardarOtraVez || (nPend() && !R.error)) { S.guardarOtraVez = false; programarGuardado(); }
  }
}

/* --- Edición desde la planilla, con doble clic como en Sheets. Lo que sale del
   contrato se puede cambiar, pero pide confirmación (ver pedirCambio). El total
   no: es precio × toneladas y se calcula solo. */

function motivoNoEditable(emb, c) {
  if (c === '_etapa') return 'La etapa se calcula sola, según los datos que tiene la carga.';
  var esBg = String(c).indexOf('bg:') === 0;
  if (esBg && c === 'bg:_etapa') return 'La etapa se calcula sola: no tiene color propio en la planilla.';
  var src = fuenteDe(emb), cb = esBg ? c.slice(3) : baseSem(c);
  if (esBg && SEMAFOROS.indexOf(cb) >= 0) return 'El color de Docs, Fotos y T.R. es su estado: se cambia con doble clic.';
  if (src.mapa[cb] === undefined) return 'Esta columna no existe en «' + emb._tab + '».';
  if (src.noAplica && src.noAplica[cb]) return 'Esta columna no aplica en «' + emb._tab + '».';
  if (c === 'total') return 'El total se calcula solo: precio × toneladas. Cambiá la cantidad y se actualiza.';
  return null;
}

// Convierte la celda en un campo para escribir, sin redibujar la tabla.
function editarCelda(td) {
  var tr = td.closest('tr'), c = td.getAttribute('data-c');
  var emb = filaPorId(tr.getAttribute('data-f'));
  if (!emb || !c) return;
  var no = motivoNoEditable(emb, c);
  if (no) return avisoCelda(td, no, CAMPOS_DEL_CONTRATO.indexOf(c) >= 0 ? emb.contract : null);

  cerrarEdicionCelda(false);
  var tipo = CAMPOS[c].tipo;
  var v = valorVista(emb, c);
  var inicial;
  if (tipo === 'semaforo') {
    td.classList.add('editando');
    var ops = ['ok', 'pendiente', 'atencion', 'vacio'];
    td.innerHTML = '<div class="sem-ed"><div class="sem-ops" role="radiogroup" aria-label="' + esc(CAMPOS[c].label) + ': color de fondo">' +
      ops.map(function (o) {
        var on = (v || 'vacio') === o;
        return '<button type="button" class="edit-cel sem-op" data-editcel="1" data-sem="' + o + '" role="radio" aria-checked="' + on + '">' +
          '<span class="sem-dot d-' + o + '"></span>' + esc(etiqueta(c, o)) + '</button>';
      }).join('') + '</div>' +
      '<input class="edit-cel" data-editcel="1" data-txtsem="1" autocomplete="off" aria-label="' +
      esc(CAMPOS[c].label) + ': texto" placeholder="Texto de la celda" value="' +
      esc(valorVista(emb, c + '_nota') || '') + '">' +
      '<div class="sem-pie"><span class="sem-hint">Enter acepta · Esc cancela</span>' +
      '<button type="button" class="sem-cancelar">Cancelar</button>' +
      '<button type="button" class="sem-guardar">Aceptar</button></div></div>';
  } else {
    if (v instanceof Date) inicial = fmtFecha(v);
    else if (tipo === 'numero' && typeof v === 'number') {
      inicial = v.toLocaleString('es-AR', { maximumFractionDigits: 4, useGrouping: false });
    } else inicial = v == null ? '' : String(v && v.invalida ? v.crudo : v);
    td.classList.add('editando');
    td.innerHTML = '<input class="edit-cel" data-editcel="1" autocomplete="off" aria-label="' +
      esc(CAMPOS[c].label) + '" value="' +
      esc(inicial) + '"' + (tipo === 'fecha' ? ' placeholder="DD/MM/AAAA"' : '') + '>';
  }
  S.editCel = { id: emb._id, c: c, td: td, previo: null };
  var inp = td.querySelector(tipo === 'semaforo' ? '.sem-op[aria-checked="true"]' : '.edit-cel');
  acomodarEditorSem();
  try { inp.focus({ preventScroll: true }); } catch (e0) { inp.focus(); }
  if (inp.select && tipo !== 'semaforo') inp.select();
}

// El editor de Docs/Fotos/T.R. flota sobre la pantalla (no dentro de la tabla, que lo cortaría) y se mantiene entero a la vista.
function acomodarEditorSem() {
  var E = S.editCel, ed = E && E.td && E.td.querySelector('.sem-ed');
  if (!ed) return;
  var r = E.td.getBoundingClientRect(), w = ed.offsetWidth, h = ed.offsetHeight;
  var W = window.innerWidth, H = window.innerHeight;
  var x = Math.max(8, Math.min(r.left, W - w - 8));
  var y = r.top;
  if (y + h > H - 8) y = r.bottom - h;
  if (y + h > H - 8) y = H - h - 8;
  ed.style.left = x + 'px'; ed.style.top = Math.max(8, y) + 'px';
}
window.addEventListener('scroll', function () { if (S.editCel) acomodarEditorSem(); }, true);
window.addEventListener('resize', function () { if (S.editCel) acomodarEditorSem(); });
document.addEventListener('click', function (ev) {
  if (!S.editCel || !ev.target.closest) return;
  if (ev.target.closest('.sem-guardar')) { ev.stopPropagation(); cerrarEdicionCelda(true); }
  else if (ev.target.closest('.sem-cancelar')) { ev.stopPropagation(); cerrarEdicionCelda(false); }
}, true);

// Guarda (o descarta) lo que se escribió en la celda.
function cerrarEdicionCelda(guardar) {
  var E = S.editCel;
  if (!E) return;
  S.editCel = null;
  var inp = E.td.querySelector('.edit-cel');
  if (!guardar || !inp) return refrescarPlanilla();
  var emb = filaPorId(E.id), c = E.c, tipo = CAMPOS[c].tipo, val = inp.value;

  // Docs / Fotos / T.R.: se cambian el color (estado) y el texto de la celda, cada uno por su lado.
  if (tipo === 'semaforo') {
    var tx = E.td.querySelector('[data-txtsem]');
    var cambioColor = encolarCambio(E.id, c, E.td.querySelector('.sem-op[aria-checked="true"]').getAttribute('data-sem'));
    var cambioTexto = tx ? encolarCambio(E.id, c + '_nota', tx.value) : false;
    if (!cambioColor && !cambioTexto) refrescarPlanilla();
    return;
  }

  // Validar antes de escribir: un dato mal en la planilla es peor que ninguno.
  if (tipo === 'fecha' && String(val).trim() && !esFecha(normFecha(val))) {
    S.editCel = E; inp.classList.add('mal'); inp.focus();
    return avisoCelda(E.td, 'Esa fecha no existe. Usá DD/MM/AAAA.');
  }
  if (tipo === 'numero' && String(val).trim() && numAR(val) === null) {
    S.editCel = E; inp.classList.add('mal'); inp.focus();
    return avisoCelda(E.td, 'Eso no es un número.');
  }
  // No se escribe nada en la planilla todavía: el cambio se acumula y se
  // confirma todo junto, arriba a la derecha.
  if (!encolarCambio(E.id, c, val)) refrescarPlanilla();
}

// Un aviso chico al lado de la celda, que se va solo.
function avisoCelda(td, texto, contrato) {
  var viejo = document.querySelector('.aviso-cel');
  if (viejo) viejo.parentNode.removeChild(viejo);
  var r = td.getBoundingClientRect();
  var div = document.createElement('div');
  div.className = 'aviso-cel';
  div.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 330)) + 'px';
  div.style.top = (r.bottom + 6) + 'px';
  div.innerHTML = '<span class="ac-ico">' + ico('candado') + '</span><span>' + esc(texto) + '</span>' +
    (contrato && S.ctrEditables && S.ctrEditables.has(contrato)
      ? '<button data-act="ctrabrir" data-k="' + esc(contrato) + '">Abrir el contrato</button>' : '');
  document.body.appendChild(div);
  clearTimeout(S.tAvisoCel);
  S.tAvisoCel = setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 5200);
}

// Agrega una clase a un <td> ya armado, tenga o no clase propia.
function conClaseTd(td, cls) {
  if (/^<td[^>]*?\bclass="/.test(td)) return td.replace(/^(<td[^>]*?\bclass=")([^"]*)"/, '$1$2 ' + cls + '"');
  return td.replace(/^<td/, '<td class="' + cls + '"');
}

function celdaPlanilla(emb, src, c) {
  var td = celdaPlanillaBase(emb, src, c).replace(/^<td/, '<td data-c="' + c + '"');
  var pend = pendDe(emb._id, c) || pendDe(emb._id, 'bg:' + c) || (SEMAFOROS.indexOf(c) >= 0 && pendDe(emb._id, c + '_nota')) ||
    (c === 'total' && (pendDe(emb._id, 'tns') || pendDe(emb._id, 'price')));
  if (pend) td = conClaseTd(td, 'pend-cel');
  // Fondo de color (el de Sheets o el que se acaba de pintar). Docs/Fotos/T.R. ya llevan el suyo (es el estado).
  if (c !== '_etapa' && SEMAFOROS.indexOf(c) < 0 && !/ class="na"|class="na"/.test(td)) {
    var bgc = bgDe(emb, c);
    if (!esBlanco(bgc) && enPaleta(bgc)) td = td.replace(/^<td/, '<td data-bg="1" style="background:' + cssColor(bgc) + '"');
  }
  // Comentarios: la marca va según la CARGA y la columna, no según la posición en pantalla,
  // así que si se reordena o se filtra la planilla, la marca viaja con su fila.
  var hs = hilosDeCelda(emb, c).filter(function (h) { return comentariosVisibles(h).length; });
  if (hs.length) {
    var abiertos = hs.filter(function (h) { return !h.resuelto; }).length;
    td = conClaseTd(td, abiertos ? 'tiene-com' : 'tiene-com com-resueltos')
      .replace(/^<td/, '<td data-ncom="' + hs.length + '"');
  }
  return td;
}

function celdaPlanillaBase(emb, src, c) {
  if (c === '_etapa') {
    var evx = S.ultimaEval && S.ultimaEval[emb._id];
    var et = evx && ETAPAS.filter(function (e) { return e.id === evx.etapa; })[0];
    return '<td class="nw">' + esc(et ? et.label : '') + '</td>';
  }
  if (src.mapa[c] === undefined) return '<td class="na"></td>';
  if (SEMAFOROS.indexOf(c) >= 0) {
    if (src.noAplica[c]) return '<td class="na"></td>';
    var est = valorVista(emb, c) || 'vacio';
    var txt = valorVista(emb, c + '_nota') || '';
    return '<td class="cel-' + est + '" title="' + esc(etiqueta(c, est)) +
      (txt ? ' — ' + esc(txt) : '') + '">' + esc(txt) + '</td>';
  }
  var v = valorVista(emb, c);
  var cls = (c === 'tns' || c === 'price' || c === 'total' || c === 'commission')
    ? ' class="num"' : '';
  if (c === 'pagoEstimado' && emb._faltaComprobante) {
    return '<td class="cel-naranja" title="Falta el comprobante de pago">' +
      pintarCelda(v) + '</td>';
  }
  return '<td' + cls + '>' + pintarCelda(v) + '</td>';
}

        return '<div class="kv"><dt>' + r[1] + '</dt><dd>' +
          (v ? '<span style="font-family:var(--mono);font-size:12px">' + esc(v) + '</span>'
             : '<span style="color:var(--tinta3);font-style:italic">falta</span>') +
          '</dd></div>';
      }).join('') + '</dl></div>';
  }

  // Estados: botón grande con la palabra, no un cuadradito de color.
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (sems.length) {
    h += '<div class="bloque"><h3 class="gt">Estado</h3><div class="sems">' +
      sems.map(function (c) { return selectorEstado(emb, c); }).join('') + '</div>' +
      '<p class="ayuda">Se pinta igual en la planilla.</p>';
    if (emb.trModo) {
      h += '<p class="ayuda" style="margin-top:8px">Modalidad de liberación: <b>' +
        esc(emb.trModo) + '</b></p>';
    }
    // El texto de estas columnas son anotaciones operativas, no adorno.
    sems.forEach(function (c) {
      h += '<div class="campo" style="margin-top:12px">' +
        '<label for="n-' + c + '">Anotación en ' + CAMPOS[c].label + '</label>' +
        '<input id="n-' + c + '" data-nota="' + c + '" data-f="' + esc(emb._id) + '" ' +
        'placeholder="Ej: recibir factura y enviar gas free cuando recibamos" value="' +
        esc(valorVista(emb, c + '_nota') || '') + '"></div>';
    });
    h += '</div>';
  }

  // Cobro.
  h += '<div class="bloque"><h3 class="gt">Cobro</h3>';
  if (!x.contrato) {
    h += '<p class="det">El contrato no aparece en las pestañas de contratos elegidas, ' +
      'así que no hay condición de pago ni alertas de cobro.</p>';
  } else if (cond.desconocida) {
    h += '<p class="det">Condición sin mapear: <em>' + esc(cond.texto || 'vacía en el contrato') +
      '</em>. Las alertas de cobro quedan apagadas para este embarque.</p>';
  } else {
    h += '<p style="margin:0 0 8px;font-size:13px">' + esc(cond.texto) + '</p>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="pill gris"><span class="pt"></span>' +
        esc(String(cond.momento).replace(/_/g, ' ')) + '</span>' +
      '<span class="pill gris"><span class="pt"></span>' + esc(cond.medio) + '</span>' +
      '<span class="pill ' + (LIBERACION[cond.lib].antes ? 'sol' : 'ok') + '">' +
        '<span class="pt"></span>' + LIBERACION[cond.lib].label + '</span>' +
      (cond.revisar ? '<span class="pill nar"><span class="pt"></span>revisar mapeo</span>' : '') +
      '</div><dl style="margin:0">' +
      kv('Cobro esperado', ev.cobro ? fmtFecha(ev.cobro) : 'no estimable') +
      kv('Comisión', emb.commission ? 'US$ ' + Number(emb.commission).toLocaleString('es-AR') : '') +
      '</dl>';
  }

  if (src.mapa[COL_COMPROBANTE] !== undefined) {
    h += '<label class="chk" style="margin-top:10px">' +
      '<input type="checkbox" data-cbte="' + esc(emb._id) + '"' +
      (emb._faltaComprobante ? ' checked' : '') + '>' +
      '<span>Falta que manden el comprobante</span></label>';
  }
  h += '</div>';

  h += bloqueAdvice(emb, ev);

  // Comentarios: lo que el equipo se dice sobre este embarque, por celda.
  h += bloqueComentarios(emb);

  // Fechas: input nativo, que además valida solo y evita el 28/09 sin año.
  var fechas = ['etd', 'eta', 'pagoEstimado'].filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (fechas.length) {
    h += '<div class="bloque"><h3 class="gt">Fechas</h3><div class="fechas">' +
      fechas.map(function (c) {
        var v = valorVista(emb, c);
        var iso = esFecha(v)
          ? v.getUTCFullYear() + '-' +
            String(v.getUTCMonth() + 1).padStart(2, '0') + '-' +
            String(v.getUTCDate()).padStart(2, '0')
          : '';
        var etq = CAMPOS[c].label +
          (v && v.anioAsumido ? ' <span class="av">año asumido</span>' : '') +
          (v && v.invalida ? ' <span class="mal">dato inválido: ' + esc(v.crudo) + '</span>' : '');
        return campoFecha('d-' + c, 'data-fecha', c, etq, v,
          '<input type="hidden" data-duenio="' + esc(emb._id) + '">');
      }).join('') + '</div>';

    if (esFecha(emb.etd) && esFecha(emb.eta)) {
      var tt = Math.round((emb.eta - emb.etd) / 86400000);
      h += '<p class="ayuda">Tránsito: ' + tt + ' días' +
        (tt < 0 ? ' — la ETA quedó antes del ETD' : '') + '.</p>';
    }
    h += '</div>';
  }

  // Toneladas y precio. El total de la planilla es una fórmula, así que se
  // recalcula solo al cambiar cualquiera de los dos: acá solo se muestra.
  var nums = EDITABLES_NUM.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (nums.length) {
    var tnsA = normNum(valorVista(emb, 'tns')), preA = normNum(valorVista(emb, 'price'));
    var totalA = (tnsA && preA) ? tnsA * preA : normNum(valorVista(emb, 'total'));

    h += '<div class="bloque"><h3 class="gt">Cantidad y precio</h3>' +
      '<div class="fechas">' +
      nums.map(function (c) {
        return '<div class="campo"><label for="n-' + c + '">' + CAMPOS[c].label + '</label>' +
          '<input id="n-' + c + '" type="number" step="any" data-num="' + c + '" ' +
          'data-f="' + esc(emb._id) + '" value="' +
          esc(valorVista(emb, c) === null || valorVista(emb, c) === undefined ? '' : valorVista(emb, c)) + '"></div>';
      }).join('') + '</div>' +
      (totalA
        ? '<p class="total-calc">Total: <b>' + fmtNum(totalA) + '</b>' +
          (tnsA && preA ? ' <span>= ' + fmtNum(tnsA) + ' tn × ' + fmtNum(preA) + '</span>' : '') +
          '</p>'
        : '') +
      '<p class="ayuda">Si la factura vino con otro peso neto, cambiá las toneladas: ' +
      'el total de la planilla se recalcula solo, porque es una fórmula.</p>' +
      '</div>';
  }

  // Campos editables.
  var eds = EDITABLES.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (eds.length) {
    h += '<div class="bloque"><h3 class="gt">Datos</h3>';
    eds.forEach(function (c) {
      var v = valorVista(emb, c);
      h += '<div class="campo' + (falta[c] ? ' falta' : '') + '">' +
        '<label for="e-' + c + '">' + CAMPOS[c].label +
        (falta[c] ? ' <span style="color:var(--pend)">· falta</span>' : '') + '</label>' +
        '<input id="e-' + c + '" data-edit="' + c + '" data-f="' + esc(emb._id) + '" value="' +
        esc(v instanceof Date ? fmtFecha(v) : (v || '')) + '"></div>';
    });
    h += '</div>';
  }

  return h + '</aside>';
}

function kv(k, v) {
  if (v === null || v === undefined || v === '') return '';
  return '<div class="kv"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>';
}

async function guardarAlta() {
  var a = S.alta || {};
  var prods = productosAlta(a);
  var faltan = ['contrato', 'exportador', 'importador'].filter(function (k) { return !a[k]; });
  if (!a.via) faltan.unshift('marítimo o terrestre');
  prods.forEach(function (p, i) {
    ['producto', 'tipo', 'toneladas', 'precio'].forEach(function (c) {
      if (!p[c]) faltan.push(c + (prods.length > 1 ? ' ' + (i + 1) : ''));
    });
  });
  if (faltan.length) {
    S.altaError = 'Falta completar: ' + faltan.join(', ');
    return pintar();
  }

  // El período: o se elige completo, o se deja vacío.
  var errPer = perError(perEstado('alta'), '');
  if (errPer) { S.altaError = errPer; return pintar(); }
  var colsP = periodoAColumnas(perAProps(perEstado('alta')));

  // La fecha llega como DD/MM/AAAA.
  // Se manda como número de serie: la columna ya tiene formato de fecha y
  // así no depende del idioma de la planilla para interpretarla.
  var fechaD = normFecha(a.fecha);
  var fechaVal = esFecha(fechaD) ? Math.floor((fechaD - EPOCH) / DIA) : (a.fecha || '');

  S.creando = true; S.altaError = null; pintar();
  var hechas = [];
  try {
    // Una fila por producto, con el mismo número. Se insertan de a una arriba
    // del TOTAL, así quedan juntas y en el orden en que se cargaron.
    for (var i = 0; i < prods.length; i++) {
      var p = prods[i];
      var fila = await crearContrato({
        fecha: fechaVal,
        contrato: String(a.contrato).trim(),
        exportador: a.exportador, importador: a.importador,
        producto: p.producto, tipo: p.tipo,
        toneladas: parseFloat(p.toneladas), precio: parseFloat(p.precio),
        packaging: p.packaging || '', incoterm: a.incoterm || '',
        formaPago: a.formaPago || '', periodo: colsP.periodo, perModo: colsP.perModo, perDesde: colsP.perDesde,
        perHasta: colsP.perHasta, perPartidas: colsP.perPartidas,
        via: VIA_TXT[a.via] || ''
      });
      hechas.push(fila);
    }
    S.alta = null;
    S.avisoOk = 'Contrato ' + a.contrato + ' creado' +
      (hechas.length > 1
        ? ' en ' + hechas.length + ' filas, una por producto (' + hechas.join(', ') + ').'
        : ' en la fila ' + hechas[0] + '.');
    await cargarTodo();
    // El paso siguiente es el documento: se abre ya con todo lo que se acaba de cargar (y lo que sale de las bases).
    var nomNuevo = String(a.contrato).trim();
    if (S.ctrEditables && S.ctrEditables.get(nomNuevo)) {
      var msgNuevo = S.avisoOk; S.avisoOk = null;      // el aviso de «creado» va adentro del generador, no duplicado detrás
      abrirGenerador(nomNuevo); S.gen.nuevo = true; S.gen.nuevoMsg = msgNuevo; S.gen.irAlFalta = true;
    }
  } catch (e) {
    S.altaError = e.message + (hechas && hechas.length
      ? ' Ojo: ya se cargaron ' + hechas.length + ' fila(s) (' + hechas.join(', ') +
        '); revisalas en la planilla antes de reintentar.'
      : '');
  } finally {
    S.creando = false; pintar();
  }
}

// Exporta lo que se está viendo, con los filtros aplicados. Con BOM y punto y
// coma para que Excel en español lo abra bien de una.
function exportarCSV() {
  var filas, nombre;

  if (S.vista === 'contratos') {
    nombre = 'contratos';
    // Lo mismo que se ve en pantalla: con los filtros y el orden elegidos.
    var lc = ordenarContratos(contratosFiltrados(), S.ordenCtr || 'recientes');
    filas = [['Contrato', 'Exportador', 'Importador', 'Contratado (tn)',
              'Embarcado (tn)', 'Saldo (tn)', 'Embarques', 'Condicion de pago']];
    lc.forEach(function (r) {
        filas.push([r.contrato, r.exportador, r.importador, r.contratado,
                    r.entregado, r.saldo, r.embarques.length,
                    r.cond ? r.cond.texto : '']);
      });
  } else {
    nombre = 'embarques';
    var evs = evaluarTodo();
    var vis = S.vista === 'control'
      ? evs.filter(function (x) {
          return x.ev.alertas.length &&
            (!S.filtroNivel || S.filtroNivel === x.ev.nivelMax);
        })
      : ordenar(aplicarFiltros(evs), S.orden);

    var enc = ['Pestaña', 'Exportador', 'Importador', 'Contrato', 'Producto', 'Tns',
               'ETD', 'ETA', 'Destino', 'Buque', 'Factura', 'BL', 'Booking',
               'Etapa', 'Docs', 'Fotos', 'T.R.', 'Anotación Docs',
               'Falta comprobante', 'A facturar', 'Pendientes'];
    filas = [enc];
    vis.forEach(function (x) {
      var e = x.emb;
      filas.push([
        e._tab, e.exporter, e.importer, e.contract, e.product, e.tns,
        esFecha(e.etd) ? fmtFecha(e.etd) : '', esFecha(e.eta) ? fmtFecha(e.eta) : '',
        e.port, e.vessel, e.invoice, e.bl, e.booking,
        (ETAPAS.filter(function (t) { return t.id === x.ev.etapa; })[0] || {}).label || '',
        etiqueta('docs', e.docs), etiqueta('pics', e.pics), etiqueta('tr', e.tr),
        (e._notas && e._notas.docs) || '',
        e._faltaComprobante ? 'si' : '', e._aFacturar ? 'si' : '',
        x.ev.alertas.map(function (a) { return a.titulo; }).join(' | ')
      ]);
    });
  }

  var csv = filas.map(function (f) {
    return f.map(function (v) {
      if (v === null || v === undefined) return '';
      var t = String(v);
      return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }).join(';');
  }).join('\r\n');

  var n0 = new Date();
  var hoy = n0.getFullYear() + '-' + String(n0.getMonth() + 1).padStart(2, '0') + '-' + String(n0.getDate()).padStart(2, '0');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = nombre + '-' + hoy + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* --- Render + eventos ------------------------------------------------------ */

function pintar() {
  var foco = document.activeElement;
  var id = foco && foco.id, pos = null;
  try { pos = foco && foco.selectionStart; } catch (e) {}

  // Redibujar reemplaza todo el HTML, así que el navegador pierde el scroll.
  // Lo guardamos y lo devolvemos: si no, cada vez que se cambia un estado la
  // pantalla salta al principio.
  var scrollPag = window.scrollY || window.pageYOffset || 0;
  var scrolls = {};
  ['.hoja', '.panel', '.marco', '.gen-cuerpo'].forEach(function (sel) {
    var el = document.querySelector(sel);
    if (el) scrolls[sel] = { top: el.scrollTop, left: el.scrollLeft };
  });

  var html;
  try {
    html = S.pantalla === 'app' ? vistaApp() : vistaSetup();
  } catch (e) {
    html = '<div class="setup"><div class="error"><b>Error al dibujar la pantalla</b><br>' +
      esc(e.message) + '</div>' +
      '<div class="caja"><button data-act="reset-cid">Empezar de nuevo</button></div></div>';
    if (window.console) console.error(e);
  }

  document.getElementById('root').innerHTML = html;
  S.animarPanel = false;   // la entrada se anima una sola vez
  acomodarMenuCol();
  medirFijas();
  aplicarCeldaActiva();
  acomodarMenuCfg();
  actualizarBotonCom();
  if (S.gen) {
    // Ventana modal: el resto de la pantalla no recibe foco ni lectura, y el foco entra a la ventana.
    Array.prototype.forEach.call(document.getElementById('root').children, function (n) {
      if (!n.classList.contains('gen-velo')) n.setAttribute('inert', '');
    });
    if (S.gen.focoPendiente) {
      S.gen.focoPendiente = false;
      var tit = document.getElementById('gen-t');
      if (tit) { tit.setAttribute('tabindex', '-1'); tit.focus(); }
    }
    if (S.gen.irAlFalta) {
      S.gen.irAlFalta = false;
      var pf = document.querySelector('.gen-modal .campo.falta input');
      if (pf) pf.scrollIntoView({ block: 'center' });
    }
  }
  if (S.moverCtr && S.moverCtr.plan && !S.moverCtr.entiendo) {
    var fm0 = document.querySelector('.modal-cambio input[type="checkbox"]');
    if (fm0) fm0.focus();
  }
  try {
    var sb = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty('--sb', Math.max(0, sb) + 'px');
  } catch (e) {}
  // Aire extra abajo cuando la barra flotante está visible.
  try {
    var hayBarra = !!(S.marcados && Object.keys(S.marcados).some(function (k) { return S.marcados[k]; }));
    document.body.classList[hayBarra ? 'add' : 'remove']('con-barra');
  } catch (e) {}

  Object.keys(scrolls).forEach(function (sel) {
    var el = document.querySelector(sel);
    if (el) { el.scrollTop = scrolls[sel].top; el.scrollLeft = scrolls[sel].left; }
  });
  if (scrollPag) window.scrollTo(0, scrollPag);
  if (S.irAlFinal && S.verFact) {                 // «A facturar»: las últimas pasadas están abajo de todo, y es ahí donde se mira
    var hj = document.querySelector('.hoja');
    if (hj) { hj.scrollTop = hj.scrollHeight; S.irAlFinal = false; }
  }
  acomodarFlotantes();

  if (id) {
    var nuevo = document.getElementById(id);
    if (nuevo) {
      nuevo.focus();
      try { nuevo.setSelectionRange(pos, pos); } catch (e2) {}
    }
  }
}

/* Celda marcada: el borde azul de Sheets. Con ella marcada se puede navegar con
   las flechas, editar con Enter o F2, vaciar con Supr y copiar con Ctrl+C. */
function marcarCeldaActiva(td) {
  S.copiarFilas = false;
  var viejo = document.querySelector('.tbl-hoja td.cel-act');
  if (viejo) viejo.classList.remove('cel-act');
  td.classList.add('cel-act');
  S.celdaAct = { id: td.closest('tr').getAttribute('data-f'), c: td.getAttribute('data-c') };
  actualizarBotonCom();
}
// La celda de al lado (dx) o de abajo/arriba (dy). Con `envolver`, al llegar al borde de la fila pasa a la siguiente (como Tab en Sheets).
function celdaVecina(td, dx, dy, envolver) {
  var tr = td.closest('tr'), c = td.getAttribute('data-c');
  if (dy) {
    var tr2 = dy < 0 ? tr.previousElementSibling : tr.nextElementSibling;
    return tr2 ? tr2.querySelector('td[data-c="' + c + '"]') : null;
  }
  var sig = dx < 0 ? td.previousElementSibling : td.nextElementSibling;
  while (sig && !sig.getAttribute('data-c')) sig = dx < 0 ? sig.previousElementSibling : sig.nextElementSibling;
  if (sig || !envolver) return sig;
  var trN = dx < 0 ? tr.previousElementSibling : tr.nextElementSibling;
  while (trN && !trN.querySelector('td[data-c]')) trN = dx < 0 ? trN.previousElementSibling : trN.nextElementSibling;
  if (!trN) return null;
  var tds = trN.querySelectorAll('td[data-c]');
  return dx < 0 ? tds[tds.length - 1] : tds[0];
}
function irACelda(td) {
  if (!td) return;
  marcarCeldaActiva(td);
  td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
// ¿Hay algo encima de la tabla (ventana, panel, menú) que se queda con el teclado?
function hayAlgoEncima() {
  return !!(S.gen || S.elim || S.loteFact || S.loteDev || S.moverCtr || S.revision || S.menuCol || S.menuCfg || S.menuPintar ||
    S.sel || S.comPop || S.comCtx || document.querySelector('.modal-velo, .gen-velo'));
}
function tdActiva() {
  if (!S.celdaAct) return null;
  var trs = document.querySelectorAll('.tbl-hoja tbody tr'), tr = null;
  for (var i = 0; i < trs.length; i++) if (trs[i].getAttribute('data-f') === S.celdaAct.id) { tr = trs[i]; break; }
  return tr ? tr.querySelector('td[data-c="' + S.celdaAct.c + '"]') : null;
}
function aplicarCeldaActiva() {
  var td = tdActiva();
  if (td) td.classList.add('cel-act');
}

// Cambia el ancho de una columna en pantalla, sin redibujar nada.
function aplicarAncho(c, w) {
  var col = document.querySelector('.tbl-hoja col[data-c="' + c + '"]');
  if (!col) return;
  col.style.width = w + 'px';
  var tb = col.parentNode.parentNode, tot = 0;
  Array.prototype.forEach.call(tb.querySelectorAll('col'), function (x) { tot += parseFloat(x.style.width) || 0; });
  tb.style.width = tot + 'px';
  medirFijas();
}

document.addEventListener('pointerdown', function (ev) {
  var h = ev.target.closest && ev.target.closest('.th-resize');
  if (!h) return;
  ev.preventDefault(); ev.stopPropagation();
  var c = h.getAttribute('data-resize'), x0 = ev.clientX, w0 = anchoDeCol(c);
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  document.body.classList.add('redimensionando');
  var mover = function (e) {
    var w = Math.round(Math.max(ANCHO_MIN, Math.min(ANCHO_MAX, w0 + e.clientX - x0)));
    S.anchos[c] = w; aplicarAncho(c, w);
  };
  var soltar = function () {
    h.removeEventListener('pointermove', mover);
    h.removeEventListener('pointerup', soltar);
    h.removeEventListener('pointercancel', soltar);
    document.body.classList.remove('redimensionando');
    guardarPrefsPlanilla();
  };
  h.addEventListener('pointermove', mover);
  h.addEventListener('pointerup', soltar);
  h.addEventListener('pointercancel', soltar);
});

// Doble clic en el borde: la columna vuelve a su ancho original.
document.addEventListener('dblclick', function (ev) {
  var h = ev.target.closest && ev.target.closest('.th-resize');
  if (!h) return;
  ev.preventDefault(); ev.stopPropagation();
  var c = h.getAttribute('data-resize');
  delete S.anchos[c];
  aplicarAncho(c, anchoDeCol(c));
  guardarPrefsPlanilla();
}, true);

// Doble clic en una celda de la planilla: se edita ahí mismo.
document.addEventListener('dblclick', function (ev) {
  var td = ev.target.closest && ev.target.closest('.tbl-hoja td[data-c]');
  if (!td || td.classList.contains('editando')) return;
  clearTimeout(S.tAbrir);
  ev.preventDefault();
  // El doble clic del navegador también selecciona el texto: se saca.
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  if (S.comPop || S.comCtx) {
    S.comPop = null; S.comCtx = null; S.comUI = {};
    Array.prototype.forEach.call(document.querySelectorAll('.com-pop, .com-ctx'), function (n) { n.remove(); });
  }
  editarCelda(td);
});

document.addEventListener('keydown', function (ev) {
  if (S.editCel || S.moverCtr || S.menuCol || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var t = ev.target;
  if (t && (/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(t.tagName) || t.isContentEditable)) return;
  var td = tdActiva();
  if (ev.key === 'Tab' && td && !ev.ctrlKey && !hayAlgoEncima()) {
    // Como en Sheets: Tab va a la celda de la derecha, Mayús+Tab a la de la izquierda, y al final de la fila pasa a la siguiente.
    // Esc suelta la celda y el Tab vuelve a recorrer la página.
    var vec = celdaVecina(td, ev.shiftKey ? -1 : 1, 0, true);
    if (vec) { ev.preventDefault(); irACelda(vec); return; }
  }
  if (ev.key === 'Escape' && nSelFilas()) { if (td) td.classList.remove('cel-act'); S.celdaAct = null; return limpiarSelFilas(); }
  if (!td) return;
  if (ev.key === 'Enter' || ev.key === 'F2') { ev.preventDefault(); return editarCelda(td); }
  if (ev.key === 'Escape') { td.classList.remove('cel-act'); S.celdaAct = null; return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace') {
    var cd = td.getAttribute('data-c');
    if (CAMPOS[cd] && CAMPOS[cd].tipo !== 'semaforo' && !motivoNoEditable(filaPorId(td.closest('tr').getAttribute('data-f')), cd)) {
      ev.preventDefault(); encolarCambio(td.closest('tr').getAttribute('data-f'), cd, '');
    }
    return;
  }
  var mov = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
  if (!mov) return;
  ev.preventDefault();

  if (mov[0]) {
    sig = mov[0] < 0 ? td.previousElementSibling : td.nextElementSibling;
    while (sig && !sig.getAttribute('data-c')) sig = mov[0] < 0 ? sig.previousElementSibling : sig.nextElementSibling;
  } else {
    var tr2 = mov[1] < 0 ? tr.previousElementSibling : tr.nextElementSibling;
    if (tr2) sig = tr2.querySelector('td[data-c="' + td.getAttribute('data-c') + '"]');
  }
  if (sig) { marcarCeldaActiva(sig); sig.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
});

// Ctrl+C con una celda marcada y nada seleccionado: se copia el contenido de la celda.
// Si lo último que se marcó fueron filas, se copian como en Sheets (columnas separadas por tab) para pegarlas en una planilla.
function textoParaCopiar() {
  if (S.editCel) return null;
  try { if (String(window.getSelection())) return null; } catch (e) {}
  var limpiar = function (td) { return td.innerText.replace(/\s+/g, ' ').trim(); };
  if (S.copiarFilas && nSelFilas()) {
    var trs = document.querySelectorAll('.tbl-hoja tbody tr.fila-sel');
    return Array.prototype.map.call(trs, function (tr) {
      return Array.prototype.map.call(tr.querySelectorAll('td[data-c]'), limpiar).join('\t');
    }).join('\n');
  }
  var td = tdActiva();
  return td ? limpiar(td) : null;
}
function copiarAlPortapapeles(texto) {
  var respaldo = function () {
    var ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.parentNode.removeChild(ta); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto).catch(function () { return respaldo(); });
  respaldo();
}
document.addEventListener('copy', function (ev) {
  var tx = textoParaCopiar();
  if (tx === null || tx === '') return;
  ev.clipboardData.setData('text/plain', tx);
  ev.preventDefault();
  S.copiadoEn = Date.now();
});
// Algunos navegadores no disparan «copy» si no hay nada seleccionado: se atiende la tecla directamente.
document.addEventListener('keydown', function (ev) {
  if (!(ev.ctrlKey || ev.metaKey) || ev.altKey || String(ev.key).toLowerCase() !== 'c') return;
  var t = ev.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  var tx = textoParaCopiar();
  if (tx === null || tx === '') return;
  setTimeout(function () {
    if (S.copiadoEn && Date.now() - S.copiadoEn < 400) { toast('Copiado', 'ok', 1200); return; }   // ya lo copió el evento «copy»
    copiarAlPortapapeles(tx); toast('Copiado', 'ok', 1200);
  }, 60);
});

// Enter guarda, Escape descarta, Tab guarda y deja seguir.
document.addEventListener('keydown', function (ev) {

    ops.forEach(function (o) { o.setAttribute('aria-checked', String(o === nuevo)); });

  }
  if (ev.key === 'Tab' && ev.target.hasAttribute('data-sem') && !ev.shiftKey && S.editCel.td.querySelector('[data-txtsem]')) {
    ev.preventDefault(); ev.stopPropagation(); S.editCel.td.querySelector('[data-txtsem]').focus(); return;   // del color al texto
  }

    var orig = {};
    Object.keys(ref0.mapa).forEach(function (campo) {
      var raw = ref0.celdas[ref0.mapa[campo]];
      if (campo === 'fecha') {
        var d0 = normFecha(raw);
        orig[campo] = esFecha(d0)
          ? d0.getUTCFullYear() + '-' + String(d0.getUTCMonth() + 1).padStart(2, '0') +
            '-' + String(d0.getUTCDate()).padStart(2, '0')
          : (raw == null ? '' : String(raw));
      } else {
        orig[campo] = raw == null ? '' : String(raw);
      }
    });
    S.editCtr = { contrato: kctr, orig: orig, cambios: {} };

    return pintar();
  }
  if (act === 'ctrcerrar') {
    var hay = S.editCtr && Object.keys(S.editCtr.cambios).length;
