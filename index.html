        '<rect x="44" y="14" width="6" height="14" rx="1.5"/>' +
        '<path d="M11 32h42l-6 13a5 5 0 0 1-4.5 3H21.5a5 5 0 0 1-4.5-3z"/>' +
        '</g></svg>' +
      '<div><h1>Control de embarques</h1>' +
        '<p class="sello">' + esc(S.cfg.titulo || '') +
          (S.guardando > 0 ? ' · guardando…' : '') + '</p></div>' +
    '</div>' +
    '<div class="topbar-acc">' +
      (S.usuario ? '<span class="quien-soy">' +
        esc(nombreCortoAutor(S.usuario.email)) + '</span>' : '') +
      '<button data-act="recargar"' + (S.cargando ? ' disabled' : '') + '>' +
        (S.cargando ? 'Actualizando…' : 'Actualizar') + '</button>' +
      '<button data-act="pestanas">Pestañas</button>' +
      '<button data-act="salir">Cambiar planilla</button>' +
    '</div>' +
  '</div></header>';
}

function diagnostico() {
  var criticas = ['contract', 'importer', 'etd', 'eta'];
  var h = '';

  (S.avisos || []).forEach(function (a) {
    h += '<div class="aviso">' + esc(a) + '</div>';
  });

  S.fuentes.forEach(function (src) {
    var faltan = criticas.filter(function (c) { return src.mapa[c] === undefined; });
    if (faltan.length) {
      h += '<div class="aviso">En <b>' + esc(src.tab) + '</b> no encontré: <b>' +
        faltan.map(function (c) { return CAMPOS[c].label; }).join(', ') +
        '</b>. Las alertas que dependen de esas columnas quedan apagadas.</div>';
    }
  });

  if ((S.cfg.tabsCtr || []).length && S.contratos.size === 0) {
    h += '<div class="aviso">No se cargó ningún contrato, así que no hay condiciones de pago ' +
      'y las alertas de cobro están apagadas.</div>';
  }

  h += '<details class="diag"><summary>' + S.datos.filas.length + ' embarques de ' +
    S.fuentes.length + (S.fuentes.length === 1 ? ' pestaña' : ' pestañas') +
    ' · ' + S.contratos.size + ' contratos</summary>';

  S.fuentes.forEach(function (src) {
    var na = Object.keys(src.noAplica);
    h += '<p style="margin:8px 0 0"><b>' + esc(src.tab) + '</b> · ' +
      src.filas.length + ' filas · ' + Object.keys(src.mapa).length + ' columnas reconocidas' +
      (na.length ? '<br>Vacías en toda la pestaña, no se exigen: ' +
        na.map(function (c) { return esc(CAMPOS[c].label); }).join(', ') : '') +
      (src.extras.length ? '<br>Ignora: ' +
        src.extras.map(function (e) { return esc(e.h); }).join(', ') : '') + '</p>';
  });

  return h + '</details>';
}

// Un estado nunca se comunica solo con color: siempre color + palabra.
function pill(campo, estado) {
  var cls = { ok:'ok', pendiente:'pend', atencion:'sol', vacio:'hueco' }[estado || 'vacio'];
  return '<span class="pill ' + cls + '"><span class="pt"></span>' +
    CAMPOS[campo].label + ': ' + etiqueta(campo, estado) + '</span>';
}

function pasosEtapa(idEtapa) {
  var i = ETAPAS.map(function (e) { return e.id; }).indexOf(idEtapa);
  var et = ETAPAS[i];
  return '<span class="etapa"><span class="pasos">' +
    ETAPAS.map(function (_, j) { return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('') +
    '</span>' + (et ? et.label : '') + '</span>';
}

// Barra de ruta con la posición estimada del buque entre ETD y ETA.
function barraRuta(emb) {
  var hoy = new Date();
  var pct = null;
  if (esFecha(emb.etd) && esFecha(emb.eta) && emb.eta > emb.etd) {
    pct = Math.max(0, Math.min(1, (hoy - emb.etd) / (emb.eta - emb.etd)));
  }
  var destino = emb.port || '—';
  return '<div class="ruta">' +
    '<span class="f' + (emb.etd && emb.etd.anioAsumido ? ' asumida' : '') + '">' +
      (esFecha(emb.etd) ? fmtFecha(emb.etd) : '··') + '</span>' +
    '<span class="via">' +
      (pct !== null ? '<i style="width:' + Math.round(pct * 100) + '%"></i>' +
        '<b style="left:' + Math.round(pct * 100) + '%"></b>' : '') +
    '</span>' +
    '<span class="pto">' + esc(destino) + '</span>' +
    '<span class="f' + (emb.eta && emb.eta.anioAsumido ? ' asumida' : '') + '" ' +
      (emb.eta && emb.eta.anioAsumido
        ? 'title="Sin año en la planilla, se asume ' + emb.eta.getUTCFullYear() + '"' : '') + '>' +
      (esFecha(emb.eta) ? fmtFecha(emb.eta) : '··') + '</span>' +
    '</div>';
}

function vistaControl(evs, cuenta) {
  var orden = { critico: 3, alto: 2, medio: 1 };
  var con = evs.filter(function (x) { return x.ev.alertas.length; })
    .sort(function (a, b) { return (orden[b.ev.nivelMax] || 0) - (orden[a.ev.nivelMax] || 0); });

  function boton(nivel, n, label, cls) {
    return '<button class="' + cls + '" data-act="fnivel" data-n="' + nivel + '" ' +
      'aria-pressed="' + (S.filtroNivel === nivel) + '">' +
      '<span class="n">' + n + '</span><span class="l">' + label + '</span></button>';
  }

  var h = '<div class="tira">' +
    boton('critico', cuenta.critico, 'Acción ahora', 'crit') +
    boton('alto', cuenta.alto, 'Esta semana', 'alt') +
    boton('medio', cuenta.medio, 'Datos incompletos', '') +
    boton('ok', cuenta.ok, 'Al día', 'bien') +
    '</div>';

  if (!evs.length) return h + '<p class="centro">No hay filas con datos en las pestañas elegidas.</p>';

  if (S.filtroNivel === 'ok') {
    var alDia = evs.filter(function (x) { return !x.ev.nivelMax; });
    return h + '<h2 class="gt">Al día · ' + alDia.length + '</h2>' +
      '<div class="lista">' + alDia.map(function (x) { return filaEmbarque(x); }).join('') + '</div>';
  }

  if (!con.length) return h + '<p class="centro">No hay nada pendiente. Todo al día.</p>';

  [['critico', 'Requieren acción ahora'], ['alto', 'Para esta semana'], ['medio', 'Datos incompletos']]
    .forEach(function (g) {
      if (S.filtroNivel && S.filtroNivel !== g[0]) return;
      var items = con.filter(function (x) { return x.ev.nivelMax === g[0]; });
      if (!items.length) return;
      h += '<h2 class="gt">' + g[1] + ' <span>' + items.length + '</span></h2>' +
        '<div class="lista">' +
        items.map(function (x) { return filaEmbarque(x, { alerta: true }); }).join('') +
        '</div>';
    });
  return h;
}

// Una sola tarjeta para las dos vistas. En Control se le antepone la alerta,
// pero los datos del embarque son siempre los mismos: si podés trackearlo en
// una vista, podés trackearlo en la otra.
function filaEmbarque(x, opts) {
  opts = opts || {};
  var emb = x.emb, src = x.src, ev = x.ev;
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });

  var partes = (emb.exporter && emb.importer)
    ? '<span class="exp">' + esc(emb.exporter) + '</span>' +
      '<span class="fl">→</span><span class="imp">' + esc(emb.importer) + '</span>'
    : '<span class="imp">' + esc(emb.importer || emb.exporter || 'Sin cargar') + '</span>';

  var tns = (emb.tns !== null && emb.tns !== undefined && emb.tns !== '')
    ? Number(emb.tns).toLocaleString('es-AR') + ' tn' : '';
  var sub = [emb.product, emb.tipo, tns].filter(Boolean).join(' · ');

  var refs = [['contract', 'Contrato'], ['invoice', 'Factura'], ['bl', 'BL'],
              ['booking', 'Booking'], ['containers', 'Contenedores']]
    .filter(function (r) { return src.mapa[r[0]] !== undefined && !src.noAplica[r[0]]; })
    .map(function (r) {
      var v = emb[r[0]];
      return '<span class="ref"><em>' + r[1] + '</em>' +
        (v ? '<b>' + esc(v) + '</b>' : '<u>falta</u>') + '</span>';
    }).join('');

  var notas = sems.filter(function (c) { return emb._notas && emb._notas[c]; })
    .map(function (c) {
      var cls = { ok:'ok', pendiente:'pend', atencion:'sol' }[emb[c]] || 'gris';
      return '<p class="nota ' + cls + '"><em>' + CAMPOS[c].label + '</em>' +
        esc(emb._notas[c]) + '</p>';
    }).join('');

  var alerta = '';
  if (opts.alerta && ev.alertas.length) {
    var a = ev.alertas[0], resto = ev.alertas.length - 1;
    alerta = '<div class="aviso-fila ' + a.nivel + '">' +
      '<p class="tit">' + esc(a.titulo) + '</p>' +
      '<p class="det">' + esc(a.detalle) + '</p>' +
      (resto > 0 ? '<p class="mas">+' + resto + (resto > 1 ? ' pendientes más' : ' pendiente más') + '</p>' : '') +
      '</div>';
  }

  return '<article class="emb' + (emb._id === S.sel ? ' sel' : '') +
    (opts.alerta && ev.nivelMax ? ' n-' + ev.nivelMax : '') +
    '" data-act="abrir" data-f="' + esc(emb._id) + '" tabindex="0">' +

    '<div class="fila-top">' +
      '<div class="ident">' +
        (S.cfg.adviceUrl && emb._tab === (S.cfg.tabAdvice || emb._tab)
          ? '<label class="marcar" title="Seleccionar para el advice">' +
            '<input type="checkbox" data-marcar="' + esc(emb._id) + '"' +
            (S.marcados && S.marcados[emb._id] ? ' checked' : '') + '></label>'
          : '') +
        '<div class="partes">' + partes + '</div>' +
        (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        (S.fuentes.length > 1 ? '<div class="orig">' + esc(emb._tab) + '</div>' : '') +
      '</div>' +
      '<div class="medio">' + barraRuta(emb) +
        '<div class="et-wrap">' + pasosEtapa(ev.etapa) + '</div></div>' +
      '<div class="estados">' +
        sems.map(function (c) { return pill(c, emb[c]); }).join('') +
        (emb._faltaComprobante
          ? '<span class="pill nar"><span class="pt"></span>Falta comprobante</span>' : '') +
        (emb._aFacturar
          ? '<span class="pill ok"><span class="pt"></span>Cliente pagó</span>' : '') +
        (function () {
          var n = comentariosDe(emb).length;
          return n ? '<span class="pill coment"><span class="pt"></span>' + n +
            (n === 1 ? ' comentario' : ' comentarios') + '</span>' : '';
        })() +
      '</div>' +
    '</div>' +

    alerta +
    (refs ? '<div class="refs">' + refs + '</div>' : '') +
    (notas ? '<div class="notas">' + notas + '</div>' : '') +
    (function () {
      var cs = comentariosDe(emb);
      if (!cs.length) return '';
      var u = cs[cs.length - 1];
      return '<div class="ultimo-com">' +
        '<span class="autor">' + esc(nombreCortoAutor(u.autor)) + '</span>' +
        '<span class="txt">' + esc(u.texto) + '</span>' +
        (cs.length > 1 ? '<span class="mas">+' + (cs.length - 1) + '</span>' : '') +
        '</div>';
    })() +
    '</article>';
}

// juan.perez@empresa.com -> juan.perez
function nombreCortoAutor(a) {
  var t = String(a || '');
  return t.indexOf('@') > 0 ? t.slice(0, t.indexOf('@')) : t;
}


var ORDENES = {
  eta_asc:  { label: 'ETA más próxima',      campo: 'eta', dir: 1 },
  eta_desc: { label: 'ETA más lejana',       campo: 'eta', dir: -1 },
  etd_desc: { label: 'ETD más reciente',     campo: 'etd', dir: -1 },
  etd_asc:  { label: 'ETD más antiguo',      campo: 'etd', dir: 1 },
  urgencia: { label: 'Urgencia',             campo: null },
  cliente:  { label: 'Cliente (A-Z)',        campo: null }
};

function ordenar(filas, clave) {
  // Si se clickeó un encabezado de la planilla, ese orden manda.
  if (S.ordenCol) {
    var campo = S.ordenCol.campo, dir = S.ordenCol.dir;
    return filas.slice().sort(function (a, b) {
      var va = valorOrden(a.emb, campo), vb = valorOrden(b.emb, campo);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'es', { numeric: true }) * dir;
    });
  }

  var o = ORDENES[clave] || ORDENES.eta_asc;
  var copia = filas.slice();

  if (clave === 'urgencia') {
    var pr = { critico: 3, alto: 2, medio: 1 };
    return copia.sort(function (a, b) {
      var d = (pr[b.ev.nivelMax] || 0) - (pr[a.ev.nivelMax] || 0);
      if (d) return d;
      return b.ev.alertas.length - a.ev.alertas.length;
    });
  }
  if (clave === 'cliente') {
    return copia.sort(function (a, b) {
      return String(a.emb.importer || '').localeCompare(String(b.emb.importer || ''), 'es');
    });
  }
  // Las filas sin fecha van siempre al final, ordene como ordene.
  return copia.sort(function (a, b) {
    var fa = a.emb[o.campo], fb = b.emb[o.campo];
    var va = esFecha(fa) ? fa.getTime() : null;
    var vb = esFecha(fb) ? fb.getTime() : null;
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    return (va - vb) * o.dir;
  });
}

function valorOrden(emb, campo) {
  var v = emb[campo];
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v.getTime();
  if (typeof v === 'object' && v.invalida) return null;
  if (SEMAFOROS.indexOf(campo) >= 0) {
    return ['vacio', 'pendiente', 'atencion', 'ok'].indexOf(v);
  }
  return v;
}

// Texto que se ve en una celda, que es contra lo que filtra el usuario.
function textoCelda(emb, campo) {
  if (SEMAFOROS.indexOf(campo) >= 0) {
    var n = (emb._notas && emb._notas[campo]) || '';
    return etiqueta(campo, emb[campo]) + ' ' + n;
  }
  var v = emb[campo];
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return fmtFecha(v);
  if (typeof v === 'object' && v.invalida) return String(v.crudo);
  return String(v);
}

function aplicarFiltros(evs) {
  var q = S.busca.trim().toLowerCase();
  return evs.filter(function (x) {
    var emb = x.emb, src = x.src;

    if (q) {
      var campos = [emb.contract, emb.importer, emb.exporter, emb.bl, emb.booking,
                    emb.invoice, emb.vessel, emb.port, emb.product, emb._tab];
      if (emb._notas) SEMAFOROS.forEach(function (c) { campos.push(emb._notas[c]); });
      if (!campos.some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return false;
    }
    if (S.filtroTab && emb._tab !== S.filtroTab) return false;
    if (S.filtroEtapa && x.ev.etapa !== S.filtroEtapa) return false;

    // Estado de cada semáforo. "na" = la pestaña no lo usa.
    for (var i = 0; i < SEMAFOROS.length; i++) {
      var c = SEMAFOROS[i], want = S.f[c];
      if (!want) continue;
      if (src.mapa[c] === undefined || src.noAplica[c]) return false;
      if ((emb[c] || 'vacio') !== want) return false;
    }
    if (S.f.fact === 'si' && !emb._aFacturar) return false;
    if (S.f.fact === 'no' && emb._aFacturar) return false;
    if (S.f.cbte === 'si' && !emb._faltaComprobante) return false;
    if (S.f.cbte === 'no' && emb._faltaComprobante) return false;

    // Filtros escritos en el encabezado de la vista planilla.
    var claves = Object.keys(S.fCol);
    for (var j = 0; j < claves.length; j++) {
      var cc = claves[j], q2 = String(S.fCol[cc] || '').trim().toLowerCase();
      if (!q2) continue;
      if (src.mapa[cc] === undefined) return false;
      if (textoCelda(emb, cc).toLowerCase().indexOf(q2) < 0) return false;
    }

    // Falta un dato concreto.
    if (S.f.falta) {
      var k = S.f.falta;
      if (src.mapa[k] === undefined || src.noAplica[k]) return false;
      var v = emb[k];
      if (v !== null && v !== undefined && v !== '') return false;
    }
    return true;
  });
}

function filtrosActivos() {
  var n = 0;
  SEMAFOROS.forEach(function (c) { if (S.f[c]) n++; });
  if (S.f.cbte) n++;
  if (S.f.fact) n++;
  if (S.f.falta) n++;
  if (S.filtroTab) n++;
  if (S.filtroEtapa) n++;
  Object.keys(S.fCol).forEach(function (k) { if (S.fCol[k]) n++; });
  return n;
}

function vistaGrilla(evs) {
  var filas = ordenar(aplicarFiltros(evs), S.orden);
  var nf = filtrosActivos();

  var h = '<div class="filtros">' +
    '<input id="busca" placeholder="Buscar cliente, contrato, BL, factura, anotaciones" value="' +
      esc(S.busca) + '" aria-label="Buscar">' +
    '<select id="orden" aria-label="Ordenar por">' +
      Object.keys(ORDENES).map(function (k) {
        return '<option value="' + k + '"' + (S.orden === k ? ' selected' : '') + '>' +
          ORDENES[k].label + '</option>';
      }).join('') + '</select>' +
    '<button data-act="pfiltros" aria-pressed="' + S.panelFiltros + '">Filtros' +
      (nf ? ' · ' + nf : '') + '</button>' +
    '<span class="modos" style="margin-left:auto">' +
      [['tarjetas', 'Tarjetas'], ['tabla', 'Tabla'], ['planilla', 'Planilla']]
        .map(function (m) {
          return '<button data-act="modo" data-m="' + m[0] + '" aria-pressed="' +
            (S.modo === m[0]) + '">' + m[1] + '</button>';
        }).join('') +
    '</span>' +
    '<button data-act="csv">Exportar CSV</button>' +
    '</div>';

  if (S.panelFiltros) h += panelFiltros(evs);

  // Etapas: siempre visibles, es el filtro que más se usa.
  var cuentaEtapa = {};
  evs.forEach(function (x) { cuentaEtapa[x.ev.etapa] = (cuentaEtapa[x.ev.etapa] || 0) + 1; });
  h += '<div class="chips">' +
    '<button data-act="fetapa" data-e="" aria-pressed="' + (!S.filtroEtapa) + '">Todas · ' + evs.length + '</button>' +
    ETAPAS.filter(function (e) { return cuentaEtapa[e.id]; }).map(function (e) {
      return '<button data-act="fetapa" data-e="' + e.id + '" aria-pressed="' +
        (S.filtroEtapa === e.id) + '">' + e.label + ' · ' + cuentaEtapa[e.id] + '</button>';
    }).join('') + '</div>';

  h += '<p class="conteo">' + filas.length +
    (filas.length === 1 ? ' embarque' : ' embarques') +
    (filas.length !== evs.length ? ' de ' + evs.length : '') +
    ' · ordenado por ' + ORDENES[S.orden].label.toLowerCase() + '</p>';

  if (!filas.length) {
    return h + '<p class="centro">Nada coincide con el filtro.' +
      (nf ? ' <button data-act="limpiar">Limpiar filtros</button>' : '') + '</p>';
  }

  if (S.modo === 'planilla') return h + vistaPlanilla(filas);
  if (S.modo === 'tabla') return h + tablaCompacta(filas);
  return h + '<div class="lista">' + filas.map(function (x) { return filaEmbarque(x); }).join('') + '</div>';
}

function panelFiltros(evs) {
  var hay = function (c) {
    return S.fuentes.some(function (f) { return f.mapa[c] !== undefined && !f.noAplica[c]; });
  };

  function selEstado(campo) {
    if (!hay(campo)) return '';
    var ops = ['', 'ok', 'pendiente', 'atencion', 'vacio'];
    return '<div class="fcampo"><label for="fs-' + campo + '">' + CAMPOS[campo].label + '</label>' +
      '<select id="fs-' + campo + '" data-festado="' + campo + '">' +
      ops.map(function (o) {
        return '<option value="' + o + '"' + (S.f[campo] === o ? ' selected' : '') + '>' +
          (o === '' ? 'Cualquiera' : etiqueta(campo, o)) + '</option>';
      }).join('') + '</select></div>';
  }

  var faltables = [['invoice', 'Factura'], ['bl', 'BL'], ['booking', 'Booking'],
                   ['containers', 'Contenedores'], ['vessel', 'Buque'], ['tracking', 'Tracking']]
    .filter(function (r) { return hay(r[0]); });

  return '<div class="caja-filtros">' +
    '<div class="fgrid">' +
      SEMAFOROS.map(selEstado).join('') +

      '<div class="fcampo"><label for="ffact">Cobro del cliente</label><select id="ffact">' +
        '<option value="">Cualquiera</option>' +
        '<option value="si"' + (S.f.fact === 'si' ? ' selected' : '') + '>Ya pagó (a facturar)</option>' +
        '<option value="no"' + (S.f.fact === 'no' ? ' selected' : '') + '>Todavía no</option>' +
        '</select></div>' +
      '<div class="fcampo"><label for="fcbte">Comprobante</label><select id="fcbte">' +
        '<option value="">Cualquiera</option>' +
        '<option value="si"' + (S.f.cbte === 'si' ? ' selected' : '') + '>Falta</option>' +
        '<option value="no"' + (S.f.cbte === 'no' ? ' selected' : '') + '>No falta</option>' +
        '</select></div>' +
      (faltables.length
        ? '<div class="fcampo"><label for="ffalta">Le falta cargar</label><select id="ffalta">' +
          '<option value="">Nada en particular</option>' +
          faltables.map(function (r) {
            return '<option value="' + r[0] + '"' + (S.f.falta === r[0] ? ' selected' : '') +
              '>' + r[1] + '</option>';
          }).join('') + '</select></div>'
        : '') +
    '</div>' +
    (filtrosActivos() ? '<button data-act="limpiar" class="limpiar">Limpiar filtros</button>' : '') +
    '</div>';
}

// Vista densa, para comparar muchas filas de un saque.
function tablaCompacta(filas) {
  var hay = function (c) { return S.fuentes.some(function (f) { return f.mapa[c] !== undefined; }); };

  // [campo, ancho, clase, orden asociado]
  var cols = [
    ['exporter', 'Exportador', '', null],
    ['importer', 'Importador', '', null],
    ['contract', 'Contrato', 'cod', null],
    ['product', 'Producto', '', null],
    ['tns', 'Tns', 'num', null],
    ['etd', 'ETD', '', 'etd'],
    ['eta', 'ETA', '', 'eta'],
    ['port', 'Destino', '', null],
    ['invoice', 'Factura', 'cod', null],
    ['bl', 'BL', 'cod', null],
    ['booking', 'Booking', 'cod', null]
  ].filter(function (c) { return hay(c[0]); });

  var sems = SEMAFOROS.filter(hay);

  function th(c) {
    if (!c[3]) return '<th>' + c[1] + '</th>';
    // Clic en ETD o ETA alterna ascendente / descendente.
    var asc = c[3] + '_asc', desc = c[3] + '_desc';
    var actual = S.orden === asc ? '↑' : S.orden === desc ? '↓' : '';
    var prox = S.orden === desc ? asc : desc;
    return '<th class="ord" data-act="orden" data-o="' + prox + '" title="Ordenar por ' + c[1] + '">' +
      c[1] + (actual ? ' <span class="fl-ord">' + actual + '</span>' : '') + '</th>';
  }

  return '<div class="marco"><table><thead><tr>' +
    cols.map(th).join('') +
    '<th>Etapa</th>' +
    sems.map(function (c) { return '<th>' + CAMPOS[c].label + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    filas.map(function (x) {
      var src = x.src, emb = x.emb;
      return '<tr' + (emb._id === S.sel ? ' class="sel"' : '') +
        ' data-act="abrir" data-f="' + esc(emb._id) + '">' +
        cols.map(function (c) {
          var cls = c[2] ? ' class="' + c[2] + '"' : '';
          if (src.mapa[c[0]] === undefined) return '<td' + cls + '><span class="vacia">·</span></td>';
          return '<td' + cls + '>' + pintarCelda(emb[c[0]]) + '</td>';
        }).join('') +
        '<td class="nw">' + ((ETAPAS.filter(function (e) { return e.id === x.ev.etapa; })[0] || {}).label || '') + '</td>' +
        sems.map(function (c) {
          if (src.mapa[c] === undefined || src.noAplica[c]) return '<td><span class="vacia">·</span></td>';
          var cl = { ok:'ok', pendiente:'pend', atencion:'sol', vacio:'hueco' }[emb[c] || 'vacio'];
          return '<td><span class="pill ' + cl + '"><span class="pt"></span>' +
            etiqueta(c, emb[c]) + '</span></td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

// ===========================================================================
// Contratos: cuánto se contrató, cuánto se entregó y cuánto falta.
// Lo entregado sale de sumar los embarques de TODAS las pestañas (marítimas,
// terrestres y las que ya pasaron a facturar), atados por el código de contrato.
// ===========================================================================

function calcularContratos() {
  var mapa = new Map();

  S.contratos.forEach(function (c, k) {
    mapa.set(k, {
      contrato: k, origen: c.origen, cond: c.cond,
      contratado: c.tns, importador: c.importador, exportador: c.exportador,
      producto: c.producto, periodo: c.periodo, comision: c.comision,
      entregadoHoja: c.entregadoHoja, saldoHoja: c.saldoHoja,
      entregado: 0, embarques: [], aFacturar: 0
    });
  });

  // Embarques activos (respetando el filtro marítimo/terrestre).
  S.datos.filas.filter(function (e) {
    return !S.filtroTab || e._tab === S.filtroTab;
  }).forEach(function (emb) {
    var k = String(emb.contract || '').trim();
    if (!k) return;
    var reg = mapa.get(k);
    if (!reg) {
      reg = { contrato: k, huerfano: true, contratado: null,
              entregado: 0, embarques: [], aFacturar: 0 };
      mapa.set(k, reg);
    }
    reg.entregado += (emb.tns || 0);
    reg.embarques.push(emb);
    if (emb._aFacturar) reg.aFacturar++;
    if (!reg.importador) reg.importador = emb.importer;
    if (!reg.exportador) reg.exportador = emb.exporter;
  });

  // Embarques del contrato que ya pasaron a facturar y salieron de las
  // pestañas activas. Solo para informar, no se suman: la planilla ya los
  // tiene contados en su propia columna de entregado.
  S.facturar.forEach(function (f, k) {
    var reg = mapa.get(k);
    if (!reg) return;
    var activosFacturados = reg.embarques.filter(function (e) { return e._aFacturar; }).length;
    reg.historicos = Math.max(0, f.filas - activosFacturados);
    reg.tnsFacturadas = f.tns;
  });

  var lista = [];
  mapa.forEach(function (r) {
    // La planilla ya calcula entregado y saldo sobre TODO el histórico. Eso es
    // más completo que sumar solo las pestañas activas, así que manda.
    // Lo calculado por la app queda como contraste.
    r.entregadoActivo = r.entregado;
    var hojaSirve = (r.entregadoHoja !== null && r.entregadoHoja !== undefined);

    if (hojaSirve) {
      r.entregado = r.entregadoHoja;
      r.saldo = (r.saldoHoja !== null && r.saldoHoja !== undefined)
        ? r.saldoHoja
        : (r.contratado != null ? r.contratado - r.entregado : null);
      r.fuenteSaldo = 'planilla';
    } else {
      r.saldo = (r.contratado !== null && r.contratado !== undefined)
        ? r.contratado - r.entregado : null;
      r.fuenteSaldo = 'app';
    }

    r.pct = (r.contratado > 0) ? Math.min(1, r.entregado / r.contratado) : null;
    lista.push(r);
  });
  return lista;
}

function vistaContratos() {
  var lista = calcularContratos();
  var q = S.busca.trim().toLowerCase();

  if (q) lista = lista.filter(function (r) {
    return [r.contrato, r.importador, r.exportador]
      .some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; });
  });

  if (S.fContrato === 'abiertos') lista = lista.filter(function (r) { return r.saldo > 0.5; });
  if (S.fContrato === 'completos') lista = lista.filter(function (r) { return r.saldo !== null && r.saldo <= 0.5; });
  if (S.fContrato === 'excedidos') lista = lista.filter(function (r) { return r.saldo !== null && r.saldo < -0.5; });
  if (S.fContrato === 'sin_contrato') lista = lista.filter(function (r) { return r.huerfano; });
  if (S.fContrato === 'con_embarques') lista = lista.filter(function (r) { return r.embarques.length; });

  // Solo tienen sentido los contratos con movimiento o con saldo pendiente.
  if (!S.fContrato) lista = lista.filter(function (r) { return r.embarques.length || r.saldo > 0.5; });

  lista.sort(function (a, b) {
    if (b.embarques.length !== a.embarques.length) return b.embarques.length - a.embarques.length;
    return String(a.contrato).localeCompare(String(b.contrato), 'es');
  });

  var conEmb = lista.filter(function (r) { return r.embarques.length; }).length;

  var h = '';

  if (!S.alta) {
    h += '<div class="barra-alta">' +
      (S.cfg.tabAlta
        ? '<button class="primario grande" data-act="altaabrir">' +
          '<span class="mas">+</span> Nuevo contrato</button>' +
          '<span class="ayuda">Se agrega en "' + esc(S.cfg.tabAlta) +
            '", arriba de la fila TOTAL</span>'
        : '<span class="ayuda">Para cargar contratos desde acá, elegí en qué pestaña ' +
          'insertarlos.</span><button data-act="pestanas">Configurar pestañas</button>') +
      '</div>';
  }

  h += (S.alta ? formAlta() : '') +
    '<div class="filtros">' +
    '<input id="busca" placeholder="Buscar contrato, cliente" value="' + esc(S.busca) + '" aria-label="Buscar">' +
    '<button data-act="csv" style="margin-left:auto">Exportar CSV</button></div>' +
    '<div class="chips">' +
    [['', 'Con movimiento'], ['abiertos', 'Con saldo'], ['completos', 'Completos'],
     ['excedidos', 'Excedidos'], ['sin_contrato', 'Sin contrato']]
      .map(function (o) {
        return '<button data-act="fcontrato" data-c="' + o[0] + '" aria-pressed="' +
          (S.fContrato === o[0]) + '">' + o[1] + '</button>';
      }).join('') + '</div>' +
    '<p class="conteo">' + lista.length + ' contratos · ' + conEmb + ' con embarques activos</p>';

  if (!lista.length) return h + '<p class="centro">Nada coincide.</p>';

  return h + '<div class="lista">' + lista.map(filaContrato).join('') + '</div>';
}

// Escribir para ir acotando, en vez de buscar en una lista de 500. Si lo que
// se escribe no está en la base, no se inventa: hay que darlo de alta en el
// Peanut Matcher, porque si no el nombre no cruza con nada.
function comboAlta(campo, label, opciones, a) {
  var ops = opciones || [];
  var val = a[campo] || '';
  var ok = ops.some(function (o) { return clave(o) === clave(val); });
  return comboGen('a-' + campo, campo, label, ops, val, ok, 'alta');
}

function comboViejo(campo, label, opciones, a) {
  var val = a[campo] || '';
  var abierto = S.combo === campo;
  var q = clave(val);

  var coincide = opciones.filter(function (o) { return clave(o) === q; }).length > 0;
  var sugeridas = [];
  if (abierto) {
    sugeridas = (q
      ? opciones.filter(function (o) { return clave(o).indexOf(q) >= 0; })
          .sort(function (x, y) {
            // Primero las que empiezan igual: es lo que uno espera al tipear.
            var a1 = clave(x).indexOf(q) === 0 ? 0 : 1;
            var b1 = clave(y).indexOf(q) === 0 ? 0 : 1;
            return a1 - b1 || x.localeCompare(y, 'es');
          })
      : opciones).slice(0, 9);
  }

  var estado = '';
  if (val && !coincide && !abierto) {
    estado = '<p class="no-base">«' + esc(val) + '» no está en la base. ' +
      'Hay que agregarlo desde el <b>Peanut Matcher</b> y volver a abrir el alta.</p>';
  }

  return '<div class="campo combo-wrap' + (val && !coincide ? ' malo' : '') + '">' +
    '<label for="a-' + campo + '">' + label + ' <span class="req">·</span>' +
    (coincide ? '<span class="ok-tick">✓</span>' : '') + '</label>' +
    '<input id="a-' + campo + '" data-combo="' + campo + '" autocomplete="off" ' +
      'placeholder="Escribí para buscar" value="' + esc(val) + '">' +
    (abierto && sugeridas.length
      ? '<div class="combo-lista">' +
        sugeridas.map(function (o) {
          return '<button data-act="combosel" data-c="' + campo + '" ' +
            'data-v="' + esc(o) + '">' + resaltar(o, q) + '</button>';
        }).join('') +
        (q && !sugeridas.length ? '' : '') +
        '</div>'
      : '') +
    (abierto && q && !sugeridas.length
      ? '<div class="combo-lista"><p class="sin-match">Ninguno coincide con «' + esc(val) + '». ' +
        'Si es un cliente nuevo, cargalo primero en el <b>Peanut Matcher</b>.</p></div>'
      : '') +
    estado + '</div>';
}

function resaltar(texto, q) {
  if (!q) return esc(texto);
  var i = clave(texto).indexOf(q);
  if (i < 0) return esc(texto);
  return esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + q.length)) + '</b>' +
         esc(texto.slice(i + q.length));
}

// Guardar cambios de un contrato. Se escribe celda por celda solo lo que
// cambió, y nunca sobre las columnas con fórmula (Total, Comisión, ENT, Saldo).
var CAMPOS_EDIT_CTR = [
  ['fecha', 'Fecha', 'date'],
  ['exportador', 'Exportador', 'combo'],
  ['importador', 'Importador', 'combo'],
  ['producto', 'Producto', 'combo'],
  ['tipo', 'Tipo', 'combo'],
  ['tns', 'Toneladas', 'number'],
  ['precio', 'Precio USD/tn', 'number'],
  ['packaging', 'Packaging', 'text'],
  ['incoterm', 'Incoterm', 'text'],
  ['formaPago', 'Forma de pago', 'pago'],
  ['periodo', 'Período de embarque', 'text']
];

async function guardarContrato() {
  var e = S.editCtr;
  if (!e) return;
  var ref = S.ctrEditables.get(e.contrato);
  if (!ref) { S.editCtrError = 'No encontré la fila de este contrato.'; return pintar(); }

  var reqs = [];
  CAMPOS_EDIT_CTR.forEach(function (c) {
    var campo = c[0];
    if (!(campo in e.cambios)) return;
    var idx = ref.mapa[campo];
    if (idx === undefined) return;
    var val = e.cambios[campo];
    if (c[2] === 'number') val = val === '' ? '' : parseFloat(val);
    reqs.push({
      updateCells: {
        range: { sheetId: ref.sheetId, startRowIndex: ref.fila - 1, endRowIndex: ref.fila,
                 startColumnIndex: idx, endColumnIndex: idx + 1 },
        rows: [{ values: [{ userEnteredValue: aValorSheets(val) }] }],
        fields: 'userEnteredValue'
      }
    });
  });

  if (!reqs.length) { S.editCtr = null; return pintar(); }

  S.guardandoCtr = true; S.editCtrError = null; pintar();
  try {
    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: reqs })
    });
    S.editCtr = null;
    S.avisoOk = 'Contrato ' + e.contrato + ' actualizado en "' + ref.tab + '".';
    await cargarTodo();
  } catch (err) {
    S.editCtrError = 'No se pudo guardar: ' + err.message;
  } finally {
    S.guardandoCtr = false; pintar();
  }
}

function panelContrato() {
  var e = S.editCtr;
  var ref = S.ctrEditables.get(e.contrato);
  var L = S.listas || { exportadores: [], importadores: [], productos: [], tipos: [] };

  var v = function (campo) {
    if (campo in e.cambios) return e.cambios[campo];
    return e.orig[campo] == null ? '' : String(e.orig[campo]);
  };

  var listaDe = {
    exportador: L.exportadores, importador: L.importadores,
    producto: L.productos, tipo: L.tipos
  };

  var fuera = [];
  var campos = CAMPOS_EDIT_CTR.filter(function (c) {
    return ref && ref.mapa[c[0]] !== undefined;
  }).map(function (c) {
    var campo = c[0], label = c[1], tipo = c[2], val = v(campo);

    if (tipo === 'combo') {
      var ops = listaDe[campo] || [];
      var ok = ops.some(function (o) { return clave(o) === clave(val); });
      if (val && !ok) fuera.push(label);
      return comboGen('c-' + campo, campo, label, ops, val, ok, 'ctr');
    }
    if (tipo === 'pago') {
      var ops2 = S.formasPago.map(function (f) { return f.texto; });
      return comboGen('c-' + campo, campo, label, ops2, val, true, 'ctr', true);
    }
    if (tipo === 'date') {
      var iso = val;
      var d = normFecha(val);
      if (esFecha(d)) {
        iso = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') +
              '-' + String(d.getUTCDate()).padStart(2, '0');
      }
      return '<div class="campo"><label for="c-' + campo + '">' + label + '</label>' +
        '<input type="date" id="c-' + campo + '" data-ectr="' + campo + '" value="' +
        esc(iso) + '"></div>';
    }
    return '<div class="campo"><label for="c-' + campo + '">' + label + '</label>' +
      '<input id="c-' + campo + '" data-ectr="' + campo + '" type="' +
      (tipo === 'number' ? 'number' : 'text') + '" value="' + esc(val) + '"></div>';
  }).join('');

  var hayCambios = Object.keys(e.cambios).length > 0;

  return '<div class="velo" data-act="ctrcerrar"></div>' +
    '<aside class="panel" role="dialog" aria-label="Editar contrato">' +
    '<button class="cerrar" data-act="ctrcerrar">Cerrar</button>' +
    '<h2>' + esc(e.contrato) + '</h2>' +
    (ref
      ? '<p style="margin:2px 0 0;font-size:12.5px;color:var(--tinta3)">' +
        esc(ref.tab) + ' · fila ' + ref.fila + '</p>'
      : '<div class="error" style="margin-top:12px">Este contrato no está en las pestañas ' +
        'editables. Revisá la configuración de pestañas.</div>') +
    (S.editCtrError ? '<div class="error" style="margin-top:12px">' + esc(S.editCtrError) + '</div>' : '') +
    (ref
      ? '<div class="bloque">' + campos + '</div>' +
        '<p class="ayuda">Total, Comisión, ENT y Saldo son fórmulas de la planilla ' +
        'y no se tocan.</p>' +
        (fuera.length
          ? '<p class="no-base">Fuera de la base: ' + fuera.join(', ') +
            '. Agregalos desde el Peanut Matcher.</p>' : '') +
        '<div class="alta-acc">' +
          '<button class="primario" data-act="ctrguardar"' +
            (!hayCambios || fuera.length || S.guardandoCtr ? ' disabled' : '') + '>' +
            (S.guardandoCtr ? 'Guardando…' : 'Guardar cambios') + '</button>' +
          '<span class="ayuda">' +
            (hayCambios ? Object.keys(e.cambios).length + ' campo(s) modificado(s)'
                        : 'Sin cambios') + '</span>' +
        '</div>'
      : '') +
    '</aside>';
}

// Combo reutilizable: alta de contratos y edición usan el mismo.
function comboGen(id, campo, label, opciones, val, ok, ctx, libre) {
  var abierto = S.combo === ctx + ':' + campo;
  var q = clave(val);
  var sug = [];
  if (abierto) {
    sug = (q
      ? opciones.filter(function (o) { return clave(o).indexOf(q) >= 0; })
          .sort(function (x, y) {
            var a1 = clave(x).indexOf(q) === 0 ? 0 : 1;
            var b1 = clave(y).indexOf(q) === 0 ? 0 : 1;
            return a1 - b1 || x.localeCompare(y, 'es');
          })
      : opciones).slice(0, 9);
  }

  return '<div class="campo combo-wrap' + (val && !ok && !libre ? ' malo' : '') + '">' +
    '<label for="' + id + '">' + label +
      (ok && val && !libre ? '<span class="ok-tick">✓</span>' : '') + '</label>' +
    '<input id="' + id + '" data-combo2="' + ctx + ':' + campo + '" autocomplete="off" ' +
      'placeholder="Escribí para buscar" value="' + esc(val) + '">' +
    (abierto && sug.length
      ? '<div class="combo-lista">' + sug.map(function (o) {
          return '<button data-act="combosel2" data-c="' + ctx + ':' + campo + '" ' +
            'data-v="' + esc(o) + '">' + resaltar(o, q) + '</button>';
        }).join('') + '</div>'
      : '') +
    (abierto && q && !sug.length
      ? '<div class="combo-lista"><p class="sin-match">' +
        (libre
          ? 'No coincide con ninguna condición ya usada. Se puede guardar igual, pero ' +
            'las alertas de cobro no van a funcionar hasta mapearla.'
          : 'Ninguno coincide. Si es nuevo, cargalo en el <b>Peanut Matcher</b>.') +
        '</p></div>'
      : '') +
    '</div>';
}

function formAlta() {
  var a = S.alta || {};
  var L = S.listas || { exportadores: [], importadores: [], productos: [], tipos: [] };

  function txt(campo, label, tipo, ph) {
    return '<div class="campo"><label for="a-' + campo + '">' + label + '</label>' +
      '<input id="a-' + campo + '" data-alta="' + campo + '" type="' + (tipo || 'text') + '" ' +
      'value="' + esc(a[campo] || '') + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>';
  }

  // Validación: los cuatro de lista tienen que existir en la base.
  var deLista = [['exportador', L.exportadores], ['importador', L.importadores],
                 ['producto', L.productos], ['tipo', L.tipos]];
  var fuera = deLista.filter(function (d) {
    var v = a[d[0]];
    return v && !d[1].some(function (o) { return clave(o) === clave(v); });
  }).map(function (d) { return d[0]; });

  var faltan = ['contrato', 'exportador', 'importador', 'producto', 'tipo', 'toneladas', 'precio']
    .filter(function (k) { return !a[k]; });

  var total = (parseFloat(a.toneladas) || 0) * (parseFloat(a.precio) || 0);

  // Referencia de numeración: el último contrato que quedó arriba del TOTAL.
  var ref = '';
  if (a.ultimo) {
    ref = '<div class="ultimo-ctr">' +
      '<span>Último cargado: <b>' + esc(a.ultimo.contrato) + '</b>' +
      (a.ultimo.fila ? ' <span class="fl">(fila ' + a.ultimo.fila + ')</span>' : '') + '</span>' +
      (a.ultimo.sugerido
        ? '<button data-act="usarnum" data-v="' + esc(a.ultimo.sugerido) + '">' +
          'Usar ' + esc(a.ultimo.sugerido) + '</button>'
        : '') + '</div>';
  } else if (a.cargandoUltimo) {
    ref = '<div class="ultimo-ctr"><span class="ayuda">Buscando el último contrato…</span></div>';
  }

  return '<div class="alta">' +
    '<div class="alta-cab"><h3>Nuevo contrato</h3>' +
      '<button data-act="altacerrar">Cancelar</button></div>' +
    (S.altaError ? '<div class="error">' + esc(S.altaError) + '</div>' : '') +
    ref +
    '<div class="alta-grid">' +
      txt('fecha', 'Fecha', 'date') +
      txt('contrato', 'Contrato', 'text', 'LT100-2026') +
      comboAlta('exportador', 'Exportador', L.exportadores, a) +
      comboAlta('importador', 'Importador', L.importadores, a) +
      comboAlta('producto', 'Producto', L.productos, a) +
      comboAlta('tipo', 'Tipo', L.tipos, a) +
      txt('toneladas', 'Toneladas', 'number') +
      txt('precio', 'Precio USD/tn', 'number') +
      txt('packaging', 'Packaging', 'text', 'Big Bags 1250 kgs') +
      txt('incoterm', 'Incoterm', 'text', 'CIF Rotterdam') +
      comboGen('a-formaPago', 'formaPago', 'Forma de pago',
        S.formasPago.map(function (f) { return f.texto; }), a.formaPago || '', true, 'alta', true) +
      txt('periodo', 'Período de embarque', 'text', 'Octubre 2026') +
    '</div>' +
    (total ? '<p class="alta-total">Total: US$ ' +
      total.toLocaleString('es-AR', { maximumFractionDigits: 2 }) +
      ' · comisión estimada US$ ' +
      (total * 0.02).toLocaleString('es-AR', { maximumFractionDigits: 2 }) + '</p>' : '') +
    '<div class="alta-acc">' +
      '<button class="primario" data-act="altaguardar"' +
        (faltan.length || fuera.length || S.creando ? ' disabled' : '') + '>' +
        (S.creando ? 'Creando…' : 'Crear contrato') + '</button>' +
      '<span class="ayuda">' +
        (fuera.length
          ? 'Hay que dar de alta en el Peanut Matcher: ' + fuera.join(', ')
          : faltan.length
            ? 'Falta completar: ' + faltan.join(', ')
            : 'Se inserta en "' + esc(S.cfg.tabAlta || '—') + '", arriba de la fila TOTAL') +
      '</span>' +
    '</div></div>';
}

function filaContrato(r) {
  var pctTxt = r.pct !== null ? Math.round(r.pct * 100) + '%' : '';
  var estado, cls;
  if (r.contratado === null || r.contratado === undefined) {
    estado = 'sin toneladas en el contrato'; cls = 'hueco';
  } else if (r.saldo > 0.5) {
    estado = 'faltan ' + r.saldo.toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn';
    cls = 'sol';
  } else if (r.saldo < -0.5) {
    estado = 'excedido en ' + (-r.saldo).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn';
    cls = 'nar';
  } else {
    estado = 'completo'; cls = 'ok';
  }

  var barra = r.pct !== null
    ? '<div class="barra"><i style="width:' + Math.round(r.pct * 100) + '%" class="' +
      (r.saldo < -0.5 ? 'exc' : r.saldo <= 0.5 ? 'full' : '') + '"></i></div>' : '';

  var editable = S.ctrEditables.has(r.contrato);
  return '<article class="emb ctr-fila' + (editable ? ' editable' : '') + '"' +
    (editable ? ' data-act="ctrabrir" data-k="' + esc(r.contrato) + '" tabindex="0"' : '') + '>' +
    '<div class="fila-top" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1.3fr) minmax(0,1fr)">' +
      '<div>' +
        '<div class="partes">' +
          (r.exportador ? '<span class="exp">' + esc(r.exportador) + '</span><span class="fl">→</span>' : '') +
          '<span class="imp">' + esc(r.importador || 'Sin cliente') + '</span></div>' +
        '<div class="ctr-cod">' + esc(r.contrato) + '</div>' +
        (function () {
          var ref = S.ctrEditables.get(r.contrato);
          if (ref) return '<div class="orig">' + esc(ref.tab) + ' · fila ' + ref.fila +
            ' <span class="ed">editar</span></div>';
          return r.origen ? '<div class="orig">' + esc(r.origen) + ' · solo lectura</div>' : '';
        })() +
        (r.huerfano ? '<div class="orig">No figura en las pestañas de contratos</div>' : '') +
      '</div>' +
      '<div>' + barra +
        '<div class="tns-linea">' +
          '<span>' + (r.entregado || 0).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn entregadas</span>' +
          (r.contratado ? '<span class="de"> de ' +
            r.contratado.toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn' +
            (pctTxt ? ' · ' + pctTxt : '') + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="estados">' +
        '<span class="pill ' + cls + '"><span class="pt"></span>' + estado + '</span>' +
        (r.embarques.length
          ? '<span class="pill gris"><span class="pt"></span>' + r.embarques.length +
            (r.embarques.length === 1 ? ' embarque activo' : ' embarques activos') + '</span>' : '') +
        (r.aFacturar
          ? '<span class="pill ok"><span class="pt"></span>' + r.aFacturar + ' a facturar</span>' : '') +
      '</div>' +
    '</div>' +
    (function () {
      var items = [];
      if (r.periodo) items.push(['Período de embarque', String(r.periodo)]);
      if (r.cond && !r.cond.desconocida) items.push(['Condición de pago', r.cond.texto]);
      // Si la planilla trae su propio saldo y no coincide con el calculado,
      // conviene verlo: alguno de los dos está mirando algo que el otro no.
      if (r.fuenteSaldo === 'planilla' && r.entregadoActivo > (r.entregado || 0) + 0.5) {
        items.push(['Atención',
          'las pestañas activas suman ' +
          r.entregadoActivo.toLocaleString('es-AR', { maximumFractionDigits: 1 }) +
          ' tn, más de lo que dice la columna de entregado']);
      }
      if (!items.length) return '';
      return '<div class="refs">' + items.map(function (i) {
        return '<span class="ref"><em>' + esc(i[0]) + '</em>' +
          '<b style="font-family:inherit;font-weight:400">' + esc(i[1]) + '</b></span>';
      }).join('') + '</div>';
    })() +
    '</article>';
}

// Vista planilla: para quien está acostumbrado a mirar el Sheets y quiere
// encontrar lo mismo donde lo espera. Ancho completo, grilla, números de fila
// reales, colores de siempre, y filtro y orden en cada columna.

var COLS_PLANILLA = ['exporter', 'importer', 'contract', 'product', 'tipo', 'price', 'tns',
  'total', 'etd', 'eta', 'port', 'vessel', 'shippingLine', 'lots', 'containers',
  'bl', 'booking', 'invoice', 'docs', 'pics', 'tr', 'tracking', 'pagoEstimado',
  'commission', 'guia', 'incoterm', 'status'];

function columnasDisponibles() {
  return COLS_PLANILLA.filter(function (c) {
    return S.fuentes.some(function (f) { return f.mapa[c] !== undefined; });
  });
}

function vistaPlanilla(filas) {
  var todas = columnasDisponibles();
  var cols = todas.filter(function (c) { return !S.colsOcultas[c]; });
  var ocultas = todas.length - cols.length;

  var barra = '<div class="hoja-barra">' +
    '<button data-act="cols" aria-pressed="' + S.colsPanel + '">Columnas' +
      (ocultas ? ' · ' + ocultas + ' ocultas' : '') + '</button>' +
    (Object.keys(S.fCol).some(function (k) { return S.fCol[k]; }) || S.ordenCol
      ? '<button data-act="limpiarcol">Quitar filtros de columna</button>' : '') +
    '<span class="ayuda" style="margin-left:auto">' + filas.length + ' filas</span>' +
    '</div>';

  if (S.colsPanel) {
    barra += '<div class="cols-panel">' +
      todas.map(function (c) {
        return '<label class="chk"><input type="checkbox" data-col="' + c + '"' +
          (S.colsOcultas[c] ? '' : ' checked') + '><span>' + CAMPOS[c].label + '</span></label>';
      }).join('') +
      '<div class="cols-acc">' +
        '<button data-act="colstodas">Mostrar todas</button>' +
        '<button data-act="colsminimas">Solo lo esencial</button>' +
      '</div></div>';
  }

  function encabezado(c) {
    var act = S.ordenCol && S.ordenCol.campo === c;
    var flecha = act ? (S.ordenCol.dir === 1 ? ' ↑' : ' ↓') : '';
    return '<th><div class="th-in">' +
      '<button class="th-ord" data-act="ordcol" data-c="' + c + '" title="Ordenar">' +
        CAMPOS[c].label + flecha + '</button>' +
      '<button class="th-x" data-act="ocultar" data-c="' + c + '" title="Ocultar columna">×</button>' +
      '</div></th>';
  }

  function filtroCol(c) {
    if (SEMAFOROS.indexOf(c) >= 0) {
      return '<th class="fth"><select data-fcol="' + c + '">' +
        ['', 'ok', 'pendiente', 'atencion', 'vacio'].map(function (o) {
          return '<option value="' + (o ? etiqueta(c, o) : '') + '"' +
            (S.fCol[c] === (o ? etiqueta(c, o) : '') ? ' selected' : '') + '>' +
            (o ? etiqueta(c, o) : '—') + '</option>';
        }).join('') + '</select></th>';
    }
    return '<th class="fth"><input data-fcol="' + c + '" value="' +
      esc(S.fCol[c] || '') + '" placeholder="filtrar"></th>';
  }

  var enc = '<tr><th class="nrofila">#</th>' + cols.map(encabezado).join('') + '</tr>' +
            '<tr><th class="nrofila fth"></th>' + cols.map(filtroCol).join('') + '</tr>';

  var cuerpo = filas.map(function (x) {
    var emb = x.emb, src = x.src;
    return '<tr' + (emb._id === S.sel ? ' class="sel"' : '') +
      ' data-act="abrir" data-f="' + esc(emb._id) + '">' +
      '<td class="nrofila" title="' + esc(emb._tab) + '">' + emb._fila + '</td>' +
      cols.map(function (c) {
        if (src.mapa[c] === undefined) return '<td class="na"></td>';
        if (SEMAFOROS.indexOf(c) >= 0) {
          if (src.noAplica[c]) return '<td class="na"></td>';
          var est = emb[c] || 'vacio';
          var txt = (emb._notas && emb._notas[c]) || '';
          return '<td class="cel-' + est + '" title="' + esc(etiqueta(c, est)) +
            (txt ? ' — ' + esc(txt) : '') + '">' + esc(txt) + '</td>';
        }
        var v = emb[c];
        var cls = (c === 'tns' || c === 'price' || c === 'total' || c === 'commission')
          ? ' class="num"' : '';
        if (c === 'pagoEstimado' && emb._faltaComprobante) {
          return '<td class="cel-naranja" title="Falta el comprobante de pago">' +
            pintarCelda(v) + '</td>';
        }
        return '<td' + cls + '>' + pintarCelda(v) + '</td>';
      }).join('') + '</tr>';
  }).join('');

  return '<div class="full">' + barra +
    '<div class="hoja"><table class="tbl-hoja"><thead>' + enc +
    '</thead><tbody>' + cuerpo + '</tbody></table></div>' +
    '<p class="ayuda" style="margin-top:9px">Los colores son los mismos de la planilla. ' +
    'El número de la izquierda es la fila real. Clic en el nombre de una columna ordena, ' +
    'la × la oculta, y la fila de abajo filtra. Clic en una fila abre el detalle.</p>' +
    '</div>';
}

var EDITABLES = ['vessel', 'shippingLine', 'booking', 'containers', 'bl', 'invoice', 'tracking', 'nota'];

// Desplegable con los estados a la vista. Antes había que ir clickeando hasta
// dar con el que se buscaba, que con cuatro opciones es incómodo y propenso a
// pasarse de largo (y cada clic escribe en la planilla).
function selectorEstado(emb, campo) {
  var actual = emb[campo] || 'vacio';
  var abierto = S.menuSem && S.menuSem.id === emb._id && S.menuSem.campo === campo;

  var menu = '';
  if (abierto) {
    menu = '<div class="menu-est" role="listbox">' +
      CICLO.map(function (op) {
        return '<button role="option" aria-selected="' + (op === actual) + '" ' +
          'data-act="setsem" data-f="' + esc(emb._id) + '" data-c="' + campo + '" ' +
          'data-v="' + op + '">' +
          '<span class="punto p-' + op + '"></span>' +
          '<span>' + etiqueta(campo, op) + '</span>' +
          (op === actual ? '<span class="tick">✓</span>' : '') +
          '</button>';
      }).join('') + '</div>';
  }

  return '<div class="sem-wrap">' +
    '<button class="sembtn" data-e="' + actual + '" data-act="menusem" ' +
      'data-f="' + esc(emb._id) + '" data-c="' + campo + '" ' +
      'aria-haspopup="listbox" aria-expanded="' + !!abierto + '">' +
      '<span class="et">' + CAMPOS[campo].label + '</span>' +
      '<span class="vl">' + etiqueta(campo, actual) + '<span class="cv">▾</span></span>' +
    '</button>' + menu + '</div>';
}

function vistaPanel(x) {
  var emb = x.emb, ev = x.ev, src = x.src, cond = x.contrato ? x.contrato.cond : null;

  ev.alertas.forEach(function (a) {
    if (a.campos) a.campos.forEach(function (c) { falta[c] = 1; });

  var h = '<div class="velo" data-act="cerrar"></div>' +
    '<aside class="panel" role="dialog" aria-label="Embarque ' + esc(emb.contract) + '">' +

  // Ficha: los datos que se miran, no se editan.
  h += '<div class="bloque"><h3 class="gt">Embarque</h3><dl style="margin:0">' +

    kv('Producto', emb.product) +
    kv('Tipo', emb.tipo) +
    kv('Toneladas', emb.tns !== null && emb.tns !== '' ? Number(emb.tns).toLocaleString('es-AR') : '') +
    kv('Destino', emb.port) +
    kv('ETD', esFecha(emb.etd) ? fmtFecha(emb.etd) : '') +
    kv('ETA', esFecha(emb.eta) ? fmtFecha(emb.eta) : '') +
    kv('Buque', emb.vessel) +
    kv('Naviera', emb.shippingLine) +
    '</dl></div>';

  // Referencias, en mono para poder copiarlas de un vistazo.

              ['containers', 'Contenedores'], ['lots', 'Lotes'], ['tracking', 'Tracking']]

  if (refs.length) {
    h += '<div class="bloque"><h3 class="gt">Referencias</h3><dl style="margin:0">' +

             : '<span style="color:var(--tinta3);font-style:italic">falta</span>') +
          '</dd></div>';
      }).join('') + '</dl></div>';
  }

  // Estados: botón grande con la palabra, no un cuadradito de color.

    if (emb.trModo) {
      h += '<p class="ayuda" style="margin-top:8px">Modalidad de liberación: <b>' +

  // Comentarios: lo que el equipo se dice sobre este embarque.

  h += '<div class="bloque"><h3 class="gt">Comentarios' +
    (cs.length ? ' <span>' + cs.length + '</span>' : '') + '</h3>';

  if (cs.length) {

      return '<div class="com">' +
        '<div class="com-cab"><span class="com-autor">' + esc(nombreCortoAutor(c.autor)) + '</span>' +
        '<span class="com-fecha">' + esc(c.fecha) + '</span></div>' +
        '<p class="com-txt">' + esc(c.texto) + '</p>' +
        (c.sobre ? '<p class="com-sobre">sobre: ' + esc(c.sobre) + '</p>' : '') +

    '<div class="com-acc">' +
      '<button class="primario" data-act="comentar" data-f="' + esc(emb._id) + '"' +
        (S.enviando ? ' disabled' : '') + '>' +
        (S.enviando ? 'Guardando…' : 'Comentar') + '</button>' +
      '<span class="ayuda">' +
        (S.usuario ? 'Como ' + esc(nombreCortoAutor(S.usuario.email)) : 'Sin identificar') +
      '</span>' +
    '</div></div>';

  // Fechas: input nativo, que además valida solo y evita el 28/09 sin año.
  var fechas = ['etd', 'eta', 'pagoEstimado'].filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];

    h += '<div class="bloque"><h3 class="gt">Fechas</h3><div class="fechas">' +
      fechas.map(function (c) {
        var v = emb[c];
        var iso = esFecha(v)
          ? v.getUTCFullYear() + '-' +
            String(v.getUTCMonth() + 1).padStart(2, '0') + '-' +
            String(v.getUTCDate()).padStart(2, '0')
          : '';
        return '<div class="campo' + (falta[c] ? ' falta' : '') + '">' +
          '<label for="d-' + c + '">' + CAMPOS[c].label +
          (v && v.anioAsumido ? ' <span class="av">año asumido</span>' : '') +
          (v && v.invalida ? ' <span class="mal">dato inválido: ' + esc(v.crudo) + '</span>' : '') +
          '</label>' +
          '<input type="date" id="d-' + c + '" data-fecha="' + c + '" ' +
          'data-f="' + esc(emb._id) + '" value="' + iso + '"></div>';
      }).join('') + '</div>';

    if (esFecha(emb.etd) && esFecha(emb.eta)) {
      var tt = Math.round((emb.eta - emb.etd) / 86400000);
      h += '<p class="ayuda">Tránsito: ' + tt + ' días' +
        (tt < 0 ? ' — la ETA quedó antes del ETD' : '') + '.</p>';

  // Campos editables.
  var eds = EDITABLES.filter(function (c) {

    eds.forEach(function (c) {
      var v = emb[c];
      h += '<div class="campo' + (falta[c] ? ' falta' : '') + '">' +
        '<label for="e-' + c + '">' + CAMPOS[c].label +

        '<input id="e-' + c + '" data-edit="' + c + '" data-f="' + esc(emb._id) + '" value="' +
        esc(v instanceof Date ? fmtFecha(v) : (v || '')) + '"></div>';
