    '<button data-act="ctrmovok" aria-label="Listo">' + ico('x') + '</button></div>';
}

function barraDeshacer() {
  var m = S.ultimoMov;
  if (!m || S.verFact) return '';
  return '<div class="deshacer-barra">' +
    ico('volver') +
    '<span><b>' + esc(m.quien || m.contrato) + '</b> pasó a facturar.</span>' +
    '<button data-act="irdevolver">Devolverla</button>' +
    '<button data-act="movok" aria-label="Listo">' + ico('x') + '</button>' +
    '</div>';
}

function vistaFacturadas() {
  var fact = (S.fuentesFact || [])[0];
  if (!fact) return '<p class="centro">No hay pestaña de "A facturar" configurada.</p>';

  var mapa = fact.mapa;
  var g = function (f, campo) {
    var i = mapa[campo];
    return i === undefined ? '' : (f.celdas[i] === null || f.celdas[i] === undefined ? '' : f.celdas[i]);
  };

  var filas = fact.filas.map(function (f) {
    return {
      fila: f.fila,
      exporter: String(g(f, 'exporter') || '').trim(),
      importer: String(g(f, 'importer') || '').trim(),
      contract: String(g(f, 'contract') || '').trim(),
      product: String(g(f, 'product') || '').trim(),
      bl: String(g(f, 'bl') || '').trim(),
      containers: String(g(f, 'containers') || '').trim(),
      vessel: String(g(f, 'vessel') || '').trim(),
      invoice: String(g(f, 'invoice') || '').trim(),
      tns: normNum(g(f, 'tns')),
      etd: normFecha(g(f, 'etd'))
    };
  }).filter(function (o) { return o.exporter || o.importer || o.contract; });

  var q = clave(S.buscaFact || '');
  if (q) {
    filas = filas.filter(function (o) {
      return clave([o.exporter, o.importer, o.contract, o.bl, o.invoice, o.product]
        .join(' ')).indexOf(q) >= 0;
    });
  }

  // Las últimas cargadas primero: es lo que uno acaba de mover.
  filas.sort(function (a, b) { return b.fila - a.fila; });
  var total = filas.length;
  var tope = S.topeFact || 25;
  var vis = filas.slice(0, tope);

  var modoT = false;
  var h = '<div class="filtros">' +
    '<input id="busca-fact" placeholder="Buscar cliente, contrato, BL, factura" value="' +
      esc(S.buscaFact || '') + '" aria-label="Buscar en A facturar">' +
    '<span class="barra-modos">' + botonesHistHtml() + '<span class="modos">' +
      [['tarjetas', 'Tarjetas'], ['planilla', 'Planilla']].map(function (m) {
        return '<button data-act="modo" data-m="' + m[0] + '" aria-pressed="' + (S.modo === m[0] || (m[0] === 'tarjetas' && S.modo === 'exportadores') || (m[0] === 'planilla' && S.modo === 'tabla')) + '">' + m[1] + '</button>';
      }).join('') + '</span></span>' +
    '</div>' +
    '<p class="conteo">' + total + (total === 1 ? ' fila' : ' filas') + ' en «' +
      esc(fact.tab) + '»' + (q ? ' que coinciden' : ', de la más reciente a la más vieja') +
    '</p>';

  if (S.factError) h += '<div class="error">' + esc(S.factError) + '</div>';
  if (!vis.length) return h + '<p class="centro">Nada coincide.</p>';

  function bloqueDevolver(o) {
    var destino = tabProbable(o);
    return '<div class="confirmar" style="margin-top:14px">' +
      '<p class="cf-tit">' + ico('volver') + '¿A qué pestaña la devolvemos?' +
        (modoT ? ' <span class="ayuda">(fila ' + o.fila + ' · ' + esc(o.contract || 'sin contrato') + ')</span>' : '') + '</p>' +
      '<div class="chips" style="margin:0 0 14px">' +
        (S.fuentes || []).map(function (f) {
          var sel = (S.devolverTab || destino) === f.tab;
          return '<button data-act="devolvertab" data-t="' + esc(f.tab) + '" aria-pressed="' + sel + '">' + esc(nombreCorto(f.tab)) + '</button>';
        }).join('') +
      '</div>' +
      '<p class="cf-ojo">Se mueve la fila con sus datos y sus colores, y se borra de «' + esc(fact.tab) + '». Es el mismo cortar y pegar de siempre.</p>' +
      '<div class="alta-acc">' +
        '<button class="primario" data-act="devolverok" data-r="' + o.fila + '"' + (S.pasando ? ' disabled' : '') + '>' +
          (S.pasando === 'f' + o.fila ? 'Moviendo…' : ico('check') + 'Devolver') + '</button>' +
        '<button data-act="devolverno">Cancelar</button>' +
      '</div></div>';
  }

  if (modoT) {
    var colsT = [['Exportador', 'exporter'], ['Importador', 'importer'], ['Contrato', 'contract'], ['Producto', 'product'],
      ['TNS', 'tns'], ['BL', 'bl'], ['Contenedores', 'containers'], ['Buque', 'vessel'], ['ETD', 'etd'], ['Factura', 'invoice']];
    var celT = function (o, k) {
      if (k === 'tns') return o.tns ? fmtNum(o.tns) : '';
      if (k === 'etd') return esFecha(o.etd) ? fmtFecha(o.etd) : '';
      return o[k] || '';
    };
    var filaAbierta = vis.filter(function (o) { return S.devolver === o.fila; })[0];
    h += (filaAbierta ? bloqueDevolver(filaAbierta) : '') +
      '<div class="hoja"><table class="tbl-hoja tbl-fact"><thead><tr><th class="nrofila">#</th>' +
      colsT.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
      vis.map(function (o) {
        return '<tr class="fact-tr' + (S.devolver === o.fila ? ' sel' : '') + '"><td class="nrofila">' + o.fila + '</td>' +
          colsT.map(function (c) { var v = celT(o, c[1]); return '<td title="' + esc(v) + '">' + esc(v) + '</td>'; }).join('') +
          '<td class="fact-acc"><button class="ff-com" data-act="comfact" data-r="' + o.fila + '" data-comfact="' + o.fila + '" title="Comentarios de esta carga">' + ico('chat') + '</button>' +
          (S.devolver === o.fila ? '' : '<button data-act="devolver" data-r="' + o.fila + '">' + ico('volver') + 'Devolver</button>') +
          '</td></tr>';
      }).join('') + '</tbody></table></div>';
    if (total > vis.length) {
      h += '<div class="ver-mas"><button data-act="masfact">Ver ' + Math.min(total - vis.length, 25) + ' más</button>' +
        '<span class="ayuda">' + (total - vis.length) + ' sin mostrar</span></div>';
    }
    return h;
  }

  h += '<div class="lista">' + vis.map(function (o) {
    var destino = tabProbable(o);
    var abierta = S.devolver === o.fila;
    return '<article class="emb fact-fila">' +
      '<div class="emb-cuerpo">' +
        '<div class="ff-top">' +
          '<div class="ff-quien">' +
            '<div class="partes"><div class="via-partes">' +
              '<div class="parte"><span class="exp">' + esc(o.exporter || '—') + '</span></div>' +
              '<span class="fl">→</span>' +
              '<div class="parte"><span class="imp">' + esc(o.importer || '—') + '</span></div>' +
            '</div></div>' +
            '<div class="sub">' + esc(o.product) +
              (o.tns ? ' · ' + fmtNum(o.tns) + ' tn' : '') + '</div>' +
            '<div class="ctr" title="' + esc(o.contract || 'sin contrato') + '">' + esc(o.contract || 'sin contrato') +
              ' · fila ' + o.fila + '</div>' +
          '</div>' +
          '<div class="ff-refs">' +
            (o.bl ? '<span class="ref"><em>BL</em><b>' + esc(o.bl) + '</b></span>' : '') +
            (o.invoice ? '<span class="ref"><em>Factura</em><b>' + esc(o.invoice) + '</b></span>' : '') +
            (esFecha(o.etd) ? '<span class="ref"><em>ETD</em><b>' + fmtFecha(o.etd) + '</b></span>' : '') +
          '</div>' +
          (function () {
            var hsF = (S.hilosPorFactura[o.fila] || []).filter(function (h) { return comentariosVisibles(h).length; });
            var nF = hsF.filter(function (h) { return !h.resuelto; })
              .reduce(function (a, h) { return a + comentariosVisibles(h).length; }, 0);
            return '<button class="ff-com' + (nF ? ' con' : '') + '" data-act="comfact" data-r="' + o.fila + '" data-comfact="' + o.fila + '" ' +
              'title="Comentarios de esta carga">' + ico('chat') + (nF || '') + '</button>';
          })() +
          (abierta ? '' :
            '<button data-act="devolver" data-r="' + o.fila + '">' + ico('volver') +
            'Devolver</button>') +
        '</div>' +

        (abierta
          ? '<div class="confirmar" style="margin-top:14px">' +
            '<p class="cf-tit">' + ico('volver') + '¿A qué pestaña la devolvemos?</p>' +
            '<div class="chips" style="margin:0 0 14px">' +
              (S.fuentes || []).map(function (f) {
                var sel = (S.devolverTab || destino) === f.tab;
                return '<button data-act="devolvertab" data-t="' + esc(f.tab) + '" ' +
                  'aria-pressed="' + sel + '">' + esc(nombreCorto(f.tab)) + '</button>';
              }).join('') +
            '</div>' +
            '<p class="cf-ojo">Se mueve la fila con sus datos y sus colores, y se borra de «' +
              esc(fact.tab) + '». Es el mismo cortar y pegar de siempre.</p>' +
            '<div class="alta-acc">' +
              '<button class="primario" data-act="devolverok" data-r="' + o.fila + '"' +
                (S.pasando ? ' disabled' : '') + '>' +
                (S.pasando === 'f' + o.fila ? 'Moviendo…' : ico('check') + 'Devolver') + '</button>' +
              '<button data-act="devolverno">Cancelar</button>' +
            '</div></div>'
          : '') +
      '</div></article>';
  }).join('') + '</div>';

  if (total > vis.length) {
    h += '<div class="ver-mas"><button data-act="masfact">Ver ' +
      Math.min(total - vis.length, 25) + ' más</button>' +
      '<span class="ayuda">' + (total - vis.length) + ' sin mostrar</span></div>';
  }
  return h;
}

/* Un advice junta filas del MISMO embarque: misma pestaña, exportador,
   importador, buque, puerto, BL y fechas. Si ya hay filas elegidas, las que no
   combinan se deshabilitan y dicen por qué, en vez de dejar elegirlas y que
   el error aparezca recién al generar. */
function motivoIncompatible(emb) {
  var ids = Object.keys(S.marcados || {}).filter(function (k) { return S.marcados[k]; });
  if (!ids.length || S.marcados[emb._id]) return null;
  var base = filaPorId(ids[0]);
  if (!base) return null;
  if (base._tab !== emb._tab) return 'Es de otra pestaña (' + nombreCorto(base._tab) + ')';
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  var dif = [];
  [['exporter', 'exportador'], ['importer', 'importador'], ['bl', 'BL'],
   ['vessel', 'buque'], ['port', 'puerto']].forEach(function (c) {
    if (clave(emb[c[0]]) !== clave(base[c[0]])) dif.push(c[1]);
  });
  if (f(emb.etd) !== f(base.etd)) dif.push('ETD');
  if (f(emb.eta) !== f(base.eta)) dif.push('ETA');
  return dif.length ? 'Otro embarque: cambia ' + dif.join(', ') : null;
}

function barraAdvice(evs) {
  var ids = Object.keys(S.marcados || {}).filter(function (k) { return S.marcados[k]; });
  if (!ids.length) return '';

  var sel = ids.map(filaPorId).filter(Boolean)
    .sort(function (a, b) { return a._fila - b._fila; });
  if (!sel.length) return '';

  // Las mismas condiciones que valida el script del lado de la planilla.
  var base = sel[0];
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  var difs = [];
  [['exporter', 'Exportador'], ['importer', 'Importador'], ['vessel', 'Buque'],
   ['port', 'Puerto'], ['bl', 'BL']].forEach(function (c) {
    if (sel.some(function (o) { return clave(o[c[0]]) !== clave(base[c[0]]); })) difs.push(c[1]);
  });
  [['etd', 'ETD'], ['eta', 'ETA']].forEach(function (c) {
    if (sel.some(function (o) { return f(o[c[0]]) !== f(base[c[0]]); })) difs.push(c[1]);
  });
  var tabs = {};
  sel.forEach(function (o) { tabs[o._tab] = 1; });
  if (Object.keys(tabs).length > 1) difs.unshift('la pestaña');

  var destino = (S.adviceTo !== null && S.adviceTo !== undefined)
    ? S.adviceTo : destinoAdvice(base).para;
  var msg = (S.adviceMsg && S.adviceMsg.barra) ? S.adviceMsg : null;
  var goods = sel.map(function (o) {
    return (o.tns || '') + ' Tns ' + (o.product || '');
  }).join(' / ');

  var h = '<div class="barra-flota"><div class="bf-in">';

  if (msg && msg.ok) {
    h += '<div class="ok-aviso" style="margin:0 0 10px;white-space:pre-line">' + esc(msg.texto) +
      (msg.url ? '\n<a href="' + esc(msg.url) + '" target="_blank" rel="noopener">Abrir Gmail</a>' : '') +
      '</div>';
  }
  if (msg && msg.error) {
    h += '<div class="error" style="margin:0 0 10px;white-space:pre-line">' + esc(msg.error) +
      accionesError(msg) +
      (S.faltaGmail
        ? ' <button data-act="permiso-gmail" style="margin-top:8px">Autorizar Gmail</button>'
        : '') + '</div>';
  }

  // Se puede marcar en una pestaña y después filtrar por otra: conviene
  // decirlo, si no parece que la barra cuenta cosas que no están.
  var ocultos = sel.filter(function (o) {
    if (S.filtroTab && o._tab !== S.filtroTab) return true;
    if (S.filtroTipo && clave(o.tipo) !== S.filtroTipo) return true;
    return false;
  }).length;

  h += '<div class="bf-fila1">' +
    '<span class="bf-n">' + sel.length + (sel.length === 1 ? ' embarque' : ' embarques') + '</span>' +
    (ocultos ? '<span class="bf-ocultos">' + ocultos +
      (ocultos === 1 ? ' fuera del filtro actual' : ' fuera del filtro actual') + '</span>' : '') +
    '<span class="bf-goods">' + esc(goods) + '</span>' +
    '<button data-act="desmarcar">Quitar selección</button>' +
    '</div>';

  if (difs.length) {
    h += '<p class="bf-error">No se pueden combinar: no coincide ' + difs.join(', ') +
      '. El advice necesita que sean del mismo embarque.</p>';
  } else {
    // Filas del mismo embarque que todavía no se eligieron.
    var faltanH = hermanasAdvice(base).filter(function (o) { return !S.marcados[o._id]; });
    if (faltanH.length) {
      h += '<p class="bf-sumar">' + ico('plus') +
        '<span>Hay ' + faltanH.length + (faltanH.length === 1 ? ' fila más' : ' filas más') +
        ' del mismo BL (' + esc(faltanH.map(function (o) {
          return 'fila ' + o._fila + ': ' + (o.product || '');
        }).join(' · ')) + ')</span>' +
        '<button data-act="sumarhermanas">Sumar' + (faltanH.length === 1 ? 'la' : 'las') +
        '</button></p>';
    }
  }

  var origenB = (S.adviceTo === null || S.adviceTo === undefined)
    ? destinoAdvice(base).origen : 'mano';
  h += vistaCC(base.importer, destino) +
    (origenB === 'documental'
      ? '<p class="cc-nota" style="margin:0 0 8px">La fila no tiene «Mails CC»: el «Para» ' +
        'sale de los mails documentales de Database_old.</p>' : '') +
    '<div class="bf-fila2">' +
    '<label class="sr-solo" for="adv-to-barra">Destinatarios</label>' +
    '<input id="adv-to-barra" data-advto="1" value="' + esc(destino) + '" ' +
      'placeholder="destinatarios, separados por coma">' +
    '<span class="modos">' +
      [['en', 'EN'], ['es', 'ES']].map(function (o) {
        return '<button data-act="advidioma" data-v="' + o[0] + '" aria-pressed="' +
          ((S.adviceIdioma || 'en') === o[0]) + '">' + o[1] + '</button>';
      }).join('') +
    '</span>' +
    togglePeter(base.importer) +
    '<button class="primario" data-act="adviceMulti"' +
      (difs.length || S.adviceEnviando ? ' disabled' : '') + '>' +
      (S.adviceEnviando ? 'Creando…' : ico('mail') + 'Crear borrador del shipment advice') +
      '</button>' +
    '</div></div></div>';

  return h;
}

function segmentoPestanas(evs) {
  // Con una sola pestaña de embarques no hay nada que separar, pero conviene
  // decirlo: suele ser que falta agregar las terrestres.
  if (S.fuentes.length < 2) {
    var otras = (S.pestanas && S.pestanas.pestanas || []).filter(function (p) {
      var k = clave(p.nombre);
      return (k.indexOf('carga') >= 0 || k.indexOf('embarque') >= 0) &&
             S.cfg.tabsEmb.indexOf(p.nombre) < 0;
    });
    return '<div class="aviso-tab">' +
      'Estás viendo solo <b>' + esc(S.fuentes[0] ? S.fuentes[0].tab : '—') + '</b>. ' +
      'Si querés ver también las otras cargas, agregalas.' +
      ' <button data-act="pestanas">Elegir pestañas</button></div>';
  }

  var cuenta = {};
  evs.forEach(function (x) { cuenta[x.emb._tab] = (cuenta[x.emb._tab] || 0) + 1; });

  var op = function (val, label, n) {
    return '<button data-act="ftab" data-t="' + esc(val) + '" aria-pressed="' +
      (S.filtroTab === val && !S.verFact) + '">' + esc(label) +
      '<span class="cnt">' + n + '</span></button>';
  };

  // En el celular la barra lateral no se ve: «A facturar» tiene que estar acá
  // también, si no no había forma de devolver una carga.
  var fact = (S.fuentesFact || [])[0];
  return '<div class="segmento solo-movil">' +
    op('', 'Todo', evs.length) +
    S.fuentes.map(function (f) {
      return op(f.tab, nombreCorto(f.tab), cuenta[f.tab] || 0);
    }).join('') +
    (fact
      ? '<button data-act="vfact" aria-pressed="' + !!S.verFact + '">' +
        esc(nombreCorto(fact.tab)) + '<span class="cnt">' + fact.filas.length + '</span></button>'
      : '') +
    '</div>';
}

// Dentro de una pestaña, separar por tipo de producto: la columna Tipo dice
// Maní, Expeller, Aceite. Solo aparece cuando hay más de uno para elegir.
function tiposDisponibles(evs) {
  var cuenta = {};
  evs.forEach(function (x) {
    if (S.filtroTab && x.emb._tab !== S.filtroTab) return;
    var t = String(x.emb.tipo || '').trim();
    if (!t) return;
    var k = clave(t);
    cuenta[k] = cuenta[k] || { n: 0, variantes: {} };
    cuenta[k].n++;
    cuenta[k].variantes[t] = (cuenta[k].variantes[t] || 0) + 1;
  });
  return Object.keys(cuenta).map(function (k) {
    var v = cuenta[k];
    // "Maní" y "MANI" son el mismo tipo: se muestra la escritura más usada.
    var etiq = Object.keys(v.variantes).sort(function (a, b) {
      return v.variantes[b] - v.variantes[a];
    })[0];
    return { clave: k, label: etiq, n: v.n };
  }).sort(function (a, b) { return b.n - a.n; });
}

// Título grande, como el "Large Title" de iOS: ancla la pantalla y hace que
// el contenido respire antes de empezar.
function tituloVista() {
  var t = { control: 'Control', carga: 'Cargas', contratos: 'Contratos' }[S.vista] || '';
  var sub = '';
  if (S.vista === 'carga' && S.verFact) {
    t = 'A facturar';
    var ff = (S.fuentesFact || [])[0];
    sub = ff ? 'Cargas cuyo cliente ya pagó · ' + ff.filas.length + ' en total' : '';
  } else if (S.vista === 'carga' && S.datos) {
    sub = S.modo === 'exportadores'
      ? 'Quién está embarcando y para quién'
      : S.datos.filas.length + ' embarques';
    if (S.filtroTab) sub += ' · ' + nombreCorto(S.filtroTab);
  } else if (S.vista === 'contratos') {
    sub = S.contratos.size + ' contratos';
  } else if (S.vista === 'control' && S.datos) {
    sub = 'Lo que necesita atención';
  }
  var v = VISTAS.filter(function (x) { return x.id === S.vista; })[0];
  return '<div class="titulo-vista"><h1>' +
    (v ? '<span class="t-emoji">' + (S.verFact && S.vista === 'carga' ? '🧾' : v.emoji) + '</span>' : '') + esc(t) + '</h1>' +
    (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
}

function segmentoTipos(evs) {
  var tipos = tiposDisponibles(evs);
  if (tipos.length < 2) return '';

  var total = tipos.reduce(function (a, t) { return a + t.n; }, 0);
  return '<div class="segmento sub">' +
    '<button data-act="ftipo" data-t="" aria-pressed="' + (!S.filtroTipo) + '">' +
      'Todos<span class="cnt">' + total + '</span></button>' +
    tipos.map(function (t) {
      return '<button data-act="ftipo" data-t="' + esc(t.clave) + '" aria-pressed="' +
        (S.filtroTipo === t.clave) + '">' + esc(t.label) +
        '<span class="cnt">' + t.n + '</span></button>';
    }).join('') + '</div>';
}

// "Embarques maritimos" -> "Marítimo". Nombres largos rompen el segmentado.
function nombreCorto(tab) {
  var k = clave(tab);
  if (k.indexOf('mariti') >= 0) return 'Marítimo';
  if (k.indexOf('terrestre') >= 0) return 'Terrestre';
  return tab.length > 18 ? tab.slice(0, 17) + '…' : tab;
}

var LOGO_SVG =
  '<svg viewBox="0 0 64 64" class="logo" aria-hidden="true"><g fill="currentColor">' +
  '<rect x="20" y="19" width="10" height="9" rx="1.5"/>' +
  '<rect x="32" y="19" width="10" height="9" rx="1.5"/>' +
  '<rect x="26" y="9" width="10" height="9" rx="1.5"/>' +
  '<rect x="44" y="14" width="6" height="14" rx="1.5"/>' +
  '<path d="M11 32h42l-6 13a5 5 0 0 1-4.5 3H21.5a5 5 0 0 1-4.5-3z"/></g></svg>';

var VISTAS = [
  { id: 'carga',       label: 'Cargas',       emoji: '🚢', color: 'azul' },
  { id: 'control',     label: 'Control',      emoji: '🔔', color: 'naranja' },
  { id: 'contratos',   label: 'Contratos',    emoji: '📄', color: 'violeta' }
];

function colorDeVista(id) {
  var v = VISTAS.filter(function (x) { return x.id === id; })[0];
  return v ? v.color : 'verde';
}

// Cuántas cosas piden atención: se muestra sobre Control, como en iOS.
function pendientes() {
  if (!S.datos) return 0;
  var n = 0;
  (S.ultimaEval ? Object.keys(S.ultimaEval) : []).forEach(function (k) {
    var ev = S.ultimaEval[k];
    if (ev && (ev.nivelMax === 'critico' || ev.nivelMax === 'alto')) n++;
  });
  return n;
}

// Barra lateral: en escritorio la navegación va al costado, que deja el ancho
// para el contenido y no obliga a subir para cambiar de vista.
function navLateral(evs) {
  var pend = pendientes();

  var items = VISTAS.map(function (v) {
    var badge = (v.id === 'control' && pend)
      ? '<span class="badge">' + pend + '</span>' : '';
    return '<button class="nav-item" data-act="tab" data-v="' + v.id + '" ' +
      'aria-current="' + (S.vista === v.id) + '">' +
      '<span class="tile t-' + v.color + '">' + v.emoji + '</span>' +
      '<span>' + v.label + '</span>' + badge + '</button>';
  }).join('');

  // El filtro de pestaña vive acá: es de dónde salen los datos, no un filtro
  // más de la lista.
  var fuentes = '';
  // Estos accesos filtran las CARGAS. Dentro de Contratos o de Control no hacían nada a la
  // vista y, en silencio, cambiaban el filtro de Cargas: al volver, ya no estaba como la dejaste.
  if (S.fuentes && S.fuentes.length > 1 && S.vista === 'carga') {
    var cuenta = {};
    (evs || []).forEach(function (x) { cuenta[x.emb._tab] = (cuenta[x.emb._tab] || 0) + 1; });
    fuentes = '<div class="nav-sec">Origen</div>' +
      '<button class="nav-sub" data-act="ftab" data-t="" aria-current="' + (!S.filtroTab && !S.verFact) + '">' +
        'Todo<span class="n">' + (evs || []).length + '</span></button>' +
      S.fuentes.map(function (f) {
        return '<button class="nav-sub" data-act="ftab" data-t="' + esc(f.tab) + '" ' +
          'aria-current="' + (S.filtroTab === f.tab && !S.verFact) + '">' + esc(nombreCorto(f.tab)) +
          '<span class="n">' + (cuenta[f.tab] || 0) + '</span></button>';
      }).join('') +
      ((S.fuentesFact || []).length
        ? '<button class="nav-sub" data-act="vfact" aria-current="' + (!!S.verFact) + '">' +
          esc(nombreCorto(S.fuentesFact[0].tab)) +
          '<span class="n">' + S.fuentesFact[0].filas.length + '</span></button>'
        : '');
  }

  return '<nav class="lateral" aria-label="Navegación">' +
    '<div class="lat-marca">' + LOGO_SVG +
      '<div><b>Embarques</b><span>' + esc(S.cfg.titulo || '') + '</span></div></div>' +
    '<div class="nav-items">' + items + '</div>' +
    fuentes +
    '<div class="lat-pie">' +
      '<p class="lat-version" title="Versión de la app">Versión ' + APP_VERSION + '</p>' +
      (S.guardando > 0 ? '<p class="lat-estado">Guardando…</p>' : '') +
      '<button class="nav-acc" data-act="recargar"' + (S.cargando ? ' disabled' : '') + '>' +
        ico('refresh') + (S.cargando ? 'Actualizando…' : 'Actualizar') + '</button>' +
      '<button class="nav-acc" data-act="pestanas">' + ico('gear') + 'Configuración</button>' +
      estadoSesionLateral() +

}

// Teléfono: barra superior compacta y barra de pestañas abajo, donde llega
// el pulgar.
// Estado de la conexión con Google, siempre a la vista. Si se cortó, lo dice y
// ofrece reconectar: nunca queda un «Conectado» con un token muerto.

      '<button class="nav-acc" data-act="reconectar"' + (S.reconectando ? ' disabled' : '') + '>' +
        ico('refresh') + (S.reconectando ? 'Esperando a Google…' : 'Conectar con Google') + '</button>';
  }
  return S.usuario
    ? '<p class="lat-user lat-sesion" title="Conectado con Google"><span class="lat-punto ok"></span>' +
        esc(nombreCortoAutor(S.usuario.email)) + '</p>'
    : '';
}

// El aviso grande, arriba de todo, con el botón para seguir sin recargar.
function avisoSesion() {

function tabBarInferior() {

  return '<nav class="tabbar" aria-label="Secciones">' +
    VISTAS.map(function (v) {
      var badge = (v.id === 'control' && pend)

function diagnostico() {
  var criticas = ['contract', 'importer', 'etd', 'eta'];
  var h = '';

  (S.avisos || []).forEach(function (a) {
    h += '<div class="aviso">' + esc(a) + '</div>';
  });

  S.fuentes.forEach(function (src) {
    var faltan = criticas.filter(function (c) { return src.mapa[c] === undefined; });
    if (faltan.length) {
      h += '<div class="aviso">En <b>' + esc(src.tab) + '</b> no encontré: <b>' +
        faltan.map(function (c) { return CAMPOS[c].label; }).join(', ') +
        '</b>. Las alertas que dependen de esas columnas quedan apagadas.</div>';
    }
  });

  // Sin columna de país en la base no hay banderas. Se avisa una vez, con la
  // instrucción concreta, en vez de dejar el dato en silencio.
  if (!S.cfg.paisSheetId) {
    h += '<div class="aviso">Para ver las banderas, cargá en <b>Pestañas</b> la URL de ' +
      'la planilla comercial, donde están las hojas de base de datos con la columna ' +
      '<b>Country</b>.</div>';
  } else if (S.diagPaises && S.diagPaises.error) {
    h += '<div class="aviso">No se pudo leer la planilla de países: ' +
      esc(S.diagPaises.error) + '</div>';
  } else if (S.paises && S.paises.size === 0) {
    h += '<div class="aviso">Se abrió la planilla de países pero no se encontró ninguna ' +
      'empresa con país.' +
      (S.diagPaises && S.diagPaises.hojas.length
        ? ' Hojas leídas: ' + esc(S.diagPaises.hojas.join(' · ')) + '.'
        : '') +
      ' Si las hojas se llaman distinto, se pueden fijar a mano en Pestañas.</div>';
  } else if (S.sinPais && (S.sinPais.clientes.length || S.sinPais.proveedores.length)) {
    var faltanP = [];
    if (S.sinPais.proveedores.length) faltanP.push(S.sinPais.proveedores.length + ' proveedores');
    if (S.sinPais.clientes.length) faltanP.push(S.sinPais.clientes.length + ' clientes');
    h += '<details class="diag" style="margin:14px 0 0;padding-top:0;border:none">' +
      '<summary>' + faltanP.join(' y ') + ' sin país en la base' +
      ' · ' + (S.paises ? S.paises.size : 0) + ' con país' +
      '</summary><p style="margin:8px 0 0">' +
      (S.diagPaises ? esc(S.diagPaises.hojas.join(' · ')) + '. ' : '') +
      esc(S.sinPais.proveedores.slice(0, 12).concat(S.sinPais.clientes.slice(0, 12)).join(', ')) +
      (S.sinPais.clientes.length + S.sinPais.proveedores.length > 24 ? '…' : '') +
      '</p></details>';
  }

  // Si se agregaron las columnas de firma pero la app no las ve, conviene
  // decirlo: suelen estar en la pestaña editable, no en la de lectura.
  if ((S.cfg.tabsCtrEdit || []).length && !hayColumnasFirma()) {
    h += '<div class="aviso">No encontré columnas de firma. Si las agregaste, tienen ' +
      'que estar en alguna de las pestañas <b>editables</b> (' +
      esc((S.cfg.tabsCtrEdit || []).join(', ')) + ') y llamarse <b>Firmado Exportador</b> ' +
      'y <b>Firmado Importador</b>. Si la pestaña de lectura es un IMPORTRANGE, ahí no ' +
      'aparecen y está bien.</div>';
  } else if ((S.cfg.tabsCtr || []).length && !(S.cfg.tabsCtrEdit || []).length) {
    h += '<div class="aviso">Para ver y marcar las firmas hay que elegir en ' +
      '<b>Configuración</b> las pestañas de contratos <b>editables</b> ' +
      '(por ejemplo «Contratos Abiertos»).</div>';
  }

  if (S.advicesViejos) {
    h += '<div class="aviso">Hay ' + S.advicesViejos + ' registro' +
      (S.advicesViejos > 1 ? 's' : '') + ' en <b>Advices enviados</b> del formato ' +
      'anterior, que solo guardaba el número de fila. Como las filas se reordenan ' +
      'por ETA, esos números ya no identifican al embarque y no se pueden marcar. ' +
      'Para recuperarlos, completá la columna <b>BLs</b> de esas filas con el BL ' +
      'del embarque y apretá Actualizar.</div>';
  }

  if ((S.cfg.tabsCtr || []).length && S.contratos.size === 0) {
    h += '<div class="aviso">No se cargó ningún contrato, así que no hay condiciones de pago ' +
      'y las alertas de cobro están apagadas.</div>';
  }

  h += '<details class="diag"><summary>' + S.datos.filas.length + ' embarques de ' +
    S.fuentes.length + (S.fuentes.length === 1 ? ' pestaña' : ' pestañas') +
    ' · ' + S.contratos.size + ' contratos</summary>';

  S.fuentes.forEach(function (src) {
    var na = Object.keys(src.noAplica);
    h += '<p style="margin:8px 0 0"><b>' + esc(src.tab) + '</b> · ' +
      src.filas.length + ' filas · ' + Object.keys(src.mapa).length + ' columnas reconocidas' +
      (na.length ? '<br>Vacías en toda la pestaña, no se exigen: ' +
        na.map(function (c) { return esc(CAMPOS[c].label); }).join(', ') : '') +
      (src.extras.length ? '<br>Ignora: ' +
        src.extras.map(function (e) { return esc(e.h); }).join(', ') : '') + '</p>';
  });

  return h + '</details>';
}

// Un estado nunca se comunica solo con color: siempre color + palabra.
function pill(campo, estado) {
  var cls = { ok:'ok', pendiente:'pend', atencion:'sol', vacio:'hueco' }[estado || 'vacio'];
  return '<span class="pill ' + cls + '"><span class="pt"></span>' +
    CAMPOS[campo].label + ': ' + etiqueta(campo, estado) + '</span>';
}

function pasosEtapa(idEtapa) {
  var i = ETAPAS.map(function (e) { return e.id; }).indexOf(idEtapa);
  var et = ETAPAS[i];
  return '<span class="etapa"><span class="pasos">' +
    ETAPAS.map(function (_, j) { return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('') +
    '</span>' + (et ? et.label : '') + '</span>';
}

// Línea de tiempo: salida a la izquierda, llegada a la derecha, y el punto
// donde estaría hoy. Las fechas van rotuladas y separadas de la línea, que es
// lo que antes se veía amontonado.
function barraRuta(emb) {
  var hoy = ahoraComoUTC();
  var pct = null;
  if (esFecha(emb.etd) && esFecha(emb.eta) && emb.eta > emb.etd) {
    pct = Math.max(0, Math.min(1, (hoy - emb.etd) / (emb.eta - emb.etd)));
  }
  var llego = pct !== null && pct >= 1;

  return '<div class="linea-t">' +
    '<div class="lt-via">' +
      '<span class="lt-punto ini"></span>' +
      '<span class="lt-riel">' +
        (pct !== null
          ? '<i style="width:' + Math.round(pct * 100) + '%"></i>' +
            (llego ? '' : '<b style="left:' + Math.round(pct * 100) + '%"></b>')
          : '') +
      '</span>' +
      '<span class="lt-punto fin' + (llego ? ' on' : '') + '"></span>' +
    '</div>' +
    '<div class="lt-datos">' +
      '<div class="lt-lado">' +
        '<span class="lt-rot">Salida</span>' +
        '<span class="lt-fecha' + (emb.etd && emb.etd.anioAsumido ? ' asumida' : '') + '">' +
          (esFecha(emb.etd) ? fmtFecha(emb.etd) : '—') + '</span>' +
      '</div>' +
      '<div class="lt-lado der">' +
        '<span class="lt-rot">' + esc(emb.port || 'Llegada') + '</span>' +
        '<span class="lt-fecha' + (emb.eta && emb.eta.anioAsumido ? ' asumida' : '') + '"' +
          (emb.eta && emb.eta.anioAsumido
            ? ' title="Sin año en la planilla, se asume ' + emb.eta.getUTCFullYear() + '"' : '') +
          '>' + (esFecha(emb.eta) ? fmtFecha(emb.eta) : '—') + '</span>' +
      '</div>' +
    '</div></div>';
}

function vistaControl(evs, cuenta) {
  var orden = { critico: 3, alto: 2, medio: 1 };
  var con = evs.filter(function (x) { return x.ev.alertas.length; })
    .sort(function (a, b) { return (orden[b.ev.nivelMax] || 0) - (orden[a.ev.nivelMax] || 0); });

  function boton(nivel, n, label, cls) {
    return '<button class="' + cls + '" data-act="fnivel" data-n="' + nivel + '" ' +
      'aria-pressed="' + (S.filtroNivel === nivel) + '">' +
      '<span class="n">' + n + '</span><span class="l">' + label + '</span></button>';
  }

  var h = '<div class="tira">' +
    boton('critico', cuenta.critico, 'Acción ahora', 'crit') +
    boton('alto', cuenta.alto, 'Esta semana', 'alt') +
    boton('medio', cuenta.medio, 'Datos incompletos', '') +
    boton('ok', cuenta.ok, 'Al día', 'bien') +
    '</div>';

  if (!evs.length) return h + '<p class="centro">No hay filas con datos en las pestañas elegidas.</p>';

  if (S.filtroNivel === 'ok') {
    var alDia = evs.filter(function (x) { return !x.ev.nivelMax; });
    return h + '<h2 class="gt">Al día · ' + alDia.length + '</h2>' +
      '<div class="lista">' + alDia.map(function (x) { return filaEmbarque(x); }).join('') + '</div>';
  }

  if (!con.length) return h + '<p class="centro">No hay nada pendiente. Todo al día.</p>';

  [['critico', 'Requieren acción ahora'], ['alto', 'Para esta semana'], ['medio', 'Datos incompletos']]
    .forEach(function (g) {
      if (S.filtroNivel && S.filtroNivel !== g[0]) return;
      var items = con.filter(function (x) { return x.ev.nivelMax === g[0]; });
      if (!items.length) return;
      h += '<h2 class="gt">' + g[1] + ' <span>' + items.length + '</span></h2>' +
        '<div class="lista">' +
        items.map(function (x) { return filaEmbarque(x, { alerta: true }); }).join('') +
        '</div>';
    });
  return h;
}

// Una sola tarjeta para las dos vistas. En Control se le antepone la alerta,
// pero los datos del embarque son siempre los mismos: si podés trackearlo en
// una vista, podés trackearlo en la otra.
function filaEmbarque(x, opts) {
  opts = opts || {};
  var emb = x.emb, src = x.src, ev = x.ev;
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });

  // Exportador y comprador, cada uno con su bandera debajo. Se apilan, que es
  // lo que permite que la bandera quede pegada a quien corresponde y no se
  // pierda en una sola línea larga.
  var fExp = bandera(paisDeEmpresa(emb.exporter));
  var fImp = bandera(paisDeEmpresa(emb.importer));
  var partes = (emb.exporter && emb.importer)
    ? '<div class="via-partes">' +
        '<div class="parte"><span class="exp">' + esc(emb.exporter) + '</span>' +
          (fExp ? '<span class="rot-pais">' + fExp + '</span>' : '') + '</div>' +
        '<span class="fl">→</span>' +
        '<div class="parte"><span class="imp">' + esc(emb.importer) + '</span>' +
          (fImp ? '<span class="rot-pais">' + fImp + '</span>' : '') + '</div>' +
      '</div>'
    : '<div class="via-partes"><div class="parte"><span class="imp">' +
        esc(emb.importer || emb.exporter || 'Sin cargar') + '</span>' +
        (fImp || fExp ? '<span class="rot-pais">' + (fImp || fExp) + '</span>' : '') +
      '</div></div>';

  var tns = (emb.tns !== null && emb.tns !== undefined && emb.tns !== '')
    ? Number(emb.tns).toLocaleString('es-AR') + ' tn' : '';
  var sub = [emb.product, emb.tipo, tns].filter(Boolean).join(' · ');

  var refs = [['contract', 'Contrato'], ['invoice', 'Factura'], ['bl', 'BL'],
              ['booking', 'Booking'], ['containers', 'Contenedores']]
    .filter(function (r) { return src.mapa[r[0]] !== undefined && !src.noAplica[r[0]]; })
    .map(function (r) {
      var v = emb[r[0]];
      return '<span class="ref"><em>' + r[1] + '</em>' +
        (v ? '<b>' + esc(v) + '</b>' : '<u>falta</u>') + '</span>';
    }).join('');

  var notas = sems.filter(function (c) { return emb._notas && emb._notas[c]; })
    .map(function (c) {
      var cls = { ok:'ok', pendiente:'pend', atencion:'sol' }[emb[c]] || 'gris';
      return '<p class="nota ' + cls + '"><em>' + CAMPOS[c].label + '</em>' +
        esc(emb._notas[c]) + '</p>';
    }).join('');

  var alerta = '';
  if (opts.alerta && ev.alertas.length) {
    var a = ev.alertas[0], resto = ev.alertas.length - 1;
    alerta = '<div class="aviso-fila ' + a.nivel + '">' +
      '<p class="tit">' + esc(a.titulo) + '</p>' +
      '<p class="det">' + esc(a.detalle) + '</p>' +
      (resto > 0 ? '<p class="mas">+' + resto + (resto > 1 ? ' pendientes más' : ' pendiente más') + '</p>' : '') +
      '</div>';
  }

  // El selector vive en su propia columna, discreto, como en cualquier lista
  // que se puede seleccionar. No compite con los datos.
  var seleccionable = true;
  var marcado = !!(S.marcados && S.marcados[emb._id]);

  return '<article class="emb' + (emb._id === S.sel ? ' sel' : '') +
    (marcado ? ' marcado' : '') +
    (opts.alerta && ev.nivelMax ? ' n-' + ev.nivelMax : '') +
    '" data-act="abrir" data-f="' + esc(emb._id) + '" tabindex="0">' +

    (seleccionable
      ? '<label class="col-check" title="Elegir para el shipment advice">' +
        '<input type="checkbox" data-marcar="' + esc(emb._id) + '"' +
        (marcado ? ' checked' : '') + '>' +
        '<span class="cbx">' + ico('check') + '</span></label>'
      : '') +

    '<div class="emb-cuerpo">' +
    '<div class="fila-top">' +
      '<div class="ident">' +

        '<div class="partes">' + partes + '</div>' +
        (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        (S.fuentes.length > 1 ? '<div class="orig">' + esc(nombreCorto(emb._tab)) + '</div>' : '') +
      '</div>' +
      '<div class="medio">' + barraRuta(emb) +
        '<div class="et-wrap">' + pasosEtapa(ev.etapa) + '</div></div>' +
      '<div class="estados">' +
        sems.map(function (c) { return pill(c, emb[c]); }).join('') +
        (emb._faltaComprobante
          ? '<span class="pill nar"><span class="pt"></span>Falta comprobante</span>' : '') +
        (emb._aFacturar
          ? '<span class="pill ok"><span class="pt"></span>Cliente pagó</span>' : '') +
        ((S.fuentesFact || []).length && !emb._aFacturar && opts.acciones !== false
          ? '<button class="ir-fact" data-act="abrirpasar" data-f="' + esc(emb._id) + '" ' +
            'title="Pasar a ' + esc(S.fuentesFact[0].tab) + '">' + ico('mover') +
            'A facturar</button>'
          : '') +
        (opts.acciones !== false
          ? '<button class="btn-elim chico" data-act="elimabrir" data-f="' + esc(emb._id) + '" title="Eliminar esta carga de la planilla" aria-label="Eliminar esta carga">' + ico('papelera') + '</button>'
          : '') +
        (function () {
          var a = adviceDe(emb);
          if (!a) return '';
          var f = fechaAdvice(a);
          return '<span class="pill adv" title="' +
            esc('Generado por ' + (a.quien || 'alguien') + (f ? ' el ' + f : '')) + '">' +
            ico('mail') + 'Advice enviado' + (f ? ' · ' + f : '') + '</span>';
        })() +
        (function () {
          var n = nComentariosAbiertos(emb);
          return n ? '<span class="pill coment"><span class="pt"></span>' + n +
            (n === 1 ? ' comentario' : ' comentarios') + '</span>' : '';
        })() +
      '</div>' +
    '</div>' +

    alerta +
    (refs ? '<div class="refs">' + refs + '</div>' : '') +
    (notas ? '<div class="notas">' + notas + '</div>' : '') +
    (function () {
      var cs = comentariosDe(emb);
      if (!cs.length) return '';
      var u = cs[cs.length - 1];
      return '<div class="ultimo-com">' +
        '<span class="autor">' + esc(nombreCortoAutor(u.autor)) + '</span>' +
        '<span class="txt">' + esc(u.texto) + '</span>' +
        (cs.length > 1 ? '<span class="mas">+' + (cs.length - 1) + '</span>' : '') +
        '</div>';
    })() +
    '</article>';
}

// juan.perez@empresa.com -> juan.perez
function nombreCortoAutor(a) {
  var t = String(a || '');
  return t.indexOf('@') > 0 ? t.slice(0, t.indexOf('@')) : t;
}


var ORDENES = {
  eta_asc:  { label: 'ETA más próxima',      campo: 'eta', dir: 1 },
  eta_desc: { label: 'ETA más lejana',       campo: 'eta', dir: -1 },
  etd_desc: { label: 'ETD más reciente',     campo: 'etd', dir: -1 },
  etd_asc:  { label: 'ETD más antiguo',      campo: 'etd', dir: 1 },
  hoja:     { label: 'Orden de la hoja',     campo: null },
  urgencia: { label: 'Urgencia',             campo: null },
  cliente:  { label: 'Cliente (A-Z)',        campo: null }
};

function ordenar(filas, clave) {
  // Si se clickeó un encabezado de la planilla, ese orden manda.
  if (S.ordenCol) {
    var campo = S.ordenCol.campo, dir = S.ordenCol.dir;
    return filas.slice().sort(function (a, b) {
      var va = valorOrden(a.emb, campo), vb = valorOrden(b.emb, campo);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'es', { numeric: true }) * dir;
    });
  }

  var o = ORDENES[clave] || ORDENES.eta_asc;
  var copia = filas.slice();
  if (clave === 'hoja') return copia.sort(function (a, b) { return a.emb._fila - b.emb._fila; });

  if (clave === 'urgencia') {
    var pr = { critico: 3, alto: 2, medio: 1 };
    return copia.sort(function (a, b) {
      var d = (pr[b.ev.nivelMax] || 0) - (pr[a.ev.nivelMax] || 0);
      if (d) return d;
      return b.ev.alertas.length - a.ev.alertas.length;
    });
  }
  if (clave === 'cliente') {
    return copia.sort(function (a, b) {
      return String(a.emb.importer || '').localeCompare(String(b.emb.importer || ''), 'es');
    });
  }
  // Las filas sin fecha van siempre al final, ordene como ordene.
  return copia.sort(function (a, b) {
    var fa = a.emb[o.campo], fb = b.emb[o.campo];
    var va = esFecha(fa) ? fa.getTime() : null;
    var vb = esFecha(fb) ? fb.getTime() : null;
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    return (va - vb) * o.dir;
  });
}

function valorOrden(emb, campo) {
  var v = emb[campo];
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v.getTime();
  if (typeof v === 'object' && v.invalida) return null;
  if (SEMAFOROS.indexOf(campo) >= 0) {
    return ['vacio', 'pendiente', 'atencion', 'ok'].indexOf(v);
  }
  return v;
}

// Texto que se ve en una celda, que es contra lo que filtra el usuario.
function textoCelda(emb, campo) {
  if (SEMAFOROS.indexOf(campo) >= 0) {
    var n = (emb._notas && emb._notas[campo]) || '';
    return etiqueta(campo, emb[campo]) + ' ' + n;
  }
  var v = emb[campo];
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return fmtFecha(v);
  if (typeof v === 'object' && v.invalida) return String(v.crudo);
  return String(v);
}

/* --- Filtro por columna, como el de Google Sheets ---------------------------
   Cada columna puede tener:
     - una condición: está vacía, no está vacía, contiene, no contiene;
     - una lista de valores permitidos (los tildados);
   y las dos se combinan. S.fCol[col] = { cond, texto, vals }.
   vals = null significa "todos": no se filtra por valor.
   -------------------------------------------------------------------------- */

// El valor que se ve en la lista del filtro. En los semáforos es el estado
// (Enviados, Pendientes...), que es por lo que uno filtra, no la nota.
function valorFiltro(emb, c) {
  if (SEMAFOROS.indexOf(c) >= 0) return etiqueta(c, emb[c] || 'vacio');
  return String(textoCelda(emb, c) || '').trim();
}

function filtroColActivo(f) {
  return !!(f && (f.cond || f.vals));
}

function pasaFiltroCol(emb, src, c, f) {
  if (!filtroColActivo(f)) return true;
  var v = src.mapa[c] === undefined ? '' : valorFiltro(emb, c);
  var vacio = SEMAFOROS.indexOf(c) >= 0 ? (!emb[c] || emb[c] === 'vacio') : v === '';
  var t = clave(f.texto || '');
  if (f.cond === 'vacia' && !vacio) return false;
  if (f.cond === 'llena' && vacio) return false;
  if (f.cond === 'contiene' && t && clave(v).indexOf(t) < 0) return false;
  if (f.cond === 'nocontiene' && t && clave(v).indexOf(t) >= 0) return false;
  if (f.vals && !f.vals[v]) return false;
  return true;
}

// Los valores de una columna, con cuántas filas tiene cada uno. Como en Sheets,
// se cuentan sobre lo que dejan pasar los OTROS filtros.
function valoresColumna(c) {
  var guarda = S.fCol[c];
  delete S.fCol[c];
  var filas;
  try { filas = filasVisiblesPlanilla(true); } finally { if (guarda) S.fCol[c] = guarda; }
  var cuenta = {};
  filas.forEach(function (x) {
    var v = x.src.mapa[c] === undefined ? '' : valorFiltro(x.emb, c);
    cuenta[v] = (cuenta[v] || 0) + 1;
  });
  return Object.keys(cuenta).sort(function (a, b) {
    if (a === '') return -1;               // (Vacías) arriba, como en Sheets
    if (b === '') return 1;
    return a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' });
  }).map(function (v) { return { v: v, n: cuenta[v] }; });
}

function aplicarFiltros(evs) {
  var q = S.busca.trim().toLowerCase();
  return evs.filter(function (x) {
    var emb = x.emb, src = x.src;

    if (q) {
      var campos = [emb.contract, emb.importer, emb.exporter, emb.bl, emb.booking,
                    emb.invoice, emb.vessel, emb.port, emb.product, emb._tab];
      if (emb._notas) SEMAFOROS.forEach(function (c) { campos.push(emb._notas[c]); });
      if (!campos.some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; })) return false;
    }
    if (S.filtroTab && !emb._esFact && emb._tab !== S.filtroTab) return false;

    // Estado de cada semáforo. "na" = la pestaña no lo usa.
    for (var i = 0; i < SEMAFOROS.length; i++) {
      var c = SEMAFOROS[i], want = S.f[c];
      if (!want) continue;
      if (src.mapa[c] === undefined || src.noAplica[c]) return false;
      if ((emb[c] || 'vacio') !== want) return false;
    }
    if (S.f.fact === 'si' && !emb._aFacturar) return false;
    if (S.f.fact === 'no' && emb._aFacturar) return false;
    if (S.f.cbte === 'si' && !emb._faltaComprobante) return false;
    if (S.f.cbte === 'no' && emb._faltaComprobante) return false;

    // Filtros por columna de la vista planilla.
    var claves = Object.keys(S.fCol);
    for (var j = 0; j < claves.length; j++) {
      if (!pasaFiltroCol(emb, src, claves[j], S.fCol[claves[j]])) return false;
    }

    // Falta un dato concreto.
    if (S.f.falta) {
      var k = S.f.falta;
      if (src.mapa[k] === undefined || src.noAplica[k]) return false;
      var v = emb[k];
      if (v !== null && v !== undefined && v !== '') return false;
    }
    return true;
  });
}

function filtrosActivos() {
  var n = 0;
  SEMAFOROS.forEach(function (c) { if (S.f[c]) n++; });
  if (S.f.cbte) n++;
  if (S.f.fact) n++;
  if (S.f.falta) n++;
  if (S.filtroTab && !S.verFact) n++;
  Object.keys(S.fCol).forEach(function (k) { if (filtroColActivo(S.fCol[k])) n++; });
  return n;
}

function vistaGrilla(evs) {
  var filas = ordenar(aplicarFiltros(evs), S.orden);

  // Con el formulario abierto, dibujar 70 tarjetas detrás hace lento cada

  var tope = S.altaEmb ? 6 : (S.topeCargas || 0);

  var nf = filtrosActivos();

  var h = '';

    // Tabla/Planilla: la tabla es lo importante; el alta queda a mano, en la línea de la búsqueda.
  } else if (!S.altaEmb) {
    h += '<div class="barra-alta">' +
      '<div class="accion-bloque">' +

          ico('plus') + 'Cargar embarque nuevo</button>' +
        '<p class="ayuda-accion">Se inserta arriba de la fila TOTAL de la pestaña que elijas</p>' +
      '</div></div>';
  } else {
    h += formAltaEmb();
  }

  h += '<div class="filtros">' +
    (enHoja && !S.altaEmb ? '<button class="primario alta-chica" data-act="altaemb" title="Se inserta arriba de la fila TOTAL de la pestaña que elijas">' +
      ico('plus') + 'Cargar embarque</button>' : '') +
    '<input id="busca-cargas" placeholder="Buscar cliente, contrato, BL, factura…" value="' +

    '<select id="orden" aria-label="Ordenar por">' +
      Object.keys(ORDENES).map(function (k) {

      }).join('') + '</select>' +
    '<button data-act="pfiltros" aria-pressed="' + S.panelFiltros + '">Filtros' +
      (nf ? ' · ' + nf : '') + '</button>' +
    '<span class="barra-modos">' + botonesHistHtml() +
    '<span class="modos">' +
      [['tarjetas', 'Tarjetas'], ['planilla', 'Planilla'],
       ['exportadores', 'Por exportador']]
        .map(function (m) {
          return '<button data-act="modo" data-m="' + m[0] + '" aria-pressed="' +
            (S.modo === m[0]) + '">' + m[1] + '</button>';
        }).join('') +
    '</span></span>' +
    (S.modo === 'tarjetas' ? menuConfigHtml(false) : '') +

  if (S.panelFiltros) h += panelFiltros(evs);

  // "Por exportador" agrupa las mismas cargas, así que respeta el buscador y

  if (S.modo === 'exportadores') return h + vistaExportadores(aplicarFiltros(evs));

  if (!filas.length) {
    return h + '<p class="centro">Nada coincide con el filtro.' +
      (nf ? ' <button data-act="limpiar">Limpiar filtros</button>' : '') + '</p>';
  }

  var masAbajo = cortadas
    ? '<div class="ver-mas"><span class="ayuda">' + cortadas +
      ' embarques más, ocultos mientras cargás</span></div>' : '';

  if (S.modo === 'planilla' || S.modo === 'tabla') return h + vistaPlanilla(filas) + masAbajo;
  return h + '<div class="lista">' + filas.map(function (x) { return filaEmbarque(x); }).join('') +
    '</div>' + masAbajo;
}

/* «A facturar» en Tabla/Planilla: el mismo motor que las cargas (filtros, orden, anchos, comentarios, marcar,
   pintar, deshacer…). Va en el orden de la hoja: las últimas que pasaste, abajo de todo. */
function recortarFact(filas) {
  S.recFact = null;
  var tope = S.topeFactT || 150;
  if (filas.length <= tope) return filas;
  var desdeArriba = !!S.ordenCol;                  // si ordenó por una columna, se muestran las primeras de ese orden
  S.recFact = { total: filas.length, mostradas: tope, desdeArriba: desdeArriba };
  return desdeArriba ? filas.slice(0, tope) : filas.slice(filas.length - tope);
}
function recorteFactHtml() {
  var R = S.recFact;
  if (!R) return '';
  return '<div class="recorte-fact" role="status">Mostrando ' + (R.desdeArriba ? 'las primeras ' : 'las últimas ') + R.mostradas + ' de ' + R.total + ' filas. ' +
    '<button data-act="factmas">Ver ' + Math.min(300, R.total - R.mostradas) + ' más</button>' +
    '<button data-act="factodas">Ver todas</button></div>';
}
function vistaGrillaFact(evs) {
  var todas = ordenar(aplicarFiltros(evs), 'hoja');
  var nf = filtrosActivos();
  var h = '<div class="filtros">' +
    '<input id="busca-cargas" placeholder="Buscar cliente, contrato, BL, factura…" value="' + esc(S.busca) + '" aria-label="Buscar en A facturar">' +
    '<button data-act="pfiltros" aria-pressed="' + S.panelFiltros + '">Filtros' + (nf ? ' · ' + nf : '') + '</button>' +
    '<span class="barra-modos">' + botonesHistHtml() +
    '<span class="modos">' + [['tarjetas', 'Tarjetas'], ['planilla', 'Planilla']].map(function (m) {
      return '<button data-act="modo" data-m="' + m[0] + '" aria-pressed="' + (S.modo === m[0] || (m[0] === 'planilla' && S.modo === 'tabla')) + '">' + m[1] + '</button>';
    }).join('') + '</span></span></div>';
  if (S.panelFiltros) h += panelFiltros(evs);
  h += '<p class="conteo">' + todas.length + (todas.length === 1 ? ' fila' : ' filas') +
    (todas.length !== evs.length ? ' de ' + evs.length : '') + ' en «' + esc((S.fuentesFactT[0] || {}).tab || 'A facturar') + '» · ' +
    (S.ordenCol ? 'ordenadas por columna' : 'en el orden de la hoja: las últimas, abajo de todo') + '</p>';
  var filas = recortarFact(todas);
  if (S.factError) h += '<div class="error">' + esc(S.factError) + '</div>';
  if (!filas.length) {
    return h + '<p class="centro">Nada coincide con el filtro.' + (nf ? ' <button data-act="limpiar">Limpiar filtros</button>' : '') + '</p>';
  }
  return h + recorteFactHtml() + vistaPlanilla(filas);
}

function panelFiltros(evs) {

                   ['containers', 'Contenedores'], ['vessel', 'Buque'], ['tracking', 'Tracking']]

        '<option value="">Cualquiera</option>' +

        '<option value="no"' + (S.f.fact === 'no' ? ' selected' : '') + '>Todavía no</option>' +
        '</select></div>' +
      '<div class="fcampo"><label for="fcbte">Comprobante</label><select id="fcbte">' +
        '<option value="">Cualquiera</option>' +
        '<option value="si"' + (S.f.cbte === 'si' ? ' selected' : '') + '>Falta</option>' +
        '<option value="no"' + (S.f.cbte === 'no' ? ' selected' : '') + '>No falta</option>' +
        '</select></div>' +
      (faltables.length
        ? '<div class="fcampo"><label for="ffalta">Le falta cargar</label><select id="ffalta">' +
          '<option value="">Nada en particular</option>' +
          faltables.map(function (r) {
            return '<option value="' + r[0] + '"' + (S.f.falta === r[0] ? ' selected' : '') +
              '>' + r[1] + '</option>';
          }).join('') + '</select></div>'
        : '') +
