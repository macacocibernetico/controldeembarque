/* Los mails de una celda. Vienen separados por coma, pero en la práctica
   también aparecen con punto y coma, espacios, saltos de línea o con nombre
   ("Juan <juan@x.com>"). Se extraen los que tienen forma de mail, sin
   repetir, y lo que sobra se reporta para revisarlo. */
function parsearMails(txt) {
  var t = String(txt == null ? '' : txt);
  var re = /[A-Z0-9._%+'-]+@[A-Z0-9-]+(?:\.[A-Z0-9-]+)*\.[A-Z]{2,}/gi;
  var vistos = {}, mails = [];
  (t.match(re) || []).forEach(function (m) {
    var k = m.toLowerCase().replace(/\.$/, '');
    if (!vistos[k]) { vistos[k] = 1; mails.push(k); }
  });
  // Lo que queda sin mail, para avisar (un "@" suelto, un dominio incompleto).
  var resto = t.replace(re, ' ').replace(/[<>"(),;:\s]+/g, ' ').trim();
  var raros = resto.split(' ').filter(function (x) { return x.indexOf('@') >= 0; });
  return { mails: mails, raros: raros };
}

/* La copia del advice, armada en un solo lugar: lo que se muestra en pantalla
   es exactamente lo que sale en el mail.
   - la casilla fija de exportación;
   - los mails documentales del cliente (Database_old);
   - Peter, si está encendido.
   Sin repetir, y sin nadie que ya esté en "Para". */
function ccAdvice(importador, destino) {
  var para = {};
  parsearMails(destino).mails.forEach(function (m) { para[m] = 1; });
  var vistos = {}, cc = [];
  var sumar = function (m, origen) {
    var k = String(m || '').trim().toLowerCase();
    if (!k || para[k] || vistos[k]) return;
    vistos[k] = 1; cc.push({ mail: k, origen: origen });
  };
  var peter = String(ADV.peter || '').toLowerCase();
  var conPeter = peterActivo(importador);
  // Si "Copia a Peter" está apagado, Peter no va, aunque su mail figure entre
  // los documentales del cliente: el interruptor tiene que decir la verdad.
  if (!conPeter) vistos[peter] = 1;
  sumar(ADV.ccFijo, 'fijo');
  if (conPeter) sumar(ADV.peter, 'peter');
  mailsDocumentales(importador).forEach(function (m) { sumar(m, 'documental'); });
  return cc;
}

// Peter va en copia por defecto cuando el cliente es Alrisha; en cualquier
// caso se puede prender o apagar a mano, y eso manda.
function peterActivo(importador) {
  if (S.advicePeter === true || S.advicePeter === false) return S.advicePeter;
  return clave(importador).indexOf('alrisha') >= 0;
}

/* A quién va el advice. Primero la columna "Mails CC" del embarque, que es lo
   que usaba el script de siempre. Si está vacía, los mails documentales del
   cliente: un advice no puede salir sin "Para", y frenarlo cuando la planilla
   sí tiene a quién mandarlo no tiene sentido. */
function destinoAdvice(emb) {
  var propio = String((emb && emb.mailsCC) || '').trim();
  if (propio) return { para: propio, origen: 'embarque' };
  var docs = mailsDocumentales(emb && emb.importer);
  if (docs.length) return { para: docs.join(', '), origen: 'documental' };
  return { para: '', origen: '' };
}

function mailsDocumentales(empresa) {
  return (S.mailsDoc && S.mailsDoc.get(clave(empresa))) || [];
}

function codigoPais(v) {
  var t = String(v == null ? '' : v).trim();
  if (!t) return null;
  var up = t.toUpperCase();
  if (up.length === 2 && PAISES[up]) return up;
  var k = clave(t);
  return NOMBRE_PAIS[k] || null;
}

/* Los países viven en otra planilla (la comercial), en las hojas de la base de
   datos. Se lee con el mismo permiso: alcanza con que tu cuenta tenga acceso.
   Las empresas se atan por nombre, que es el mismo en las dos planillas. */
async function cargarPaisesEmpresas() {
  S.paises = new Map();
  S.mailsDoc = new Map();
  S.mailsRaros = [];
  S.sinPais = { clientes: [], proveedores: [] };
  S.fichasDB = new Map();
  S.diagPaises = null;
  if (!S.cfg.paisSheetId) return;

  try {
    var meta = await api(BASE + S.cfg.paisSheetId +
      '?fields=' + encodeURIComponent('properties(title),sheets(properties(title))'));
    var hojas = (meta.sheets || []).map(function (h) { return h.properties.title; });

    // Qué hoja es cuál. Se puede fijar a mano en la configuración; si no, se
    // busca por nombre.
    var buscar = function (incluye, excluye) {
      return hojas.filter(function (n) {
        var k = clave(n);
        if (excluye && k.indexOf(excluye) >= 0) return false;
        return k.indexOf(incluye) >= 0;
      })[0] || '';
    };
    var hProv = S.cfg.tabPaisPro || buscar('supplier') || buscar('proveedor');
    // Para clientes, "Database_old" tiene prioridad: puede haber otras hojas que
    // también digan "database" y leer la equivocada no da ningún error visible.
    var exacta = hojas.filter(function (n) { return clave(n) === 'database_old'; })[0];
    var hCli = S.cfg.tabPaisCli || exacta || buscar('database', 'supplier') || buscar('client');

    var usadas = [];
    S.diagMails = [];

    var letra = function (i) { return i < 0 ? '—' : letraCol(i); };

    var leer = function (hoja, cubo, etiqueta) {
      if (!hoja) return Promise.resolve();
      // La hoja entera, sin límite de columnas: antes se leía hasta la Z y una
      // columna más a la derecha quedaba afuera sin avisar.
      return api(BASE + S.cfg.paisSheetId + '/values/' +
        encodeURIComponent("'" + hoja.replace(/'/g, "''") + "'"))
        .then(function (r) {
          var filas = r.values || [];
          if (!filas.length) { usadas.push(hoja + ': vacía'); return; }

          var esNombre = function (k) {
            return k.indexOf('name') >= 0 || k.indexOf('empresa') >= 0 ||
              k.indexOf('client') >= 0 || k.indexOf('supplier') >= 0 ||
              k.indexOf('company') >= 0 || k.indexOf('razon') >= 0 ||
              k.indexOf('importador') >= 0 || k.indexOf('exportador') >= 0 ||
              k.indexOf('proveedor') >= 0;
          };
          var esPais = function (k) {
            return k === 'country' || k === 'pais' || k.indexOf('country') >= 0 ||
                   (k.indexOf('pais') >= 0 && k.indexOf('para') < 0);
          };
          var esMails = function (k) {
            return k.indexOf('mail') >= 0 &&
                   (k.indexOf('document') >= 0 || k.indexOf('envio') >= 0);
          };

          // ¿Esa columna tiene nombres, o VERDADERO/FALSO? En Database_old la
          // columna "Client" es una casilla (si es cliente o no) y el nombre
          // está en "Company". Tomar "Client" como nombre hacía que ningún
          // mail se asignara a ninguna empresa.
          var esDeCasillas = function (col, desde) {
            var bool = 0, total = 0;
            for (var r = desde; r < Math.min(filas.length, desde + 80); r++) {
              var v = filas[r] && filas[r][col];
              if (v === null || v === undefined || v === '') continue;
              total++;
              var t = String(v).trim().toUpperCase();
              if (v === true || v === false || t === 'TRUE' || t === 'FALSE' ||
                  t === 'VERDADERO' || t === 'FALSO') bool++;
            }
            return total > 0 && bool / total > 0.5;
          };
          // Cuál es la columna del nombre: por prioridad, no la primera que aparezca.
          var PRIO_NOMBRE = ['company', 'empresa', 'razon social', 'real name', 'nombre',
                             'name', 'supplier', 'proveedor', 'importador', 'exportador',
                             'client', 'cliente'];
          var prioNombre = function (k) {
            for (var q = 0; q < PRIO_NOMBRE.length; q++) {
              if (k === PRIO_NOMBRE[q] || k.indexOf(PRIO_NOMBRE[q]) === 0) return q;
            }
            return -1;
          };

          // El encabezado es la fila, entre las primeras diez, con más columnas
          // reconocibles. No hace falta que tenga Country para leer los mails.
          var iEnc = -1, mejor = 0, cPais = -1, cNom = -1, cMails = -1;
          for (var f = 0; f < Math.min(10, filas.length); f++) {
            var enc = filas[f] || [], p = -1, n = -1, nPrio = 99, m = -1;
            for (var i = 0; i < enc.length; i++) {
              var k = clave(enc[i]);
              if (!k) continue;
              if (m < 0 && esMails(k)) { m = i; continue; }
              if (p < 0 && esPais(k)) { p = i; continue; }
              var pr = prioNombre(k);
              if (pr >= 0 && pr < nPrio && !esDeCasillas(i, f + 1)) { n = i; nPrio = pr; }
            }
            var puntos = (p >= 0) + (n >= 0) + (m >= 0) * 2;
            if (puntos > mejor) { mejor = puntos; iEnc = f; cPais = p; cNom = n; cMails = m; }
          }
          if (iEnc < 0) {
            usadas.push(hoja + ': no encontré encabezados (ni empresa, ni Country, ni mails)');
            return;
          }
          if (cNom < 0) cNom = 0;   // sin columna de nombre clara, la primera

          // La ficha de cada empresa para el contrato: dirección, VAT, contacto y mail. Se buscan por el nombre de
          // la columna; lo que no se encuentra queda vacío (se completa a mano en el generador).
          var encF = filas[iEnc] || [], cDir = -1, cVat = -1, cCon = -1, cEma = -1, cInfo = -1;
          var prDir = 99, prEma = 99, prCon = 99;
          for (var cj = 0; cj < encF.length; cj++) {
            var kk = clave(encF[cj]);
            if (!kk || cj === cNom || cj === cPais || cj === cMails) continue;
            var esMailCol = kk.indexOf('mail') >= 0 || kk.indexOf('correo') >= 0;
            if (esMailCol) {
              // Los «mails para envío documental / documentación» son otra cosa; el mail del contrato o el de contacto sí.
              if (esMails(kk) || kk.indexOf('document') >= 0 || kk.indexOf('cc') === 0 || kk.indexOf(' cc') >= 0) continue;
              var pe = kk.indexOf('contrato') >= 0 ? 0 : (kk.indexOf('email') === 0 || kk === 'mail' || kk === 'correo' ? 1 : 2);
              if (pe < prEma) { cEma = cj; prEma = pe; }
              continue;
            }
            // Dirección: la «Contract Address» manda; la «Dirección envío docs» es adonde se mandan los papeles físicos, no la del contrato.
            if (kk.indexOf('address') >= 0 || kk.indexOf('adress') >= 0 || kk.indexOf('direccion') >= 0 || kk.indexOf('domicilio') >= 0) {
              var pd = kk.indexOf('contract') >= 0 || kk.indexOf('contrato') >= 0 ? 0 : (kk.indexOf('envio') >= 0 || kk.indexOf('docs') >= 0 || kk.indexOf('shipping') >= 0 ? 90 : 1);
              if (pd < 90 && pd < prDir) { cDir = cj; prDir = pd; }
              continue;
            }
            if (kk.indexOf('info para el contrato') === 0 || kk.indexOf('info contrato') === 0) { if (cInfo < 0) cInfo = cj; continue; }
            if (cVat < 0 && (kk.indexOf('vat') >= 0 || kk.indexOf('tax') >= 0 || kk.indexOf('cuit') >= 0 || kk === 'ruc' || kk === 'rut' || kk === 'nit' || kk.indexOf('fiscal') >= 0)) { cVat = cj; continue; }
            if (kk.indexOf('contact') >= 0 && kk.indexOf('contactado') < 0 && kk.indexOf('phone') < 0 && kk.indexOf('tel') < 0 && kk.indexOf('web') < 0) {
              // «Contact A» antes que «Contact B»
              var pc = kk.slice(-2) === ' a' ? 0 : 1;
              if (pc < prCon) { cCon = cj; prCon = pc; }
              continue;
            }
          }
          // Sin columna de dirección (Database suppliers), «Info para el contrato» hace de dirección: se muestra para revisarla.
          var dirDeInfo = cDir < 0 && cInfo >= 0;
          if (dirDeInfo) cDir = cInfo;
          var celF = function (fila, c) { return c >= 0 && fila[c] != null ? String(fila[c]).replace(/\s+/g, ' ').trim() : ''; };

          var con = 0, conMail = 0, conFicha = 0, ejemplos = [];
          filas.slice(iEnc + 1).forEach(function (f2) {
            var nom = f2 && f2[cNom] ? String(f2[cNom]).trim() : '';
            if (!nom) return;
            if (cDir >= 0 || cVat >= 0 || cCon >= 0 || cEma >= 0) {
              var dirF = celF(f2, cDir), paisTxt = celF(f2, cPais);
              if (dirF && paisTxt && clave(dirF).indexOf(clave(paisTxt)) < 0) dirF += ', ' + paisTxt;
              var fi = { nombre: nom, direccion: dirF, vat: celF(f2, cVat), contacto: celF(f2, cCon), email: celF(f2, cEma), pais: paisTxt, origen: hoja, dirDeInfo: dirDeInfo && !!dirF };
              var fv = S.fichasDB.get(clave(nom));
              if (fv) ['direccion', 'vat', 'contacto', 'email', 'pais'].forEach(function (c2) { if (!fi[c2]) fi[c2] = fv[c2]; });
              S.fichasDB.set(clave(nom), fi);
              conFicha++;
            }
            if (cPais >= 0) {
              var cod = codigoPais(f2[cPais]);
              if (cod) { S.paises.set(clave(nom), cod); con++; }
              else if (cubo.length < 400) cubo.push(nom);
            }
            if (cMails >= 0 && f2[cMails]) {
              var r2 = parsearMails(f2[cMails]);
              if (r2.mails.length) {
                // Si la empresa aparece dos veces, se juntan sus mails.
                var ya = S.mailsDoc.get(clave(nom)) || [];
                r2.mails.forEach(function (x) { if (ya.indexOf(x) < 0) ya.push(x); });
                S.mailsDoc.set(clave(nom), ya);
                conMail++;
                if (ejemplos.length < 3) ejemplos.push(nom + ': ' + r2.mails.join(', '));
              }
              if (r2.raros.length) S.mailsRaros.push({ empresa: nom, raros: r2.raros });
            }
          });

          var enc0 = filas[iEnc] || [];
          S.diagMails.push({
            hoja: hoja, etiqueta: etiqueta, filaEnc: iEnc + 1,
            nombre: letra(cNom) + (cNom >= 0 ? ' «' + (enc0[cNom] || '') + '»' : ''),
            pais: letra(cPais) + (cPais >= 0 ? ' «' + (enc0[cPais] || '') + '»' : ''),
            mails: letra(cMails) + (cMails >= 0 ? ' «' + (enc0[cMails] || '') + '»' : ''),
            ficha: ['dirección ' + letra(cDir) + (cDir >= 0 ? ' «' + (enc0[cDir] || '') + '»' : ''), 'VAT ' + letra(cVat) + (cVat >= 0 ? ' «' + (enc0[cVat] || '') + '»' : ''),
                    'contacto ' + letra(cCon) + (cCon >= 0 ? ' «' + (enc0[cCon] || '') + '»' : ''), 'mail ' + letra(cEma) + (cEma >= 0 ? ' «' + (enc0[cEma] || '') + '»' : '')].join(' · '),
            conFicha: conFicha,
            conPais: con, conMail: conMail, ejemplos: ejemplos,
            columnas: enc0.length
          });
          usadas.push(hoja + ' → ' + con + ' con país' +
            (cMails >= 0 ? ', ' + conMail + ' con mails documentales'
                         : ', sin columna de mails documentales'));
        })
        .catch(function (e) { usadas.push(hoja + ': ' + e.message); });
    };

    await leer(hCli, S.sinPais.clientes, 'clientes');
    await leer(hProv, S.sinPais.proveedores, 'proveedores');

    S.diagPaises = {
      planilla: (meta.properties && meta.properties.title) || '',
      hojas: usadas,
      total: S.paises.size
    };
  } catch (e) {
    var msg = e.message || String(e);
    if (/403|permission|permiso/i.test(msg)) {
      msg = 'tu cuenta no tiene permiso para abrirla. Pedile acceso de lectura a quien ' +
            'es dueño de la Planilla Comercial.';
    } else if (/404|not found/i.test(msg)) {
      msg = 'no existe o cambió el enlace. Revisá la URL en Configuración.';
    }
    S.diagPaises = { error: msg };
  }
}

// El país sale de la base. Sin dato, no hay bandera.
function paisDeEmpresa(nombre) {
  if (!nombre || !S.paises || !S.paises.size) return null;
  return S.paises.get(clave(nombre)) || null;
}

function bandera(cod) {
  if (!cod || !PAISES[cod]) return '';
  var partes = PAISES[cod].split(' ');
  // Sólo el código: el emoji de bandera no existe en Windows y se veía como
  // «AR AR» (las letras del emoji más el código).
  return '<span class="pais" title="' + esc(PAISES[cod].replace(partes[0] + ' ', '')) + '">' +
    '<span class="cod2">' + cod + '</span></span>';
}

/* --- Shipment advice ------------------------------------------------------
   El borrador se arma acá y se crea directo en el Gmail de quien aprieta el
   botón, con la API de Gmail. El texto replica al del script de la planilla
   (asunto, cumplimiento parcial o total, firma), así sale igual que siempre.
   El registro queda en la pestaña "Advices enviados".
   -------------------------------------------------------------------------- */

// Varias filas de la misma carga van en un solo advice. Estas son las
// candidatas: misma pestaña, mismo BL, buque, ETD y ETA — la misma regla que
// usaba el script de la planilla.
function hermanasAdvice(emb) {
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  return S.datos.filas.filter(function (o) {
    if (o._tab !== emb._tab) return false;
    if (o._id === emb._id) return false;
    if (!o.bl || !emb.bl) return false;
    return clave(o.bl) === clave(emb.bl) &&
           clave(o.vessel) === clave(emb.vessel) &&
           f(o.etd) === f(emb.etd) &&
           f(o.eta) === f(emb.eta) &&
           clave(o.exporter) === clave(emb.exporter) &&
           clave(o.importer) === clave(emb.importer);
  });
}

// Antes de generar: si falta el BL o el buque el advice sale incompleto y hay
// que rehacerlo. Mejor verlo acá que en el borrador.
function faltantesAdvice(emb) {
  var req = [['bl', 'BL'], ['vessel', 'Buque'], ['eta', 'ETA'],
             ['etd', 'ETD'], ['port', 'Puerto']];
  var src = fuenteDe(emb);
  return req.filter(function (r) {
    if (src.mapa[r[0]] === undefined || src.noAplica[r[0]]) return false;
    var v = emb[r[0]];
    return v === null || v === undefined || v === '' || (v && v.invalida);
  }).map(function (r) { return r[1]; });
}

function filasAdvice(emb) {
  var sel = [emb];
  hermanasAdvice(emb).forEach(function (o) {
    if (S.adviceFilas && S.adviceFilas[o._id]) sel.push(o);
  });
  return sel.sort(function (a, b) { return a._fila - b._fila; });
}

async function enviarAdvice(ids, desdeBarra) {
  var sel = (Array.isArray(ids) ? ids : [ids]).map(filaPorId).filter(Boolean)
    .sort(function (a, b) { return a._fila - b._fila; });
  if (!sel.length) return;

  var marca = desdeBarra ? { barra: true } : { id: sel[0]._id };
  var fallar = function (msg, extra) {
    S.adviceMsg = Object.assign({ error: msg }, extra || {}, marca);
    S.adviceEnviando = null;
    pintar();
  };

  // El mail sale con lo guardado: si hay cambios sin guardar en esa carga, saldría con datos viejos.
  if (sel.some(function (e) { return pendDeFila(e._id); })) {
    return fallar('Esa carga tiene cambios sin guardar. Guardalos primero (arriba a la derecha de la tabla) ' +
      'y después generá el advice, así el mail sale con los datos nuevos.');
  }

  var d = datosAdvice(sel);
  if (d.errores.length) return fallar('No se pueden combinar: ' + d.errores.join('; ') + '.');

  var destino = (S.adviceTo !== null && S.adviceTo !== undefined) ? S.adviceTo : d.emailTo;
  destino = String(destino || '').trim();
  if (!destino) {
    return fallar('Falta el destinatario: la fila no tiene "Mails CC" y ' +
      (d.importer || 'el cliente') + ' no tiene mails para envío documental en Database_old.');
  }

  // Gmail rechaza un «Para» que no sea una lista limpia de mails (Invalid To
  // header). Se aceptan comas, punto y coma, saltos de línea y «Nombre <mail>».
  var pd = parsearMails(destino);
  if (pd.raros.length) {
    return fallar('Hay mails mal escritos en «Para»: ' + pd.raros.join(', ') +
      '. Corregilos en el campo Destinatarios.');
  }
  if (!pd.mails.length) return fallar('No hay ningún mail válido en «Para».');
  destino = pd.mails.join(', ');

  S.adviceEnviando = desdeBarra ? 'barra' : sel[0]._id;
  S.adviceMsg = null; pintar();

  try {
    var t = textosAdvice(d, S.adviceIdioma || 'en');
    var firma = await firmaDelUsuario();
    var cc = ccAdvice(d.importer, destino).map(function (x) { return x.mail; });

    var mime = armarMime(destino, cc.join(', '), t.subject,
                         cuerpoPlano(t), cuerpoHtml(t, firma));

    // El borrador se crea en la cuenta de quien apretó el botón.
    var r = await api('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { raw: b64url(mime) } })
    });

    var url = r && r.id
      ? 'https://mail.google.com/mail/u/0/#drafts'
      : 'https://mail.google.com/mail/u/0/#drafts';

    S.adviceMsg = Object.assign({
      ok: true,
      texto: 'Borrador creado en tu Gmail.\n' +
        'Filas: ' + sel.map(function (o) { return o._fila; }).join(', ') + '\n' +
        'Goods: ' + d.goods + '\n' +
        'Para: ' + destino + '\nCC: ' + cc.join(', '),
      url: url
    }, marca);

    // Queda anotado para todos, en la planilla. Si eso falla, el borrador ya
    // existe: se avisa aparte en vez de mostrar todo como un error.
    var avisoReg = await registrarAdvice(sel, destino, cc.join(', '));
    if (avisoReg) {
      S.adviceMsg.texto += '\n⚠ No se pudo anotar en «' + HOJA_ADVICES + '»: ' + avisoReg;
    }
    toast('Borrador del shipment advice creado en tu Gmail', 'ok');

    var ahora = new Date();
    var reg = { fecha: ahora.toLocaleDateString('es-AR'),
                quien: S.usuario ? S.usuario.email : '', pestana: sel[0]._tab };
    sel.forEach(function (o) {
      if (o.bl) S.advices.set('b|' + clave(o.bl), reg);
      if (o.contract) S.advices.set('c|' + clave(o.contract), reg);
    });
    if (desdeBarra) S.marcados = {};
  } catch (e) {
    var msg = e.message || String(e);
    if (!e.sesion && (e.permiso || (!e.habilitar && /insufficient|scope/i.test(msg)))) {
      S.faltaGmail = true;
      msg = 'Falta el permiso de Gmail para crear borradores.';
    }
    return fallar(msg, { habilitar: e.habilitar || null });
  } finally {
    S.adviceEnviando = null; pintar();
  }
}

// Deja constancia en la pestaña de registro, para que el resto vea qué se mandó.
async function registrarAdvice(sel, destino, cc) {
  try {
    var hoja = HOJA_ADVICES;
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    var existe = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(hoja);
    });
    if (!existe) {
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: [{ addSheet: { properties: { title: hoja } } }] })
      });
      await api(BASE + S.cfg.sheetId + '/values/' +
        encodeURIComponent("'" + hoja + "'!A1") + ':append?valueInputOption=USER_ENTERED', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [['Fecha', 'Pestaña', 'Filas', 'Contratos', 'BLs',
                                         'Para', 'CC Peter', 'Idioma', 'Solicitado por']] })
      });
    }
    var ahora = new Date();
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + hoja + "'!A1") +
      ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[
        ahora.toLocaleDateString('es-AR') + ' ' +
          ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
        sel[0]._tab,
        sel.map(function (o) { return o._fila; }).join(', '),
        sel.map(function (o) { return o.contract || ''; }).join(', '),
        sel.map(function (o) { return o.bl || ''; }).join(', '),
        destino, S.advicePeter ? 'sí' : 'no', S.adviceIdioma || 'en',
        S.usuario ? S.usuario.email : ''
      ]] })
    });
    return null;
  } catch (e) {
    return e.message || 'error desconocido';   // el registro no debe voltear el borrador
  }
}

/* --- Registro de advices enviados -----------------------------------------
   El script deja una fila en "Advices enviados" cada vez que genera un
   borrador. La app la lee para marcar los embarques: así la marca sobrevive a
   recargar y la ven todos, no solo quien lo generó.
   -------------------------------------------------------------------------- */

var HOJA_ADVICES = 'Advices enviados';

async function cargarAdvices() {
  S.advices = new Map();
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    var existe = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(HOJA_ADVICES);
    });
    if (!existe) return;

    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_ADVICES + "'!A2:I3000"));

    S.advicesViejos = 0;

    (r.values || []).forEach(function (f) {
      // Formato viejo: Fecha | Filas | Para | CC | Idioma | Quién. Se reconoce
      // porque la columna B es una lista de números.
      //
      // Esos registros NO se pueden ubicar: guardaban el número de fila, y las
      // filas se reordenan por ETA, así que hoy apuntan a otro embarque.
      // Marcar por ahí sería peor que no marcar. Se cuentan para avisar.
      if (f[1] && /^[\d,\s]+$/.test(String(f[1]).trim())) {
        S.advicesViejos++;
        return;
      }

      var reg = { fecha: f[0] || '', pestana: f[1] || '', quien: f[8] || '' };

      String(f[3] || '').split(',').forEach(function (c) {
        var k = clave(c);
        if (k) S.advices.set('c|' + k, reg);
      });
      String(f[4] || '').split(',').forEach(function (b) {
        var k = clave(b);
        if (k) S.advices.set('b|' + k, reg);
      });
    });
  } catch (e) {
    S.advices = new Map();
  }
}

// El BL manda: identifica el embarque exacto. El contrato es el respaldo para
// las cargas sin BL.
function adviceDe(emb) {
  if (!S.advices || !S.advices.size) return null;
  if (emb.bl) {
    var porBL = S.advices.get('b|' + clave(emb.bl));
    if (porBL) return porBL;
  }
  if (emb.contract) {
    var porCtr = S.advices.get('c|' + clave(emb.contract));
    // Sin BL propio no se puede distinguir un parcial de otro, así que solo
    // se acepta el match por contrato cuando el embarque no tiene BL.
    if (porCtr && !emb.bl) return porCtr;
  }
  return null;
}

// Fecha corta del registro, que puede venir como texto de Sheets.
function fechaAdvice(reg) {
  var t = String(reg && reg.fecha || '');
  var m = t.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  if (m) return m[1];
  var d = normFecha(t);
  return esFecha(d) ? fmtFecha(d) : '';
}

/* --- Comentarios -----------------------------------------------------------
   Como los de Google Sheets: cada comentario cuelga de una CELDA (o de la carga en general),
   se puede responder, resolver, editar y borrar.

   Viven en una pestaña propia de la misma planilla, así se ven desde Sheets y no pisan los
   datos. Cada fila es algo que pasó (comentó, respondió, resolvió, editó, borró): se agregan
   siempre al final, nunca se pisan filas, así dos personas a la vez no se rompen nada.

   A qué carga pertenecen NO depende del número de fila ni de cómo esté ordenada la pantalla:
   cada fila lleva una «huella» de la carga (contrato, BL, booking, factura, contenedores,
   cliente, toneladas, fechas) y con ella se la vuelve a reconocer. Si después le cargan el BL,
   le cambian el contrato o pasa a «A facturar», el comentario la sigue.
   -------------------------------------------------------------------------- */

// Compatibilidad: la clave vieja (pestaña + contrato + BL), de cuando no había huella.
function claveComentario(emb) {
  return [clave(emb._tab), clave(emb.contract), clave(emb.bl || '')].join('|');
}

function idCom() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function autorCom() { return S.usuario ? (S.usuario.email || S.usuario.nombre) : 'desconocido'; }
function esMio(autor) { return !!autor && clave(autor) === clave(autorCom()); }
function isoDia(d) { return esFecha(d) ? d.toISOString().slice(0, 10) : ''; }

// «12/10/2026 14:30» (el formato de siempre en esta pestaña) <-> milisegundos
function textoFechaCom(ms) {
  var d = new Date(ms), z = function (n) { return String(n).padStart(2, '0'); };
  return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}
// Entiende también lo que escribía la versión anterior («13/10/2026 03:35 p. m.»).
function msDeTextoCom(t) {
  var m = String(t || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s+(\d{1,2}):(\d{2})(?:\s*([ap])\.?\s*m)?/i);
  if (!m) return 0;
  var hh = +m[4];
  if (m[6]) { var pm = m[6].toLowerCase() === 'p'; if (pm && hh < 12) hh += 12; if (!pm && hh === 12) hh = 0; }
  return new Date(+m[3], +m[2] - 1, +m[1], hh, +m[5]).getTime();
}
function haceCuanto(ms) {
  if (!ms) return '';
  var d = Date.now() - ms, min = Math.floor(d / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return 'hace ' + min + ' min';
  var f = new Date(ms), h = new Date(Date.now());
  var hm = String(f.getHours()).padStart(2, '0') + ':' + String(f.getMinutes()).padStart(2, '0');
  var dia = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
  var dd = Math.round((dia(h) - dia(f)) / 86400000);
  if (dd === 0) return 'hoy ' + hm;
  if (dd === 1) return 'ayer ' + hm;
  return String(f.getDate()).padStart(2, '0') + '/' + String(f.getMonth() + 1).padStart(2, '0') +
    (f.getFullYear() !== h.getFullYear() ? '/' + String(f.getFullYear()).slice(2) : '') + ' ' + hm;
}

/* --- La huella de una carga y cómo se la reconoce ------------------------- */

function huellaDe(emb) {
  return { t: emb._tab || '', c: emb.contract || '', b: emb.bl || '', k: emb.booking || '',
           f: emb.invoice || '', i: emb.importer || '', n: String(emb.containers || '').slice(0, 60),
           q: normNum(emb.tns), d: isoDia(emb.etd), e: isoDia(emb.eta) };
}

// Cuánto se parece una huella guardada a una carga de ahora. Lo que identifica de verdad
// (BL, booking, factura, contenedores, contrato) pesa más que lo que se repite (cliente, toneladas).
function puntajeHuella(a, b) {
  var p = 0;
  var igual = function (x, y) { x = clave(x); return !!x && x === clave(y); };
  if (igual(a.c, b.c)) p += 3;
  if (igual(a.b, b.b)) p += 4;
  if (igual(a.k, b.k)) p += 4;
  if (igual(a.f, b.f)) p += 3;
  if (igual(a.n, b.n)) p += 3;
  if (igual(a.i, b.i)) p += 1;
  if (a.q !== null && a.q !== undefined && a.q === b.q) p += 1;
  if (clave(a.t) === clave(b.t)) p += 1;
  if (a.d && a.d === b.d) p += 1;
  if (a.e && a.e === b.e) p += 1;
  return p;
}

// La mejor candidata para una huella, o ninguna si no hay una que se le parezca de verdad.
// Si hay varias idénticas entre sí, se elige por el orden en que estaban.
function mejorCandidata(ancla, lista) {
  var mejor = 0, segundo = 0, emp = [];
  lista.forEach(function (x) {
    var p = puntajeHuella(ancla, x.hu);
    if (p > mejor) { segundo = mejor; mejor = p; emp = [x]; }
    else if (p === mejor && p > 0) emp.push(x);
    else if (p > segundo) segundo = p;
  });
  if (!emp.length) return null;
  // Con 6 puntos o más se la reconoce. Una carga con pocos datos (sin BL, booking ni factura) puede
  // quedarse en 4 o 5 si le cambiaron algo: se la acepta sólo si ninguna otra se le parece.
  if (mejor < 4 || (mejor < 6 && (emp.length > 1 || mejor - segundo < 2))) return null;
  if (emp.length === 1) return emp[0];
  emp.sort(function (a, b) { return a.orden - b.orden; });
  return emp[Math.min(ancla.o || 0, emp.length - 1)];
}

// Para cuando se escribe: cuál es el lugar de esta carga entre las que son iguales a ella.
function ordinalDe(emb) {
  var h = huellaDe(emb), tope = puntajeHuella(h, h);
  var iguales = todasFilas().filter(function (x) { return puntajeHuella(h, huellaDe(x)) === tope; });
  iguales.sort(function (a, b) { return a._fila - b._fila; });
  return Math.max(0, iguales.indexOf(emb));
}

function candidatasCargas() {
  return todasFilas().map(function (e) {
    return { ref: e, hu: huellaDe(e), orden: e._fila };
  });
}
function candidatasFactura() {
  var fact = (S.fuentesFact || [])[0];
  if (!fact) return [];
  var m = fact.mapa;
  var g = function (f, c) { var i = m[c]; return i === undefined || f.celdas[i] == null ? '' : f.celdas[i]; };
  return fact.filas.map(function (f) {
    return { ref: f.fila, orden: f.fila, hu: {
      t: fact.tab, c: String(g(f, 'contract')).trim(), b: String(g(f, 'bl')).trim(), k: String(g(f, 'booking')).trim(),
      f: String(g(f, 'invoice')).trim(), i: String(g(f, 'importer')).trim(),
      n: String(g(f, 'containers')).trim().slice(0, 60), q: normNum(g(f, 'tns')),
      d: isoDia(normFecha(g(f, 'etd'))), e: isoDia(normFecha(g(f, 'eta'))) } };
  });
}

/* --- Eventos -> hilos ------------------------------------------------------ */

function eventoDeFila(f, nroFila) {
  var g = function (i) { return f && f[i] !== undefined && f[i] !== null ? String(f[i]) : ''; };
  var hu = null;
  try { hu = g(12) ? JSON.parse(g(12)) : null; } catch (e) { hu = null; }
  var tipo = clave(g(10)) || (g(5) ? 'comentario' : '');
  if (!tipo) return null;
  var id = g(9) || ('leg' + nroFila);
  return {
    fecha: g(0), autor: g(1), tab: g(2), contrato: g(3), bl: g(4), texto: g(5), sobre: g(6),
    campo: g(7), hilo: g(8) || (tipo === 'comentario' ? id : ''), id: id, tipo: tipo, ref: g(11),
    huella: hu, ts: (hu && hu.ts) || msDeTextoCom(g(0)), legacy: !g(9)
  };
}

function armarHilos() {
  var por = {}, orden = [];
  S.eventosCom.forEach(function (ev) {
    var h = por[ev.hilo];
    var comDe = function () {
      return { id: ev.id, autor: ev.autor, texto: ev.texto, ts: ev.ts, fecha: ev.fecha, editado: false, eliminado: false };
    };
    if (ev.tipo === 'comentario') {
      if (h) return;
      h = por[ev.hilo] = {
        id: ev.hilo, campo: ev.campo || '', comentarios: [comDe()], resuelto: false, eliminado: false,
        legacy: !!ev.legacy, sobre: ev.sobre || '', creado: ev.ts,
        ancla: ev.huella || { t: ev.tab, c: ev.contrato, b: ev.bl },
        claveVieja: [clave(ev.tab), clave(ev.contrato), clave(ev.bl || '')].join('|')
      };
      orden.push(h);
    } else if (!h) {
      return;
    } else if (ev.tipo === 'respuesta') {
      h.comentarios.push(comDe());
    } else if (ev.tipo === 'editado') {
      var c1 = h.comentarios.filter(function (x) { return x.id === ev.ref; })[0];
      if (c1) { c1.texto = ev.texto; c1.editado = true; }
    } else if (ev.tipo === 'eliminado') {
      var c2 = h.comentarios.filter(function (x) { return x.id === ev.ref; })[0];
      if (c2) { c2.eliminado = true; if (c2 === h.comentarios[0]) h.eliminado = true; }
    } else if (ev.tipo === 'resuelto') {
      h.resuelto = true; h.resueltoPor = ev.autor; h.resueltoTs = ev.ts;
    } else if (ev.tipo === 'reabierto') {
      h.resuelto = false;
    }
    // La huella más nueva manda: así el hilo acompaña los cambios de la carga.
    if (h && ev.huella && ev.tipo !== 'comentario') { h.ancla = ev.huella; h.legacy = false; }
  });
  S.hilos = orden;
  resolverHilos();
}

function resolverHilos() {
  S.hilosPorCarga = {}; S.hilosPorFactura = {};
  var cargas = candidatasCargas(), facts = null;
  S.hilos.forEach(function (h) {
    h.embs = []; h.facts = [];
    if (h.eliminado) return;
    var propios = [];
    if (h.legacy) {
      // Comentarios de antes de la huella: se atan como siempre, por pestaña + contrato + BL.
      cargas.forEach(function (x) { if (claveComentario(x.ref) === h.claveVieja) propios.push(x.ref); });
    }
    if (!propios.length) {
      var m = mejorCandidata(h.ancla, cargas);
      if (m) propios = [m.ref];
    }
    if (propios.length) {
      h.embs = propios;
      propios.forEach(function (e) {
        (S.hilosPorCarga[e._id] = S.hilosPorCarga[e._id] || []).push(h);
        if (e._esFact) { h.facts = [e._fila]; (S.hilosPorFactura[e._fila] = S.hilosPorFactura[e._fila] || []).push(h); }
      });
      return;
    }
    // Ya no está entre las cargas en curso: puede haber pasado a «A facturar».
    if (!facts) facts = candidatasFactura();
    var mf = mejorCandidata(h.ancla, facts);
    if (mf) {
      h.facts = [mf.ref];
      (S.hilosPorFactura[mf.ref] = S.hilosPorFactura[mf.ref] || []).push(h);
    }
  });
}

// Lo que se ve: los hilos de una carga / de una celda, los abiertos y los resueltos.
function hilosDeCarga(emb) { return (S.hilosPorCarga[emb._id] || []).slice(); }
function hilosDeCelda(emb, campo) {
  return hilosDeCarga(emb).filter(function (h) { return h.campo === (campo || ''); });
}
function comentariosVisibles(h) { return h.comentarios.filter(function (c) { return !c.eliminado; }); }
// Cuántos comentarios hay pendientes de ver en una carga (los de hilos sin resolver).
function nComentariosAbiertos(emb) {
  return hilosDeCarga(emb).filter(function (h) { return !h.resuelto; })
    .reduce(function (a, h) { return a + comentariosVisibles(h).length; }, 0);
}
function comentariosDe(emb) {
  var out = [];
  hilosDeCarga(emb).filter(function (h) { return !h.resuelto; }).forEach(function (h) {
    comentariosVisibles(h).forEach(function (c) { out.push(c); });
  });
  return out.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
}

/* --- Leer y escribir la pestaña ------------------------------------------- */

async function cargarComentarios() {
  var antes = S.eventosCom.length;
  S.hojaComentarios = null; S.comColsOk = false;
  var evs = [];
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(sheetId,title))'));
    var hoja = (meta.sheets || []).filter(function (h) {
      return clave(h.properties.title) === clave(HOJA_COMENTARIOS);
    })[0];
    if (!hoja) { S.eventosCom = []; armarHilos(); return antes !== 0; }
    S.hojaComentarios = hoja.properties.title;

    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + S.hojaComentarios + "'!A1:M20000"));
    var filas = r.values || [];
    var enc = filas[0] || [];
    S.comColsOk = enc.length >= ENC_COMENTARIOS.length && clave(enc[7]) === 'campo';
    filas.slice(1).forEach(function (f, i) {
      var ev = eventoDeFila(f, i + 2);
      if (ev) evs.push(ev);
    });
  } catch (e) {
    // Sin comentarios no se cae la app: se queda con lo que ya tenía.
    return false;
  }
  var cambio = evs.length !== antes;
  S.eventosCom = evs;
  armarHilos();
  return cambio;
}

async function crearHojaComentarios() {
  try {
    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: [{ addSheet: { properties: { title: HOJA_COMENTARIOS } } }] })
    });
  } catch (e) {
    // Otra persona la creó justo antes: se sigue con la que ya existe.
    if (!/already exists|ya existe/i.test(e.message || '')) throw e;
  }
  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + HOJA_COMENTARIOS + "'!A1") + ':append?valueInputOption=USER_ENTERED', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [ENC_COMENTARIOS] })
  });
  S.hojaComentarios = HOJA_COMENTARIOS; S.comColsOk = true;
}

// La pestaña de antes tenía 7 columnas: se le agregan los encabezados nuevos, sin tocar lo que ya hay.
async function completarEncabezadosComentarios() {
  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + S.hojaComentarios + "'!H1:M1") + '?valueInputOption=RAW', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [ENC_COMENTARIOS.slice(7)] })
  });

}

// Agrega UNA fila a la pestaña (y la muestra enseguida, sin esperar la vuelta de Google).
// o = { tipo, hilo, campo, texto, ref, emb|fila (de qué carga), ancla }
async function publicarEvento(o) {
  var ts = Date.now(), id = idCom();
  var hu = o.emb ? huellaDe(o.emb) : (o.ancla || {});
  hu = Object.assign({}, hu, { ts: ts });
  if (o.emb) hu.o = ordinalDe(o.emb);
  var ev = {
    fecha: textoFechaCom(ts), autor: autorCom(), tab: hu.t || '', contrato: hu.c || '', bl: hu.b || '',
    texto: o.texto || '', sobre: '', campo: o.campo || '', hilo: o.hilo || id, id: id, tipo: o.tipo,
    ref: o.ref || '', huella: hu, ts: ts, legacy: false
  };
  S.eventosCom.push(ev); armarHilos();
  try {
    if (!S.hojaComentarios) await crearHojaComentarios();
    else if (!S.comColsOk) await completarEncabezadosComentarios();
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + S.hojaComentarios + "'!A1") +
      ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[ev.fecha, ev.autor, ev.tab, ev.contrato, ev.bl, ev.texto, ev.sobre,
        ev.campo, ev.hilo, ev.id, ev.tipo, ev.ref, JSON.stringify(hu)]] })
    });
    return ev;
  } catch (e) {
    // No se pudo guardar: se saca lo que se había mostrado y se avisa.
    S.eventosCom = S.eventosCom.filter(function (x) { return x !== ev; });
    armarHilos();
    S.error = 'No se pudo guardar el comentario: ' + e.message;
    return null;
  }
}

function hiloPorId(id) { return S.hilos.filter(function (h) { return h.id === id; })[0] || null; }
// De qué carga cuelga el hilo, para llevar su huella al escribir.
function destinoDeHilo(h) {
  if (h.embs && h.embs[0]) return { emb: h.embs[0] };
  return { ancla: h.ancla };
}

async function comNuevoHilo(destino, campo, texto) {
  texto = String(texto || '').trim();
  if (!texto) return null;
  S.comEnviando = true; pintar();
  var ev = await publicarEvento({ tipo: 'comentario', campo: campo || '', texto: texto,
    emb: destino.emb, ancla: destino.ancla });
  S.comEnviando = false; pintar();
  return ev;
}
async function comResponder(hiloId, texto) {
  texto = String(texto || '').trim();
  var h = hiloPorId(hiloId); if (!h || !texto) return null;
  S.comEnviando = true; pintar();
  var d = destinoDeHilo(h);
  var ev = await publicarEvento({ tipo: 'respuesta', hilo: hiloId, texto: texto, campo: h.campo, emb: d.emb, ancla: d.ancla });
  S.comEnviando = false; pintar();
  return ev;
}
async function comResolver(hiloId, reabrir) {
  var h = hiloPorId(hiloId); if (!h) return null;
  var d = destinoDeHilo(h);
  if (!reabrir) S.comVerRes = true;
  var ev = await publicarEvento({ tipo: reabrir ? 'reabierto' : 'resuelto', hilo: hiloId, campo: h.campo,
    texto: reabrir ? 'Reabrió el hilo' : 'Resolvió el hilo', emb: d.emb, ancla: d.ancla });
  pintar();
  return ev;
}
async function comEditar(hiloId, comId, texto) {
  texto = String(texto || '').trim();
  var h = hiloPorId(hiloId); if (!h || !texto) return null;
  var d = destinoDeHilo(h);
  var ev = await publicarEvento({ tipo: 'editado', hilo: hiloId, ref: comId, texto: texto, campo: h.campo, emb: d.emb, ancla: d.ancla });
  pintar();
  return ev;
}
async function comBorrar(hiloId, comId) {
  var h = hiloPorId(hiloId); if (!h) return null;
  var d = destinoDeHilo(h);
  var ev = await publicarEvento({ tipo: 'eliminado', hilo: hiloId, ref: comId, campo: h.campo, emb: d.emb, ancla: d.ancla });
  pintar();
  return ev;
}

// Lo de siempre: un comentario general sobre la carga, desde el panel.
async function comentar(id, texto, campo) {
  var emb = filaPorId(id);
  if (!emb) return;
  var ev = await comNuevoHilo({ emb: emb }, campo || '', texto);
  if (ev) delete S.comBorr['d-nuevo-' + id];
  return ev;
}

// Cada tanto se vuelve a mirar la pestaña: lo que escribió otra persona aparece solo.
var _sondeoCom = null;
function iniciarSondeoComentarios() {
  if (_sondeoCom) return;
  _sondeoCom = setInterval(async function () {
    if (document.visibilityState !== 'visible' || S.pantalla !== 'app' || !S.token || S.comEnviando || S.cargando) return;
    if (S.editCel) return;
    var cambio = await cargarComentarios();
    if (cambio) pintar();
  }, S.comSondeoMs || 45000);
}

// A qué apunta la ventanita abierta: sus hilos y cómo se llama.
function destinoDePop(P) {
  if (P.tipo === 'fact') {
    var fact = (S.fuentesFact || [])[0], f = fact && fact.filas.filter(function (x) { return x.fila === P.id; })[0];
    if (!f) return null;
    var g = function (c) { var i = fact.mapa[c]; return i === undefined || f.celdas[i] == null ? '' : String(f.celdas[i]); };
    return { hilos: (S.hilosPorFactura[P.id] || []).slice(), todos: true,
             linea: [g('importer'), g('contract')].filter(Boolean).join(' · '), destino: { ancla: huellaDeFilaFact(P.id) } };
  }
  var emb = filaPorId(P.id);
  if (!emb) return null;
  return { hilos: hilosDeCelda(emb, P.campo),
           linea: [emb.importer, emb.contract].filter(Boolean).join(' · '), destino: { emb: emb } };
}
function huellaDeFilaFact(fila) {
  var c = candidatasFactura().filter(function (x) { return x.ref === fila; })[0];
  return c ? c.hu : {};
}

function abrirComentarios(tipo, id, campo, nuevo) {

  if (nuevo || !vivos.length) S.comFoco = idTxtCom('p', 'n|' + tipo + '|' + id + '|' + (campo || ''));
