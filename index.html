  if (p.modo === 'partidas') {
    return p.partidas.slice().sort(function (a, b) { return mesKey(a) - mesKey(b); }).map(function (x) {
      return mesTxt(x) + (x.tn ? ' (' + fmtTnPer(x.tn) + ' tn)' : '');
    }).join(' + ');
  }
  if (p.modo === 'prompt') return 'Prompt';
  return p.texto || '';
}
// Lo que se escribe en cada columna de la planilla.
function periodoAColumnas(p) {
  var texto = periodoATexto(p);
  var c = { periodo: texto, perModo: '', perDesde: '', perHasta: '', perPartidas: '' };
  if (!texto || !p.modo) return { periodo: '', perModo: '', perDesde: '', perHasta: '', perPartidas: '' };
  c.perModo = PER_MODOS[p.modo] || '';
  if (p.modo === 'ventana') { c.perDesde = mesTxt(p.d); c.perHasta = mesTxt(p.h); }
  if (p.modo === 'partidas') {
    c.perPartidas = p.partidas.slice().sort(function (a, b) { return mesKey(a) - mesKey(b); }).map(function (x) {
      return mesTxt(x) + (x.tn ? ': ' + x.tn : '');
    }).join(' | ');
  }
  return c;
}

var TIPOS_CTR = [['mani', 'Maní'], ['aceite', 'Aceite'], ['expeller', 'Expeller'], ['otro', 'Otros / sin tipo']];
function tipoCtr(v) {
  var k = clave(v);
  if (k.indexOf('mani') === 0) return 'mani';
  if (k.indexOf('aceite') === 0 || k === 'oil') return 'aceite';
  if (k.indexOf('expeller') === 0) return 'expeller';
  return 'otro';
}

/* Abierto o cerrado lo dice la pestaña donde vive el contrato, no un campo. */
function esTabAbiertos(t) { var k = clave(t); return k.indexOf('abiert') >= 0 && k.indexOf('contrat') >= 0; }
function esTabCerrados(t) { var k = clave(t); return k.indexOf('cerrad') >= 0 && k.indexOf('contrat') >= 0; }

function estadoContrato(nombre) {
  var ref = S.ctrEditables && S.ctrEditables.get(String(nombre == null ? '' : nombre).trim());
  if (!ref) return '';
  var tabs = [ref.tab].concat((ref.otras || []).map(function (o) { return o.tab; }));
  if (tabs.some(esTabAbiertos)) return 'A';
  if (tabs.some(esTabCerrados)) return 'C';
  return '';
}

/* Si está cargada una sola de las dos pestañas (Abiertos o Cerrados), se suma
   la otra: hace falta conocer las dos para saber cuál es cuál y para poder
   pasar un contrato de una a la otra. */
async function tabsEditablesEfectivas() {
  var base = (S.cfg.tabsCtrEdit || []).slice();
  var abre = base.some(esTabAbiertos), cierra = base.some(esTabCerrados);
  S.hermanaAuto = null;
  if (abre !== cierra) {
    try {
      var lp = await listarPestanas(S.cfg.sheetId);
      var hermana = lp.pestanas.map(function (x) { return x.nombre; })
        .filter(abre ? esTabCerrados : esTabAbiertos)[0];
      if (hermana && base.indexOf(hermana) < 0) { base.push(hermana); S.hermanaAuto = hermana; }
    } catch (e) { /* sin la hermana, se sigue con lo configurado */ }
  }
  return base;
}

function esVerdadero(v) {
  if (v === true) return true;
  if (v === 1) return true;
  var t = String(v == null ? '' : v).trim().toLowerCase();
  return t === 'true' || t === 'verdadero' || t === 'sí' || t === 'si' || t === 'x';
}

function aValorSheets(v) {
  if (v === null || v === undefined || v === '') return { stringValue: '' };
  // Las casillas de verificación son booleanos: escribir "TRUE" como texto
  // rompería la casilla.
  if (typeof v === 'boolean') return { boolValue: v };
  if (typeof v === 'number') return { numberValue: v };
  if (v instanceof Date) return { numberValue: Math.floor((v - EPOCH) / DIA) };
  if (typeof v === 'string' && v.charAt(0) === '=') return { formulaValue: v };
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(v))) {
    var d = new Date(String(v) + 'T00:00:00Z');
    if (!isNaN(d)) return { numberValue: Math.floor((d - EPOCH) / DIA) };
  }
  return { stringValue: String(v) };
}

function pedidosDeCeldas(sheetId, fila, valores, colores) {
  var reqs = [];
  Object.keys(valores || {}).forEach(function (idx) {
    var c = +idx;
    reqs.push({ updateCells: {
      range: { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila, startColumnIndex: c, endColumnIndex: c + 1 },
      rows: [{ values: [{ userEnteredValue: aValorSheets(valores[idx]) }] }],
      fields: 'userEnteredValue' } });
  });
  Object.keys(colores || {}).forEach(function (idx) {
    var c = +idx;
    reqs.push({ repeatCell: {
      range: { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila, startColumnIndex: c, endColumnIndex: c + 1 },
      cell: { userEnteredFormat: { backgroundColor: typeof colores[idx] === 'object' ? colores[idx] : (COLORES[colores[idx]] || COLORES.vacio) } },
      fields: 'userEnteredFormat.backgroundColor' } });
  });
  return reqs;
}

function escribirCeldas(id, sheetId, fila, valores, colores) {
  var reqs = pedidosDeCeldas(sheetId, fila, valores, colores);
  if (!reqs.length) return Promise.resolve();
  return api(BASE + id + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: reqs })
  });
}

/* --- Listas de import_DB ---------------------------------------------------
   Los desplegables del alta salen de ahí: exportadores C3:C, importadores B3:B,
   productos D3:D y tipos E3:E5. Así no entran nombres nuevos escritos a mano,
   que es lo que rompe el cruce con los contratos.
   -------------------------------------------------------------------------- */

var TIPOS_FALLBACK = ['Maní', 'Aceite', 'Expeller', 'Birdfood'];

async function cargarListas() {
  S.listas = { exportadores: [], importadores: [], productos: [], tipos: [] };
  if (!S.cfg.tabDB) return;

  var limpiar = function (vals) {
    var out = [], vistos = {};
    (vals || []).forEach(function (v) {
      var t = v ? String(v).trim() : '';
      if (!t) return;
      var k = clave(t);
      if (vistos[k]) return;      // la lista tiene repetidos
      vistos[k] = 1; out.push(t);
    });
    return out.sort(function (a, b) { return a.localeCompare(b, 'es'); });
  };

  try {
    var q = "'" + S.cfg.tabDB.replace(/'/g, "''") + "'!";
    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent(q + 'A1:Z3000'));
    var filas = r.values || [];

    // Los títulos de las listas están en la fila 2 ("Clients", "Suppliers"…).
    var enc = filas[1] || [];
    var col = function (test) {
      for (var i = 0; i < enc.length; i++) {
        if (enc[i] && test(clave(enc[i]))) return i;
      }
      return -1;
    };

    var cCli = col(function (h) { return h.indexOf('client') >= 0 || h.indexOf('importador') >= 0; });
    var cPro = col(function (h) { return h.indexOf('supplier') >= 0 || h.indexOf('proveedor') >= 0 ||
                                          h.indexOf('exportador') >= 0; });
    var cPrd = col(function (h) { return h.indexOf('product') >= 0; });
    var cTip = col(function (h) { return h.indexOf('tipo') >= 0 || h.indexOf('type') >= 0; });

    var columna = function (i) {
      if (i < 0) return [];
      return filas.slice(2).map(function (f) { return f && f[i]; });
    };

    S.listas.importadores = limpiar(columna(cCli));
    S.listas.exportadores = limpiar(columna(cPro));
    S.listas.productos    = limpiar(columna(cPrd));
    S.listas.tipos        = limpiar(columna(cTip));
    if (!S.listas.tipos.length) S.listas.tipos = TIPOS_FALLBACK.slice();

  } catch (e) {
    S.listas.tipos = TIPOS_FALLBACK.slice();
  }
}

/* --- Alta de contratos -----------------------------------------------------
   La fila se inserta justo arriba de la que dice TOTAL en la columna A, para
   que quede dentro del bloque de datos. Las columnas calculadas (Total,
   Comisión, ENT, Saldo) se escriben como fórmula, iguales a las del resto.
   -------------------------------------------------------------------------- */

async function filaTotalDe(pestana) {
  var r = await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A1:A2000"));
  var vals = r.values || [];
  for (var i = 0; i < vals.length; i++) {
    var v = vals[i] && vals[i][0];
    if (v && String(v).trim().toUpperCase().indexOf('TOTAL') === 0) return i + 1;
  }
  return null;
}

// Qué contrato quedó justo arriba del TOTAL, para saber por dónde numerar.
async function ultimoContrato() {
  var pestana = S.cfg.tabAlta;
  if (!pestana) return null;
  var r = await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A1:B2000"));
  var vals = r.values || [];

  var iTotal = -1;
  for (var i = 0; i < vals.length; i++) {
    var a0 = vals[i] && vals[i][0];
    if (a0 && String(a0).trim().toUpperCase().indexOf('TOTAL') === 0) { iTotal = i; break; }
  }
  if (iTotal < 1) return null;

  // Hacia arriba hasta encontrar una fila con contrato.
  for (var j = iTotal - 1; j >= 1; j--) {
    var b = vals[j] && vals[j][1];
    if (b && String(b).trim()) {
      var ctr = String(b).trim();
      return { contrato: ctr, fila: j + 1, sugerido: siguienteNumero(ctr) };
    }
  }
  return null;
}

// LT099-2026 -> LT100-2026. Si el formato es otro, no inventa nada.
function siguienteNumero(ctr) {
  var m = String(ctr).match(/^(LT)\s*(\d+)\s*-\s*(\d{4})/i);
  if (!m) return '';
  var n = String(parseInt(m[2], 10) + 1);
  while (n.length < m[2].length) n = '0' + n;
  return m[1].toUpperCase() + n + '-' + m[3];
}

async function crearContrato(datos) {
  var pestana = S.cfg.tabAlta;
  if (!pestana) throw new Error('No hay una pestaña de alta configurada.');


  var meta = await api(BASE + S.cfg.sheetId +
    '?fields=' + encodeURIComponent('sheets(properties(sheetId,title))'));
  var hoja = (meta.sheets || []).filter(function (h) {
    return h.properties.title === pestana;
  })[0];
  if (!hoja) throw new Error('No existe la pestaña "' + pestana + '".');
  var sheetId = hoja.properties.sheetId;

  var filaTotal = await filaTotalDe(pestana);
  if (!filaTotal) {
    throw new Error('No encontré una fila que diga TOTAL en la columna A de "' +
      pestana + '". Sin eso no sé dónde insertar sin pisar nada.');
  }
  var destino = filaTotal;   // la nueva fila ocupa el lugar del TOTAL, que baja

  // 1) Insertar la fila, heredando el formato de la de arriba.
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{
        insertDimension: {
          range: { sheetId: sheetId, dimension: 'ROWS',
                   startIndex: destino - 1, endIndex: destino },
          inheritFromBefore: true
        }
      }]
    })
  });

  // 2) Escribir los valores. Las fórmulas replican las del resto de las filas.
  var n = destino;
  var sumifs =
    "=SUMIFS('Embarques maritimos'!G:G, 'Embarques maritimos'!C:C, B" + n +
    ", 'Embarques maritimos'!D:D, E" + n + ") + " +
    "SUMIFS('Cargas terrestres'!G:G, 'Cargas terrestres'!C:C, B" + n +
    ", 'Cargas terrestres'!D:D, E" + n + ") + " +
    "SUMIFS('A facturar'!G:G, 'A facturar'!C:C, B" + n +
    ", 'A facturar'!D:D, E" + n + ")";

  var fila = [
    datos.fecha,          // A Fecha
    datos.contrato,       // B
    datos.exportador,     // C
    datos.importador,     // D
    datos.producto,       // E
    datos.tipo,           // F
    datos.toneladas,      // G
    datos.precio,         // H
    '=H' + n + '*G' + n,  // I Total
    datos.packaging,      // J
    datos.incoterm,       // K
    datos.formaPago,      // L
    '=I' + n + '*0.02',   // M Comisión
    '',                   // N PAGOS USA
    sumifs,               // O ENT
    '=G' + n + '-O' + n,  // P Saldo
    // Con un apóstrofe al principio Sheets lo guarda como texto: «Octubre 2026» solo se convertía en una fecha.
    datos.periodo ? "'" + datos.periodo : ''   // Q
  ];

  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A" + n) +
    '?valueInputOption=USER_ENTERED', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [fila] })
  });

  // Las casillas de firma nacen vacías: un contrato recién cargado no está
  // firmado por nadie. Se escriben por posición detectada, no fija, porque
  // están a la derecha y pueden moverse.
  try {
    var enc = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A1:AZ1"));
    var cabe = (enc.values && enc.values[0]) || [];
    var mapaF = detectar(cabe, CAMPOS_CTR).mapa;
    var reqsF = [];
    if (datos.via && mapaF.via !== undefined) {
      reqsF.push({
        updateCells: {
          range: { sheetId: sheetId, startRowIndex: n - 1, endRowIndex: n,
                   startColumnIndex: mapaF.via, endColumnIndex: mapaF.via + 1 },
          rows: [{ values: [{ userEnteredValue: { stringValue: datos.via } }] }],
          fields: 'userEnteredValue'
        }
      });
    }
    ['firmaExp', 'firmaImp'].forEach(function (c) {
      if (mapaF[c] === undefined) return;
      reqsF.push({
        updateCells: {
          range: { sheetId: sheetId, startRowIndex: n - 1, endRowIndex: n,
                   startColumnIndex: mapaF[c], endColumnIndex: mapaF[c] + 1 },
          rows: [{ values: [{ userEnteredValue: { boolValue: false } }] }],
          fields: 'userEnteredValue'
        }
      });
    });
    ['perModo', 'perDesde', 'perHasta', 'perPartidas'].forEach(function (c) {      // la estructura del período, si la planilla tiene las columnas
      if (mapaF[c] === undefined || !datos[c]) return;
      reqsF.push({
        updateCells: {
          range: { sheetId: sheetId, startRowIndex: n - 1, endRowIndex: n,
                   startColumnIndex: mapaF[c], endColumnIndex: mapaF[c] + 1 },
          rows: [{ values: [{ userEnteredValue: { stringValue: String(datos[c]) } }] }],
          fields: 'userEnteredValue'
        }
      });
    });
    if (reqsF.length) {
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: reqsF })
      });
    }
  } catch (e) { /* si la pestaña no tiene esas columnas, no pasa nada */ }

  return n;
}

/* --- Shipment advice, armado acá -------------------------------------------
   El borrador se crea con la cuenta de quien aprieta el botón, en su propio
   Gmail. El Apps Script quedaba publicado como "ejecutar como yo", así que
   todos los borradores caían en la misma casilla.

   El texto es el mismo que el del script: si allá se cambia una frase, hay que
   cambiarla acá también. Es el precio de que cada uno use su cuenta.
   -------------------------------------------------------------------------- */

var ADV = {
  ccFijo: 'export@latinutsa.com',
  peter: 'p.kommene@bluewin.ch',
  umbralParcial: 15,        // saldo mayor a esto => cumplimiento parcial
  separador: ' / ',
  asuntoSiempreEnIngles: true
};

function unirLista(items, conector) {
  if (!items.length) return '';
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(', ') + ' ' + conector + ' ' + items[items.length - 1];
}

// Junta las filas elegidas en un solo advice y valida que sean del mismo
// embarque, igual que el script.
function datosAdvice(sel) {
  var f = function (d) { return esFecha(d) ? fmtFecha(d) : ''; };
  var base = sel[0];

  var errores = [];
  [['exporter', 'Exporter'], ['importer', 'Importer'], ['vessel', 'Vessel'],
   ['port', 'Port'], ['bl', 'BL']].forEach(function (c) {
    if (sel.some(function (o) { return clave(o[c[0]]) !== clave(base[c[0]]); })) {
      errores.push(c[1] + ' no coincide entre las filas');
    }
  });
  [['etd', 'ETD'], ['eta', 'ETA']].forEach(function (c) {
    var v = function (o) { return esFecha(o[c[0]]) ? o[c[0]].getTime() : String(o[c[0]] || ''); };
    if (sel.some(function (o) { return v(o) !== v(base); })) {
      errores.push(c[1] + ' no coincide entre las filas');
    }
  });
  if (errores.length) return { errores: errores };

  var goods = sel.map(function (o) {
    return (o.tns || '') + ' Tns ' + (o.product || '');
  }).join(ADV.separador);

  var contratos = [], vistos = {};
  sel.forEach(function (o) {
    var num = String(o.contract || '').trim() || '(sin contrato)';
    if (vistos[num]) return;
    vistos[num] = 1;
    var ctr = S.contratos.get(num);
    var saldo = ctr && ctr.saldo != null ? normNum(ctr.saldo) : null;
    if (saldo === null && ctr) saldo = ctr.saldoHoja;
    contratos.push({ num: num, parcial: (saldo || 0) > ADV.umbralParcial });
  });

  return {
    errores: [], exporter: base.exporter, importer: base.importer,
    etd: f(base.etd), eta: f(base.eta), port: base.port, vessel: base.vessel,
    bl: base.bl, goods: goods, contratos: contratos,
    emailTo: destinoAdvice(base).para
  };
}

function textosAdvice(d, idioma) {
  var es = (idioma === 'es');
  var varios = d.contratos.length > 1;
  var nums = d.contratos.map(function (c) { return c.num; }).join(', ');
  var todosIgual = d.contratos.every(function (c) { return c.parcial === d.contratos[0].parcial; });

  var estadoEn = function (c) { return c.parcial ? 'in part fulfillment' : 'in full fulfillment'; };
  var estadoEs = function (c) { return c.parcial ? 'en cumplimiento parcial' : 'en cumplimiento total'; };

  var refEn, refEs;
  if (!varios) {
    refEn = 'Re the above contract, we herewith tender ' + estadoEn(d.contratos[0]) + ':';
    refEs = 'En referencia al contrato mencionado, embarcamos ' + estadoEs(d.contratos[0]) + ':';
  } else if (todosIgual) {
    var cEn = d.contratos.length === 2 ? 'both contracts' : 'all contracts';
    var cEs = d.contratos.length === 2 ? 'ambos contratos' : 'todos los contratos';
    refEn = 'Re the above contracts, we herewith tender ' + estadoEn(d.contratos[0]) + ' of ' + cEn + ':';
    refEs = 'En referencia a los contratos mencionados, embarcamos ' + estadoEs(d.contratos[0]) + ' de ' + cEs + ':';
  } else {
    refEn = 'Re the above contracts, we herewith tender ' +
      unirLista(d.contratos.map(function (c) { return estadoEn(c) + ' of contract ' + c.num; }), 'and') + ':';
    refEs = 'En referencia a los contratos mencionados, embarcamos ' +
      unirLista(d.contratos.map(function (c) { return estadoEs(c) + ' del contrato ' + c.num; }), 'y') + ':';
  }

  // El número de contrato va antes del BL (si la carga no tiene contrato, no se pone nada).
  var conCtr = d.contratos.filter(function (c) { return c.num !== '(sin contrato)'; }).map(function (c) { return c.num; }).join(', ');
  var ctrEn = conCtr ? ' - ' + (varios ? 'Contracts: ' : 'Contract: ') + conCtr : '';
  var ctrEs = conCtr ? ' - ' + (varios ? 'Contratos: ' : 'Contrato: ') + conCtr : '';
  var asuntoEn = 'Shipment advice - ' + d.importer + ' - ' + d.exporter + ' - ' + d.goods +
    ' - ETD ' + d.etd + ' - ETA ' + d.eta + ctrEn + ' - BL: ' + d.bl;

  if (es) {
    return {
      subject: ADV.asuntoSiempreEnIngles ? asuntoEn
        : 'Aviso de embarque - ' + d.importer + ' - ' + d.exporter + ' - ' + d.goods +
          ' - ETD ' + d.etd + ' - ETA ' + d.eta + ctrEs + ' - BL: ' + d.bl,
      saludo: 'Estimados,',
      intro: 'Les informamos sobre el siguiente embarque de ' + d.exporter + ' a ' + d.importer,
      cabecera: [['Para', d.importer], [varios ? 'Contratos' : 'Contrato', nums]],
      referencia: refEs,
      campos: [['Buque', d.vessel], ['Puerto de descarga', d.port], ['ETD', d.etd],
               ['ETA', d.eta], ['Embarcador', d.exporter], ['Mercadería', d.goods]],
      adjunto: 'Adjunto encontrarán las fotos de los lotes y el draft del B/L de este embarque.',
      cierre: 'Por favor, confírmenlos.'
    };
  }
  return {
    subject: asuntoEn,
    saludo: 'Dear,',
    intro: 'Let me inform you about the following shipment from ' + d.exporter + ' to ' + d.importer,
    cabecera: [['To', d.importer], [varios ? 'Contracts' : 'Contract', nums]],
    referencia: refEn,
    campos: [['Vessel', d.vessel], ['P.O.D.', d.port], ['ETD', d.etd],
             ['ETA', d.eta], ['Shipper', d.exporter], ['Goods', d.goods]],
    adjunto: 'In the attachment you can check the picture of the lots and B/L Draft for this shipment',
    cierre: 'Please, confirm them!'
  };
}

function cuerpoPlano(t) {
  var bloque = function (pares) {
    return pares.map(function (p) { return p[0] + ': ' + p[1]; }).join('\n');
  };
  return t.saludo + '\n\n' + t.intro + '\n\n' + bloque(t.cabecera) + '\n\n' +
    t.referencia + '\n\n' + bloque(t.campos) + '\n\n' + t.adjunto + '\n\n' + t.cierre;
}

function cuerpoHtml(t, firma) {
  var bloque = function (pares) {
    return pares.map(function (p) {
      return '<b>' + esc(p[0]) + ':</b> ' + esc(p[1]);
    }).join('<br>');
  };
  return esc(t.saludo) + '<br><br>' + esc(t.intro) + '<br><br>' +
    bloque(t.cabecera) + '<br><br>' + esc(t.referencia) + '<br><br>' +
    bloque(t.campos) + '<br><br>' + esc(t.adjunto) + '<br><br>' + esc(t.cierre) +
    (firma ? '<br><br>' + firma : '');
}

// La firma que cada uno tiene puesta en su Gmail.
async function firmaDelUsuario() {
  try {
    var r = await api('https://gmail.googleapis.com/gmail/v1/users/me/settings/sendAs');
    var d = (r.sendAs || []).filter(function (x) { return x.isDefault; })[0];
    return (d && d.signature) || '';
  } catch (e) { return ''; }
}

// base64url con soporte de acentos.
function b64url(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function armarMime(para, cc, asunto, texto, html) {
  var lim = 'b' + Date.now();
  var enc = function (v) {
    // Asunto con acentos: se codifica para que no se rompa en ningún cliente.
    return /[^\x00-\x7F]/.test(v)
      ? '=?UTF-8?B?' + btoa(String.fromCharCode.apply(null,
          new TextEncoder().encode(v))) + '?=' : v;
  };
  return [
    'To: ' + para,
    cc ? 'Cc: ' + cc : '',
    'Subject: ' + enc(asunto),
    'MIME-Version: 1.0',
    'Content-Type: multipart/alternative; boundary="' + lim + '"',
    '',
    '--' + lim,
    'Content-Type: text/plain; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    btoa(String.fromCharCode.apply(null, new TextEncoder().encode(texto))),
    '',
    '--' + lim,
    'Content-Type: text/html; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    btoa(String.fromCharCode.apply(null, new TextEncoder().encode(html))),
    '',
    '--' + lim + '--'
  ].filter(function (l, i) { return l !== '' || i > 3; }).join('\r\n');
}

/* --- Alta de embarques -----------------------------------------------------
   Se agrega una fila al final de la pestaña elegida, escribiendo solo las
   columnas que esa pestaña tiene. Los contratos salen de los ya cargados, así
   el nuevo embarque queda atado a su contrato desde el principio.
   -------------------------------------------------------------------------- */

var CAMPOS_ALTA_EMB = [
  ['exporter', 'Exportador', 'combo-exp'],
  ['importer', 'Importador', 'combo-imp'],
  ['contract', 'Contrato', 'combo-ctr'],
  ['product', 'Producto', 'combo-prod'],
  ['tipo', 'Tipo', 'combo-tipo'],
  ['tns', 'Toneladas', 'number'],
  ['price', 'Precio USD/tn', 'number'],
  ['etd', 'ETD', 'date'],
  ['eta', 'ETA', 'date'],
  ['port', 'Destino', 'text'],
  ['vessel', 'Buque', 'text'],
  ['shippingLine', 'Naviera', 'text'],
  ['lots', 'Lotes', 'text'],
  ['containers', 'Contenedores', 'text'],
  ['booking', 'Booking', 'text'],
  ['incoterm', 'Incoterm', 'text'],
  ['mailsCC', 'Mails CC', 'text']
];

/* Las tres listas del alta se condicionan entre sí:
   - elegido el contrato, exportador, importador, producto, tipo y precio salen
     de él, que es lo que evita tipear lo que la planilla ya sabe;
   - elegidos exportador e importador, solo se ofrecen SUS contratos;
   - elegido el contrato, solo sus productos (el del contrato más los que ya se
     hayan embarcado contra él). */

/* El contrato no tiene columna de puerto, pero el incoterm lo lleva adentro:
   "CIF Qingdao" es incoterm + destino. Se separa por la lista de incoterms
   conocidos, no por "las tres primeras letras": si no, "Los Angeles" quedaría
   como "Angeles". */
var INCOTERMS = ['EXW','FCA','FAS','FOB','CFR','CIF','CPT','CIP','DAP','DPU',
                 'DDP','DAT','DES','DEQ','DAF','DDU','CNF'];

function partirIncoterm(txt) {
  var t = String(txt || '').trim();
  if (!t) return null;
  var m = t.match(/^([A-Za-z&]{3})[\s.\-]+(.+)$/);
  if (m && INCOTERMS.indexOf(m[1].toUpperCase()) >= 0) {
    return { codigo: m[1].toUpperCase(), lugar: m[2].trim() };
  }
  // Solo el código, sin lugar ("FAS").
  if (INCOTERMS.indexOf(t.toUpperCase()) >= 0) return { codigo: t.toUpperCase(), lugar: '' };
  // Sin código: es todo destino ("ANTWERP", "Puesto El Espinillal").
  return { codigo: '', lugar: t };
}

function contratosDe(exp, imp) {
  var out = [];
  var kExp = clave(exp), kImp = clave(imp);
  S.contratos.forEach(function (c, k) {
    if (kExp && clave(c.exportador) !== kExp) return;
    if (kImp && clave(c.importador) !== kImp) return;
    out.push(k);
  });
  // Primero los abiertos, después los cerrados (y al final los que no se sabe),
  // y dentro de cada grupo los más nuevos: es lo que se está cargando.
  var rango = { A: 0, C: 1, '': 2 };
  return out.sort(function (x, y) {
    return (rango[estadoContrato(x)] - rango[estadoContrato(y)]) ||
           y.localeCompare(x, 'es', { numeric: true });
  });
}

function productosDe(contrato) {
  if (!contrato) return null;
  var c = S.contratos.get(String(contrato).trim());
  var out = [], vistos = {};
  var sumar = function (p) {
    var t = String(p || '').trim();
    if (!t || vistos[clave(t)]) return;
    vistos[clave(t)] = 1; out.push(t);
  };
  if (c) sumar(c.producto);
  // Un contrato se parte en varios embarques, que pueden tener productos
  // distintos: se suman los ya usados.
  (S.datos.filas || []).forEach(function (o) {
    if (clave(o.contract) === clave(contrato)) sumar(o.product);
  });
  return out.length ? out : null;
}

// Al elegir un contrato se copia lo que ya sabe, sin pisar lo que se escribió.
function aplicarContrato(nombre) {
  var c = S.contratos.get(String(nombre).trim());
  if (!c) return;
  var a = S.altaEmb;
  if (!a.exporter && c.exportador) a.exporter = String(c.exportador).trim();
  if (!a.importer && c.importador) a.importer = String(c.importador).trim();
  if (!a.tipo && c.tipo) a.tipo = String(c.tipo).trim();
  if (!a.price && c.precio) a.price = c.precio;

  // El destino y el incoterm salen de la columna Incoterm del contrato.
  var inc = partirIncoterm(c.incoterm);
  if (inc) {
    if (!a.port && inc.lugar) a.port = inc.lugar;
    if (!a.incoterm && inc.codigo) a.incoterm = inc.codigo;
  }
  var prods = productosDe(nombre);
  if (!a.product && prods && prods.length === 1) a.product = prods[0];
  a._desdeContrato = true;
}

async function crearEmbarque() {
  var a = S.altaEmb;
  if (!a || !a.tab) return;
  var src = S.fuentes.filter(function (f) { return f.tab === a.tab; })[0];
  if (!src) { S.altaEmbError = 'No encuentro esa pestaña.'; return pintar(); }

  var req = ['exporter', 'importer', 'contract', 'product', 'tns'];
  var faltan = req.filter(function (c) { return !a[c] && src.mapa[c] !== undefined; });
  if (faltan.length) {
    S.altaEmbError = 'Falta: ' + faltan.map(function (c) { return CAMPOS[c].label; }).join(', ');
    return pintar();
  }

  S.creandoEmb = true; S.altaEmbError = null; pintar();
  try {
    // Va justo arriba de la fila TOTAL, para quedar dentro del bloque de datos
    // y que los totales la cuenten. Se relee la hoja: la posición cambia cada
    // vez que alguien agrega o reordena.
    var filaTotal = await filaTotalDe(a.tab);
    var fila;
    if (filaTotal) {
      fila = filaTotal;
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          requests: [{
            insertDimension: {
              range: { sheetId: src.sheetId, dimension: 'ROWS',
                       startIndex: fila - 1, endIndex: fila },
              inheritFromBefore: true
            }
          }]
        })
      });
    } else {
      // Sin fila TOTAL, al final de los datos.
      fila = (src.filas.length
        ? Math.max.apply(null, src.filas.map(function (f) { return f._fila; }))
        : 1) + 1;
    }

    var reqs = [];

    // El Total de la planilla es una fórmula (=Precio*Toneladas), no un número.
    // Se escribe la fórmula, no el resultado: así, cuando llega la factura y
    // las toneladas cambian, el total se recalcula solo.
    if (src.mapa.total !== undefined && src.mapa.price !== undefined &&
        src.mapa.tns !== undefined) {
      reqs.push({
        updateCells: {
          range: { sheetId: src.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: src.mapa.total, endColumnIndex: src.mapa.total + 1 },
          rows: [{ values: [{ userEnteredValue: { formulaValue:
            '=' + letraCol(src.mapa.price) + fila + '*' + letraCol(src.mapa.tns) + fila } }] }],
          fields: 'userEnteredValue'
        }
      });
    }

    CAMPOS_ALTA_EMB.forEach(function (c) {
      var campo = c[0];
      if (a[campo] === undefined || a[campo] === '') return;
      var idx = src.mapa[campo];
      if (idx === undefined) return;
      var val = a[campo];
      if (c[2] === 'number') val = parseFloat(val);
      if (c[2] === 'date') {
        var dv = normFecha(val);
        if (!esFecha(dv)) return;      // fecha ilegible: mejor no escribir nada
        val = dv;
      }
      reqs.push({
        updateCells: {
          range: { sheetId: src.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: idx, endColumnIndex: idx + 1 },
          rows: [{ values: [{ userEnteredValue: aValorSheets(val) }] }],
          fields: 'userEnteredValue'
        }
      });
    });

    // Los semáforos arrancan en rojo: nada está hecho todavía.
    SEMAFOROS.forEach(function (c) {
      var idx = src.mapa[c];
      if (idx === undefined || src.noAplica[c]) return;
      reqs.push({
        repeatCell: {
          range: { sheetId: src.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: idx, endColumnIndex: idx + 1 },
          cell: { userEnteredFormat: { backgroundColor: COLORES.pendiente } },
          fields: 'userEnteredFormat.backgroundColor'
        }
      });
    });

    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: reqs })
    });

    S.avisoOk = 'Carga agregada en "' + a.tab + '", fila ' + fila +
      (filaTotal ? ' (arriba del TOTAL)' : '') + '.';
    S.altaEmb = null;
    await cargarTodo();
  } catch (e) {
    S.altaEmbError = 'No se pudo guardar: ' + e.message;
  } finally {
    S.creandoEmb = false; pintar();
  }
}

function formAltaEmb() {
  var a = S.altaEmb;
  var src = S.fuentes.filter(function (f) { return f.tab === a.tab; })[0];
  if (!src) return '';
  var L = S.listas || {};
  var contratos = contratosDe(a.exporter, a.importer);

  var listaDe = {
    'combo-exp': L.exportadores || [],
    'combo-imp': L.importadores || [],
    'combo-ctr': contratos,
    'combo-prod': productosDe(a.contract) || L.productos || [],
    'combo-tipo': L.tipos || []
  };

  var campos = CAMPOS_ALTA_EMB.filter(function (c) {
    return src.mapa[c[0]] !== undefined && !src.noAplica[c[0]];
  }).map(function (c) {
    var campo = c[0], label = c[1], tipo = c[2], val = a[campo] || '';
    // Los obligatorios llevan un asterisco (son los que pide crearEmbarque).
    if (['exporter', 'importer', 'contract', 'product', 'tns'].indexOf(campo) >= 0) label += ' <span class="req" aria-hidden="true">*</span><span class="sr-solo"> (obligatorio)</span>';
    if (listaDe[tipo]) {
      var ops = listaDe[tipo];
      var ok = ops.some(function (o) { return clave(o) === clave(val); });
      // El contrato y el producto pueden ser nuevos; cliente y proveedor no.
      var libre = (tipo === 'combo-ctr' || tipo === 'combo-prod');
      return comboGen('e-' + campo, campo, label, ops, val, ok, 'emb', libre);
    }
    if (tipo === 'date') return campoFecha('e-' + campo, 'data-aemb', campo, label, val);
    return '<div class="campo"><label for="e-' + campo + '">' + label + '</label>' +
      '<input id="e-' + campo + '" data-aemb="' + campo + '" type="' +
      (tipo === 'number' ? 'number' : 'text') +
      '" value="' + esc(val) + '"></div>';
  }).join('');

  var pestanas = S.fuentes.map(function (f) {
    return '<button data-act="altaemb-tab" data-t="' + esc(f.tab) + '" aria-pressed="' +
      (a.tab === f.tab) + '">' + esc(nombreCorto(f.tab)) + '</button>';
  }).join('');

  return '<div class="alta">' +
    '<div class="alta-cab"><h3>Nueva carga</h3>' +
      '<button data-act="altaemb-cerrar">Cancelar</button></div>' +
    (S.altaEmbError ? '<div class="error">' + esc(S.altaEmbError) + '</div>' : '') +
    (S.fuentes.length > 1 ? '<div class="chips" style="margin-bottom:18px">' + pestanas + '</div>' : '') +
    (a.contract && S.contratos.get(String(a.contract).trim())
      ? '<p class="alta-nota">' + ico('check') + 'Datos tomados del contrato ' +
        esc(a.contract) + '. Se pueden cambiar.</p>'
      : (a.exporter || a.importer)
        ? '<p class="alta-nota tenue">' + contratos.length +
          (contratos.length === 1 ? ' contrato' : ' contratos') + ' de ' +
          esc([a.exporter, a.importer].filter(Boolean).join(' → ')) + '</p>'
        : '') +
    '<div class="alta-grid">' + campos + '</div>' +
    '<div class="alta-acc">' +
      '<button class="primario" data-act="altaemb-guardar"' +
        (S.creandoEmb ? ' disabled' : '') + '>' +
        (S.creandoEmb ? 'Guardando…' : ico('check') + 'Agregar carga') + '</button>' +
      '<span class="ayuda">Se inserta arriba de la fila TOTAL de «' + esc(a.tab) +
        '». Docs, Fotos y T.R. arrancan en rojo. Los campos con <span class="req">*</span> son obligatorios.</span>' +
    '</div></div>';
}

/* --- Pasar una carga a "A facturar" ----------------------------------------
   Es la mudanza que hoy se hace a mano con cortar y pegar: la fila sale de
   Marítimos o Terrestres y entra arriba del TOTAL en "A facturar".

   No se copia la fila cruda: los encabezados difieren entre pestañas
   ("Exporter" vs "Exportador", "Port" vs "Destino"), así que se pasa campo por
   campo usando el mapa de cada una. Si mañana alguien mueve una columna, sigue
   entrando donde corresponde.
   -------------------------------------------------------------------------- */

var AVISO_FACTURAR = 'pia@latinutsa.com';

/* Mover una fila de una pestaña a otra: lo mismo que cortar y pegar a mano.
   No se guarda ninguna copia: la fila se escribe en destino y se borra de
   origen, y para volverla se hace la operación inversa cuando uno quiera.

   Los semáforos viven en el color de la celda, y "A facturar" también tiene
   Docs, Fotos y T.R., así que los colores viajan con la fila. Sin eso el
   movimiento perdería el estado. */
var CAMPOS_MUDANZA = ['exporter', 'importer', 'contract', 'product', 'tipo',
  'price', 'tns', 'etd', 'anio', 'eta', 'port', 'vessel', 'shippingLine',
  'lots', 'containers', 'bl', 'booking', 'invoice', 'docs', 'pics', 'tr',
  'guia', 'commission', 'status', 'incoterm', 'mailsCC', 'pagoEstimado', 'nota'];

function resumenMudanza(emb) {
  var tn = normNum(emb.tns), pr = normNum(emb.price);
  return {
    quien: (emb.exporter || '') + ' → ' + (emb.importer || ''),
    contrato: emb.contract || '', bl: emb.bl || '',
    tns: tn, precio: pr, total: (tn && pr) ? tn * pr : normNum(emb.total),
    producto: emb.product || '', factura: emb.invoice || '',
    desde: emb._tab, fila: emb._fila
  };
}

/* El corazón: mueve una fila entre dos pestañas.
   `origen`  = { tab, sheetId, mapa, fila, celdas, colores }
   `destino` = nombre de la pestaña. */
/* Ubica la fila en la hoja tal como está AHORA. El número de fila que la app
   tenía guardado puede haber quedado viejo (alguien agregó o borró filas), y
   borrar por número podría llevarse otra carga. Se identifica por contrato, BL,
   cliente y toneladas. */
function ubicarFila(h, mapa, esp, nro) {
  var val = function (f, c) {
    var i = mapa[c]; return i === undefined || f.celdas[i] == null ? '' : f.celdas[i];
  };
  var mismo = function (f) {
    return clave(val(f, 'contract')) === clave(esp.contract) &&
           clave(val(f, 'bl')) === clave(esp.bl) &&
           clave(val(f, 'importer')) === clave(esp.importer) &&
           Math.abs((normNum(val(f, 'tns')) || 0) - (normNum(esp.tns) || 0)) < 0.0001;
  };
  var cand = h.filas.filter(mismo);
  var enSuLugar = cand.filter(function (f) { return f.fila === nro; })[0];
  if (enSuLugar) return enSuLugar;
  if (cand.length === 1) return cand[0];
  throw new Error(cand.length
    ? 'Hay ' + cand.length + ' cargas iguales y no sé cuál mover. Actualizá y probá de nuevo.'
    : 'Esa carga ya no está donde estaba: alguien la movió o la cambió. Actualizá y probá de nuevo.');
}

// ¿Sigue estando esta carga (contrato, BL, cliente y toneladas) en esa fila? Una sola lectura de esa fila.
async function ubicarFilaRapido(tab, mapa, esp, fila, salida) {
  try {
    var rango = "'" + tab.replace(/'/g, "''") + "'!A" + fila + ':' + letraCol(MAX_COLS - 1) + fila;
    var d = await api(BASE + S.cfg.sheetId + '/values/' + encodeURIComponent(rango) + '?valueRenderOption=UNFORMATTED_VALUE');
    var row = (d && d.values && d.values[0]) || [];
    if (salida) salida.row = row;      // lo que hay AHORA en la planilla: sirve para detectar si otra persona cambió una celda
    var val = function (c) { return mapa[c] === undefined || row[mapa[c]] == null ? '' : row[mapa[c]]; };
    return clave(val('contract')) === clave(esp.contract) && clave(val('bl')) === clave(esp.bl) &&
           clave(val('importer')) === clave(esp.importer) && Math.abs((normNum(val('tns')) || 0) - (normNum(esp.tns) || 0)) < 0.0001;
  } catch (e) { return false; }
}
// El origen de una mudanza: si la fila está donde la app cree (y nada la tocó), se usa lo ya leído; si no, se lee la hoja.
async function origenRapido(emb) {
  if (!emb._sucio && emb._celdas && await ubicarFilaRapido(emb._tab, fuenteDe(emb).mapa, emb, emb._fila)) {
    return { tab: emb._tab, sheetId: emb._sheetId, mapa: fuenteDe(emb).mapa, fila: emb._fila, celdas: emb._celdas, colores: emb._colores, filaVerificada: true };
  }
  var h = await leerHoja(S.cfg.sheetId, emb._tab);
  var mp = detectar(h.encabezados, CAMPOS).mapa;
  var fresca = ubicarFila(h, mp, emb, emb._fila);
  return { tab: emb._tab, sheetId: h.sheetId, mapa: mp, fila: fresca.fila, celdas: fresca.celdas, colores: fresca.colores };
}
// De arriba para abajo no se corren las filas de las que faltan: se procesan de la última a la primera.
function porFilaDesc(embs) {
  return embs.slice().sort(function (a, b) { return a._tab === b._tab ? b._fila - a._fila : (a._tab < b._tab ? -1 : 1); });
}

/* Mueve una fila de una pestaña a otra, EN TRES TIEMPOS y sin riesgo de perderla:
     1) se inserta el hueco en el destino (arriba del TOTAL) y se copian los campos, colores y el total;
     2) se VUELVE A LEER el destino y se comprueba que la carga está ahí, en esa fila;
     3) recién entonces se borra la fila del origen (releyéndola, por si alguien movió algo).
   Si la comprobación del paso 2 falla, NO se toca el origen: se deshace el hueco y se avisa.
   (Antes todo iba en un solo pedido, con el borrado al final: si la copia no quedaba en el destino,
   la fila se perdía igual — hubo que rescatarla del historial de versiones.) */
async function moverFila(origen, destinoTab, ctx) {
  var hd = (ctx && ctx.hd) || await leerHoja(S.cfg.sheetId, destinoTab);
  if (ctx) ctx.hd = hd;
  var mapaD = detectar(hd.encabezados, CAMPOS).mapa;

  var filaTotal = await filaTotalDe(destinoTab);
  var fila = filaTotal || (hd.filas.length
    ? Math.max.apply(null, hd.filas.map(function (f) { return f.fila; })) + 1
    : (hd.filaEncabezado || 1) + 1);

  var BLANCO = { red: 1, green: 1, blue: 1 };
  var rangoCelda = function (col) {
    return { sheetId: hd.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
             startColumnIndex: col, endColumnIndex: col + 1 };
  };
  var reqs = [{
    insertDimension: {
      range: { sheetId: hd.sheetId, dimension: 'ROWS', startIndex: fila - 1, endIndex: fila },
      inheritFromBefore: true
    }
  }];

  // Campo por campo, porque los encabezados no se llaman igual en las dos
  // pestañas ("Exporter" / "Exportador", "Port" / "Destino").
  CAMPOS_MUDANZA.forEach(function (campo) {
    var iO = origen.mapa[campo], iD = mapaD[campo];
    if (iO === undefined || iD === undefined) return;

    var v = origen.celdas[iO];
    if (v !== null && v !== undefined && v !== '' && !(v && v.invalida)) {
      reqs.push({ updateCells: {
        range: rangoCelda(iD),
        rows: [{ values: [{ userEnteredValue: aValorSheets(v) }] }],
        fields: 'userEnteredValue'
      } });
    }
    // El color, que en Docs, Fotos y T.R. ES el dato. Siempre se escribe (si
    // no tenía, blanco): si no, la fila nueva heredaría el color de la de arriba.
    var bg = origen.colores ? origen.colores[iO] : null;
    reqs.push({ repeatCell: {
      range: rangoCelda(iD),
      cell: { userEnteredFormat: { backgroundColor: bg
        ? { red: bg.red || 0, green: bg.green || 0, blue: bg.blue || 0 } : BLANCO } },
      fields: 'userEnteredFormat.backgroundColor'
    } });
  });

  // El Total, como fórmula.
  if (mapaD.total !== undefined && mapaD.price !== undefined && mapaD.tns !== undefined) {
    reqs.push({ updateCells: {
      range: rangoCelda(mapaD.total),
      rows: [{ values: [{ userEnteredValue: { formulaValue:
        '=' + letraCol(mapaD.price) + fila + '*' + letraCol(mapaD.tns) + fila } }] }],
      fields: 'userEnteredValue'
    } });
  }

  // Tiempo 1: copiar al destino. El origen todavía no se toca.
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: reqs })
  });

  // Tiempo 2: comprobar, leyendo de nuevo, que la carga está en el destino.
  var ident = identidadDeCeldas(origen.celdas, origen.mapa);
  var ultCol = letraCol(MAX_COLS - 1), pestD = "'" + destinoTab.replace(/'/g, "''") + "'";
  var chk = await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent(pestD + '!A' + fila + ':' + ultCol + (fila + 1)) + '?valueRenderOption=UNFORMATTED_VALUE');
  var leidas = (chk && chk.values) || [];
  var enDestino = leidas[0] || [], debajo = leidas[1] || [];
  var dv = function (campo) { var i = mapaD[campo]; return i === undefined || enDestino[i] == null ? '' : enDestino[i]; };
  var problemas = [];
  if (filaTotal && String(debajo[0] || '').trim().toUpperCase().indexOf('TOTAL') !== 0) {
    problemas.push('el TOTAL no quedó justo debajo');
  }
  if (ident.contract && clave(dv('contract')) !== clave(ident.contract)) problemas.push('el contrato no coincide');
  if (ident.importer && clave(dv('importer')) !== clave(ident.importer)) problemas.push('el cliente no coincide');
  if (ident.bl && clave(dv('bl')) !== clave(ident.bl)) problemas.push('el BL no coincide');
  if (ident.tns !== null && Math.abs((normNum(dv('tns')) || 0) - ident.tns) > 0.0001) problemas.push('las toneladas no coinciden');
  if (problemas.length) {
    // No se tocó el origen. Si el hueco quedó vacío, se lo saca para no dejar una fila en blanco.
    var vacio = !enDestino.some(function (x) { return x !== '' && x != null; });
    var limpio = false;
    if (vacio) {
      try {
        await api(BASE + S.cfg.sheetId + ':batchUpdate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: hd.sheetId, dimension: 'ROWS',
            startIndex: fila - 1, endIndex: fila } } }] })
        });
        limpio = true;
      } catch (e) { /* se avisa abajo */ }
    }
    throw new Error('No se movió nada: la carga no quedó bien en «' + destinoTab + '» (fila ' + fila + '): ' +
      problemas.join(', ') + '. Quedó en «' + origen.tab + '», sin tocar.' +
      (vacio && !limpio ? ' Ojo: puede haber quedado una fila vacía en «' + destinoTab + '».' : ''));
  }

  // Tiempo 3: ahora sí, sacar la de origen (releída, por si cambió algo en el medio).
  try {
    var filaO, sheetO;
    if (origen.filaVerificada && await ubicarFilaRapido(origen.tab, origen.mapa, ident, origen.fila)) {
      filaO = { fila: origen.fila }; sheetO = origen.sheetId;
    } else {
      var ho = await leerHoja(S.cfg.sheetId, origen.tab);
      var mo = detectar(ho.encabezados, CAMPOS).mapa;
      filaO = ubicarFila(ho, mo, ident, origen.fila); sheetO = ho.sheetId;
    }
    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: sheetO, dimension: 'ROWS',
        startIndex: filaO.fila - 1, endIndex: filaO.fila } } }] })
    });
  } catch (e) {
    throw new Error('La carga YA está en «' + destinoTab + '» (fila ' + fila + ') pero no se pudo borrar de «' +
      origen.tab + '»: ' + e.message + ' Borrala a mano de «' + origen.tab + '» para que no quede duplicada.');
  }

  return { tab: destinoTab, fila: fila };
}

// Lo que identifica a una carga, a partir de las celdas de su fila.
function identidadDeCeldas(celdas, mapa) {
  var v = function (c) { var i = mapa[c]; return i === undefined || celdas[i] == null ? '' : celdas[i]; };
  var tn = normNum(v('tns'));
  return { contract: v('contract'), bl: v('bl'), importer: v('importer'), tns: tn === undefined ? null : tn };
}

async function pasarAFacturar(id, avisar, enviar) {
  var emb = filaPorId(id);
  if (!emb) return;
  if (pendDeFila(id)) {
    var okG = await asegurarGuardado();
    if (!okG || pendDeFila(id)) {
      S.factError = 'No se pudieron guardar los cambios de esa carga, así que no la pasé. Probá de nuevo.';
      toast('No se pudieron guardar los cambios de esa carga', 'error');
      return pintar();
    }
  }
  var destino = (S.fuentesFact || [])[0];
  if (!destino) { S.factError = 'No hay ninguna pestaña de "A facturar" configurada.'; return pintar(); }

  S.pasando = id; S.factError = null; pintar();
  try {
    var res = resumenMudanza(emb);
    // La fila se relee justo antes de tocar nada.
    var movida = await moverFila(await origenRapido(emb), destino.tab);

    var aviso = '';
    if (avisar) {
      try { aviso = await avisarFacturar(res, destino.tab, enviar); }
      catch (e2) { aviso = ' El mail no salió: ' + e2.message; }
    }

    S.avisoOk = 'Pasada a "' + destino.tab + '" (fila ' + movida.fila + ') y quitada de "' + res.desde + '".' + aviso;
    S.ultimoMov = { desde: res.desde, quien: res.quien, contrato: res.contrato, bl: res.bl };
    histRegistrar({ tipo: 'facturar', desde: res.desde, hacia: destino.tab, items: [{ ident: identidadDe(emb), quien: res.quien }] });
    S.sel = null; S.pasar = null;
    await cargarTodo(true);
    toast('Enviada a «' + destino.tab + '», fila ' + movida.fila + ': ' + (res.contrato || res.quien), 'ok', 8000, { texto: 'Deshacer', fn: function () { deshacer(); } });
  } catch (e) {
    S.factError = 'No se pudo pasar: ' + e.message;
    toast('No se pudo enviar a facturar', 'error');
  } finally {
    S.pasando = null; pintar();
  }
}

// La vuelta: la misma operación, al revés. Se puede hacer cuando sea.
async function devolverDeFacturar(nroFila, destinoTab) {
  var fact = (S.fuentesFact || [])[0];
  if (!fact) return;
  S.pasando = 'f' + nroFila; S.factError = null; pintar();
  try {
    // Se relee: la fila pudo haberse movido desde la última carga.
    var hf = await leerHoja(S.cfg.sheetId, fact.tab);
    var mapaF = detectar(hf.encabezados, CAMPOS).mapa;
    // Lo que la app cree que hay en esa fila; se compara con lo que hay de verdad.
    var vieja = fact.filas.filter(function (f) { return f.fila === nroFila; })[0];
    if (!vieja) throw new Error('Esa fila ya no está donde estaba. Actualizá y probá de nuevo.');
    var gv = function (c) { return fact.mapa[c] === undefined ? '' : (vieja.celdas[fact.mapa[c]] == null ? '' : vieja.celdas[fact.mapa[c]]); };
    var cruda = ubicarFila(hf, mapaF, { contract: gv('contract'), bl: gv('bl'), importer: gv('importer'), tns: gv('tns') }, nroFila);

    await moverFila({
      tab: fact.tab, sheetId: hf.sheetId, mapa: mapaF,
      fila: cruda.fila, celdas: cruda.celdas, colores: cruda.colores
    }, destinoTab);

    S.avisoOk = 'Devuelta a "' + destinoTab + '".';
    S.ultimoMov = null;
    await cargarTodo(true);
    toast('Devuelta a «' + destinoTab + '»', 'ok');
  } catch (e) {
    S.factError = 'No se pudo devolver: ' + e.message;
    toast('No se pudo devolver la carga', 'error');
  } finally {
    S.pasando = null; pintar();
  }
}

// Aviso a quien factura. Por defecto queda como borrador: el mail sale cuando
// la persona lo decide, no por apretar un botón de la app.
async function avisarFacturar(res, tabDestino, enviar) {
  var asunto = 'A facturar: ' + res.quien + ' — ' + res.contrato +
    (res.bl ? ' — BL ' + res.bl : '');

  var lineas = [
    'Se pasó a "' + tabDestino + '" el siguiente embarque:',
    '',
    'Exportador y cliente: ' + res.quien,
    'Contrato: ' + res.contrato,
    'Producto: ' + res.producto,
    'Toneladas: ' + (res.tns ? fmtNum(res.tns) : '—'),
    'Precio: ' + (res.precio ? 'USD ' + fmtNum(res.precio) + '/tn' : '—'),
    'Total: ' + (res.total ? 'USD ' + fmtNum(res.total) : '—'),
    res.bl ? 'BL: ' + res.bl : '',
    res.factura ? 'Factura: ' + res.factura : '',
    '',
    'Venía de "' + res.desde + '".',
    'Lo pasó ' + (S.usuario ? S.usuario.email : 'alguien') + ' desde el control de embarques.'
  ];

  var texto = lineas.join('\n');
  var html = lineas.map(function (l) { return l === '' ? '<br>' : esc(l); }).join('<br>');

  var firma = await firmaDelUsuario();
  var mime = armarMime(AVISO_FACTURAR, '', asunto, texto,
                       html + (firma ? '<br><br>' + firma : ''));

  if (enviar) {
    await api('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw: b64url(mime) })
    });
    return ' Aviso enviado a ' + AVISO_FACTURAR + '.';
  }
  await api('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: { raw: b64url(mime) } })
  });
  return ' Borrador del aviso a ' + AVISO_FACTURAR + ' listo en tu Gmail.';
}

// De dónde vino, para proponer el destino: si tiene BL o contenedores es
// marítima; si no, terrestre.
function tabProbable(o) {
  var tabs = (S.fuentes || []).map(function (f) { return f.tab; });
  if (!tabs.length) return '';
  var maritima = !!(o.bl || o.containers || o.vessel);
  var buscar = maritima ? 'mariti' : 'terrestre';
  return tabs.filter(function (t) { return clave(t).indexOf(buscar) >= 0; })[0] || tabs[0];
}

var LS_PLANTILLA = 'embarques:plantilla';

function plantillaContrato() {
  var b64 = null;
  try { b64 = localStorage.getItem(LS_PLANTILLA); } catch (e) {}
  b64 = b64 || PLANTILLA_CONTRATO_B64;
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// --- Motor: completa la plantilla (el mismo que se probó por separado) -----
  function escXmlDoc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Encuentra el elemento de bloque (<w:tr> o <w:p>) que contiene una posición.
  function envolvente(xml, pos, etiqueta) {
    var abre1 = xml.lastIndexOf('<' + etiqueta + ' ', pos);
    var abre2 = xml.lastIndexOf('<' + etiqueta + '>', pos);
    var ini = Math.max(abre1, abre2);
    var cierre = '</' + etiqueta + '>';
    var fin = xml.indexOf(cierre, pos) + cierre.length;
    return { ini: ini, fin: fin, txt: xml.slice(ini, fin) };
  }

  // Repite el bloque que contiene {{marca}} una vez por elemento de la lista.
  function repetir(xml, marca, etiqueta, lista, relleno) {
    var i = xml.indexOf('{{' + marca + '}}');
    if (i < 0) return xml;
    var b = envolvente(xml, i, etiqueta);
    var copias = (lista || []).map(function (item) { return relleno(b.txt, item); });
    return xml.slice(0, b.ini) + copias.join('') + xml.slice(b.fin);
  }

  function reemplazar(txt, datos) {
    return txt.replace(/\{\{(\w+)\}\}/g, function (_, k) {
      return escXmlDoc(datos[k] == null ? '' : datos[k]);
    });
  }

  // Si un dato opcional está vacío, se va el párrafo entero: mejor que dejar
  // un "VAT Nr:" colgando sin número.
  function quitarVacios(xml, datos, opcionales) {
    opcionales.forEach(function (k) {
      if (datos[k] && String(datos[k]).trim()) return;
      var i;
      while ((i = xml.indexOf('{{' + k + '}}')) >= 0) {
        var b = envolvente(xml, i, 'w:p');
        xml = xml.slice(0, b.ini) + xml.slice(b.fin);
      }
    });
    return xml;
  }

  var OPCIONALES = ['buyer_vat', 'buyer_contacto', 'buyer_email',
                    'seller_contacto', 'seller_email',
                    'cons_taxid', 'notif_taxid'];

  /* datos: {
       contrato, fecha_larga, buyer_*, seller_*, cons_*, notif_*,
       origen, packing, incoterm, pago, embarque,
       productos: [{ producto, cantidad, precio, total }],
       total_contrato, cantidad_total,
       docs_izq: [...], docs_der: [...]
     } */
  async function completar(JSZip, plantilla, datos) {
    var zip = await JSZip.loadAsync(plantilla);
    var xml = await zip.file('word/document.xml').async('string');

    xml = repetir(xml, 'p_producto', 'w:tr', datos.productos, function (fila, p) {
      return reemplazar(fila, {
        p_producto: p.producto, p_cantidad: p.cantidad,
        p_precio: p.precio, p_total: p.total
      });
    });
    xml = repetir(xml, 'doc_izq', 'w:p', datos.docs_izq, function (par, d) {
      return reemplazar(par, { doc_izq: d });
    });
    xml = repetir(xml, 'doc_der', 'w:p', datos.docs_der, function (par, d) {
      return reemplazar(par, { doc_der: d });
    });

    xml = quitarVacios(xml, datos, OPCIONALES);
    xml = reemplazar(xml, datos);
    zip.file('word/document.xml', xml);

    // Los mails son hipervínculos: el destino también lleva el marcador.
    var rp = 'word/_rels/document.xml.rels';
    var rels = await zip.file(rp).async('string');
    rels = rels.replace(/\{\{(\w+)\}\}/g, function (_, k) { return escXmlDoc(datos[k] || ''); });
    zip.file(rp, rels);

    return zip;
  }

  // --- Formatos -------------------------------------------------------------

  var MESES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
               'August', 'September', 'October', 'November', 'December'];

  // 7 -> "7th", 1 -> "1st", 22 -> "22nd", 11/12/13 -> "th".
  function ordinal(n) {
    var r10 = n % 10, r100 = n % 100;
    if (r100 >= 11 && r100 <= 13) return n + 'th';
    return n + (r10 === 1 ? 'st' : r10 === 2 ? 'nd' : r10 === 3 ? 'rd' : 'th');
  }

  function fechaLarga(d) {
    return MESES[d.getUTCMonth()] + ' ' + ordinal(d.getUTCDate()) + ', ' + d.getUTCFullYear();
  }

  // 39375 -> "39,375" (formato inglés, como en la plantilla).
  function miles(n, dec) {
    var v = Number(n);
    if (!isFinite(v)) return '';
    return v.toLocaleString('en-US', {
      minimumFractionDigits: dec || 0, maximumFractionDigits: dec == null ? 2 : dec
    });
  }



/* --- Base de empresas -------------------------------------------------------
   Los datos de cada empresa para el contrato: dirección, VAT, contacto, mail.
   Hoy están dispersos, así que la base se arma de a poco: la primera vez que
   se genera un contrato para una empresa se completan sus datos, y quedan
   guardados para la próxima. Vive en una pestaña "Empresas" de la planilla.
   -------------------------------------------------------------------------- */

var HOJA_EMPRESAS = 'Empresas';
var ENC_EMPRESAS = ['Empresa', 'Dirección', 'VAT / Tax ID', 'Contacto', 'Email', 'País'];

async function cargarEmpresas() {
  S.empresas = new Map();
  S.hayHojaEmpresas = false;
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    S.hayHojaEmpresas = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(HOJA_EMPRESAS);
    });
    if (!S.hayHojaEmpresas) return;
    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_EMPRESAS + "'!A1:F3000"));
    var filas = r.values || [];
    filas.slice(1).forEach(function (f, i) {
      var nom = String(f[0] || '').trim();
      if (!nom) return;
      S.empresas.set(clave(nom), {
        nombre: nom, direccion: f[1] || '', vat: f[2] || '',
        contacto: f[3] || '', email: f[4] || '', pais: f[5] || '',
        fila: i + 2
      });
    });
  } catch (e) { /* sin base, los campos se llenan a mano */ }
}

// Crea la pestaña con los nombres que ya están en la base de datos, así solo
// falta completar los datos y no tipear las 500 empresas.
async function crearHojaEmpresas() {
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: [{ addSheet: { properties: {
      title: HOJA_EMPRESAS, gridProperties: { frozenRowCount: 1 } } } }] })
  });
  var L = S.listas || {};
  var nombres = [], vistos = {};
  (L.exportadores || []).concat(L.importadores || []).forEach(function (n) {
    var k = clave(n);
    if (!k || vistos[k]) return;
    vistos[k] = 1; nombres.push(n);
  });
  nombres.sort(function (a, b) { return a.localeCompare(b, 'es'); });
  var valores = [ENC_EMPRESAS].concat(nombres.map(function (n) {
    var cod = paisDeEmpresa(n);
    var pais = cod && PAISES[cod] ? PAISES[cod].split(' ').slice(1).join(' ') : '';
    return [n, '', '', '', '', pais];
  }));
  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + HOJA_EMPRESAS + "'!A1") + '?valueInputOption=RAW', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: valores })
  });
  await cargarEmpresas();
  return nombres.length;
}

// Guarda los datos de una empresa: actualiza su fila o agrega una nueva.
async function guardarEmpresa(e) {
  if (!S.hayHojaEmpresas) await crearHojaEmpresas();
  var fila = [e.nombre, e.direccion || '', e.vat || '', e.contacto || '', e.email || '', e.pais || ''];
  var ya = S.empresas.get(clave(e.nombre));
  if (ya) {
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_EMPRESAS + "'!A" + ya.fila) + '?valueInputOption=RAW', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [fila] })
    });
  } else {
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_EMPRESAS + "'!A1") +
      ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [fila] })
    });
  }
  await cargarEmpresas();
}

// La ficha de la base de datos (Database_old para clientes, Database suppliers para proveedores). Si el nombre no es
// idéntico, se acepta una coincidencia única que lo contenga (p. ej. «Alrisha SAGL» y «Alrisha SAGL (Suiza)»).
function fichaDB(nombre) {
  var k = clave(nombre);
  if (!k || !S.fichasDB) return null;
  var f = S.fichasDB.get(k);
  if (f) return f;
  if (k.length < 5) return null;
  var cand = [];
  S.fichasDB.forEach(function (v, kk) { if (kk.indexOf(k) === 0 || k.indexOf(kk) === 0) cand.push(v); });
  return cand.length === 1 ? cand[0] : null;
}
function datosEmpresa(nombre) {

/* --- Generador del contrato -------------------------------------------------
   Casi todo sale del contrato que ya está cargado: número, partes, productos,
   precios, incoterm, pago, embarque, packing. Lo que falta —los datos de cada
   empresa— sale de la base, y si no está se completa acá y se guarda.

var DOCS_ESTANDAR = [
  'Commercial Invoice',
  '3/3 Bill of Lading and/or telex release. Shipper/seller guarantees (a minimum) of 14 days free from demurrage, detention, quay-rent, etc. at port of destination',
  'Packing List (stating gross and netweight, container number and lot number, goods description to be equal to the sales contract)',
  'Phytosanitary Certificate',
  'Certificate of Weight',
  'Quality Certificate',
  'Certificate of Aflatoxin Sampling (B1, B2, G1, G2) per EU Directive',
  'Certificate of Cleanliness & Condition of Container',

  'Certificate of Origin'

/* Incoterms 2020 y el seguro. Solo CIF y CIP obligan al vendedor a contratar el seguro (a nombre/por cuenta del comprador);
   en los demás el seguro, si lo hay, corre por cuenta de quien lleva el riesgo. Por eso con CIF/CIP el certificado de
   seguro entra solo entre los documentos requeridos. */
var INCOTERMS = ['EXW', 'FCA', 'FAS', 'FOB', 'CFR', 'CIF', 'CPT', 'CIP', 'DAP', 'DPU', 'DDP'];
var SEGURO_INCOTERM = {
  CIF: 'Insurance Certificate (Institute Cargo Clauses (C) or equivalent), covering 110% of the invoice value',
  CIP: 'Insurance Certificate (Institute Cargo Clauses (A) or equivalent), covering 110% of the invoice value'
};
function notaIncoterm(cod) {
  if (cod === 'CIF') return 'CIF: el seller contrata y paga el seguro (mínimo cláusulas ICC (C), 110% del valor). Se agregó el certificado de seguro a los documentos.';
  if (cod === 'CIP') return 'CIP: el seller contrata y paga el seguro (cobertura ICC (A), 110% del valor). Se agregó el certificado de seguro a los documentos.';
  if (cod === 'CFR' || cod === 'FOB' || cod === 'FAS' || cod === 'FCA' || cod === 'EXW' || cod === 'CPT') return cod + ': el seguro no es obligación del seller (corre por cuenta del buyer), no se agrega.';
  if (cod === 'DAP' || cod === 'DPU' || cod === 'DDP') return cod + ': el riesgo es del seller hasta destino pero el término no obliga a asegurar; si hace falta, agregalo a mano abajo.';
  return '';
}
function partirIncoterm(txt) {
  var m = String(txt || '').trim().match(/^([A-Za-z]{3})\b\s*(.*)$/);
  if (m && INCOTERMS.indexOf(m[1].toUpperCase()) >= 0) return { cod: m[1].toUpperCase(), lugar: m[2].trim() };
  return { cod: '', lugar: String(txt || '').trim() };
}
function unirIncoterm(cod, lugar) { return [cod, String(lugar || '').trim()].filter(Boolean).join(' '); }
// Con CIF/CIP el certificado de seguro es un documento requerido más: se agrega solo (tildado) y se saca si se cambia a otro término.
function ajustarSeguroGen() {
  var G = S.gen;
  if (!G) return;
  var txt = SEGURO_INCOTERM[G.incCod] || '';
  var i = -1;
  G.docs.forEach(function (d, k) { if (d.auto === 'seguro') i = k; });
  if (!txt) { if (i >= 0) G.docs.splice(i, 1); return; }
  if (i >= 0) { G.docs[i].t = txt; return; }
  var despues = -1;
  G.docs.forEach(function (d, k) { if (/^Packing List/i.test(d.t)) despues = k; });
  G.docs.splice(despues >= 0 ? despues + 1 : G.docs.length, 0, { t: txt, on: true, auto: 'seguro' });
}

function abrirGenerador(nombre) {
  var ref = S.ctrEditables.get(nombre);
  var ctr = S.contratos.get(nombre) || {};
  var filas = ref ? filasDelContrato(ref) : [];
  var g = function (fr, campo) {
    var i = fr.mapa[campo];
    var v = i === undefined ? '' : fr.celdas[i];
    return v === null || v === undefined ? '' : v;
  };
  var base = filas[0];
  var dato = function (campo, deCtr) {
    if (base) { var v = g(base, campo); if (v !== '') return v; }
    return ctr[deCtr || campo] || '';
  };

  var hoy = new Date();
  var anio = hoy.getFullYear();
  var incRaw = String(dato('incoterm') || '').trim(), incP = partirIncoterm(incRaw);
  var incoterm = incP.cod ? unirIncoterm(incP.cod, incP.lugar) : incRaw;   // el término en mayúsculas; el puerto como está escrito

  // Una línea por producto: justamente las filas del contrato.
  var productos = (filas.length ? filas : [null]).map(function (fr) {
    var prod = fr ? g(fr, 'producto') : (ctr.producto || '');
    return {
      desc: String(prod || '').trim() + (prod ? ' – Crop ' + anio : ''),
      tns: normNum(fr ? g(fr, 'tns') : ctr.tns) || '',
      precio: normNum(fr ? g(fr, 'precio') : ctr.precio) || ''
    };
  });

  var exp = String(dato('exportador') || '').trim();
  var imp = String(dato('importador') || '').trim();
  var codOrigen = paisDeEmpresa(exp);

  S.gen = {
    contrato: nombre,
    fecha: String(hoy.getDate()).padStart(2, '0') + '/' +
           String(hoy.getMonth() + 1).padStart(2, '0') + '/' + anio,
    buyer: datosEmpresa(imp),
    seller: datosEmpresa(exp),
    consModo: 'buyer', cons: datosEmpresa(''),
    notifModo: 'buyer', notif: datosEmpresa(''),
    productos: productos,
    incoterm: incoterm,
    packing: String(base ? g(base, 'packaging') : '').trim(),
    pago: String(dato('formaPago') || '').trim(),
    embarque: String(dato('periodo') || '').trim(),
    origen: PAIS_EN[codOrigen] || (codOrigen && PAISES[codOrigen]
      ? PAISES[codOrigen].split(' ').slice(1).join(' ') : 'Argentina'),
    docs: DOCS_ESTANDAR.map(function (t) { return { t: t, on: true }; })
      .concat(DOCS_OPCIONALES.map(function (t) { return { t: t, on: false, opc: true }; })),
    paso: 1,
    docsExtra: '',
    incCod: partirIncoterm(incoterm).cod, incLug: partirIncoterm(incoterm).lugar,
    guardarBase: true,
    estado: null, error: null
  };
  ajustarSeguroGen();
  var activo = document.activeElement;
  S.gen.volverA = activo && activo.getAttribute && activo.getAttribute('data-act')
    ? { act: activo.getAttribute('data-act'), k: activo.getAttribute('data-k') } : null;
  S.gen.snap = snapGen(S.gen);
  S.gen.focoPendiente = true;
  S.animarPanel = true;
}

// Lo que el motor necesita, a partir del formulario.
function datosDelGenerador(G) {
  var d = normFecha(G.fecha);
  var lineas = G.productos.filter(function (p) { return p.desc || p.tns || p.precio; });
  var total = lineas.reduce(function (a, p) { return a + totalLinea(p); }, 0);

  var docs = G.docs.filter(function (x) { return x.on && String(x.t).trim(); })
                   .map(function (x) { return String(x.t).trim(); });

  String(G.docsExtra || '').split(/\r?\n/).forEach(function (l) { l = l.replace(/\s+/g, ' ').trim(); if (l) docs.push(l); });
  var mitad = Math.ceil(docs.length / 2);
  var cons = G.consModo === 'buyer' ? G.buyer : G.cons;
  var notif = G.notifModo === 'buyer' ? G.buyer : (G.notifModo === 'cons' ? cons : G.notif);

  return {
    contrato: G.contrato,
    fecha_larga: esFecha(d) ? fechaLarga(d) : G.fecha,
    buyer_empresa: G.buyer.nombre, buyer_direccion: G.buyer.direccion,

    seller_empresa: G.seller.nombre, seller_direccion: G.seller.direccion, seller_vat: G.seller.vat,
    seller_contacto: G.seller.contacto, seller_email: G.seller.email,
    cons_empresa: cons.nombre, cons_taxid: cons.vat, cons_direccion: cons.direccion,
    notif_empresa: notif.nombre, notif_taxid: notif.vat, notif_direccion: notif.direccion,
    productos: lineas.map(function (p) {
      return { producto: p.desc, cantidad: miles(p.tns) + ' MT',
               precio: miles(p.precio) + ' USD/MT ' + G.incoterm,
               total: 'USD ' + miles(totalLinea(p)) };
    }),
    total_contrato: 'USD ' + miles(total),
    cantidad_total: miles(cant) + ' MT',
    origen: G.origen, packing: G.packing, incoterm: G.incoterm,

}

function descargar(blob, nombre) {

    });

  return n;
}

/* El PDF se hace con Google: el Word se sube a Drive convertido a documento de
   Google, se exporta a PDF y el documento temporal se borra. Con el permiso
   drive.file la app solo toca los archivos que ella crea. */
async function subirMultipart(meta, blob) {
  var token = await conToken();
  var lim = 'lim' + Date.now();
  var cuerpo = new Blob([
    '--' + lim + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n--' + lim + '\r\nContent-Type: ' + blob.type + '\r\n\r\n',
    blob, '\r\n--' + lim + '--'
  ]);
  var r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + lim },
    body: cuerpo
  });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    var eD = errorGoogle(r.status, (j && j.error && j.error.message) || '',
                         'https://www.googleapis.com/upload/drive/v3/files');
    if (!eD.habilitar && !eD.sesion && r.status === 403) {
      S.faltaDrive = true; eD = new Error('Falta el permiso de Drive para armar el PDF.');
    }
    throw eD;
  }
  return j;
}

async function carpetaContratos() {
  var LS = 'embarques:carpetaContratos';
  var id = null; try { id = localStorage.getItem(LS); } catch (e) {}
  if (id) return id;
  var j = await subirMultipart({ name: 'Contratos generados',
    mimeType: 'application/vnd.google-apps.folder' }, new Blob([''], { type: 'text/plain' }));
  try { localStorage.setItem(LS, j.id); } catch (e) {}
  return j.id;
}

async function generarPdf() {
  var G = S.gen;
  G.estado = 'Armando el PDF…'; G.error = null; G.hecho = null; pintar();
  try {
    var docx = await armarDocx();
    var carpeta = null;
    try { carpeta = await carpetaContratos(); } catch (e) { if (S.faltaDrive) throw e; }

    // 1. Word -> documento de Google (temporal)
    var temp = await subirMultipart({ name: nombreArchivo('docx') + ' (temporal)',
      mimeType: 'application/vnd.google-apps.document' }, docx);
    // 2. -> PDF
    var token = await conToken();
    var r = await fetch('https://www.googleapis.com/drive/v3/files/' + temp.id +
      '/export?mimeType=application/pdf', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Google no pudo convertir a PDF (' + r.status + ').');
    var pdf = await r.blob();
    // 3. fuera el temporal
    fetch('https://www.googleapis.com/drive/v3/files/' + temp.id,
      { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } }).catch(function () {});
    // 4. copia en Drive, para tenerlo a mano
    var enDrive = null;
    try {
      var meta = { name: nombreArchivo('pdf'), mimeType: 'application/pdf' };
      if (carpeta) meta.parents = [carpeta];
      enDrive = await subirMultipart(meta, new Blob([pdf], { type: 'application/pdf' }));
    } catch (e) {}

    descargar(pdf, nombreArchivo('pdf'));
    var n = await guardarEmpresasDelGenerador();
    G.estado = null;
    G.hecho = 'Listo: se descargó el PDF' +
      (enDrive ? ' y quedó una copia en Drive, en «Contratos generados»' : '') + '.' +
      (n ? ' Se guardaron los datos de ' + n + (n === 1 ? ' empresa' : ' empresas') + ' en la base.' : '');
    G.linkDrive = enDrive && enDrive.webViewLink;
  } catch (e) { G.estado = null; G.error = e.message; }
  pintar();
}

// "buyer.direccion" -> G.buyer.direccion; "productos.1.tns" -> G.productos[1].tns
function ponerRuta(obj, ruta, valor) {
  var partes = String(ruta).split('.');
  var o = obj;
  for (var i = 0; i < partes.length - 1; i++) {
    var k = /^\d+$/.test(partes[i]) ? +partes[i] : partes[i];
    if (o[k] === undefined || o[k] === null) o[k] = {};
    o = o[k];
  }
  var ult = partes[partes.length - 1];
  o[/^\d+$/.test(ult) ? +ult : ult] = valor;
}

/* --- Campo de fecha --------------------------------------------------------
   Un input type="date" muestra el formato del sistema operativo, que en varias
   máquinas es MM/DD/AAAA, y además dispara "change" apenas se completa el año:
   la pantalla se redibujaba en medio del tipeo y el campo perdía el foco.

   Acá se escribe en un campo de texto común, siempre DD/MM/AAAA, que se va
   formateando solo y NO redibuja mientras se tipea. Al lado, un botón abre el
   calendario nativo.
   -------------------------------------------------------------------------- */

// Cualquier cosa que venga de la planilla, mostrada como DD/MM/AAAA.
function aTextoFecha(v) {
  if (v === null || v === undefined || v === '') return '';
  if (esFecha(v)) {
    return String(v.getUTCDate()).padStart(2, '0') + '/' +
           String(v.getUTCMonth() + 1).padStart(2, '0') + '/' + v.getUTCFullYear();
  }
  var d = normFecha(v);
  if (esFecha(d)) {
    return String(d.getUTCDate()).padStart(2, '0') + '/' +
           String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  return String(v);
}

// DD/MM/AAAA -> AAAA-MM-DD, que es lo que entiende el calendario nativo.
function aISO(txt) {
  var d = normFecha(txt);
  if (!esFecha(d)) return '';
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') +
         '-' + String(d.getUTCDate()).padStart(2, '0');
}

// Va poniendo las barras mientras se escribe, sin pelear con el borrado.
function formatearFecha(txt, borrando) {
  var d = String(txt || '').replace(/[^\d]/g, '').slice(0, 8);
  if (borrando) return txt;
  if (d.length <= 2) return d;
  if (d.length <= 4) return d.slice(0, 2) + '/' + d.slice(2);
  return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
}

// Guarda la fecha del panel. Solo si cambió de verdad: así escribir y salir
// sin tocar nada no dispara una escritura en la planilla.
function guardarFechaPanel(input, campo, texto) {
  var caja = input.parentNode;
  var duenio = caja && caja.parentNode ? caja.parentNode.querySelector('[data-duenio]') : null;
  var id = duenio ? duenio.getAttribute('data-duenio') : S.sel;
  var emb = filaPorId(id);
  if (!emb) return;

  var txt = String(texto || '').trim();
  if (!txt) return;
  var d = normFecha(txt);
  if (!esFecha(d)) return pintar();   // muestra el aviso de fecha ilegible

  var iso = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') +
            '-' + String(d.getUTCDate()).padStart(2, '0');
  var vv = valorVista(emb, campo);
  var actual = esFecha(vv)
    ? vv.getUTCFullYear() + '-' +
      String(vv.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(vv.getUTCDate()).padStart(2, '0')
    : '';
  if (iso === actual) return;
  pedirCambio(id, campo, iso);
}

function campoFecha(id, attr, campo, label, valor, extra) {
  var txt = aTextoFecha(valor);
  var d = normFecha(txt);
  var mala = txt && !esFecha(d);
  return '<div class="campo campo-fecha' + (mala ? ' malo' : '') + '">' +
    '<label for="' + id + '">' + label + '</label>' +
    '<div class="fecha-caja">' +
      '<input id="' + id + '" ' + attr + '="' + campo + '" class="f-txt" ' +
        'inputmode="numeric" autocomplete="off" maxlength="10" ' +
        'placeholder="DD/MM/AAAA" value="' + esc(txt) + '">' +
      '<button type="button" class="f-cal" data-act="calendario" data-p="' + id + '" ' +
        'aria-label="Abrir calendario">' + ico('cal') + '</button>' +
      '<input type="date" class="f-nativo" id="' + id + '-cal" data-parafecha="' + id + '" ' +
        'value="' + esc(aISO(txt)) + '" tabindex="-1" aria-hidden="true">' +
    '</div>' +
    (mala ? '<span class="mal">No se entiende esa fecha</span>' : '') +
    (extra || '') + '</div>';
}
