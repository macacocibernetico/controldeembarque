function bandera(cod) {
  if (!cod || !PAISES[cod]) return '';
  var partes = PAISES[cod].split(' ');
  return '<span class="pais" title="' + esc(PAISES[cod].replace(partes[0] + ' ', '')) + '">' +
    '<span class="bnd">' + partes[0] + '</span>' +
    '<span class="cod2">' + cod + '</span></span>';
}

/* --- Shipment advice ------------------------------------------------------
   Reutiliza el Apps Script que ya está en la planilla, publicado como Web App.
   La app le manda los datos del embarque y el script genera el borrador con la
   plantilla de siempre. No se duplica la lógica del mail acá.

   Se manda como text/plain a propósito: con application/json el navegador hace
   un preflight OPTIONS que Apps Script no contesta, y la llamada falla por CORS.
   -------------------------------------------------------------------------- */

// El script combina varias filas en un solo advice cuando son de la misma
// carga. Estas son las candidatas: misma pestaña, mismo BL, buque, ETD y ETA.
// Es la misma regla que valida el script del lado de la planilla.
function hermanasAdvice(emb) {
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  return S.datos.filas.filter(function (o) {
    if (o._tab !== emb._tab) return false;
    if (o._id === emb._id) return false;
    if (!o.bl || !emb.bl) return false;
    return clave(o.bl) === clave(emb.bl) &&
           clave(o.vessel) === clave(emb.vessel) &&
           f(o.etd) === f(emb.etd) &&
           f(o.eta) === f(emb.eta) &&
           clave(o.exporter) === clave(emb.exporter) &&
           clave(o.importer) === clave(emb.importer);
  });
}

// Antes de generar: si falta el BL o el buque el advice sale incompleto y hay
// que rehacerlo. Mejor verlo acá que en el borrador.
function faltantesAdvice(emb) {
  var req = [['bl', 'BL'], ['vessel', 'Buque'], ['eta', 'ETA'],
             ['etd', 'ETD'], ['port', 'Puerto']];
  var src = fuenteDe(emb);
  return req.filter(function (r) {
    if (src.mapa[r[0]] === undefined || src.noAplica[r[0]]) return false;
    var v = emb[r[0]];
    return v === null || v === undefined || v === '' || (v && v.invalida);
  }).map(function (r) { return r[1]; });
}

function filasAdvice(emb) {
  var sel = [emb];
  hermanasAdvice(emb).forEach(function (o) {
    if (S.adviceFilas && S.adviceFilas[o._id]) sel.push(o);
  });
  return sel.sort(function (a, b) { return a._fila - b._fila; });
}

async function enviarAdvice(ids, desdeBarra) {
  var sel = (Array.isArray(ids) ? ids : [ids]).map(filaPorId).filter(Boolean)
    .sort(function (a, b) { return a._fila - b._fila; });
  if (!sel.length) return;

  var marca = desdeBarra ? { barra: true } : { id: sel[0]._id };
  var fallar = function (msg) {
    S.adviceMsg = Object.assign({ error: msg }, marca);
    S.adviceEnviando = null;
    pintar();
  };

  var d = datosAdvice(sel);
  if (d.errores.length) return fallar('No se pueden combinar: ' + d.errores.join('; ') + '.');

  var destino = (S.adviceTo !== null && S.adviceTo !== undefined) ? S.adviceTo : d.emailTo;
  destino = String(destino || '').trim();
  if (!destino) return fallar('Falta el destinatario. La columna Mails CC de esa fila está vacía.');

  S.adviceEnviando = desdeBarra ? 'barra' : sel[0]._id;
  S.adviceMsg = null; pintar();

  try {
    var t = textosAdvice(d, S.adviceIdioma || 'en');
    var firma = await firmaDelUsuario();
    var cc = [ADV.ccFijo];
    if (S.advicePeter) cc.push(ADV.peter);

    var mime = armarMime(destino, cc.join(', '), t.subject,
                         cuerpoPlano(t), cuerpoHtml(t, firma));

    // El borrador se crea en la cuenta de quien apretó el botón.
    var r = await api('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: { raw: b64url(mime) } })
    });

    var url = r && r.id
      ? 'https://mail.google.com/mail/u/0/#drafts'
      : 'https://mail.google.com/mail/u/0/#drafts';

    S.adviceMsg = Object.assign({
      ok: true,
      texto: 'Borrador creado en tu Gmail.\n' +
        'Filas: ' + sel.map(function (o) { return o._fila; }).join(', ') + '\n' +
        'Goods: ' + d.goods + '\n' +
        'Para: ' + destino + '\nCC: ' + cc.join(', '),
      url: url
    }, marca);

    // Queda anotado para todos, en la planilla.
    await registrarAdvice(sel, destino, cc.join(', '));

    var ahora = new Date();
    var reg = { fecha: ahora.toLocaleDateString('es-AR'),
                quien: S.usuario ? S.usuario.email : '', pestana: sel[0]._tab };
    sel.forEach(function (o) {
      if (o.bl) S.advices.set('b|' + clave(o.bl), reg);
      if (o.contract) S.advices.set('c|' + clave(o.contract), reg);
    });
    if (desdeBarra) S.marcados = {};
  } catch (e) {
    var msg = e.message || String(e);
    if (/insufficient|scope|permission|403|401/i.test(msg)) {
      S.faltaGmail = true;
      msg = 'Falta el permiso de Gmail para crear borradores.';
    }
    return fallar(msg);
  } finally {
    S.adviceEnviando = null; pintar();
  }
}

// Deja constancia en la pestaña de registro, para que el resto vea qué se mandó.
async function registrarAdvice(sel, destino, cc) {
  try {
    var hoja = HOJA_ADVICES;
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    var existe = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(hoja);
    });
    if (!existe) {
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: [{ addSheet: { properties: { title: hoja } } }] })
      });
      await api(BASE + S.cfg.sheetId + '/values/' +
        encodeURIComponent("'" + hoja + "'!A1") + ':append?valueInputOption=USER_ENTERED', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [['Fecha', 'Pestaña', 'Filas', 'Contratos', 'BLs',
                                         'Para', 'CC Peter', 'Idioma', 'Solicitado por']] })
      });
    }
    var ahora = new Date();
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + hoja + "'!A1") +
      ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [[
        ahora.toLocaleDateString('es-AR') + ' ' +
          ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
        sel[0]._tab,
        sel.map(function (o) { return o._fila; }).join(', '),
        sel.map(function (o) { return o.contract || ''; }).join(', '),
        sel.map(function (o) { return o.bl || ''; }).join(', '),
        destino, S.advicePeter ? 'sí' : 'no', S.adviceIdioma || 'en',
        S.usuario ? S.usuario.email : ''
      ]] })
    });
  } catch (e) { /* el registro no debe voltear el borrador */ }
}

// Bloque del panel.
/* La acción de mandar a facturar vive en la cabecera, separada del resto y con
   otro color: mueve la fila de pestaña y borra la original, así que no tiene
   que parecerse a los botones de todos los días.

   Si la pestaña no está configurada, el botón igual aparece y dice por qué no
   se puede: esconderlo deja a la persona buscando algo que no existe. */
function botonFacturar(emb) {
  if (emb._aFacturar) {
    return '<span class="pe-estado ok" title="Ya figura en A facturar">' +
      ico('check') + 'Ya facturada</span>';
  }
  if (!(S.fuentesFact || []).length) {
    return '<button class="btn-fact" data-act="faltafact" title="Falta configurar la pestaña">' +
      ico('mover') + 'A facturar</button>';
  }
  var abierto = S.pasar === emb._id;
  return '<button class="btn-fact' + (abierto ? ' on' : '') + '" data-act="pasar" ' +
    'data-f="' + esc(emb._id) + '" aria-expanded="' + abierto + '">' +
    ico('mover') + 'Enviar a facturar</button>';
}

function bloqueAdvice(emb, ev) {

  var falta = faltantesAdvice(emb);
  var msg = (S.adviceMsg && S.adviceMsg.id === emb._id) ? S.adviceMsg : null;
  var hermanas = hermanasAdvice(emb);
  var sel = filasAdvice(emb);
  var destino = (S.adviceTo !== null && S.adviceTo !== undefined)
    ? S.adviceTo : (sel[0].mailsCC || '');

  var yaEnviado = adviceDe(emb);
  var h = '<div class="bloque"><h3 class="gt">Shipment advice</h3>';

  if (yaEnviado) {
    var fEnv = fechaAdvice(yaEnviado);
    h += '<div class="adv-hecho">' + ico('check') +
      '<span>Ya se generó un advice para este embarque' +
      (fEnv ? ' el ' + esc(fEnv) : '') +
      (yaEnviado.quien ? ', por ' + esc(nombreCortoAutor(yaEnviado.quien)) : '') +
      '. Si lo volvés a generar se crea otro borrador.</span></div>';
  }

  if (msg && msg.ok) {
    h += '<div class="ok-aviso" style="margin:0 0 12px;white-space:pre-line">' +
      esc(msg.texto) +
      (msg.url ? '\n<a href="' + esc(msg.url) + '" target="_blank" rel="noopener">' +
        'Abrir borradores en Gmail</a>' : '') + '</div>';
  }
  if (msg && msg.error) {
    h += '<div class="error" style="margin:0 0 12px;white-space:pre-line">' + esc(msg.error) +
      (S.faltaGmail
        ? '<br><button data-act="permiso-gmail" style="margin-top:9px">Autorizar Gmail</button>'
        : '') + '</div>';
  }

  if (falta.length) {
    h += '<p class="advice-falta">Falta cargar ' + falta.join(', ') +
      '. El advice va a salir incompleto.</p>';
  }

  // Filas de la misma carga, para mandar un solo advice con todos los productos.
  if (hermanas.length) {
    h += '<p class="ayuda" style="margin:0 0 7px">Otras filas del mismo BL. ' +
      'Marcá las que van en el mismo advice:</p>';
    hermanas.forEach(function (o) {
      var on = S.adviceFilas && S.adviceFilas[o._id];
      h += '<label class="chk"><input type="checkbox" data-advfila="' + esc(o._id) + '"' +
        (on ? ' checked' : '') + '>' +
        '<span>Fila ' + o._fila + ' · ' +
        esc((o.tns || '') + ' tn ' + (o.product || '')) + '</span></label>';
    });
  }

  h += '<div class="campo" style="margin-top:12px">' +
    '<label for="adv-to-panel">Destinatarios</label>' +
    '<input id="adv-to-panel" data-advto="1" value="' + esc(destino) + '" ' +
    'placeholder="cliente@empresa.com"></div>' +
    '<p class="ayuda" style="margin:-8px 0 12px">Separar con coma. Se precarga de Mails CC. ' +
    'La copia fija la agrega el script.</p>';

  h += '<div class="adv-fila">' +
    '<span class="modos">' +
      [['en', 'English'], ['es', 'Español']].map(function (o) {
        return '<button data-act="advidioma" data-v="' + o[0] + '" aria-pressed="' +
          ((S.adviceIdioma || 'en') === o[0]) + '">' + o[1] + '</button>';
      }).join('') +
    '</span>' +
    togglePeter() +
    '</div>';

  h += '<button class="primario ancho" data-act="advice" data-f="' + esc(emb._id) + '"' +
    (S.adviceEnviando === emb._id ? ' disabled' : '') + '>' +
    (S.adviceEnviando === emb._id
      ? 'Creando…'
      : ico('mail') + 'Crear borrador del shipment advice' +
        (sel.length > 1 ? ' (' + sel.length + ' filas)' : '')) +
    '</button>' +
    '<p class="ayuda">Queda como borrador en Gmail para revisarlo. No se envía solo.</p>' +
    '</div>';

  return h;
}

/* --- Registro de advices enviados -----------------------------------------
   El script deja una fila en "Advices enviados" cada vez que genera un
   borrador. La app la lee para marcar los embarques: así la marca sobrevive a
   recargar y la ven todos, no solo quien lo generó.
   -------------------------------------------------------------------------- */

var HOJA_ADVICES = 'Advices enviados';

async function cargarAdvices() {
  S.advices = new Map();
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    var existe = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(HOJA_ADVICES);
    });
    if (!existe) return;

    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_ADVICES + "'!A2:I3000"));

    S.advicesViejos = 0;

    (r.values || []).forEach(function (f) {
      // Formato viejo: Fecha | Filas | Para | CC | Idioma | Quién. Se reconoce
      // porque la columna B es una lista de números.
      //
      // Esos registros NO se pueden ubicar: guardaban el número de fila, y las
      // filas se reordenan por ETA, así que hoy apuntan a otro embarque.
      // Marcar por ahí sería peor que no marcar. Se cuentan para avisar.
      if (f[1] && /^[\d,\s]+$/.test(String(f[1]).trim())) {
        S.advicesViejos++;
        return;
      }

      var reg = { fecha: f[0] || '', pestana: f[1] || '', quien: f[8] || '' };

      String(f[3] || '').split(',').forEach(function (c) {
        var k = clave(c);
        if (k) S.advices.set('c|' + k, reg);
      });
      String(f[4] || '').split(',').forEach(function (b) {
        var k = clave(b);
        if (k) S.advices.set('b|' + k, reg);
      });
    });
  } catch (e) {
    S.advices = new Map();
  }
}

// El BL manda: identifica el embarque exacto. El contrato es el respaldo para
// las cargas sin BL.
function adviceDe(emb) {
  if (!S.advices || !S.advices.size) return null;
  if (emb.bl) {
    var porBL = S.advices.get('b|' + clave(emb.bl));
    if (porBL) return porBL;
  }
  if (emb.contract) {
    var porCtr = S.advices.get('c|' + clave(emb.contract));
    // Sin BL propio no se puede distinguir un parcial de otro, así que solo
    // se acepta el match por contrato cuando el embarque no tiene BL.
    if (porCtr && !emb.bl) return porCtr;
  }
  return null;
}

// Fecha corta del registro, que puede venir como texto de Sheets.
function fechaAdvice(reg) {
  var t = String(reg && reg.fecha || '');
  var m = t.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  if (m) return m[1];
  var d = new Date(t);
  return isNaN(d) ? '' : fmtFecha(d);
}

/* --- Comentarios -----------------------------------------------------------
   Viven en una pestaña propia de la misma planilla: una fila por comentario.
   Así quedan auditables, se ven desde Sheets y no pisan las celdas de datos.
   Se atan al embarque por contrato + BL + pestaña, no por número de fila, que
   cambia cuando alguien inserta u ordena.
   -------------------------------------------------------------------------- */

// Clave estable de un embarque para colgarle comentarios.
function claveComentario(emb) {
  return [clave(emb._tab), clave(emb.contract), clave(emb.bl || '')].join('|');
}

async function cargarComentarios() {
  S.comentarios = new Map();
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(sheetId,title))'));
    var hoja = (meta.sheets || []).filter(function (h) {
      return clave(h.properties.title) === clave(HOJA_COMENTARIOS);
    })[0];
    if (!hoja) { S.hojaComentarios = null; return; }
    S.hojaComentarios = hoja.properties.title;

    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + S.hojaComentarios + "'!A2:G5000"));
    (r.values || []).forEach(function (f) {
      if (!f || !f[5]) return;
      var k = [clave(f[2]), clave(f[3]), clave(f[4] || '')].join('|');
      var lista = S.comentarios.get(k) || [];
      lista.push({ fecha: f[0], autor: f[1], texto: f[5], sobre: f[6] || '' });
      S.comentarios.set(k, lista);
    });
  } catch (e) {
    // Sin comentarios no se cae la app.
    S.hojaComentarios = null;
  }
}

async function crearHojaComentarios() {
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{ addSheet: { properties: { title: HOJA_COMENTARIOS } } }]
    })
  });
  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + HOJA_COMENTARIOS + "'!A1") +
    ':append?valueInputOption=USER_ENTERED', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [ENC_COMENTARIOS] })
  });
  S.hojaComentarios = HOJA_COMENTARIOS;
}

async function comentar(id, texto) {
  texto = String(texto || '').trim();
  if (!texto) return;
  var emb = filaPorId(id);
  if (!emb) return;

  S.enviando = true; pintar();
  try {
    if (!S.hojaComentarios) await crearHojaComentarios();

    var ahora = new Date();
    var fecha = ahora.toLocaleDateString('es-AR') + ' ' +
                ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    var autor = S.usuario ? (S.usuario.email || S.usuario.nombre) : 'desconocido';
    var ev = S.ultimaEval && S.ultimaEval[id];
    var sobre = ev && ev.alertas.length ? ev.alertas[0].titulo : '';

    var fila = [fecha, autor, emb._tab, emb.contract || '', emb.bl || '', texto, sobre];

    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + S.hojaComentarios + "'!A1") +
      ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [fila] })
    });

    var k = claveComentario(emb);
    var lista = S.comentarios.get(k) || [];
    lista.push({ fecha: fecha, autor: autor, texto: texto, sobre: sobre });
    S.comentarios.set(k, lista);
    S.borrador = '';
  } catch (e) {
    S.error = 'No se pudo guardar el comentario: ' + e.message;
  } finally {
    S.enviando = false; pintar();
  }
}

function comentariosDe(emb) {
  return S.comentarios.get(claveComentario(emb)) || [];
}

/* --- Carga de datos -------------------------------------------------------- */

async function cargarTodo() {
  S.cargando = true; S.error = null; pintar();
  var avisos = [];
  try {
    // Cada pestaña se lee y se mapea por separado: los encabezados de las
    // terrestres no son los mismos que los de las marítimas.
    var fuentes = [];
    for (var i = 0; i < S.cfg.tabsEmb.length; i++) {
      var tab = S.cfg.tabsEmb[i];
      var h;
      try {
        h = await leerHoja(S.cfg.sheetId, tab);
      } catch (e) {
        avisos.push('No se pudo leer "' + tab + '": ' + e.message);
        continue;
      }
      var det = detectar(h.encabezados, CAMPOS);

      var filas = h.filas.map(function (f) {
        // Se conserva la fila cruda: hace falta para poder devolverla exacta,
        // con sus colores, si alguien la pasa a facturar por error.
        var o = { _fila: f.fila, _tab: tab, _sheetId: h.sheetId, _id: tab + ':' + f.fila,
                  _celdas: f.celdas, _colores: f.colores };
        Object.keys(det.mapa).forEach(function (campo) {
          var idx = det.mapa[campo];
          o[campo] = CAMPOS[campo].tipo === 'semaforo'
            ? colorASem(f.colores[idx])
            : convertir(f.celdas[idx], CAMPOS[campo].tipo);
        });
        // Si la ETA vino sin año y quedó antes del ETD, es del año siguiente.
        if (o.eta && o.eta.anioAsumido && esFecha(o.etd) && esFecha(o.eta) && o.eta < o.etd) {
          var ajust = new Date(Date.UTC(o.eta.getUTCFullYear() + 1,
                                        o.eta.getUTCMonth(), o.eta.getUTCDate()));
          ajust.anioAsumido = true; ajust.crudo = o.eta.crudo;
          o.eta = ajust;
        }

        // En las columnas semáforo el color es el estado y el texto es otra cosa:
        // en Docs. son anotaciones operativas ("recibir factura y enviar gas
        // free"), en T.R. la modalidad. Se guardan aparte para no perderlas.
        o._notas = {};
        SEMAFOROS.forEach(function (c) {
          var ic = det.mapa[c];
          if (ic === undefined) return;
          var tx = f.celdas[ic];
          o._notas[c] = tx == null ? '' : String(tx).trim();
        });

        // En T.R. el texto es la MODALIDAD de liberación (BL Original / telex),
        // no el estado. El estado es el color. Se guardan por separado.
        // Ojo: la columna mezcla modalidad ("BL Original", "telex") con
        // palabras de estado ("solicitada"), que ya vienen en el color. Solo
        // tomamos las que son realmente modalidad.
        if (det.mapa.tr !== undefined) {
          var t = clave(f.celdas[det.mapa.tr]);
          o.trModo = /bl original|original/.test(t) ? 'BL original'
                   : /telex/.test(t) ? 'Telex release'
                   : /express/.test(t) ? 'Express release'
                   : '';
        }

        // Naranja en "Pago estimado" = falta que manden el comprobante.
        var ip = det.mapa[COL_COMPROBANTE];
        o._faltaComprobante = ip !== undefined && esNaranja(f.colores[ip]);
        return o;
      });

      // Una columna vacía en TODAS las filas de esta pestaña no aplica a este
      // tipo de carga: en camión no hay BL ni contenedores. No la exigimos.
      var noAplica = {};
      Object.keys(det.mapa).forEach(function (campo) {
        var alguna = filas.some(function (o) {
          var v = o[campo];
          if (SEMAFOROS.indexOf(campo) >= 0) return v && v !== 'vacio';
          return v !== null && v !== undefined && v !== '';
        });
        if (!alguna) noAplica[campo] = 1;
      });

      fuentes.push({ tab: tab, sheetId: h.sheetId, mapa: det.mapa,
                     extras: det.extras, encabezados: h.encabezados,
                     noAplica: noAplica, filas: filas });
    }

    if (!fuentes.length) throw new Error(avisos.join(' · ') || 'No se pudo leer ninguna pestaña.');

    var todas = [];
    fuentes.forEach(function (f) { todas = todas.concat(f.filas); });
    S.fuentes = fuentes;
    S.datos = { filas: todas };

    // Contratos: se juntan todas las pestañas elegidas. Un embarque puede estar
    // en curso con el contrato ya cerrado, así que cerrados también cuentan.
    S.contratos = new Map();
    for (var j = 0; j < (S.cfg.tabsCtr || []).length; j++) {
      var tc = S.cfg.tabsCtr[j], hc;
      try {
        hc = await leerHoja(S.cfg.sheetId, tc);
      } catch (e2) {
        avisos.push('No se pudo leer "' + tc + '": ' + e2.message);
        continue;
      }
      var dc = detectar(hc.encabezados, CAMPOS_CTR);
      if (dc.mapa.contrato === undefined) {
        avisos.push('En "' + tc + '" no encontré una columna de contrato.');
        continue;
      }
      hc.filas.forEach(function (f) {
        var n = f.celdas[dc.mapa.contrato];
        if (!n) return;
        var k = String(n).trim();
        var g = function (campo) {
          return dc.mapa[campo] !== undefined ? f.celdas[dc.mapa[campo]] : null;
        };

        // Un mismo número de contrato puede ocupar VARIAS filas: el mismo
        // contrato partido en productos distintos (20 tn blancheado + 8 tn
        // crudo). No es un error de carga, es como se trabaja. Antes se
        // descartaba la segunda fila y el contrato quedaba con la mitad de las
        // toneladas.
        if (S.contratos.has(k)) {
          var prev = S.contratos.get(k);
          prev.partes = (prev.partes || 1) + 1;
          prev.tns = (normNum(prev.tns) || 0) + (normNum(g('tns')) || 0);
          prev.comision = (normNum(prev.comision) || 0) + (normNum(g('comision')) || 0);
          if (normNum(g('entregado')) !== null) {
            prev.entregadoHoja = (normNum(prev.entregadoHoja) || 0) + normNum(g('entregado'));
          }
          if (normNum(g('saldo')) !== null) {
            prev.saldoHoja = (normNum(prev.saldoHoja) || 0) + normNum(g('saldo'));
          }
          // Los productos se listan, que es lo que distingue las filas.
          var pNuevo = String(g('producto') || '').trim();
          if (pNuevo && String(prev.producto || '').indexOf(pNuevo) < 0) {
            prev.producto = [prev.producto, pNuevo].filter(Boolean).join(' + ');
          }
          return;
        }

        S.contratos.set(k, {
          partes: 1,
          contrato: k, origen: tc,
          exportador: g('exportador'),
          importador: g('importador'),
          producto: g('producto'),
          tipo: g('tipo'),
          incoterm: g('incoterm'),
          precio: normNum(g('precio')),
          tns: normNum(g('tns')),
          comision: normNum(g('comision')),
          // La planilla ya trae su propio entregado y saldo: los guardamos
          // para poder contrastarlos con los que calcula la app.
          entregadoHoja: normNum(g('entregado')),
          saldoHoja: normNum(g('saldo')),
          periodo: g('periodo'),
          packaging: g('packaging'),
          fecha: normFecha(g('fecha')),
          via: normVia(g('via')),
          firmaExp: esVerdadero(g('firmaExp')),
          firmaImp: esVerdadero(g('firmaImp')),
          tieneFirmas: dc.mapa.firmaExp !== undefined || dc.mapa.firmaImp !== undefined,
          formaPago: g('formaPago'),
          cond: interpretarPago(g('formaPago'))
        });
      });
    }

    // "A facturar": un embarque llega ahí cuando el cliente ya le pagó al
    // exportador. Estar en esa pestaña ES la prueba de cobro que falta en la
    // columna Inv Commission.
    S.facturar = new Map();
    S.fuentesFact = [];
    for (var k = 0; k < (S.cfg.tabsFact || []).length; k++) {
      var tf = S.cfg.tabsFact[k], hf;
      try {
        hf = await leerHoja(S.cfg.sheetId, tf);
      } catch (e3) {
        avisos.push('No se pudo leer "' + tf + '": ' + e3.message);
        continue;
      }
      var df = detectar(hf.encabezados, CAMPOS);
      // Se guarda la fuente para poder escribir después: pasar una carga a
      // facturar necesita el id de hoja y el mapa de columnas.
      S.fuentesFact.push({ tab: tf, sheetId: hf.sheetId, mapa: df.mapa,
                           noAplica: df.noAplica, filas: hf.filas });
      if (df.mapa.contract === undefined) {
        avisos.push('En "' + tf + '" no encontré la columna de contrato.');
        continue;
      }
      hf.filas.forEach(function (f) {
        var nc = f.celdas[df.mapa.contract];
        if (!nc) return;
        var kk = String(nc).trim();
        var reg = S.facturar.get(kk) || { contrato: kk, filas: 0, tns: 0, bls: [], items: [] };
        reg.filas++;
        var tn = df.mapa.tns !== undefined ? normNum(f.celdas[df.mapa.tns]) : null;
        if (tn) reg.tns += tn;
        var bl = df.mapa.bl !== undefined ? f.celdas[df.mapa.bl] : null;
        var blk = bl ? String(bl).trim() : '';
        if (blk) reg.bls.push(blk);
        reg.items.push({ bl: blk, tns: tn, usado: false });
        S.facturar.set(kk, reg);
      });
    }

    // Marcar los embarques que ya pasaron a facturar. Se cruza embarque por
    // embarque, no por contrato: un contrato se parte en varios parciales y
    // puede haber pasado uno solo. Cruzar por contrato daría por cobrados
    // parciales que siguen abiertos.
    //
    // Primero por BL, que es único. Después, para las terrestres que no tienen
    // BL, por toneladas, consumiendo cada coincidencia una sola vez.
    var pend = [];
    todas.forEach(function (o) {
      o._aFacturar = false;
      var reg = S.facturar.get(String(o.contract || '').trim());
      if (!reg) return;
      var blo = o.bl ? String(o.bl).trim() : '';
      if (blo) {
        var it = reg.items.filter(function (i) { return !i.usado && i.bl === blo; })[0];
        if (it) { it.usado = true; o._aFacturar = true; }
        return;   // Tiene BL y no matcheó: no se cobró, no se adivina.
      }
      pend.push({ o: o, reg: reg });
    });

    pend.forEach(function (x) {
      var o = x.o, reg = x.reg;
      var tn = o.tns;
      var it = null;
      if (tn) {
        it = reg.items.filter(function (i) {
          return !i.usado && i.tns && Math.abs(i.tns - tn) < 0.05;
        })[0];
      }
      if (!it) {
        // Sin BL ni toneladas comparables: solo si queda alguna fila libre.
        it = reg.items.filter(function (i) { return !i.usado && !i.bl && !i.tns; })[0];
      }
      if (it) { it.usado = true; o._aFacturar = true; }
    });

    // ALL CONTRATOS suele ser un IMPORTRANGE: sirve para leer pero no se puede
    // escribir. Para editar hay que ir a la pestaña real donde vive la fila.
    S.ctrEditables = new Map();
    S.formasPago = [];
    var frecuencia = {};
    for (var m = 0; m < (S.cfg.tabsCtrEdit || []).length; m++) {
      var te = S.cfg.tabsCtrEdit[m], he;
      try {
        he = await leerHoja(S.cfg.sheetId, te);
      } catch (e4) {
        avisos.push('No se pudo leer "' + te + '": ' + e4.message);
        continue;
      }
      var de = detectar(he.encabezados, CAMPOS_CTR);
      if (de.mapa.contrato === undefined) {
        avisos.push('En "' + te + '" no encontré la columna de contrato.');
        continue;
      }
      he.filas.forEach(function (f) {
        var nc = f.celdas[de.mapa.contrato];
        if (!nc) return;
        var kc = String(nc).trim();
        // Las firmas viven en la pestaña editable (Contratos Abiertos), no en
        // la de lectura, que suele ser un IMPORTRANGE sin esas columnas. Se
        // toman de acá y se mezclan con el contrato.
        if (de.mapa.firmaExp !== undefined || de.mapa.firmaImp !== undefined) {
          var ctr0 = S.contratos.get(kc);
          if (!ctr0) { ctr0 = { contrato: kc, origen: te }; S.contratos.set(kc, ctr0); }
          if (de.mapa.via !== undefined) {
            var vv = normVia(f.celdas[de.mapa.via]);
            if (vv) ctr0.via = vv;
          }
          if (de.mapa.fecha !== undefined && !esFecha(ctr0.fecha)) {
            ctr0.fecha = normFecha(f.celdas[de.mapa.fecha]);
          }
          // Si el contrato ocupa varias filas, cuenta como firmado solo
          // cuando lo están todas.
          var yaVisto = ctr0.tieneFirmas;
          ctr0.tieneFirmas = true;
          if (de.mapa.firmaExp !== undefined) {
            var fe = esVerdadero(f.celdas[de.mapa.firmaExp]);
            ctr0.firmaExp = yaVisto ? (ctr0.firmaExp && fe) : fe;
          }
          if (de.mapa.firmaImp !== undefined) {
            var fi = esVerdadero(f.celdas[de.mapa.firmaImp]);
            ctr0.firmaImp = yaVisto ? (ctr0.firmaImp && fi) : fi;
          }
        }

        var refPrev = S.ctrEditables.get(kc);
        if (refPrev) {
          refPrev.otras = (refPrev.otras || []);
          refPrev.otras.push({ tab: te, sheetId: he.sheetId, fila: f.fila,
                               mapa: de.mapa, celdas: f.celdas });
        }
        if (!S.ctrEditables.has(kc)) {
          S.ctrEditables.set(kc, {
            tab: te, sheetId: he.sheetId, fila: f.fila, mapa: de.mapa,
            celdas: f.celdas
          });
        }
        if (de.mapa.formaPago !== undefined) {
          var fp = f.celdas[de.mapa.formaPago];
          if (fp && String(fp).trim()) {
            var kk = clave(fp);
            frecuencia[kk] = frecuencia[kk] || { n: 0, variantes: {} };
            frecuencia[kk].n++;
            var tx = String(fp).trim();
            frecuencia[kk].variantes[tx] = (frecuencia[kk].variantes[tx] || 0) + 1;
          }
        }
      });
    }

    // "CAD Bank", "CAD BANK" y "Cad Bank" son la misma: se ofrece la más usada
    // para que la lista deje de multiplicarse.
    S.formasPago = Object.keys(frecuencia).map(function (k) {
      var v = frecuencia[k];
      var mejor = Object.keys(v.variantes).sort(function (a, b) {
        return v.variantes[b] - v.variantes[a] || a.localeCompare(b, 'es');
      })[0];
      return { texto: mejor, usos: v.n };
    }).sort(function (a, b) { return b.usos - a.usos; });

    await cargarListas();
    await cargarPaisesEmpresas();
    await cargarEmpresas();
    await cargarComentarios();
    await cargarAdvices();

    S.avisos = avisos;
  } catch (e) {
    S.error = e.message;
  } finally {
    S.cargando = false; pintar();
  }
}

function fuenteDe(emb) {
  for (var i = 0; i < S.fuentes.length; i++) {
    if (S.fuentes[i].tab === emb._tab) return S.fuentes[i];
  }
  return S.fuentes[0];
}

function filaPorId(id) {
  return S.datos.filas.filter(function (x) { return x._id === id; })[0];
}

async function aplicarCambio(id, campo, valor) {
  S.guardadoOk = false;
  var f = filaPorId(id);
  if (!f) return;
  var src = fuenteDe(f);
  var idx = campo === '_faltaComprobante' ? src.mapa[COL_COMPROBANTE] : src.mapa[campo];
  if (idx === undefined) {
    S.error = 'Esa columna no existe en "' + f._tab + '".';
    return pintar();
  }

  var antes = f[campo];
  f[campo] = (campo === '_faltaComprobante' || CAMPOS[campo].tipo === 'semaforo')
    ? valor : convertir(valor, CAMPOS[campo].tipo);
  S.guardando++; pintar();

  var valores = {}, colores = {};
  if (campo === '_faltaComprobante') colores[idx] = valor ? 'falta_cbte' : 'vacio';
  else if (SEMAFOROS.indexOf(campo) >= 0) colores[idx] = valor;
  else valores[idx] = valor;

  try {
    await escribirCeldas(S.cfg.sheetId, f._sheetId, f._fila, valores, colores);
  } catch (e) {
    f[campo] = antes;
    S.error = 'No se pudo guardar: ' + e.message;
  } finally {
    S.guardando--;
    if (!S.guardando) {
      S.guardadoOk = true;
      clearTimeout(S.tGuardado);
      S.tGuardado = setTimeout(function () { S.guardadoOk = false; pintar(); }, 2500);
    }
    pintar();
  }
}

// Escribe el texto de una columna semáforo sin tocar su color.
async function aplicarNota(id, campo, texto) {
  var f = filaPorId(id);
  if (!f) return;
  var src = fuenteDe(f);
  var idx = src.mapa[campo];
  if (idx === undefined) return;

  var antes = (f._notas && f._notas[campo]) || '';
  f._notas = f._notas || {};
  f._notas[campo] = texto;
  S.guardando++; pintar();

  var valores = {};
  valores[idx] = texto;
  try {
    await escribirCeldas(S.cfg.sheetId, f._sheetId, f._fila, valores, {});
  } catch (e) {
    f._notas[campo] = antes;
    S.error = 'No se pudo guardar la anotación: ' + e.message;
  } finally {
    S.guardando--;
    if (!S.guardando) {
      S.guardadoOk = true;
      clearTimeout(S.tGuardado);
      S.tGuardado = setTimeout(function () { S.guardadoOk = false; pintar(); }, 2500);
    }
    pintar();
  }
}

function ico(nombre) {
  var d = ICONOS[nombre];
  if (!d) return '';
  return '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="' + d + '"/></svg>';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Números con separadores, y sin decimales inútiles.
function fmtNum(v) {
  var n = Number(v);
  if (!isFinite(n)) return '';
  return n.toLocaleString('es-AR', { maximumFractionDigits: 2 });
}

function fmtFecha(f) {
  return esFecha(f) ? f.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
}

function pintarCelda(v) {
  if (v === null || v === undefined || v === '') return '<span class="vacia">—</span>';
  if (typeof v === 'object' && v.invalida) return '<span class="mala">' + esc(v.crudo) + '</span>';
  if (v instanceof Date) {
    if (v.anioAsumido) {
      return '<span class="asumida" title="Sin año en la planilla, se asume ' +
        v.getUTCFullYear() + '">' + fmtFecha(v) + '</span>';
    }
    var mala = v.getUTCFullYear() > new Date().getFullYear() + 1;
    return mala ? '<span class="mala">' + fmtFecha(v) + '</span>' : fmtFecha(v);
  }
  if (typeof v === 'number') return v.toLocaleString('es-AR');
  return esc(v);
}

// El mismo contenido que el enlace, en una línea para copiar y pegar.
function codigoConfig() {
  try { return b64url(JSON.stringify(configExportable())); } catch (e) { return ''; }
}

function aplicarCodigo(txt) {
  var t = String(txt || '').trim();
  if (!t) return null;
  // Acepta el código pelado o el enlace entero.
  var m = t.match(/#cfg=([^&\s]+)/);
  if (m) t = decodeURIComponent(m[1]);
  try {
    var b = t.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var obj = JSON.parse(new TextDecoder().decode(bytes));
    return obj && obj.sheetId ? obj : null;
  } catch (e) { return null; }
}

function enlaceConfig() {
  try {
    var json = JSON.stringify(configExportable());
    return location.origin + location.pathname + '#cfg=' + encodeURIComponent(b64url(json));
  } catch (e) { return ''; }
}

function leerConfigDeEnlace() {
  var h = location.hash || '';
  var m = h.match(/#cfg=([^&]+)/);
  if (!m) return null;
  try {
    var b = decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var obj = JSON.parse(new TextDecoder().decode(bytes));
    return (obj && obj.sheetId) ? obj : null;
  } catch (e) { return null; }
}

function evaluarTodo() {
  var hoy = new Date();
  S.ultimaEval = {};
  return S.datos.filas.map(function (emb) {
    var ctr = S.contratos.get(String(emb.contract || '').trim()) || null;
    var src = fuenteDe(emb);
    var ev = evaluar(emb, ctr, hoy, src.mapa, src.noAplica);
    S.ultimaEval[emb._id] = ev;
    return { emb: emb, contrato: ctr, src: src, ev: ev };
  });
}

function vistaApp() {
  if (!S.datos) {
    return barraMobile() + '<div class="marco-app v-' + colorDeVista(S.vista) + '">' + navLateral([]) +
      '<main class="app">' +
      (S.error ? '<div class="error" style="margin-top:14px">' + esc(S.error) + '</div>' : '') +
      '<p class="centro">' + (S.cargando ? 'Leyendo la planilla…' : 'Sin datos.') + '</p>' +
      '</main></div>' + tabBarInferior();
  }

  var todosEvs = evaluarTodo();
  var evs = todosEvs.filter(function (x) {
    if (S.filtroTab && x.emb._tab !== S.filtroTab) return false;
    if (S.filtroTipo && clave(x.emb.tipo) !== S.filtroTipo) return false;
    return true;
  });
  var cuenta = { critico: 0, alto: 0, medio: 0, ok: 0 };
  evs.forEach(function (x) { x.ev.nivelMax ? cuenta[x.ev.nivelMax]++ : cuenta.ok++; });

  var segmentado = segmentoPestanas(todosEvs) + segmentoTipos(todosEvs);
  var cuerpo = S.vista === 'control' ? vistaControl(evs, cuenta)
             : S.vista === 'contratos' ? vistaContratos()
             : S.verFact ? vistaFacturadas()
             : vistaGrilla(evs);
  var panel = '';
  if (S.gen) panel = panelGenerador();
  else if (S.editCtr) panel = panelContrato();
  else if (S.sel !== null) {
    var item = todosEvs.filter(function (x) { return x.emb._id === S.sel; })[0];
    if (item) panel = vistaPanel(item);
  }

  return barraMobile() +
    '<div class="marco-app v-' + colorDeVista(S.vista) + '">' + navLateral(todosEvs) +
    '<main class="app">' +
      (S.error ? '<div class="error">' + esc(S.error) + '</div>' : '') +
      (S.avisoOk ? '<div class="ok-aviso">' + esc(S.avisoOk) +
        ' <button data-act="cerraviso">Cerrar</button></div>' : '') +
      barraDeshacer() +
      tituloVista() +
      segmentado + cuerpo + diagnostico() +
    '</main></div>' + tabBarInferior() + panel + barraAdvice(todosEvs);
}

// Marítimo y terrestre separados, pero con la opción de ver todo junto. Es lo
// primero que se toca, así que va arriba y siempre visible, no escondido en
// el panel de filtros.
// Barra flotante: aparece cuando hay embarques marcados. Es la forma natural
// de armar un advice con varias filas sin tener que entrar a cada tarjeta.
/* ¿A este embarque le corresponde mandar el advice?
   El advice se manda cuando el barco ya salió y están el BL y las fotos: es lo
   que el cliente necesita para preparar la llegada. Antes de eso sale
   incompleto; mucho después ya no sirve de aviso.

   Se mira lo que la planilla ya dice, no hace falta cargar nada nuevo. */
function sugerenciaAdvice(emb, ev) {
  if (adviceDe(emb)) return null;                 // ya se mandó
  var src = fuenteDe(emb);
  if (src.mapa.bl === undefined || src.noAplica.bl) return null;  // terrestres

  var hoy = new Date();
  if (!lleno(emb, 'bl')) return null;             // sin BL no hay advice
  if (!esFecha(emb.etd) || emb.etd > hoy) return null;   // todavía no salió

  var faltan = faltantesAdvice(emb);
  var dias = Math.round((hoy - emb.etd) / 86400000);

  // El propio equipo lo marca en Docs con "Enviar Shipment Advice".
  var marcado = /enviar\s*shipment\s*advice/i.test((emb._notas && emb._notas.docs) || '');

  if (marcado) {
    return { nivel: 'ya', texto: 'La planilla lo marca para enviar' };
  }
  if (faltan.length) {
    return { nivel: 'falta', texto: 'Falta ' + faltan.join(', ').toLowerCase() };
  }
  if (esFecha(emb.eta) && emb.eta < hoy) {
    var desde = Math.round((hoy - emb.eta) / 86400000);
    // Pasadas tres semanas del arribo el advice ya no avisa nada: el cliente
    // hace rato que sabe. Se deja de sugerir para no llenar la lista de ruido.
    if (desde > 21) return null;
    return { nivel: 'tarde', texto: 'Llegó hace ' + desde + ' días y no se avisó' };
  }
  return { nivel: 'ya', texto: 'Zarpó hace ' + dias + ' días, con BL y datos completos' };
}

function sugeridos(evs) {
  return evs.filter(function (x) {
    var sg = sugerenciaAdvice(x.emb, x.ev);
    return sg && sg.nivel !== 'falta';
  });
}

// planilla ya se movió y volver atrás sería peor que dejarlo.

}

function vistaFacturadas() {
  var fact = (S.fuentesFact || [])[0];
  if (!fact) return '<p class="centro">No hay pestaña de "A facturar" configurada.</p>';

  var mapa = fact.mapa;
  var g = function (f, campo) {
    var i = mapa[campo];
    return i === undefined ? '' : (f.celdas[i] === null || f.celdas[i] === undefined ? '' : f.celdas[i]);
  };

  var filas = fact.filas.map(function (f) {
    return {
      fila: f.fila,
      exporter: String(g(f, 'exporter') || '').trim(),
      importer: String(g(f, 'importer') || '').trim(),
      contract: String(g(f, 'contract') || '').trim(),
      product: String(g(f, 'product') || '').trim(),
      bl: String(g(f, 'bl') || '').trim(),
      containers: String(g(f, 'containers') || '').trim(),
      vessel: String(g(f, 'vessel') || '').trim(),
      invoice: String(g(f, 'invoice') || '').trim(),
      tns: normNum(g(f, 'tns')),
      etd: normFecha(g(f, 'etd'))
    };
  }).filter(function (o) { return o.exporter || o.importer || o.contract; });

  var q = clave(S.buscaFact || '');
  if (q) {
    filas = filas.filter(function (o) {
      return clave([o.exporter, o.importer, o.contract, o.bl, o.invoice, o.product]
        .join(' ')).indexOf(q) >= 0;
    });
  }

  // Las últimas cargadas primero: es lo que uno acaba de mover.
  filas.sort(function (a, b) { return b.fila - a.fila; });
  var total = filas.length;
  var tope = S.topeFact || 25;
  var vis = filas.slice(0, tope);

  var h = '<div class="filtros">' +
    '<input id="busca-fact" placeholder="Buscar cliente, contrato, BL, factura" value="' +
      esc(S.buscaFact || '') + '" aria-label="Buscar en A facturar">' +
    '</div>' +
    '<p class="conteo">' + total + (total === 1 ? ' fila' : ' filas') + ' en «' +
      esc(fact.tab) + '»' + (q ? ' que coinciden' : ', de la más reciente a la más vieja') +
    '</p>';

  if (S.factError) h += '<div class="error">' + esc(S.factError) + '</div>';
  if (!vis.length) return h + '<p class="centro">Nada coincide.</p>';

  h += '<div class="lista">' + vis.map(function (o) {
    var destino = tabProbable(o);
    var abierta = S.devolver === o.fila;
    return '<article class="emb fact-fila">' +
      '<div class="emb-cuerpo">' +
        '<div class="ff-top">' +
          '<div class="ff-quien">' +
            '<div class="partes"><div class="via-partes">' +
              '<div class="parte"><span class="exp">' + esc(o.exporter || '—') + '</span></div>' +
              '<span class="fl">→</span>' +
              '<div class="parte"><span class="imp">' + esc(o.importer || '—') + '</span></div>' +
            '</div></div>' +
            '<div class="sub">' + esc(o.product) +
              (o.tns ? ' · ' + fmtNum(o.tns) + ' tn' : '') + '</div>' +
            '<div class="ctr">' + esc(o.contract || 'sin contrato') +
              ' · fila ' + o.fila + '</div>' +
          '</div>' +
          '<div class="ff-refs">' +
            (o.bl ? '<span class="ref"><em>BL</em><b>' + esc(o.bl) + '</b></span>' : '') +
            (o.invoice ? '<span class="ref"><em>Factura</em><b>' + esc(o.invoice) + '</b></span>' : '') +
            (esFecha(o.etd) ? '<span class="ref"><em>ETD</em><b>' + fmtFecha(o.etd) + '</b></span>' : '') +
          '</div>' +
          (abierta ? '' :
            '<button data-act="devolver" data-r="' + o.fila + '">' + ico('volver') +
            'Devolver</button>') +
        '</div>' +

        (abierta
          ? '<div class="confirmar" style="margin-top:14px">' +
            '<p class="cf-tit">' + ico('volver') + '¿A qué pestaña la devolvemos?</p>' +
            '<div class="chips" style="margin:0 0 14px">' +
              (S.fuentes || []).map(function (f) {
                var sel = (S.devolverTab || destino) === f.tab;
                return '<button data-act="devolvertab" data-t="' + esc(f.tab) + '" ' +
                  'aria-pressed="' + sel + '">' + esc(nombreCorto(f.tab)) + '</button>';
              }).join('') +
            '</div>' +
            '<p class="cf-ojo">Se mueve la fila con sus datos y sus colores, y se borra de «' +
              esc(fact.tab) + '». Es el mismo cortar y pegar de siempre.</p>' +
            '<div class="alta-acc">' +
              '<button class="primario" data-act="devolverok" data-r="' + o.fila + '"' +
                (S.pasando ? ' disabled' : '') + '>' +

              '<button data-act="devolverno">Cancelar</button>' +
            '</div></div>'
          : '') +
      '</div></article>';
  }).join('') + '</div>';

  if (total > vis.length) {
    h += '<div class="ver-mas"><button data-act="masfact">Ver ' +
      Math.min(total - vis.length, 25) + ' más</button>' +
      '<span class="ayuda">' + (total - vis.length) + ' sin mostrar</span></div>';
  }
  return h;
}

function barraAdvice(evs) {
  var ids = Object.keys(S.marcados || {}).filter(function (k) { return S.marcados[k]; });
  if (!ids.length) return '';

  var sel = ids.map(filaPorId).filter(Boolean)
    .sort(function (a, b) { return a._fila - b._fila; });
  if (!sel.length) return '';

  // Las mismas condiciones que valida el script del lado de la planilla.
  var base = sel[0];
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  var difs = [];
  [['exporter', 'Exportador'], ['importer', 'Importador'], ['vessel', 'Buque'],
   ['port', 'Puerto'], ['bl', 'BL']].forEach(function (c) {
    if (sel.some(function (o) { return clave(o[c[0]]) !== clave(base[c[0]]); })) difs.push(c[1]);
  });
  [['etd', 'ETD'], ['eta', 'ETA']].forEach(function (c) {
    if (sel.some(function (o) { return f(o[c[0]]) !== f(base[c[0]]); })) difs.push(c[1]);
  });
  var tabs = {};
  sel.forEach(function (o) { tabs[o._tab] = 1; });
  if (Object.keys(tabs).length > 1) difs.unshift('la pestaña');

  var destino = (S.adviceTo !== null && S.adviceTo !== undefined)
    ? S.adviceTo : (base.mailsCC || '');
  var msg = (S.adviceMsg && S.adviceMsg.barra) ? S.adviceMsg : null;
  var goods = sel.map(function (o) {
    return (o.tns || '') + ' Tns ' + (o.product || '');
  }).join(' / ');

  var h = '<div class="barra-flota"><div class="bf-in">';

  if (msg && msg.ok) {
    h += '<div class="ok-aviso" style="margin:0 0 10px;white-space:pre-line">' + esc(msg.texto) +
      (msg.url ? '\n<a href="' + esc(msg.url) + '" target="_blank" rel="noopener">Abrir Gmail</a>' : '') +
      '</div>';
  }
  if (msg && msg.error) {
    h += '<div class="error" style="margin:0 0 10px;white-space:pre-line">' + esc(msg.error) +
      (S.faltaGmail
        ? ' <button data-act="permiso-gmail" style="margin-top:8px">Autorizar Gmail</button>'
        : '') + '</div>';
  }

  // Se puede marcar en una pestaña y después filtrar por otra: conviene
  // decirlo, si no parece que la barra cuenta cosas que no están.
  var ocultos = sel.filter(function (o) {
    if (S.filtroTab && o._tab !== S.filtroTab) return true;
    if (S.filtroTipo && clave(o.tipo) !== S.filtroTipo) return true;
    return false;
  }).length;

  h += '<div class="bf-fila1">' +
    '<span class="bf-n">' + sel.length + (sel.length === 1 ? ' embarque' : ' embarques') + '</span>' +
    (ocultos ? '<span class="bf-ocultos">' + ocultos +
      (ocultos === 1 ? ' fuera del filtro actual' : ' fuera del filtro actual') + '</span>' : '') +
    '<span class="bf-goods">' + esc(goods) + '</span>' +
    '<button data-act="desmarcar">Quitar selección</button>' +
    '</div>';

  if (difs.length) {
    h += '<p class="bf-error">No se pueden combinar: no coincide ' + difs.join(', ') +
      '. El advice necesita que sean del mismo embarque.</p>';
  }

  h += '<div class="bf-fila2">' +
    '<label class="sr-solo" for="adv-to-barra">Destinatarios</label>' +
    '<input id="adv-to-barra" data-advto="1" value="' + esc(destino) + '" ' +
      'placeholder="destinatarios, separados por coma">' +
    '<span class="modos">' +
      [['en', 'EN'], ['es', 'ES']].map(function (o) {
        return '<button data-act="advidioma" data-v="' + o[0] + '" aria-pressed="' +
          ((S.adviceIdioma || 'en') === o[0]) + '">' + o[1] + '</button>';
      }).join('') +
    '</span>' +
    togglePeter() +
    '<button class="primario" data-act="adviceMulti"' +
      (difs.length || S.adviceEnviando ? ' disabled' : '') + '>' +
      (S.adviceEnviando ? 'Creando…' : ico('mail') + 'Crear borrador del shipment advice') +
      '</button>' +
    '</div></div></div>';

  return h;
}

function segmentoPestanas(evs) {
  // Con una sola pestaña de embarques no hay nada que separar, pero conviene
  // decirlo: suele ser que falta agregar las terrestres.
  if (S.fuentes.length < 2) {
    var otras = (S.pestanas && S.pestanas.pestanas || []).filter(function (p) {
      var k = clave(p.nombre);
      return (k.indexOf('carga') >= 0 || k.indexOf('embarque') >= 0) &&
             S.cfg.tabsEmb.indexOf(p.nombre) < 0;
    });
    return '<div class="aviso-tab">' +
      'Estás viendo solo <b>' + esc(S.fuentes[0] ? S.fuentes[0].tab : '—') + '</b>. ' +
      'Si querés ver también las otras cargas, agregalas.' +
      ' <button data-act="pestanas">Elegir pestañas</button></div>';
  }

  var cuenta = {};
  evs.forEach(function (x) { cuenta[x.emb._tab] = (cuenta[x.emb._tab] || 0) + 1; });

  var op = function (val, label, n) {
    return '<button data-act="ftab" data-t="' + esc(val) + '" aria-pressed="' +
      (S.filtroTab === val) + '">' + esc(label) +
      '<span class="cnt">' + n + '</span></button>';
  };

  return '<div class="segmento solo-movil">' +
    op('', 'Todo', evs.length) +
    S.fuentes.map(function (f) {
      return op(f.tab, nombreCorto(f.tab), cuenta[f.tab] || 0);
    }).join('') +
    '</div>';
}

// Dentro de una pestaña, separar por tipo de producto: la columna Tipo dice
// Maní, Expeller, Aceite. Solo aparece cuando hay más de uno para elegir.
function tiposDisponibles(evs) {
  var cuenta = {};
  evs.forEach(function (x) {
    if (S.filtroTab && x.emb._tab !== S.filtroTab) return;
    var t = String(x.emb.tipo || '').trim();
    if (!t) return;
    var k = clave(t);
    cuenta[k] = cuenta[k] || { n: 0, variantes: {} };
    cuenta[k].n++;
    cuenta[k].variantes[t] = (cuenta[k].variantes[t] || 0) + 1;
  });
  return Object.keys(cuenta).map(function (k) {
    var v = cuenta[k];
    // "Maní" y "MANI" son el mismo tipo: se muestra la escritura más usada.
    var etiq = Object.keys(v.variantes).sort(function (a, b) {
      return v.variantes[b] - v.variantes[a];
    })[0];
    return { clave: k, label: etiq, n: v.n };
  }).sort(function (a, b) { return b.n - a.n; });
}

// Título grande, como el "Large Title" de iOS: ancla la pantalla y hace que
// el contenido respire antes de empezar.
function tituloVista() {
  var t = { control: 'Control', carga: 'Cargas', contratos: 'Contratos' }[S.vista] || '';
  var sub = '';
  if (S.vista === 'carga' && S.datos) {
    sub = S.modo === 'exportadores'
      ? 'Quién está embarcando y para quién'
      : S.datos.filas.length + ' embarques';
    if (S.filtroTab) sub += ' · ' + nombreCorto(S.filtroTab);
  } else if (S.vista === 'contratos') {
    sub = S.contratos.size + ' contratos';
  } else if (S.vista === 'control' && S.datos) {
    sub = 'Lo que necesita atención';
  }
  var v = VISTAS.filter(function (x) { return x.id === S.vista; })[0];
  return '<div class="titulo-vista"><h1>' +
    (v ? '<span class="t-emoji">' + v.emoji + '</span>' : '') + esc(t) + '</h1>' +
    (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
}

function segmentoTipos(evs) {
  var tipos = tiposDisponibles(evs);
  if (tipos.length < 2) return '';

  var total = tipos.reduce(function (a, t) { return a + t.n; }, 0);
  return '<div class="segmento sub">' +
    '<button data-act="ftipo" data-t="" aria-pressed="' + (!S.filtroTipo) + '">' +
      'Todos<span class="cnt">' + total + '</span></button>' +
    tipos.map(function (t) {
      return '<button data-act="ftipo" data-t="' + esc(t.clave) + '" aria-pressed="' +
        (S.filtroTipo === t.clave) + '">' + esc(t.label) +
        '<span class="cnt">' + t.n + '</span></button>';
    }).join('') + '</div>';
}

// "Embarques maritimos" -> "Marítimo". Nombres largos rompen el segmentado.
function nombreCorto(tab) {
  var k = clave(tab);
  if (k.indexOf('mariti') >= 0) return 'Marítimo';
  if (k.indexOf('terrestre') >= 0) return 'Terrestre';
  return tab.length > 18 ? tab.slice(0, 17) + '…' : tab;
}

    LOGO_SVG + '<b>Embarques</b>' +
    '<span class="tm-acc">' +
      (S.guardando > 0 ? '<span class="tm-guardando">Guardando…</span>' : '') +
      '<button data-act="recargar" aria-label="Actualizar"' +
        (S.cargando ? ' disabled' : '') + '>' + ico('refresh') + '</button>' +
      '<button data-act="pestanas" aria-label="Configuración">' + ico('gear') + '</button>' +
    '</span></div></header>';
}

function tabBarInferior() {

  return '<nav class="tabbar" aria-label="Secciones">' +
    VISTAS.map(function (v) {

        '<span class="tb-ico">' + v.emoji + badge + '</span>' +
        '<span class="tb-l">' + v.label + '</span></button>';
