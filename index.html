               ['ETA', d.eta], ['Embarcador', d.exporter], ['Mercadería', d.goods]],
      adjunto: 'Adjunto encontrarán las fotos de los lotes y el draft del B/L de este embarque.',
      cierre: 'Por favor, confírmenlos.'
    };
  }
  return {
    subject: asuntoEn,
    saludo: 'Dear,',
    intro: 'Let me inform you about the following shipment from ' + d.exporter + ' to ' + d.importer,
    cabecera: [['To', d.importer], [varios ? 'Contracts' : 'Contract', nums]],
    referencia: refEn,
    campos: [['Vessel', d.vessel], ['P.O.D.', d.port], ['ETD', d.etd],
             ['ETA', d.eta], ['Shipper', d.exporter], ['Goods', d.goods]],
    adjunto: 'In the attachment you can check the picture of the lots and B/L Draft for this shipment',
    cierre: 'Please, confirm them!'
  };
}

function cuerpoPlano(t) {
  var bloque = function (pares) {
    return pares.map(function (p) { return p[0] + ': ' + p[1]; }).join('\n');
  };
  return t.saludo + '\n\n' + t.intro + '\n\n' + bloque(t.cabecera) + '\n\n' +
    t.referencia + '\n\n' + bloque(t.campos) + '\n\n' + t.adjunto + '\n\n' + t.cierre;
}

function cuerpoHtml(t, firma) {
  var bloque = function (pares) {
    return pares.map(function (p) {
      return '<b>' + esc(p[0]) + ':</b> ' + esc(p[1]);
    }).join('<br>');
  };
  return esc(t.saludo) + '<br><br>' + esc(t.intro) + '<br><br>' +
    bloque(t.cabecera) + '<br><br>' + esc(t.referencia) + '<br><br>' +
    bloque(t.campos) + '<br><br>' + esc(t.adjunto) + '<br><br>' + esc(t.cierre) +
    (firma ? '<br><br>' + firma : '');
}

// La firma que cada uno tiene puesta en su Gmail.
async function firmaDelUsuario() {
  try {
    var r = await api('https://gmail.googleapis.com/gmail/v1/users/me/settings/sendAs');
    var d = (r.sendAs || []).filter(function (x) { return x.isDefault; })[0];
    return (d && d.signature) || '';
  } catch (e) { return ''; }
}

// base64url con soporte de acentos.
function b64url(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function armarMime(para, cc, asunto, texto, html) {
  var lim = 'b' + Date.now();
  var enc = function (v) {
    // Asunto con acentos: se codifica para que no se rompa en ningún cliente.
    return /[^\x00-\x7F]/.test(v)
      ? '=?UTF-8?B?' + btoa(String.fromCharCode.apply(null,
          new TextEncoder().encode(v))) + '?=' : v;
  };
  return [
    'To: ' + para,
    cc ? 'Cc: ' + cc : '',
    'Subject: ' + enc(asunto),
    'MIME-Version: 1.0',
    'Content-Type: multipart/alternative; boundary="' + lim + '"',
    '',
    '--' + lim,
    'Content-Type: text/plain; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    btoa(String.fromCharCode.apply(null, new TextEncoder().encode(texto))),
    '',
    '--' + lim,
    'Content-Type: text/html; charset="UTF-8"',
    'Content-Transfer-Encoding: base64',
    '',
    btoa(String.fromCharCode.apply(null, new TextEncoder().encode(html))),
    '',
    '--' + lim + '--'
  ].filter(function (l, i) { return l !== '' || i > 3; }).join('\r\n');
}

/* --- Alta de embarques -----------------------------------------------------
   Se agrega una fila al final de la pestaña elegida, escribiendo solo las
   columnas que esa pestaña tiene. Los contratos salen de los ya cargados, así
   el nuevo embarque queda atado a su contrato desde el principio.
   -------------------------------------------------------------------------- */

var CAMPOS_ALTA_EMB = [
  ['exporter', 'Exportador', 'combo-exp'],
  ['importer', 'Importador', 'combo-imp'],
  ['contract', 'Contrato', 'combo-ctr'],
  ['product', 'Producto', 'combo-prod'],
  ['tipo', 'Tipo', 'combo-tipo'],
  ['tns', 'Toneladas', 'number'],
  ['price', 'Precio USD/tn', 'number'],
  ['etd', 'ETD', 'date'],
  ['eta', 'ETA', 'date'],
  ['port', 'Destino', 'text'],
  ['vessel', 'Buque', 'text'],
  ['shippingLine', 'Naviera', 'text'],
  ['lots', 'Lotes', 'text'],
  ['containers', 'Contenedores', 'text'],
  ['booking', 'Booking', 'text'],
  ['incoterm', 'Incoterm', 'text'],
  ['mailsCC', 'Mails CC', 'text']
];

/* Las tres listas del alta se condicionan entre sí:
   - elegido el contrato, exportador, importador, producto, tipo y precio salen
     de él, que es lo que evita tipear lo que la planilla ya sabe;
   - elegidos exportador e importador, solo se ofrecen SUS contratos;
   - elegido el contrato, solo sus productos (el del contrato más los que ya se
     hayan embarcado contra él). */

/* El contrato no tiene columna de puerto, pero el incoterm lo lleva adentro:
   "CIF Qingdao" es incoterm + destino. Se separa por la lista de incoterms
   conocidos, no por "las tres primeras letras": si no, "Los Angeles" quedaría
   como "Angeles". */
var INCOTERMS = ['EXW','FCA','FAS','FOB','CFR','CIF','CPT','CIP','DAP','DPU',
                 'DDP','DAT','DES','DEQ','DAF','DDU','CNF'];

function partirIncoterm(txt) {
  var t = String(txt || '').trim();
  if (!t) return null;
  var m = t.match(/^([A-Za-z&]{3})[\s.\-]+(.+)$/);
  if (m && INCOTERMS.indexOf(m[1].toUpperCase()) >= 0) {
    return { codigo: m[1].toUpperCase(), lugar: m[2].trim() };
  }
  // Solo el código, sin lugar ("FAS").
  if (INCOTERMS.indexOf(t.toUpperCase()) >= 0) return { codigo: t.toUpperCase(), lugar: '' };
  // Sin código: es todo destino ("ANTWERP", "Puesto El Espinillal").
  return { codigo: '', lugar: t };
}

function contratosDe(exp, imp) {
  var out = [];
  var kExp = clave(exp), kImp = clave(imp);
  S.contratos.forEach(function (c, k) {
    if (kExp && clave(c.exportador) !== kExp) return;
    if (kImp && clave(c.importador) !== kImp) return;
    out.push(k);
  });
  // Los más nuevos primero: es lo que se está cargando.
  return out.sort(function (x, y) { return y.localeCompare(x, 'es', { numeric: true }); });
}

function productosDe(contrato) {
  if (!contrato) return null;
  var c = S.contratos.get(String(contrato).trim());
  var out = [], vistos = {};
  var sumar = function (p) {
    var t = String(p || '').trim();
    if (!t || vistos[clave(t)]) return;
    vistos[clave(t)] = 1; out.push(t);
  };
  if (c) sumar(c.producto);
  // Un contrato se parte en varios embarques, que pueden tener productos
  // distintos: se suman los ya usados.
  (S.datos.filas || []).forEach(function (o) {
    if (clave(o.contract) === clave(contrato)) sumar(o.product);
  });
  return out.length ? out : null;
}

// Al elegir un contrato se copia lo que ya sabe, sin pisar lo que se escribió.
function aplicarContrato(nombre) {
  var c = S.contratos.get(String(nombre).trim());
  if (!c) return;
  var a = S.altaEmb;
  if (!a.exporter && c.exportador) a.exporter = String(c.exportador).trim();
  if (!a.importer && c.importador) a.importer = String(c.importador).trim();
  if (!a.tipo && c.tipo) a.tipo = String(c.tipo).trim();
  if (!a.price && c.precio) a.price = c.precio;

  // El destino y el incoterm salen de la columna Incoterm del contrato.
  var inc = partirIncoterm(c.incoterm);
  if (inc) {
    if (!a.port && inc.lugar) a.port = inc.lugar;
    if (!a.incoterm && inc.codigo) a.incoterm = inc.codigo;
  }
  var prods = productosDe(nombre);
  if (!a.product && prods && prods.length === 1) a.product = prods[0];
  a._desdeContrato = true;
}

async function crearEmbarque() {
  var a = S.altaEmb;
  if (!a || !a.tab) return;
  var src = S.fuentes.filter(function (f) { return f.tab === a.tab; })[0];
  if (!src) { S.altaEmbError = 'No encuentro esa pestaña.'; return pintar(); }

  var req = ['exporter', 'importer', 'contract', 'product', 'tns'];
  var faltan = req.filter(function (c) { return !a[c] && src.mapa[c] !== undefined; });
  if (faltan.length) {
    S.altaEmbError = 'Falta: ' + faltan.map(function (c) { return CAMPOS[c].label; }).join(', ');
    return pintar();
  }

  S.creandoEmb = true; S.altaEmbError = null; pintar();
  try {
    // Va justo arriba de la fila TOTAL, para quedar dentro del bloque de datos
    // y que los totales la cuenten. Se relee la hoja: la posición cambia cada
    // vez que alguien agrega o reordena.
    var filaTotal = await filaTotalDe(a.tab);
    var fila;
    if (filaTotal) {
      fila = filaTotal;
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          requests: [{
            insertDimension: {
              range: { sheetId: src.sheetId, dimension: 'ROWS',
                       startIndex: fila - 1, endIndex: fila },
              inheritFromBefore: true
            }
          }]
        })
      });
    } else {
      // Sin fila TOTAL, al final de los datos.
      fila = (src.filas.length
        ? Math.max.apply(null, src.filas.map(function (f) { return f._fila; }))
        : 1) + 1;
    }

    var reqs = [];

    // El Total de la planilla es una fórmula (=Precio*Toneladas), no un número.
    // Se escribe la fórmula, no el resultado: así, cuando llega la factura y
    // las toneladas cambian, el total se recalcula solo.
    if (src.mapa.total !== undefined && src.mapa.price !== undefined &&
        src.mapa.tns !== undefined) {
      reqs.push({
        updateCells: {
          range: { sheetId: src.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: src.mapa.total, endColumnIndex: src.mapa.total + 1 },
          rows: [{ values: [{ userEnteredValue: { formulaValue:
            '=' + letraCol(src.mapa.price) + fila + '*' + letraCol(src.mapa.tns) + fila } }] }],
          fields: 'userEnteredValue'
        }
      });
    }

    CAMPOS_ALTA_EMB.forEach(function (c) {
      var campo = c[0];
      if (a[campo] === undefined || a[campo] === '') return;
      var idx = src.mapa[campo];
      if (idx === undefined) return;
      var val = a[campo];
      if (c[2] === 'number') val = parseFloat(val);
      if (c[2] === 'date') {
        var dv = normFecha(val);
        if (!esFecha(dv)) return;      // fecha ilegible: mejor no escribir nada
        val = dv;
      }
      reqs.push({
        updateCells: {
          range: { sheetId: src.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: idx, endColumnIndex: idx + 1 },
          rows: [{ values: [{ userEnteredValue: aValorSheets(val) }] }],
          fields: 'userEnteredValue'
        }
      });
    });

    // Los semáforos arrancan en rojo: nada está hecho todavía.
    SEMAFOROS.forEach(function (c) {
      var idx = src.mapa[c];
      if (idx === undefined || src.noAplica[c]) return;
      reqs.push({
        repeatCell: {
          range: { sheetId: src.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: idx, endColumnIndex: idx + 1 },
          cell: { userEnteredFormat: { backgroundColor: COLORES.pendiente } },
          fields: 'userEnteredFormat.backgroundColor'
        }
      });
    });

    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: reqs })
    });

    S.avisoOk = 'Carga agregada en "' + a.tab + '", fila ' + fila +
      (filaTotal ? ' (arriba del TOTAL)' : '') + '.';
    S.altaEmb = null;
    await cargarTodo();
  } catch (e) {
    S.altaEmbError = 'No se pudo guardar: ' + e.message;
  } finally {
    S.creandoEmb = false; pintar();
  }
}

function formAltaEmb() {
  var a = S.altaEmb;
  var src = S.fuentes.filter(function (f) { return f.tab === a.tab; })[0];
  if (!src) return '';
  var L = S.listas || {};
  var contratos = contratosDe(a.exporter, a.importer);

  var listaDe = {
    'combo-exp': L.exportadores || [],
    'combo-imp': L.importadores || [],
    'combo-ctr': contratos,
    'combo-prod': productosDe(a.contract) || L.productos || [],
    'combo-tipo': L.tipos || []
  };

  var campos = CAMPOS_ALTA_EMB.filter(function (c) {
    return src.mapa[c[0]] !== undefined && !src.noAplica[c[0]];
  }).map(function (c) {
    var campo = c[0], label = c[1], tipo = c[2], val = a[campo] || '';
    if (listaDe[tipo]) {
      var ops = listaDe[tipo];
      var ok = ops.some(function (o) { return clave(o) === clave(val); });
      // El contrato y el producto pueden ser nuevos; cliente y proveedor no.
      var libre = (tipo === 'combo-ctr' || tipo === 'combo-prod');
      return comboGen('e-' + campo, campo, label, ops, val, ok, 'emb', libre);
    }
    if (tipo === 'date') return campoFecha('e-' + campo, 'data-aemb', campo, label, val);
    return '<div class="campo"><label for="e-' + campo + '">' + label + '</label>' +
      '<input id="e-' + campo + '" data-aemb="' + campo + '" type="' +
      (tipo === 'number' ? 'number' : 'text') +
      '" value="' + esc(val) + '"></div>';
  }).join('');

  var pestanas = S.fuentes.map(function (f) {
    return '<button data-act="altaemb-tab" data-t="' + esc(f.tab) + '" aria-pressed="' +
      (a.tab === f.tab) + '">' + esc(nombreCorto(f.tab)) + '</button>';
  }).join('');

  return '<div class="alta">' +
    '<div class="alta-cab"><h3>Nueva carga</h3>' +
      '<button data-act="altaemb-cerrar">Cancelar</button></div>' +
    (S.altaEmbError ? '<div class="error">' + esc(S.altaEmbError) + '</div>' : '') +
    (S.fuentes.length > 1 ? '<div class="chips" style="margin-bottom:18px">' + pestanas + '</div>' : '') +
    (a.contract && S.contratos.get(String(a.contract).trim())
      ? '<p class="alta-nota">' + ico('check') + 'Datos tomados del contrato ' +
        esc(a.contract) + '. Se pueden cambiar.</p>'
      : (a.exporter || a.importer)
        ? '<p class="alta-nota tenue">' + contratos.length +
          (contratos.length === 1 ? ' contrato' : ' contratos') + ' de ' +
          esc([a.exporter, a.importer].filter(Boolean).join(' → ')) + '</p>'
        : '') +
    '<div class="alta-grid">' + campos + '</div>' +
    '<div class="alta-acc">' +
      '<button class="primario" data-act="altaemb-guardar"' +
        (S.creandoEmb ? ' disabled' : '') + '>' +
        (S.creandoEmb ? 'Guardando…' : ico('check') + 'Agregar carga') + '</button>' +
      '<span class="ayuda">Se inserta arriba de la fila TOTAL de «' + esc(a.tab) +
        '». Docs, Fotos y T.R. arrancan en rojo.</span>' +
    '</div></div>';
}

/* --- Pasar una carga a "A facturar" ----------------------------------------
   Es la mudanza que hoy se hace a mano con cortar y pegar: la fila sale de
   Marítimos o Terrestres y entra arriba del TOTAL en "A facturar".

   No se copia la fila cruda: los encabezados difieren entre pestañas
   ("Exporter" vs "Exportador", "Port" vs "Destino"), así que se pasa campo por
   campo usando el mapa de cada una. Si mañana alguien mueve una columna, sigue
   entrando donde corresponde.
   -------------------------------------------------------------------------- */

var AVISO_FACTURAR = 'pia@latinutsa.com';

/* Mover una fila de una pestaña a otra: lo mismo que cortar y pegar a mano.
   No se guarda ninguna copia: la fila se escribe en destino y se borra de
   origen, y para volverla se hace la operación inversa cuando uno quiera.

   Los semáforos viven en el color de la celda, y "A facturar" también tiene
   Docs, Fotos y T.R., así que los colores viajan con la fila. Sin eso el
   movimiento perdería el estado. */
var CAMPOS_MUDANZA = ['exporter', 'importer', 'contract', 'product', 'tipo',
  'price', 'tns', 'etd', 'anio', 'eta', 'port', 'vessel', 'shippingLine',
  'lots', 'containers', 'bl', 'booking', 'invoice', 'docs', 'pics', 'tr',
  'guia', 'commission', 'status', 'incoterm', 'mailsCC', 'pagoEstimado', 'nota'];

function resumenMudanza(emb) {
  var tn = normNum(emb.tns), pr = normNum(emb.price);
  return {
    quien: (emb.exporter || '') + ' → ' + (emb.importer || ''),
    contrato: emb.contract || '', bl: emb.bl || '',
    tns: tn, precio: pr, total: (tn && pr) ? tn * pr : normNum(emb.total),
    producto: emb.product || '', factura: emb.invoice || '',
    desde: emb._tab, fila: emb._fila
  };
}

/* El corazón: mueve una fila entre dos pestañas.
   `origen`  = { tab, sheetId, mapa, fila, celdas, colores }
   `destino` = nombre de la pestaña. */
async function moverFila(origen, destinoTab) {
  var hd = await leerHoja(S.cfg.sheetId, destinoTab);
  var mapaD = detectar(hd.encabezados, CAMPOS).mapa;

  var filaTotal = await filaTotalDe(destinoTab);
  var fila = filaTotal || (hd.filas.length
    ? Math.max.apply(null, hd.filas.map(function (f) { return f.fila; })) + 1
    : (hd.filaEncabezado || 1) + 1);

  // 1. Hueco arriba del TOTAL.
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: [{
      insertDimension: {
        range: { sheetId: hd.sheetId, dimension: 'ROWS',
                 startIndex: fila - 1, endIndex: fila },
        inheritFromBefore: true
      }
    }] })
  });

  // 2. Campo por campo, porque los encabezados no se llaman igual en las dos
  //    pestañas ("Exporter" / "Exportador", "Port" / "Destino").
  var reqs = [];
  CAMPOS_MUDANZA.forEach(function (campo) {
    var iO = origen.mapa[campo], iD = mapaD[campo];
    if (iO === undefined || iD === undefined) return;

    var v = origen.celdas[iO];
    if (v !== null && v !== undefined && v !== '') {
      reqs.push({
        updateCells: {
          range: { sheetId: hd.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: iD, endColumnIndex: iD + 1 },
          rows: [{ values: [{ userEnteredValue: aValorSheets(v) }] }],
          fields: 'userEnteredValue'
        }
      });
    }
    // El color, que en Docs, Fotos y T.R. ES el dato.
    var bg = origen.colores ? origen.colores[iO] : null;
    if (bg) {
      reqs.push({
        updateCells: {
          range: { sheetId: hd.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                   startColumnIndex: iD, endColumnIndex: iD + 1 },
          cell: { userEnteredFormat: { backgroundColor: bg } },
          fields: 'userEnteredFormat.backgroundColor'
        }
      });
    }
  });

  // 3. El Total, como fórmula.
  if (mapaD.total !== undefined && mapaD.price !== undefined && mapaD.tns !== undefined) {
    reqs.push({
      updateCells: {
        range: { sheetId: hd.sheetId, startRowIndex: fila - 1, endRowIndex: fila,
                 startColumnIndex: mapaD.total, endColumnIndex: mapaD.total + 1 },
        rows: [{ values: [{ userEnteredValue: { formulaValue:
          '=' + letraCol(mapaD.price) + fila + '*' + letraCol(mapaD.tns) + fila } }] }],
        fields: 'userEnteredValue'
      }
    });
  }

  // 4. Borrar la de origen.
  reqs.push({
    deleteDimension: {
      range: { sheetId: origen.sheetId, dimension: 'ROWS',
               startIndex: origen.fila - 1, endIndex: origen.fila }
    }
  });

  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: reqs })
  });

  return { tab: destinoTab, fila: fila };
}

async function pasarAFacturar(id, avisar, enviar) {
  var emb = filaPorId(id);
  if (!emb) return;
  var src = fuenteDe(emb);
  var destino = (S.fuentesFact || [])[0];
  if (!destino) { S.factError = 'No hay ninguna pestaña de "A facturar" configurada.'; return pintar(); }

  S.pasando = id; S.factError = null; pintar();
  try {
    var res = resumenMudanza(emb);
    await moverFila({
      tab: emb._tab, sheetId: emb._sheetId, mapa: src.mapa,
      fila: emb._fila, celdas: emb._celdas, colores: emb._colores
    }, destino.tab);

    var aviso = '';
    if (avisar) {
      try { aviso = await avisarFacturar(res, destino.tab, enviar); }
      catch (e2) { aviso = ' El mail no salió: ' + e2.message; }
    }

    S.avisoOk = 'Pasada a "' + destino.tab + '" y quitada de "' + res.desde + '".' + aviso;
    S.ultimoMov = { desde: res.desde, quien: res.quien, contrato: res.contrato, bl: res.bl };
    S.sel = null; S.pasar = null;
    await cargarTodo();
  } catch (e) {
    S.factError = 'No se pudo pasar: ' + e.message;
  } finally {
    S.pasando = null; pintar();
  }
}

// La vuelta: la misma operación, al revés. Se puede hacer cuando sea.
async function devolverDeFacturar(nroFila, destinoTab) {
  var fact = (S.fuentesFact || [])[0];
  if (!fact) return;
  S.pasando = 'f' + nroFila; S.factError = null; pintar();
  try {
    // Se relee: la fila pudo haberse movido desde la última carga.
    var hf = await leerHoja(S.cfg.sheetId, fact.tab);
    var mapaF = detectar(hf.encabezados, CAMPOS).mapa;
    var cruda = hf.filas.filter(function (f) { return f.fila === nroFila; })[0];
    if (!cruda) throw new Error('Esa fila ya no está donde estaba. Actualizá y probá de nuevo.');

    await moverFila({
      tab: fact.tab, sheetId: hf.sheetId, mapa: mapaF,
      fila: nroFila, celdas: cruda.celdas, colores: cruda.colores
    }, destinoTab);

    S.avisoOk = 'Devuelta a "' + destinoTab + '".';
    S.ultimoMov = null;
    await cargarTodo();
  } catch (e) {
    S.factError = 'No se pudo devolver: ' + e.message;
  } finally {
    S.pasando = null; pintar();
  }
}

// Aviso a quien factura. Por defecto queda como borrador: el mail sale cuando
// la persona lo decide, no por apretar un botón de la app.
async function avisarFacturar(res, tabDestino, enviar) {
  var asunto = 'A facturar: ' + res.quien + ' — ' + res.contrato +
    (res.bl ? ' — BL ' + res.bl : '');

  var lineas = [
    'Se pasó a "' + tabDestino + '" el siguiente embarque:',
    '',
    'Exportador y cliente: ' + res.quien,
    'Contrato: ' + res.contrato,
    'Producto: ' + res.producto,
    'Toneladas: ' + (res.tns ? fmtNum(res.tns) : '—'),
    'Precio: ' + (res.precio ? 'USD ' + fmtNum(res.precio) + '/tn' : '—'),
    'Total: ' + (res.total ? 'USD ' + fmtNum(res.total) : '—'),
    res.bl ? 'BL: ' + res.bl : '',
    res.factura ? 'Factura: ' + res.factura : '',
    '',
    'Venía de "' + res.desde + '".',
    'Lo pasó ' + (S.usuario ? S.usuario.email : 'alguien') + ' desde el control de embarques.'
  ];

  var texto = lineas.join('\n');
  var html = lineas.map(function (l) { return l === '' ? '<br>' : esc(l); }).join('<br>');

  var firma = await firmaDelUsuario();
  var mime = armarMime(AVISO_FACTURAR, '', asunto, texto,
                       html + (firma ? '<br><br>' + firma : ''));

  if (enviar) {
    await api('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ raw: b64url(mime) })
    });
    return ' Aviso enviado a ' + AVISO_FACTURAR + '.';
  }
  await api('https://gmail.googleapis.com/gmail/v1/users/me/drafts', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: { raw: b64url(mime) } })
  });
  return ' Borrador del aviso a ' + AVISO_FACTURAR + ' listo en tu Gmail.';
}

// De dónde vino, para proponer el destino: si tiene BL o contenedores es
// marítima; si no, terrestre.
function tabProbable(o) {
  var tabs = (S.fuentes || []).map(function (f) { return f.tab; });
  if (!tabs.length) return '';
  var maritima = !!(o.bl || o.containers || o.vessel);
  var buscar = maritima ? 'mariti' : 'terrestre';
  return tabs.filter(function (t) { return clave(t).indexOf(buscar) >= 0; })[0] || tabs[0];
}

var LS_PLANTILLA = 'embarques:plantilla';

function plantillaContrato() {
  var b64 = null;
  try { b64 = localStorage.getItem(LS_PLANTILLA); } catch (e) {}
  b64 = b64 || PLANTILLA_CONTRATO_B64;
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// --- Motor: completa la plantilla (el mismo que se probó por separado) -----
  function escXmlDoc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Encuentra el elemento de bloque (<w:tr> o <w:p>) que contiene una posición.
  function envolvente(xml, pos, etiqueta) {
    var abre1 = xml.lastIndexOf('<' + etiqueta + ' ', pos);
    var abre2 = xml.lastIndexOf('<' + etiqueta + '>', pos);
    var ini = Math.max(abre1, abre2);
    var cierre = '</' + etiqueta + '>';
    var fin = xml.indexOf(cierre, pos) + cierre.length;
    return { ini: ini, fin: fin, txt: xml.slice(ini, fin) };
  }

  // Repite el bloque que contiene {{marca}} una vez por elemento de la lista.
  function repetir(xml, marca, etiqueta, lista, relleno) {
    var i = xml.indexOf('{{' + marca + '}}');
    if (i < 0) return xml;
    var b = envolvente(xml, i, etiqueta);
    var copias = (lista || []).map(function (item) { return relleno(b.txt, item); });
    return xml.slice(0, b.ini) + copias.join('') + xml.slice(b.fin);
  }

  function reemplazar(txt, datos) {
    return txt.replace(/\{\{(\w+)\}\}/g, function (_, k) {
      return escXmlDoc(datos[k] == null ? '' : datos[k]);
    });
  }

  // Si un dato opcional está vacío, se va el párrafo entero: mejor que dejar
  // un "VAT Nr:" colgando sin número.
  function quitarVacios(xml, datos, opcionales) {
    opcionales.forEach(function (k) {
      if (datos[k] && String(datos[k]).trim()) return;
      var i;
      while ((i = xml.indexOf('{{' + k + '}}')) >= 0) {
        var b = envolvente(xml, i, 'w:p');
        xml = xml.slice(0, b.ini) + xml.slice(b.fin);
      }
    });
    return xml;
  }

  var OPCIONALES = ['buyer_vat', 'buyer_contacto', 'buyer_email',
                    'seller_contacto', 'seller_email',
                    'cons_taxid', 'notif_taxid'];

  /* datos: {
       contrato, fecha_larga, buyer_*, seller_*, cons_*, notif_*,
       origen, packing, incoterm, pago, embarque,
       productos: [{ producto, cantidad, precio, total }],
       total_contrato, cantidad_total,
       docs_izq: [...], docs_der: [...]
     } */
  async function completar(JSZip, plantilla, datos) {
    var zip = await JSZip.loadAsync(plantilla);
    var xml = await zip.file('word/document.xml').async('string');

    xml = repetir(xml, 'p_producto', 'w:tr', datos.productos, function (fila, p) {
      return reemplazar(fila, {
        p_producto: p.producto, p_cantidad: p.cantidad,
        p_precio: p.precio, p_total: p.total
      });
    });
    xml = repetir(xml, 'doc_izq', 'w:p', datos.docs_izq, function (par, d) {
      return reemplazar(par, { doc_izq: d });
    });
    xml = repetir(xml, 'doc_der', 'w:p', datos.docs_der, function (par, d) {
      return reemplazar(par, { doc_der: d });
    });

    xml = quitarVacios(xml, datos, OPCIONALES);
    xml = reemplazar(xml, datos);
    zip.file('word/document.xml', xml);

    // Los mails son hipervínculos: el destino también lleva el marcador.
    var rp = 'word/_rels/document.xml.rels';
    var rels = await zip.file(rp).async('string');
    rels = rels.replace(/\{\{(\w+)\}\}/g, function (_, k) { return escXmlDoc(datos[k] || ''); });
    zip.file(rp, rels);

    return zip;
  }

  // --- Formatos -------------------------------------------------------------

  var MESES = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
               'August', 'September', 'October', 'November', 'December'];

  // 7 -> "7th", 1 -> "1st", 22 -> "22nd", 11/12/13 -> "th".
  function ordinal(n) {
    var r10 = n % 10, r100 = n % 100;
    if (r100 >= 11 && r100 <= 13) return n + 'th';
    return n + (r10 === 1 ? 'st' : r10 === 2 ? 'nd' : r10 === 3 ? 'rd' : 'th');
  }

  function fechaLarga(d) {
    return MESES[d.getUTCMonth()] + ' ' + ordinal(d.getUTCDate()) + ', ' + d.getUTCFullYear();
  }

  // 39375 -> "39,375" (formato inglés, como en la plantilla).
  function miles(n, dec) {
    var v = Number(n);
    if (!isFinite(v)) return '';
    return v.toLocaleString('en-US', {
      minimumFractionDigits: dec || 0, maximumFractionDigits: dec == null ? 2 : dec
    });
  }



/* --- Base de empresas -------------------------------------------------------
   Los datos de cada empresa para el contrato: dirección, VAT, contacto, mail.
   Hoy están dispersos, así que la base se arma de a poco: la primera vez que
   se genera un contrato para una empresa se completan sus datos, y quedan
   guardados para la próxima. Vive en una pestaña "Empresas" de la planilla.
   -------------------------------------------------------------------------- */

var HOJA_EMPRESAS = 'Empresas';
var ENC_EMPRESAS = ['Empresa', 'Dirección', 'VAT / Tax ID', 'Contacto', 'Email', 'País'];

async function cargarEmpresas() {
  S.empresas = new Map();
  S.hayHojaEmpresas = false;
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    S.hayHojaEmpresas = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(HOJA_EMPRESAS);
    });
    if (!S.hayHojaEmpresas) return;
    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_EMPRESAS + "'!A1:F3000"));
    var filas = r.values || [];
    filas.slice(1).forEach(function (f, i) {
      var nom = String(f[0] || '').trim();
      if (!nom) return;
      S.empresas.set(clave(nom), {
        nombre: nom, direccion: f[1] || '', vat: f[2] || '',
        contacto: f[3] || '', email: f[4] || '', pais: f[5] || '',
        fila: i + 2
      });
    });
  } catch (e) { /* sin base, los campos se llenan a mano */ }
}

// Crea la pestaña con los nombres que ya están en la base de datos, así solo
// falta completar los datos y no tipear las 500 empresas.
async function crearHojaEmpresas() {
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: [{ addSheet: { properties: {
      title: HOJA_EMPRESAS, gridProperties: { frozenRowCount: 1 } } } }] })
  });
  var L = S.listas || {};
  var nombres = [], vistos = {};
  (L.exportadores || []).concat(L.importadores || []).forEach(function (n) {
    var k = clave(n);
    if (!k || vistos[k]) return;
    vistos[k] = 1; nombres.push(n);
  });
  nombres.sort(function (a, b) { return a.localeCompare(b, 'es'); });
  var valores = [ENC_EMPRESAS].concat(nombres.map(function (n) {
    var cod = paisDeEmpresa(n);
    var pais = cod && PAISES[cod] ? PAISES[cod].split(' ').slice(1).join(' ') : '';
    return [n, '', '', '', '', pais];
  }));
  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + HOJA_EMPRESAS + "'!A1") + '?valueInputOption=RAW', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: valores })
  });
  await cargarEmpresas();
  return nombres.length;
}

// Guarda los datos de una empresa: actualiza su fila o agrega una nueva.
async function guardarEmpresa(e) {
  if (!S.hayHojaEmpresas) await crearHojaEmpresas();
  var fila = [e.nombre, e.direccion || '', e.vat || '', e.contacto || '', e.email || '', e.pais || ''];
  var ya = S.empresas.get(clave(e.nombre));
  if (ya) {
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_EMPRESAS + "'!A" + ya.fila) + '?valueInputOption=RAW', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [fila] })
    });
  } else {
    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_EMPRESAS + "'!A1") +
      ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [fila] })
    });
  }
  await cargarEmpresas();
}

function datosEmpresa(nombre) {
  var e = S.empresas && S.empresas.get(clave(nombre));
  return e ? Object.assign({}, e)
           : { nombre: nombre || '', direccion: '', vat: '', contacto: '', email: '', pais: '' };
}

/* --- Generador del contrato -------------------------------------------------
   Casi todo sale del contrato que ya está cargado: número, partes, productos,
   precios, incoterm, pago, embarque, packing. Lo que falta —los datos de cada
   empresa— sale de la base, y si no está se completa acá y se guarda.
   -------------------------------------------------------------------------- */

var DOCS_ESTANDAR = [
  'Commercial Invoice',
  '3/3 Bill of Lading and/or telex release. Shipper/seller guarantees (a minimum) of 14 days free from demurrage, detention, quay-rent, etc. at port of destination',
  'Packing List (stating gross and netweight, container number and lot number, goods description to be equal to the sales contract)',
  'Phytosanitary Certificate',
  'Certificate of Weight',
  'Quality Certificate',
  'Certificate of Aflatoxin Sampling (B1, B2, G1, G2) per EU Directive',
  'Certificate of Cleanliness & Condition of Container',
  'Fumigation Certificate',
  'Certificate of Origin'
];

// El contrato dice el país del exportador; en el documento va en inglés.
var PAIS_EN = { AR: 'Argentina', UY: 'Uruguay', PY: 'Paraguay', BR: 'Brazil',
                BO: 'Bolivia', CL: 'Chile', US: 'United States', CN: 'China' };

function abrirGenerador(nombre) {
  var ref = S.ctrEditables.get(nombre);
  var ctr = S.contratos.get(nombre) || {};
  var filas = ref ? filasDelContrato(ref) : [];
  var g = function (fr, campo) {
    var i = fr.mapa[campo];
    var v = i === undefined ? '' : fr.celdas[i];
    return v === null || v === undefined ? '' : v;
  };
  var base = filas[0];
  var dato = function (campo, deCtr) {
    if (base) { var v = g(base, campo); if (v !== '') return v; }
    return ctr[deCtr || campo] || '';
  };

  var hoy = new Date();
  var anio = hoy.getFullYear();
  var incoterm = String(dato('incoterm') || '').trim().toUpperCase();

  // Una línea por producto: justamente las filas del contrato.
  var productos = (filas.length ? filas : [null]).map(function (fr) {
    var prod = fr ? g(fr, 'producto') : (ctr.producto || '');
    return {
      desc: String(prod || '').trim() + (prod ? ' – Crop ' + anio : ''),
      tns: normNum(fr ? g(fr, 'tns') : ctr.tns) || '',
      precio: normNum(fr ? g(fr, 'precio') : ctr.precio) || ''
    };
  });

  var exp = String(dato('exportador') || '').trim();
  var imp = String(dato('importador') || '').trim();
  var codOrigen = paisDeEmpresa(exp);

  S.gen = {
    contrato: nombre,
    fecha: String(hoy.getDate()).padStart(2, '0') + '/' +
           String(hoy.getMonth() + 1).padStart(2, '0') + '/' + anio,
    buyer: datosEmpresa(imp),
    seller: datosEmpresa(exp),
    consModo: 'buyer', cons: datosEmpresa(''),
    notifModo: 'buyer', notif: datosEmpresa(''),
    productos: productos,
    incoterm: incoterm,
    packing: String(base ? g(base, 'packaging') : '').trim(),
    pago: String(dato('formaPago') || '').trim(),
    embarque: String(dato('periodo') || '').trim(),
    origen: PAIS_EN[codOrigen] || (codOrigen && PAISES[codOrigen]
      ? PAISES[codOrigen].split(' ').slice(1).join(' ') : 'Argentina'),
    docs: DOCS_ESTANDAR.map(function (t) { return { t: t, on: true }; }),
    guardarBase: true,
    estado: null, error: null
  };
  S.animarPanel = true;
}

function totalLinea(p) {
  var t = (parseFloat(p.tns) || 0) * (parseFloat(p.precio) || 0);
  return t;
}

// Lo que el motor necesita, a partir del formulario.
function datosDelGenerador(G) {
  var d = normFecha(G.fecha);
  var lineas = G.productos.filter(function (p) { return p.desc || p.tns || p.precio; });
  var total = lineas.reduce(function (a, p) { return a + totalLinea(p); }, 0);
  var cant = lineas.reduce(function (a, p) { return a + (parseFloat(p.tns) || 0); }, 0);
  var docs = G.docs.filter(function (x) { return x.on && String(x.t).trim(); })
                   .map(function (x) { return String(x.t).trim(); });
  var mitad = Math.ceil(docs.length / 2);
  var cons = G.consModo === 'buyer' ? G.buyer : G.cons;
  var notif = G.notifModo === 'buyer' ? G.buyer : (G.notifModo === 'cons' ? cons : G.notif);

  return {
    contrato: G.contrato,
    fecha_larga: esFecha(d) ? fechaLarga(d) : G.fecha,
    buyer_empresa: G.buyer.nombre, buyer_direccion: G.buyer.direccion,
    buyer_vat: G.buyer.vat, buyer_contacto: G.buyer.contacto, buyer_email: G.buyer.email,
    seller_empresa: G.seller.nombre, seller_direccion: G.seller.direccion,
    seller_contacto: G.seller.contacto, seller_email: G.seller.email,
    cons_empresa: cons.nombre, cons_taxid: cons.vat, cons_direccion: cons.direccion,
    notif_empresa: notif.nombre, notif_taxid: notif.vat, notif_direccion: notif.direccion,
    productos: lineas.map(function (p) {
      return { producto: p.desc, cantidad: miles(p.tns) + ' MT',
               precio: miles(p.precio) + ' USD/MT ' + G.incoterm,
               total: 'USD ' + miles(totalLinea(p)) };
    }),
    total_contrato: 'USD ' + miles(total),
    cantidad_total: miles(cant) + ' MT',
    origen: G.origen, packing: G.packing, incoterm: G.incoterm,
    pago: G.pago, embarque: G.embarque,
    docs_izq: docs.slice(0, mitad), docs_der: docs.slice(mitad)
  };
}

// Lo que falta para que el documento salga bien.
function faltantesGenerador(G) {
  var f = [];
  if (!G.buyer.nombre) f.push('buyer');
  if (!G.buyer.direccion) f.push('dirección del buyer');
  if (!G.seller.nombre) f.push('seller');
  if (!G.seller.direccion) f.push('dirección del seller');
  if (!G.incoterm) f.push('incoterm');
  if (!G.productos.some(function (p) { return p.tns && p.precio; })) f.push('cantidad y precio');
  if (G.consModo === 'otra' && !G.cons.nombre) f.push('consignee');
  if (G.notifModo === 'otra' && !G.notif.nombre) f.push('notify');
  return f;
}

async function armarDocx() {
  if (typeof JSZip === 'undefined') throw new Error('No cargó el lector de Word. Revisá la conexión y recargá.');
  var zip = await completar(JSZip, plantillaContrato(), datosDelGenerador(S.gen));
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function descargar(blob, nombre) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

function nombreArchivo(ext) {
  return 'Sales Contract ' + String(S.gen.contrato).replace(/[\\/:*?"<>|]/g, '-') + '.' + ext;
}

// Guarda en la base lo que se completó a mano, para no tipearlo de nuevo.
async function guardarEmpresasDelGenerador() {
  if (!S.gen.guardarBase) return 0;
  var n = 0;
  var lista = [S.gen.buyer, S.gen.seller];
  if (S.gen.consModo === 'otra') lista.push(S.gen.cons);
  if (S.gen.notifModo === 'otra') lista.push(S.gen.notif);
  for (var i = 0; i < lista.length; i++) {
    var e = lista[i];
    if (!e.nombre) continue;
    var ya = S.empresas.get(clave(e.nombre));
    var cambio = !ya || ['direccion', 'vat', 'contacto', 'email', 'pais'].some(function (c) {
      return String(ya[c] || '') !== String(e[c] || '');
    });
    if (cambio && (e.direccion || e.vat || e.contacto || e.email)) { await guardarEmpresa(e); n++; }
  }
  return n;
}

async function generarWord() {
  var G = S.gen;
  G.estado = 'Armando el Word…'; G.error = null; pintar();
  try {
    var blob = await armarDocx();
    descargar(blob, nombreArchivo('docx'));
    var n = await guardarEmpresasDelGenerador();
    G.estado = null;
    G.hecho = 'Listo: se descargó el Word.' + (n ? ' Se guardaron los datos de ' + n +
      (n === 1 ? ' empresa' : ' empresas') + ' en la base.' : '');
  } catch (e) { G.estado = null; G.error = e.message; }
  pintar();
}

/* El PDF se hace con Google: el Word se sube a Drive convertido a documento de
   Google, se exporta a PDF y el documento temporal se borra. Con el permiso
   drive.file la app solo toca los archivos que ella crea. */
async function subirMultipart(meta, blob) {
  var token = await conToken();
  var lim = 'lim' + Date.now();
  var cuerpo = new Blob([
    '--' + lim + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n--' + lim + '\r\nContent-Type: ' + blob.type + '\r\n\r\n',
    blob, '\r\n--' + lim + '--'
  ]);
  var r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + lim },
    body: cuerpo
  });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    var msg = (j && j.error && j.error.message) || ('Error ' + r.status);
    if (r.status === 403 || r.status === 401) { S.faltaDrive = true; msg = 'Falta el permiso de Drive para armar el PDF.'; }
    throw new Error(msg);
  }
  return j;
}

async function carpetaContratos() {
  var LS = 'embarques:carpetaContratos';
  var id = null; try { id = localStorage.getItem(LS); } catch (e) {}
  if (id) return id;
  var j = await subirMultipart({ name: 'Contratos generados',
    mimeType: 'application/vnd.google-apps.folder' }, new Blob([''], { type: 'text/plain' }));
  try { localStorage.setItem(LS, j.id); } catch (e) {}
  return j.id;
}

async function generarPdf() {
  var G = S.gen;
  G.estado = 'Armando el PDF…'; G.error = null; G.hecho = null; pintar();
  try {
    var docx = await armarDocx();
    var carpeta = null;
    try { carpeta = await carpetaContratos(); } catch (e) { if (S.faltaDrive) throw e; }

    // 1. Word -> documento de Google (temporal)
    var temp = await subirMultipart({ name: nombreArchivo('docx') + ' (temporal)',
      mimeType: 'application/vnd.google-apps.document' }, docx);
    // 2. -> PDF
    var token = await conToken();
    var r = await fetch('https://www.googleapis.com/drive/v3/files/' + temp.id +
      '/export?mimeType=application/pdf', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Google no pudo convertir a PDF (' + r.status + ').');
    var pdf = await r.blob();
    // 3. fuera el temporal
    fetch('https://www.googleapis.com/drive/v3/files/' + temp.id,
      { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } }).catch(function () {});
    // 4. copia en Drive, para tenerlo a mano
    var enDrive = null;
    try {
      var meta = { name: nombreArchivo('pdf'), mimeType: 'application/pdf' };
      if (carpeta) meta.parents = [carpeta];
      enDrive = await subirMultipart(meta, new Blob([pdf], { type: 'application/pdf' }));
    } catch (e) {}

    descargar(pdf, nombreArchivo('pdf'));
    var n = await guardarEmpresasDelGenerador();
    G.estado = null;
    G.hecho = 'Listo: se descargó el PDF' +
      (enDrive ? ' y quedó una copia en Drive, en «Contratos generados»' : '') + '.' +
      (n ? ' Se guardaron los datos de ' + n + (n === 1 ? ' empresa' : ' empresas') + ' en la base.' : '');
    G.linkDrive = enDrive && enDrive.webViewLink;
  } catch (e) { G.estado = null; G.error = e.message; }
  pintar();
}

// "buyer.direccion" -> G.buyer.direccion; "productos.1.tns" -> G.productos[1].tns
function ponerRuta(obj, ruta, valor) {
  var partes = String(ruta).split('.');
  var o = obj;
  for (var i = 0; i < partes.length - 1; i++) {
    var k = /^\d+$/.test(partes[i]) ? +partes[i] : partes[i];
    if (o[k] === undefined || o[k] === null) o[k] = {};
    o = o[k];
  }
  var ult = partes[partes.length - 1];
  o[/^\d+$/.test(ult) ? +ult : ult] = valor;
}

  S.gen.productos.forEach(function (p, i) {

    if (el) el.textContent = 'USD ' + miles(t);
  });
  var tt = document.querySelector('.gen-total b');
  if (tt) tt.textContent = 'USD ' + miles(total);
}

/* --- Campo de fecha --------------------------------------------------------
   Un input type="date" muestra el formato del sistema operativo, que en varias
   máquinas es MM/DD/AAAA, y además dispara "change" apenas se completa el año:
   la pantalla se redibujaba en medio del tipeo y el campo perdía el foco.

   Acá se escribe en un campo de texto común, siempre DD/MM/AAAA, que se va
   formateando solo y NO redibuja mientras se tipea. Al lado, un botón abre el
   calendario nativo.
   -------------------------------------------------------------------------- */

// Cualquier cosa que venga de la planilla, mostrada como DD/MM/AAAA.
function aTextoFecha(v) {
  if (v === null || v === undefined || v === '') return '';
  if (esFecha(v)) {
    return String(v.getUTCDate()).padStart(2, '0') + '/' +
           String(v.getUTCMonth() + 1).padStart(2, '0') + '/' + v.getUTCFullYear();
  }
  var d = normFecha(v);
  if (esFecha(d)) {
    return String(d.getUTCDate()).padStart(2, '0') + '/' +
           String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  return String(v);
}

// DD/MM/AAAA -> AAAA-MM-DD, que es lo que entiende el calendario nativo.
function aISO(txt) {
  var d = normFecha(txt);
  if (!esFecha(d)) return '';
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') +
         '-' + String(d.getUTCDate()).padStart(2, '0');
}

// Va poniendo las barras mientras se escribe, sin pelear con el borrado.
function formatearFecha(txt, borrando) {
  var d = String(txt || '').replace(/[^\d]/g, '').slice(0, 8);
  if (borrando) return txt;
  if (d.length <= 2) return d;
  if (d.length <= 4) return d.slice(0, 2) + '/' + d.slice(2);
  return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
}

// Guarda la fecha del panel. Solo si cambió de verdad: así escribir y salir
// sin tocar nada no dispara una escritura en la planilla.
function guardarFechaPanel(input, campo, texto) {
  var caja = input.parentNode;
  var duenio = caja && caja.parentNode ? caja.parentNode.querySelector('[data-duenio]') : null;
  var id = duenio ? duenio.getAttribute('data-duenio') : S.sel;
  var emb = filaPorId(id);
  if (!emb) return;

  var txt = String(texto || '').trim();
  if (!txt) return;
  var d = normFecha(txt);
  if (!esFecha(d)) return pintar();   // muestra el aviso de fecha ilegible

  var iso = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') +
            '-' + String(d.getUTCDate()).padStart(2, '0');
  var actual = esFecha(emb[campo])
    ? emb[campo].getUTCFullYear() + '-' +
      String(emb[campo].getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(emb[campo].getUTCDate()).padStart(2, '0')
    : '';
  if (iso === actual) return;
  aplicarCambio(id, campo, iso);
}

function campoFecha(id, attr, campo, label, valor, extra) {
  var txt = aTextoFecha(valor);
  var d = normFecha(txt);
  var mala = txt && !esFecha(d);
  return '<div class="campo campo-fecha' + (mala ? ' malo' : '') + '">' +
    '<label for="' + id + '">' + label + '</label>' +
    '<div class="fecha-caja">' +
      '<input id="' + id + '" ' + attr + '="' + campo + '" class="f-txt" ' +
        'inputmode="numeric" autocomplete="off" maxlength="10" ' +
        'placeholder="DD/MM/AAAA" value="' + esc(txt) + '">' +
      '<button type="button" class="f-cal" data-act="calendario" data-p="' + id + '" ' +
        'aria-label="Abrir calendario">' + ico('cal') + '</button>' +
      '<input type="date" class="f-nativo" id="' + id + '-cal" data-parafecha="' + id + '" ' +
        'value="' + esc(aISO(txt)) + '" tabindex="-1" aria-hidden="true">' +
    '</div>' +
    (mala ? '<span class="mal">No se entiende esa fecha</span>' : '') +
    (extra || '') + '</div>';
}

function codigoPais(v) {
  var t = String(v == null ? '' : v).trim();
  if (!t) return null;
  var up = t.toUpperCase();

/* Los países viven en otra planilla (la comercial), en las hojas de la base de
   datos. Se lee con el mismo permiso: alcanza con que tu cuenta tenga acceso.
   Las empresas se atan por nombre, que es el mismo en las dos planillas. */
async function cargarPaisesEmpresas() {
  S.paises = new Map();
  S.sinPais = { clientes: [], proveedores: [] };
  S.diagPaises = null;
  if (!S.cfg.paisSheetId) return;

  try {
    var meta = await api(BASE + S.cfg.paisSheetId +
      '?fields=' + encodeURIComponent('properties(title),sheets(properties(title))'));
    var hojas = (meta.sheets || []).map(function (h) { return h.properties.title; });

    // Qué hoja es cuál. Se puede fijar a mano en la configuración; si no, se
    // busca por nombre.
    var buscar = function (incluye, excluye) {
      return hojas.filter(function (n) {
        var k = clave(n);
        if (excluye && k.indexOf(excluye) >= 0) return false;
        return k.indexOf(incluye) >= 0;
      })[0] || '';
    };
    var hProv = S.cfg.tabPaisPro || buscar('supplier') || buscar('proveedor');
    var hCli  = S.cfg.tabPaisCli || buscar('database', 'supplier') || buscar('client');

    var usadas = [];

    var leer = function (hoja, cubo, etiqueta) {
      if (!hoja) return Promise.resolve();
      return api(BASE + S.cfg.paisSheetId + '/values/' +
        encodeURIComponent("'" + hoja.replace(/'/g, "''") + "'!A1:Z5000"))
        .then(function (r) {
          var filas = r.values || [];
          if (!filas.length) return;

          // El encabezado puede no estar en la fila 1: se toma la primera fila
          // que tenga una columna de país.
          var iEnc = -1, cPais = -1, cNom = -1;
          for (var f = 0; f < Math.min(5, filas.length); f++) {
            var enc = filas[f] || [];
            for (var i = 0; i < enc.length; i++) {
              var k = clave(enc[i]);
              if (!k) continue;
              if (cPais < 0 && (k === 'country' || k === 'pais' || k.indexOf('country') >= 0 ||
                                k.indexOf('pais') >= 0)) { cPais = i; iEnc = f; }
            }
            if (cPais >= 0) {
              var enc2 = filas[f] || [];
              for (var j = 0; j < enc2.length; j++) {
                var k2 = clave(enc2[j]);
                if (cNom < 0 && (k2.indexOf('name') >= 0 || k2.indexOf('empresa') >= 0 ||
                    k2.indexOf('client') >= 0 || k2.indexOf('supplier') >= 0 ||
                    k2.indexOf('company') >= 0 || k2.indexOf('razon') >= 0 ||
                    k2.indexOf('importador') >= 0 || k2.indexOf('exportador') >= 0 ||
                    k2.indexOf('proveedor') >= 0)) cNom = j;
              }
              break;
            }
          }
          if (cPais < 0) { usadas.push(hoja + ': sin columna Country'); return; }
          // Sin columna de nombre clara, se usa la primera con texto.
          if (cNom < 0) cNom = 0;

          var con = 0;
          filas.slice(iEnc + 1).forEach(function (f2) {
            var nom = f2 && f2[cNom] ? String(f2[cNom]).trim() : '';
            if (!nom) return;
            var cod = codigoPais(f2[cPais]);
            if (cod) { S.paises.set(clave(nom), cod); con++; }
            else if (cubo.length < 400) cubo.push(nom);
          });
          usadas.push(hoja + ' → ' + con + ' con país');
        })
        .catch(function (e) { usadas.push(hoja + ': ' + e.message); });
    };

    await leer(hCli, S.sinPais.clientes, 'clientes');
    await leer(hProv, S.sinPais.proveedores, 'proveedores');

    S.diagPaises = {
      planilla: (meta.properties && meta.properties.title) || '',
      hojas: usadas,
      total: S.paises.size
    };
  } catch (e) {
    S.diagPaises = { error: e.message };
  }
}

function paisDeEmpresa(nombre) {
  if (!nombre || !S.paises || !S.paises.size) return null;
  return S.paises.get(clave(nombre)) || null;
