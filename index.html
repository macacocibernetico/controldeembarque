}
function cerrarComentarios() {
  if (!S.comPop && !S.comCtx) return;
  S.comPop = null; S.comCtx = null; S.comUI = {}; S.comVerRes = false;
  pintar();
}

// Un cuadro de texto -> su acción. Sirve para el botón y para Enter.
async function enviarCom(el) {
  var kind = el.getAttribute('data-comkind') || el.getAttribute('data-act');
  var ta = null;
  Array.prototype.forEach.call(document.querySelectorAll('[data-comtxt]'), function (x) {
    if (x === el) ta = x;
  });
  if (!ta) {
    // Se llegó desde un botón: el cuadro de texto es el que está en su misma caja.
    var caja = el.closest('.com-resp, .com-nuevoc, .com-c');
    ta = caja && caja.querySelector('[data-comtxt]');
  }
  if (!ta) return;
  var key = ta.getAttribute('data-comtxt'), texto = ta.value;
  if (!String(texto).trim()) return;
  var ok = null;
  if (/^(resp|comresp)$/.test(kind)) ok = await comResponder(ta.getAttribute('data-h'), texto);
  else if (/^(edit|comguardaredit)$/.test(kind)) { ok = await comEditar(ta.getAttribute('data-h'), ta.getAttribute('data-c'), texto); if (ok) S.comUI = {}; }
  else if (kind === 'dnuevo' || kind === 'comentar') {
    var idc = ta.getAttribute('data-id');
    var sel = document.querySelector('[data-comcampo="' + idc.replace(/"/g, '\\"') + '"]');
    var campoD = sel ? sel.value : '';
    ok = await comentar(idc, texto, campoD);
    if (ok) { delete S.comBorr['dc|' + idc]; }
  } else if (/^(nuevo|comenviar)$/.test(kind)) {
    var tipo = ta.getAttribute('data-tipo'), id = ta.getAttribute('data-id'), campo = ta.getAttribute('data-campo') || '';
    var d = destinoDePop({ tipo: tipo, id: tipo === 'fact' ? parseInt(id, 10) : id, campo: campo });
    ok = d ? await comNuevoHilo(d.destino, campo, texto) : null;
    if (ok && S.comPop) S.comPop.nuevo = false;
  }
  if (ok) { delete S.comBorr[key]; pintar(); }
}

/* Dónde se dibuja la ventanita: pegada a su celda, sin salirse de la pantalla. En el celular
   es una hoja que sube desde abajo (por CSS). */
function anclaDePop(P) {
  if (P.tipo === 'fact') return document.querySelector('[data-comfact="' + P.id + '"]');
  var trs = document.querySelectorAll('.tbl-hoja tbody tr');
  for (var i = 0; i < trs.length; i++) {
    if (trs[i].getAttribute('data-f') === P.id) {
      return (P.campo ? trs[i].querySelector('td[data-c="' + P.campo + '"]') : null) || trs[i].querySelector('td.nrofila');
    }
  }
  return null;
}
function acomodarFlotantes() {
  var ancho = window.innerWidth, alto = window.innerHeight, m = 10;
  var pop = document.querySelector('.com-pop');
  if (pop && S.comPop) {
    if (ancho <= 900) { pop.style.left = ''; pop.style.top = ''; }
    else {
      var anc = anclaDePop(S.comPop), r = anc ? anc.getBoundingClientRect() : null;
      var w = pop.offsetWidth, h = pop.offsetHeight, x, y;
      if (r) {
        x = r.right + 8; if (x + w > ancho - m) x = r.left - w - 8;
        if (x < m) x = Math.max(m, Math.min(ancho - w - m, r.left));
        y = r.top - 6; if (y + h > alto - m) y = alto - h - m;
      } else { x = (ancho - w) / 2; y = alto / 4; }
      pop.style.left = Math.round(x) + 'px'; pop.style.top = Math.round(Math.max(m, y)) + 'px';
    }
    pop.style.visibility = 'visible';
  }
  var ctx = document.querySelector('.com-ctx');
  if (ctx && S.comCtx) {
    var cw = ctx.offsetWidth, ch = ctx.offsetHeight;
    ctx.style.left = Math.max(m, Math.min(S.comCtx.x, ancho - cw - m)) + 'px';
    ctx.style.top = Math.max(m, Math.min(S.comCtx.y, alto - ch - m)) + 'px';
    ctx.style.visibility = 'visible';
  }
  if (S.comFoco) {
    var t = document.getElementById(S.comFoco);
    if (t) { t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch (e) {} }
    S.comFoco = null;
  }
}

// El botón «Comentar» de la barra sigue a la celda marcada.
function actualizarBotonCom() {
  // «Pintar» también depende de que haya una celda marcada.
  var bp = document.querySelector('.btn-pintar');
  if (bp) bp.disabled = !(S.celdaAct && filaPorId(S.celdaAct.id));
  var b = document.querySelector('.btn-com');
  if (!b) return;
  var emb = S.celdaAct && filaPorId(S.celdaAct.id);
  b.disabled = !emb;
  var n = emb ? hilosDeCelda(emb, S.celdaAct.c === '_etapa' ? '' : S.celdaAct.c).filter(function (h) { return !h.resuelto; }).length : 0;
  b.innerHTML = ico('chat') + (n ? 'Comentarios (' + n + ')' : 'Comentar');
}

/* --- Carga de datos -------------------------------------------------------- */

// Una fila cruda de la hoja → el objeto «carga» que usa toda la app (también para las filas de «A facturar»).
function armarFilaEmb(f, tab, sheetId, det) {
        // Se conserva la fila cruda: hace falta para poder devolverla exacta,
      // con sus colores, si alguien la pasa a facturar por error.
      var o = { _fila: f.fila, _tab: tab, _sheetId: sheetId, _id: tab + ':' + f.fila,
                _celdas: f.celdas, _colores: f.colores };
      Object.keys(det.mapa).forEach(function (campo) {
        var idx = det.mapa[campo];
        o[campo] = CAMPOS[campo].tipo === 'semaforo'
          ? colorASem(f.colores[idx])
          : convertir(f.celdas[idx], CAMPOS[campo].tipo);
      });
      // Si la ETA vino sin año y quedó antes del ETD, es del año siguiente.
      if (o.eta && o.eta.anioAsumido && esFecha(o.etd) && esFecha(o.eta) && o.eta < o.etd) {
        var ajust = new Date(Date.UTC(o.eta.getUTCFullYear() + 1,
                                      o.eta.getUTCMonth(), o.eta.getUTCDate()));
        ajust.anioAsumido = true; ajust.crudo = o.eta.crudo;
        o.eta = ajust;
      }

      // En las columnas semáforo el color es el estado y el texto es otra cosa:
      // en Docs. son anotaciones operativas ("recibir factura y enviar gas
      // free"), en T.R. la modalidad. Se guardan aparte para no perderlas.
      o._bg = f.colores;      // el color de fondo de cada celda: lo que se pinta en Sheets se ve acá
      o._notas = {};
      SEMAFOROS.forEach(function (c) {
        var ic = det.mapa[c];
        if (ic === undefined) return;
        var tx = f.celdas[ic];
        o._notas[c] = tx == null ? '' : String(tx).trim();
        o[c + '_nota'] = o._notas[c];
      });

      // En T.R. el texto es la MODALIDAD de liberación (BL Original / telex),
      // no el estado. El estado es el color. Se guardan por separado.
      // Ojo: la columna mezcla modalidad ("BL Original", "telex") con
      // palabras de estado ("solicitada"), que ya vienen en el color. Solo
      // tomamos las que son realmente modalidad.
      if (det.mapa.tr !== undefined) {
        o.trModo = modoTr(f.celdas[det.mapa.tr]);
      }

      // Naranja en "Pago estimado" = falta que manden el comprobante.
      var ip = det.mapa[COL_COMPROBANTE];
      o._faltaComprobante = ip !== undefined && esNaranja(f.colores[ip]);
      return o;
}

async function cargarTodo(rapido, silencioso) {
  // rapido: después de mover/borrar/guardar cargas solo se vuelven a leer las pestañas de cargas y «A facturar»
  // (los contratos, listas, empresas y avisos no cambian con eso), y todas a la vez.
  // silencioso = la actualización automática (ver refrescarSilencioso): no tapa la pantalla con «Cargando», no muestra
  // errores y, si algo falla o la persona empezó a hacer algo mientras se leía, deja todo exactamente como estaba.
  var foto = silencioso ? fotoDeDatos() : null, antes = silencioso ? huellasCargas() : null, memoria = silencioso ? recordarSeleccion() : null;
  var abortado = false;
  if (silencioso) S.refrescando = true; else { S.cargando = true; S.error = null; pintar(); }
  var avisos = [];
  var huboSesion = false;   // si la causa es la sesión caída, el aviso grande ya lo explica
  var leerP = function (tab) { return leerHoja(S.cfg.sheetId, tab).catch(function (e) { return { __err: e }; }); };
  var esperar = function (res) { if (res && res.__err) throw res.__err; return res; };
  var lecturasE = S.cfg.tabsEmb.map(leerP);
  var lecturasF = (S.cfg.tabsFact || []).map(leerP);
  var lecturasC = rapido ? [] : (S.cfg.tabsCtr || []).map(leerP);
  try {
    if (silencioso) {
      var lect = await Promise.all(lecturasE.concat(lecturasF, lecturasC));
      if (lect.some(function (x) { return x && x.__err; }) || !ociosoParaRefrescar(true)) { abortado = true; return; }
    }
    // Cada pestaña se lee y se mapea por separado: los encabezados de las
    // terrestres no son los mismos que los de las marítimas.
    var fuentes = [];
    for (var i = 0; i < S.cfg.tabsEmb.length; i++) {
      var tab = S.cfg.tabsEmb[i];
      var h;
      try {
        h = esperar(await lecturasE[i]);
      } catch (e) {
        if (e.sesion) huboSesion = true;
        avisos.push('No se pudo leer "' + tab + '": ' + e.message);
        continue;
      }
      var det = detectar(h.encabezados, CAMPOS);

      var filas = h.filas.map(function (f) { return armarFilaEmb(f, tab, h.sheetId, det); });

      // Una columna vacía en TODAS las filas de esta pestaña no aplica a este
      // tipo de carga: en camión no hay BL ni contenedores. No la exigimos.
      var noAplica = {};
      Object.keys(det.mapa).forEach(function (campo) {
        var alguna = filas.some(function (o) {
          var v = o[campo];
          if (SEMAFOROS.indexOf(campo) >= 0) return v && v !== 'vacio';
          return v !== null && v !== undefined && v !== '';
        });
        if (!alguna) noAplica[campo] = 1;
      });

      fuentes.push({ tab: tab, sheetId: h.sheetId, mapa: det.mapa,
                     extras: det.extras, encabezados: h.encabezados,
                     noAplica: noAplica, filas: filas });
    }

    if (!fuentes.length) throw new Error(avisos.join(' · ') || 'No se pudo leer ninguna pestaña.');

    var todas = [];
    fuentes.forEach(function (f) { todas = todas.concat(f.filas); });
    S.fuentes = fuentes;
    S.datos = { filas: todas };

    if (!rapido) {
    // Contratos: se juntan todas las pestañas elegidas. Un embarque puede estar
    // en curso con el contrato ya cerrado, así que cerrados también cuentan.
    S.contratos = new Map();
    for (var j = 0; j < (S.cfg.tabsCtr || []).length; j++) {
      var tc = S.cfg.tabsCtr[j], hc;
      try {
        hc = esperar(await lecturasC[j]);
      } catch (e2) {
        if (e2.sesion) huboSesion = true;
        avisos.push('No se pudo leer "' + tc + '": ' + e2.message);
        continue;
      }
      var dc = detectar(hc.encabezados, CAMPOS_CTR);
      if (dc.mapa.contrato === undefined) {
        avisos.push('En "' + tc + '" no encontré una columna de contrato.');
        continue;
      }
      hc.filas.forEach(function (f) {
        var n = f.celdas[dc.mapa.contrato];
        if (!n) return;
        var k = String(n).trim();
        var g = function (campo) {
          return dc.mapa[campo] !== undefined ? f.celdas[dc.mapa[campo]] : null;
        };

        // Un mismo número de contrato puede ocupar VARIAS filas: el mismo
        // contrato partido en productos distintos (20 tn blancheado + 8 tn
        // crudo). No es un error de carga, es como se trabaja. Antes se
        // descartaba la segunda fila y el contrato quedaba con la mitad de las
        // toneladas.
        if (S.contratos.has(k)) {
          var prev = S.contratos.get(k);
          prev.partes = (prev.partes || 1) + 1;
          var tN = tipoCtr(g('tipo'));
          if (prev.tipos.indexOf(tN) < 0) prev.tipos.push(tN);
          prev.tns = (normNum(prev.tns) || 0) + (normNum(g('tns')) || 0);
          prev.comision = (normNum(prev.comision) || 0) + (normNum(g('comision')) || 0);
          if (normNum(g('entregado')) !== null) {
            prev.entregadoHoja = (normNum(prev.entregadoHoja) || 0) + normNum(g('entregado'));
          }
          if (normNum(g('saldo')) !== null) {
            prev.saldoHoja = (normNum(prev.saldoHoja) || 0) + normNum(g('saldo'));
          }
          // Los productos se listan, que es lo que distingue las filas.
          ['perModo', 'perDesde', 'perHasta', 'perPartidas'].forEach(function (cp) { if (!prev[cp] && g(cp)) prev[cp] = g(cp); });
          var pNuevo = String(g('producto') || '').trim();
          if (pNuevo && String(prev.producto || '').indexOf(pNuevo) < 0) {
            prev.producto = [prev.producto, pNuevo].filter(Boolean).join(' + ');
          }
          return;
        }

        S.contratos.set(k, {
          partes: 1,
          contrato: k, origen: tc,
          exportador: g('exportador'),
          importador: g('importador'),
          producto: g('producto'),
          tipo: g('tipo'),
          tipos: [tipoCtr(g('tipo'))],
          incoterm: g('incoterm'),
          precio: normNum(g('precio')),
          tns: normNum(g('tns')),
          comision: normNum(g('comision')),
          // La planilla ya trae su propio entregado y saldo: los guardamos
          // para poder contrastarlos con los que calcula la app.
          entregadoHoja: normNum(g('entregado')),
          saldoHoja: normNum(g('saldo')),
          periodo: g('periodo'),
          perModo: g('perModo'), perDesde: g('perDesde'), perHasta: g('perHasta'), perPartidas: g('perPartidas'),
          packaging: g('packaging'),
          fecha: normFecha(g('fecha')),
          via: normVia(g('via')),
          firmaExp: esVerdadero(g('firmaExp')),
          firmaImp: esVerdadero(g('firmaImp')),
          tieneFirmas: dc.mapa.firmaExp !== undefined || dc.mapa.firmaImp !== undefined,
          formaPago: g('formaPago'),
          cond: interpretarPago(g('formaPago'))
        });
      });
    }

    }

    // "A facturar": un embarque llega ahí cuando el cliente ya le pagó al
    // exportador. Estar en esa pestaña ES la prueba de cobro que falta en la
    // columna Inv Commission.
    S.facturar = new Map();
    S.fuentesFact = [];
    S.datosFact = { filas: [] }; S.fuentesFactT = [];
    for (var k = 0; k < (S.cfg.tabsFact || []).length; k++) {
      var tf = S.cfg.tabsFact[k], hf;
      try {
        hf = esperar(await lecturasF[k]);
      } catch (e3) {
        if (e3.sesion) huboSesion = true;
        avisos.push('No se pudo leer "' + tf + '": ' + e3.message);
        continue;
      }
      var df = detectar(hf.encabezados, CAMPOS);
      // Se guarda la fuente para poder escribir después: pasar una carga a
      // facturar necesita el id de hoja y el mapa de columnas.
      S.fuentesFact.push({ tab: tf, sheetId: hf.sheetId, mapa: df.mapa,
                           noAplica: df.noAplica, filas: hf.filas });
      // Las mismas filas, armadas como cargas, para verlas en Tabla/Planilla con todo lo de las otras vistas.
      var filasT = [];
      hf.filas.forEach(function (f) {
        var primera = String(f.celdas[0] == null ? '' : f.celdas[0]).trim().toUpperCase();
        if (primera.indexOf('TOTAL') === 0) return;
        var o = armarFilaEmb(f, tf, hf.sheetId, df);
        if (!(String(o.exporter || '').trim() || String(o.importer || '').trim() || String(o.contract || '').trim())) return;
        o._esFact = true; o._aFacturar = true;
        filasT.push(o);
      });
      var noAplT = {};
      Object.keys(df.mapa).forEach(function (campo) {
        var alguna = filasT.some(function (o) {
          var v = o[campo];
          if (SEMAFOROS.indexOf(campo) >= 0) return v && v !== 'vacio';
          return v !== null && v !== undefined && v !== '';
        });
        if (!alguna) noAplT[campo] = 1;
      });
      S.fuentesFactT.push({ tab: tf, sheetId: hf.sheetId, mapa: df.mapa, extras: df.extras, encabezados: hf.encabezados,
                            noAplica: noAplT, filas: filasT, esFact: true });
      S.datosFact.filas = S.datosFact.filas.concat(filasT);
      if (df.mapa.contract === undefined) {
        avisos.push('En "' + tf + '" no encontré la columna de contrato (leí la fila ' + hf.filaEncabezado + ': ' +
          (hf.encabezados.filter(Boolean).slice(0, 12).join(' | ') || 'vacía') + ').');
        continue;
      }
      hf.filas.forEach(function (f) {
        var nc = f.celdas[df.mapa.contract];
        if (!nc) return;
        var kk = String(nc).trim();
        var reg = S.facturar.get(kk) || { contrato: kk, filas: 0, tns: 0, bls: [], items: [] };
        reg.filas++;
        var tn = df.mapa.tns !== undefined ? normNum(f.celdas[df.mapa.tns]) : null;
        if (tn) reg.tns += tn;
        var bl = df.mapa.bl !== undefined ? f.celdas[df.mapa.bl] : null;
        var blk = bl ? String(bl).trim() : '';
        if (blk) reg.bls.push(blk);
        reg.items.push({ bl: blk, tns: tn, usado: false });
        S.facturar.set(kk, reg);
      });
    }

    // Marcar los embarques que ya pasaron a facturar. Se cruza embarque por
    // embarque, no por contrato: un contrato se parte en varios parciales y
    // puede haber pasado uno solo. Cruzar por contrato daría por cobrados
    // parciales que siguen abiertos.
    //
    // Primero por BL, que es único. Después, para las terrestres que no tienen
    // BL, por toneladas, consumiendo cada coincidencia una sola vez.
    var pend = [];
    todas.forEach(function (o) {
      o._aFacturar = false;
      var reg = S.facturar.get(String(o.contract || '').trim());
      if (!reg) return;
      var blo = o.bl ? String(o.bl).trim() : '';
      if (blo) {
        var it = reg.items.filter(function (i) { return !i.usado && i.bl === blo; })[0];
        if (it) { it.usado = true; o._aFacturar = true; }
        return;   // Tiene BL y no matcheó: no se cobró, no se adivina.
      }
      pend.push({ o: o, reg: reg });
    });

    pend.forEach(function (x) {
      var o = x.o, reg = x.reg;
      var tn = o.tns;
      var it = null;
      if (tn) {
        it = reg.items.filter(function (i) {
          return !i.usado && i.tns && Math.abs(i.tns - tn) < 0.05;
        })[0];
      }
      if (!it) {
        // Sin BL ni toneladas comparables: solo si queda alguna fila libre.
        it = reg.items.filter(function (i) { return !i.usado && !i.bl && !i.tns; })[0];
      }
      if (it) { it.usado = true; o._aFacturar = true; }
    });

    if (!rapido) {
    // ALL CONTRATOS suele ser un IMPORTRANGE: sirve para leer pero no se puede
    // escribir. Para editar hay que ir a la pestaña real donde vive la fila.
    S.ctrEditables = new Map();
    S.mapaCtrEd = {};
    S.formasPago = [];
    var frecuencia = {};
    var tabsEd = rapido ? [] : await tabsEditablesEfectivas();
    var lecturasEd = tabsEd.map(leerP);
    for (var m = 0; m < tabsEd.length; m++) {
      var te = tabsEd[m], he;
      try {
        he = esperar(await lecturasEd[m]);
      } catch (e4) {
        if (e4.sesion) huboSesion = true;
        avisos.push('No se pudo leer "' + te + '": ' + e4.message);
        continue;
      }
      var de = detectar(he.encabezados, CAMPOS_CTR);
      S.mapaCtrEd[te] = de.mapa;
      if (de.mapa.contrato === undefined) {
        avisos.push('En "' + te + '" no encontré la columna de contrato (leí la fila ' + he.filaEncabezado + ': ' +
          (he.encabezados.filter(Boolean).slice(0, 12).join(' | ') || 'vacía') + ').');
        continue;
      }
      he.filas.forEach(function (f) {
        var nc = f.celdas[de.mapa.contrato];
        if (!nc) return;
        var kc = String(nc).trim();
        // Las firmas viven en la pestaña editable (Contratos Abiertos), no en
        // la de lectura, que suele ser un IMPORTRANGE sin esas columnas. Se
        // toman de acá y se mezclan con el contrato.
        if (de.mapa.firmaExp !== undefined || de.mapa.firmaImp !== undefined) {
          var ctr0 = S.contratos.get(kc);
          if (!ctr0) { ctr0 = { contrato: kc, origen: te }; S.contratos.set(kc, ctr0); }
          if (de.mapa.via !== undefined) {
            var vv = normVia(f.celdas[de.mapa.via]);
            if (vv) ctr0.via = vv;
          }
          if (de.mapa.fecha !== undefined && !esFecha(ctr0.fecha)) {
            ctr0.fecha = normFecha(f.celdas[de.mapa.fecha]);
          }
          // Si el contrato ocupa varias filas, cuenta como firmado solo
          // cuando lo están todas.
          var yaVisto = ctr0.tieneFirmas;
          ctr0.tieneFirmas = true;
          if (de.mapa.firmaExp !== undefined) {
            var fe = esVerdadero(f.celdas[de.mapa.firmaExp]);
            ctr0.firmaExp = yaVisto ? (ctr0.firmaExp && fe) : fe;
          }
          if (de.mapa.firmaImp !== undefined) {
            var fi = esVerdadero(f.celdas[de.mapa.firmaImp]);
            ctr0.firmaImp = yaVisto ? (ctr0.firmaImp && fi) : fi;
          }
        }

        // El período por meses / partidas vive en la pestaña editable (la de lectura suele ser un IMPORTRANGE más angosto).
        var ctrP = S.contratos.get(kc);
        if (ctrP) ['perModo', 'perDesde', 'perHasta', 'perPartidas'].forEach(function (cp) {
          var vp = de.mapa[cp] === undefined ? null : f.celdas[de.mapa[cp]];
          if (vp !== null && vp !== undefined && String(vp).trim() !== '' && !ctrP[cp]) ctrP[cp] = String(vp).trim();
        });
        // La pestaña donde se escribe manda sobre la importación (ALL CONTRATOS), que puede tardar en ponerse al día.
        if (ctrP && !ctrP._perEd && de.mapa.periodo !== undefined) {
          var tpE = f.celdas[de.mapa.periodo];
          if (tpE !== null && tpE !== undefined && String(tpE).trim() !== '') { ctrP.periodo = String(tpE).trim(); ctrP._perEd = true; }
        }
        var refPrev = S.ctrEditables.get(kc);
        if (refPrev) {
          refPrev.otras = (refPrev.otras || []);
          refPrev.otras.push({ tab: te, sheetId: he.sheetId, fila: f.fila,
                               mapa: de.mapa, celdas: f.celdas });
        }
        if (!S.ctrEditables.has(kc)) {
          S.ctrEditables.set(kc, {
            tab: te, sheetId: he.sheetId, fila: f.fila, mapa: de.mapa,
            celdas: f.celdas
          });
        }
        if (de.mapa.formaPago !== undefined) {
          var fp = f.celdas[de.mapa.formaPago];
          if (fp && String(fp).trim()) {
            var kk = clave(fp);
            frecuencia[kk] = frecuencia[kk] || { n: 0, variantes: {} };
            frecuencia[kk].n++;
            var tx = String(fp).trim();
            frecuencia[kk].variantes[tx] = (frecuencia[kk].variantes[tx] || 0) + 1;
          }
        }
      });
    }

    // "CAD Bank", "CAD BANK" y "Cad Bank" son la misma: se ofrece la más usada
    // para que la lista deje de multiplicarse.
    S.formasPago = Object.keys(frecuencia).map(function (k) {
      var v = frecuencia[k];
      var mejor = Object.keys(v.variantes).sort(function (a, b) {
        return v.variantes[b] - v.variantes[a] || a.localeCompare(b, 'es');
      })[0];
      return { texto: mejor, usos: v.n };
    }).sort(function (a, b) { return b.usos - a.usos; });

    }

    if (rapido) {
      if (S.hilos && S.hilos.length) resolverHilos();        // las cargas cambiaron de lugar: los comentarios se vuelven a atar sin leer nada
    } else {
      await Promise.all([
        (async function () { await cargarListas(); await cargarPaisesEmpresas(); await cargarEmpresas(); })(),
        cargarComentarios(), cargarAdvices()
      ]);
      iniciarSondeoComentarios();
      iniciarSondeoDatos();
    }

    if (silencioso && avisos.length) abortado = true; else S.avisos = avisos;
    reanclarPendientes();
  } catch (e) {
    // Con la sesión caída no se apila un cuadro rojo con lo mismo por cada pestaña.
    if (silencioso) abortado = true; else S.error = (e.sesion || huboSesion) ? null : e.message;
  } finally {
    if (!silencioso) { S.cargando = false; S.ultimoRefresco = Date.now(); pintar(); }
    else {
      S.refrescando = false;
      if (abortado) restaurarFoto(foto); else cerrarRefresco(antes, memoria);
    }
  }
}

/* ===========================================================================
   Actualización automática: lo que cambia otra persona en la planilla aparece solo.
   Cada tanto se vuelve a leer, en silencio, y SOLO si no estás haciendo nada (nada sin guardar, ninguna celda
   en edición, ninguna ventana ni panel abierto, ningún cuadro con el cursor). Si nada cambió, no se redibuja;
   si cambió algo, se redibuja conservando el scroll y la celda marcada, y un cartelito lo avisa.
   =========================================================================== */
function hashTxt(t) { var h = 5381; for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h; }
function huellasCargas() {
  var orden = [];
  todasFilas().forEach(function (e) { orden.push(e._tab + '|' + hashTxt(JSON.stringify([e._celdas, e._colores]))); });
  var ctr = '';
  try { ctr = String(hashTxt(JSON.stringify(Array.from(S.contratos.values())))); } catch (e) { ctr = ''; }
  return { orden: orden, ctr: ctr };
}
// Lo que se reasigna entero en cargarTodo: si la actualización falla a medias, se vuelve a esto.
function fotoDeDatos() {
  return { datos: S.datos, fuentes: S.fuentes, datosFact: S.datosFact, fuentesFact: S.fuentesFact, fuentesFactT: S.fuentesFactT,
           facturar: S.facturar, contratos: S.contratos, ctrEditables: S.ctrEditables, mapaCtrEd: S.mapaCtrEd, formasPago: S.formasPago, avisos: S.avisos };
}
function restaurarFoto(f) { Object.keys(f).forEach(function (k) { S[k] = f[k]; }); }

// La celda marcada y las filas tildadas se guardan por QUÉ carga son (no por el número de fila): si otra persona
// agregó una fila arriba, siguen en su carga.
function identCompleta(e) { var i = identidadDe(e); i.tab = e._tab; return i; }
function idPorIdentidad(i) {
  var c = todasFilas().filter(function (e) {
    return e._tab === i.tab && clave(e.contract) === clave(i.contract) && clave(e.bl) === clave(i.bl) &&
      clave(e.importer) === clave(i.importer) && Math.abs((normNum(e.tns) || 0) - (normNum(i.tns) || 0)) < 0.0001;
  });
  return c.length === 1 ? c[0]._id : null;
}
function recordarSeleccion() {
  var m = { celda: null, filas: [] };
  var e = S.celdaAct && filaPorId(S.celdaAct.id);
  if (e) m.celda = { c: S.celdaAct.c, i: identCompleta(e) };
  Object.keys(S.filasSel || {}).forEach(function (k) { var f = S.filasSel[k] && filaPorId(k); if (f) m.filas.push(identCompleta(f)); });
  return m;
}
function restaurarSeleccion(m) {
  if (m.celda) { var id = idPorIdentidad(m.celda.i); S.celdaAct = id ? { id: id, c: m.celda.c } : null; }
  if (m.filas.length) {
    var nuevas = {};
    m.filas.forEach(function (i) { var id = idPorIdentidad(i); if (id) nuevas[id] = true; });
    S.filasSel = nuevas; S.filasSelAncla = null;
  }
}
function cerrarRefresco(antes, memoria) {
  var ahora = huellasCargas();
  var igual = antes.ctr === ahora.ctr && antes.orden.length === ahora.orden.length &&
    antes.orden.every(function (h, i) { return h === ahora.orden[i]; });
  if (igual) return;                       // nada cambió: no se redibuja
  var viejas = {}, nuevasN = 0;
  antes.orden.forEach(function (h) { viejas[h] = (viejas[h] || 0) + 1; });
  ahora.orden.forEach(function (h) { if (viejas[h]) viejas[h]--; else nuevasN++; });
  restaurarSeleccion(memoria);
  pintar();
  if (nuevasN) toast('Se actualizó: ' + (nuevasN === 1 ? 'cambió 1 carga' : 'cambiaron ' + nuevasN + ' cargas') + ' en la planilla', 'ok', 3500);
  else if (antes.ctr !== ahora.ctr) toast('Se actualizaron los contratos', 'ok', 3500);
}
// ¿Es buen momento para actualizar sin molestar? (yaEnCurso: se vuelve a mirar después de leer, cuando ya se está actualizando)
function ociosoParaRefrescar(yaEnCurso) {
  if (typeof document === 'undefined' || window.__sinSondeoDatos) return false;
  if (document.visibilityState !== 'visible' || S.pantalla !== 'app' || !S.token || S.sesionCaida || !S.datos) return false;
  if (S.cargando || S.guardando || nPend() || S.revision || S.editCel || S.comEnviando) return false;
  if (!yaEnCurso && S.refrescando) return false;
  if (hayAlgoEncima() || S.pasar || S.devolver || S.alta || S.altaEmb || S.editCtr || S.elimCtr || S.confirmar) return false;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  return true;
}
async function refrescarSilencioso(alVolver) {
  if (Date.now() - (S.ultimoRefresco || 0) < (alVolver ? 15000 : 5000)) return;
  if (!ociosoParaRefrescar()) return;
  S.ultimoRefresco = Date.now();
  S.nRefresco = (S.nRefresco || 0) + 1;
  // Cada 5ª vez también se vuelven a leer los contratos y las listas; las otras, solo las cargas y «A facturar».
  await cargarTodo(S.nRefresco % 5 !== 0, true);
}

/* Versión nueva de la app: la página se compara con la que está publicada y, si es más nueva, aparece un aviso para
   actualizar (sin recargar sola: podrías estar escribiendo). */
function esSitioPublicado() { return typeof location !== 'undefined' && /^https?:$/.test(location.protocol); }   // abierta desde el disco no hay nada publicado para comparar
function versionDeTexto(txt) { var m = /var APP_VERSION = '([^']+)'/.exec(txt || ''); return m ? m[1] : null; }
async function revisarVersion() {
  if (S.verNueva) return;
  S.ultimaRevVersion = Date.now();
  try {
    var resp = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=-12000' } });
    if (!resp.ok) return;
    var v = versionDeTexto(await resp.text());
    if (v && v > APP_VERSION && v !== S.verIgnorada) { S.verNueva = v; pintar(); }
  } catch (e) { /* sin conexión: se vuelve a mirar más tarde */ }
}
function avisoVersionHtml() {
  if (!S.verNueva) return '';
  return '<div class="ver-nueva" role="status"><span>Hay una versión nueva</span>' +
    '<button type="button" class="vn-ok" data-act="actualizarapp">Actualizar</button>' +
    '<button type="button" class="vn-x" data-act="versionluego" aria-label="Avisarme más tarde" title="Más tarde">&times;</button></div>';
}
var _sondeoDatos = null;
function iniciarSondeoDatos() {
  if (_sondeoDatos) return;
  _sondeoDatos = setInterval(function () {
    refrescarSilencioso(false);
    if (esSitioPublicado() && Date.now() - (S.ultimaRevVersion || 0) > (S.verSondeoMs || 300000)) revisarVersion();
  }, S.datosSondeoMs || 60000);
  S.ultimaRevVersion = Date.now();
  // Al volver a la pestaña después de un rato, se pone al día enseguida.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || S.pantalla !== 'app') return;
    refrescarSilencioso(true);
    if (esSitioPublicado() && Date.now() - (S.ultimaRevVersion || 0) > 60000) revisarVersion();
  });
}

function fuenteDe(emb) {
  for (var i = 0; i < S.fuentes.length; i++) {
    if (S.fuentes[i].tab === emb._tab) return S.fuentes[i];
  }
  for (var j = 0; j < (S.fuentesFactT || []).length; j++) {
    if (S.fuentesFactT[j].tab === emb._tab) return S.fuentesFactT[j];
  }
  return S.fuentes[0];
}

// Las cargas en curso y las de «A facturar» (para todo lo que busca una carga por id o por identidad).
function todasFilas() {
  return ((S.datos && S.datos.filas) || []).concat((S.datosFact && S.datosFact.filas) || []);
}
function filaPorId(id) {
  var a = S.datos.filas.filter(function (x) { return x._id === id; })[0];
  if (a) return a;
  return ((S.datosFact && S.datosFact.filas) || []).filter(function (x) { return x._id === id; })[0];
}
// Fuentes de la vista actual (Cargas o «A facturar»).
function fuentesVista() { return S.verFact ? (S.fuentesFactT || []) : (S.fuentes || []); }

/* --- Aviso flotante ("toast") -----------------------------------------------
   Vive fuera de #root: así ningún redibujo lo borra a mitad de camino. */
function toast(texto, tipo, ms, accion) {
  if (typeof document === 'undefined' || !document.body) return;
  var caja = document.getElementById('toasts');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'toasts';
    caja.setAttribute('role', 'status');
    caja.setAttribute('aria-live', 'polite');
    document.body.appendChild(caja);
  }
  var t = document.createElement('div');
  t.className = 'toast ' + (tipo || 'ok');
  t.innerHTML = '<span class="ti">' + ico(tipo === 'error' ? 'x' : 'check') + '</span><span>' + esc(texto) + '</span>' +
    (accion ? '<button type="button" class="t-acc">' + esc(accion.texto) + '</button>' : '');
  if (accion) {
    t.querySelector('.t-acc').addEventListener('click', function () {
      if (t.parentNode) t.parentNode.removeChild(t);
      accion.fn();
    });
  }
  caja.appendChild(t);
  setTimeout(function () {
    t.classList.add('sale');
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
  }, ms || (accion ? 7000 : tipo === 'error' ? 6000 : 3800));
}

/* --- Cambiar un dato de una carga --------------------------------------------
   Los cambios NO se escriben al instante ni piden confirmar uno por uno: se van
   juntando (S.pend, ver encolarCambio) y se confirman todos juntos, una sola vez,
   con el botón «Confirmar cambios» de arriba a la derecha. Si un dato sale del
   contrato (precio, puerto, exportador...), esa confirmación avisa qué dice el
   contrato, pero deja seguir: hay ajustes puntuales que son legítimos. */
var CAMPOS_DEL_CONTRATO = ['contract', 'exporter', 'importer', 'price', 'tipo',
                           'product', 'incoterm', 'port'];

function txtV(v) {
  if (v === null || v === undefined || v === '') return '(vacío)';
  if (v instanceof Date) return fmtFecha(v);
  if (v && v.invalida) return String(v.crudo);
  if (typeof v === 'number') return fmtNum(v);
  return String(v);
}

function contratoDeCarga(emb) {
  var k = String(emb.contract || '').trim();
  if (!k) return null;
  if (S.contratos.has(k)) return S.contratos.get(k);
  var kk = clave(k), hallado = null;
  S.contratos.forEach(function (c, n) { if (!hallado && clave(n) === kk) hallado = c; });
  return hallado;
}

// Qué dice el contrato de esta carga sobre ese dato.
function valorDelContrato(emb, campo) {
  var c = contratoDeCarga(emb);
  if (!c) return { hay: false };
  var v = null;
  if (campo === 'price') v = c.precio;
  else if (campo === 'exporter') v = c.exportador;
  else if (campo === 'importer') v = c.importador;
  else if (campo === 'product') v = c.producto;
  else if (campo === 'tipo') v = c.tipo;
  else if (campo === 'incoterm') v = c.incoterm;
  else if (campo === 'port') v = (partirIncoterm(c.incoterm) || {}).lugar || '';
  else if (campo === 'contract') v = c.contrato;
  return { hay: true, valor: v, texto: (v === null || v === undefined || v === '') ? '' : txtV(v) };
}

function igualAlContrato(campo, nuevo, delContrato) {
  if (delContrato === null || delContrato === undefined || delContrato === '') return false;
  if (campo === 'price') return Math.abs((normNum(nuevo) || 0) - (normNum(delContrato) || 0)) < 0.005;
  return clave(nuevo) === clave(delContrato);
}

// Desde el panel de detalle: el cambio queda pendiente (igual que en la tabla).
// Los semáforos (Docs, Fotos, T.R.) siguen guardándose al instante.
function pedirCambio(id, campo, valor) {
  var emb = filaPorId(id);
  if (!emb) return;
  var def = CAMPOS[campo];
  if (!def || def.tipo === 'semaforo') return aplicarCambio(id, campo, valor);
  if (!encolarCambio(id, campo, valor)) pintar();   // sin cambio real: se vuelve a mostrar lo que había
}

// ¿Hay texto seleccionado con el mouse dentro de la tabla? Si sí, el clic que
// cierra esa selección es de quien está copiando: no debe abrir nada.
function textoSeleccionadoEnTabla() {
  var sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed || !String(sel).length) return false;
  var n = sel.anchorNode; n = n && (n.nodeType === 3 ? n.parentNode : n);
  return !!(n && n.closest && n.closest('.tbl-hoja'));
}

async function aplicarCambio(id, campo, valor) {
  S.guardadoOk = false;
  delete S.pend[clavePend(id, campo)];   // si había algo pendiente de ese dato, esto lo reemplaza
  var f = filaPorId(id);
  if (!f) return;
  var src = fuenteDe(f);
  var idx = campo === '_faltaComprobante' ? src.mapa[COL_COMPROBANTE] : src.mapa[campo];
  if (idx === undefined) {
    S.error = 'Esa columna no existe en "' + f._tab + '".';
    return pintar();
  }

  var antes = f[campo], antesTotal = f.total;
  var tipo = campo === '_faltaComprobante' ? '' : CAMPOS[campo].tipo;
  if (campo === '_faltaComprobante' || tipo === 'semaforo') f[campo] = valor;
  else if (tipo === 'numero') f[campo] = numAR(valor);
  else f[campo] = convertir(valor, tipo);

  var valores = {}, colores = {};
  if (campo === '_faltaComprobante') colores[idx] = valor ? 'falta_cbte' : 'vacio';
  else if (SEMAFOROS.indexOf(campo) >= 0) colores[idx] = valor;
  // Se escribe el número o la fecha de verdad, no el texto tipeado: como texto,
  // "25,5" rompía la fórmula del total y las sumas del contrato (SUMIFS)
  // ignoraban esa carga.
  else valores[idx] = (f[campo] === null || f[campo] === undefined) ? '' : f[campo];

  // Cambió la cantidad o el precio: el total se vuelve a escribir como fórmula,
  // así queda bien aunque en esa fila hubiera un número fijo.
  if ((campo === 'tns' || campo === 'price') && src.mapa.total !== undefined &&
      src.mapa.tns !== undefined && src.mapa.price !== undefined) {
    valores[src.mapa.total] = '=' + letraCol(src.mapa.price) + f._fila + '*' +
                              letraCol(src.mapa.tns) + f._fila;
    var pr = normNum(f.price), tn = normNum(f.tns);
    f.total = (pr !== null && tn !== null) ? Math.round(pr * tn * 100) / 100 : f.total;
  }
  S.guardando++; pintar();

  var fallo = false;
  try {
    await escribirCeldas(S.cfg.sheetId, f._sheetId, f._fila, valores, colores);
    // Recién acá el cambio está en la planilla: recién acá se avisa.
    var etq = campo === '_faltaComprobante' ? 'Comprobante' : CAMPOS[campo].label;
    var det = (campo === '_faltaComprobante') ? (valor ? 'falta' : 'ok')
      : tipo === 'semaforo' ? etiqueta(campo, valor)
      : txtV(antes) + ' → ' + txtV(f[campo]);
    toast(etq + ' actualizado: ' + det + (f.total !== antesTotal && (campo === 'tns' || campo === 'price')
      ? ' · Total ' + fmtNum(f.total) : ''), 'ok');
  } catch (e) {
    fallo = true;
    f[campo] = antes; f.total = antesTotal;
    S.error = 'No se pudo guardar: ' + e.message;
    toast('No se pudo guardar el cambio. ' + e.message.split('\n')[0].slice(0, 120), 'error');
  } finally {
    S.guardando--;
    if (!S.guardando && !fallo) {
      S.guardadoOk = true;
      clearTimeout(S.tGuardado);
      // El cartel «Guardado» se apaga solo; si justo estás escribiendo en una celda o arrastrando una columna, no se redibuja.
      S.tGuardado = setTimeout(function () { S.guardadoOk = false; if (!S.editCel && !document.body.classList.contains('redimensionando')) pintar(); }, 2500);
    }
    pintar();
  }
}

function ico(nombre) {
  var d = ICONOS[nombre];
  if (!d) return '';
  return '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="' + d + '"/></svg>';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Números con separadores, y sin decimales inútiles.
function fmtNum(v) {
  var n = Number(v);
  if (!isFinite(n)) return '';
  return n.toLocaleString('es-AR', { maximumFractionDigits: 2 });
}

/* Las fechas se guardan como la medianoche UTC del día que dice la planilla (12/10 es
   12/10 a las 00:00 UTC). Hay que mostrarlas con el huso UTC: con el de quien mira
   (Argentina es UTC-3) esa medianoche cae a las 21:00 del día anterior y la fecha
   salía un día corrida hacia atrás. */
function fmtFecha(f) {
  return esFecha(f) ? f.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit', timeZone:'UTC' }) : '';
}

function pintarCelda(v) {
  if (v === null || v === undefined || v === '') return '<span class="vacia">—</span>';
  if (typeof v === 'object' && v.invalida) return '<span class="mala">' + esc(v.crudo) + '</span>';
  if (v instanceof Date) {
    if (v.anioAsumido) {
      return '<span class="asumida" title="Sin año en la planilla, se asume ' +
        v.getUTCFullYear() + '">' + fmtFecha(v) + '</span>';
    }
    var mala = v.getUTCFullYear() > new Date().getFullYear() + 1;
    return mala ? '<span class="mala">' + fmtFecha(v) + '</span>' : fmtFecha(v);
  }
  if (typeof v === 'number') return v.toLocaleString('es-AR');
  return esc(v);
}

   de pestañas, nada sensible: cada uno entra con su propia cuenta y ve lo que

function configExportable() {
  var c = S.cfg || {};

    v: 1,

    sheetId: c.sheetId || '',
    titulo: c.titulo || '',

// El mismo contenido que el enlace, en una línea para copiar y pegar.
function codigoConfig() {
  try { return b64url(JSON.stringify(configExportable())); } catch (e) { return ''; }
}

function aplicarCodigo(txt) {
  var t = String(txt || '').trim();
  if (!t) return null;
  // Acepta el código pelado o el enlace entero.
  var m = t.match(/#cfg=([^&\s]+)/);
  if (m) t = decodeURIComponent(m[1]);
  try {
    var b = t.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var obj = JSON.parse(new TextDecoder().decode(bytes));
    return obj && obj.sheetId ? obj : null;
  } catch (e) { return null; }
}

function enlaceConfig() {
  try {
    var json = JSON.stringify(configExportable());
    return location.origin + location.pathname + '#cfg=' + encodeURIComponent(b64url(json));
  } catch (e) { return ''; }
}

function leerConfigDeEnlace() {
  var h = location.hash || '';
  var m = h.match(/#cfg=([^&]+)/);
  if (!m) return null;
  try {
    var b = decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var obj = JSON.parse(new TextDecoder().decode(bytes));
    return (obj && obj.sheetId) ? obj : null;
  } catch (e) { return null; }
}

function evaluarTodo() {
  var hoy = ahoraComoUTC();
  S.ultimaEval = {};
  return S.datos.filas.map(function (emb) {
    var ctr = S.contratos.get(String(emb.contract || '').trim()) || null;
    var src = fuenteDe(emb);
    var ev = evaluar(emb, ctr, hoy, src.mapa, src.noAplica);
    S.ultimaEval[emb._id] = ev;
    return { emb: emb, contrato: ctr, src: src, ev: ev };
  });
}

function evaluarFactT() {
  var hoy = ahoraComoUTC();
  return ((S.datosFact && S.datosFact.filas) || []).map(function (emb) {
    var ctr = S.contratos.get(String(emb.contract || '').trim()) || null;
    var src = fuenteDe(emb);
    var ev = evaluar(emb, ctr, hoy, src.mapa, src.noAplica);
    S.ultimaEval[emb._id] = ev;
    return { emb: emb, contrato: ctr, src: src, ev: ev };
  });
}

// Pasar de ver Cargas a ver «A facturar» (y volver): cada una recuerda su búsqueda, sus filtros y su orden.
function setVerFact(v) {
  v = !!v;
  if (!!S.verFact === v) return;
  S.slotsVista = S.slotsVista || {};
  S.slotsVista[S.verFact ? 'fact' : 'emb'] = { fCol: S.fCol, ordenCol: S.ordenCol, busca: S.busca };
  var n = S.slotsVista[v ? 'fact' : 'emb'];
  S.fCol = n ? n.fCol : {}; S.ordenCol = n ? n.ordenCol : null; S.busca = n ? n.busca : '';
  S.filasSel = {}; S.filasSelAncla = null; S.soloSel = false; S.celdaAct = null;
  S.menuCol = null; S.menuPintar = false; S.comPop = null; S.comCtx = null; S.panelFiltros = false;
  S.verFact = v;
  if (v) { S.irAlFinal = true; S.topeFactT = 150; }
}

function vistaApp() {
  if (!S.datos) {
    return barraMobile() + '<div class="marco-app v-' + colorDeVista(S.vista) + '">' + navLateral([]) +
      '<main class="app">' + avisoSesion() +
      (S.error ? '<div class="error" style="margin-top:14px">' + esc(S.error) + '</div>' : '') +
      '<p class="centro">' + (S.cargando ? 'Leyendo la planilla…' : 'Sin datos.') + '</p>' +
      '</main></div>' + tabBarInferior();
  }

  var todosEvs = evaluarTodo();
  var evs = todosEvs.filter(function (x) {
    if (S.filtroTab && x.emb._tab !== S.filtroTab) return false;
    if (S.filtroTipo && clave(x.emb.tipo) !== S.filtroTipo) return false;
    return true;
  });
  var cuenta = { critico: 0, alto: 0, medio: 0, ok: 0 };
  evs.forEach(function (x) { x.ev.nivelMax ? cuenta[x.ev.nivelMax]++ : cuenta.ok++; });

  // Pestañas y tipos de las CARGAS: en Contratos filtrarían algo que ni se ve (Contratos tiene los suyos).
  var segmentado = S.vista === 'contratos' ? ''
    : S.verFact && S.vista === 'carga' ? segmentoPestanas(todosEvs)      // «A facturar»: el filtro por producto no aplica
    : segmentoPestanas(todosEvs) + segmentoTipos(todosEvs);
  var modoFactT = S.verFact && S.vista === 'carga' && (S.modo === 'tabla' || S.modo === 'planilla');
  var evsFact = modoFactT ? evaluarFactT() : [];
  var cuerpo = S.vista === 'control' ? vistaControl(evs, cuenta)
             : S.vista === 'contratos' ? vistaContratos()
             : S.verFact ? (modoFactT ? vistaGrillaFact(evsFact) : vistaFacturadas())
             : vistaGrilla(evs);
  var panel = '';
  if (S.gen) panel = panelGenerador();
  else if (S.editCtr) panel = panelContrato();
  else if (S.sel !== null) {
    var item = todosEvs.concat(evsFact).filter(function (x) { return x.emb._id === S.sel; })[0];
    if (item) panel = vistaPanel(item);
  }

  return '<a class="saltar" href="#principal" data-act="saltar">Saltar al contenido</a>' + barraMobile() +
    '<div class="marco-app v-' + colorDeVista(S.vista) + (S.vista === 'carga' && !S.verFact && (S.modo === 'tabla' || S.modo === 'planilla') ? ' modo-hoja' : '') + (S.vista === 'carga' && S.verFact ? ' modo-fact' : '') + '">' + navLateral(todosEvs) +
    '<main class="app" id="principal" tabindex="-1">' + avisoSesion() +
      (S.error ? '<div class="error">' + esc(S.error) + '</div>' : '') +
      (S.avisoOk ? '<div class="ok-aviso">' + esc(S.avisoOk) +
        ' <button data-act="cerraviso">Cerrar</button></div>' : '') +
      barraDeshacer() +
      barraCtrMovido() +
      tituloVista() +
      segmentado + cuerpo + diagnostico() +
    '</main></div>' + tabBarInferior() + panel + barraAdvice(todosEvs) +
    ((S.modo === 'planilla' || S.modo === 'tabla') && S.vista === 'carga' ? menuColumna() : '') +
    modalMoverCtr() + modalLoteFact() + modalLoteDev() + modalElim() + modalElimCtr() + pendFlotaHtml() + avisoVersionHtml() + comPopHtml() + comCtxHtml();
}

// La copia, a la vista antes de generar. Si falta el mail documental del
// cliente, se dice fuerte: es lo que hace que el aviso llegue a quien tiene que.
// Qué encontró la app en la planilla comercial. Si los mails no aparecen,
// esto dice por qué: otra hoja, otra fila de encabezado, otra columna.
function diagMailsHtml() {
  var d = S.diagMails || [];
  if (!S.cfg || !S.cfg.paisSheetId) {
    return '<p class="ayuda">No hay planilla comercial cargada.</p>';
  }
  if (!d.length) {
    return '<p class="ayuda">No se pudo leer ninguna hoja. ' +
      esc(((S.diagPaises && S.diagPaises.hojas) || []).join(' · ') ||
          (S.diagPaises && S.diagPaises.error) || '') + '</p>';
  }

  // De los clientes que hoy tienen embarques, cuántos tienen mails.
  var clientes = {}, conM = 0, sinM = [];
  ((S.datos && S.datos.filas) || []).forEach(function (e) {
    var k = clave(e.importer);
    if (!k || clientes[k]) return;
    clientes[k] = 1;
    if (mailsDocumentales(e.importer).length) conM++;
    else if (sinM.length < 12) sinM.push(e.importer);
  });
  var nCli = Object.keys(clientes).length;

  return d.map(function (x) {
    var sinCol = x.mails.indexOf('—') === 0;
    return '<div class="dm-hoja">' +
      '<p class="dm-tit"><b>' + esc(x.hoja) + '</b> · ' + esc(x.etiqueta) +
        ' · encabezados en la fila ' + x.filaEnc + ' · ' + x.columnas + ' columnas</p>' +
      '<dl class="dm-cols">' +
        '<div><dt>Empresa</dt><dd>' + esc(x.nombre) + '</dd></div>' +
        '<div><dt>País</dt><dd>' + esc(x.pais) + '</dd></div>' +
        '<div class="' + (sinCol ? 'mal' : '') + '"><dt>Mails documentales</dt><dd>' +
          (sinCol ? 'No encontré la columna' : esc(x.mails) + ' — ' + x.conMail + ' empresas con mails') +
        '</dd></div>' +
      '</dl>' +
      (x.ejemplos.length
        ? '<p class="dm-ej">Por ejemplo: ' + esc(x.ejemplos.join(' | ')) + '</p>' : '') +
      '</div>';
  }).join('') +
  (nCli
    ? '<p class="dm-cober' + (conM < nCli ? ' parcial' : '') + '">' +
      'De los ' + nCli + ' clientes con embarques cargados, <b>' + conM + '</b> tienen mails documentales.' +
      (sinM.length
        ? '<br><span>Sin mails: ' + esc(sinM.join(', ')) + (nCli - conM > sinM.length ? '…' : '') +
          '. Si en Database_old están escritos distinto, no se cruzan.</span>'
        : '') + '</p>'
    : '') +
  ((S.mailsRaros || []).length
    ? '<p class="dm-raros">Mails mal escritos que se descartaron: ' +
      esc(S.mailsRaros.slice(0, 6).map(function (r) {
        return r.empresa + ' (' + r.raros.join(', ') + ')';
      }).join('; ')) + '</p>'
    : '');
}

function vistaCC(importador, destino) {
  var cc = ccAdvice(importador, destino);
  var docs = cc.filter(function (x) { return x.origen === 'documental'; });
  var etq = { fijo: 'fija', documental: 'documental', peter: 'Peter' };
  return '<div class="cc-vista">' +
    '<span class="cc-lbl">CC</span>' +
    '<span class="cc-lista">' + cc.map(function (x) {
      return '<span class="cc-mail o-' + x.origen + '" title="' + etq[x.origen] + '">' +
        esc(x.mail) + '</span>';
    }).join('') + '</span>' +
    (function () {
      if (docs.length) return '';
      // Si no están en copia puede ser porque ya van en "Para": no es falta.
      var todos = mailsDocumentales(importador);
      var enPara = parsearMails(destino).mails;
      if (todos.length && todos.every(function (m) { return enPara.indexOf(m) >= 0; })) {
        return '<span class="cc-nota">Los mails documentales van en «Para»</span>';
      }
      var hayCol = (S.diagMails || []).some(function (x) { return x.mails.indexOf('—') !== 0; });
      var errPlanilla = S.diagPaises && S.diagPaises.error;
      return '<span class="cc-falta">' + (!importador ? 'Sin cliente'
        // Las tres razones por las que no aparecen, de la más básica a la más fina.
        : !(S.cfg && S.cfg.paisSheetId)
          ? 'No está cargada la Planilla Comercial en Configuración → Países de las empresas'
        : errPlanilla
          ? 'No se pudo leer la Planilla Comercial: ' + esc(errPlanilla)
        : !hayCol ? 'No encontré la columna «Mails para envio documental» en Database_old ' +
                    '(ver Configuración → Países de las empresas)'
        : 'Sin mails documentales para ' + esc(importador) + ' en Database_old' +
          ' — puede estar escrito distinto allá') + '</span>';
    })() +
    '</div>';
}

// Mientras haya algo para deshacer, se ofrece. Dura un día: pasado eso la
// planilla ya se movió y volver atrás sería peor que dejarlo.
// Atajo justo después de mover una carga: devolverla sin ir a buscarla.
// No guarda copia de nada; abre la lista de "A facturar" con esa fila filtrada.
/* --- Pasar un contrato de «Abiertos» a «Cerrados» (y al revés) ---------------
   Misma dinámica que «A facturar»: se copia la fila a la otra pestaña, se borra
   la de origen y todo va en UN solo pedido, así no puede quedar una fila vacía
   ni una copia a medias.

   Las dos pestañas NO son iguales: en Abiertos el ENT (entregado) es una
   fórmula y en Cerrados un valor fijo; Abiertos tiene columnas que Cerrados no
   (Facturación pendiente, % completado, las firmas) y "Importador" se llama
   "Cliente". Por eso no se pega la fila entera a ciegas: cada columna se
   empareja por lo que es y se decide qué llevar. */
function esFormula(x) { return typeof x === 'string' && x.charAt(0) === '='; }

// Columnas con encabezado, identificadas por su nombre. Si un nombre se repite
// («Periodo de embarque» está dos veces) se distingue por el orden.
function colsNombradas(enc) {
  var vistos = {}, out = [];
  (enc || []).forEach(function (h, i) {
    var t = clave(h == null ? '' : String(h));
    if (!t) return;
    vistos[t] = (vistos[t] || 0) + 1;
    out.push({ i: i, k: t + '#' + vistos[t], nombre: String(h) });
  });
  return out;
}

async function formulasDeRango(tab, desde, hasta) {
  var r = await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + tab.replace(/'/g, "''") + "'!A" + desde + ':' + letraCol(MAX_COLS - 1) + hasta) +
    '?valueRenderOption=FORMULA');
  return r.values || [];
}
async function formulasDeFila(tab, fila) {
  return (await formulasDeRango(tab, fila, fila))[0] || [];
}

// Todo lo que hay que saber antes de mover: se lee de las dos pestañas tal
// como están AHORA. Sirve para el cartel y para ejecutar.
async function planMoverContrato(nombre) {
  var ref = S.ctrEditables.get(String(nombre).trim());
  if (!ref) throw new Error('Ese contrato no está en las pestañas editables.');
  var deAbiertos = esTabAbiertos(ref.tab);
  if (!deAbiertos && !esTabCerrados(ref.tab)) {
    throw new Error('«' + ref.tab + '» no es una pestaña de contratos Abiertos ni Cerrados: no sé a dónde pasarlo.');
  }
  var lp = await listarPestanas(S.cfg.sheetId);
  var destinoTab = lp.pestanas.map(function (x) { return x.nombre; })
    .filter(deAbiertos ? esTabCerrados : esTabAbiertos)[0];
  if (!destinoTab) throw new Error('No encuentro la pestaña de contratos ' + (deAbiertos ? 'Cerrados' : 'Abiertos') + '.');

  var ho = await leerHoja(S.cfg.sheetId, ref.tab), hd = await leerHoja(S.cfg.sheetId, destinoTab);
  var mo = detectar(ho.encabezados, CAMPOS_CTR).mapa, md = detectar(hd.encabezados, CAMPOS_CTR).mapa;
  if (mo.contrato === undefined || md.contrato === undefined) {
    throw new Error('No encuentro la columna de contrato en una de las dos pestañas.');
  }
  var k = clave(nombre);
  var filasO = ho.filas.filter(function (f) { return clave(f.celdas[mo.contrato]) === k; });
  if (!filasO.length) throw new Error('El contrato ya no está en «' + ref.tab + '». Actualizá y probá de nuevo.');
  if (hd.filas.some(function (f) { return clave(f.celdas[md.contrato]) === k; })) {
    throw new Error('Ya hay un contrato ' + nombre + ' en «' + destinoTab + '». No lo paso para no duplicarlo.');
  }

  // Emparejar columnas: primero las conocidas (Importador = Cliente), después
  // por nombre.
  var eo = colsNombradas(ho.encabezados), ed = colsNombradas(hd.encabezados);
  var pares = [], usO = {}, usD = {};
  Object.keys(mo).forEach(function (campo) {
    if (md[campo] === undefined || usO[mo[campo]] || usD[md[campo]]) return;
    pares.push({ o: mo[campo], d: md[campo], campo: campo });
    usO[mo[campo]] = usD[md[campo]] = 1;
  });
  ed.forEach(function (cd) {
    if (usD[cd.i]) return;
    var co = eo.filter(function (x) { return !usO[x.i] && x.k === cd.k; })[0];
    if (co) { pares.push({ o: co.i, d: cd.i, campo: '' }); usO[co.i] = usD[cd.i] = 1; }
  });
  var soloD = ed.filter(function (c) { return !usD[c.i]; });
  var soloO = eo.filter(function (c) { return !usO[c.i]; });

  // Dónde va: arriba de la fila TOTAL de la pestaña de destino (como los
  // contratos nuevos), o a continuación de la última si no hay TOTAL.
  var filaTotal = await filaTotalDe(destinoTab);
  var filaDestino = filaTotal || (hd.filas.length ? Math.max.apply(null, hd.filas.map(function (f) { return f.fila; })) + 1
                                                  : (hd.filaEncabezado || 1) + 1);
  /* Cómo se arma una fila en el destino: se mira cómo son sus últimas filas.
     Una columna es «de fórmula» si lo es en la mayoría de ellas (el ENT, por
     ejemplo, es fórmula en las cerradas hace poco y valor fijo en las viejas:
     se hace lo que se hace hoy). De la fila más reciente que la tenga sale la
     fórmula para las columnas que solo existen en el destino. */
  var recientes = hd.filas.filter(function (f) { return f.fila < filaDestino && f.celdas[md.contrato]; })
    .sort(function (a, b) { return b.fila - a.fila; }).slice(0, 25);
  var colForm = {}, modeloFila = {};
  if (recientes.length) {
    var desde = recientes[recientes.length - 1].fila, hasta = recientes[0].fila;
    var esReciente = {};
    recientes.forEach(function (f) { esReciente[f.fila] = 1; });
    var bloque = await formulasDeRango(destinoTab, desde, hasta);
    var nn = {}, nf = {};
    bloque.forEach(function (fila, r) {
      var nro = desde + r;
      if (!esReciente[nro]) return;
      (fila || []).forEach(function (v, c) {
        if (v === '' || v === null || v === undefined) return;
        nn[c] = (nn[c] || 0) + 1;
        if (esFormula(v)) { nf[c] = (nf[c] || 0) + 1; modeloFila[c] = Math.max(modeloFila[c] || 0, nro); }
      });
    });
    Object.keys(nn).forEach(function (c) { colForm[c] = (nf[c] || 0) / nn[c] >= 0.5; });
  }

  var formulasO = [];
  for (var i = 0; i < filasO.length; i++) formulasO.push(await formulasDeFila(ref.tab, filasO[i].fila));

  // Lo que se pierde: datos de columnas que el destino no tiene.
  var perdidas = [];
  soloO.forEach(function (c) {
    // Las firmas no cuentan como pérdida: un contrato cerrado se da por firmado por los dos.
    if (c.i === mo.firmaExp || c.i === mo.firmaImp) return;
    // Solo lo que alguien escribió: una columna de fórmula se recalcula, no se pierde.
    var vals = filasO.map(function (f, r) {
      return esFormula((formulasO[r] || [])[c.i]) ? null : f.celdas[c.i];
    }).filter(function (v) { return v !== null && v !== undefined && v !== ''; });
    if (!vals.length) return;
    perdidas.push({ nombre: c.nombre.trim(), valor: vals.map(function (v) {
      return v === true ? 'sí' : v === false ? 'no' : String(v); }).join(', ') });
  });

  var reg = calcularContratos().filter(function (r) { return clave(r.contrato) === k; })[0] || {};
  var ent = pares.filter(function (pr) { return pr.campo === 'entregado'; })[0];
  return {
    contrato: String(nombre).trim(), origenTab: ref.tab, destinoTab: destinoTab,
    haciaCerrados: deAbiertos, ho: ho, hd: hd, mo: mo, md: md,
    filasO: filasO, formulasO: formulasO, colForm: colForm, modeloFila: modeloFila,
    pares: pares, soloD: soloD, soloO: soloO, perdidas: perdidas,
    filaDestino: filaDestino,
    productos: filasO.map(function (f) {
      return { producto: mo.producto === undefined ? '' : f.celdas[mo.producto],
               tns: mo.tns === undefined ? null : f.celdas[mo.tns] };
    }),
    saldo: reg.saldo, embarquesActivos: (reg.embarques || []).length,
    entFormulaOrigen: !!(ent && formulasO[0] && esFormula(formulasO[0][ent.o])),
    entFormulaDestino: !!(ent && colForm[ent.d])
  };
}

// Los pedidos a Google, en el orden en que tienen que ir.
function pedidosMoverContrato(plan) {
  var hd = plan.hd, ho = plan.ho, reqs = [];
  var celda = function (sheetId, fila, col) {
    return { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila,
             startColumnIndex: col, endColumnIndex: col + 1 };
  };
  var copiar = function (de, a, tipo) {
    return { copyPaste: { source: de, destination: a, pasteType: tipo, pasteOrientation: 'NORMAL' } };
  };
  var n = plan.filasO.length, pos = plan.filaDestino;

  reqs.push({ insertDimension: {
    range: { sheetId: hd.sheetId, dimension: 'ROWS', startIndex: pos - 1, endIndex: pos - 1 + n },
    inheritFromBefore: true
  } });

  plan.filasO.forEach(function (fo, r) {
    var dFila = pos + r, fO = plan.formulasO[r] || [];
    plan.pares.forEach(function (pr) {
      var sF = esFormula(fO[pr.o]);
      // Si el destino no tiene datos en esa columna para comparar, se deja como viene.
      var tF = plan.colForm[pr.d] === undefined ? sF : plan.colForm[pr.d];
      var de = celda(ho.sheetId, fo.fila, pr.o), a = celda(hd.sheetId, dFila, pr.d);
      if (sF && !tF) {
        // Fórmula que en el destino es un dato (el ENT en Cerrados): queda el
        // valor de hoy, fijo.
        var v = fo.celdas[pr.o];
        reqs.push({ updateCells: { range: a,
          rows: [{ values: [{ userEnteredValue: (v === null || v === undefined || v === '')
            ? { stringValue: '' } : (esFormula(v) ? { stringValue: v } : aValorSheets(v)) }] }],
          fields: 'userEnteredValue' } });
      } else if (!sF && tF && pr.campo === 'entregado' && plan.modeloFila[pr.d]) {
        // El ENT vuelve a ser fórmula al reabrir: se toma la del destino.
        reqs.push(copiar(celda(hd.sheetId, plan.modeloFila[pr.d], pr.d), a, 'PASTE_FORMULA'));
      } else {
        reqs.push(copiar(de, a, 'PASTE_NORMAL'));
      }
    });
    // Columnas que solo tiene el destino: si tienen fórmula, se arma; las
    // firmas arrancan sin tildar.
    plan.soloD.forEach(function (cd) {
      var a = celda(hd.sheetId, dFila, cd.i);
      if (plan.md.firmaExp === cd.i || plan.md.firmaImp === cd.i) {
        // Venía de Cerrados: se da por firmado por los dos.
        reqs.push({ updateCells: { range: a, rows: [{ values: [{ userEnteredValue: { boolValue: true } }] }],
          fields: 'userEnteredValue' } });
      } else if (plan.colForm[cd.i] && plan.modeloFila[cd.i]) {
        reqs.push(copiar(celda(hd.sheetId, plan.modeloFila[cd.i], cd.i), a, 'PASTE_FORMULA'));
      }
    });
  });

  return reqs;
}

// El borrado de las filas de origen (de abajo hacia arriba). Va APARTE de la copia: ver ejecutarMoverContrato.
function pedidosBorrarOrigenContrato(plan, filasO) {
  return filasO.slice().sort(function (a, b) { return b.fila - a.fila; }).map(function (fo) {
    return { deleteDimension: { range: { sheetId: plan.ho.sheetId, dimension: 'ROWS',
      startIndex: fo.fila - 1, endIndex: fo.fila } } };
  });
}

// Compara lo que había en una fila con lo que se lee en otra. Las fórmulas no se comparan (su valor puede cambiar).
// cols: [{ o: columna en lo esperado, d: columna en lo leído }]. Devuelve cuántas celdas con dato se compararon y cuántas difieren.
function celdasDistintas(esperado, leido, cols, formulas) {
  var mal = 0, comp = 0;
  cols.forEach(function (c) {
    var e = esperado[c.o];
    if (e === null || e === undefined || e === '' || (formulas && esFormula(formulas[c.o]))) return;
    var l = leido[c.d]; comp++;
    var igual = (typeof e === 'number' || typeof l === 'number')
      ? Math.abs((normNum(e) || 0) - (normNum(l) || 0)) < 0.0001
      : clave(e) === clave(l);
    if (!igual) mal++;
  });
  return { mal: mal, comp: comp };
}

// Lee de nuevo filas de una pestaña (valores sin formato), para comprobar lo escrito.
async function leerFilasValores(tab, desde, hasta) {
  var rango = "'" + tab.replace(/'/g, "''") + "'!A" + desde + ':' + letraCol(MAX_COLS - 1) + hasta;
  var d = await api(BASE + S.cfg.sheetId + '/values/' + encodeURIComponent(rango) + '?valueRenderOption=UNFORMATTED_VALUE');
  return (d && d.values) || [];
}

async function ejecutarMoverContrato(nombre) {
  var M = S.moverCtr;
  M.moviendo = true; M.error = null; pintar();
  try {
    // Se vuelve a leer todo: entre que se abrió el cartel y este clic alguien
    // pudo haber tocado la planilla.
    var plan = await planMoverContrato(nombre);
    var n = plan.filasO.length, pos = plan.filaDestino;

    // Tiempo 1: copiar al destino. El origen todavía no se toca.
    await api(BASE + S.cfg.sheetId + ':batchUpdate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requests: pedidosMoverContrato(plan) })
    });

    // Tiempo 2: volver a leer el destino y comprobar que las filas están ahí, con sus datos.
    var colsDest = plan.pares.filter(function (pr) { return plan.colForm[pr.d] !== true; })
      .map(function (pr) { return { o: pr.o, d: pr.d }; });
    var leidas = await leerFilasValores(plan.destinoTab, pos, pos + n - 1);
    var problemas = [], enBlanco = true;
    plan.filasO.forEach(function (fo, i) {
      var fila = leidas[i] || [];
      if (fila.some(function (x) { return x !== '' && x != null; })) enBlanco = false;
      var cmp = celdasDistintas(fo.celdas, fila, colsDest, plan.formulasO[i]);
      if (cmp.comp < 2 || cmp.mal > 0) problemas.push('la fila ' + (i + 1) + ' de ' + n + ' no coincide' +
        (cmp.comp < 2 ? ' (casi no tiene datos)' : ' (' + cmp.mal + ' de ' + cmp.comp + ' datos distintos)'));
    });
    if (problemas.length) {
      // No se tocó el origen. Si lo insertado quedó en blanco, se lo saca para no dejar filas vacías.
      var limpio = false;
      if (enBlanco) {
        try {
          await api(BASE + S.cfg.sheetId + ':batchUpdate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: plan.hd.sheetId, dimension: 'ROWS',
              startIndex: pos - 1, endIndex: pos - 1 + n } } }] })
          });
          limpio = true;
        } catch (e0) { /* se avisa abajo */ }
      }
      throw new Error('No se movió nada: el contrato no quedó bien en «' + plan.destinoTab + '» (desde la fila ' + pos + '): ' +
        problemas.join('; ') + '. Quedó en «' + plan.origenTab + '», sin tocar.' +
        (enBlanco && !limpio ? ' Ojo: pueden haber quedado filas vacías en «' + plan.destinoTab + '».' : ''));
    }

    // Tiempo 3: recién ahora se borra el origen, comprobando antes que esas filas siguen siendo las mismas.
    try {
      var mismas = plan.pares.map(function (pr) { return { o: pr.o, d: pr.o }; });
      for (var k = 0; k < n; k++) {
        var fo = plan.filasO[k];
        var ahora = (await leerFilasValores(plan.origenTab, fo.fila, fo.fila))[0] || [];
        var c2 = celdasDistintas(fo.celdas, ahora, mismas, plan.formulasO[k]);
        if (c2.comp < 2 || c2.mal > 0) throw new Error('la fila ' + fo.fila + ' de «' + plan.origenTab + '» cambió mientras se movía.');
      }
      await api(BASE + S.cfg.sheetId + ':batchUpdate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requests: pedidosBorrarOrigenContrato(plan, plan.filasO) })
      });
    } catch (e1) {
      throw new Error('El contrato YA está copiado en «' + plan.destinoTab + '» (desde la fila ' + pos + ') pero no se pudo borrar de «' +
        plan.origenTab + '»: ' + e1.message + ' Borralo a mano de «' + plan.origenTab + '» para que no quede duplicado.');
    }
    var haciaC = plan.haciaCerrados;
    S.moverCtr = null; S.editCtr = null;
    S.ultimoMovCtr = { contrato: plan.contrato, hacia: haciaC ? 'C' : 'A', desde: plan.origenTab };
    await cargarTodo();
    toast(plan.contrato + ' pasó a «' + plan.destinoTab + '»' +
      (plan.filasO.length > 1 ? ' (' + plan.filasO.length + ' filas)' : ''), 'ok');
  } catch (e) {
    M.moviendo = false; M.error = e.message;
    toast('No se pudo pasar el contrato', 'error');
  }
  pintar();
}

async function abrirMoverContrato(nombre) {
  if (S.editCtr && Object.keys(S.editCtr.cambios).length) {
    return toast('Guardá o descartá primero los cambios del contrato.', 'error');
  }
  S.moverCtr = { contrato: nombre, cargando: true, entiendo: false };
  pintar();
  try {
    var plan = await planMoverContrato(nombre);
    S.moverCtr = { contrato: nombre, plan: plan, entiendo: false };
  } catch (e) {
    S.moverCtr = null;
    toast(e.message, 'error');
  }
  pintar();
}

function modalMoverCtr() {
  var M = S.moverCtr;
  if (!M) return '';
  if (M.cargando) {
    return '<div class="modal-velo"></div><div class="modal-caja"><div class="modal-cambio">' +
      '<h3>Revisando las dos pestañas…</h3><p class="mcm-donde">Un momento.</p></div></div>';
  }
  var P = M.plan, haciaC = P.haciaCerrados;
  var A = haciaC ? 'Contratos Cerrados' : 'Contratos Abiertos';
  var lista = P.productos.map(function (x) {
    return '<li>' + esc(String(x.producto || 'sin producto')) +
      (x.tns !== null && x.tns !== undefined && x.tns !== '' ? ' · ' + fmtNum(normNum(x.tns)) + ' tn' : '') + '</li>';
  }).join('');
  var conSaldo = haciaC && ((P.saldo || 0) > 0.5 || P.embarquesActivos > 0);
  var pierde = P.perdidas.length
    ? P.perdidas.slice(0, 6).map(function (x) { return '«' + esc(x.nombre) + '» (' + esc(x.valor) + ')'; }).join(', ') +
      (P.perdidas.length > 6 ? ' y ' + (P.perdidas.length - 6) + ' más' : '') : '';
  return '<div class="modal-velo" data-act="ctrmoverno"></div>' +
    '<div class="modal-caja"><div class="modal-cambio" role="alertdialog" aria-modal="true" aria-labelledby="mcm-t">' +
      '<h3 id="mcm-t">¿Pasar ' + esc(P.contrato) + ' a ' + (haciaC ? 'Cerrados' : 'Abiertos') + '?</h3>' +
      '<p class="mcm-donde">De «' + esc(P.origenTab) + '» a «' + esc(P.destinoTab) + '» · ' +
        P.filasO.length + (P.filasO.length === 1 ? ' fila' : ' filas') + '</p>' +
      '<ul class="mover-ctr-lista">' + lista + '</ul>' +
      '<ul class="mover-que">' +
        '<li>Se copia entero a «' + esc(A) + '» —datos, fórmulas y formato— y se borra de «' +
          esc(P.origenTab) + '». No queda ninguna fila vacía.</li>' +
        (P.entFormulaOrigen && !P.entFormulaDestino
          ? '<li>El entregado (ENT) queda fijo con el valor de hoy: en «' + esc(A) + '» es un dato, no una fórmula.</li>' : '') +
        (!P.entFormulaOrigen && P.entFormulaDestino
          ? '<li>El entregado (ENT) vuelve a calcularse solo con los embarques.</li>' : '') +
        (!P.haciaCerrados && (P.md.firmaExp !== undefined || P.md.firmaImp !== undefined) &&
         P.soloD.some(function (c) { return c.i === P.md.firmaExp || c.i === P.md.firmaImp; })
          ? '<li>Las casillas de firma quedan tildadas: los cerrados se dan por firmados por exportador e importador.</li>' : '') +
        '<li>El estado del contrato cambia a ' + (haciaC ? '<b class="ce">C</b> cerrado' : '<b class="ca">A</b> abierto') +
          '; se puede volver a pasar cuando haga falta.</li>' +
      '</ul>' +
      (conSaldo
        ? '<div class="mcm-aviso"><span class="mcm-ico">' + ico('enlace') + '</span><div><p>Ojo: todavía ' +
            ((P.saldo || 0) > 0.5 ? 'le faltan <b>' + fmtNum(P.saldo) + ' tn</b> por embarcar' : '') +
            ((P.saldo || 0) > 0.5 && P.embarquesActivos > 0 ? ' y ' : '') +
            (P.embarquesActivos > 0 ? 'tiene <b>' + P.embarquesActivos + (P.embarquesActivos === 1 ? ' embarque' : ' embarques') + '</b> en curso' : '') +
            '.</p><p class="mcm-sub">Cerrarlo ahora lo saca de la lista de abiertos.</p></div></div>' : '') +
      (pierde
        ? '<div class="mcm-aviso"><span class="mcm-ico">' + ico('enlace') + '</span><div><p>«' + esc(A) +
            '» no tiene estas columnas, así que se pierde lo cargado en ellas: ' + pierde + '.</p></div></div>' : '') +
      (M.error ? '<div class="error" style="margin-top:12px">' + esc(M.error) + '</div>' : '') +
      '<label class="chk entiendo"><input type="checkbox" data-moverentiendo="1"' + (M.entiendo ? ' checked' : '') + '>' +
        '<span>Entiendo que se borra de «' + esc(P.origenTab) + '»</span></label>' +
      '<div class="mcm-acc"><button data-act="ctrmoverno"' + (M.moviendo ? ' disabled' : '') + '>Cancelar</button>' +
        '<button class="primario" data-act="ctrmoverok"' + (!M.entiendo || M.moviendo ? ' disabled' : '') + '>' +
          (M.moviendo ? 'Pasando…' : 'Pasar a ' + (haciaC ? 'Cerrados' : 'Abiertos')) + '</button></div>' +
    '</div></div>';
}

// Botón del editor: dice a dónde va.
function botonEstadoCtr(nombre) {
  var est = estadoContrato(nombre);
  if (!est) return '';
  var haciaC = est === 'A';
  return '<button class="btn-estado ' + (haciaC ? 'c' : 'a') + '" data-act="ctrmover" data-k="' + esc(nombre) + '" ' +
    'title="' + (haciaC ? 'Pasa a «Contratos Cerrados»' : 'Vuelve a «Contratos Abiertos»') + '">' +
    '<span class="letra">' + (haciaC ? 'C' : 'A') + '</span>' + (haciaC ? 'Pasar a Cerrados' : 'Pasar a Abiertos') + '</button>';
}

// Después de pasarlo: un atajo para devolverlo, como en «A facturar».
function barraCtrMovido() {
  var m = S.ultimoMovCtr;
  if (!m || S.vista !== 'contratos') return '';
  return '<div class="deshacer-barra">' + ico('volver') +
    '<span><b>' + esc(m.contrato) + '</b> pasó a ' + (m.hacia === 'C' ? 'Cerrados' : 'Abiertos') + '.</span>' +
    '<button data-act="ctrdevolver" data-k="' + esc(m.contrato) + '">Devolverlo a ' +
