  if (!k) return 'sin_facturar';
  if (k.indexOf('cobrad') >= 0) return 'cobrada';
  if (k.indexOf('facturad') >= 0 || k.indexOf('enviad') >= 0) return 'facturada';
  return 'otro';
}

function convertir(v, tipo) {
  if (tipo === 'fecha') {
    // El input type=date devuelve yyyy-mm-dd; sin la Z lo toma como local y
    // puede correrse un día según el huso.
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
      var d = new Date(v + 'T00:00:00Z');
      return isNaN(d) ? null : d;
    }
    return normFecha(v);
  }
  if (tipo === 'numero') return normNum(v);
  return v == null ? '' : String(v).trim();
}

/* ===========================================================================
   Formas de pago descompuestas. El texto libre del contrato no se interpreta
   en vivo: se mapea acá una vez y se revisa a mano. Adivinar la política de
   liberación a partir de una frase es donde no queremos que la app se
   equivoque sola.
   =========================================================================== */

var DISPARADORES = {
  carga:              { label: 'Carga (ETD)',           estimable: true },
  eta:                { label: 'Llegada (ETA)',         estimable: true },
  despacho_ue:        { label: 'Despacho UE',           estimable: false },
  port_health:        { label: 'Port health',           estimable: false },
  recepcion_deposito: { label: 'Recepción en depósito', estimable: false },
  presentacion_docs:  { label: 'Presentación de docs',  estimable: false },
  ninguno:            { label: '—',                     estimable: true }
};

var LIBERACION = {
  contra_pago:      { label: 'Contra pago',      antes: false },
  trust:            { label: 'Docs in trust',    antes: true },
  contra_tramite:   { label: 'Contra despacho',  antes: true },
  contra_recepcion: { label: 'Contra recepción', antes: true }
};

var MAPEO_PAGO = [
  { p:/anticipado|100%\s*prepa/i, momento:'anticipado', disp:'ninguno', dias:0, lib:'contra_pago', medio:'swift' },
  { p:/^cad\s*bank$/i, momento:'contra_documentos', disp:'presentacion_docs', dias:0, lib:'contra_pago', medio:'swift' },
  { p:/cad against scan/i, momento:'contra_documentos', disp:'presentacion_docs', dias:0, lib:'contra_pago', medio:'swift' },
  { p:/documents?\s*in\s*trust/i, momento:'contra_documentos', disp:'presentacion_docs', dias:0, lib:'trust', medio:'swift' },
  { p:/lc at sight/i, momento:'contra_documentos', disp:'presentacion_docs', dias:0, lib:'contra_pago', medio:'lc' },
  { p:/cad.*7\s*d[ií]as?\s*(previo|antes)|cad\s*7\s*days?\s*before|100%\s*cad\s*7/i,
    momento:'contra_documentos', disp:'eta', dias:-7, lib:'contra_pago', medio:'swift' },
  { p:/10%.*carga.*90%.*7\s*d[ií]as/i, momento:'mixto', disp:'eta', dias:-7, lib:'contra_pago', medio:'swift',
    split:[{pct:10,disp:'carga',dias:0},{pct:90,disp:'eta',dias:-7}] },
  { p:/10%\s*adelanta|20%\s*prepayment/i, momento:'mixto', disp:'eta', dias:-7, lib:'contra_pago', medio:'swift', revisar:true },
  { p:/freight cost in advance/i, momento:'mixto', disp:'eta', dias:-7, lib:'contra_pago', medio:'swift', revisar:true },
  { p:/35%\s*cad/i, momento:'mixto', disp:'eta', dias:30, lib:'contra_pago', medio:'swift', revisar:true },
  { p:/after eu clear|after eu customs|payment after arrival after eu/i,
    momento:'al_arribo', disp:'despacho_ue', dias:0, lib:'contra_tramite', medio:'swift' },
  { p:/port health|ph clearance|spanish port check|port check/i,
    momento:'al_arribo', disp:'port_health', dias:0, lib:'contra_tramite', medio:'swift' },
  { p:/100%\s*upon arrival|100%\s*al arribo/i, momento:'al_arribo', disp:'eta', dias:0, lib:'contra_pago', medio:'swift' },
  { p:/(\d+)\s*days? after receipt in warehouse/i, momento:'a_plazo', disp:'recepcion_deposito', dias:7,
    lib:'contra_recepcion', medio:'swift' },
  // Plazos contados desde la carga (ETD). El echeq es solo para cargas locales.
  { p:/45\s*d[ií]as.*echeq.*carga/i, momento:'a_plazo', disp:'carga', dias:45, lib:'contra_pago', medio:'echeq' },
  { p:/45\s*-\s*60\s*d[ií]as.*echeq/i, momento:'a_plazo', disp:'carga', dias:60, lib:'contra_pago', medio:'echeq', revisar:true },
  { p:/^30\s*d[ií]as$/i, momento:'a_plazo', disp:'carga', dias:30, lib:'contra_pago', medio:'swift' }
];

function interpretarPago(texto) {
  var s = String(texto || '').trim();
  if (!s) return { desconocida: true, texto: s };
  for (var i = 0; i < MAPEO_PAGO.length; i++) {
    if (MAPEO_PAGO[i].p.test(s)) {
      var r = MAPEO_PAGO[i];
      return { momento:r.momento, disp:r.disp, dias:r.dias, lib:r.lib, medio:r.medio,
               split:r.split, revisar:r.revisar, texto:s };
    }
  }
  return { desconocida: true, texto: s, revisar: true };
}

// null cuando el disparador no es estimable: mejor "esperando despacho" que
// inventar una fecha.
function fechaCobro(cond, emb) {
  if (!cond || cond.desconocida) return null;
  var d = DISPARADORES[cond.disp];
  if (!d || !d.estimable) return null;
  var base = cond.disp === 'eta' ? emb.eta : emb.etd;
  if (!esFecha(base)) return null;
  var f = new Date(base.getTime());
  f.setUTCDate(f.getUTCDate() + (cond.dias || 0));
  return f;
}

/* ===========================================================================
   Etapas y alertas.
   "Que no se me pase algo de una carga" se resuelve con checklist por etapa,
   no con avisos sueltos que hay que acordarse de mirar.
   =========================================================================== */

var ETAPAS = [
  { id:'creado',       label:'Creado',       req:['exporter','importer','contract','product','tns','price','etd','port'] },
  { id:'pre_embarque', label:'Pre-embarque', req:['booking','containers','shippingLine','vessel'] },
  { id:'embarcado',    label:'Embarcado',    req:['bl','invoice','eta'] },
  { id:'en_transito',  label:'En tránsito',  req:['docs'] },
  { id:'arribado',     label:'Arribado',     req:['tr'] },
  { id:'cobrado',      label:'A facturar',   req:[] }
];

var DIA = 86400000;
function dias(a, b) { return Math.round((a - b) / DIA); }

function lleno(emb, c) {
  var v = emb[c];
  if (v === null || v === undefined || v === '') return false;
  if (typeof v === 'object' && v.invalida) return false;
  if (SEMAFOROS.indexOf(c) >= 0) return v !== 'vacio';
  return true;
}

function etapaDe(emb, hoy) {
  if (emb._aFacturar) return 'cobrado';
  if (estadoComision(emb.invCommission) === 'cobrada') return 'cobrado';
  if (esFecha(emb.eta) && emb.eta < hoy) return 'arribado';
  if (lleno(emb, 'bl')) return (esFecha(emb.eta) && emb.eta > hoy) ? 'en_transito' : 'embarcado';
  if (esFecha(emb.etd) && emb.etd < hoy) return 'embarcado';
  return (esFecha(emb.etd) && dias(emb.etd, hoy) <= 21) ? 'pre_embarque' : 'creado';
}

function faltantes(emb, hoy, mapa, noAplica) {
  var hasta = ETAPAS.map(function (e) { return e.id; }).indexOf(etapaDe(emb, hoy));
  var out = [];
  ETAPAS.slice(0, hasta + 1).forEach(function (et) {
    et.req.forEach(function (c) {
      // No se exige lo que no existe en la pestaña, ni lo que está vacío en
      // todas sus filas (en camión no hay BL ni contenedores).
      if (mapa[c] === undefined) return;
      if (noAplica && noAplica[c]) return;
      if (!lleno(emb, c)) out.push(c);
    });
  });
  return out;
}

var NIVEL = { critico: 3, alto: 2, medio: 1 };

var REGLAS = [
  // La cara: mercadería liberada sin cobrar cuando la condición exige cobrar
  // antes. No es un dato viejo, es plata en la calle.
  function (e, c) {
    if (e.tr !== 'ok' || c.noAplica.tr) return null;
    // Si ya pasó a "A facturar", el cliente pagó: no hay nada que reclamar.
    if (e._aFacturar) return null;
    var pol = LIBERACION[c.cond && c.cond.lib];
    if (!pol || pol.antes) return null;
    if (estadoComision(e.invCommission) === 'cobrada') return null;
    var atraso = c.cobro && c.cobro < c.hoy ? dias(c.hoy, c.cobro) : null;
    return { id:'liberado_sin_cobrar', nivel:'critico', titulo:'Liberado sin registro de cobro',
      detalle: atraso
        ? 'T.R. liberado con condición "' + c.cond.texto + '". Vencía hace ' + atraso + ' días y no hay cobro cargado.'
        : 'T.R. liberado con condición "' + c.cond.texto + '", que se cobra antes de liberar. No hay cobro cargado.',
      accion:'Registrar cobro' };
  },

  // Fechas imposibles: hoy nadie las ve.
  function (e, c) {
    var malas = [], lim = c.hoy.getUTCFullYear() + 1;
    if (e.eta && e.eta.invalida) malas.push('ETA');
    else if (esFecha(e.eta) && !e.eta.anioAsumido && e.eta.getUTCFullYear() > lim) malas.push('ETA');
    if (e.etd && e.etd.invalida) malas.push('ETD');
    else if (esFecha(e.etd) && !e.etd.anioAsumido && e.etd.getUTCFullYear() > lim) malas.push('ETD');
    if (esFecha(e.etd) && esFecha(e.eta) && e.eta < e.etd &&
        !e.eta.anioAsumido && !e.etd.anioAsumido) malas.push('ETA anterior al ETD');
    if (!malas.length) return null;
    return { id:'fecha_corrupta', nivel:'alto', titulo:'Fecha imposible',
      detalle:'Revisar ' + malas.join(', ') + '. Probable error de tipeo.', accion:'Corregir' };
  },

  // Fecha cargada sin año: la app asume uno, pero conviene completarla.
  function (e, c) {
    var sinAnio = [];
    if (esFecha(e.etd) && e.etd.anioAsumido) sinAnio.push('ETD');
    if (esFecha(e.eta) && e.eta.anioAsumido) sinAnio.push('ETA');
    if (!sinAnio.length) return null;
    return { id:'fecha_sin_anio', nivel:'medio', titulo:'Fecha cargada sin año',
      detalle: sinAnio.join(' y ') + ' sin año en la planilla. Se asume ' +
        (esFecha(e.eta) && e.eta.anioAsumido ? e.eta : e.etd).getUTCFullYear() +
        '; conviene completarla.',
      accion:'Completar fecha' };
  },

  function (e, c) {
    if (c.mapa.bl === undefined || c.noAplica.bl) return null;
    if (!esFecha(e.etd) || e.etd >= c.hoy || lleno(e, 'bl')) return null;
    var d = dias(c.hoy, e.etd); if (d < 5) return null;
    return { id:'zarpo_sin_bl', nivel: d > 20 ? 'critico' : 'alto',
      titulo:'Zarpó hace ' + d + ' días y no hay BL',
      detalle:'Sin BL no se puede avanzar con documentos ni liberación.', accion:'Cargar BL' };
  },

  function (e, c) {
    if (!esFecha(e.etd) || e.etd < c.hoy) return null;
    var d = dias(e.etd, c.hoy); if (d > 14) return null;
    var falta = ['booking', 'containers'].filter(function (k) {
      return c.mapa[k] !== undefined && !c.noAplica[k] && !lleno(e, k);
    });
    if (!falta.length) return null;
    return { id:'embarca_sin_booking', nivel: d <= 5 ? 'alto' : 'medio',
      titulo:'Embarca en ' + d + ' días',
      detalle:'Sin ' + falta.map(function (f) { return CAMPOS[f].label.toLowerCase(); }).join(' ni ') + '.',
      accion:'Completar' };
  },

  function (e, c) {
    if (!c.cobro || c.cobro >= c.hoy) return null;
    if (e._aFacturar) return null;
    if (estadoComision(e.invCommission) === 'cobrada') return null;
    var d = dias(c.hoy, c.cobro); if (d < 3) return null;
    return { id:'cobro_vencido', nivel: d > 30 ? 'critico' : 'alto',
      titulo:'Cobro vencido hace ' + d + ' días',
      detalle:'Vencía el ' + fmtFecha(c.cobro) + ' según "' + c.cond.texto + '".', accion:'Reclamar pago' };
  },

  // Trámite de terceros: no hay fecha estimable, pero sí se nota si pasó mucho.
  function (e, c) {
    var d0 = DISPARADORES[c.cond && c.cond.disp];
    if (!d0 || d0.estimable) return null;
    if (!esFecha(e.eta) || e.eta >= c.hoy) return null;
    if (estadoComision(e.invCommission) === 'cobrada') return null;
    var d = dias(c.hoy, e.eta); if (d < 15) return null;
    return { id:'tramite_trabado', nivel: d > 45 ? 'alto' : 'medio',
      titulo:'Esperando ' + d0.label.toLowerCase() + ' hace ' + d + ' días',
      detalle:'El pago depende de un trámite de terceros. Confirmar si ya salió.',
      accion:'Cargar fecha' };
  },

  function (e, c) {
    if (!esFecha(e.etdFinal) || !esFecha(e.etdMaximo)) return null;
    if (e.etdFinal <= e.etdMaximo || lleno(e, 'reclamo')) return null;
    return { id:'roleo', nivel:'alto',
      titulo:'Roleo de ' + dias(e.etdFinal, e.etdMaximo) + ' días sobre el máximo',
      detalle:'El ETD final supera el máximo del contrato y no hay reclamo cargado.',
      accion:'Iniciar reclamo' };
  },

  function (e, c) {
    if (c.mapa.invoice === undefined || c.noAplica.invoice) return null;
    if (!esFecha(e.eta) || e.eta >= c.hoy || lleno(e, 'invoice')) return null;
    var d = dias(c.hoy, e.eta); if (d < 7) return null;
    return { id:'arribo_sin_factura', nivel:'alto',
      titulo:'Llegó hace ' + d + ' días sin factura cargada',
      detalle:'No se puede seguir la cobranza sin la factura.', accion:'Cargar factura' };
  },

  // T.R. solicitado y todavía sin recibir. Lo que importa no es hace cuánto
  // embarcó sino cuánto falta para que llegue: el telex tiene que estar antes.
  function (e, c) {
    if (e.tr !== 'atencion' || c.noAplica.tr) return null;
    if (!esFecha(e.eta)) return null;

    var d = dias(e.eta, c.hoy);
    var det, nivel;

    if (d > 0) {
      det = 'Pedido y todavía no llegó. Faltan ' + d + ' días para la ETA (' +
            fmtFecha(e.eta) + ').';
      nivel = d <= 7 ? 'alto' : 'medio';
    } else if (d === 0) {
      det = 'Pedido y todavía no llegó. El buque llega hoy.';
      nivel = 'critico';
    } else {
      det = 'Pedido y todavía no llegó. El buque llegó hace ' + (-d) + ' días.';
      nivel = 'critico';
    }
    if (e.trModo) det += ' Modalidad: ' + e.trModo + '.';

    return { id:'tr_solicitado', nivel: nivel,
      titulo: d > 0 ? 'Telex release solicitado, sin recibir'
                    : 'Telex release sin recibir y el buque ya llegó',
      detalle: det, accion:'Reclamar a la naviera' };
  },

  // Ya está en "A facturar" (el cliente pagó) pero todavía no se facturó la
  // comisión al exportador. Es plata nuestra sin emitir.
  function (e, c) {
    if (!e._aFacturar) return null;
    if (estadoComision(e.invCommission) !== 'sin_facturar') return null;
    if (c.mapa.invCommission === undefined || c.noAplica.invCommission) {
      // La columna no se usa: igual avisamos, pero sin insistir.
      return { id:'comision_sin_emitir', nivel:'medio',
        titulo:'Pasó a facturar, comisión sin emitir',
        detalle:'El cliente ya pagó al exportador' +
          (e.commission ? '. Comisión a cobrar: US$ ' +
            Number(e.commission).toLocaleString('es-AR') : '') + '.',
        accion:'Facturar comisión' };
    }
    return { id:'comision_sin_emitir', nivel:'alto',
      titulo:'Pasó a facturar, comisión sin emitir',
      detalle:'El cliente ya pagó al exportador y no hay factura de comisión cargada' +
        (e.commission ? '. Son US$ ' + Number(e.commission).toLocaleString('es-AR') : '') + '.',
      accion:'Facturar comisión' };
  },

  // Naranja en Pago estimado: pagaron pero no mandaron el comprobante.
  function (e, c) {
    if (!e._faltaComprobante) return null;
    var ref = esFecha(e.etd) ? dias(c.hoy, e.etd) : null;
    return { id:'falta_comprobante', nivel: (ref !== null && ref > 30) ? 'alto' : 'medio',
      titulo:'Falta el comprobante de pago',
      detalle: ref !== null
        ? 'Marcado en naranja en la planilla. Embarcó hace ' + ref + ' días.'
        : 'Marcado en naranja en la planilla.',
      accion:'Reclamar comprobante' };
  },

  // El celeste dice "mirá esto" pero no dice qué. A los tres días nadie se acuerda.
  function (e, c) {
    // T.R. queda afuera: ahí el celeste significa "solicitado" y se explica solo.
    var m = SEMAFOROS.filter(function (k) { return k !== 'tr' && e[k] === 'atencion'; });
    if (!m.length || lleno(e, 'nota')) return null;
    return { id:'atencion_sin_nota', nivel:'medio', titulo:'Marcado para atención sin explicación',
      detalle:'Marcado en celeste en ' + m.map(function (k) { return CAMPOS[k].label; }).join(', ') +
              '. Sin nota, en tres días nadie se acuerda por qué.', accion:'Agregar nota' };
  }
];

function evaluar(emb, contrato, hoy, mapa, noAplica) {
  var cond = contrato ? contrato.cond : null;
  var ctx = { hoy: hoy, cond: cond, mapa: mapa, noAplica: noAplica || {}, cobro: fechaCobro(cond, emb) };
  var alertas = [];
  REGLAS.forEach(function (r) {
    try { var a = r(emb, ctx); if (a) alertas.push(a); } catch (err) {}
  });
  var falta = faltantes(emb, hoy, mapa, noAplica);
  if (falta.length) {
    alertas.push({ id:'checklist', nivel: falta.length > 4 ? 'alto' : 'medio',
      titulo: falta.length + (falta.length > 1 ? ' campos sin cargar' : ' campo sin cargar'),
      detalle: falta.map(function (f) { return CAMPOS[f].label; }).join(', '),
      accion:'Completar', campos: falta });
  }
  alertas.sort(function (a, b) { return NIVEL[b.nivel] - NIVEL[a.nivel]; });
  return { etapa: etapaDe(emb, hoy), cobro: ctx.cobro, alertas: alertas,
           nivelMax: alertas.length ? alertas[0].nivel : null };
}

/* ===========================================================================
   Google OAuth + API de Sheets, directo desde el navegador.
   =========================================================================== */

var tokenClient = null;

function pedirToken(interactivo) {
  return new Promise(function (resolve, reject) {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      return reject(new Error('No cargó la librería de Google. Revisá la conexión y recargá.'));
    }

    var listo = false;
    function fallar(msg) { if (!listo) { listo = true; reject(new Error(msg)); } }

    if (!tokenClient) {
      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: S.cfg.clientId,
          scope: SCOPE,
          callback: function () {},
          // Sin esto, un popup bloqueado o cerrado deja la promesa colgada
          // para siempre y la app se queda "pensando" sin decir nada.
          error_callback: function (err) {
            var t = err && err.type;
            if (t === 'popup_failed_to_open') {
              return fallar('El navegador bloqueó la ventana de Google. Permití las ventanas emergentes para este sitio y probá de nuevo.');
            }
            if (t === 'popup_closed') {
              return fallar('Cerraste la ventana de Google antes de terminar.');
            }
            fallar('No se pudo abrir el login de Google' + (t ? ' (' + t + ')' : '') + '.');
          }
        });
      } catch (e) {
        return fallar('El Client ID no es válido: ' + e.message);
      }
    }

    tokenClient.callback = function (resp) {
      if (listo) return;
      if (resp.error) {
        return fallar(resp.error === 'access_denied'
          ? 'No diste permiso a la app.'
          : 'Error de autenticación: ' + resp.error);
      }
      listo = true;
      S.token = resp.access_token;
      S.tokenExp = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3500000) - 60000;
      resolve(S.token);
    };

    // Red de seguridad: si en 2 minutos no pasó nada, cortamos con un mensaje
    // en vez de quedarnos tildados.
    setTimeout(function () {
      fallar('El login de Google no respondió. Puede estar bloqueado el popup, o el origen ' +
             location.origin + ' no está autorizado en el Client ID.');
    }, 120000);

    try {
      tokenClient.requestAccessToken({ prompt: interactivo ? 'consent' : '' });
    } catch (e) {
      fallar('No se pudo abrir el login: ' + e.message);
    }
  });
}

// El popup solo se abre confiable si sale de un clic directo, sin ningún await
// en el medio. Por eso el login es un paso propio y no algo que pasa de rebote
// cuando la app necesita leer la planilla.
// Quién está usando el portal. Si falla, se sigue igual: el comentario queda
// sin autor antes que romper el flujo.
async function identificar() {
  try {
    var r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + S.token }
    });
    if (!r.ok) return;
    var u = await r.json();
    S.usuario = { email: u.email || '', nombre: u.name || u.email || '' };
  } catch (e) {}
}

async function entrar() {
  S.error = null; S.setup.entrando = true; pintar();
  try {
    await pedirToken(false);
    await identificar();
    S.setup.entrando = false;
    // Si ya estaba todo elegido de una sesión anterior, no volvemos a preguntar.
    if (S.cfg.sheetId && (S.cfg.tabsEmb || []).length) {
      S.pantalla = 'app';
      pintar();
      return cargarTodo();
    }
    pintar();
  } catch (e) {
    S.setup.entrando = false;
    S.error = e.message;
    pintar();
  }
}

async function conToken() {
  if (S.token && Date.now() < S.tokenExp) return S.token;
  return pedirToken(false);
}

async function api(url, opciones) {
  var token = await conToken();
  var o = opciones || {};
  o.headers = Object.assign({ Authorization: 'Bearer ' + token }, o.headers || {});
  var r = await fetch(url, o);

  if (r.status === 401) {           // token vencido: pedir de nuevo y reintentar
    S.token = null;
    token = await pedirToken(false);
    o.headers.Authorization = 'Bearer ' + token;
    r = await fetch(url, o);
  }

  var cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) {}
  if (!r.ok) {
    var msg = (cuerpo && cuerpo.error && cuerpo.error.message) || ('Error ' + r.status);
    if (r.status === 403) {
      msg = /has not been used|is disabled/i.test(msg)
        ? 'Falta habilitar la Google Sheets API en tu proyecto de Google Cloud. Abrí Biblioteca, buscá "Google Sheets API" y dale Habilitar. Puede tardar un minuto en tomar efecto.'
        : 'Tu cuenta no tiene permiso sobre esta planilla. ' + msg;
    }
    if (r.status === 404) msg = 'No existe una planilla con ese id, o tu cuenta no tiene acceso.';
    throw new Error(msg);
  }
  return cuerpo;
}

var BASE = 'https://sheets.googleapis.com/v4/spreadsheets/';

// La API devuelve {properties:{title}, sheets:[{properties:{...}}]}.
// Lo traducimos acá para que el resto de la app no dependa de esa forma.
async function listarPestanas(id) {
  var d = await api(BASE + id + '?fields=' +
    encodeURIComponent('properties(title),sheets(properties(sheetId,title))'));
  var hojas = (d && d.sheets) || [];
  if (!hojas.length) throw new Error('La planilla no tiene pestañas visibles.');
  return {
    titulo: (d.properties && d.properties.title) || '(sin nombre)',
    pestanas: hojas.map(function (h) {
      return { id: h.properties.sheetId, nombre: h.properties.title };
    })
  };
}

async function leerHoja(id, nombre) {
  var rango = "'" + nombre.replace(/'/g, "''") + "'!A1:" + letraCol(MAX_COLS - 1) + MAX_FILAS;
  var campos = 'sheets(properties(sheetId,title),data(rowData(values(effectiveValue,effectiveFormat/backgroundColor))))';
  var d = await api(BASE + id + '?includeGridData=true&ranges=' + encodeURIComponent(rango) +
                    '&fields=' + encodeURIComponent(campos));
  var hoja = d.sheets && d.sheets[0];
  if (!hoja) throw new Error('No existe la pestaña "' + nombre + '"');
  var grid = (hoja.data && hoja.data[0] && hoja.data[0].rowData) || [];

  function celda(c) {
    if (!c) return { v: null, bg: null };
    var ev = c.effectiveValue || {}, v = null;
    if (ev.numberValue !== undefined) v = ev.numberValue;
    else if (ev.stringValue !== undefined) v = ev.stringValue;
    else if (ev.boolValue !== undefined) v = ev.boolValue;
    return { v: v, bg: (c.effectiveFormat && c.effectiveFormat.backgroundColor) || null };
  }

  // Algunas pestañas ("A facturar") tienen una fila de números arriba y los
  // encabezados reales en la fila 2. Se detecta en vez de asumir.
  function esFilaEncabezado(vals) {
    var textos = 0, numeros = 0;
    (vals || []).forEach(function (c) {
      var v = celda(c).v;
      if (v === null || v === '') return;
      if (typeof v === 'number') numeros++; else textos++;
    });
    return textos >= 3 && textos > numeros;
  }

  var iEnc = 0;
  if (!esFilaEncabezado(grid[0] && grid[0].values) &&
      esFilaEncabezado(grid[1] && grid[1].values)) {
    iEnc = 1;
  }

  var encabezados = ((grid[iEnc] && grid[iEnc].values) || []).map(function (c) { return celda(c).v; });
  var primeraClave = clave(encabezados[0]);
  var filas = [];
  for (var i = iEnc + 1; i < grid.length; i++) {
    var vals = (grid[i] && grid[i].values) || [];
    var p = celda(vals[0]).v;
    if (p === null || p === '') continue;
    // Encabezado repetido en el medio: pasa cuando se pegan bloques de filas.
    if (clave(p) === primeraClave) continue;
    var celdas = [], colores = [];
    for (var j = 0; j < MAX_COLS; j++) { var c2 = celda(vals[j]); celdas[j] = c2.v; colores[j] = c2.bg; }
    filas.push({ fila: i + 1, celdas: celdas, colores: colores });
  }
  return { sheetId: hoja.properties.sheetId, encabezados: encabezados, filas: filas, filaEncabezado: iEnc + 1 };
}

function aValorSheets(v) {
  if (v === null || v === undefined || v === '') return { stringValue: '' };
  if (typeof v === 'number') return { numberValue: v };
  if (v instanceof Date) return { numberValue: Math.floor((v - EPOCH) / DIA) };
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(v))) {
    var d = new Date(String(v) + 'T00:00:00Z');
    if (!isNaN(d)) return { numberValue: Math.floor((d - EPOCH) / DIA) };
  }
  return { stringValue: String(v) };
}

function escribirCeldas(id, sheetId, fila, valores, colores) {
  var reqs = [];
  Object.keys(valores || {}).forEach(function (idx) {
    var c = +idx;
    reqs.push({ updateCells: {
      range: { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila, startColumnIndex: c, endColumnIndex: c + 1 },
      rows: [{ values: [{ userEnteredValue: aValorSheets(valores[idx]) }] }],
      fields: 'userEnteredValue' } });
  });
  Object.keys(colores || {}).forEach(function (idx) {
    var c = +idx;
    reqs.push({ repeatCell: {
      range: { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila, startColumnIndex: c, endColumnIndex: c + 1 },
      cell: { userEnteredFormat: { backgroundColor: COLORES[colores[idx]] || COLORES.vacio } },
      fields: 'userEnteredFormat.backgroundColor' } });
  });
  if (!reqs.length) return Promise.resolve();
  return api(BASE + id + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: reqs })
  });
}

/* --- Listas de import_DB ---------------------------------------------------
   Los desplegables del alta salen de ahí: exportadores C3:C, importadores B3:B,
   productos D3:D y tipos E3:E5. Así no entran nombres nuevos escritos a mano,
   que es lo que rompe el cruce con los contratos.
   -------------------------------------------------------------------------- */

var TIPOS_FALLBACK = ['Maní', 'Aceite', 'Expeller', 'Birdfood'];

async function cargarListas() {
  S.listas = { exportadores: [], importadores: [], productos: [], tipos: [] };
  if (!S.cfg.tabDB) return;

  var limpiar = function (col) {
    var out = [], vistos = {};
    (col || []).forEach(function (f) {
      var v = f && f[0] ? String(f[0]).trim() : '';
      if (!v) return;
      var k = clave(v);
      if (vistos[k]) return;      // la lista tiene repetidos
      vistos[k] = 1; out.push(v);
    });
    return out.sort(function (a, b) { return a.localeCompare(b, 'es'); });
  };

  try {
    var q = "'" + S.cfg.tabDB.replace(/'/g, "''") + "'!";
    var r = await api(BASE + S.cfg.sheetId + '/values:batchGet?' +
      ['B3:B2000', 'C3:C2000', 'D3:D2000', 'E3:E20'].map(function (rg) {
        return 'ranges=' + encodeURIComponent(q + rg);
      }).join('&'));

    var v = r.valueRanges || [];
    S.listas.importadores = limpiar(v[0] && v[0].values);
    S.listas.exportadores = limpiar(v[1] && v[1].values);
    S.listas.productos    = limpiar(v[2] && v[2].values);
    S.listas.tipos        = limpiar(v[3] && v[3].values);
    if (!S.listas.tipos.length) S.listas.tipos = TIPOS_FALLBACK.slice();
  } catch (e) {
    S.listas.tipos = TIPOS_FALLBACK.slice();
  }
}

/* --- Alta de contratos -----------------------------------------------------
   La fila se inserta justo arriba de la que dice TOTAL en la columna A, para
   que quede dentro del bloque de datos. Las columnas calculadas (Total,
   Comisión, ENT, Saldo) se escriben como fórmula, iguales a las del resto.
   -------------------------------------------------------------------------- */

async function filaTotalDe(pestana) {
  var r = await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A1:A2000"));
  var vals = r.values || [];
  for (var i = 0; i < vals.length; i++) {
    var v = vals[i] && vals[i][0];
    if (v && String(v).trim().toUpperCase().indexOf('TOTAL') === 0) return i + 1;
  }
  return null;
}

// Qué contrato quedó justo arriba del TOTAL, para saber por dónde numerar.
async function ultimoContrato() {
  var pestana = S.cfg.tabAlta;
  if (!pestana) return null;
  var r = await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A1:B2000"));
  var vals = r.values || [];

  var iTotal = -1;
  for (var i = 0; i < vals.length; i++) {
    var a0 = vals[i] && vals[i][0];
    if (a0 && String(a0).trim().toUpperCase().indexOf('TOTAL') === 0) { iTotal = i; break; }
  }
  if (iTotal < 1) return null;

  // Hacia arriba hasta encontrar una fila con contrato.
  for (var j = iTotal - 1; j >= 1; j--) {
    var b = vals[j] && vals[j][1];
    if (b && String(b).trim()) {
      var ctr = String(b).trim();
      return { contrato: ctr, fila: j + 1, sugerido: siguienteNumero(ctr) };
    }
  }
  return null;
}

// LT099-2026 -> LT100-2026. Si el formato es otro, no inventa nada.
function siguienteNumero(ctr) {
  var m = String(ctr).match(/^(LT)\s*(\d+)\s*-\s*(\d{4})/i);
  if (!m) return '';
  var n = String(parseInt(m[2], 10) + 1);
  while (n.length < m[2].length) n = '0' + n;
  return m[1].toUpperCase() + n + '-' + m[3];
}

async function crearContrato(datos) {
  var pestana = S.cfg.tabAlta;
  if (!pestana) throw new Error('No hay una pestaña de alta configurada.');

  var meta = await api(BASE + S.cfg.sheetId +
    '?fields=' + encodeURIComponent('sheets(properties(sheetId,title))'));
  var hoja = (meta.sheets || []).filter(function (h) {
    return h.properties.title === pestana;
  })[0];
  if (!hoja) throw new Error('No existe la pestaña "' + pestana + '".');
  var sheetId = hoja.properties.sheetId;

  var filaTotal = await filaTotalDe(pestana);
  if (!filaTotal) {
    throw new Error('No encontré una fila que diga TOTAL en la columna A de "' +
      pestana + '". Sin eso no sé dónde insertar sin pisar nada.');
  }
  var destino = filaTotal;   // la nueva fila ocupa el lugar del TOTAL, que baja

  // 1) Insertar la fila, heredando el formato de la de arriba.
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{
        insertDimension: {
          range: { sheetId: sheetId, dimension: 'ROWS',
                   startIndex: destino - 1, endIndex: destino },
          inheritFromBefore: true
        }
      }]
    })
  });

  // 2) Escribir los valores. Las fórmulas replican las del resto de las filas.
  var n = destino;
  var sumifs =
    "=SUMIFS('Embarques maritimos'!G:G, 'Embarques maritimos'!C:C, B" + n +
    ", 'Embarques maritimos'!D:D, E" + n + ") + " +
    "SUMIFS('Cargas terrestres'!G:G, 'Cargas terrestres'!C:C, B" + n +
    ", 'Cargas terrestres'!D:D, E" + n + ") + " +
    "SUMIFS('A facturar'!G:G, 'A facturar'!C:C, B" + n +
    ", 'A facturar'!D:D, E" + n + ")";

  var fila = [
    datos.fecha,          // A Fecha
    datos.contrato,       // B
    datos.exportador,     // C
    datos.importador,     // D
    datos.producto,       // E
    datos.tipo,           // F
    datos.toneladas,      // G
    datos.precio,         // H
    '=H' + n + '*G' + n,  // I Total
    datos.packaging,      // J
    datos.incoterm,       // K
    datos.formaPago,      // L
    '=I' + n + '*0.02',   // M Comisión
    '',                   // N PAGOS USA
    sumifs,               // O ENT
    '=G' + n + '-O' + n,  // P Saldo
    datos.periodo         // Q
  ];

  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + pestana.replace(/'/g, "''") + "'!A" + n) +
    '?valueInputOption=USER_ENTERED', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [fila] })
  });

  return n;
}

/* --- Shipment advice ------------------------------------------------------
   Reutiliza el Apps Script que ya está en la planilla, publicado como Web App.
   La app le manda los datos del embarque y el script genera el borrador con la
   plantilla de siempre. No se duplica la lógica del mail acá.

   Se manda como text/plain a propósito: con application/json el navegador hace
   un preflight OPTIONS que Apps Script no contesta, y la llamada falla por CORS.
   -------------------------------------------------------------------------- */

// El script combina varias filas en un solo advice cuando son de la misma
// carga. Estas son las candidatas: misma pestaña, mismo BL, buque, ETD y ETA.
// Es la misma regla que valida el script del lado de la planilla.
function hermanasAdvice(emb) {
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  return S.datos.filas.filter(function (o) {
    if (o._tab !== emb._tab) return false;
    if (o._id === emb._id) return false;
    if (!o.bl || !emb.bl) return false;
    return clave(o.bl) === clave(emb.bl) &&
           clave(o.vessel) === clave(emb.vessel) &&
           f(o.etd) === f(emb.etd) &&
           f(o.eta) === f(emb.eta) &&
           clave(o.exporter) === clave(emb.exporter) &&
           clave(o.importer) === clave(emb.importer);
  });
}

// Antes de generar: si falta el BL o el buque el advice sale incompleto y hay
// que rehacerlo. Mejor verlo acá que en el borrador.
function faltantesAdvice(emb) {
  var req = [['bl', 'BL'], ['vessel', 'Buque'], ['eta', 'ETA'],
             ['etd', 'ETD'], ['port', 'Puerto']];
  var src = fuenteDe(emb);
  return req.filter(function (r) {
    if (src.mapa[r[0]] === undefined || src.noAplica[r[0]]) return false;
    var v = emb[r[0]];
    return v === null || v === undefined || v === '' || (v && v.invalida);
  }).map(function (r) { return r[1]; });
}

function filasAdvice(emb) {
  var sel = [emb];
  hermanasAdvice(emb).forEach(function (o) {
    if (S.adviceFilas && S.adviceFilas[o._id]) sel.push(o);
  });
  return sel.sort(function (a, b) { return a._fila - b._fila; });
}

async function enviarAdvice(ids, desdeBarra) {
  var sel = (Array.isArray(ids) ? ids : [ids]).map(filaPorId).filter(Boolean)
    .sort(function (a, b) { return a._fila - b._fila; });
  if (!sel.length) return;

  var marca = desdeBarra ? { barra: true } : { id: sel[0]._id };

  if (!S.cfg.adviceUrl) {
    S.adviceMsg = Object.assign({ error: 'Falta la URL del script. Se carga en Pestañas.' }, marca);
    return pintar();
  }

  var destino = (S.adviceTo !== null && S.adviceTo !== undefined)
    ? S.adviceTo : (sel[0].mailsCC || '');
  if (!String(destino).trim()) {
    S.adviceMsg = Object.assign({
      error: 'Falta el destinatario. La columna Mails CC de esa fila está vacía.'
    }, marca);
    return pintar();
  }

  S.adviceEnviando = desdeBarra ? 'barra' : sel[0]._id;
  S.adviceMsg = null; pintar();

  var cuerpo = {
    accion: 'shipment_advice',
    token: S.cfg.adviceToken || '',
    pestana: sel[0]._tab,
    filas: sel.map(function (o) { return o._fila; }),
    contratos: sel.map(function (o) { return o.contract || ''; }),
    toEmail: String(destino).trim(),
    idioma: S.adviceIdioma || 'en',
    conPeter: !!S.advicePeter,
    solicitadoPor: S.usuario ? S.usuario.email : ''
  };

  try {
    var r = await fetch(S.cfg.adviceUrl, {
      method: 'POST',
      // text/plain a propósito: con application/json el navegador manda un
      // preflight OPTIONS que Apps Script no contesta y falla por CORS.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo),
      redirect: 'follow'
    });
    var txt = await r.text();
    var data = null;
    try { data = JSON.parse(txt); } catch (e) {}

    if (!r.ok) throw new Error('El script respondió ' + r.status);
    if (!data) throw new Error('Respuesta inesperada. ¿Está publicado como aplicación web con acceso "Cualquier usuario"?');
    if (data.error) throw new Error(data.error);

    S.adviceMsg = Object.assign({
      ok: true, texto: data.mensaje || 'Borrador creado.', url: data.draftUrl
    }, marca);

    // Marcar en el acto, sin esperar a releer la planilla.
    var ahora = new Date();
    var reg = {
      fecha: ahora.toLocaleDateString('es-AR'),
      quien: S.usuario ? S.usuario.email : '',
      pestana: sel[0]._tab
    };
    sel.forEach(function (o) {
      if (o.bl) S.advices.set('b|' + clave(o.bl), reg);
      if (o.contract) S.advices.set('c|' + clave(o.contract), reg);
    });

    if (desdeBarra) S.marcados = {};
  } catch (e) {
    var qs = '?accion=shipment_advice&token=' + encodeURIComponent(S.cfg.adviceToken || '') +
      '&pestana=' + encodeURIComponent(sel[0]._tab) +
      '&filas=' + sel.map(function (o) { return o._fila; }).join(',') +
      '&contratos=' + encodeURIComponent(sel.map(function (o) { return o.contract || ''; }).join('|')) +
      '&toEmail=' + encodeURIComponent(String(destino).trim()) +
      '&idioma=' + (S.adviceIdioma || 'en') +
      '&conPeter=' + (S.advicePeter ? 'true' : 'false');
    S.adviceMsg = Object.assign({
      error: e.message,
      fallback: S.cfg.adviceUrl.replace(/\?.*$/, '') + qs
    }, marca);
  } finally {
    S.adviceEnviando = null; pintar();
  }
}

// Bloque del panel.
function bloqueAdvice(emb, ev) {
  if (!S.cfg.adviceUrl) return '';

  var falta = faltantesAdvice(emb);
  var msg = (S.adviceMsg && S.adviceMsg.id === emb._id) ? S.adviceMsg : null;
  var hermanas = hermanasAdvice(emb);
  var sel = filasAdvice(emb);
  var destino = (S.adviceTo !== null && S.adviceTo !== undefined)
    ? S.adviceTo : (sel[0].mailsCC || '');

  var yaEnviado = adviceDe(emb);
  var h = '<div class="bloque"><h3 class="gt">Shipment advice</h3>';

  if (yaEnviado) {
    var fEnv = fechaAdvice(yaEnviado);
    h += '<div class="adv-hecho">' + ico('check') +
      '<span>Ya se generó un advice para este embarque' +
      (fEnv ? ' el ' + esc(fEnv) : '') +
      (yaEnviado.quien ? ', por ' + esc(nombreCortoAutor(yaEnviado.quien)) : '') +
      '. Si lo volvés a generar se crea otro borrador.</span></div>';
  }

  if (msg && msg.ok) {
    h += '<div class="ok-aviso" style="margin:0 0 12px;white-space:pre-line">' +
      esc(msg.texto) +
      (msg.url ? '\n<a href="' + esc(msg.url) + '" target="_blank" rel="noopener">' +
        'Abrir borradores en Gmail</a>' : '') + '</div>';
  }
  if (msg && msg.error) {
    h += '<div class="error" style="margin:0 0 12px;white-space:pre-line">' + esc(msg.error) +
      (msg.fallback ? '<br><a href="' + esc(msg.fallback) + '" target="_blank" ' +
        'rel="noopener">Probar abriéndolo en una pestaña</a>' : '') + '</div>';
  }

  if (falta.length) {
    h += '<p class="advice-falta">Falta cargar ' + falta.join(', ') +
      '. El advice va a salir incompleto.</p>';
  }

  // Filas de la misma carga, para mandar un solo advice con todos los productos.
  if (hermanas.length) {
    h += '<p class="ayuda" style="margin:0 0 7px">Otras filas del mismo BL. ' +
      'Marcá las que van en el mismo advice:</p>';
    hermanas.forEach(function (o) {
      var on = S.adviceFilas && S.adviceFilas[o._id];
      h += '<label class="chk"><input type="checkbox" data-advfila="' + esc(o._id) + '"' +
        (on ? ' checked' : '') + '>' +
        '<span>Fila ' + o._fila + ' · ' +
        esc((o.tns || '') + ' tn ' + (o.product || '')) + '</span></label>';
    });
  }

  h += '<div class="campo" style="margin-top:12px">' +
    '<label for="adv-to">Destinatarios</label>' +
    '<input id="adv-to" data-advto="1" value="' + esc(destino) + '" ' +
    'placeholder="cliente@empresa.com"></div>' +
    '<p class="ayuda" style="margin:-8px 0 12px">Separar con coma. Se precarga de Mails CC. ' +
    'La copia fija la agrega el script.</p>';

  h += '<div class="adv-fila">' +
    '<span class="modos">' +
      [['en', 'English'], ['es', 'Español']].map(function (o) {
        return '<button data-act="advidioma" data-v="' + o[0] + '" aria-pressed="' +
          ((S.adviceIdioma || 'en') === o[0]) + '">' + o[1] + '</button>';
      }).join('') +
    '</span>' +
    '<label class="chk"><input type="checkbox" data-advpeter="1"' +
      (S.advicePeter ? ' checked' : '') + '><span>Peter en copia</span></label>' +
    '</div>';

  h += '<button class="primario ancho" data-act="advice" data-f="' + esc(emb._id) + '"' +
    (S.adviceEnviando === emb._id ? ' disabled' : '') + '>' +
    (S.adviceEnviando === emb._id
      ? 'Creando…'
      : ico('mail') + 'Crear borrador del shipment advice' +
        (sel.length > 1 ? ' (' + sel.length + ' filas)' : '')) +
    '</button>' +
    '<p class="ayuda">Queda como borrador en Gmail para revisarlo. No se envía solo.</p>' +
    '</div>';

  return h;
}

/* --- Registro de advices enviados -----------------------------------------
   El script deja una fila en "Advices enviados" cada vez que genera un
   borrador. La app la lee para marcar los embarques: así la marca sobrevive a
   recargar y la ven todos, no solo quien lo generó.
   -------------------------------------------------------------------------- */

var HOJA_ADVICES = 'Advices enviados';

async function cargarAdvices() {
  S.advices = new Map();
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(title))'));
    var existe = (meta.sheets || []).some(function (h) {
      return clave(h.properties.title) === clave(HOJA_ADVICES);
    });
    if (!existe) return;

    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + HOJA_ADVICES + "'!A2:I3000"));

    S.advicesViejos = 0;

    (r.values || []).forEach(function (f) {
      // Formato viejo: Fecha | Filas | Para | CC | Idioma | Quién. Se reconoce
      // porque la columna B es una lista de números.
      //
      // Esos registros NO se pueden ubicar: guardaban el número de fila, y las
      // filas se reordenan por ETA, así que hoy apuntan a otro embarque.
      // Marcar por ahí sería peor que no marcar. Se cuentan para avisar.
      if (f[1] && /^[\d,\s]+$/.test(String(f[1]).trim())) {
        S.advicesViejos++;
        return;
      }

      var reg = { fecha: f[0] || '', pestana: f[1] || '', quien: f[8] || '' };

      String(f[3] || '').split(',').forEach(function (c) {
        var k = clave(c);
        if (k) S.advices.set('c|' + k, reg);
      });
      String(f[4] || '').split(',').forEach(function (b) {
        var k = clave(b);
        if (k) S.advices.set('b|' + k, reg);
      });
    });
  } catch (e) {
    S.advices = new Map();
  }
}

// El BL manda: identifica el embarque exacto. El contrato es el respaldo para
// las cargas sin BL.
function adviceDe(emb) {
  if (!S.advices || !S.advices.size) return null;
  if (emb.bl) {
    var porBL = S.advices.get('b|' + clave(emb.bl));
    if (porBL) return porBL;
  }
  if (emb.contract) {
    var porCtr = S.advices.get('c|' + clave(emb.contract));
    // Sin BL propio no se puede distinguir un parcial de otro, así que solo
    // se acepta el match por contrato cuando el embarque no tiene BL.
    if (porCtr && !emb.bl) return porCtr;
  }
  return null;
}

// Fecha corta del registro, que puede venir como texto de Sheets.
function fechaAdvice(reg) {
  var t = String(reg && reg.fecha || '');
  var m = t.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
  if (m) return m[1];
  var d = new Date(t);
  return isNaN(d) ? '' : fmtFecha(d);
}

/* --- Comentarios -----------------------------------------------------------
   Viven en una pestaña propia de la misma planilla: una fila por comentario.
   Así quedan auditables, se ven desde Sheets y no pisan las celdas de datos.
   Se atan al embarque por contrato + BL + pestaña, no por número de fila, que
   cambia cuando alguien inserta u ordena.
   -------------------------------------------------------------------------- */

// Clave estable de un embarque para colgarle comentarios.
function claveComentario(emb) {
  return [clave(emb._tab), clave(emb.contract), clave(emb.bl || '')].join('|');
}

async function cargarComentarios() {
  S.comentarios = new Map();
  try {
    var meta = await api(BASE + S.cfg.sheetId +
      '?fields=' + encodeURIComponent('sheets(properties(sheetId,title))'));
    var hoja = (meta.sheets || []).filter(function (h) {
      return clave(h.properties.title) === clave(HOJA_COMENTARIOS);
    })[0];
    if (!hoja) { S.hojaComentarios = null; return; }
    S.hojaComentarios = hoja.properties.title;

    var r = await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + S.hojaComentarios + "'!A2:G5000"));
    (r.values || []).forEach(function (f) {
      if (!f || !f[5]) return;
      var k = [clave(f[2]), clave(f[3]), clave(f[4] || '')].join('|');
      var lista = S.comentarios.get(k) || [];
      lista.push({ fecha: f[0], autor: f[1], texto: f[5], sobre: f[6] || '' });
      S.comentarios.set(k, lista);
    });
  } catch (e) {
    // Sin comentarios no se cae la app.
    S.hojaComentarios = null;
  }
}

async function crearHojaComentarios() {
  await api(BASE + S.cfg.sheetId + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      requests: [{ addSheet: { properties: { title: HOJA_COMENTARIOS } } }]
    })
  });
  await api(BASE + S.cfg.sheetId + '/values/' +
    encodeURIComponent("'" + HOJA_COMENTARIOS + "'!A1") +
    ':append?valueInputOption=USER_ENTERED', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [ENC_COMENTARIOS] })
  });
  S.hojaComentarios = HOJA_COMENTARIOS;
}

async function comentar(id, texto) {
  texto = String(texto || '').trim();
  if (!texto) return;
  var emb = filaPorId(id);
  if (!emb) return;

  S.enviando = true; pintar();
  try {
    if (!S.hojaComentarios) await crearHojaComentarios();

    var ahora = new Date();
    var fecha = ahora.toLocaleDateString('es-AR') + ' ' +
                ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    var autor = S.usuario ? (S.usuario.email || S.usuario.nombre) : 'desconocido';
    var ev = S.ultimaEval && S.ultimaEval[id];
    var sobre = ev && ev.alertas.length ? ev.alertas[0].titulo : '';

    var fila = [fecha, autor, emb._tab, emb.contract || '', emb.bl || '', texto, sobre];

    await api(BASE + S.cfg.sheetId + '/values/' +
      encodeURIComponent("'" + S.hojaComentarios + "'!A1") +
      ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values: [fila] })
    });

    var k = claveComentario(emb);
    var lista = S.comentarios.get(k) || [];
    lista.push({ fecha: fecha, autor: autor, texto: texto, sobre: sobre });
    S.comentarios.set(k, lista);
    S.borrador = '';
  } catch (e) {
    S.error = 'No se pudo guardar el comentario: ' + e.message;
  } finally {
    S.enviando = false; pintar();
  }
}

function comentariosDe(emb) {
  return S.comentarios.get(claveComentario(emb)) || [];
}

/* --- Carga de datos -------------------------------------------------------- */

async function cargarTodo() {
  S.cargando = true; S.error = null; pintar();
  var avisos = [];
  try {
    // Cada pestaña se lee y se mapea por separado: los encabezados de las
    // terrestres no son los mismos que los de las marítimas.
    var fuentes = [];
    for (var i = 0; i < S.cfg.tabsEmb.length; i++) {
      var tab = S.cfg.tabsEmb[i];
      var h;
      try {
        h = await leerHoja(S.cfg.sheetId, tab);
      } catch (e) {
        avisos.push('No se pudo leer "' + tab + '": ' + e.message);
        continue;
      }
      var det = detectar(h.encabezados, CAMPOS);

      var filas = h.filas.map(function (f) {
        var o = { _fila: f.fila, _tab: tab, _sheetId: h.sheetId, _id: tab + ':' + f.fila };
        Object.keys(det.mapa).forEach(function (campo) {
          var idx = det.mapa[campo];
          o[campo] = CAMPOS[campo].tipo === 'semaforo'
            ? colorASem(f.colores[idx])
            : convertir(f.celdas[idx], CAMPOS[campo].tipo);
        });
        // Si la ETA vino sin año y quedó antes del ETD, es del año siguiente.
        if (o.eta && o.eta.anioAsumido && esFecha(o.etd) && esFecha(o.eta) && o.eta < o.etd) {
          var ajust = new Date(Date.UTC(o.eta.getUTCFullYear() + 1,
                                        o.eta.getUTCMonth(), o.eta.getUTCDate()));
          ajust.anioAsumido = true; ajust.crudo = o.eta.crudo;
          o.eta = ajust;
        }

        // En las columnas semáforo el color es el estado y el texto es otra cosa:
        // en Docs. son anotaciones operativas ("recibir factura y enviar gas
        // free"), en T.R. la modalidad. Se guardan aparte para no perderlas.
        o._notas = {};
        SEMAFOROS.forEach(function (c) {
          var ic = det.mapa[c];
          if (ic === undefined) return;
          var tx = f.celdas[ic];
          o._notas[c] = tx == null ? '' : String(tx).trim();
        });

        // En T.R. el texto es la MODALIDAD de liberación (BL Original / telex),
        // no el estado. El estado es el color. Se guardan por separado.
        // Ojo: la columna mezcla modalidad ("BL Original", "telex") con
        // palabras de estado ("solicitada"), que ya vienen en el color. Solo
        // tomamos las que son realmente modalidad.
        if (det.mapa.tr !== undefined) {
          var t = clave(f.celdas[det.mapa.tr]);
          o.trModo = /bl original|original/.test(t) ? 'BL original'
                   : /telex/.test(t) ? 'Telex release'
                   : /express/.test(t) ? 'Express release'
                   : '';
        }

        // Naranja en "Pago estimado" = falta que manden el comprobante.
        var ip = det.mapa[COL_COMPROBANTE];
        o._faltaComprobante = ip !== undefined && esNaranja(f.colores[ip]);
        return o;
      });

      // Una columna vacía en TODAS las filas de esta pestaña no aplica a este
      // tipo de carga: en camión no hay BL ni contenedores. No la exigimos.
      var noAplica = {};
      Object.keys(det.mapa).forEach(function (campo) {
        var alguna = filas.some(function (o) {
          var v = o[campo];
          if (SEMAFOROS.indexOf(campo) >= 0) return v && v !== 'vacio';
          return v !== null && v !== undefined && v !== '';
        });
        if (!alguna) noAplica[campo] = 1;
      });

      fuentes.push({ tab: tab, sheetId: h.sheetId, mapa: det.mapa,
                     extras: det.extras, encabezados: h.encabezados,
                     noAplica: noAplica, filas: filas });
    }

    if (!fuentes.length) throw new Error(avisos.join(' · ') || 'No se pudo leer ninguna pestaña.');

    var todas = [];
    fuentes.forEach(function (f) { todas = todas.concat(f.filas); });
    S.fuentes = fuentes;
    S.datos = { filas: todas };

    // Contratos: se juntan todas las pestañas elegidas. Un embarque puede estar
    // en curso con el contrato ya cerrado, así que cerrados también cuentan.
    S.contratos = new Map();
    for (var j = 0; j < (S.cfg.tabsCtr || []).length; j++) {
      var tc = S.cfg.tabsCtr[j], hc;
      try {
        hc = await leerHoja(S.cfg.sheetId, tc);
      } catch (e2) {
        avisos.push('No se pudo leer "' + tc + '": ' + e2.message);
        continue;
      }
      var dc = detectar(hc.encabezados, CAMPOS_CTR);
      if (dc.mapa.contrato === undefined) {
        avisos.push('En "' + tc + '" no encontré una columna de contrato.');
        continue;
      }
      hc.filas.forEach(function (f) {
        var n = f.celdas[dc.mapa.contrato];
        if (!n) return;
        var k = String(n).trim();
        // Gana la primera pestaña de la lista si el contrato está repetido.
        if (S.contratos.has(k)) return;
        var g = function (campo) {
          return dc.mapa[campo] !== undefined ? f.celdas[dc.mapa[campo]] : null;
        };
        S.contratos.set(k, {
          contrato: k, origen: tc,
          exportador: g('exportador'),
          importador: g('importador'),
          producto: g('producto'),
          tns: normNum(g('tns')),
          comision: normNum(g('comision')),
          // La planilla ya trae su propio entregado y saldo: los guardamos
          // para poder contrastarlos con los que calcula la app.
          entregadoHoja: normNum(g('entregado')),
          saldoHoja: normNum(g('saldo')),
          periodo: g('periodo'),
          formaPago: g('formaPago'),
          cond: interpretarPago(g('formaPago'))
        });
      });
    }

    // "A facturar": un embarque llega ahí cuando el cliente ya le pagó al
    // exportador. Estar en esa pestaña ES la prueba de cobro que falta en la
    // columna Inv Commission.
    S.facturar = new Map();
    for (var k = 0; k < (S.cfg.tabsFact || []).length; k++) {
      var tf = S.cfg.tabsFact[k], hf;
      try {
        hf = await leerHoja(S.cfg.sheetId, tf);
      } catch (e3) {
        avisos.push('No se pudo leer "' + tf + '": ' + e3.message);
        continue;
      }
      var df = detectar(hf.encabezados, CAMPOS);
      if (df.mapa.contract === undefined) {
        avisos.push('En "' + tf + '" no encontré la columna de contrato.');
        continue;
      }
      hf.filas.forEach(function (f) {
        var nc = f.celdas[df.mapa.contract];
        if (!nc) return;
        var kk = String(nc).trim();
        var reg = S.facturar.get(kk) || { contrato: kk, filas: 0, tns: 0, bls: [], items: [] };
        reg.filas++;
        var tn = df.mapa.tns !== undefined ? normNum(f.celdas[df.mapa.tns]) : null;
        if (tn) reg.tns += tn;
        var bl = df.mapa.bl !== undefined ? f.celdas[df.mapa.bl] : null;
        var blk = bl ? String(bl).trim() : '';
        if (blk) reg.bls.push(blk);
        reg.items.push({ bl: blk, tns: tn, usado: false });
        S.facturar.set(kk, reg);
      });
    }

    // Marcar los embarques que ya pasaron a facturar. Se cruza embarque por
    // embarque, no por contrato: un contrato se parte en varios parciales y
    // puede haber pasado uno solo. Cruzar por contrato daría por cobrados
    // parciales que siguen abiertos.
    //
    // Primero por BL, que es único. Después, para las terrestres que no tienen
    // BL, por toneladas, consumiendo cada coincidencia una sola vez.
    var pend = [];
    todas.forEach(function (o) {
      o._aFacturar = false;
      var reg = S.facturar.get(String(o.contract || '').trim());
      if (!reg) return;
      var blo = o.bl ? String(o.bl).trim() : '';
      if (blo) {
        var it = reg.items.filter(function (i) { return !i.usado && i.bl === blo; })[0];
        if (it) { it.usado = true; o._aFacturar = true; }
        return;   // Tiene BL y no matcheó: no se cobró, no se adivina.
      }
      pend.push({ o: o, reg: reg });
    });

    pend.forEach(function (x) {
      var o = x.o, reg = x.reg;
      var tn = o.tns;
      var it = null;
      if (tn) {
        it = reg.items.filter(function (i) {
          return !i.usado && i.tns && Math.abs(i.tns - tn) < 0.05;
        })[0];
      }
      if (!it) {
        // Sin BL ni toneladas comparables: solo si queda alguna fila libre.
        it = reg.items.filter(function (i) { return !i.usado && !i.bl && !i.tns; })[0];
      }
      if (it) { it.usado = true; o._aFacturar = true; }
    });

    // ALL CONTRATOS suele ser un IMPORTRANGE: sirve para leer pero no se puede
    // escribir. Para editar hay que ir a la pestaña real donde vive la fila.
    S.ctrEditables = new Map();
    S.formasPago = [];
    var frecuencia = {};
    for (var m = 0; m < (S.cfg.tabsCtrEdit || []).length; m++) {
      var te = S.cfg.tabsCtrEdit[m], he;
      try {
        he = await leerHoja(S.cfg.sheetId, te);
      } catch (e4) {
        avisos.push('No se pudo leer "' + te + '": ' + e4.message);
        continue;
      }
      var de = detectar(he.encabezados, CAMPOS_CTR);
      if (de.mapa.contrato === undefined) {
        avisos.push('En "' + te + '" no encontré la columna de contrato.');
        continue;
      }
      he.filas.forEach(function (f) {
        var nc = f.celdas[de.mapa.contrato];
        if (!nc) return;
        var kc = String(nc).trim();
        if (!S.ctrEditables.has(kc)) {
          S.ctrEditables.set(kc, {
            tab: te, sheetId: he.sheetId, fila: f.fila, mapa: de.mapa,
            celdas: f.celdas
          });
        }
        if (de.mapa.formaPago !== undefined) {
          var fp = f.celdas[de.mapa.formaPago];
          if (fp && String(fp).trim()) {
            var kk = clave(fp);
            frecuencia[kk] = frecuencia[kk] || { n: 0, variantes: {} };
            frecuencia[kk].n++;
            var tx = String(fp).trim();
            frecuencia[kk].variantes[tx] = (frecuencia[kk].variantes[tx] || 0) + 1;
          }
        }
      });
    }

    // "CAD Bank", "CAD BANK" y "Cad Bank" son la misma: se ofrece la más usada
    // para que la lista deje de multiplicarse.
    S.formasPago = Object.keys(frecuencia).map(function (k) {
      var v = frecuencia[k];
      var mejor = Object.keys(v.variantes).sort(function (a, b) {
        return v.variantes[b] - v.variantes[a] || a.localeCompare(b, 'es');
      })[0];
      return { texto: mejor, usos: v.n };
    }).sort(function (a, b) { return b.usos - a.usos; });

    await cargarListas();
    await cargarComentarios();
    await cargarAdvices();

    S.avisos = avisos;
  } catch (e) {
    S.error = e.message;
  } finally {
    S.cargando = false; pintar();
  }
}

function fuenteDe(emb) {
  for (var i = 0; i < S.fuentes.length; i++) {
    if (S.fuentes[i].tab === emb._tab) return S.fuentes[i];
  }
  return S.fuentes[0];
}

function filaPorId(id) {
  return S.datos.filas.filter(function (x) { return x._id === id; })[0];
}

async function aplicarCambio(id, campo, valor) {
  var f = filaPorId(id);
  if (!f) return;
  var src = fuenteDe(f);
  var idx = campo === '_faltaComprobante' ? src.mapa[COL_COMPROBANTE] : src.mapa[campo];
  if (idx === undefined) {
    S.error = 'Esa columna no existe en "' + f._tab + '".';
    return pintar();
  }

  var antes = f[campo];
  f[campo] = (campo === '_faltaComprobante' || CAMPOS[campo].tipo === 'semaforo')
    ? valor : convertir(valor, CAMPOS[campo].tipo);
  S.guardando++; pintar();

  var valores = {}, colores = {};
  if (campo === '_faltaComprobante') colores[idx] = valor ? 'falta_cbte' : 'vacio';
  else if (SEMAFOROS.indexOf(campo) >= 0) colores[idx] = valor;
  else valores[idx] = valor;

  try {
    await escribirCeldas(S.cfg.sheetId, f._sheetId, f._fila, valores, colores);
  } catch (e) {
    f[campo] = antes;
    S.error = 'No se pudo guardar: ' + e.message;
  } finally {
    S.guardando--; pintar();
  }
}

// Escribe el texto de una columna semáforo sin tocar su color.
async function aplicarNota(id, campo, texto) {
  var f = filaPorId(id);
  if (!f) return;
  var src = fuenteDe(f);
  var idx = src.mapa[campo];
  if (idx === undefined) return;

  var antes = (f._notas && f._notas[campo]) || '';
  f._notas = f._notas || {};
  f._notas[campo] = texto;
  S.guardando++; pintar();

  var valores = {};
  valores[idx] = texto;
  try {
    await escribirCeldas(S.cfg.sheetId, f._sheetId, f._fila, valores, {});
  } catch (e) {
    f._notas[campo] = antes;
    S.error = 'No se pudo guardar la anotación: ' + e.message;
  } finally {
    S.guardando--; pintar();
  }
}

function ciclarSemaforo(id, campo) {
  var f = filaPorId(id);
  var actual = (f && f[campo]) || 'vacio';
  aplicarCambio(id, campo, CICLO[(CICLO.indexOf(actual) + 1) % CICLO.length]);
}

// Iconos en línea. Un botón con ícono se reconoce antes de leerlo, y de paso
// deja de parecer un rectángulo con texto.
var ICONOS = {
  mail:   'M2 4h12v8H2zM2 4l6 4 6-4',
  plus:   'M8 3v10M3 8h10',
  refresh:'M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3',
  down:   'M8 2v8M5 7l3 3 3-3M3 13h10',
  cols:   'M2 2h12v12H2zM6 2v12M10 2v12',
  x:      'M4 4l8 8M12 4l-8 8',
  check:  'M3 8.5l3.5 3.5L13 5',
  send:   'M14 2L7 9M14 2l-4.5 12L7 9 2 6.5z',
  gear:   'M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2',
  tabs:   'M2 4h5v10H2zM9 4h5v10H9zM2 2h12',
  caja:   'M2 5l6-3 6 3v6l-6 3-6-3zM2 5l6 3 6-3M8 8v6',
  campana:'M8 2a4 4 0 0 0-4 4c0 3-1.5 4-1.5 4h11S12 9 12 6a4 4 0 0 0-4-4M6.5 13a1.8 1.8 0 0 0 3 0',
  doc:    'M4 1.5h5L12.5 5v9.5h-9zM9 1.5V5h3.5M6 8h4M6 11h4'
};

function ico(nombre) {
  var d = ICONOS[nombre];
  if (!d) return '';
  return '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="' + d + '"/></svg>';
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtFecha(f) {
  return esFecha(f) ? f.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
}

function pintarCelda(v) {
  if (v === null || v === undefined || v === '') return '<span class="vacia">—</span>';
  if (typeof v === 'object' && v.invalida) return '<span class="mala">' + esc(v.crudo) + '</span>';
  if (v instanceof Date) {
    if (v.anioAsumido) {
      return '<span class="asumida" title="Sin año en la planilla, se asume ' +
        v.getUTCFullYear() + '">' + fmtFecha(v) + '</span>';
    }
    var mala = v.getUTCFullYear() > new Date().getFullYear() + 1;
    return mala ? '<span class="mala">' + fmtFecha(v) + '</span>' : fmtFecha(v);
  }
  if (typeof v === 'number') return v.toLocaleString('es-AR');
  return esc(v);
}

/* --- Tablero --------------------------------------------------------------- */

function evaluarTodo() {
  var hoy = new Date();
  S.ultimaEval = {};
  return S.datos.filas.map(function (emb) {
    var ctr = S.contratos.get(String(emb.contract || '').trim()) || null;
    var src = fuenteDe(emb);
    var ev = evaluar(emb, ctr, hoy, src.mapa, src.noAplica);
    S.ultimaEval[emb._id] = ev;
    return { emb: emb, contrato: ctr, src: src, ev: ev };
  });
}

function vistaApp() {
  if (!S.datos) {
    return barraMobile() + '<div class="marco-app v-' + colorDeVista(S.vista) + '">' + navLateral([]) +
      '<main class="app">' +
      (S.error ? '<div class="error" style="margin-top:14px">' + esc(S.error) + '</div>' : '') +
      '<p class="centro">' + (S.cargando ? 'Leyendo la planilla…' : 'Sin datos.') + '</p>' +
      '</main></div>' + tabBarInferior();
  }

  var todosEvs = evaluarTodo();
  var evs = todosEvs.filter(function (x) {
    if (S.filtroTab && x.emb._tab !== S.filtroTab) return false;
    if (S.filtroTipo && clave(x.emb.tipo) !== S.filtroTipo) return false;
    return true;
  });
  var cuenta = { critico: 0, alto: 0, medio: 0, ok: 0 };
  evs.forEach(function (x) { x.ev.nivelMax ? cuenta[x.ev.nivelMax]++ : cuenta.ok++; });

  var segmentado = segmentoPestanas(todosEvs) + segmentoTipos(todosEvs);
  var cuerpo = S.vista === 'control' ? vistaControl(evs, cuenta)
             : S.vista === 'contratos' ? vistaContratos()
             : vistaGrilla(evs);
  var panel = '';
  if (S.editCtr) panel = panelContrato();
  else if (S.sel !== null) {
    var item = todosEvs.filter(function (x) { return x.emb._id === S.sel; })[0];
    if (item) panel = vistaPanel(item);
  }

  return barraMobile() +
    '<div class="marco-app v-' + colorDeVista(S.vista) + '">' + navLateral(todosEvs) +
    '<main class="app">' +
      (S.error ? '<div class="error">' + esc(S.error) + '</div>' : '') +
      (S.avisoOk ? '<div class="ok-aviso">' + esc(S.avisoOk) +
        ' <button data-act="cerraviso">Cerrar</button></div>' : '') +
      tituloVista() +
      segmentado + cuerpo + diagnostico() +
    '</main></div>' + tabBarInferior() + panel + barraAdvice(todosEvs);
}

// Marítimo y terrestre separados, pero con la opción de ver todo junto. Es lo
// primero que se toca, así que va arriba y siempre visible, no escondido en
// el panel de filtros.
// Barra flotante: aparece cuando hay embarques marcados. Es la forma natural
// de armar un advice con varias filas sin tener que entrar a cada tarjeta.
function barraAdvice(evs) {
  if (!S.cfg.adviceUrl) return '';
  var ids = Object.keys(S.marcados || {}).filter(function (k) { return S.marcados[k]; });
  if (!ids.length) return '';

  var sel = ids.map(filaPorId).filter(Boolean)
    .sort(function (a, b) { return a._fila - b._fila; });
  if (!sel.length) return '';

  // Las mismas condiciones que valida el script del lado de la planilla.
  var base = sel[0];
  var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
  var difs = [];
  [['exporter', 'Exportador'], ['importer', 'Importador'], ['vessel', 'Buque'],
   ['port', 'Puerto'], ['bl', 'BL']].forEach(function (c) {
    if (sel.some(function (o) { return clave(o[c[0]]) !== clave(base[c[0]]); })) difs.push(c[1]);
  });
  [['etd', 'ETD'], ['eta', 'ETA']].forEach(function (c) {
    if (sel.some(function (o) { return f(o[c[0]]) !== f(base[c[0]]); })) difs.push(c[1]);
  });
  var tabs = {};
  sel.forEach(function (o) { tabs[o._tab] = 1; });
  if (Object.keys(tabs).length > 1) difs.unshift('la pestaña');

  var destino = (S.adviceTo !== null && S.adviceTo !== undefined)
    ? S.adviceTo : (base.mailsCC || '');
  var msg = (S.adviceMsg && S.adviceMsg.barra) ? S.adviceMsg : null;
  var goods = sel.map(function (o) {
    return (o.tns || '') + ' Tns ' + (o.product || '');
  }).join(' / ');

  var h = '<div class="barra-flota"><div class="bf-in">';

  if (msg && msg.ok) {
    h += '<div class="ok-aviso" style="margin:0 0 10px;white-space:pre-line">' + esc(msg.texto) +
      (msg.url ? '\n<a href="' + esc(msg.url) + '" target="_blank" rel="noopener">Abrir Gmail</a>' : '') +
      '</div>';
  }
  if (msg && msg.error) {
    h += '<div class="error" style="margin:0 0 10px;white-space:pre-line">' + esc(msg.error) +
      (msg.fallback ? '<br><a href="' + esc(msg.fallback) + '" target="_blank" rel="noopener">' +
        'Probar en una pestaña</a>' : '') + '</div>';
  }

  h += '<div class="bf-fila1">' +
    '<span class="bf-n">' + sel.length + (sel.length === 1 ? ' embarque' : ' embarques') + '</span>' +
    '<span class="bf-goods">' + esc(goods) + '</span>' +
    '<button data-act="desmarcar">Quitar selección</button>' +
    '</div>';

  if (difs.length) {
    h += '<p class="bf-error">No se pueden combinar: no coincide ' + difs.join(', ') +
      '. El advice necesita que sean del mismo embarque.</p>';
  }

  h += '<div class="bf-fila2">' +
    '<input id="adv-to" data-advto="1" value="' + esc(destino) + '" ' +
      'placeholder="destinatarios, separados por coma">' +
    '<span class="modos">' +
      [['en', 'EN'], ['es', 'ES']].map(function (o) {
        return '<button data-act="advidioma" data-v="' + o[0] + '" aria-pressed="' +
          ((S.adviceIdioma || 'en') === o[0]) + '">' + o[1] + '</button>';
      }).join('') +
    '</span>' +
    '<label class="chk"><input type="checkbox" data-advpeter="1"' +
      (S.advicePeter ? ' checked' : '') + '><span>Peter</span></label>' +
    '<button class="primario" data-act="adviceMulti"' +
      (difs.length || S.adviceEnviando ? ' disabled' : '') + '>' +
      (S.adviceEnviando ? 'Creando…' : ico('mail') + 'Crear borrador del shipment advice') +
      '</button>' +
    '</div></div></div>';

  return h;
}

function segmentoPestanas(evs) {
  // Con una sola pestaña de embarques no hay nada que separar, pero conviene
  // decirlo: suele ser que falta agregar las terrestres.
  if (S.fuentes.length < 2) {
    var otras = (S.pestanas && S.pestanas.pestanas || []).filter(function (p) {
      var k = clave(p.nombre);
      return (k.indexOf('carga') >= 0 || k.indexOf('embarque') >= 0) &&
             S.cfg.tabsEmb.indexOf(p.nombre) < 0;
    });
    return '<div class="aviso-tab">' +
      'Estás viendo solo <b>' + esc(S.fuentes[0] ? S.fuentes[0].tab : '—') + '</b>. ' +
      'Si querés ver también las otras cargas, agregalas.' +
      ' <button data-act="pestanas">Elegir pestañas</button></div>';
  }

  var cuenta = {};
  evs.forEach(function (x) { cuenta[x.emb._tab] = (cuenta[x.emb._tab] || 0) + 1; });

  var op = function (val, label, n) {
    return '<button data-act="ftab" data-t="' + esc(val) + '" aria-pressed="' +
      (S.filtroTab === val) + '">' + esc(label) +
      '<span class="cnt">' + n + '</span></button>';
  };

  return '<div class="segmento solo-movil">' +
    op('', 'Todo', evs.length) +
    S.fuentes.map(function (f) {
      return op(f.tab, nombreCorto(f.tab), cuenta[f.tab] || 0);
    }).join('') +
    '</div>';
}

// Dentro de una pestaña, separar por tipo de producto: la columna Tipo dice
// Maní, Expeller, Aceite. Solo aparece cuando hay más de uno para elegir.
function tiposDisponibles(evs) {
  var cuenta = {};
  evs.forEach(function (x) {
    if (S.filtroTab && x.emb._tab !== S.filtroTab) return;
    var t = String(x.emb.tipo || '').trim();
    if (!t) return;
    var k = clave(t);
    cuenta[k] = cuenta[k] || { n: 0, variantes: {} };
    cuenta[k].n++;
    cuenta[k].variantes[t] = (cuenta[k].variantes[t] || 0) + 1;
  });
  return Object.keys(cuenta).map(function (k) {
    var v = cuenta[k];
    // "Maní" y "MANI" son el mismo tipo: se muestra la escritura más usada.
    var etiq = Object.keys(v.variantes).sort(function (a, b) {
      return v.variantes[b] - v.variantes[a];
    })[0];
    return { clave: k, label: etiq, n: v.n };
  }).sort(function (a, b) { return b.n - a.n; });
}

// Título grande, como el "Large Title" de iOS: ancla la pantalla y hace que
// el contenido respire antes de empezar.
function tituloVista() {
  var t = { control: 'Control', carga: 'Cargas', contratos: 'Contratos' }[S.vista] || '';
  var sub = '';
  if (S.vista === 'carga' && S.datos) {
    sub = S.datos.filas.length + ' embarques';
    if (S.filtroTab) sub += ' · ' + nombreCorto(S.filtroTab);
  } else if (S.vista === 'contratos') {
    sub = S.contratos.size + ' contratos';
  } else if (S.vista === 'control' && S.datos) {
    sub = 'Lo que necesita atención';
  }
  var v = VISTAS.filter(function (x) { return x.id === S.vista; })[0];
  return '<div class="titulo-vista"><h1>' +
    (v ? '<span class="t-emoji">' + v.emoji + '</span>' : '') + esc(t) + '</h1>' +
    (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>';
}

function segmentoTipos(evs) {
  var tipos = tiposDisponibles(evs);
  if (tipos.length < 2) return '';

  var total = tipos.reduce(function (a, t) { return a + t.n; }, 0);
  return '<div class="segmento sub">' +
    '<button data-act="ftipo" data-t="" aria-pressed="' + (!S.filtroTipo) + '">' +
      'Todos<span class="cnt">' + total + '</span></button>' +
    tipos.map(function (t) {
      return '<button data-act="ftipo" data-t="' + esc(t.clave) + '" aria-pressed="' +
        (S.filtroTipo === t.clave) + '">' + esc(t.label) +
        '<span class="cnt">' + t.n + '</span></button>';
    }).join('') + '</div>';
}

// "Embarques maritimos" -> "Marítimo". Nombres largos rompen el segmentado.
function nombreCorto(tab) {
  var k = clave(tab);
  if (k.indexOf('mariti') >= 0) return 'Marítimo';
  if (k.indexOf('terrestre') >= 0) return 'Terrestre';
  return tab.length > 18 ? tab.slice(0, 17) + '…' : tab;
}

var LOGO_SVG =
  '<svg viewBox="0 0 64 64" class="logo" aria-hidden="true"><g fill="currentColor">' +

  '<rect x="32" y="19" width="10" height="9" rx="1.5"/>' +
  '<rect x="26" y="9" width="10" height="9" rx="1.5"/>' +
  '<rect x="44" y="14" width="6" height="14" rx="1.5"/>' +
  '<path d="M11 32h42l-6 13a5 5 0 0 1-4.5 3H21.5a5 5 0 0 1-4.5-3z"/></g></svg>';

var VISTAS = [
  { id: 'carga',     label: 'Cargas',    emoji: '🚢', color: 'azul' },
  { id: 'control',   label: 'Control',   emoji: '🔔', color: 'naranja' },
  { id: 'contratos', label: 'Contratos', emoji: '📄', color: 'violeta' }
];

function colorDeVista(id) {
  var v = VISTAS.filter(function (x) { return x.id === id; })[0];
  return v ? v.color : 'verde';
}

// Cuántas cosas piden atención: se muestra sobre Control, como en iOS.
function pendientes() {
  if (!S.datos) return 0;
  var n = 0;
  (S.ultimaEval ? Object.keys(S.ultimaEval) : []).forEach(function (k) {
    var ev = S.ultimaEval[k];
    if (ev && (ev.nivelMax === 'critico' || ev.nivelMax === 'alto')) n++;
  });
  return n;
}

// Barra lateral: en escritorio la navegación va al costado, que deja el ancho
// para el contenido y no obliga a subir para cambiar de vista.
function navLateral(evs) {
  var pend = pendientes();

  var items = VISTAS.map(function (v) {

      ? '<span class="badge">' + pend + '</span>' : '';
    return '<button class="nav-item" data-act="tab" data-v="' + v.id + '" ' +
      'aria-current="' + (S.vista === v.id) + '">' +
      '<span class="tile t-' + v.color + '">' + v.emoji + '</span>' +
      '<span>' + v.label + '</span>' + badge + '</button>';
  }).join('');

  // El filtro de pestaña vive acá: es de dónde salen los datos, no un filtro
  // más de la lista.
  var fuentes = '';
  if (S.fuentes && S.fuentes.length > 1) {
    var cuenta = {};
    (evs || []).forEach(function (x) { cuenta[x.emb._tab] = (cuenta[x.emb._tab] || 0) + 1; });
    fuentes = '<div class="nav-sec">Origen</div>' +
      '<button class="nav-sub" data-act="ftab" data-t="" aria-current="' + (!S.filtroTab) + '">' +
