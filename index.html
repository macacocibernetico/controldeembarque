<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de embarques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* El vocabulario de color de la planilla (verde/rojo/celeste/naranja) ya existe
   en la cabeza del equipo: es el sistema semántico y se respeta. Pero los tonos
   puros de Sheets son ilegibles en pantalla, así que se usan versiones con
   contraste, y NUNCA el color solo: siempre acompañado de la palabra. */

:root{
  --papel:#faf9f7; --sup:#fff; --sup2:#f4f2ef;
  --linea:#e7e3dd; --linea2:#d4cec5; --linea3:#b9b1a5;
  --tinta:#1a1917; --tinta2:#5f5a52; --tinta3:#918a7e;

  --ok:#15703f;   --okbg:#e6f2ea;   --okbd:#a8d4bb;
  --pend:#a8271d; --pendbg:#fceceb; --pendbd:#e8b5b1;
  --sol:#0a6478;  --solbg:#e3f1f5;  --solbd:#a5cfda;
  --nar:#9a5b06;  --narbg:#fdf0dd;  --narbd:#e8c58e;

  --r:8px; --r2:5px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;
  color:var(--tinta);background:var(--papel);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}

button{font:inherit;cursor:pointer;border:1px solid var(--linea2);background:var(--sup);
  color:var(--tinta);padding:7px 13px;border-radius:var(--r2);transition:background .12s}
button:hover{background:var(--sup2)}
button:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.primario{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.primario:hover{background:#37332d}

input,select{font:inherit;padding:7px 10px;border:1px solid var(--linea2);border-radius:var(--r2);
  background:var(--sup);color:var(--tinta);width:100%}
input:focus,select:focus{outline:2px solid var(--sol);outline-offset:-1px;border-color:transparent}
a{color:var(--sol)}
h1,h2,h3{font-weight:600;letter-spacing:-.011em}

.app{max-width:1180px;margin:0 auto;padding:22px 24px 80px}

/* Cabecera --------------------------------------------------------------- */
.cab{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.cab h1{font-size:18px;margin:0}
.sello{font-size:12px;color:var(--tinta3);font-family:var(--mono)}
.cab-acc{margin-left:auto;display:flex;gap:6px}
.cab-acc button{font-size:13px;padding:5px 11px}

/* Tabs ------------------------------------------------------------------- */
.tabs{display:flex;gap:2px;margin:20px 0 20px;background:var(--sup2);padding:3px;
  border-radius:var(--r);width:fit-content}
.tabs button{border:none;background:none;border-radius:var(--r2);padding:6px 16px;
  color:var(--tinta2);font-size:13px}
.tabs button[aria-selected=true]{background:var(--sup);color:var(--tinta);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tabs button:hover{background:rgba(255,255,255,.6)}

/* Resumen: son botones, filtran ------------------------------------------ */
.tira{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-bottom:20px}
.tira button{display:block;text-align:left;padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--linea);background:var(--sup);width:100%}
.tira button[aria-pressed=true]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.tira .n{font-size:23px;font-weight:600;line-height:1.1}
.tira .l{font-size:12px;color:var(--tinta2);margin-top:2px}
.tira .crit .n{color:var(--pend)}
.tira .alt .n{color:var(--nar)}

/* Alertas ---------------------------------------------------------------- */
.gt{font-size:12px;color:var(--tinta3);margin:24px 0 9px;font-weight:500;
  text-transform:uppercase;letter-spacing:.06em}

.alerta{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);
  padding:13px 15px;margin-bottom:7px;display:flex;gap:12px;align-items:flex-start}
.alerta .marca{width:3px;align-self:stretch;border-radius:2px;flex:none;background:var(--linea3)}
.alerta.critico .marca{background:var(--pend)}
.alerta.alto .marca{background:var(--nar)}
.alerta .cuerpo{min-width:0;flex:1}
.alerta .f1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.alerta .quien{font-weight:600;font-size:14px}
.alerta .ctr{font-family:var(--mono);font-size:11px;color:var(--tinta3)}
.alerta .tit{margin:5px 0 2px;font-weight:500;font-size:14px}
.alerta.critico .tit{color:var(--pend)}
.alerta .det{color:var(--tinta2);font-size:13px;margin:0}
.alerta .acc{display:flex;gap:7px;margin-top:11px;align-items:center;flex-wrap:wrap}
.alerta .acc button{font-size:12px;padding:4px 11px}

/* Pills: color + palabra, nunca color solo ------------------------------- */
.pill{font-size:11.5px;padding:2.5px 9px;border-radius:20px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;font-weight:450}
.pill .pt{width:6px;height:6px;border-radius:50%;flex:none}
.pill.ok  {background:var(--okbg);  color:var(--ok);  border-color:var(--okbd)}
.pill.ok   .pt{background:var(--ok)}
.pill.pend{background:var(--pendbg);color:var(--pend);border-color:var(--pendbd)}
.pill.pend .pt{background:var(--pend)}
.pill.sol {background:var(--solbg); color:var(--sol); border-color:var(--solbd)}
.pill.sol  .pt{background:var(--sol)}
.pill.nar {background:var(--narbg); color:var(--nar); border-color:var(--narbd)}
.pill.nar  .pt{background:var(--nar)}
.pill.gris{background:var(--sup2);  color:var(--tinta2);border-color:var(--linea)}
.pill.gris .pt{background:var(--tinta3)}
.pill.hueco{background:none;color:var(--tinta3);border-color:var(--linea2);border-style:dashed}
.pill.hueco .pt{background:var(--linea3)}

/* Barra de filtros ------------------------------------------------------- */
.filtros{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filtros input{max-width:280px}
.filtros select{width:auto}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.chips button{font-size:12px;padding:4px 11px;border-radius:20px;color:var(--tinta2)}
.chips button[aria-pressed=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}

/* Fila de embarque: la vista principal ----------------------------------- */
.lista{display:flex;flex-direction:column;gap:7px}

.emb{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;display:grid;gap:10px;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center}
.emb:hover{border-color:var(--linea3)}
.emb.sel{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.emb.tiene-critico{border-left:3px solid var(--pend);padding-left:12px}

.emb .quien{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emb .sub{font-size:12px;color:var(--tinta2);margin-top:1px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.emb .ctr{font-family:var(--mono);font-size:11px;color:var(--tinta3)}

/* Ruta: origen -> destino con las fechas */
.ruta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tinta2);min-width:0}
.ruta .pto{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.ruta .via{flex:1;height:2px;background:var(--linea);border-radius:2px;position:relative;min-width:26px}
.ruta .via i{position:absolute;inset:0 auto 0 0;background:var(--linea3);border-radius:2px;display:block}
.ruta .via b{position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--sup);border:2px solid var(--tinta2);transform:translateX(-4px)}
.ruta .f{font-family:var(--mono);font-size:11px;color:var(--tinta3);white-space:nowrap}

.estados{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* Etapa */
.etapa{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tinta2)}
.pasos{display:flex;gap:2px}
.pasos i{width:14px;height:3px;border-radius:2px;background:var(--linea2);display:block}
.pasos i.on{background:var(--tinta2)}

/* Tabla compacta (opcional) ---------------------------------------------- */
.marco{border:1px solid var(--linea);border-radius:var(--r);overflow:auto;background:var(--sup);max-height:72vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;color:var(--tinta3);padding:9px 11px;
  border-bottom:1px solid var(--linea);white-space:nowrap;position:sticky;top:0;background:var(--sup);
  z-index:1;text-transform:uppercase;letter-spacing:.05em}
td{padding:8px 11px;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sup2)}
tbody tr.sel td{background:#eef4f6}
.num{text-align:right}
.cod{font-family:var(--mono);font-size:11.5px}
.vacia{color:var(--tinta3)}
.mala{background:var(--pendbg);color:var(--pend);padding:1px 6px;border-radius:3px;font-weight:500}

/* Panel ------------------------------------------------------------------ */
.velo{position:fixed;inset:0;background:rgba(26,25,23,.28);z-index:9}
.panel{position:fixed;inset:0 0 0 auto;width:min(500px,100%);background:var(--sup);
  box-shadow:-10px 0 40px rgba(0,0,0,.13);overflow-y:auto;padding:22px 24px 60px;z-index:10}
.panel h2{font-size:17px;margin:0 0 2px;padding-right:80px}
.panel .cerrar{position:absolute;top:16px;right:18px;font-size:13px;padding:5px 11px}
.bloque{border-top:1px solid var(--linea);margin-top:20px;padding-top:16px}
.bloque:first-of-type{border-top:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px}
.kv dt{color:var(--tinta2);flex:none}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}

.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;color:var(--tinta2);margin-bottom:4px}
.campo.falta input{border-color:var(--pendbd);background:var(--pendbg)}
.sems{display:flex;gap:8px;flex-wrap:wrap}
.sembtn{flex:1;min-width:96px;text-align:left;padding:9px 11px;border-radius:var(--r2)}
.sembtn .et{font-size:11px;color:var(--tinta3);display:block;margin-bottom:3px}
.sembtn .vl{font-size:13px;font-weight:500}
.sembtn[data-e=ok]       {background:var(--okbg);  border-color:var(--okbd)}
.sembtn[data-e=ok] .vl   {color:var(--ok)}
.sembtn[data-e=pendiente]{background:var(--pendbg);border-color:var(--pendbd)}
.sembtn[data-e=pendiente] .vl{color:var(--pend)}
.sembtn[data-e=atencion] {background:var(--solbg); border-color:var(--solbd)}
.sembtn[data-e=atencion] .vl{color:var(--sol)}
.sembtn[data-e=vacio] .vl{color:var(--tinta3)}

/* Setup ------------------------------------------------------------------ */
.setup{max-width:540px;margin:7vh auto;padding:0 20px}
.setup h1{font-size:21px;margin:0 0 6px}
.setup .sub{color:var(--tinta2);margin:0 0 24px}
.caja{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);
  padding:20px;margin-bottom:14px}
.caja h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta2)}
.ayuda{font-size:12px;color:var(--tinta2);margin:5px 0 0}
.paso{display:flex;gap:9px;margin-bottom:8px;font-size:13px;color:var(--tinta2)}
.paso b{color:var(--tinta);font-weight:600;flex:none}
code{font-family:var(--mono);font-size:12px;background:var(--sup2);padding:2px 6px;
  border-radius:3px;word-break:break-all}
.error{background:var(--pendbg);border:1px solid var(--pendbd);color:#7d1d15;padding:11px 14px;
  border-radius:var(--r2);font-size:13px;margin-bottom:14px}
.aviso{background:var(--solbg);border:1px solid var(--solbd);color:#08505f;padding:11px 14px;
  border-radius:var(--r2);font-size:13px;margin:12px 0}
.diag{font-size:12px;color:var(--tinta2);margin:12px 0 0}
.diag summary{cursor:pointer}
.centro{text-align:center;padding:56px 20px;color:var(--tinta2)}
.chk{display:flex;gap:9px;align-items:center;padding:6px 0;cursor:pointer}
.chk input{width:auto;margin:0}

@media(max-width:820px){
  .emb{grid-template-columns:1fr;gap:9px}
  .estados{justify-content:flex-start}
}
@media(max-width:640px){
  .app{padding:16px 14px 60px}
  .cab-acc{margin-left:0;width:100%}
  .panel{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><p class="centro">Cargando…</p></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
'use strict';
/* ===========================================================================
   Control de embarques — todo en un archivo.

   Entra con tu cuenta de Google (OAuth) y habla directo con la API de Sheets
   desde el navegador. No hay backend, no hay service account, no hay que
   compartir la planilla con nadie: usás los permisos que ya tenés.

   El id de la planilla y el Client ID se cargan desde la app y quedan en el
   navegador. En el código no hay nada hardcodeado.
   =========================================================================== */

var SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
var LS = 'embarques:cfg';
var MAX_COLS = 60, MAX_FILAS = 3000;

/* --- Estado --------------------------------------------------------------- */
var S = {
  cfg: null,          // {clientId, sheetId, titulo, tabsEmb:[], tabsCtr:[]}
  token: null,
  tokenExp: 0,
  pestanas: null,
  datos: null,        // {filas, mapa, extras, encabezados}
  contratos: new Map(),
  vista: 'control',
  sel: null,
  busca: '',
  filtroTab: '',
  filtroEtapa: '',
  filtroNivel: '',
  compacto: false,
  fuentes: [],
  avisos: [],
  error: null,
  cargando: false,
  guardando: 0,
  pantalla: 'setup',
  setup: { entrada: '', tabsEmb: [], tabsCtr: [], buscando: false, entrando: false }
};

try { S.cfg = JSON.parse(localStorage.getItem(LS)) || null; } catch (e) {}

// Config vieja de una sola pestaña -> lista.
if (S.cfg && S.cfg.tabEmb && !S.cfg.tabsEmb) {
  S.cfg.tabsEmb = [S.cfg.tabEmb];
  S.cfg.tabsCtr = S.cfg.tabCtr ? [S.cfg.tabCtr] : [];
  delete S.cfg.tabEmb; delete S.cfg.tabCtr;
}

function guardarCfg() { try { localStorage.setItem(LS, JSON.stringify(S.cfg)); } catch (e) {} }

/* ===========================================================================
   Campos: se detectan por el TEXTO del encabezado, no por letra de columna.
   Si mueven o insertan una columna, la app la sigue encontrando.
   =========================================================================== */

var CAMPOS = {
  exporter:     {label:'Exportador',   tipo:'texto',   alias:['exporter','exportador']},
  importer:     {label:'Importador',   tipo:'texto',   alias:['importer','importador','cliente']},
  contract:     {label:'Contrato',     tipo:'texto',   alias:['contract','contrato']},
  product:      {label:'Producto',     tipo:'texto',   alias:['product','producto']},
  price:        {label:'Precio',       tipo:'numero',  alias:['price','precio']},
  tns:          {label:'Tns',          tipo:'numero',  alias:['tns','tons','toneladas','tn']},
  total:        {label:'Total',        tipo:'numero',  alias:['total']},
  etd:          {label:'ETD',          tipo:'fecha',   alias:['etd']},
  eta:          {label:'ETA',          tipo:'fecha',   alias:['eta']},
  port:         {label:'Destino',      tipo:'texto',   alias:['port','puerto','destino']},
  vessel:       {label:'Buque',        tipo:'texto',   alias:['vessel','buque','barco']},
  shippingLine: {label:'Naviera',      tipo:'texto',   alias:['shipping line','naviera','linea','transporte']},
  lots:         {label:'Lotes',        tipo:'texto',   alias:['lots','lotes','lote']},
  containers:   {label:'Contenedores', tipo:'texto',   alias:['containers','contenedores','ctns']},
  bl:           {label:'BL',           tipo:'texto',   alias:['bl','b/l','bill of lading']},
  booking:      {label:'Booking',      tipo:'texto',   alias:['booking']},
  invoice:      {label:'Factura',      tipo:'texto',   alias:['invoice','factura']},
  docs:         {label:'Docs',         tipo:'semaforo',alias:['docs','docs.','documentos','observaciones']},
  pics:         {label:'Fotos',        tipo:'semaforo',alias:['pics','fotos','pictures']},
  tr:           {label:'T.R.',         tipo:'semaforo',alias:['t. r.','t.r.','tr','telex release']},
  tracking:     {label:'Tracking',     tipo:'texto',   alias:['tracking n°','tracking','tracking no']},
  pagoEstimado: {label:'Pago estimado',tipo:'fecha',   alias:['pago estimado','estimated payment']},
  commission:   {label:'Comisión',     tipo:'numero',  alias:['commission','comision']},
  invCommission:{label:'Fact. comisión',tipo:'texto',  alias:['inv commission','fc comision','factura comision']},
  status:       {label:'Estado',       tipo:'texto',   alias:['status','estado']},
  etdOriginal:  {label:'ETD original', tipo:'fecha',   alias:['etd original']},
  etdFinal:     {label:'ETD final',    tipo:'fecha',   alias:['etd final']},
  etdMaximo:    {label:'ETD máximo',   tipo:'fecha',   alias:['etd maximo permitido','etd maximo']},
  reclamo:      {label:'Reclamo',      tipo:'texto',   alias:['reclamo','claim']},
  incoterm:     {label:'Incoterm',     tipo:'texto',   alias:['incoterm']},
  paymentCond:  {label:'Cond. pago',   tipo:'texto',   alias:['payment condition','condicion de pago']},
  nota:         {label:'Nota',         tipo:'texto',   alias:['nota','notas','observaciones']}
};

var CAMPOS_CTR = {
  contrato:  {alias:['contract','contrato','nro contrato']},
  importador:{alias:['importer','importador','cliente','buyer']},
  tns:       {alias:['tns','toneladas','tons','cantidad']},
  formaPago: {alias:['forma de pago','payment','payment condition','condicion de pago']},
  saldo:     {alias:['saldo','saldo del contrato','balance']}
};

function clave(s) {
  return String(s == null ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
}

// Exacto primero, para que "etd" no se robe "etd final". Después, parcial.
function detectar(encabezados, catalogo) {
  var mapa = {}, usados = {};
  Object.keys(catalogo).forEach(function (campo) {
    for (var i = 0; i < encabezados.length; i++) {
      if (usados[i]) continue;
      if (catalogo[campo].alias.indexOf(clave(encabezados[i])) >= 0) {
        mapa[campo] = i; usados[i] = 1; return;
      }
    }
  });
  Object.keys(catalogo).forEach(function (campo) {
    if (mapa[campo] !== undefined) return;
    for (var i = 0; i < encabezados.length; i++) {
      if (usados[i]) continue;
      var k = clave(encabezados[i]);
      if (!k) continue;
      var hit = catalogo[campo].alias.some(function (a) { return k === a || k.indexOf(a + ' ') === 0; });
      if (hit) { mapa[campo] = i; usados[i] = 1; return; }
    }
  });
  var extras = [];
  encabezados.forEach(function (h, i) { if (h && !usados[i]) extras.push({ h: h, i: i }); });
  return { mapa: mapa, extras: extras };
}

function letraCol(i) {
  var s = ''; i += 1;
  while (i > 0) { s = String.fromCharCode(65 + (i - 1) % 26) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

function extraerId(entrada) {
  var s = String(entrada || '').trim();
  var m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9-_]{20,}$/.test(s)) return s;
  return null;
}

/* --- Semáforos: el color de la celda ES el dato --------------------------- */

var SEMAFOROS = ['docs', 'pics', 'tr'];
var CICLO = ['vacio', 'ok', 'pendiente', 'atencion'];
var COLORES = {
  ok:        { red: 0,   green: 1,   blue: 0 },
  pendiente: { red: 1,   green: 0,   blue: 0 },
  atencion:  { red: 0,   green: 1,   blue: 1 },
  falta_cbte:{ red: 1,   green: 0.6, blue: 0 },
  vacio:     { red: 1,   green: 1,   blue: 1 }
};

// El celeste no significa lo mismo en todas las columnas: en T.R. es
// "solicitada" (pedido y esperando), en el resto es un "prestá atención"
// genérico. Mismo color, distinto significado.
var ETIQUETAS = {
  tr:   { ok:'Liberado', pendiente:'No liberado', atencion:'Solicitado', vacio:'Sin marcar' },
  docs: { ok:'Enviados',  pendiente:'Pendientes',  atencion:'Atención',   vacio:'Sin marcar' },
  pics: { ok:'Listas',    pendiente:'Pendientes',  atencion:'Atención',   vacio:'Sin marcar' }
};

function etiqueta(campo, estado) {
  var e = estado || 'vacio';
  return (ETIQUETAS[campo] && ETIQUETAS[campo][e]) || e;
}

// El naranja de "Pago estimado" en terrestres significa que falta el
// comprobante de pago. Ojo: el mismo naranja aparece en Contenedores, BL y
// Booking en las mismas 28 filas, pero ahí es sombreado de columnas que en
// camión no aplican, no un estado. Por eso solo se interpreta en pagoEstimado.
var COL_COMPROBANTE = 'pagoEstimado';

function colorASem(bg) {
  if (!bg) return 'vacio';
  var r = bg.red || 0, g = bg.green || 0, b = bg.blue || 0;
  if (r > .85 && g > .85 && b > .85) return 'vacio';
  if (g > .5 && r < .5 && b < .5) return 'ok';
  if (r > .5 && g < .5 && b < .5) return 'pendiente';
  if (g > .5 && b > .5 && r < .5) return 'atencion';
  return 'vacio';
}

// Naranja (1, ~0.6, 0), distinto del rojo puro.
function esNaranja(bg) {
  if (!bg) return false;
  var r = bg.red || 0, g = bg.green || 0, b = bg.blue || 0;
  return r > .8 && g > .35 && g < .8 && b < .35;
}

/* --- Normalización: la hoja sigue abierta, va a entrar de todo ------------- */

var EPOCH = Date.UTC(1899, 11, 30);

function normFecha(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v === 'number') {
    if (v < 25569 || v > 80000) return { invalida: true, crudo: v };
    return new Date(EPOCH + v * 86400000);
  }
  var s = String(v).trim(); if (!s) return null;
  var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    var d = +m[1], mes = +m[2], a = +m[3]; if (a < 100) a += 2000;
    var f = new Date(Date.UTC(a, mes - 1, d));
    return isNaN(f) ? { invalida: true, crudo: s } : f;
  }
  var f2 = new Date(s);
  return isNaN(f2) ? { invalida: true, crudo: s } : f2;
}
function esFecha(f) { return f instanceof Date && !isNaN(f); }

function normNum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  var s = String(v).replace(/[^\d,.\-]/g, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (s.indexOf(',') >= 0) s = s.replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// "Comisión Cobrada" / "comisión cobrada" / "Comisión cobrada" -> un valor.
function estadoComision(v) {
  var k = clave(v);
  if (!k) return 'sin_facturar';
  if (k.indexOf('cobrad') >= 0) return 'cobrada';
  if (k.indexOf('facturad') >= 0 || k.indexOf('enviad') >= 0) return 'facturada';
  return 'otro';
}

function convertir(v, tipo) {
  if (tipo === 'fecha') return normFecha(v);
  if (tipo === 'numero') return normNum(v);
  return v == null ? '' : String(v).trim();
}

function interpretarPago(texto) {
  var s = String(texto || '').trim();
  if (!s) return { desconocida: true, texto: s };
  for (var i = 0; i < MAPEO_PAGO.length; i++) {
    if (MAPEO_PAGO[i].p.test(s)) {
      var r = MAPEO_PAGO[i];
      return { momento:r.momento, disp:r.disp, dias:r.dias, lib:r.lib, medio:r.medio,
               split:r.split, revisar:r.revisar, texto:s };
    }
  }
  return { desconocida: true, texto: s, revisar: true };
}

// null cuando el disparador no es estimable: mejor "esperando despacho" que
// inventar una fecha.
function fechaCobro(cond, emb) {
  if (!cond || cond.desconocida) return null;
  var d = DISPARADORES[cond.disp];
  if (!d || !d.estimable) return null;
  var base = cond.disp === 'eta' ? emb.eta : emb.etd;
  if (!esFecha(base)) return null;
  var f = new Date(base.getTime());
  f.setUTCDate(f.getUTCDate() + (cond.dias || 0));
  return f;
}

   no con avisos sueltos que hay que acordarse de mirar.

var ETAPAS = [
  { id:'creado',       label:'Creado',       req:['exporter','importer','contract','product','tns','price','etd','port'] },
  { id:'pre_embarque', label:'Pre-embarque', req:['booking','containers','shippingLine','vessel'] },
  { id:'embarcado',    label:'Embarcado',    req:['bl','invoice','eta'] },

  { id:'cobrado',      label:'Cobrado',      req:['invCommission'] }
];

var DIA = 86400000;
function dias(a, b) { return Math.round((a - b) / DIA); }

function lleno(emb, c) {
  var v = emb[c];
  if (v === null || v === undefined || v === '') return false;
  if (typeof v === 'object' && v.invalida) return false;
  if (SEMAFOROS.indexOf(c) >= 0) return v !== 'vacio';
  return true;
}

function etapaDe(emb, hoy) {
  if (estadoComision(emb.invCommission) === 'cobrada') return 'cobrado';
  if (esFecha(emb.eta) && emb.eta < hoy) return 'arribado';
  if (lleno(emb, 'bl')) return (esFecha(emb.eta) && emb.eta > hoy) ? 'en_transito' : 'embarcado';
  if (esFecha(emb.etd) && emb.etd < hoy) return 'embarcado';
  return (esFecha(emb.etd) && dias(emb.etd, hoy) <= 21) ? 'pre_embarque' : 'creado';
}

function faltantes(emb, hoy, mapa, noAplica) {
  var hasta = ETAPAS.map(function (e) { return e.id; }).indexOf(etapaDe(emb, hoy));
  var out = [];
  ETAPAS.slice(0, hasta + 1).forEach(function (et) {
    et.req.forEach(function (c) {
      // No se exige lo que no existe en la pestaña, ni lo que está vacío en
      // todas sus filas (en camión no hay BL ni contenedores).
      if (mapa[c] === undefined) return;
      if (noAplica && noAplica[c]) return;
      if (!lleno(emb, c)) out.push(c);
    });
  });
  return out;
}

    if (!m.length || lleno(e, 'nota')) return null;

function evaluar(emb, contrato, hoy, mapa, noAplica) {
  var cond = contrato ? contrato.cond : null;
  var ctx = { hoy: hoy, cond: cond, mapa: mapa, noAplica: noAplica || {}, cobro: fechaCobro(cond, emb) };
  var alertas = [];
  REGLAS.forEach(function (r) {
    try { var a = r(emb, ctx); if (a) alertas.push(a); } catch (err) {}
  });
  var falta = faltantes(emb, hoy, mapa, noAplica);
  if (falta.length) {
    alertas.push({ id:'checklist', nivel: falta.length > 4 ? 'alto' : 'medio',
      titulo: falta.length + (falta.length > 1 ? ' campos sin cargar' : ' campo sin cargar'),
      detalle: falta.map(function (f) { return CAMPOS[f].label; }).join(', '),
      accion:'Completar', campos: falta });
  }
  alertas.sort(function (a, b) { return NIVEL[b.nivel] - NIVEL[a.nivel]; });
  return { etapa: etapaDe(emb, hoy), cobro: ctx.cobro, alertas: alertas,
           nivelMax: alertas.length ? alertas[0].nivel : null };
}

/* ===========================================================================
   Google OAuth + API de Sheets, directo desde el navegador.
   =========================================================================== */

var tokenClient = null;

function pedirToken(interactivo) {
  return new Promise(function (resolve, reject) {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      return reject(new Error('No cargó la librería de Google. Revisá la conexión y recargá.'));
    }

    var listo = false;
    function fallar(msg) { if (!listo) { listo = true; reject(new Error(msg)); } }

    if (!tokenClient) {
      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: S.cfg.clientId,
          scope: SCOPE,
          callback: function () {},
          // Sin esto, un popup bloqueado o cerrado deja la promesa colgada
          // para siempre y la app se queda "pensando" sin decir nada.
          error_callback: function (err) {
            var t = err && err.type;
            if (t === 'popup_failed_to_open') {
              return fallar('El navegador bloqueó la ventana de Google. Permití las ventanas emergentes para este sitio y probá de nuevo.');
            }
            if (t === 'popup_closed') {
              return fallar('Cerraste la ventana de Google antes de terminar.');
            }
            fallar('No se pudo abrir el login de Google' + (t ? ' (' + t + ')' : '') + '.');
          }
        });
      } catch (e) {
        return fallar('El Client ID no es válido: ' + e.message);
      }
    }

    tokenClient.callback = function (resp) {
      if (listo) return;
      if (resp.error) {
        return fallar(resp.error === 'access_denied'
          ? 'No diste permiso a la app.'
          : 'Error de autenticación: ' + resp.error);
      }
      listo = true;
      S.token = resp.access_token;
      S.tokenExp = Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3500000) - 60000;
      resolve(S.token);
    };

    // Red de seguridad: si en 2 minutos no pasó nada, cortamos con un mensaje
    // en vez de quedarnos tildados.
    setTimeout(function () {
      fallar('El login de Google no respondió. Puede estar bloqueado el popup, o el origen ' +
             location.origin + ' no está autorizado en el Client ID.');
    }, 120000);

    try {
      tokenClient.requestAccessToken({ prompt: interactivo ? 'consent' : '' });
    } catch (e) {
      fallar('No se pudo abrir el login: ' + e.message);
    }
  });
}

// El popup solo se abre confiable si sale de un clic directo, sin ningún await
// en el medio. Por eso el login es un paso propio y no algo que pasa de rebote
// cuando la app necesita leer la planilla.
async function entrar() {
  S.error = null; S.setup.entrando = true; pintar();
  try {
    await pedirToken(false);
    S.setup.entrando = false;
    // Si ya estaba todo elegido de una sesión anterior, no volvemos a preguntar.
    if (S.cfg.sheetId && (S.cfg.tabsEmb || []).length) {
      S.pantalla = 'app';
      pintar();
      return cargarTodo();
    }
    pintar();
  } catch (e) {
    S.setup.entrando = false;
    S.error = e.message;
    pintar();
  }
}

async function conToken() {
  if (S.token && Date.now() < S.tokenExp) return S.token;
  return pedirToken(false);
}

async function api(url, opciones) {
  var token = await conToken();
  var o = opciones || {};
  o.headers = Object.assign({ Authorization: 'Bearer ' + token }, o.headers || {});
  var r = await fetch(url, o);

  if (r.status === 401) {           // token vencido: pedir de nuevo y reintentar
    S.token = null;
    token = await pedirToken(false);
    o.headers.Authorization = 'Bearer ' + token;
    r = await fetch(url, o);
  }

  var cuerpo = null;
  try { cuerpo = await r.json(); } catch (e) {}
  if (!r.ok) {
    var msg = (cuerpo && cuerpo.error && cuerpo.error.message) || ('Error ' + r.status);
    if (r.status === 403) {
      msg = /has not been used|is disabled/i.test(msg)
        ? 'Falta habilitar la Google Sheets API en tu proyecto de Google Cloud. Abrí Biblioteca, buscá "Google Sheets API" y dale Habilitar. Puede tardar un minuto en tomar efecto.'
        : 'Tu cuenta no tiene permiso sobre esta planilla. ' + msg;
    }
    if (r.status === 404) msg = 'No existe una planilla con ese id, o tu cuenta no tiene acceso.';
    throw new Error(msg);
  }
  return cuerpo;
}

var BASE = 'https://sheets.googleapis.com/v4/spreadsheets/';

// La API devuelve {properties:{title}, sheets:[{properties:{...}}]}.
// Lo traducimos acá para que el resto de la app no dependa de esa forma.
async function listarPestanas(id) {
  var d = await api(BASE + id + '?fields=' +
    encodeURIComponent('properties(title),sheets(properties(sheetId,title))'));
  var hojas = (d && d.sheets) || [];
  if (!hojas.length) throw new Error('La planilla no tiene pestañas visibles.');
  return {
    titulo: (d.properties && d.properties.title) || '(sin nombre)',
    pestanas: hojas.map(function (h) {
      return { id: h.properties.sheetId, nombre: h.properties.title };
    })
  };
}

async function leerHoja(id, nombre) {
  var rango = "'" + nombre.replace(/'/g, "''") + "'!A1:" + letraCol(MAX_COLS - 1) + MAX_FILAS;
  var campos = 'sheets(properties(sheetId,title),data(rowData(values(effectiveValue,effectiveFormat/backgroundColor))))';
  var d = await api(BASE + id + '?includeGridData=true&ranges=' + encodeURIComponent(rango) +
                    '&fields=' + encodeURIComponent(campos));
  var hoja = d.sheets && d.sheets[0];
  if (!hoja) throw new Error('No existe la pestaña "' + nombre + '"');
  var grid = (hoja.data && hoja.data[0] && hoja.data[0].rowData) || [];

  function celda(c) {
    if (!c) return { v: null, bg: null };
    var ev = c.effectiveValue || {}, v = null;
    if (ev.numberValue !== undefined) v = ev.numberValue;
    else if (ev.stringValue !== undefined) v = ev.stringValue;
    else if (ev.boolValue !== undefined) v = ev.boolValue;
    return { v: v, bg: (c.effectiveFormat && c.effectiveFormat.backgroundColor) || null };
  }

  var encabezados = ((grid[0] && grid[0].values) || []).map(function (c) { return celda(c).v; });
  var primeraClave = clave(encabezados[0]);
  var filas = [];
  for (var i = 1; i < grid.length; i++) {
    var vals = (grid[i] && grid[i].values) || [];
    var p = celda(vals[0]).v;
    if (p === null || p === '') continue;
    // Encabezado repetido en el medio: pasa cuando se pegan bloques de filas.
    if (clave(p) === primeraClave) continue;
    var celdas = [], colores = [];
    for (var j = 0; j < MAX_COLS; j++) { var c2 = celda(vals[j]); celdas[j] = c2.v; colores[j] = c2.bg; }
    filas.push({ fila: i + 1, celdas: celdas, colores: colores });
  }
  return { sheetId: hoja.properties.sheetId, encabezados: encabezados, filas: filas };
}

function aValorSheets(v) {
  if (v === null || v === undefined || v === '') return { stringValue: '' };
  if (typeof v === 'number') return { numberValue: v };
  if (v instanceof Date) return { numberValue: Math.floor((v - EPOCH) / DIA) };
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(v))) {
    var d = new Date(String(v) + 'T00:00:00Z');
    if (!isNaN(d)) return { numberValue: Math.floor((d - EPOCH) / DIA) };
  }
  return { stringValue: String(v) };
}

function escribirCeldas(id, sheetId, fila, valores, colores) {
  var reqs = [];
  Object.keys(valores || {}).forEach(function (idx) {
    var c = +idx;
    reqs.push({ updateCells: {
      range: { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila, startColumnIndex: c, endColumnIndex: c + 1 },
      rows: [{ values: [{ userEnteredValue: aValorSheets(valores[idx]) }] }],
      fields: 'userEnteredValue' } });
  });
  Object.keys(colores || {}).forEach(function (idx) {
    var c = +idx;
    reqs.push({ repeatCell: {
      range: { sheetId: sheetId, startRowIndex: fila - 1, endRowIndex: fila, startColumnIndex: c, endColumnIndex: c + 1 },
      cell: { userEnteredFormat: { backgroundColor: COLORES[colores[idx]] || COLORES.vacio } },
      fields: 'userEnteredFormat.backgroundColor' } });
  });
  if (!reqs.length) return Promise.resolve();
  return api(BASE + id + ':batchUpdate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ requests: reqs })
  });
}

/* --- Carga de datos -------------------------------------------------------- */

async function cargarTodo() {
  S.cargando = true; S.error = null; pintar();
  var avisos = [];
  try {
    // Cada pestaña se lee y se mapea por separado: los encabezados de las
    // terrestres no son los mismos que los de las marítimas.
    var fuentes = [];
    for (var i = 0; i < S.cfg.tabsEmb.length; i++) {
      var tab = S.cfg.tabsEmb[i];
      var h;
      try {
        h = await leerHoja(S.cfg.sheetId, tab);
      } catch (e) {
        avisos.push('No se pudo leer "' + tab + '": ' + e.message);
        continue;
      }
      var det = detectar(h.encabezados, CAMPOS);

      var filas = h.filas.map(function (f) {
        var o = { _fila: f.fila, _tab: tab, _sheetId: h.sheetId, _id: tab + ':' + f.fila };
        Object.keys(det.mapa).forEach(function (campo) {
          var idx = det.mapa[campo];
          o[campo] = CAMPOS[campo].tipo === 'semaforo'
            ? colorASem(f.colores[idx])
            : convertir(f.celdas[idx], CAMPOS[campo].tipo);
        });
        // En T.R. el texto es la MODALIDAD de liberación (BL Original / telex),
        // no el estado. El estado es el color. Se guardan por separado.
        // Ojo: la columna mezcla modalidad ("BL Original", "telex") con
        // palabras de estado ("solicitada"), que ya vienen en el color. Solo
        // tomamos las que son realmente modalidad.
        if (det.mapa.tr !== undefined) {
          var t = clave(f.celdas[det.mapa.tr]);
          o.trModo = /bl original|original/.test(t) ? 'BL original'
                   : /telex/.test(t) ? 'Telex release'
                   : /express/.test(t) ? 'Express release'
                   : '';
        }

        // Naranja en "Pago estimado" = falta que manden el comprobante.
        var ip = det.mapa[COL_COMPROBANTE];
        o._faltaComprobante = ip !== undefined && esNaranja(f.colores[ip]);
        return o;
      });

      // Una columna vacía en TODAS las filas de esta pestaña no aplica a este
      // tipo de carga: en camión no hay BL ni contenedores. No la exigimos.
      var noAplica = {};
      Object.keys(det.mapa).forEach(function (campo) {
        var alguna = filas.some(function (o) {
          var v = o[campo];
          if (SEMAFOROS.indexOf(campo) >= 0) return v && v !== 'vacio';
          return v !== null && v !== undefined && v !== '';
        });
        if (!alguna) noAplica[campo] = 1;
      });

      fuentes.push({ tab: tab, sheetId: h.sheetId, mapa: det.mapa,
                     extras: det.extras, encabezados: h.encabezados,
                     noAplica: noAplica, filas: filas });
    }

    if (!fuentes.length) throw new Error(avisos.join(' · ') || 'No se pudo leer ninguna pestaña.');

    var todas = [];
    fuentes.forEach(function (f) { todas = todas.concat(f.filas); });
    S.fuentes = fuentes;
    S.datos = { filas: todas };

    // Contratos: se juntan todas las pestañas elegidas. Un embarque puede estar
    // en curso con el contrato ya cerrado, así que cerrados también cuentan.
    S.contratos = new Map();
    for (var j = 0; j < (S.cfg.tabsCtr || []).length; j++) {
      var tc = S.cfg.tabsCtr[j], hc;
      try {
        hc = await leerHoja(S.cfg.sheetId, tc);
      } catch (e2) {
        avisos.push('No se pudo leer "' + tc + '": ' + e2.message);
        continue;
      }
      var dc = detectar(hc.encabezados, CAMPOS_CTR);
      if (dc.mapa.contrato === undefined) {
        avisos.push('En "' + tc + '" no encontré una columna de contrato.');
        continue;
      }
      hc.filas.forEach(function (f) {
        var n = f.celdas[dc.mapa.contrato];
        if (!n) return;
        var k = String(n).trim();
        // Gana la primera pestaña de la lista si el contrato está repetido.
        if (S.contratos.has(k)) return;
        S.contratos.set(k, {
          contrato: k, origen: tc,
          tns: normNum(f.celdas[dc.mapa.tns]),
          formaPago: f.celdas[dc.mapa.formaPago],
          cond: interpretarPago(f.celdas[dc.mapa.formaPago])
        });
      });
    }

    S.avisos = avisos;
  } catch (e) {
    S.error = e.message;
  } finally {
    S.cargando = false; pintar();
  }
}

function fuenteDe(emb) {
  for (var i = 0; i < S.fuentes.length; i++) {
    if (S.fuentes[i].tab === emb._tab) return S.fuentes[i];
  }
  return S.fuentes[0];
}

function filaPorId(id) {
  return S.datos.filas.filter(function (x) { return x._id === id; })[0];
}

async function aplicarCambio(id, campo, valor) {
  var f = filaPorId(id);
  if (!f) return;
  var src = fuenteDe(f);
  var idx = campo === '_faltaComprobante' ? src.mapa[COL_COMPROBANTE] : src.mapa[campo];
  if (idx === undefined) {
    S.error = 'Esa columna no existe en "' + f._tab + '".';
    return pintar();
  }

  var antes = f[campo];
  f[campo] = (campo === '_faltaComprobante' || CAMPOS[campo].tipo === 'semaforo')
    ? valor : convertir(valor, CAMPOS[campo].tipo);
  S.guardando++; pintar();

  var valores = {}, colores = {};
  if (campo === '_faltaComprobante') colores[idx] = valor ? 'falta_cbte' : 'vacio';
  else if (SEMAFOROS.indexOf(campo) >= 0) colores[idx] = valor;
  else valores[idx] = valor;

  try {
    await escribirCeldas(S.cfg.sheetId, f._sheetId, f._fila, valores, colores);
  } catch (e) {
    f[campo] = antes;
    S.error = 'No se pudo guardar: ' + e.message;
  } finally {
    S.guardando--; pintar();
  }
}

function ciclarSemaforo(id, campo) {
  var f = filaPorId(id);
  var actual = (f && f[campo]) || 'vacio';
  aplicarCambio(id, campo, CICLO[(CICLO.indexOf(actual) + 1) % CICLO.length]);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function fmtFecha(f) {
  return esFecha(f) ? f.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
}

function pintarCelda(v) {
  if (v === null || v === undefined || v === '') return '<span class="vacia">—</span>';
  if (typeof v === 'object' && v.invalida) return '<span class="mala">' + esc(v.crudo) + '</span>';
  if (v instanceof Date) {
    var mala = v.getUTCFullYear() > new Date().getFullYear() + 1;
    return mala ? '<span class="mala">' + fmtFecha(v) + '</span>' : fmtFecha(v);
  }
  if (typeof v === 'number') return v.toLocaleString('es-AR');
  return esc(v);
}

/* --- Tablero --------------------------------------------------------------- */

function evaluarTodo() {
  var hoy = new Date();
  return S.datos.filas.map(function (emb) {
    var ctr = S.contratos.get(String(emb.contract || '').trim()) || null;
    var src = fuenteDe(emb);
    return { emb: emb, contrato: ctr, src: src,
             ev: evaluar(emb, ctr, hoy, src.mapa, src.noAplica) };
  });
}

function vistaApp() {
  if (!S.datos) {
    return '<div class="app">' + cabecera() +
      (S.error ? '<div class="error" style="margin-top:14px">' + esc(S.error) + '</div>' : '') +
      '<p class="centro">' + (S.cargando ? 'Leyendo la planilla…' : 'Sin datos.') + '</p></div>';
  }

  var evs = evaluarTodo();
  var cuenta = { critico: 0, alto: 0, medio: 0, ok: 0 };
  evs.forEach(function (x) { x.ev.nivelMax ? cuenta[x.ev.nivelMax]++ : cuenta.ok++; });

  var cuerpo = S.vista === 'control' ? vistaControl(evs, cuenta) : vistaGrilla(evs);
  var panel = '';
  if (S.sel !== null) {
    var item = evs.filter(function (x) { return x.emb._id === S.sel; })[0];
    if (item) panel = vistaPanel(item);
  }

  return '<div class="app">' + cabecera() +
    (S.error ? '<div class="error" style="margin-top:14px">' + esc(S.error) + '</div>' : '') +
    diagnostico() +
    '<div class="tabs" role="tablist">' +
      '<button role="tab" aria-selected="' + (S.vista === 'control') + '" data-act="tab" data-v="control">Control</button>' +
      '<button role="tab" aria-selected="' + (S.vista === 'carga') + '" data-act="tab" data-v="carga">Carga</button>' +
    '</div>' + cuerpo + '</div>' + panel;
}

function cabecera() {
  return '<div class="cab"><h1>Control de embarques</h1>' +
    '<span class="sello">' + esc(S.cfg.titulo || '') + ' · ' + esc(S.cfg.tabsEmb.join(' + ')) +
      (S.guardando > 0 ? ' · guardando…' : '') + '</span>' +
    '<span class="cab-acc">' +
      '<button data-act="recargar"' + (S.cargando ? ' disabled' : '') + '>' +
        (S.cargando ? 'Actualizando…' : 'Actualizar') + '</button>' +
      '<button data-act="salir">Cambiar planilla</button>' +
    '</span></div>';
}

function diagnostico() {
  var criticas = ['contract', 'importer', 'etd', 'eta'];
  var h = '';

  (S.avisos || []).forEach(function (a) {
    h += '<div class="aviso">' + esc(a) + '</div>';
  });

  S.fuentes.forEach(function (src) {
    var faltan = criticas.filter(function (c) { return src.mapa[c] === undefined; });
    if (faltan.length) {
      h += '<div class="aviso">En <b>' + esc(src.tab) + '</b> no encontré: <b>' +
        faltan.map(function (c) { return CAMPOS[c].label; }).join(', ') +
        '</b>. Las alertas que dependen de esas columnas quedan apagadas.</div>';
    }
  });

  if ((S.cfg.tabsCtr || []).length && S.contratos.size === 0) {
    h += '<div class="aviso">No se cargó ningún contrato, así que no hay condiciones de pago ' +
      'y las alertas de cobro están apagadas.</div>';
  }

  h += '<details class="diag"><summary>' + S.datos.filas.length + ' embarques de ' +
    S.fuentes.length + (S.fuentes.length === 1 ? ' pestaña' : ' pestañas') +
    ' · ' + S.contratos.size + ' contratos</summary>';

  S.fuentes.forEach(function (src) {
    var na = Object.keys(src.noAplica);
    h += '<p style="margin:8px 0 0"><b>' + esc(src.tab) + '</b> · ' +
      src.filas.length + ' filas · ' + Object.keys(src.mapa).length + ' columnas reconocidas' +
      (na.length ? '<br>Vacías en toda la pestaña, no se exigen: ' +
        na.map(function (c) { return esc(CAMPOS[c].label); }).join(', ') : '') +
      (src.extras.length ? '<br>Ignora: ' +
        src.extras.map(function (e) { return esc(e.h); }).join(', ') : '') + '</p>';
  });

  return h + '</details>';
}

// Un estado nunca se comunica solo con color: siempre color + palabra.
function pill(campo, estado) {
  var cls = { ok:'ok', pendiente:'pend', atencion:'sol', vacio:'hueco' }[estado || 'vacio'];
  return '<span class="pill ' + cls + '"><span class="pt"></span>' +
    CAMPOS[campo].label + ': ' + etiqueta(campo, estado) + '</span>';
}

function pasosEtapa(idEtapa) {
  var i = ETAPAS.map(function (e) { return e.id; }).indexOf(idEtapa);
  var et = ETAPAS[i];
  return '<span class="etapa"><span class="pasos">' +
    ETAPAS.map(function (_, j) { return '<i class="' + (j <= i ? 'on' : '') + '"></i>'; }).join('') +
    '</span>' + (et ? et.label : '') + '</span>';
}

// Barra de ruta con la posición estimada del buque entre ETD y ETA.
function barraRuta(emb) {
  var hoy = new Date();
  var pct = null;
  if (esFecha(emb.etd) && esFecha(emb.eta) && emb.eta > emb.etd) {
    pct = Math.max(0, Math.min(1, (hoy - emb.etd) / (emb.eta - emb.etd)));
  }
  var destino = emb.port || '—';
  return '<div class="ruta">' +
    '<span class="f">' + (esFecha(emb.etd) ? fmtFecha(emb.etd) : '··') + '</span>' +
    '<span class="via">' +
      (pct !== null ? '<i style="width:' + Math.round(pct * 100) + '%"></i>' +
        '<b style="left:' + Math.round(pct * 100) + '%"></b>' : '') +
    '</span>' +
    '<span class="pto">' + esc(destino) + '</span>' +
    '<span class="f">' + (esFecha(emb.eta) ? fmtFecha(emb.eta) : '··') + '</span>' +
    '</div>';
}

function vistaControl(evs, cuenta) {
  var orden = { critico: 3, alto: 2, medio: 1 };
  var con = evs.filter(function (x) { return x.ev.alertas.length; })
    .sort(function (a, b) { return (orden[b.ev.nivelMax] || 0) - (orden[a.ev.nivelMax] || 0); });

  var h = '<div class="tira">' +
    boton('critico', cuenta.critico, 'Acción ahora', 'crit') +
    boton('alto', cuenta.alto, 'Esta semana', 'alt') +
    boton('medio', cuenta.medio, 'Datos incompletos', '') +
    boton('ok', cuenta.ok, 'Al día', '') +
    '</div>';

  function boton(nivel, n, label, cls) {
    return '<button class="' + cls + '" data-act="fnivel" data-n="' + nivel + '" ' +
      'aria-pressed="' + (S.filtroNivel === nivel) + '">' +
      '<span class="n">' + n + '</span><span class="l">' + label + '</span></button>';
  }

  if (!evs.length) return h + '<p class="centro">No hay filas con datos en las pestañas elegidas.</p>';

  if (S.filtroNivel === 'ok') {
    var alDia = evs.filter(function (x) { return !x.ev.nivelMax; });
    return h + '<h2 class="gt">Al día · ' + alDia.length + '</h2>' +
      '<div class="lista">' + alDia.map(filaEmbarque).join('') + '</div>';
  }

  if (!con.length) return h + '<p class="centro">No hay nada pendiente. Todo al día.</p>';

  [['critico', 'Requieren acción ahora'], ['alto', 'Para esta semana'], ['medio', 'Datos incompletos']]
    .forEach(function (g) {
      if (S.filtroNivel && S.filtroNivel !== g[0]) return;
      var items = con.filter(function (x) { return x.ev.nivelMax === g[0]; });
      if (!items.length) return;
      h += '<h2 class="gt">' + g[1] + ' · ' + items.length + '</h2>';
      items.forEach(function (x) {
        var a = x.ev.alertas[0], resto = x.ev.alertas.length - 1;
        h += '<article class="alerta ' + a.nivel + '">' +
          '<span class="marca"></span><div class="cuerpo">' +
          '<div class="f1"><span class="quien">' + esc(x.emb.importer || '(sin importador)') + '</span>' +
          '<span class="ctr">' + esc(x.emb.contract) +
            (S.fuentes.length > 1 ? ' · ' + esc(x.emb._tab) : '') + '</span></div>' +
          '<p class="tit">' + esc(a.titulo) + '</p>' +
          '<p class="det">' + esc(a.detalle) + '</p>' +
          '<div class="acc"><button data-act="abrir" data-f="' + esc(x.emb._id) + '">' +
            esc(a.accion) + '</button>' +
          pasosEtapa(x.ev.etapa) +
          (resto > 0 ? '<span class="pill gris">+' + resto + ' más</span>' : '') +
          '</div></div></article>';
      });
    });
  return h;
}

// La fila de embarque: lo mismo que la planilla pero legible de un vistazo.
function filaEmbarque(x) {
  var emb = x.emb, src = x.src;
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });

  var tns = emb.tns !== null && emb.tns !== undefined && emb.tns !== ''
    ? Number(emb.tns).toLocaleString('es-AR') + ' tn' : '';
  var sub = [emb.product, tns].filter(Boolean).join(' · ');

  return '<article class="emb' + (emb._id === S.sel ? ' sel' : '') +
    (x.ev.nivelMax === 'critico' ? ' tiene-critico' : '') +
    '" data-act="abrir" data-f="' + esc(emb._id) + '" tabindex="0">' +
    '<div><div class="quien">' + esc(emb.importer || '(sin importador)') + '</div>' +
      '<div class="sub">' + esc(sub) + '</div>' +
      '<div class="ctr">' + esc(emb.contract) +
        (S.fuentes.length > 1 ? ' · ' + esc(emb._tab) : '') + '</div></div>' +
    '<div>' + barraRuta(emb) +
      '<div style="margin-top:7px">' + pasosEtapa(x.ev.etapa) + '</div></div>' +
    '<div class="estados">' +
      sems.map(function (c) { return pill(c, emb[c]); }).join('') +
      (emb._faltaComprobante
        ? '<span class="pill nar"><span class="pt"></span>Falta comprobante</span>' : '') +
      (x.ev.nivelMax === 'critico'
        ? '<span class="pill pend"><span class="pt"></span>' + esc(x.ev.alertas[0].titulo) + '</span>' : '') +
    '</div></article>';
}


function vistaGrilla(evs) {
  var q = S.busca.trim().toLowerCase();
  var filas = q ? evs.filter(function (x) {
    return [x.emb.contract, x.emb.importer, x.emb.bl, x.emb.vessel, x.emb.port, x.emb._tab]
      .some(function (v) { return String(v || '').toLowerCase().indexOf(q) >= 0; });
  }) : evs.slice();

  if (S.filtroTab) filas = filas.filter(function (x) { return x.emb._tab === S.filtroTab; });
  if (S.filtroEtapa) filas = filas.filter(function (x) { return x.ev.etapa === S.filtroEtapa; });

  // Orden por fecha relevante: lo que se mueve primero, arriba.
  filas.sort(function (a, b) {
    var fa = esFecha(a.emb.eta) ? a.emb.eta : (esFecha(a.emb.etd) ? a.emb.etd : new Date(8e15));
    var fb = esFecha(b.emb.eta) ? b.emb.eta : (esFecha(b.emb.etd) ? b.emb.etd : new Date(8e15));
    return fa - fb;
  });

  var h = '<div class="filtros">' +
    '<input id="busca" placeholder="Buscar cliente, contrato, BL, buque" value="' +
      esc(S.busca) + '" aria-label="Buscar">';
  if (S.fuentes.length > 1) {
    h += '<select id="ftab" aria-label="Filtrar por pestaña"><option value="">Todas las pestañas</option>' +
      S.fuentes.map(function (f) {
        return '<option value="' + esc(f.tab) + '"' + (S.filtroTab === f.tab ? ' selected' : '') +
          '>' + esc(f.tab) + ' (' + f.filas.length + ')</option>';
      }).join('') + '</select>';
  }
  h += '<button data-act="densidad" style="margin-left:auto">' +
    (S.compacto ? 'Ver detalle' : 'Ver compacto') + '</button></div>';

  // Filtro por etapa: cuántos hay en cada punto del circuito.
  var cuentaEtapa = {};
  evs.forEach(function (x) { cuentaEtapa[x.ev.etapa] = (cuentaEtapa[x.ev.etapa] || 0) + 1; });
  h += '<div class="chips">' +
    '<button data-act="fetapa" data-e="" aria-pressed="' + (!S.filtroEtapa) + '">Todas · ' + evs.length + '</button>' +
    ETAPAS.filter(function (e) { return cuentaEtapa[e.id]; }).map(function (e) {
      return '<button data-act="fetapa" data-e="' + e.id + '" aria-pressed="' +
        (S.filtroEtapa === e.id) + '">' + e.label + ' · ' + cuentaEtapa[e.id] + '</button>';
    }).join('') + '</div>';

  if (!filas.length) return h + '<p class="centro">Nada coincide con el filtro.</p>';

  if (S.compacto) return h + tablaCompacta(filas);
  return h + '<div class="lista">' + filas.map(filaEmbarque).join('') + '</div>';
}

// Vista densa, para cuando hace falta comparar muchas filas de un saque.
function tablaCompacta(filas) {
  var hay = function (c) { return S.fuentes.some(function (f) { return f.mapa[c] !== undefined; }); };
  var cols = ['contract', 'importer', 'product', 'tns', 'etd', 'eta', 'port'].filter(hay);
  var sems = SEMAFOROS.filter(hay);

  return '<div class="marco"><table><thead><tr>' +
    cols.map(function (c) { return '<th>' + CAMPOS[c].label + '</th>'; }).join('') +
    '<th>Etapa</th>' +
    sems.map(function (c) { return '<th>' + CAMPOS[c].label + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    filas.map(function (x) {
      var src = x.src;
      return '<tr' + (x.emb._id === S.sel ? ' class="sel"' : '') +
        ' data-act="abrir" data-f="' + esc(x.emb._id) + '">' +
        cols.map(function (c) {
          var cls = c === 'tns' ? ' class="num"' : (c === 'contract') ? ' class="cod"' : '';
          if (src.mapa[c] === undefined) return '<td' + cls + '><span class="vacia">·</span></td>';
          return '<td' + cls + '>' + pintarCelda(x.emb[c]) + '</td>';
        }).join('') +
        '<td>' + (ETAPAS.filter(function (e) { return e.id === x.ev.etapa; })[0] || {}).label + '</td>' +
        sems.map(function (c) {
          if (src.mapa[c] === undefined || src.noAplica[c]) return '<td><span class="vacia">·</span></td>';
          return '<td>' + pill(c, x.emb[c]) + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

var EDITABLES = ['vessel', 'shippingLine', 'booking', 'containers', 'bl', 'invoice', 'tracking', 'nota'];

function vistaPanel(x) {
  var emb = x.emb, ev = x.ev, src = x.src, cond = x.contrato ? x.contrato.cond : null;
  var falta = {};
  ev.alertas.forEach(function (a) {
    if (a.campos) a.campos.forEach(function (c) { falta[c] = 1; });
  });

  var h = '<div class="velo" data-act="cerrar"></div>' +
    '<aside class="panel" role="dialog" aria-label="Embarque ' + esc(emb.contract) + '">' +
    '<button class="cerrar" data-act="cerrar">Cerrar</button>' +
    '<h2>' + esc(emb.importer || '(sin importador)') + '</h2>' +
    '<p style="margin:0 0 4px;font-family:var(--mono);font-size:11.5px;color:var(--tinta3)">' +
      esc(emb.contract) + ' · ' + esc(emb._tab) + '</p>' +
    '<div style="margin:12px 0">' + pasosEtapa(ev.etapa) + '</div>';

  // Lo que hay que hacer, arriba de todo.
  if (ev.alertas.length) {
    h += '<div class="bloque"><h3 class="gt">Pendientes · ' + ev.alertas.length + '</h3>';
    ev.alertas.forEach(function (a) {
      h += '<div class="alerta ' + a.nivel + '" style="margin-bottom:6px">' +
        '<span class="marca"></span><div class="cuerpo">' +
        '<p class="tit" style="margin-top:0">' + esc(a.titulo) + '</p>' +
        '<p class="det">' + esc(a.detalle) + '</p></div></div>';
    });
    h += '</div>';
  }

  // Ficha: los datos que se miran, no se editan.
  h += '<div class="bloque"><h3 class="gt">Embarque</h3><dl style="margin:0">' +
    kv('Producto', emb.product) +
    kv('Toneladas', emb.tns !== null && emb.tns !== '' ? Number(emb.tns).toLocaleString('es-AR') : '') +
    kv('Destino', emb.port) +
    kv('ETD', esFecha(emb.etd) ? fmtFecha(emb.etd) : '') +
    kv('ETA', esFecha(emb.eta) ? fmtFecha(emb.eta) : '') +
    kv('Buque', emb.vessel) +
    '</dl></div>';

  // Estados: botón grande con la palabra, no un cuadradito de color.
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (sems.length) {
    h += '<div class="bloque"><h3 class="gt">Estado</h3><div class="sems">' +
      sems.map(function (c) {
        return '<button class="sembtn" data-e="' + (emb[c] || 'vacio') + '" data-act="sem" ' +
          'data-f="' + esc(emb._id) + '" data-c="' + c + '">' +
          '<span class="et">' + CAMPOS[c].label + '</span>' +
          '<span class="vl">' + etiqueta(c, emb[c]) + '</span></button>';
      }).join('') + '</div>' +
      '<p class="ayuda">Clic para cambiar. Se pinta igual en la planilla.</p>';
    if (emb.trModo) {
      h += '<p class="ayuda" style="margin-top:8px">Modalidad de liberación: <b>' +
        esc(emb.trModo) + '</b></p>';
    }
    h += '</div>';
  }

  // Cobro.
  h += '<div class="bloque"><h3 class="gt">Cobro</h3>';
  if (!x.contrato) {
    h += '<p class="det">El contrato no aparece en las pestañas de contratos elegidas, ' +
      'así que no hay condición de pago ni alertas de cobro.</p>';
  } else if (cond.desconocida) {
    h += '<p class="det">Condición sin mapear: <em>' + esc(cond.texto || 'vacía en el contrato') +
      '</em>. Las alertas de cobro quedan apagadas para este embarque.</p>';
  } else {
    h += '<p style="margin:0 0 8px;font-size:13px">' + esc(cond.texto) + '</p>' +
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">' +
      '<span class="pill gris"><span class="pt"></span>' +
        esc(String(cond.momento).replace(/_/g, ' ')) + '</span>' +
      '<span class="pill gris"><span class="pt"></span>' + esc(cond.medio) + '</span>' +
      '<span class="pill ' + (LIBERACION[cond.lib].antes ? 'sol' : 'ok') + '">' +
        '<span class="pt"></span>' + LIBERACION[cond.lib].label + '</span>' +
      (cond.revisar ? '<span class="pill nar"><span class="pt"></span>revisar mapeo</span>' : '') +
      '</div><dl style="margin:0">' +
      kv('Cobro esperado', ev.cobro ? fmtFecha(ev.cobro) : 'no estimable') +
      kv('Comisión', emb.commission ? 'US$ ' + Number(emb.commission).toLocaleString('es-AR') : '') +
      '</dl>';
  }

  if (src.mapa[COL_COMPROBANTE] !== undefined) {
    h += '<label class="chk" style="margin-top:10px">' +
      '<input type="checkbox" data-cbte="' + esc(emb._id) + '"' +
      (emb._faltaComprobante ? ' checked' : '') + '>' +
      '<span>Falta que manden el comprobante</span></label>';
  }
  h += '</div>';

  // Campos editables.
  var eds = EDITABLES.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (eds.length) {
    h += '<div class="bloque"><h3 class="gt">Datos</h3>';
    eds.forEach(function (c) {
      var v = emb[c];
      h += '<div class="campo' + (falta[c] ? ' falta' : '') + '">' +
        '<label for="e-' + c + '">' + CAMPOS[c].label +
        (falta[c] ? ' <span style="color:var(--pend)">· falta</span>' : '') + '</label>' +
        '<input id="e-' + c + '" data-edit="' + c + '" data-f="' + esc(emb._id) + '" value="' +
        esc(v instanceof Date ? fmtFecha(v) : (v || '')) + '"></div>';
    });
    h += '</div>';
  }

  return h + '</aside>';
}

function kv(k, v) {
  if (v === null || v === undefined || v === '') return '';
  return '<div class="kv"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>';
}

/* --- Render + eventos ------------------------------------------------------ */

function pintar() {
  var foco = document.activeElement;
  var id = foco && foco.id, pos = foco && foco.selectionStart;

  var html;
  try {
    html = S.pantalla === 'app' ? vistaApp() : vistaSetup();
  } catch (e) {
    // Sin esto, un error acá deja la pantalla clavada en el estado anterior y
    // parece que la app se colgó.
    html = '<div class="setup"><div class="error"><b>Error al dibujar la pantalla</b><br>' +
      esc(e.message) + '</div>' +
      '<div class="caja"><button data-act="reset-cid">Empezar de nuevo</button></div></div>';
    if (window.console) console.error(e);
  }

  document.getElementById('root').innerHTML = html;

  if (id) {
    var nuevo = document.getElementById(id);
    if (nuevo) {
      nuevo.focus();
      try { nuevo.setSelectionRange(pos, pos); } catch (e2) {}
    }
  }
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');

  if (act === 'set-cid') {
    var v = (document.getElementById('cid').value || '').trim();
    if (!v) { S.error = 'Pegá el Client ID.'; return pintar(); }
    if (v.indexOf('.apps.googleusercontent.com') < 0) {
      S.error = 'Eso no parece un Client ID. Termina en .apps.googleusercontent.com';
      return pintar();
    }
    S.cfg = Object.assign({}, S.cfg, { clientId: v });
    S.error = null; S.setup.entrada = ''; guardarCfg(); tokenClient = null; return pintar();
  }

  if (act === 'reset-cid') {
    S.cfg = null; S.pestanas = null; S.error = null; S.setup.entrada = '';
    tokenClient = null; S.token = null;
    try { localStorage.removeItem(LS); } catch (e) {}
    return pintar();
  }

  if (act === 'entrar') return entrar();

  if (act === 'buscar') return buscarPlanilla();

  if (act === 'usar') {
    if (!S.setup.tabsEmb.length) { S.error = 'Marcá al menos una pestaña de embarques.'; return pintar(); }
    S.cfg.tabsEmb = S.setup.tabsEmb.slice();
    S.cfg.tabsCtr = S.setup.tabsCtr.slice();
    S.cfg.titulo = S.pestanas.titulo;
    guardarCfg(); S.pantalla = 'app'; S.error = null;
    return cargarTodo();
  }

  if (act === 'tab') { S.vista = el.getAttribute('data-v'); return pintar(); }
  if (act === 'densidad') { S.compacto = !S.compacto; return pintar(); }
  if (act === 'fetapa') {
    S.filtroEtapa = el.getAttribute('data-e') || '';
    return pintar();
  }
  if (act === 'fnivel') {
    var n = el.getAttribute('data-n');
    S.filtroNivel = S.filtroNivel === n ? '' : n;
    return pintar();
  }
  if (act === 'recargar') return cargarTodo();
  if (act === 'cerrar') { S.sel = null; return pintar(); }

  if (act === 'salir') {
    S.cfg = { clientId: S.cfg.clientId };   // conserva el Client ID
    S.pestanas = null; S.datos = null; S.fuentes = null; S.pantalla = 'setup'; S.error = null;
    S.setup = { entrada: '', tabsEmb: [], tabsCtr: [], buscando: false, entrando: false };
    guardarCfg(); return pintar();
  }

  if (act === 'sem') {
    ev.stopPropagation();
    return ciclarSemaforo(el.getAttribute('data-f'), el.getAttribute('data-c'));
  }

  if (act === 'abrir') {
    S.sel = el.getAttribute('data-f');
    return pintar();
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'busca') { S.busca = e.target.value; pintar(); }
  if (e.target.id === 'cid' || e.target.id === 'url') S.setup.entrada = e.target.value;
});

document.addEventListener('change', function (e) {
  if (e.target.id === 'ftab') { S.filtroTab = e.target.value; return pintar(); }
  var cbte = e.target.getAttribute && e.target.getAttribute('data-cbte');
  if (cbte) return aplicarCambio(cbte, '_faltaComprobante', e.target.checked);
  var g = e.target.getAttribute && e.target.getAttribute('data-grupo');
  if (!g) return;
  var lista = g === 'emb' ? S.setup.tabsEmb : S.setup.tabsCtr;
  var i = lista.indexOf(e.target.value);
  if (e.target.checked && i < 0) lista.push(e.target.value);
  if (!e.target.checked && i >= 0) lista.splice(i, 1);
});

document.addEventListener('blur', function (e) {
  var campo = e.target.getAttribute && e.target.getAttribute('data-edit');
  if (!campo) return;
  var id = e.target.getAttribute('data-f');
  var f = filaPorId(id);
  var actual = f ? f[campo] : '';
  var actualTxt = actual instanceof Date ? fmtFecha(actual) : (actual || '');
  if (e.target.value !== actualTxt) aplicarCambio(id, campo, e.target.value);
}, true);

document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList &&
      e.target.classList.contains('emb')) {
    e.preventDefault();
    S.sel = e.target.getAttribute('data-f');
    return pintar();
  }
  if (e.key === 'Escape' && S.sel !== null) { S.sel = null; pintar(); }
  if (e.key === 'Enter' && (e.target.id === 'cid' || e.target.id === 'url')) {
    var b = document.querySelector('[data-act="' + (e.target.id === 'cid' ? 'set-cid' : 'buscar') + '"]');
    if (b) b.click();
  }
});

async function buscarPlanilla() {
  var id = extraerId(document.getElementById('url').value);
  if (!id) { S.error = 'No reconozco eso como un id ni una URL de Google Sheets.'; return pintar(); }
  S.error = null; S.setup.buscando = true; pintar();
  try {
    S.cfg.sheetId = id;
    var d = await listarPestanas(id);
    S.pestanas = d;
    // Adivina cuál es cuál para no hacer elegir a mano si es obvio.
    var buscar = function () {
      var t = Array.prototype.slice.call(arguments);
      var p = d.pestanas.filter(function (x) {
        return t.some(function (k) { return clave(x.nombre).indexOf(k) >= 0; });
      })[0];
      return p ? p.nombre : '';
    };
    // Preselección: todo lo que parezca embarques o contratos.
    var todas = function () {
      var t = Array.prototype.slice.call(arguments);
      return d.pestanas.filter(function (x) {
        return t.some(function (k) { return clave(x.nombre).indexOf(k) >= 0; });
      }).map(function (x) { return x.nombre; });
    };
    S.setup.tabsEmb = todas('embarque', 'carga');
    S.setup.tabsCtr = todas('contratos abiertos', 'contratos cerrados');
  } catch (e) {
    S.pestanas = null;
    S.error = e.message;
  } finally {
    S.setup.buscando = false;
    pintar();
  }
}

/* --- Arranque -------------------------------------------------------------- */

function arrancar() {
  // OAuth necesita un origen http(s). Abierto con doble clic (file://) no anda,
  // y el error de Google en ese caso no explica nada.
  if (location.protocol === 'file:') {
    document.getElementById('root').innerHTML =
      '<div class="setup"><div class="error">Estás abriendo el archivo directo desde el disco ' +
      '(<code>file://</code>). Google no permite el login así. Subilo a Netlify o GitHub Pages, ' +
      'o levantá un servidor local con <code>npx serve</code>.</div></div>';
    return;
  }

  // Nunca pedimos el token solo: el popup de Google se bloquea si no sale de un
  // clic. Al recargar mostramos el paso de login y desde ahí sigue solo.
  S.pantalla = 'setup';
  pintar();
}

// Esperar a que cargue la librería de Google antes de dibujar.
(function esperar(intentos) {
  if (window.google && google.accounts && google.accounts.oauth2) return arrancar();
  if (intentos <= 0) {
    document.getElementById('root').innerHTML =
      '<div class="setup"><div class="error">No cargó la librería de Google. ' +
      'Revisá la conexión o si hay un bloqueador de scripts, y recargá.</div></div>';
    return;
  }
  setTimeout(function () { esperar(intentos - 1); }, 100);
})(60);
