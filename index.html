      : '') +

    '<div class="pe-quien"><h2>' + esc(e.contrato) + '</h2>' +
    (ref
      ? '<p class="pe-ref">' + esc(ref.tab) + ' · fila ' + ref.fila +
        ((ref.otras && ref.otras.length)
          ? ' — ' + (ref.otras.length + 1) + ' productos en filas distintas'
          : '') + '</p></div>'
      : '</div><div class="error" style="margin-top:12px">Este contrato no está en las pestañas ' +
        'editables. Revisá la configuración de pestañas.</div>') +
    (S.editCtrError ? '<div class="error" style="margin-top:12px">' + esc(S.editCtrError) + '</div>' : '') +
    (ref
      ? bloqueFirmas + '<div class="bloque">' + campos + '</div>' + bloqueProductos +
        '<p class="ayuda">Total, Comisión, ENT y Saldo son fórmulas de la planilla ' +
        'y no se tocan.</p>' +
        (fuera.length
          ? '<p class="no-base">Fuera de la base: ' + fuera.join(', ') +
            '. Hay que agregarlos a la base de datos.</p>' : '') +
        (repeEd
          ? '<div class="aviso" style="margin:10px 0 0">Ya existe un contrato ' +
            '<b>' + esc(nuevoNum) + '</b>' +
            (repeEd.exportador || repeEd.importador
              ? ' de ' + esc([repeEd.exportador, repeEd.importador].filter(Boolean).join(' → '))
              : '') + '. Si no es a propósito, revisalo antes de guardar.</div>'
          : '') +
        ''
      : '') +
    '</aside>';
}

// Marca en negrita la parte del texto que coincide con lo tipeado.
function resaltar(texto, q) {
  if (!q) return esc(texto);
  var i = clave(texto).indexOf(q);
  if (i < 0) return esc(texto);
  return esc(texto.slice(0, i)) + '<b>' + esc(texto.slice(i, i + q.length)) + '</b>' +
         esc(texto.slice(i + q.length));
}

function opcionesCombo(opciones, val) {
  var q = clave(val);
  if (!q) return (opciones || []).slice(0, 9);

  var empiezan = [], contienen = [];
  for (var i = 0; i < opciones.length; i++) {
    var pos = clave(opciones[i]).indexOf(q);
    if (pos === 0) { if (empiezan.length < 9) empiezan.push(opciones[i]); }
    else if (pos > 0) { if (contienen.length < 9) contienen.push(opciones[i]); }
    // Corta apenas junta suficientes: no hace falta recorrer los 500.
    if (empiezan.length >= 9) break;
  }
  return empiezan.concat(contienen).slice(0, 9);
}

function htmlListaCombo(id, campo, opciones, val, ctx, libre) {
  var q = clave(val);
  var sug = opcionesCombo(opciones, val);

  if (sug.length) {
    return '<div class="combo-lista">' + sug.map(function (o) {
      return '<button data-act="combosel2" data-c="' + ctx + ':' + campo + '" ' +
        'data-v="' + esc(o) + '">' + resaltar(o, q) + '</button>';
    }).join('') + '</div>';
  }
  if (q) {
    return '<div class="combo-lista"><p class="sin-match">' +
      (libre
        ? 'No coincide con ninguna condición ya usada. Se puede guardar igual, pero ' +
          'las alertas de cobro no van a funcionar hasta mapearla.'
        : 'Ninguno coincide. Si es nuevo, cargalo en la <b>base de datos</b>.') +
      '</p></div>';
  }
  return '';
}

function comboGen(id, campo, label, opciones, val, ok, ctx, libre) {
  var clave2 = ctx + ':' + campo;
  var abierto = S.combo === clave2;

  return '<div class="campo combo-wrap' + (val && !ok && !libre ? ' malo' : '') + '">' +
    '<label for="' + id + '">' + label +
      (ok && val && !libre ? '<span class="ok-tick">✓</span>' : '') + '</label>' +
    '<input id="' + id + '" data-combo2="' + clave2 + '" autocomplete="off" ' +
      'placeholder="Escribí para buscar" value="' + esc(val) + '">' +
    '<div class="combo-slot" id="cl-' + id + '">' +
      (abierto ? htmlListaCombo(id, campo, opciones, val, ctx, libre) : '') +
    '</div></div>';
}

// Regenera solo el desplegable, sin tocar el resto de la pantalla.
function refrescarCombo(id, campo, opciones, val, ctx, libre) {
  var slot = document.getElementById('cl-' + id);
  if (!slot) return pintar();   // si no está, algo cambió: redibujo completo
  slot.innerHTML = htmlListaCombo(id, campo, opciones, val, ctx, libre);

  // El marco rojo de "no está en la base" se actualiza sin redibujar.
  var wrap = slot.parentNode;
  if (wrap && !libre) {
    var existe = (opciones || []).some(function (o) { return clave(o) === clave(val); });
    wrap.classList[(val && !existe) ? 'add' : 'remove']('malo');
  }
}

// Qué lista corresponde a cada campo, para poder refrescar sin rearmar todo.
function listaDeCampo(campo) {
  var L = S.listas || {};
  if (S.gen) {
    if (/\.nombre$/.test(campo)) {
      var ns = [], vs = {};
      S.empresas.forEach(function (e) { vs[clave(e.nombre)] = 1; ns.push(e.nombre); });
      (L.importadores || []).concat(L.exportadores || []).forEach(function (n) {
        if (!vs[clave(n)]) { vs[clave(n)] = 1; ns.push(n); }
      });
      return ns;
    }
    if (campo === 'pago') return (S.formasPago || []).map(function (f) { return f.texto; });
  }
  campo = String(campo).replace(/_\d+$/, '');   // producto_1 -> producto
  if (S.altaEmb) {
    var a = S.altaEmb;
    if (campo === 'exporter') return L.exportadores || [];
    if (campo === 'importer') return L.importadores || [];
    if (campo === 'tipo') return L.tipos || [];
    if (campo === 'product') return productosDe(a.contract) || L.productos || [];
    if (campo === 'contract') return contratosDe(a.exporter, a.importer);
  }
  if (campo === 'exportador') return L.exportadores || [];
  if (campo === 'importador') return L.importadores || [];
  if (campo === 'producto') return L.productos || [];
  if (campo === 'tipo') return L.tipos || [];
  if (campo === 'formaPago') return (S.formasPago || []).map(function (f) { return f.texto; });
  return [];
}

// Escribir para ir acotando, en vez de buscar en una lista de 500. Si lo que
// se escribe no está en la base, no se inventa: hay que darlo de alta ahí
// primero, porque si no el nombre no cruza con nada.
/* Un número de contrato repetido rompe todo lo que cruza por contrato: el
   saldo, los embarques asociados, el advice. Se avisa antes de guardar, no
   después. */
function contratoRepetido(num, exceptoEste) {
  var k = clave(num);
  if (!k) return null;
  var encontrado = null;
  S.contratos.forEach(function (c, nombre) {
    if (encontrado) return;
    if (clave(nombre) !== k) return;
    if (exceptoEste && clave(exceptoEste) === k) return;   // es el mismo que se edita
    encontrado = c;
  });
  return encontrado;
}

function comboAlta(campo, label, opciones, a) {
  var ops = opciones || [];
  var val = a[campo] || '';
  var ok = ops.some(function (o) { return clave(o) === clave(val); });
  return comboGen('a-' + campo, campo, label, ops, val, ok, 'alta');
}

// Los productos del alta. El primero usa los nombres de siempre (producto,
// tipo...), los siguientes llevan sufijo: producto_1, tipo_1...
function productosAlta(a) {
  var n = a.nProd || 1, out = [];
  for (var i = 0; i < n; i++) {
    var k = function (c) { return i === 0 ? c : c + '_' + i; };
    out.push({
      producto: a[k('producto')] || '', tipo: a[k('tipo')] || '',
      toneladas: a[k('toneladas')] || '', precio: a[k('precio')] || '',
      packaging: a[k('packaging')] || ''
    });
  }
  return out;
}

function formAlta() {
  var a = S.alta || {};
  var L = S.listas || { exportadores: [], importadores: [], productos: [], tipos: [] };

  function txt(campo, label, tipo, ph) {
    return '<div class="campo"><label for="a-' + campo + '">' + label + '</label>' +
      '<input id="a-' + campo + '" data-alta="' + campo + '" type="' + (tipo || 'text') + '" ' +
      'value="' + esc(a[campo] || '') + '"' +
      (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>';
  }

  // Un contrato puede llevar varios productos: cada uno va a su propia fila
  // con el mismo número, que es como ya está armada la planilla y como la
  // fórmula de ENT separa lo entregado de cada producto.
  var nProd = a.nProd || 1;
  var prods = productosAlta(a);

  var enLista = function (lista, v) {
    return !v || (lista || []).some(function (o) { return clave(o) === clave(v); });
  };
  var fuera = [];
  if (!enLista(L.exportadores, a.exportador)) fuera.push('exportador');
  if (!enLista(L.importadores, a.importador)) fuera.push('importador');
  prods.forEach(function (p, i) {
    var sfx = nProd > 1 ? ' ' + (i + 1) : '';
    if (!enLista(L.productos, p.producto)) fuera.push('producto' + sfx);
    if (!enLista(L.tipos, p.tipo)) fuera.push('tipo' + sfx);
  });

  var faltan = ['contrato', 'exportador', 'importador'].filter(function (k) { return !a[k]; });
  if (!a.via) faltan.unshift('marítimo o terrestre');
  prods.forEach(function (p, i) {
    var sfx = nProd > 1 ? ' ' + (i + 1) : '';
    ['producto', 'tipo', 'toneladas', 'precio'].forEach(function (c) {
      if (!p[c]) faltan.push(c + sfx);
    });
  });

  var total = prods.reduce(function (acc, p) {
    return acc + (parseFloat(p.toneladas) || 0) * (parseFloat(p.precio) || 0);
  }, 0);

  // Referencia de numeración: el último contrato que quedó arriba del TOTAL.
  var ref = '';
  if (a.ultimo) {
    ref = '<div class="ultimo-ctr">' +
      '<span>Último cargado: <b>' + esc(a.ultimo.contrato) + '</b>' +
      (a.ultimo.fila ? ' <span class="fl">(fila ' + a.ultimo.fila + ')</span>' : '') + '</span>' +
      (a.ultimo.sugerido
        ? '<button data-act="usarnum" data-v="' + esc(a.ultimo.sugerido) + '">' +
          'Usar ' + esc(a.ultimo.sugerido) + '</button>'
        : '') + '</div>';
  } else if (a.cargandoUltimo) {
    ref = '<div class="ultimo-ctr"><span class="ayuda">Buscando el último contrato…</span></div>';
  }

  var repe = contratoRepetido(a.contrato);

  return '<div class="alta">' +
    '<div class="alta-cab"><h3>Nuevo contrato</h3>' +
      '<button data-act="altacerrar">Cancelar</button></div>' +
    (S.altaError ? '<div class="error">' + esc(S.altaError) + '</div>' : '') +
    (repe
      ? '<div class="aviso">Ya hay un contrato <b>' + esc(a.contrato) + '</b>' +
        (repe.exportador || repe.importador
          ? ' de ' + esc([repe.exportador, repe.importador].filter(Boolean).join(' → ')) : '') +
        (repe.tns ? ', ' + fmtNum(repe.tns) + ' tn' : '') +
        '. Si es otro producto del mismo contrato está bien; si no, cambiá el número.</div>'
      : '') +
    ref +
    // Lo primero: define dónde se va a ver el contrato y qué campos aplican.
    '<div class="elegir-via' + (a.via ? '' : ' falta') + '">' +
      '<span class="ev-lbl">¿Marítimo o terrestre? <span class="req">*</span></span>' +
      '<div class="ev-ops">' +
        [['maritimo', '🚢', 'Marítimo', 'Barco, contenedores, BL'],
         ['terrestre', '🚚', 'Terrestre', 'Camión, sin BL']].map(function (o) {
          return '<button class="ev-op' + (a.via === o[0] ? ' on' : '') + '" data-act="altavia" ' +
            'data-v="' + o[0] + '" aria-pressed="' + (a.via === o[0]) + '">' +
            '<span class="ev-ico">' + o[1] + '</span>' +
            '<span class="ev-txt"><b>' + o[2] + '</b><span>' + o[3] + '</span></span>' +
            (a.via === o[0] ? '<span class="ev-tick">' + ico('check') + '</span>' : '') +
            '</button>';
        }).join('') +
      '</div></div>' +

    '<div class="alta-grid">' +
      campoFecha('a-fecha', 'data-alta', 'fecha', 'Fecha', a.fecha) +
      txt('contrato', 'Contrato', 'text', 'LT100-2026') +
      comboAlta('exportador', 'Exportador', L.exportadores, a) +
      comboAlta('importador', 'Importador', L.importadores, a) +
      txt('incoterm', 'Incoterm', 'text', 'CIF Rotterdam') +
      comboGen('a-formaPago', 'formaPago', 'Forma de pago',
        S.formasPago.map(function (f) { return f.texto; }), a.formaPago || '', true, 'alta', true) +
      txt('periodo', 'Período de embarque', 'text', 'Octubre 2026') +
    '</div>' +

    '<div class="alta-prods">' +
      '<div class="ap-cab"><h4>Productos</h4>' +
        '<span class="ayuda">' + (nProd > 1
          ? nProd + ' productos · se cargan en ' + nProd + ' filas con el mismo número'
          : 'Si el contrato lleva más de uno, agregalos: cada uno va en su fila') +
        '</span></div>' +
      prods.map(function (p, i) {
        var k = function (c) { return i === 0 ? c : c + '_' + i; };
        return '<div class="ap-fila">' +
          (nProd > 1 ? '<span class="ap-num">' + (i + 1) + '</span>' : '') +
          '<div class="ap-campos">' +
            comboAlta(k('producto'), 'Producto', L.productos, a) +
            comboAlta(k('tipo'), 'Tipo', L.tipos, a) +
            txt(k('toneladas'), 'Toneladas', 'number') +
            txt(k('precio'), 'Precio USD/tn', 'number') +
            txt(k('packaging'), 'Packaging', 'text', 'Big Bags 1250 kgs') +
          '</div>' +
          (i > 0
            ? '<button class="ap-quitar" data-act="prodquitar" data-i="' + i + '" ' +
              'aria-label="Quitar producto ' + (i + 1) + '">' + ico('x') + '</button>'
            : '') +
        '</div>';
      }).join('') +
      '<button class="ap-mas" data-act="prodmas">' + ico('plus') + 'Agregar otro producto</button>' +
    '</div>' +
    (total ? '<p class="alta-total">Total' + (nProd > 1 ? ' del contrato' : '') + ': US$ ' +
      total.toLocaleString('es-AR', { maximumFractionDigits: 2 }) +
      ' · comisión estimada US$ ' +
      (total * 0.02).toLocaleString('es-AR', { maximumFractionDigits: 2 }) + '</p>' : '') +
    '<div class="alta-acc">' +
      '<button class="primario" data-act="altaguardar"' +
        (faltan.length || fuera.length || S.creando ? ' disabled' : '') + '>' +
        (S.creando ? 'Creando…' : ico('check') + 'Crear contrato') + '</button>' +
      '<span class="ayuda">' +
        (repe
          ? 'Ese número ya existe: revisá que sea a propósito'
          : fuera.length
          ? 'Hay que agregar a la base de datos: ' + fuera.join(', ')
          : faltan.length
            ? 'Falta completar: ' + faltan.join(', ')
            : 'Se inserta en "' + esc(S.cfg.tabAlta || '—') + '", arriba de la fila TOTAL') +
      '</span>' +
    '</div></div>';
}

function filaContrato(r) {
  var pctTxt = r.pct !== null ? Math.round(r.pct * 100) + '%' : '';
  var estado, cls;
  if (r.contratado === null || r.contratado === undefined) {
    estado = 'sin toneladas en el contrato'; cls = 'hueco';
  } else if (r.saldo > 0.5) {
    estado = 'faltan ' + r.saldo.toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn';
    cls = 'sol';
  } else if (r.saldo < -0.5) {
    estado = 'excedido en ' + (-r.saldo).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn';
    cls = 'nar';
  } else {
    estado = 'completo'; cls = 'ok';
  }

  var barra = r.pct !== null
    ? '<div class="barra"><i style="width:' + Math.round(r.pct * 100) + '%" class="' +
      (r.saldo < -0.5 ? 'exc' : r.saldo <= 0.5 ? 'full' : '') + '"></i></div>' : '';

  var editable = S.ctrEditables.has(r.contrato);
  var ctr = S.contratos.get(r.contrato);
  var viaPill = r.via
    ? '<span class="pill via-' + r.via + '"' +
      (r.viaDeducida ? ' title="No está cargado en la planilla: se deduce de sus embarques"' : '') +
      '>' + (r.via === 'maritimo' ? '🚢' : '🚚') + ' ' + VIA_TXT[r.via] +
      (r.viaDeducida ? '<span class="deduc">?</span>' : '') + '</span>'
    : '<span class="pill hueco" title="Falta cargar si es marítimo o terrestre">' +
      '<span class="pt"></span>Vía sin definir</span>';
  var partes = (ctr && ctr.partes > 1)
    ? '<span class="pill gris" title="El mismo número en ' + ctr.partes +
      ' filas, con productos distintos"><span class="pt"></span>' + ctr.partes +
      ' filas</span>'
    : '';
  var firmas = (ctr && ctr.tieneFirmas)
    ? (function () {
        if (ctr.firmaExp && ctr.firmaImp) {
          return '<span class="pill ok"><span class="pt"></span>Firmado por los dos</span>';
        }
        if (!ctr.firmaExp && !ctr.firmaImp) {
          return '<span class="pill pend"><span class="pt"></span>Sin firmar</span>';
        }
        return '<span class="pill nar"><span class="pt"></span>Falta ' +
          (ctr.firmaExp ? 'el importador' : 'el exportador') + '</span>';
      })()
    : '';
  return '<article class="emb ctr-fila' + (editable ? ' editable' : '') + '"' +
    (editable ? ' data-act="ctrabrir" data-k="' + esc(r.contrato) + '" tabindex="0"' : '') + '>' +
    '<div class="fila-top" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1.3fr) minmax(0,1fr)">' +
      '<div>' +
        '<div class="partes"><div class="via-partes">' +
          (r.exportador
            ? '<div class="parte"><span class="exp">' + esc(r.exportador) + '</span>' +
              (function () { var f = bandera(paisDeEmpresa(r.exportador));
                return f ? '<span class="rot-pais">' + f + '</span>' : ''; })() +
              '</div><span class="fl">→</span>' : '') +
          '<div class="parte"><span class="imp">' + esc(r.importador || 'Sin cliente') + '</span>' +
            (function () { var f = bandera(paisDeEmpresa(r.importador));
              return f ? '<span class="rot-pais">' + f + '</span>' : ''; })() +
          '</div>' +
        '</div></div>' +
        '<div class="ctr-cod">' + esc(r.contrato) + '</div>' +
        (function () {
          var ref = S.ctrEditables.get(r.contrato);
          if (ref) return '<div class="orig">' + esc(ref.tab) + ' · fila ' + ref.fila +
            ' <span class="ed">editar</span></div>';
          return r.origen ? '<div class="orig">' + esc(r.origen) + ' · solo lectura</div>' : '';
        })() +
        (r.huerfano ? '<div class="orig">No figura en las pestañas de contratos</div>' : '') +
      '</div>' +
      '<div>' + barra +
        '<div class="tns-linea">' +
          '<span>' + (r.entregado || 0).toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn entregadas</span>' +
          (r.contratado ? '<span class="de"> de ' +
            r.contratado.toLocaleString('es-AR', { maximumFractionDigits: 1 }) + ' tn' +
            (pctTxt ? ' · ' + pctTxt : '') + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="estados">' +
        '<span class="pill ' + cls + '"><span class="pt"></span>' + estado + '</span>' +
        (r.embarques.length
          ? '<span class="pill gris"><span class="pt"></span>' + r.embarques.length +
            (r.embarques.length === 1 ? ' embarque activo' : ' embarques activos') + '</span>' : '') +
        (r.aFacturar
          ? '<span class="pill ok"><span class="pt"></span>' + r.aFacturar + ' a facturar</span>' : '') +
        viaPill +
        partes +
        firmas +
      '</div>' +
    '</div>' +
    (function () {
      var items = [];
      if (r.periodo) items.push(['Período de embarque', String(r.periodo)]);
      if (r.cond && !r.cond.desconocida) items.push(['Condición de pago', r.cond.texto]);
      // Si la planilla trae su propio saldo y no coincide con el calculado,
      // conviene verlo: alguno de los dos está mirando algo que el otro no.
      if (r.fuenteSaldo === 'planilla' && r.entregadoActivo > (r.entregado || 0) + 0.5) {
        items.push(['Atención',
          'las pestañas activas suman ' +
          r.entregadoActivo.toLocaleString('es-AR', { maximumFractionDigits: 1 }) +
          ' tn, más de lo que dice la columna de entregado']);
      }
      if (!items.length) return '';
      return '<div class="refs ctr-refs">' + items.map(function (i) {
        return '<span class="ref"><em>' + esc(i[0]) + '</em>' +
          '<b class="txt">' + esc(i[1]) + '</b></span>';
      }).join('') + '</div>';
    })() +
    '</article>';
}

// Vista planilla: para quien está acostumbrado a mirar el Sheets y quiere
// encontrar lo mismo donde lo espera. Ancho completo, grilla, números de fila
// reales, colores de siempre, y filtro y orden en cada columna.

var COLS_PLANILLA = ['exporter', 'importer', 'contract', 'product', 'tipo', 'price', 'tns',
  'total', 'etd', 'eta', 'port', 'vessel', 'shippingLine', 'lots', 'containers',
  'bl', 'booking', 'invoice', 'docs', 'pics', 'tr', 'tracking', 'pagoEstimado',
  'commission', 'guia', 'incoterm', 'status'];

function columnasDisponibles() {
  return COLS_PLANILLA.filter(function (c) {
    return S.fuentes.some(function (f) { return f.mapa[c] !== undefined; });
  });
}

function vistaPlanilla(filas) {
  var todas = columnasDisponibles();
  var cols = todas.filter(function (c) { return !S.colsOcultas[c]; });
  var ocultas = todas.length - cols.length;

  var barra = '<div class="hoja-barra">' +
    '<button data-act="cols" aria-pressed="' + S.colsPanel + '">' + ico('cols') + 'Columnas' +
      (ocultas ? ' · ' + ocultas + ' ocultas' : '') + '</button>' +
    (Object.keys(S.fCol).some(function (k) { return S.fCol[k]; }) || S.ordenCol
      ? '<button data-act="limpiarcol">Quitar filtros de columna</button>' : '') +
    '<span class="ayuda" style="margin-left:auto">' + filas.length + ' filas</span>' +
    '</div>';

  if (S.colsPanel) {
    barra += '<div class="cols-panel">' +
      todas.map(function (c) {
        return '<label class="chk"><input type="checkbox" data-col="' + c + '"' +
          (S.colsOcultas[c] ? '' : ' checked') + '><span>' + CAMPOS[c].label + '</span></label>';
      }).join('') +
      '<div class="cols-acc">' +
        '<button data-act="colstodas">Mostrar todas</button>' +
        '<button data-act="colsminimas">Solo lo esencial</button>' +
      '</div></div>';
  }

  function encabezado(c) {
    var act = S.ordenCol && S.ordenCol.campo === c;
    var flecha = act ? (S.ordenCol.dir === 1 ? ' ↑' : ' ↓') : '';
    return '<th><div class="th-in">' +
      '<button class="th-ord" data-act="ordcol" data-c="' + c + '" title="Ordenar">' +
        CAMPOS[c].label + flecha + '</button>' +
      '<button class="th-x" data-act="ocultar" data-c="' + c + '" title="Ocultar columna">×</button>' +
      '</div></th>';
  }

  function filtroCol(c) {
    if (SEMAFOROS.indexOf(c) >= 0) {
      return '<th class="fth"><select data-fcol="' + c + '">' +
        ['', 'ok', 'pendiente', 'atencion', 'vacio'].map(function (o) {
          return '<option value="' + (o ? etiqueta(c, o) : '') + '"' +
            (S.fCol[c] === (o ? etiqueta(c, o) : '') ? ' selected' : '') + '>' +
            (o ? etiqueta(c, o) : '—') + '</option>';
        }).join('') + '</select></th>';
    }
    return '<th class="fth"><input data-fcol="' + c + '" value="' +
      esc(S.fCol[c] || '') + '" placeholder="filtrar"></th>';
  }

  var enc = '<tr><th class="nrofila">#</th>' + cols.map(encabezado).join('') + '</tr>' +
            '<tr><th class="nrofila fth"></th>' + cols.map(filtroCol).join('') + '</tr>';

  var cuerpo = filas.map(function (x) {
    var emb = x.emb, src = x.src;
    return '<tr' + (emb._id === S.sel ? ' class="sel"' : '') +
      ' data-act="abrir" data-f="' + esc(emb._id) + '">' +
      '<td class="nrofila" title="' + esc(emb._tab) +
        (adviceDe(emb) ? ' · advice enviado' : '') + '">' + emb._fila +
        (adviceDe(emb) ? '<i class="pt-adv"></i>' : '') + '</td>' +
      cols.map(function (c) {
        if (src.mapa[c] === undefined) return '<td class="na"></td>';
        if (SEMAFOROS.indexOf(c) >= 0) {
          if (src.noAplica[c]) return '<td class="na"></td>';
          var est = emb[c] || 'vacio';
          var txt = (emb._notas && emb._notas[c]) || '';
          return '<td class="cel-' + est + '" title="' + esc(etiqueta(c, est)) +
            (txt ? ' — ' + esc(txt) : '') + '">' + esc(txt) + '</td>';
        }
        var v = emb[c];
        var cls = (c === 'tns' || c === 'price' || c === 'total' || c === 'commission')
          ? ' class="num"' : '';
        if (c === 'pagoEstimado' && emb._faltaComprobante) {
          return '<td class="cel-naranja" title="Falta el comprobante de pago">' +
            pintarCelda(v) + '</td>';
        }
        return '<td' + cls + '>' + pintarCelda(v) + '</td>';
      }).join('') + '</tr>';
  }).join('');

  return '<div class="full">' + barra +
    '<div class="hoja"><table class="tbl-hoja"><thead>' + enc +
    '</thead><tbody>' + cuerpo + '</tbody></table></div>' +
    '<p class="ayuda" style="margin-top:9px">Los colores son los mismos de la planilla. ' +
    'El número de la izquierda es la fila real. Clic en el nombre de una columna ordena, ' +
    'la × la oculta, y la fila de abajo filtra. Clic en una fila abre el detalle.</p>' +
    '</div>';
}

var EDITABLES = ['vessel', 'shippingLine', 'booking', 'containers', 'bl', 'invoice', 'tracking', 'nota'];

// Las toneladas y el precio se editan aparte: son números, y tocarlos mueve el
// total. Pasa seguido: llega la factura y el peso neto no es el que se cargó.
var EDITABLES_NUM = ['tns', 'price'];

// Desplegable con los estados a la vista. Antes había que ir clickeando hasta
// dar con el que se buscaba, que con cuatro opciones es incómodo y propenso a
// pasarse de largo (y cada clic escribe en la planilla).
function selectorEstado(emb, campo) {
  var actual = emb[campo] || 'vacio';
  var abierto = S.menuSem && S.menuSem.id === emb._id && S.menuSem.campo === campo;

  var menu = '';
  if (abierto) {
    menu = '<div class="menu-est" role="listbox">' +
      CICLO.map(function (op) {
        return '<button role="option" aria-selected="' + (op === actual) + '" ' +
          'data-act="setsem" data-f="' + esc(emb._id) + '" data-c="' + campo + '" ' +
          'data-v="' + op + '">' +
          '<span class="punto p-' + op + '"></span>' +
          '<span>' + etiqueta(campo, op) + '</span>' +
          (op === actual ? '<span class="tick">✓</span>' : '') +
          '</button>';
      }).join('') + '</div>';
  }

  return '<div class="sem-wrap">' +
    '<button class="sembtn" data-e="' + actual + '" data-act="menusem" ' +
      'data-f="' + esc(emb._id) + '" data-c="' + campo + '" ' +
      'aria-haspopup="listbox" aria-expanded="' + !!abierto + '">' +
      '<span class="et">' + CAMPOS[campo].label + '</span>' +
      '<span class="vl">' + etiqueta(campo, actual) + '<span class="cv">▾</span></span>' +
    '</button>' + menu + '</div>';
}

function vistaPanel(x) {
  var emb = x.emb, ev = x.ev, src = x.src, cond = x.contrato ? x.contrato.cond : null;
  var falta = {};
  ev.alertas.forEach(function (a) {
    if (a.campos) a.campos.forEach(function (c) { falta[c] = 1; });
  });

  // Cabecera fija: aclara que esto es una edición, sobre qué embarque, y que
  // lo que se toca se escribe en la planilla.
  var an = S.animarPanel ? ' anim' : '';
  var h = '<div class="velo' + an + '" data-act="cerrar"></div>' +
    '<aside class="panel panel-edit' + an + '" role="dialog" aria-label="Editar embarque ' +
      esc(emb.contract) + '">' +

    '<header class="pe-top">' +
      '<div class="pe-tit">' +
        '<span class="pe-chip">' + ico('lapiz') + 'Editando</span>' +
        '<span class="pe-donde">' + esc(nombreCorto(emb._tab)) + ' · fila ' + emb._fila + '</span>' +
      '</div>' +
      '<div class="pe-acc">' +
        (S.guardando > 0
          ? '<span class="pe-estado guardando">Guardando…</span>'
          : (S.guardadoOk ? '<span class="pe-estado ok">' + ico('check') + 'Guardado</span>' : '')) +
        botonFacturar(emb) +
        '<button class="cerrar" data-act="cerrar">' + ico('x') + 'Cerrar</button>' +
      '</div>' +
    '</header>' +

    '<div class="pe-quien">' +
      '<h2>' + esc(emb.importer || emb.exporter || 'Sin cargar') +
        (bandera(paisDeEmpresa(emb.importer)) ? ' ' + bandera(paisDeEmpresa(emb.importer)) : '') +
      '</h2>' +
      (emb.exporter && emb.importer
        ? '<p class="pe-desde">desde <b>' + esc(emb.exporter) + '</b> ' +
          bandera(paisDeEmpresa(emb.exporter)) + '</p>'
        : '') +
      '<p class="pe-ref">' + esc(emb.contract || 'Sin contrato') + '</p>' +
    '</div>' +

    '<div class="pe-etapa">' + pasosEtapa(ev.etapa) + '</div>' +
    '<p class="pe-aviso">' + ico('check') + 'Cada cambio se guarda solo en la planilla.</p>';

  // Pasar a "A facturar": la mudanza que hoy se hace a mano.
  if ((S.fuentesFact || []).length && !emb._aFacturar) {
    var destinoNom = S.fuentesFact[0].tab;
    h += '<div class="bloque"><h3 class="gt">Pasar a ' + esc(destinoNom) + '</h3>';

    if (S.factError) h += '<div class="error">' + esc(S.factError) + '</div>';

    if (S.pasar === emb._id) {
      var r0 = resumenMudanza(emb);
      h += '<div class="confirmar">' +
        '<p class="cf-tit">' + ico('mover') + 'Se va a mover esta fila</p>' +
        '<dl class="cf-datos">' +
          '<div><dt>Qué</dt><dd>' + esc(r0.quien) + '</dd></div>' +
          '<div><dt>Contrato</dt><dd>' + esc(r0.contrato || '—') + '</dd></div>' +
          (r0.bl ? '<div><dt>BL</dt><dd>' + esc(r0.bl) + '</dd></div>' : '') +
          '<div><dt>Toneladas</dt><dd>' + (r0.tns ? fmtNum(r0.tns) : '—') + '</dd></div>' +
          (r0.total ? '<div><dt>Total</dt><dd>USD ' + fmtNum(r0.total) + '</dd></div>' : '') +
          '<div><dt>De</dt><dd>' + esc(r0.desde) + ', fila ' + r0.fila + '</dd></div>' +
          '<div><dt>A</dt><dd>' + esc(destinoNom) + ', arriba del TOTAL</dd></div>' +
        '</dl>' +
        '<p class="cf-ojo">La fila se borra de «' + esc(r0.desde) + '». No se puede deshacer ' +
          'desde acá: si algo sale mal, se recupera con el historial de versiones de Sheets.</p>' +

        '<label class="chk entiendo"><input type="checkbox" data-entiendo="1"' +
          (S.entiendo ? ' checked' : '') + '>' +
          '<span>Entiendo que la fila se borra de «' + esc(r0.desde) + '»</span></label>' +

        '<label class="chk"><input type="checkbox" data-avisar="1"' +
          (S.avisarPia !== false ? ' checked' : '') + '>' +
          '<span>Avisar a ' + esc(AVISO_FACTURAR) + '</span></label>' +
        (S.avisarPia !== false
          ? '<div class="modos" style="margin:8px 0 0">' +
            '<button data-act="avmodo" data-v="0" aria-pressed="' + (!S.enviarPia) + '">' +
              'Dejar borrador</button>' +
            '<button data-act="avmodo" data-v="1" aria-pressed="' + (!!S.enviarPia) + '">' +
              'Enviar ahora</button></div>'
          : '') +

        '<div class="alta-acc">' +
          '<button class="primario peligro" data-act="pasarok" data-f="' + esc(emb._id) + '"' +
            (S.pasando || !S.entiendo ? ' disabled' : '') + '>' +
            (S.pasando ? 'Moviendo…' : ico('mover') + 'Sí, enviarla a facturar') + '</button>' +
          '<button data-act="pasarno">Cancelar</button>' +
        '</div></div>';
    } else {
      h += '<button data-act="pasar" data-f="' + esc(emb._id) + '">' +
        ico('mover') + 'Pasar a ' + esc(destinoNom) + '</button>' +
        '<p class="ayuda">Mueve la fila arriba del TOTAL y la saca de «' +
        esc(emb._tab) + '», como el cortar y pegar de siempre.</p>';
    }
    h += '</div>';
  }


  // Lo que hay que hacer, arriba de todo.
  if (ev.alertas.length) {
    h += '<div class="bloque"><h3 class="gt">Pendientes · ' + ev.alertas.length + '</h3>';
    ev.alertas.forEach(function (a) {
      h += '<div class="aviso-fila ' + a.nivel + '" style="margin-bottom:8px">' +
        '<p class="tit">' + esc(a.titulo) + '</p>' +
        '<p class="det">' + esc(a.detalle) + '</p></div>';
    });
    h += '</div>';
  }

  // Ficha: los datos que se miran, no se editan.
  h += '<div class="bloque"><h3 class="gt">Embarque</h3><dl style="margin:0">' +
    kv('Exportador', emb.exporter) +
    kv('Producto', emb.product) +
    kv('Tipo', emb.tipo) +
    kv('Toneladas', emb.tns !== null && emb.tns !== '' ? Number(emb.tns).toLocaleString('es-AR') : '') +
    kv('Destino', emb.port) +
    kv('ETD', esFecha(emb.etd) ? fmtFecha(emb.etd) : '') +
    kv('ETA', esFecha(emb.eta) ? fmtFecha(emb.eta) : '') +
    kv('Buque', emb.vessel) +
    kv('Naviera', emb.shippingLine) +
    '</dl></div>';

  // Referencias, en mono para poder copiarlas de un vistazo.
  var refs = [['invoice', 'Factura'], ['bl', 'BL'], ['booking', 'Booking'],
              ['containers', 'Contenedores'], ['lots', 'Lotes'], ['tracking', 'Tracking']]
    .filter(function (r) { return src.mapa[r[0]] !== undefined && !src.noAplica[r[0]]; });
  if (refs.length) {
    h += '<div class="bloque"><h3 class="gt">Referencias</h3><dl style="margin:0">' +
      refs.map(function (r) {
        var v = emb[r[0]];
        return '<div class="kv"><dt>' + r[1] + '</dt><dd>' +
          (v ? '<span style="font-family:var(--mono);font-size:12px">' + esc(v) + '</span>'
             : '<span style="color:var(--tinta3);font-style:italic">falta</span>') +
          '</dd></div>';
      }).join('') + '</dl></div>';
  }

  // Estados: botón grande con la palabra, no un cuadradito de color.
  var sems = SEMAFOROS.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (sems.length) {
    h += '<div class="bloque"><h3 class="gt">Estado</h3><div class="sems">' +
      sems.map(function (c) { return selectorEstado(emb, c); }).join('') + '</div>' +
      '<p class="ayuda">Se pinta igual en la planilla.</p>';
    if (emb.trModo) {
      h += '<p class="ayuda" style="margin-top:8px">Modalidad de liberación: <b>' +
        esc(emb.trModo) + '</b></p>';
    }
    // El texto de estas columnas son anotaciones operativas, no adorno.
    sems.forEach(function (c) {
      h += '<div class="campo" style="margin-top:12px">' +
        '<label for="n-' + c + '">Anotación en ' + CAMPOS[c].label + '</label>' +
        '<input id="n-' + c + '" data-nota="' + c + '" data-f="' + esc(emb._id) + '" ' +
        'placeholder="Ej: recibir factura y enviar gas free cuando recibamos" value="' +
        esc((emb._notas && emb._notas[c]) || '') + '"></div>';
    });
    h += '</div>';
  }

  // Cobro.
  h += '<div class="bloque"><h3 class="gt">Cobro</h3>';
  if (!x.contrato) {
    h += '<p class="det">El contrato no aparece en las pestañas de contratos elegidas, ' +
      'así que no hay condición de pago ni alertas de cobro.</p>';
  } else if (cond.desconocida) {
    h += '<p class="det">Condición sin mapear: <em>' + esc(cond.texto || 'vacía en el contrato') +
      '</em>. Las alertas de cobro quedan apagadas para este embarque.</p>';
  } else {
    h += '<p style="margin:0 0 8px;font-size:13px">' + esc(cond.texto) + '</p>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="pill gris"><span class="pt"></span>' +
        esc(String(cond.momento).replace(/_/g, ' ')) + '</span>' +
      '<span class="pill gris"><span class="pt"></span>' + esc(cond.medio) + '</span>' +
      '<span class="pill ' + (LIBERACION[cond.lib].antes ? 'sol' : 'ok') + '">' +
        '<span class="pt"></span>' + LIBERACION[cond.lib].label + '</span>' +
      (cond.revisar ? '<span class="pill nar"><span class="pt"></span>revisar mapeo</span>' : '') +
      '</div><dl style="margin:0">' +
      kv('Cobro esperado', ev.cobro ? fmtFecha(ev.cobro) : 'no estimable') +
      kv('Comisión', emb.commission ? 'US$ ' + Number(emb.commission).toLocaleString('es-AR') : '') +
      '</dl>';
  }

  if (src.mapa[COL_COMPROBANTE] !== undefined) {
    h += '<label class="chk" style="margin-top:10px">' +
      '<input type="checkbox" data-cbte="' + esc(emb._id) + '"' +
      (emb._faltaComprobante ? ' checked' : '') + '>' +
      '<span>Falta que manden el comprobante</span></label>';
  }
  h += '</div>';

  h += bloqueAdvice(emb, ev);

  // Comentarios: lo que el equipo se dice sobre este embarque.
  var cs = comentariosDe(emb);
  h += '<div class="bloque"><h3 class="gt">Comentarios' +
    (cs.length ? ' <span>' + cs.length + '</span>' : '') + '</h3>';

  if (cs.length) {
    h += '<div class="hilo">' + cs.map(function (c) {
      return '<div class="com">' +
        '<div class="com-cab"><span class="com-autor">' + esc(nombreCortoAutor(c.autor)) + '</span>' +
        '<span class="com-fecha">' + esc(c.fecha) + '</span></div>' +
        '<p class="com-txt">' + esc(c.texto) + '</p>' +
        (c.sobre ? '<p class="com-sobre">sobre: ' + esc(c.sobre) + '</p>' : '') +
        '</div>';
    }).join('') + '</div>';
  } else {
    h += '<p class="ayuda" style="margin:0 0 10px">Todavía no hay comentarios.</p>';
  }

  h += '<textarea id="nuevo-com" data-com="' + esc(emb._id) + '" rows="2" ' +
    'placeholder="Escribí un comentario para el equipo…">' + esc(S.borrador || '') + '</textarea>' +
    '<div class="com-acc">' +
      '<button class="primario" data-act="comentar" data-f="' + esc(emb._id) + '"' +
        (S.enviando ? ' disabled' : '') + '>' +
        (S.enviando ? 'Guardando…' : ico('send') + 'Comentar') + '</button>' +
      '<span class="ayuda">' +
        (S.usuario ? 'Como ' + esc(nombreCortoAutor(S.usuario.email)) : 'Sin identificar') +
      '</span>' +
    '</div></div>';

  // Fechas: input nativo, que además valida solo y evita el 28/09 sin año.
  var fechas = ['etd', 'eta', 'pagoEstimado'].filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (fechas.length) {
    h += '<div class="bloque"><h3 class="gt">Fechas</h3><div class="fechas">' +
      fechas.map(function (c) {
        var v = emb[c];
        var iso = esFecha(v)
          ? v.getUTCFullYear() + '-' +
            String(v.getUTCMonth() + 1).padStart(2, '0') + '-' +
            String(v.getUTCDate()).padStart(2, '0')
          : '';
        var etq = CAMPOS[c].label +
          (v && v.anioAsumido ? ' <span class="av">año asumido</span>' : '') +
          (v && v.invalida ? ' <span class="mal">dato inválido: ' + esc(v.crudo) + '</span>' : '');
        return campoFecha('d-' + c, 'data-fecha', c, etq, v,
          '<input type="hidden" data-duenio="' + esc(emb._id) + '">');
      }).join('') + '</div>';

    if (esFecha(emb.etd) && esFecha(emb.eta)) {
      var tt = Math.round((emb.eta - emb.etd) / 86400000);
      h += '<p class="ayuda">Tránsito: ' + tt + ' días' +
        (tt < 0 ? ' — la ETA quedó antes del ETD' : '') + '.</p>';
    }
    h += '</div>';
  }

  // Toneladas y precio. El total de la planilla es una fórmula, así que se
  // recalcula solo al cambiar cualquiera de los dos: acá solo se muestra.
  var nums = EDITABLES_NUM.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (nums.length) {
    var tnsA = normNum(emb.tns), preA = normNum(emb.price);
    var totalA = (tnsA && preA) ? tnsA * preA : normNum(emb.total);

    h += '<div class="bloque"><h3 class="gt">Cantidad y precio</h3>' +
      '<div class="fechas">' +
      nums.map(function (c) {
        return '<div class="campo"><label for="n-' + c + '">' + CAMPOS[c].label + '</label>' +
          '<input id="n-' + c + '" type="number" step="any" data-num="' + c + '" ' +
          'data-f="' + esc(emb._id) + '" value="' +
          esc(emb[c] === null || emb[c] === undefined ? '' : emb[c]) + '"></div>';
      }).join('') + '</div>' +
      (totalA
        ? '<p class="total-calc">Total: <b>' + fmtNum(totalA) + '</b>' +
          (tnsA && preA ? ' <span>= ' + fmtNum(tnsA) + ' tn × ' + fmtNum(preA) + '</span>' : '') +
          '</p>'
        : '') +
      '<p class="ayuda">Si la factura vino con otro peso neto, cambiá las toneladas: ' +
      'el total de la planilla se recalcula solo, porque es una fórmula.</p>' +
      '</div>';
  }

  // Campos editables.
  var eds = EDITABLES.filter(function (c) {
    return src.mapa[c] !== undefined && !src.noAplica[c];
  });
  if (eds.length) {
    h += '<div class="bloque"><h3 class="gt">Datos</h3>';
    eds.forEach(function (c) {
      var v = emb[c];
      h += '<div class="campo' + (falta[c] ? ' falta' : '') + '">' +
        '<label for="e-' + c + '">' + CAMPOS[c].label +
        (falta[c] ? ' <span style="color:var(--pend)">· falta</span>' : '') + '</label>' +
        '<input id="e-' + c + '" data-edit="' + c + '" data-f="' + esc(emb._id) + '" value="' +
        esc(v instanceof Date ? fmtFecha(v) : (v || '')) + '"></div>';
    });
    h += '</div>';
  }

  return h + '</aside>';
}

function kv(k, v) {
  if (v === null || v === undefined || v === '') return '';
  return '<div class="kv"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>';
}

async function guardarAlta() {
  var a = S.alta || {};
  var prods = productosAlta(a);
  var faltan = ['contrato', 'exportador', 'importador'].filter(function (k) { return !a[k]; });
  if (!a.via) faltan.unshift('marítimo o terrestre');
  prods.forEach(function (p, i) {
    ['producto', 'tipo', 'toneladas', 'precio'].forEach(function (c) {
      if (!p[c]) faltan.push(c + (prods.length > 1 ? ' ' + (i + 1) : ''));
    });
  });
  if (faltan.length) {
    S.altaError = 'Falta completar: ' + faltan.join(', ');
    return pintar();
  }

  // La fecha llega como DD/MM/AAAA.
  // Se manda como número de serie: la columna ya tiene formato de fecha y
  // así no depende del idioma de la planilla para interpretarla.
  var fechaD = normFecha(a.fecha);
  var fechaVal = esFecha(fechaD) ? Math.floor((fechaD - EPOCH) / DIA) : (a.fecha || '');

  S.creando = true; S.altaError = null; pintar();
  var hechas = [];
  try {
    // Una fila por producto, con el mismo número. Se insertan de a una arriba
    // del TOTAL, así quedan juntas y en el orden en que se cargaron.
    for (var i = 0; i < prods.length; i++) {
      var p = prods[i];
      var fila = await crearContrato({
        fecha: fechaVal,
        contrato: String(a.contrato).trim(),
        exportador: a.exportador, importador: a.importador,
        producto: p.producto, tipo: p.tipo,
        toneladas: parseFloat(p.toneladas), precio: parseFloat(p.precio),
        packaging: p.packaging || '', incoterm: a.incoterm || '',
        formaPago: a.formaPago || '', periodo: a.periodo || '',
        via: VIA_TXT[a.via] || ''
      });
      hechas.push(fila);
    }
    S.alta = null;
    S.avisoOk = 'Contrato ' + a.contrato + ' creado' +
      (hechas.length > 1
        ? ' en ' + hechas.length + ' filas, una por producto (' + hechas.join(', ') + ').'
        : ' en la fila ' + hechas[0] + '.');
    await cargarTodo();
  } catch (e) {
    S.altaError = e.message + (hechas && hechas.length
      ? ' Ojo: ya se cargaron ' + hechas.length + ' fila(s) (' + hechas.join(', ') +
        '); revisalas en la planilla antes de reintentar.'
      : '');
  } finally {
    S.creando = false; pintar();
  }
}

// Exporta lo que se está viendo, con los filtros aplicados. Con BOM y punto y
// coma para que Excel en español lo abra bien de una.
function exportarCSV() {
  var filas, nombre;

  if (S.vista === 'contratos') {
    nombre = 'contratos';
    var lc = calcularContratos();
    filas = [['Contrato', 'Exportador', 'Importador', 'Contratado (tn)',
              'Embarcado (tn)', 'Saldo (tn)', 'Embarques', 'Condicion de pago']];
    lc.filter(function (r) { return r.embarques.length || r.saldo > 0.5; })
      .forEach(function (r) {
        filas.push([r.contrato, r.exportador, r.importador, r.contratado,
                    r.entregado, r.saldo, r.embarques.length,
                    r.cond ? r.cond.texto : '']);
      });
  } else {
    nombre = 'embarques';
    var evs = evaluarTodo();
    var vis = S.vista === 'control'
      ? evs.filter(function (x) {
          return x.ev.alertas.length &&
            (!S.filtroNivel || S.filtroNivel === x.ev.nivelMax);
        })
      : ordenar(aplicarFiltros(evs), S.orden);

    var enc = ['Pestaña', 'Exportador', 'Importador', 'Contrato', 'Producto', 'Tns',
               'ETD', 'ETA', 'Destino', 'Buque', 'Factura', 'BL', 'Booking',
               'Etapa', 'Docs', 'Fotos', 'T.R.', 'Anotación Docs',
               'Falta comprobante', 'A facturar', 'Pendientes'];
    filas = [enc];
    vis.forEach(function (x) {
      var e = x.emb;
      filas.push([
        e._tab, e.exporter, e.importer, e.contract, e.product, e.tns,
        esFecha(e.etd) ? fmtFecha(e.etd) : '', esFecha(e.eta) ? fmtFecha(e.eta) : '',
        e.port, e.vessel, e.invoice, e.bl, e.booking,
        (ETAPAS.filter(function (t) { return t.id === x.ev.etapa; })[0] || {}).label || '',
        etiqueta('docs', e.docs), etiqueta('pics', e.pics), etiqueta('tr', e.tr),
        (e._notas && e._notas.docs) || '',
        e._faltaComprobante ? 'si' : '', e._aFacturar ? 'si' : '',
        x.ev.alertas.map(function (a) { return a.titulo; }).join(' | ')
      ]);
    });
  }

  var csv = filas.map(function (f) {
    return f.map(function (v) {
      if (v === null || v === undefined) return '';
      var t = String(v);
      return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }).join(';');
  }).join('\r\n');

  var hoy = new Date().toISOString().slice(0, 10);
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = nombre + '-' + hoy + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function pintar() {
  var foco = document.activeElement;
  var id = foco && foco.id, pos = null;
  try { pos = foco && foco.selectionStart; } catch (e) {}

  // Redibujar reemplaza todo el HTML, así que el navegador pierde el scroll.
  // Lo guardamos y lo devolvemos: si no, cada vez que se cambia un estado la
  // pantalla salta al principio.
  var scrollPag = window.scrollY || window.pageYOffset || 0;
  var scrolls = {};
  ['.hoja', '.panel', '.marco'].forEach(function (sel) {
    var el = document.querySelector(sel);
    if (el) scrolls[sel] = { top: el.scrollTop, left: el.scrollLeft };
  });

  var html;
  try {
    html = S.pantalla === 'app' ? vistaApp() : vistaSetup();
  } catch (e) {
    html = '<div class="setup"><div class="error"><b>Error al dibujar la pantalla</b><br>' +
      esc(e.message) + '</div>' +
      '<div class="caja"><button data-act="reset-cid">Empezar de nuevo</button></div></div>';
    if (window.console) console.error(e);
  }

  document.getElementById('root').innerHTML = html;
  S.animarPanel = false;   // la entrada se anima una sola vez
  // Aire extra abajo cuando la barra flotante está visible.
  try {
    var hayBarra = !!(S.marcados && Object.keys(S.marcados).some(function (k) { return S.marcados[k]; }));
    document.body.classList[hayBarra ? 'add' : 'remove']('con-barra');
  } catch (e) {}

  Object.keys(scrolls).forEach(function (sel) {
    var el = document.querySelector(sel);
    if (el) { el.scrollTop = scrolls[sel].top; el.scrollLeft = scrolls[sel].left; }
  });
  if (scrollPag) window.scrollTo(0, scrollPag);

  if (id) {
    var nuevo = document.getElementById(id);
    if (nuevo) {
      nuevo.focus();
      try { nuevo.setSelectionRange(pos, pos); } catch (e2) {}
    }
  }
}

document.addEventListener('focusin', function (e) {
  // Fechas: se formatean en el propio input, sin redibujar, para no perder el
  // foco justo cuando se está escribiendo el año.
  if (e.target.classList && e.target.classList.contains('f-txt')) {
    var borrando = e.inputType === 'deleteContentBackward' ||
                   e.inputType === 'deleteContentForward';
    var antes = e.target.value;
    var fmt = formatearFecha(antes, borrando);
    if (fmt !== antes) {
      var fin = e.target.selectionStart === antes.length;
      e.target.value = fmt;
      if (fin) { try { e.target.setSelectionRange(fmt.length, fmt.length); } catch (er) {} }
    }
    var nat = document.getElementById(e.target.id + '-cal');
    if (nat) nat.value = aISO(fmt);

    var cF = e.target.getAttribute('data-aemb');
    if (cF && S.altaEmb) { S.altaEmb[cF] = fmt; return; }
    var cA = e.target.getAttribute('data-alta');
    if (cA) { S.alta = S.alta || {}; S.alta[cA] = fmt; return; }
    var cG = e.target.getAttribute('data-gen');
    if (cG && S.gen) { S.gen[cG] = fmt; return; }
    var cE = e.target.getAttribute('data-ectr');
    if (cE && S.editCtr) { S.editCtr.cambios[cE] = fmt; return; }
    return;   // el panel guarda al salir del campo, no en cada tecla
  }

  var ae = e.target.getAttribute && e.target.getAttribute('data-aemb');
  if (ae && S.altaEmb) { S.altaEmb[ae] = e.target.value; return; }
  var gp = e.target.getAttribute && e.target.getAttribute('data-gen');
  if (gp && S.gen && !e.target.classList.contains('f-txt')) {
    ponerRuta(S.gen, gp, e.target.value);
    if (gp.indexOf('productos.') === 0) refrescarTotalesGen();
    return;
  }
  var pc = e.target.getAttribute && e.target.getAttribute('data-prodctr');
  if (pc && S.editCtr) { S.editCtr.cambios['prod_' + pc] = e.target.value; refrescarBarraCtr(); return; }
  var ec = e.target.getAttribute && e.target.getAttribute('data-ectr');
  if (ec && S.editCtr) { S.editCtr.cambios[ec] = e.target.value; refrescarBarraCtr(); return; }
  var cb2 = e.target.getAttribute && e.target.getAttribute('data-combo2');
  if (cb2) {
    var p2 = cb2.split(':'), ctx2 = p2[0], campo2 = p2[1];
    if (ctx2 === 'ctr' && S.editCtr) S.editCtr.cambios[campo2] = e.target.value;
    else if (ctx2 === 'gen' && S.gen) ponerRuta(S.gen, campo2, e.target.value);
    else if (ctx2 === 'emb' && S.altaEmb) S.altaEmb[campo2] = e.target.value;
    else { S.alta = S.alta || {}; S.alta[campo2] = e.target.value; }
    S.combo = cb2;
    // Solo el desplegable, no la pantalla entera.
    return refrescarCombo(e.target.id, campo2, listaDeCampo(campo2),
                          e.target.value, ctx2, campo2 === 'formaPago');
  }
  var cb = e.target.getAttribute && e.target.getAttribute('data-combo');
  if (cb && S.combo !== cb) { S.combo = cb; pintar(); }
});

      S.gen.hecho = 'Se creó la pestaña «Empresas» con ' + n + ' empresas.';
      // Si el buyer o el seller ya tenían algo en la base, se trae.
      ['buyer', 'seller'].forEach(function (k) {
        var e = datosEmpresa(S.gen[k].nombre);
        if (e.direccion || e.vat) S.gen[k] = e;
      });
      pintar();
    }).catch(function (e) { S.gen.creandoBase = false; S.gen.error = e.message; pintar(); });
  }
  if (act === 'genpdf') return generarPdf();
  if (act === 'calendario') {
    var idTxt = el.getAttribute('data-p');
    var nativo = document.getElementById(idTxt + '-cal');
    var visible = document.getElementById(idTxt);
    if (nativo) {
      if (visible) nativo.value = aISO(visible.value);
      try {
        if (nativo.showPicker) nativo.showPicker();
        else { nativo.focus(); nativo.click(); }
      } catch (er) { nativo.focus(); }
    }
    return;
  }
  if (act === 'advpeter') { S.advicePeter = !S.advicePeter; return pintar(); }
  if (act === 'permiso-gmail') {
    S.faltaGmail = false; S.token = null;
    return pedirToken(true).then(function () { S.adviceMsg = null; pintar(); })
      .catch(function (e) { S.error = e.message; pintar(); });
  }
  if (act === 'fsug') { S.soloSug = !S.soloSug; return pintar(); }
  if (act === 'altaemb') {
    var hoyE = new Date();
    S.altaEmb = { tab: S.filtroTab || (S.fuentes[0] && S.fuentes[0].tab) || '' };
    S.altaEmbError = null; S.combo = null;
    return pintar();
  }
  if (act === 'altaemb-cerrar') { S.altaEmb = null; S.altaEmbError = null; return pintar(); }
  if (act === 'altaemb-tab') { S.altaEmb.tab = el.getAttribute('data-t'); return pintar(); }
  if (act === 'altaemb-guardar') return crearEmbarque();
  if (act === 'marcarsug') {
    S.marcados = S.marcados || {};
    var evsSug = sugeridos(evaluarTodo().filter(function (x) {
      return (!S.filtroTab || x.emb._tab === S.filtroTab);
    }));
    // Solo los que combinan entre sí: mismo BL, buque y fechas.
    if (evsSug.length) {
      var base = evsSug[0].emb;
      var f = function (d) { return esFecha(d) ? d.getTime() : String(d || ''); };
      evsSug.forEach(function (x) {
        var o = x.emb;
        if (clave(o.bl) === clave(base.bl) && clave(o.vessel) === clave(base.vessel) &&
            f(o.etd) === f(base.etd) && f(o.eta) === f(base.eta)) S.marcados[o._id] = true;
      });
      S.adviceTo = null;
    }
    return pintar();
  }
  if (act === 'ctrabrir') {
    var kctr = el.getAttribute('data-k');
    var ref0 = S.ctrEditables.get(kctr);
    if (!ref0) return;
    var orig = {};
    Object.keys(ref0.mapa).forEach(function (campo) {
      var raw = ref0.celdas[ref0.mapa[campo]];
      if (campo === 'fecha') {
        var d0 = normFecha(raw);
        orig[campo] = esFecha(d0)
          ? d0.getUTCFullYear() + '-' + String(d0.getUTCMonth() + 1).padStart(2, '0') +
            '-' + String(d0.getUTCDate()).padStart(2, '0')
          : (raw == null ? '' : String(raw));
      } else {
        orig[campo] = raw == null ? '' : String(raw);
      }
    });
    S.editCtr = { contrato: kctr, orig: orig, cambios: {} };
    S.animarPanel = true; S.confirmCerrar = false;
    S.editCtrError = null; S.combo = null;
    S.topeContratos = 8;
    return pintar();
  }
  if (act === 'ctrcerrar') {
    var hay = S.editCtr && Object.keys(S.editCtr.cambios).length;
    if (hay && !S.confirmCerrar) { S.confirmCerrar = true; return pintar(); }
    if (hay) return;   // ya se está preguntando
    S.editCtr = null; S.combo = null; S.topeContratos = 40; S.confirmCerrar = false;
    return pintar();
  }
  if (act === 'ctrdescartar') {
    S.editCtr = null; S.combo = null; S.topeContratos = 40; S.confirmCerrar = false;
    return pintar();
  }
  if (act === 'ctrseguir') { S.confirmCerrar = false; return pintar(); }
  if (act === 'ctrguardarcerrar') { S.confirmCerrar = false; return guardarContrato(); }
  if (act === 'ctrguardar') return guardarContrato();
  if (act === 'combosel2') {
    var par = el.getAttribute('data-c').split(':');
    var valor = el.getAttribute('data-v');
    if (par[0] === 'ctr' && S.editCtr) S.editCtr.cambios[par[1]] = valor;
    else if (par[0] === 'gen' && S.gen) {
      ponerRuta(S.gen, par[1], valor);
      // Elegida una empresa, se traen sus datos de la base.
      var m = par[1].match(/^(buyer|seller|cons|notif)\.nombre$/);
      if (m) S.gen[m[1]] = datosEmpresa(valor);
    }
    else if (par[0] === 'emb' && S.altaEmb) {
      S.altaEmb[par[1]] = valor;
      if (par[1] === 'contract') aplicarContrato(valor);
    }
    else { S.alta = S.alta || {}; S.alta[par[1]] = valor; }
    S.combo = null;
    return pintar();
  }

  if (act === 'usarnum') {
    S.alta = S.alta || {};
    S.alta.contrato = el.getAttribute('data-v');
    return pintar();
  }

  if (act === 'altacerrar') { S.alta = null; S.altaError = null; S.topeContratos = 40; return pintar(); }
  if (act === 'altaguardar') return guardarAlta();
  if (act === 'ctrvia') {
    if (!S.editCtr) return;
    var vNueva = VIA_TXT[el.getAttribute('data-v')];
    if (normVia(vNueva) === normVia(S.editCtr.orig.via)) delete S.editCtr.cambios.via;
    else S.editCtr.cambios.via = vNueva;
    return pintar();
  }
  if (act === 'altavia') { S.alta = S.alta || {}; S.alta.via = el.getAttribute('data-v'); return pintar(); }
  if (act === 'prodmas') {
    S.alta = S.alta || {};
    var nP = (S.alta.nProd || 1);
    // El nuevo hereda tipo y packaging del anterior: casi siempre coinciden.
    var ant = function (c) { return nP - 1 === 0 ? c : c + '_' + (nP - 1); };
    S.alta['tipo_' + nP] = S.alta[ant('tipo')] || '';
    S.alta['packaging_' + nP] = S.alta[ant('packaging')] || '';
    S.alta.nProd = nP + 1;
    return pintar();
  }
  if (act === 'prodquitar') {
    var iq = parseInt(el.getAttribute('data-i'), 10);
    var nQ = S.alta.nProd || 1;
    // Correr los de abajo un lugar para arriba.
    for (var j = iq; j < nQ - 1; j++) {
      ['producto', 'tipo', 'toneladas', 'precio', 'packaging'].forEach(function (c) {
        S.alta[c + '_' + j] = S.alta[c + '_' + (j + 1)];
      });
    }
    ['producto', 'tipo', 'toneladas', 'precio', 'packaging'].forEach(function (c) {
      delete S.alta[c + '_' + (nQ - 1)];
    });
    S.alta.nProd = nQ - 1;
    return pintar();
  }

  if (act === 'masctr') { S.topeContratos = (S.topeContratos || 40) + 40; return pintar(); }
  if (act === 'fcontrato') {
    S.fContrato = el.getAttribute('data-c') || '';
    S.topeContratos = 40;
    return pintar();
  }
  if (act === 'fetapa') {
    S.filtroEtapa = el.getAttribute('data-e') || '';
    return pintar();
  }
  if (act === 'fnivel') {
    var n = el.getAttribute('data-n');
    S.filtroNivel = S.filtroNivel === n ? '' : n;
    return pintar();
  }
  if (act === 'recargar') return cargarTodo();
  if (act === 'cerrar') { S.sel = null; return pintar(); }

  if (act === 'aplicarcfg') {
    var ta = document.getElementById('pegarcfg');
    var obj = aplicarCodigo(ta ? ta.value : '');
    if (!obj) { S.pegadoMsg = 'Ese código no se entiende. Copialo completo.'; return pintar(); }
    S.cfg = Object.assign({}, S.cfg || {}, obj);
    guardarCfg();
    S.pegadoMsg = 'Listo, configuración cargada. Guardá para entrar.';
    S.pestanas = null; S.pegado = '';
    return pintar();
  }

  if (act === 'copiarcfg') {
    var cual = el.getAttribute('data-q') || 'linkcfg';
    var inp = document.getElementById(cual);
    if (inp) {
      inp.select();
      try { document.execCommand('copy'); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText(inp.value).catch(function () {});
    }
    S.copiado = cual;
    pintar();
    setTimeout(function () { S.copiado = false; pintar(); }, 2200);
    return;
  }

  if (act === 'cfg-cancelar') {
    S.pestanas = null; S.error = null; S.pantalla = 'app';
    return pintar();
  }

  // Abrir la configuración NO borra nada: se precarga lo guardado y se puede
  // cancelar. Antes este botón reseteaba la config y había que rehacerla.
  if (act === 'pestanas' || act === 'salir') {
    S.pestanas = null; S.error = null;
    S.setup = {
      entrada: S.cfg.sheetId,
      tabsEmb: (S.cfg.tabsEmb || []).slice(),
      tabsCtr: (S.cfg.tabsCtr || []).slice(),
      tabsFact: (S.cfg.tabsFact || []).slice(),
      tabsCtrEdit: (S.cfg.tabsCtrEdit || []).slice(),
      tabAlta: S.cfg.tabAlta || '', tabDB: S.cfg.tabDB || '',
      paisSheet: S.cfg.paisSheetId || '', tabPaisCli: S.cfg.tabPaisCli || '',
      tabPaisPro: S.cfg.tabPaisPro || '',
      buscando: false, entrando: false, soloPestanas: true
    };
    S.pantalla = 'setup';
    pintar();
    return buscarPlanilla();
  }


  if (act === 'menusem') {
    ev.stopPropagation();
    var mid = el.getAttribute('data-f'), mc = el.getAttribute('data-c');
    S.menuSem = (S.menuSem && S.menuSem.id === mid && S.menuSem.campo === mc)
      ? null : { id: mid, campo: mc };
    return pintar();
  }

  if (act === 'setsem') {
    ev.stopPropagation();
    var sid = el.getAttribute('data-f'), sc = el.getAttribute('data-c'),
        sv = el.getAttribute('data-v');
    S.menuSem = null;
    var actual = filaPorId(sid);
    if (actual && (actual[sc] || 'vacio') === sv) return pintar();  // sin cambios
    return aplicarCambio(sid, sc, sv);
  }


  if (act === 'abrir') {
    var nuevoSel = el.getAttribute('data-f');
    if (nuevoSel !== S.sel) S.animarPanel = true;
    if (nuevoSel !== S.sel) { S.adviceTo = null; S.adviceFilas = {}; S.adviceMsg = null; }
    S.sel = nuevoSel;
    return pintar();
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'busca-fact') { S.buscaFact = e.target.value; S.topeFact = 25; pintar(); return; }
  if (e.target.id === 'busca-cargas' || e.target.id === 'busca-ctr') {
    S.busca = e.target.value; pintar();
  }
  if (e.target.id === 'nuevo-com') S.borrador = e.target.value;   // sin redibujar
  if (e.target.id === 'pegarcfg') { S.pegado = e.target.value; return; }
  if (e.target.getAttribute && e.target.getAttribute('data-advto')) { S.adviceTo = e.target.value; return; }
  if (e.target.id === 'psheet') { S.setup.paisSheet = e.target.value; return; }
  if (e.target.id === 'pcli') { S.setup.tabPaisCli = e.target.value; return; }
  if (e.target.id === 'ppro') { S.setup.tabPaisPro = e.target.value; return; }
  // Fechas: se formatean en el propio input, sin redibujar, para no perder el
  // foco justo cuando se está escribiendo el año.
  if (e.target.classList && e.target.classList.contains('f-txt')) {
    var borrando = e.inputType === 'deleteContentBackward' ||
                   e.inputType === 'deleteContentForward';
    var antes = e.target.value;
    var fmt = formatearFecha(antes, borrando);
    if (fmt !== antes) {
      var fin = e.target.selectionStart === antes.length;
      e.target.value = fmt;
      if (fin) { try { e.target.setSelectionRange(fmt.length, fmt.length); } catch (er) {} }
    }
    var nat = document.getElementById(e.target.id + '-cal');
    if (nat) nat.value = aISO(fmt);

    var cF = e.target.getAttribute('data-aemb');
    if (cF && S.altaEmb) { S.altaEmb[cF] = fmt; return; }
    var cA = e.target.getAttribute('data-alta');
    if (cA) { S.alta = S.alta || {}; S.alta[cA] = fmt; return; }
    var cG = e.target.getAttribute('data-gen');
    if (cG && S.gen) { S.gen[cG] = fmt; return; }
    var cE = e.target.getAttribute('data-ectr');
    if (cE && S.editCtr) { S.editCtr.cambios[cE] = fmt; return; }
    return;   // el panel guarda al salir del campo, no en cada tecla
  }

  var ae = e.target.getAttribute && e.target.getAttribute('data-aemb');
  if (ae && S.altaEmb) { S.altaEmb[ae] = e.target.value; return; }
  var gp = e.target.getAttribute && e.target.getAttribute('data-gen');
  if (gp && S.gen && !e.target.classList.contains('f-txt')) {
    ponerRuta(S.gen, gp, e.target.value);
    if (gp.indexOf('productos.') === 0) refrescarTotalesGen();
    return;
  }
  var pc = e.target.getAttribute && e.target.getAttribute('data-prodctr');
  if (pc && S.editCtr) { S.editCtr.cambios['prod_' + pc] = e.target.value; refrescarBarraCtr(); return; }
  var ec = e.target.getAttribute && e.target.getAttribute('data-ectr');
  if (ec && S.editCtr) { S.editCtr.cambios[ec] = e.target.value; refrescarBarraCtr(); return; }
  var cb2 = e.target.getAttribute && e.target.getAttribute('data-combo2');
  if (cb2) {
    var p2 = cb2.split(':'), ctx2 = p2[0], campo2 = p2[1];
    if (ctx2 === 'ctr' && S.editCtr) S.editCtr.cambios[campo2] = e.target.value;
    else if (ctx2 === 'gen' && S.gen) ponerRuta(S.gen, campo2, e.target.value);
    else if (ctx2 === 'emb' && S.altaEmb) S.altaEmb[campo2] = e.target.value;
    else { S.alta = S.alta || {}; S.alta[campo2] = e.target.value; }
    S.combo = cb2;
    // Solo el desplegable, no la pantalla entera.
    return refrescarCombo(e.target.id, campo2, listaDeCampo(campo2),
                          e.target.value, ctx2, campo2 === 'formaPago');
  }
  var cb = e.target.getAttribute && e.target.getAttribute('data-combo');
  if (cb) {
    S.alta = S.alta || {};
    S.alta[cb] = e.target.value;
    S.combo = cb;
    return pintar();
  }
  var al = e.target.getAttribute && e.target.getAttribute('data-alta');
  if (al && e.target.tagName === 'INPUT') { S.alta = S.alta || {}; S.alta[al] = e.target.value; }
  var fc = e.target.getAttribute && e.target.getAttribute('data-fcol');
  if (fc && e.target.tagName === 'INPUT') { S.fCol[fc] = e.target.value; pintar(); }
  if (e.target.id === 'cid' || e.target.id === 'url') S.setup.entrada = e.target.value;
});

document.addEventListener('change', function (e) {
  if (e.target.id === 'ftab') { S.filtroTab = e.target.value; return pintar(); }
  if (e.target.id === 'orden') { S.orden = e.target.value; return pintar(); }
  if (e.target.id === 'talta') { S.setup.tabAlta = e.target.value; return; }
  if (e.target.id === 'tdb') { S.setup.tabDB = e.target.value; return; }
  if (e.target.id === 'fcbte') { S.f.cbte = e.target.value; return pintar(); }
  if (e.target.id === 'ffact') { S.f.fact = e.target.value; return pintar(); }
  if (e.target.id === 'ffalta') { S.f.falta = e.target.value; return pintar(); }
  var alS = e.target.getAttribute && e.target.getAttribute('data-alta');
  if (alS) { S.alta = S.alta || {}; S.alta[alS] = e.target.value; return pintar(); }
  var fcs = e.target.getAttribute && e.target.getAttribute('data-fcol');
  if (fcs && e.target.tagName === 'SELECT') { S.fCol[fcs] = e.target.value; return pintar(); }
  var gd = e.target.getAttribute && e.target.getAttribute('data-gendoc');
  if (gd !== null && gd !== undefined && gd !== '' && S.gen) {
    S.gen.docs[+gd].on = e.target.checked;
    var caja = e.target.closest ? e.target.closest('.chk-caja') : null;
    if (caja) caja.classList.toggle('on', e.target.checked);
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute('data-genbase')) {
    S.gen.guardarBase = e.target.checked; return;
  }
  if (e.target.getAttribute && e.target.getAttribute('data-ordenctr')) {
    S.ordenCtr = e.target.value; S.topeContratos = 40; return pintar();
  }
  if (e.target.getAttribute && e.target.getAttribute('data-entiendo')) {
    S.entiendo = e.target.checked; return pintar();
  }
  if (e.target.getAttribute && e.target.getAttribute('data-avisar')) {
    S.avisarPia = e.target.checked; return pintar();
  }
  var mk = e.target.getAttribute && e.target.getAttribute('data-marcar');
  if (mk) {
    S.marcados = S.marcados || {};
    if (e.target.checked) {
      // Al marcar el primero, el destinatario sale de esa fila.
      if (!Object.keys(S.marcados).length) S.adviceTo = null;
      S.marcados[mk] = true;
    } else delete S.marcados[mk];
    S.adviceMsg = null;
    return pintar();
  }
  var af = e.target.getAttribute && e.target.getAttribute('data-advfila');
  if (af) {
    S.adviceFilas = S.adviceFilas || {};
    if (e.target.checked) S.adviceFilas[af] = true; else delete S.adviceFilas[af];
    return pintar();
  }
  var col = e.target.getAttribute && e.target.getAttribute('data-col');
  if (col) {
    if (e.target.checked) delete S.colsOcultas[col]; else S.colsOcultas[col] = true;
    return pintar();
  }
  var fe = e.target.getAttribute && e.target.getAttribute('data-festado');
  if (fe) { S.f[fe] = e.target.value; return pintar(); }
  var cbte = e.target.getAttribute && e.target.getAttribute('data-cbte');
  if (cbte) return aplicarCambio(cbte, '_faltaComprobante', e.target.checked);
  var g = e.target.getAttribute && e.target.getAttribute('data-grupo');
  if (!g) return;
  var lista = g === 'emb' ? S.setup.tabsEmb : S.setup.tabsCtr;
  var i = lista.indexOf(e.target.value);
  if (e.target.checked && i < 0) lista.push(e.target.value);
  if (!e.target.checked && i >= 0) lista.splice(i, 1);
});

document.addEventListener('change', function (e) {
  // El calendario nativo devuelve AAAA-MM-DD: se pasa al campo visible.
  var destinoCal = e.target.getAttribute && e.target.getAttribute('data-parafecha');
  if (destinoCal) {
    var txtIn = document.getElementById(destinoCal);
    var comoTxt = aTextoFecha(e.target.value);
    if (txtIn) {
      txtIn.value = comoTxt;
      var c1 = txtIn.getAttribute('data-aemb');
      if (c1 && S.altaEmb) { S.altaEmb[c1] = comoTxt; return; }
      var c1b = txtIn.getAttribute('data-alta');
      if (c1b) { S.alta = S.alta || {}; S.alta[c1b] = comoTxt; return; }
      var c1g = txtIn.getAttribute('data-gen');
      if (c1g && S.gen) { S.gen[c1g] = comoTxt; return; }
      var c2 = txtIn.getAttribute('data-ectr');
      if (c2 && S.editCtr) { S.editCtr.cambios[c2] = comoTxt; return pintar(); }
      var c3 = txtIn.getAttribute('data-fecha');
      if (c3) return guardarFechaPanel(txtIn, c3, comoTxt);
    }
    return;
  }

  // Fecha escrita a mano: se guarda al salir del campo.
  if (e.target.classList && e.target.classList.contains('f-txt')) {
    var cp = e.target.getAttribute('data-fecha');
    if (cp) return guardarFechaPanel(e.target, cp, e.target.value);
    return;
  }

  var aed = e.target.getAttribute && e.target.getAttribute('data-aemb');
  if (aed && S.altaEmb) { S.altaEmb[aed] = e.target.value; return pintar(); }
  var ecd = e.target.getAttribute && e.target.getAttribute('data-ectr');
  if (ecd && S.editCtr) { S.editCtr.cambios[ecd] = e.target.value; return pintar(); }
  var cn = e.target.getAttribute && e.target.getAttribute('data-num');
  if (cn) {
    var idn2 = e.target.getAttribute('data-f');
    var fn = filaPorId(idn2);
    if (!fn) return;
    var nuevo = e.target.value === '' ? '' : parseFloat(e.target.value);
    if (nuevo !== '' && isNaN(nuevo)) return;
    if (String(nuevo) === String(fn[cn] === null || fn[cn] === undefined ? '' : fn[cn])) return;
    return aplicarCambio(idn2, cn, nuevo);
  }

  var cf = e.target.getAttribute && e.target.getAttribute('data-fecha');
  if (!cf) return;
  var idf = e.target.getAttribute('data-f');
  var ff = filaPorId(idf);
  if (!ff) return;
  var actualISO = esFecha(ff[cf])
    ? ff[cf].getUTCFullYear() + '-' +
      String(ff[cf].getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(ff[cf].getUTCDate()).padStart(2, '0')
    : '';
  if (e.target.value !== actualISO) aplicarCambio(idf, cf, e.target.value);
}, true);

document.addEventListener('blur', function (e) {
  var nota = e.target.getAttribute && e.target.getAttribute('data-nota');
  if (nota) {
    var idn = e.target.getAttribute('data-f');
    var fn = filaPorId(idn);
    if (fn && e.target.value !== ((fn._notas && fn._notas[nota]) || '')) {
      aplicarNota(idn, nota, e.target.value);
    }
    return;
  }
  var campo = e.target.getAttribute && e.target.getAttribute('data-edit');
  if (!campo) return;
  var id = e.target.getAttribute('data-f');
  var f = filaPorId(id);
  var actual = f ? f[campo] : '';
  var actualTxt = actual instanceof Date ? fmtFecha(actual) : (actual || '');
  if (e.target.value !== actualTxt) aplicarCambio(id, campo, e.target.value);
}, true);

document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList &&
      e.target.classList.contains('emb')) {
    e.preventDefault();
    S.sel = e.target.getAttribute('data-f');
    return pintar();
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'nuevo-com') {
    e.preventDefault();
    return comentar(e.target.getAttribute('data-com'), e.target.value);
  }
  if (e.key === 'Escape' && S.combo) { S.combo = null; return pintar(); }
  if (e.key === 'Escape' && S.menuSem) { S.menuSem = null; return pintar(); }
  if (e.key === 'Escape' && S.sel !== null) { S.sel = null; pintar(); }
  if (e.key === 'Escape' && S.gen) { S.gen = null; return pintar(); }
  // Escape en el editor de contratos: misma pregunta que al cerrar.
  if (e.key === 'Escape' && S.editCtr) {
    if (S.confirmCerrar) { S.confirmCerrar = false; return pintar(); }
    if (Object.keys(S.editCtr.cambios).length) { S.confirmCerrar = true; return pintar(); }
    S.editCtr = null; return pintar();
  }
  if (e.key === 'Enter' && (e.target.id === 'cid' || e.target.id === 'url')) {
    var b = document.querySelector('[data-act="' + (e.target.id === 'cid' ? 'set-cid' : 'buscar') + '"]');
    if (b) b.click();
  }
});

async function buscarPlanilla() {
  var id = extraerId(document.getElementById('url').value);
  if (!id) { S.error = 'No reconozco eso como un id ni una URL de Google Sheets.'; return pintar(); }
  S.error = null; S.setup.buscando = true; pintar();
  try {
    S.cfg.sheetId = id;
    var d = await listarPestanas(id);
    S.pestanas = d;
    // Adivina cuál es cuál para no hacer elegir a mano si es obvio.
    var buscar = function () {
      var t = Array.prototype.slice.call(arguments);
      var p = d.pestanas.filter(function (x) {
        return t.some(function (k) { return clave(x.nombre).indexOf(k) >= 0; });
      })[0];
      return p ? p.nombre : '';
    };
    if (S.setup.soloPestanas) return;   // Ya venían elegidas, no pisar.

    // Preselección: todo lo que parezca embarques o contratos.
    var todas = function () {
      var t = Array.prototype.slice.call(arguments);
      return d.pestanas.filter(function (x) {
        return t.some(function (k) { return clave(x.nombre).indexOf(k) >= 0; });
      }).map(function (x) { return x.nombre; });
    };
    S.setup.tabsEmb = todas('embarque', 'carga');
    // "ALL CONTRATOS" tiene abiertos y cerrados juntos, más entregado, saldo y
    // período de embarque. Si existe, se prefiere sobre las dos por separado.
    var all = todas('all contratos');
    S.setup.tabsCtr = all.length ? all : todas('contratos abiertos', 'contratos cerrados');
    S.setup.tabsFact = todas('a facturar', 'facturar');
    S.setup.tabsCtrEdit = todas('contratos abiertos', 'contratos cerrados');
    S.setup.tabAlta = (todas('contratos abiertos')[0]) || '';
    S.setup.tabDB = (todas('import_db', 'import db', 'database')[0]) || '';
    // Que "a facturar" no quede también como pestaña de embarques.
    S.setup.tabsEmb = S.setup.tabsEmb.filter(function (n) {
      return S.setup.tabsFact.indexOf(n) < 0;
    });
  } catch (e) {
    S.pestanas = null;
    S.error = e.message;
  } finally {
    S.setup.buscando = false;
    pintar();
  }
}

/* --- Arranque -------------------------------------------------------------- */

function arrancar() {
  // Config compartida por enlace: se toma una vez y queda guardada, así el
  // resto del equipo no repite el alta.
  var deEnlace = leerConfigDeEnlace();
  if (deEnlace) {
    S.cfg = Object.assign({}, S.cfg || {}, deEnlace);
    guardarCfg();
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    S.avisoOk = 'Configuración recibida' +
      (deEnlace.titulo ? ' para «' + deEnlace.titulo + '»' : '') + '. Entrá con tu cuenta.';
  }

  // OAuth necesita un origen http(s). Abierto con doble clic (file://) no anda,
  // y el error de Google en ese caso no explica nada.
  if (location.protocol === 'file:') {
    document.getElementById('root').innerHTML =
      '<div class="setup"><div class="error">Estás abriendo el archivo directo desde el disco ' +
      '(<code>file://</code>). Google no permite el login así. Subilo a Netlify o GitHub Pages, ' +
      'o levantá un servidor local con <code>npx serve</code>.</div></div>';
    return;
  }

  // Nunca pedimos el token solo: el popup de Google se bloquea si no sale de un
  // clic. Al recargar mostramos el paso de login y desde ahí sigue solo.
  S.pantalla = 'setup';
  pintar();
}

// Esperar a que cargue la librería de Google antes de dibujar.
(function esperar(intentos) {
  if (window.google && google.accounts && google.accounts.oauth2) return arrancar();
  if (intentos <= 0) {
    document.getElementById('root').innerHTML =
      '<div class="setup"><div class="error">No cargó la librería de Google. ' +
      'Revisá la conexión o si hay un bloqueador de scripts, y recargá.</div></div>';
    return;
  }
  setTimeout(function () { esperar(intentos - 1); }, 100);
})(60);
</script>
